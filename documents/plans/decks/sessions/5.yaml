      - {path: packages/core/src/decks/editor/deckHistory.ts, signature: "export function createDeckHistory(initial: DeckSnapshot, limit?: number): DeckHistory"}
    decided:
      - "Do not run pnpm gate or any lint; check only with node scripts/agents/run.mjs typecheck core and the tests.command. Tests are hidden; never edit them."
      - "Runtime-neutral and pure (no DOM, no clock). Each new file starts with a one-line `// <capability>` header and stays under 400 lines."
      - "snapDeckRect: disabled gives the rect with each value rounded to 2 decimals and no guides. Otherwise per axis independently, threshold t = 6 / scale slide px. Moving edges: for move the left, centre and right (x) and top, middle and bottom (y); for resize only the edges its handle moves (e, w, n, s letters). Targets in order: slide start 0, slide centre, slide end, then for each other rect (in the given order) its start, centre and end. The pair (moving edge, target) with the smallest distance ≤ t wins (ties: earlier target, then earlier moving edge); the rect shifts (move) or the moved edge goes (resize) to the target, and a guide is added: axis x at the target x spanning in y from the smaller to the larger of the rects' tops and bottoms (0 to canvas height for slide targets), likewise for y. An axis with no target within t snaps to the 8 px grid: for move the start edge (left or top) is rounded to the nearest multiple of 8; for resize the moved edge is; no guide. Resize keeps width and height at least 8 px."
      - "selectBlock: null clears blocks; additive toggles block in the list; otherwise blocks becomes [block]. slide is kept."
      - "gestureRect: pointer and origin are screen px; delta = (pointer - origin) / scale slide px. move shifts start by delta; resize moves the edges of handle (n top, s bottom, e right, w left; corners two edges); then snapDeckRect with moving \"move\" or the handle. gestureEdit gives {kind: move, block, left, top} for a move whose rect differs from start, {kind: resize, block, left, top, width, height} for a resize that differs, and null when nothing changed. nudgeEdit gives a move by dx, dy."
      - "createDeckHistory: limit default 100 snapshots; push of a snapshot equal to current is ignored; push clears redo; undo and redo move current and return it (undefined when there is nothing); reset clears both stacks with a new current; past the limit the oldest is dropped."
    acceptance:
