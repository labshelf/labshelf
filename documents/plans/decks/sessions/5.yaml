      - "blocks() gives the current slide's model blocks with a rect, in source order. leaves() gives, for each model block of the slide, the elements in contentDocument matching that block's model leaves in order (index is the leaf index in DeckBlock.leaves). setSlide and update rebuild the srcdoc and resolve after the next ready; destroy removes the iframe."
