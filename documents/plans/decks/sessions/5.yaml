      - {id: 5.2b, check: "resize from each of the eight handles moves only its edges, snaps the moved edges and keeps 8 px minimum size"}
      - {id: 5.2c, check: "gestureRect and gestureEdit give the move or resize DeckEdit on release, null for no change; nudgeEdit moves by 1 or 10 px"}
      - {id: 5.2d, check: "createDeckHistory undo, redo, push clearing redo, equal-push ignored, limit and reset"}
      - {id: 5.2e, check: "selectBlock replaces, toggles additively and clears"}
