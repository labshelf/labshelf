    decided:
      - "Do not run pnpm gate or any lint; check only with node scripts/agents/run.mjs typecheck core and the tests.command. Tests are hidden; never edit them."
      - "openDeckEditor.ts stays under 400 lines: stage, overlay, text editing and keyboard may move into private files of decks/dom/ (for example deckStage.ts, deckOverlay.ts, leafEditing.ts) not exported from the barrel. Each new file starts with a one-line `// <capability>` header. No MathJax import. Chrome elements are made with renderElement and class names; no markup carries a style attribute; geometry and the drag transform are set only through element.style (CSSOM). Classes are prefixed `deck-editor`."
      - "Layout: host gets a root `.deck-editor` with a toolbar (role toolbar, aria-label `Deck`), a stage holding the frame (mountDeckFrame) and an overlay layer, and a status line. scale = stage clientWidth / canvas width when positive, else 1. Each block with a rect has an overlay box (role button, aria-label `Block <id>`); the selected box has eight handles (aria-label `Resize <handle>`)."
      - "Pointer: pointerdown on a box selects it (Shift adds) and starts a gesture (setPointerCapture); pointermove sets only a CSS translate/scale transform on the box and on the frame's block element from gestureRect (snapping on, Alt held turns it off; guides drawn as overlay lines with class deck-editor-guide); pointerup removes the transforms and applies gestureEdit with applyDeckEdit as one change. Toolbar buttons: Undo, Redo, Delete block (aria-labels), disabled when not applicable."
      - "Text: double-click on a block (or Enter with one block selected) puts contenteditable=\"true\" on its first leaf element in the frame (the double-clicked leaf when the target is one) and focuses it; blur, Enter without Shift, or clicking elsewhere commits setText of that leaf with its text (text nodes, br as \\n, math leaves skipped); Escape restores the text and commits nothing. An unchanged text commits nothing."
      - "Keyboard on the stage (no leaf editing): arrows nudge the selected blocks 1 px, Shift 10 px (one change per key press); Delete and Backspace delete the selected blocks (one change); Escape clears selection; Mod+Z undo, Mod+Shift+Z and Mod+Y redo (Mod is Meta on macOS, else Ctrl); PageDown and PageUp change slide."
      - "Changes: every applied gesture calls onChange({html, theme, label}) once with labels `Move block`, `Resize block`, `Edit text`, `Delete block`, then re-renders the frame through update. history internal: a createDeckHistory snapshot per change; undo/redo restore a snapshot, re-render and call onChange with label `Undo` or `Redo`. history host: no internal stack; undo and redo (buttons, keys, controller) call onUndo and onRedo, and the host answers with setDocument."
      - "setDocument(html, theme) re-parses and re-renders, keeping slide and selection when the slide and blocks still exist, without calling onChange. When validateDeck(html, {theme}) has errors the editor is read-only: no overlay boxes, no contenteditable, edits and keys ignored, and a list (role list, aria-label `Deck problems`) shows each error as `<code> line <line>: <message>`; the status says `This deck has errors and opens read-only.`; a later valid setDocument leaves read-only."
      - "deck-editor.css uses only tokens from tokens.css; the drag transform, handle size and guides are styled there; no colour carries a state alone."
    acceptance:
      - {id: 5.3a, check: "the editor mounts a toolbar, a frame and one overlay box per block with accessible names; no element has a style attribute before a gesture"}
      - {id: 5.3b, check: "a drag sets only a transform until pointerup, then onChange gets one Move block change whose html moves the block; resize from a handle gives one Resize block change"}
      - {id: 5.3c, check: "double-click edits a leaf in place; Enter or blur commits Edit text; Escape cancels"}
      - {id: 5.3d, check: "arrows nudge 1 px, Shift+arrows 10 px, Delete removes the block, Mod+Z and Mod+Shift+Z undo and redo with internal history; history host calls onUndo and onRedo instead"}
      - {id: 5.3e, check: "an invalid deck opens read-only with its diagnostics list and no editing; setDocument with a valid deck leaves read-only"}
      - {id: 5.3f, check: "package.json exports ./deckEditor and ./styles/deck-editor.css; loadDeckEditor resolves to the module with openDeckEditor"}
