      - {path: packages/browser/src/libraryUi/editorArea/deckTab.ts, signature: "export function isDeckPath(path: string): boolean"}
      - {path: packages/browser/src/libraryUi/editorArea/deckAssets.ts, signature: "export interface DeckAssetResolver { resolveAsset(path: string): Promise<string>; original(path: string): Promise<Uint8Array | undefined>; dispose(): void }"}
      - {path: packages/browser/src/libraryUi/editorArea/deckAssets.ts, signature: "export function createDeckAssetResolver(fs: LibraryFileSystem, deckFolder: string, ports: { downscale: (bytes: Uint8Array, mime: string, maxSide: number) => Promise<Blob>; createObjectURL: (blob: Blob) => string; revokeObjectURL: (url: string) => void }): DeckAssetResolver"}
      - {path: packages/browser/src/platform/deckCalibration.ts, signature: "export function createStorageCalibrationStore(storage: { get(key: string): Promise<Record<string, unknown>>; set(items: Record<string, unknown>): Promise<void> }): CalibrationStore"}
    decided:
      - "Do not run pnpm gate or any lint; check only with node scripts/agents/run.mjs typecheck browser, node scripts/agents/run.mjs typecheck core and the tests.command. Tests are hidden; never edit them."
      - "No new dependency, no manifest change. deckTab.ts is a lazy chunk (dynamic import from tabKinds.ts); TabContext and TabBody are the existing tab types of tabKinds.ts (use their names). Each new file has a `// <capability>` header and stays under 400 lines."
      - "isDeckPath: a project-relative path matching `^(talks|posters)/[^/]+/deck\\.html$`. The deck tab kind id is `deck` + URI-encoded params like the other kinds; view is edit (default), presenter, audience or poster; a missing or unknown view is edit."
      - "mountTab reads <path> and the sibling theme.css (missing theme gives '') through ctx.fs, then by view: edit mounts openDeckEditor (history internal) with onChange queued to a serial saver that writes deck.html and theme.css (only the files whose text changed) through ctx.fs, sets ctx.tab dirty while a write is pending and flushes on onBeforeClose; a failed write shows the existing toast with 'Could not save <file>'. Toolbar commands present and posterPreview open the same tab kind with view presenter or poster; present also opens a second browser tab of the library page with view audience (bx.tabs.create of the page URL with the tab in its hash). presenter and audience mount openPresenter with createBroadcastPresenterChannel(`labshelf-deck:<projectId>:<path>`); poster mounts openPosterPreview with createStorageCalibrationStore(bx.storage.local)."
      - "createDeckAssetResolver: paths resolve against deckFolder (library-relative, '/'-joined; a path leaving the folder rejects). Images (png, jpg, jpeg, gif, webp) go through downscale(bytes, mime, 1600) and createObjectURL; svg and other files become blob URLs of their own bytes with the mime of their extension. One URL per path is cached; dispose revokes all. original(path) returns the full bytes (used by export)."
      - "createStorageCalibrationStore keeps {pxPerMm, measuredAt} under key labshelf.decks.calibration in the given storage (bx.storage.local, never storage.sync); load ignores a value that is not a positive finite pxPerMm."
    acceptance:
