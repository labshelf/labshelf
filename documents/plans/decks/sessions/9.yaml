  - id: "9.2"
    plan: decks
    sha: 54b5c6f9
    goal: "LabShelf Helper answers a printPdf request (deck HTML as socket payload, PDF as reply payload) through the decks Chromium printer, announced by an optional ready capability, without a protocol version bump; the contract states it."
    level: contract
    runner: {agent: implementer, model: opus}
    depends_on: ["9.0"]
    create: [packages/core/src/helper/node/printHandlers.ts]
    edit:
      - {path: packages/core/src/helper/helperMessages.ts, lines: "10-109", why: "printPdf request, pdfPrinted and printFailed replies, optional ready.capabilities, MAX_PRINT_HTML_BYTES; PROTOCOL_VERSION unchanged"}
