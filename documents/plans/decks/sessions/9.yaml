      - {id: 9.1b, check: "the deck tab mounts the editor with the file texts, saves changed files serially through ctx.fs, marks the tab dirty while saving and flushes on close"}
      - {id: 9.1c, check: "the asset resolver downscales images to 1600 px proxies, caches one blob URL per path, refuses paths outside the deck folder and revokes on dispose"}
      - {id: 9.1d, check: "presenter and audience views share a BroadcastChannel named after the deck; the poster view keeps its calibration in storage.local under labshelf.decks.calibration"}
