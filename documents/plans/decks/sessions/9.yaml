      - "Do not run pnpm gate or any lint; check only with node scripts/agents/run.mjs typecheck core and the tests.command. Tests are hidden; never edit them."
      - "No new dependency. PROTOCOL_VERSION stays 11; HELPER_VERSION may change. HelperHandler is the existing handler type of node/helperHandlers.ts (use its name); ILatexHelper.printPdf is `printPdf(request: HelperPrintRequest, signal: AbortSignal): Promise<HelperPrintResult>`."
      - "Messages (socket only, never the native port): printPdf {type, id, size} with the HTML as the frame's binary payload (UTF-8); pdfPrinted {type, id, bytes} with the PDF as payload; printFailed {type, id, reason: noChromium | limit | failed, message}. MAX_PRINT_HTML_BYTES = 15 * 1024 * 1024 (under the 16 MiB socket message); a larger HTML is refused by the client before sending (reason limit, message 'The deck is too large to print through LabShelf Helper.') and by the handler. A PDF reply over MAX_SOCKET_MESSAGE_BYTES becomes printFailed limit. size is a data-deck-size string (parseDeckSize must accept it, else printFailed failed); the default print relies on the HTML's own @page rule and uses size only to validate. cancelPrint {type, id, requestId} (socket only) aborts the run started by the printPdf whose id is requestId; it is UNQUEUED like cancelCell, and an unknown requestId is ignored."
      - "ready gains optional `capabilities?: string[]` (strings kept, unknown entries kept, non-strings dropped, a non-array dropped); a ready without it means no capabilities, as ready.python is optional for older helpers. Every ready the Helper sends (answerHello, the post-installPython ready, the TeX install ready) carries capabilities [\"printPdf\"]. The ready HelperState gains optional `capabilities?: string[]`, set only when the ready has it (like python, so existing toEqual status tests stay unchanged), and helperCanPrintPdf is true only for a ready state whose capabilities include printPdf. A client whose helper lacks it resolves printPdf with {ok: false, reason: unsupported, message: 'Update LabShelf Helper to export PDFs.'} without sending."
      - "createPrintHandlers default print uses printDeckPdf with findChromium (findSystemChromium with a managed callback returning the createSharedChromiumProvider status().executable when installed; the Helper never calls install). On the client, aborting the signal sends cancelPrint for the request and resolves {ok: false, reason: cancelled, message: 'Cancelled.'} at once; in the handler the abort kills the run and replies printFailed failed 'Cancelled.' (which the client has stopped waiting for)."
      - "documents/contracts/helper.md #messages gains printPdf, cancelPrint, pdfPrinted, printFailed and ready.capabilities with the payload rule and limits; #version says new optional features are announced by ready.capabilities and do not bump the protocol."
