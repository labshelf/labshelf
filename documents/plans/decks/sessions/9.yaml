      - {path: packages/core/src/helper/helperPaths.ts, lines: "80-150", why: "ready HelperState gains capabilities; ILatexHelper gains printPdf"}
      - {path: packages/core/src/helper/helperClient.ts, lines: "1-231", why: "printPdf on the native helper session like runCell, HTML as frame payload, PDF from the reply payload; keep ready.capabilities in the state"}
      - {path: packages/core/src/helper/node/runHelperHost.ts, lines: "184-215", why: "register the printPdf handler and send capabilities [\"printPdf\"] in ready"}
      - {path: packages/core/src/helper/node/index.ts, lines: "1-30", why: "export createPrintHandlers"}
      - {path: packages/core/__tests__/helper/fakeHelperClient.ts, lines: "1-120", why: "the fake ILatexHelper gains printPdf (resolves a scripted result)"}
      - {path: documents/contracts/helper.md, lines: "1-200", why: "#messages: printPdf, pdfPrinted, printFailed and ready.capabilities; #version: a capability, not a version bump"}
    read:
      - {path: documents/plans/decks/plan.yaml, lines: "37-39", why: "D11 browser PDF through the Helper's printPdf, capability flag"}
      - {path: packages/core/src/helper/helperClient.ts, lines: "183-205", why: "runCell request/reply template"}
      - {path: packages/core/src/helper/node/runHelperHost.ts, lines: "28-75", why: "createCellHandlers handler shape"}
      - {path: packages/core/src/helper/node/helperBuild.ts, lines: "75-90", why: "16 MiB check turned into a limit error"}
      - {path: packages/core/src/helper/node/helperConnection.ts, lines: "14-60", why: "frame limits: socket 16 MiB, native port 4 MiB in and 1 MiB out"}
      - {path: packages/core/src/decks/node/printPdf.ts, lines: "1-200", why: "printDeckPdf and findChromium (4.1)"}
    seams:
      - {path: packages/core/src/helper/helperPaths.ts, signature: "export interface HelperPrintRequest { html: string; size: string }"}
      - {path: packages/core/src/helper/helperPaths.ts, signature: "export type HelperPrintResult = { ok: true; pdf: Uint8Array } | { ok: false; reason: \"noChromium\" | \"limit\" | \"failed\" | \"unsupported\" | \"cancelled\"; message: string }"}
      - {path: packages/core/src/helper/helperPaths.ts, signature: "export function helperCanPrintPdf(state: HelperState | undefined): boolean"}
      - {path: packages/core/src/helper/node/printHandlers.ts, signature: "export interface PrintHandlerDeps { print: (html: string, size: DeckSize, signal: AbortSignal) => Promise<Uint8Array | { error: \"noChromium\" | \"failed\"; message: string }> }"}
      - {path: packages/core/src/helper/node/printHandlers.ts, signature: "export function createPrintHandlers(deps?: Partial<PrintHandlerDeps>): Record<\"printPdf\", HelperHandler>"}
    decided:
      - "Do not run pnpm gate or any lint; check only with node scripts/agents/run.mjs typecheck core and the tests.command. Tests are hidden; never edit them."
      - "No new dependency. PROTOCOL_VERSION stays 10; HELPER_VERSION may change. HelperHandler is the existing handler type of runHelperHost.ts (use its name); ILatexHelper.printPdf is `printPdf(request: HelperPrintRequest, signal: AbortSignal): Promise<HelperPrintResult>`."
      - "Messages (socket only, never the native port): printPdf {type, id, size} with the HTML as the frame's binary payload (UTF-8); pdfPrinted {type, id, bytes} with the PDF as payload; printFailed {type, id, reason: noChromium | limit | failed, message}. MAX_PRINT_HTML_BYTES = 15 * 1024 * 1024 (under the 16 MiB socket message); a larger HTML is refused by the client before sending (reason limit, message 'The deck is too large to print through LabShelf Helper.') and by the handler. A PDF reply over MAX_SOCKET_MESSAGE_BYTES becomes printFailed limit. size is a data-deck-size string (parseDeckSize must accept it, else printFailed failed)."
      - "ready gains optional `capabilities?: string[]` (strings, unknown entries kept, a non-array dropped); a ready without it means no capabilities, as ready.python is optional for older helpers. runHelperHost sends capabilities [\"printPdf\"]. The ready HelperState carries capabilities (default []), and helperCanPrintPdf is true only for a ready state whose capabilities include printPdf. A client whose helper lacks it resolves printPdf with {ok: false, reason: unsupported, message: 'Update LabShelf Helper to export PDFs.'} without sending."
      - "createPrintHandlers default print uses printDeckPdf with findChromium (4.1; the managed chrome-headless-shell of 4.2 counts as found when installed; the Helper never downloads it). Aborting the signal (the page's cancel) kills the run and replies printFailed failed with message 'Cancelled.'; the client maps a cancel to reason cancelled."
      - "documents/contracts/helper.md #messages gains the three messages and ready.capabilities with the payload rule and limits; #version says new optional features are announced by ready.capabilities and do not bump the protocol."
    acceptance:
      - {id: 9.2a, check: "parse validators accept printPdf, pdfPrinted, printFailed and ready with and without capabilities, and reject malformed ones; PROTOCOL_VERSION is still 10"}
      - {id: 9.2b, check: "the client sends printPdf with the HTML as payload over the socket and resolves the PDF bytes from pdfPrinted, the failure from printFailed, and unsupported without a capability"}
      - {id: 9.2c, check: "the handler prints through the injected printer, replies noChromium when none is found, and refuses HTML over the limit"}
      - {id: 9.2d, check: "helperCanPrintPdf is true only for a ready helper announcing printPdf; runHelperHost announces it; the fake helper has printPdf"}
    tests:
      hidden: []
      command: "node scripts/agents/run.mjs test core --spec 9.2 --plan decks -- packages/core/__tests__/helper/node/printHandlers.test.ts packages/core/__tests__/helper/helperClient.test.ts"
    commands: ["node scripts/agents/run.mjs typecheck core", "node scripts/agents/run.mjs typecheck browser"]
    do_not_touch: [packages/core/src/qmd/]

