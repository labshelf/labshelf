      - {path: packages/browser/src/platform/bx.ts, signature: "export function openBlobTab(text: string, mime: string, fragment?: string): Promise<void>"}
      - {path: packages/browser/src/libraryUi/editorArea/deckExport.ts, signature: "export interface DeckExportPorts { helper: () => ILatexHelper | undefined; download: typeof downloadBytes; openTab: typeof openBlobTab; notify: (message: string) => void }"}
      - {path: packages/browser/src/libraryUi/editorArea/deckExport.ts, signature: "export function exportDeckFromBrowser(format: \"pdf\" | \"html\", deck: { html: string; theme: string; name: string; size: string; assets: DeckAssetResolver }, ports: DeckExportPorts): Promise<\"pdf\" | \"html\" | \"fallback\">"}
    decided:
      - "Do not run pnpm gate or any lint; check only with node scripts/agents/run.mjs typecheck browser and the tests.command. Tests are hidden; never edit them."
      - "No new dependency, no manifest change. Chrome and Firefox take the same path; the only branch is whether the Helper can print."
      - "Both formats first build the single-file HTML with exportDeckHtml (3.3) reading assets through assets.original (full-size originals). html: download(UTF-8 bytes, `<name>.html`, text/html), returns html. pdf: when helper() is set, connected and helperCanPrintPdf(helper.status()), call printPdf({html, size}); ok gives download(pdf, `<name>.pdf`, application/pdf) and returns pdf; reason limit or failed notifies 'PDF export failed: <message>' and falls back; noChromium and unsupported fall back silently except for the message below. Fallback: openTab(html, text/html, 'print') and notify 'The deck opened for printing. Install LabShelf Helper to save PDFs automatically.' (when the Helper is installed but lacks Chromium: 'The deck opened for printing. Install Chromium or Chrome to save PDFs automatically.'); returns fallback."
      - "downloadBytes: Blob of the bytes with the mime, URL.createObjectURL, bx.downloads.download({url, filename, saveAs: true}), revoke after 60 s; downloadTextFile becomes a call to it. openBlobTab: Blob(text, mime) URL plus `#<fragment>` when given, bx.tabs.create({url}); the URL is revoked after 60 s."
    acceptance:
