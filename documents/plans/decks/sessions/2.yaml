      - "Runtime-neutral (no node: imports, no DOM): files reach the disk only through the fs port. Each new file starts with a one-line `// <capability>` header and stays under 400 lines."
      - "Deck names match `^[a-z0-9][a-z0-9-]{0,63}$` (isDeckName). deckRootOf: talk → talks, poster → posters. All paths in results are project-relative with `/`."
      - "checkDeckPath(relPath): backslashes are not accepted; the path is refused (null) when absolute, empty, holding an empty, `.` or `..` segment, or not of the form `<root>/<name>` or `<root>/<name>/<inner>` with root talks or posters and a valid name. folder is `<root>/<name>`; inner is the rest ('' for the folder itself). It is lexical only; the node tools add the real-path check."
      - "listDecks: for talks then posters, each direct subfolder with a valid name holding a file deck.html gives {kind, name, folder: `<root>/<name>`, file: `<folder>/deck.html`, theme: `<folder>/theme.css`}; missing roots give nothing; sorted by kind (talk first) then name."
      - "scaffoldDeck(kind, name, size): size defaults to talk 1920x1080px, poster 841x1189mm; a size not allowed for the kind or an invalid name throws RangeError. html: `<!doctype html>`, html with lang en, data-deck, data-deck-version 1 and data-deck-size formatDeckSize(size); head with `<meta charset=\"utf-8\">`, `<title>` the name and the theme link; talk: one slide with a block `title` holding `<h1>` the name and `<aside data-notes></aside>`; poster: one slide with a block `title` holding `<h1>` the name. Each block's geometry is inside the canvas with 2-decimal px. theme: a `:root` rule with --deck-bg, --deck-fg, --deck-accent and --deck-font, then `body` and `h1` rules using them. validateDeck(html, {theme, files: {theme.css}}) gives no diagnostic at all."
      - "readProjectContext: the manuscript is the project's main file (project.main, relative to project.folder) and, for LaTeX, every file readLatexProjectTexts reaches from it, in reading order; Typst reads the main file alone. No main file gives the text `No main file.`. Parts: outline lists each heading of findOutlineHeadings as `<two spaces per level above the smallest><title>  (<file>:<line>)`; section gives the source text from the heading whose title equals request.heading (trimmed, first match) up to the next heading of the same or a higher level (or the end of that file), or `No section titled \"<heading>\".`; figures lists project files (listProjectFiles) with extension png, jpg, jpeg, gif, svg, pdf, webp or eps outside talks/ and posters/, one per line as `<path>  <bytes> bytes`; bibliography gives, for each .bib file of the project (listProjectFiles, sorted), a line `# <path>` then each parseBibEntries entry as `@<type>{<key>}` followed by its title, author and year fields as `  <field> = <value>` when present."
      - "Outline `<line>` is 1-based, as editors show lines: OutlineHeading.line (0-based) + 1."
      - "Paging: the full text of a part is split into pages of at most 65536 UTF-8 bytes, cut at the last line break inside the limit (a single longer line is cut at the last code point boundary inside it). cursor is the decimal UTF-8 byte offset where the next page starts and is absent on the last page. A cursor that is not a decimal offset inside the text throws RangeError. Page 1 is the request without cursor."
