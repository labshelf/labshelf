    decided:
      - Do not run pnpm gate or any lint; check only with node scripts/agents/run.mjs typecheck core and the tests.command. Tests are hidden; never edit them.
      - No new dependency (no MCP SDK, no zod). mcpServer.ts is runtime-neutral; only mcp/node/ uses Node streams. Each new file starts with a one-line `// <capability>` header.
      - handle(line) returns the reply lines (each one JSON.stringify of one JSON-RPC object, no newline); a line that is empty or only whitespace, and every notification (an object without id), give []. Replies carry jsonrpc "2.0" and the request id unchanged (number or string).
      - 'Errors: text that is not JSON gives {id: null, error: {code: -32700, message: "Parse error"}}; JSON that is not an object with jsonrpc "2.0" and a string method (arrays included: no batching) gives -32600 "Invalid Request" with the id when it is a number or string, else null; an unknown method gives -32601 "Method not found"; bad params give -32602 with a one-sentence message.'
      - 'initialize (any params, any client protocolVersion) returns {protocolVersion: "2025-06-18", capabilities: {tools: {listChanged: false}}, serverInfo: {name, version}} plus instructions when given. Requests before initialize are served too. ping returns {}. tools/list returns {tools: [{name, description, inputSchema}]} in the given order and ignores a cursor.'
      - "tools/call: params must be an object with a string name naming a tool and arguments absent or a plain object (else -32602; an unknown tool name is -32602 `Unknown tool: <name>`). The result is the tool's McpToolResult as returned. A tool that throws or rejects gives the result {content: [{type: \"text\", text: <error message>}], isError: true} and is logged with logger at level error (never written to stdout)."
      - runStdioServer reads input as UTF-8, splits on \n (a trailing \r is dropped), hands lines to server.handle one at a time in order (the next line waits for the previous reply), writes each reply line followed by \n to output and nothing else; a final line without \n is handled at the end. It resolves after input ends and every reply is written. Log lines go only to logger.
    acceptance:
      - id: 2.2a
        check: initialize returns protocol 2025-06-18, tools capability and serverInfo; notifications/initialized gives no reply; ping gives {}
      - id: 2.2b
        check: tools/list lists the tools in order with their schemas; tools/call returns the tool result; a throwing tool gives isError true
      - id: 2.2c
        check: parse error -32700, invalid request -32600 (batch arrays included), unknown method -32601, bad params and unknown tool -32602, each with the right id
      - id: 2.2d
        check: runStdioServer over in-memory streams answers newline-delimited requests in order, handles \r\n and a final unterminated line, writes only JSON lines and resolves at end of input
    tests:
