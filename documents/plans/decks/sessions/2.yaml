      - deckTools.ts imports McpTool through "../../mcp/index.js" and the deck helpers through "../index.js"; it uses node:fs/promises for writes and real paths. Each new file starts with a one-line `// <capability>` header and stays under 400 lines (move tool groups into private files of decks/node/ when needed).
      - 'createDeckTools returns, in this order, deck_rules, project_context, deck_list, deck_read, deck_create, deck_edit, deck_validate, each with a one-sentence description and a JSON Schema inputSchema ({type: "object", properties, required, additionalProperties: false}). Every result is one text content holding JSON.stringify(value, null, 2); refusals set isError true with value {ok: false, error?: <sentence>, diagnostics?: DeckDiagnostic[]}. Arguments of the wrong type are refused the same way (error names the argument).'
      - "deck_rules {} → {folders: [\"talks/<name>/\", \"posters/<name>/\"], vocabulary: <the D1 rules as an array of one-sentence strings>, presets: [...listDeckSizePresets(\"talk\"), ...listDeckSizePresets(\"poster\")], rules: listDeckRules()}. project_context {part, heading?, cursor?} → readProjectContext's page {text, cursor?}. deck_list {} → {decks: listDecks(...)}. deck_read {deck} → {deck: <folder>, html, theme (\"\" when missing), files: deck-folder-relative file paths sorted, diagnostics: validateDeck(html, {theme, files})}."
      - The deck argument is a project-relative deck folder (`talks/<name>`), with or without a trailing `/` or `/deck.html`; checkDeckPath must give a folder with inner '' or deck.html, else refused `Decks live in talks/<name>/ or posters/<name>/ of the project.`.
      - "deck_create {name, kind, html?, theme?, assets?: [{path, base64}]}: kind talk|poster, isDeckName(name); refused when `<root>/<name>/deck.html` exists. html absent → scaffoldDeck(kind, name) html (theme absent → the scaffold theme, also when html is given). Each asset path is deck-folder-relative (checkRelativePath ok, not deck.html or theme.css, no `..`), base64 decoded to at most 5 MiB (5242880 bytes) else refused `Asset <path> is larger than 5 MB.`. Validation is validateDeck(html, {theme, files: theme.css plus asset paths plus existing files}); any error refuses with all diagnostics and writes nothing; else it writes assets, theme.css and deck.html and returns {ok: true, deck: <folder>, diagnostics: <the warnings>}."
      - "deck_edit {deck, html?, edits?: DeckEdit[], theme?, assets?}: the deck must exist; at least one of html, edits, theme, assets. Start from html or the stored deck.html, apply each edit with applyDeckEdit in order (the first {ok: false} refuses with its error), take theme or the stored theme.css, then validate as deck_create and write only changed files; result as deck_create. deck_validate {deck?, html?, theme?}: diagnostics of the given html (with theme when given) or of the stored deck; never writes; never isError for diagnostics."
      - "Confinement: before any write the tool takes fs.realpath of the project folder P; the deck folder is created with mkdir recursive and its realpath must equal join(realpath(P), root, name) and that path's parent must be realpath(P)/<root> (so a symlinked talks/ or deck folder leading elsewhere is refused `The deck folder resolves outside the project.`); every written file's parent directory realpath must be inside the deck folder realpath and an existing target that is a symlink is refused. Nothing is written on any refusal. Failures are logged through deps.logger without deck text."
      - 'runMcp: findProject(libraryRoot, logger, project, cwd) (a UsageError or failure is logged and gives exit code 2 or 1); then createMcpServer({name: "labshelf", version, tools: createDeckTools(project, {logger}), instructions: "Call deck_rules before writing a deck."}) and runStdioServer(server, input, output, logger); returns 0 when input ends. terminalEntry: `args.command === "mcp"` in runLibraryFreeCommand resolves the library root as the other library-free commands do, passes flags.project, process.cwd(), process.stdin, process.stdout, a logger that writes to stderr only, and the package version; main() does not call refreshSystemLaunchers for mcp.'
      - decks.md#mcp states the command, protocol version, the seven tools with arguments and results as above, the 5 MB asset limit, the 64 KB context page, the confinement rule and that errors refuse a write while warnings never do.
      - "A2 is tested over runStdioServer with PassThrough streams (or a spawned terminal entry) in a temp project with labshelf.yaml: initialize, deck_rules, deck_create (scaffold) then deck_read, a deck_edit that adds a `<script>` refused with DECK013 and the file unchanged, and a deck_create or deck_edit whose deck is `../x`, `chapters/x` or a symlinked talks folder refused with nothing written."
