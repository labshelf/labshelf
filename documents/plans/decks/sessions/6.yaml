  - id: "6.3"
    plan: decks
    sha: 54b5c6f9
    goal: "A plain CodeMirror source view of deck.html in the deck editor, synced both ways (source edits re-parse after 300 ms idle, visual edits update the source without echo), and a build test that bundles the `./deckEditor` entry within the D13 budget."
    level: behaviour
    runner: {agent: implementer, model: opus}
    depends_on: ["6.0", "6.2"]
    create: [packages/core/src/decks/dom/deckSourceView.ts]
    edit:
      - {path: packages/core/src/decks/dom/openDeckEditor.ts, lines: "1-400", why: "toolbar toggle Source switches between the stage and the source view and keeps both in sync"}
      - {path: packages/core/src/decks/dom/index.ts, lines: "1-35", why: "export the public names of deckSourceView.ts"}
    read:
      - {path: documents/plans/decks/plan.yaml, lines: "29-31", why: "D8 source view"}
      - {path: documents/plans/decks/plan.yaml, lines: "44-46", why: "D13 size budget"}
      - {path: packages/core/src/writing/dom/sourceEditor/editor.ts, lines: "150-215", why: "createEditorExtensions and the editor theme; reuse the theme, not the LaTeX language"}
      - {path: packages/core/__tests__/qmd/dom/drawingEditor/openDrawingEditor.test.ts, lines: "439-475", why: "esbuild bundle-size test pattern"}
      - {path: packages/core/package.json, lines: "15-30", why: "the CodeMirror packages already declared"}
    seams:
      - {path: packages/core/src/decks/dom/deckSourceView.ts, signature: "export interface DeckSourceViewOptions { text: string; onChange(text: string): void; debounceMs?: number; readOnly?: boolean }"}
      - {path: packages/core/src/decks/dom/deckSourceView.ts, signature: "export interface DeckSourceView { readonly element: HTMLElement; text(): string; setText(text: string): void; flush(): void; destroy(): void }"}
      - {path: packages/core/src/decks/dom/deckSourceView.ts, signature: "export function mountDeckSourceView(host: HTMLElement, options: DeckSourceViewOptions): DeckSourceView"}
    decided:
      - "Do not run pnpm gate or any lint; check only with node scripts/agents/run.mjs typecheck core and the tests.command. Tests are hidden; never edit them."
      - "No new dependency: @codemirror/state, @codemirror/view, @codemirror/commands and @codemirror/search only, no language package (plain text, line numbers, history, search keymap). The file starts with a one-line `// <capability>` header and stays under 400 lines."
      - "mountDeckSourceView: an EditorView with aria-label `Deck source`; a user edit calls onChange(text) once after debounceMs (default 300) of idle; flush() runs a pending call now; setText replaces the document without calling onChange and keeps the cursor clamped; readOnly sets EditorState.readOnly."
      - "openDeckEditor: a toolbar toggle `Source` (aria-pressed) shows the source view instead of the stage. A source change that parseDeck gives a model for goes through the change path with label `Edit source` and re-renders the stage (and read-only state from validateDeck); a source without a model changes nothing else and the status shows `The source cannot be read as a deck: <first problem>`. Every visual change (gesture, strip, theme panel, size, undo/redo, setDocument) calls setText with the new html, never echoing back to onChange."
      - "Budget test (packages/core/__tests__/decks/dom.test.ts, named after the dom folder): esbuild from node_modules/.bin bundles packages/core/src/decks/dom/openDeckEditor.ts with --bundle --minify --format=esm --platform=browser, externals `*/latex/hover/index` and `*/latex/hover/index.js` and the `@codemirror/*` packages (already shipped, not counted, D13), `--loader:.css=empty`; the output is at most 1048576 bytes and stderr is empty."
    acceptance:
      - {id: 6.3a, check: "the source view shows deck.html; a typed edit calls onChange once after 300 ms idle; setText does not call onChange"}
      - {id: 6.3b, check: "an edit in the source view re-renders the stage as one Edit source change; a gesture on the stage updates the source text without an echo change"}
      - {id: 6.3c, check: "a source that is no deck keeps the last good stage and shows the problem; a source with validation errors makes the stage read-only"}
      - {id: 6.3d, check: "the ./deckEditor entry bundles with esbuild to at most 1 MB minified, MathJax and CodeMirror not counted (D13)"}
    tests:
      hidden: []
      command: "node scripts/agents/run.mjs test core --spec 6.3 --plan decks -- packages/core/__tests__/decks/dom/deckSourceView.test.ts packages/core/__tests__/decks/dom.test.ts"
    commands: ["node scripts/agents/run.mjs typecheck core"]
    do_not_touch: [packages/core/src/qmd/]
