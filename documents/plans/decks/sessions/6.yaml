  - id: "6.1"
    plan: decks
    sha: 54b5c6f9
    goal: "A slide strip in the deck editor (select, reorder by drag and keys, add, duplicate, delete, each one undoable change) with thumbnails rasterised through SVG foreignObject onto a 320 px canvas, cached by SHA-256 of slide and theme, falling back to a static scaled frame."
    level: behaviour
    runner: {agent: implementer, model: sonnet}
    depends_on: ["6.0"]
    create: [packages/core/src/decks/dom/slideStrip.ts, packages/core/src/decks/dom/slideThumbnails.ts]
    edit:
      - {path: packages/core/src/decks/dom/openDeckEditor.ts, lines: "1-400", why: "mount the strip beside the stage for talks and route its edits through the editor's change path"}
      - {path: packages/core/src/decks/dom/index.ts, lines: "1-25", why: "export the public names of slideStrip.ts and slideThumbnails.ts"}
      - {path: packages/core/src/decks/dom/deck-editor.css, lines: "1-400", why: "strip and thumbnail styles"}
    read:
      - {path: documents/plans/decks/plan.yaml, lines: "29-31", why: "D8 strip thumbnails and Mod+D"}
      - {path: packages/core/src/decks/dom/deckFrame.ts, lines: "1-200", why: "buildSlideSrcdoc and DeckFrame (session 5)"}
      - {path: packages/core/src/decks/deckEdit.ts, lines: "1-60", why: "moveSlide, addSlide, duplicateSlide, deleteSlide (session 1)"}
      - {path: packages/core/src/hash/index.ts, lines: "1-20", why: "deriveTextSha256Hex"}
      - {path: packages/core/src/qmd/drawing/dom/png.ts, lines: "1-12", why: "CanvasFactory pattern (read only)"}
    seams:
      - {path: packages/core/src/decks/dom/slideThumbnails.ts, signature: "export interface SlideThumbnailCache { get(key: string): string | undefined; set(key: string, url: string): void; size(): number }"}
      - {path: packages/core/src/decks/dom/slideThumbnails.ts, signature: "export function createThumbnailCache(limit?: number): SlideThumbnailCache"}
      - {path: packages/core/src/decks/dom/slideThumbnails.ts, signature: "export function thumbnailKey(slideHtml: string, theme: string): Promise<string>"}
      - {path: packages/core/src/decks/dom/slideThumbnails.ts, signature: "export interface RasterDeps { createCanvas(width: number, height: number): HTMLCanvasElement; loadImage(url: string): Promise<CanvasImageSource> }"}
      - {path: packages/core/src/decks/dom/slideThumbnails.ts, signature: "export function renderSlideThumbnail(srcdoc: string, canvas: { width: number; height: number }, deps?: RasterDeps): Promise<string | null>"}
      - {path: packages/core/src/decks/dom/slideStrip.ts, signature: "export interface SlideStripOptions { count: number; current: number; thumbnail(index: number): Promise<string | null>; onSelect(index: number): void; onEdit(edit: DeckEdit, label: string): void }"}
      - {path: packages/core/src/decks/dom/slideStrip.ts, signature: "export interface SlideStrip { readonly element: HTMLElement; update(count: number, current: number): void; destroy(): void }"}
      - {path: packages/core/src/decks/dom/slideStrip.ts, signature: "export function mountSlideStrip(host: HTMLElement, options: SlideStripOptions): SlideStrip"}
    decided:
      - "Do not run pnpm gate or any lint; check only with node scripts/agents/run.mjs typecheck core and the tests.command. Tests are hidden; never edit them."
      - "Each new file starts with a one-line `// <capability>` header and stays under 400 lines; no style attribute in markup (CSSOM only); classes prefixed `deck-editor-strip`, styled in deck-editor.css."
      - "thumbnailKey: deriveTextSha256Hex(slideHtml + \"\\u0000\" + theme). createThumbnailCache: limit default 200 entries, least recently used dropped first."
      - "renderSlideThumbnail: the image is an `image/svg+xml` data URL of `<svg xmlns=… width=W height=H><foreignObject width=100% height=100%>` + the srcdoc body as XHTML + `</foreignObject></svg>` (assets already inlined as data URLs by the caller); it is drawn onto a canvas 320 px wide (height = round(320 x H / W)) and returned as canvas.toDataURL(\"image/png\"); any failure (load error, tainted canvas, no 2d context) gives null. Default deps use document.createElement(\"canvas\") and an Image."
      - "mountSlideStrip: a list (role listbox, aria-label `Slides`) of options `Slide <n>` (aria-selected on current) each showing its thumbnail img (alt `Slide <n>`) or, on null, a static scaled copy (a sandboxed iframe like the stage, scaled by CSS transform); buttons Add slide, Duplicate slide, Delete slide (Delete disabled with one slide). Click selects; dragging an option onto another position gives moveSlide; with the strip focused, Alt+ArrowUp and Alt+ArrowDown move the current slide, ArrowUp and ArrowDown select, Mod+D duplicates, Delete deletes. Edits go to onEdit with labels `Move slide`, `Add slide`, `Duplicate slide`, `Delete slide`."
      - "In openDeckEditor the strip shows for talks only (a poster has one slide); onEdit applies applyDeckEdit and goes through the same change path as gestures (one onChange, one history snapshot, so Undo restores a deleted slide); after addSlide or duplicateSlide the new slide is selected, after deleteSlide the previous one (or 0). Thumbnails are requested through the cache and refreshed when a slide's key changes."
    acceptance:
      - {id: 6.1a, check: "the strip lists one option per slide with thumbnails, selects on click and arrow keys"}
      - {id: 6.1b, check: "Add, Duplicate (and Mod+D), Delete and Alt+Arrow moves give one onChange each with the stated labels and the selected slide follows; Undo restores a deleted slide"}
      - {id: 6.1c, check: "thumbnailKey changes with slide or theme; the cache hits for the same key and drops the least recently used past its limit"}
      - {id: 6.1d, check: "renderSlideThumbnail draws on a 320 px wide canvas through the injected factories and gives null on failure, where the strip shows the static frame"}
    tests:
      hidden: []
      command: "node scripts/agents/run.mjs test core --spec 6.1 --plan decks -- packages/core/__tests__/decks/dom/slideStrip.test.ts packages/core/__tests__/decks/dom/slideThumbnails.test.ts"
    commands: ["node scripts/agents/run.mjs typecheck core"]
    do_not_touch: [packages/core/src/qmd/]

  - id: "6.2"
    plan: decks
    sha: 54b5c6f9
    goal: "A theme panel over the custom properties of theme.css's first :root rule, a size picker with the D2 presets, orientation and custom sizes, and Out of date or Source missing badges with an Update action on linked blocks, wired into the deck editor."
    level: behaviour
    runner: {agent: implementer, model: sonnet}
    depends_on: ["6.0", "6.1"]
    create: [packages/core/src/decks/dom/themePanel.ts, packages/core/src/decks/dom/sizePicker.ts, packages/core/src/decks/dom/linkBadges.ts]
    edit:
      - {path: packages/core/src/decks/dom/openDeckEditor.ts, lines: "1-400", why: "toolbar buttons Theme and Size open the panel and picker; badges over linked blocks; DeckEditorOptions gains linkSources"}
      - {path: packages/core/src/decks/dom/index.ts, lines: "1-30", why: "export the public names of themePanel.ts, sizePicker.ts and linkBadges.ts"}
      - {path: packages/core/src/decks/dom/deck-editor.css, lines: "1-400", why: "panel, picker and badge styles"}
    read:
      - {path: documents/plans/decks/plan.yaml, lines: "11-13", why: "D2 presets, ranges and the scale rule"}
      - {path: documents/plans/decks/plan.yaml, lines: "20-22", why: "D5 states and the Update action"}
      - {path: packages/core/src/decks/themeCss.ts, lines: "1-200", why: "readThemeProperties and setThemeProperty (session 1)"}
      - {path: packages/core/src/decks/deckSizes.ts, lines: "1-150", why: "listDeckSizePresets, isDeckSizeAllowed (session 1)"}
      - {path: packages/core/src/decks/deckLinks.ts, lines: "1-200", why: "readDeckLinks, deriveLinkState, updateDeckLink (session 3)"}
      - {path: packages/core/src/qmd/dom/drawingEditor/toolbar.ts, lines: "59-100", why: "popover picker with outside-click close and Escape (copy, do not import)"}
      - {path: packages/core/src/ui/dom/widgets/page.ts, lines: "77-100", why: "renderSegmentedFilter for the orientation toggle"}
    seams:
      - {path: packages/core/src/decks/dom/themePanel.ts, signature: "export interface ThemePanelOptions { theme: string; onChange(name: string, value: string): void }"}
      - {path: packages/core/src/decks/dom/themePanel.ts, signature: "export function mountThemePanel(host: HTMLElement, options: ThemePanelOptions): { readonly element: HTMLElement; update(theme: string): void; destroy(): void }"}
      - {path: packages/core/src/decks/dom/sizePicker.ts, signature: "export interface SizePickerOptions { kind: DeckKind; size: DeckSize; onApply(size: DeckSize): void }"}
      - {path: packages/core/src/decks/dom/sizePicker.ts, signature: "export function mountSizePicker(host: HTMLElement, options: SizePickerOptions): { readonly element: HTMLElement; destroy(): void }"}
      - {path: packages/core/src/decks/dom/linkBadges.ts, signature: "export interface LinkBadgeTarget { block: string; status: DeckLinkStatus; box: HTMLElement }"}
      - {path: packages/core/src/decks/dom/linkBadges.ts, signature: "export function renderLinkBadges(targets: readonly LinkBadgeTarget[], onUpdate: (block: string, status: DeckLinkStatus) => void): void"}
    decided:
      - "Do not run pnpm gate or any lint; check only with node scripts/agents/run.mjs typecheck core and the tests.command. Tests are hidden; never edit them."
      - "Each new file starts with a one-line `// <capability>` header and stays under 400 lines; no style attribute in markup; classes prefixed `deck-editor-`."
      - "mountThemePanel: one row per readThemeProperties entry (duplicates: the last one), label the name without the leading `--`; a value matching `^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$` gets `<input type=\"color\">` (3-digit values expanded for the input) else `<input type=\"text\">`, each with aria-label the property name; the change event (not input) calls onChange(name, value) with a trimmed non-empty value. No property gives the text `theme.css has no custom properties in its :root rule.`."
      - "mountSizePicker: presets of listDeckSizePresets(kind) as radio buttons with their labels (the current size checked when it equals one); posters get a Portrait/Landscape toggle that swaps w and h of the chosen preset; Custom with width, height inputs and a unit select (talk: px only; poster: mm and in). Apply calls onApply(size) when isDeckSizeAllowed(kind, size), else shows `Talk sizes are 320 to 7680 px per side.` or `Poster sizes are 100 to 2000 mm (3.9 to 78.7 in) per side.` and does not call onApply."
      - "renderLinkBadges: for state stale a badge `Out of date` with a button `Update` (aria-label `Update block <id> from its source`) inside the target box; missing: `Source missing`, no button; fresh: no badge. The words carry the state."
      - "openDeckEditor: toolbar buttons Theme and Size (aria-labels) open popovers with the panel and the picker (Escape and outside click close). A theme change applies setThemeProperty and goes through the change path with label `Change theme` (html unchanged); Apply applies setSize with scale true, label `Change size`. DeckEditorOptions gains `linkSources?: DeckLinkSources`; when given, after each render readDeckLinks + deriveLinkState give the badges for the current slide; Update applies updateDeckLink(html, block, status.hash, status.text) with label `Update linked block`."
    acceptance:
