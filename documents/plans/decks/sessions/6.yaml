      - {id: 6.2b, check: "the size picker lists the D2 presets of the kind, swaps orientation for posters, applies custom sizes in range and refuses out-of-range ones with the stated message"}
      - {id: 6.2c, check: "Apply gives one Change size onChange with the size written and block geometry scaled"}
      - {id: 6.2d, check: "a stale linked block shows Out of date with Update; Update gives an Update linked block change whose hash is current; missing shows Source missing; fresh shows nothing"}
