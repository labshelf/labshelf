      command: "node scripts/agents/run.mjs test core --spec 7.1 --plan decks -- packages/core/__tests__/decks/present/presenterState.test.ts packages/core/__tests__/decks/present/presenterChannel.test.ts packages/core/__tests__/decks/dom/openPresenter.test.ts"
    commands: ["node scripts/agents/run.mjs typecheck core"]
    do_not_touch: [packages/core/src/qmd/]

  - id: "7.2"
    plan: decks
    sha: 54b5c6f9
    goal: "openPosterPreview shows the whole poster with zoom, pan, rulers in mm or in and a one-time calibration kept through a CalibrationStore port; pure measures give the ruler ticks and the small-text threshold, and leaves below it are listed and marked."
    level: behaviour
    runner: {agent: implementer, model: opus}
    depends_on: ["7.0", "7.1"]
    create: [packages/core/src/decks/present/posterMeasure.ts, packages/core/src/decks/dom/openPosterPreview.ts]
    edit:
      - {path: packages/core/src/decks/present/index.ts, lines: "1-15", why: "export posterMeasure.ts"}
      - {path: packages/core/src/decks/dom/index.ts, lines: "1-40", why: "export openPosterPreview and its types"}
    read:
      - {path: documents/plans/decks/plan.yaml, lines: "34-36", why: "D10 zoom, pan, rulers, calibration, small-text rule"}
      - {path: packages/core/src/decks/deckSizes.ts, lines: "1-150", why: "parseDeckSize, deckCanvasPx (1.2)"}
      - {path: packages/core/src/decks/dom/deckFrame.ts, lines: "1-300", why: "mountDeckFrame and the leaf access through contentDocument (5.1)"}
