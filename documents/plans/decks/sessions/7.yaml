    seams:
      - {path: packages/core/src/decks/present/presenterState.ts, signature: "export interface PresenterState { slide: number; count: number; black: boolean; startedAt: number | null; pausedAt: number | null; pausedTotal: number }"}
      - {path: packages/core/src/decks/present/presenterState.ts, signature: "export type PresenterAction = { kind: \"next\" } | { kind: \"previous\" } | { kind: \"first\" } | { kind: \"last\" } | { kind: \"goto\"; slide: number } | { kind: \"toggleBlack\" } | { kind: \"pauseTimer\" } | { kind: \"resumeTimer\" } | { kind: \"resetTimer\" }"}
