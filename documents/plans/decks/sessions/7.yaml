      - {path: packages/core/src/libraryUi/dom/libraryChrome.ts, lines: "84-124", why: "pointer capture pattern (attachSash)"}
    seams:
      - {path: packages/core/src/decks/present/posterMeasure.ts, signature: "export type RulerUnit = \"mm\" | \"in\""}
      - {path: packages/core/src/decks/present/posterMeasure.ts, signature: "export interface PosterCalibration { pxPerMm: number; measuredAt: string }"}
      - {path: packages/core/src/decks/present/posterMeasure.ts, signature: "export interface CalibrationStore { load(): Promise<PosterCalibration | undefined>; save(calibration: PosterCalibration): Promise<void> }"}
      - {path: packages/core/src/decks/present/posterMeasure.ts, signature: "export interface RulerTick { offset: number; label: string | null; major: boolean }"}
      - {path: packages/core/src/decks/present/posterMeasure.ts, signature: "export function smallTextThresholdPt(size: DeckSize): number"}
      - {path: packages/core/src/decks/present/posterMeasure.ts, signature: "export function calibrationFromCard(screenPx: number, now: Date): PosterCalibration"}
      - {path: packages/core/src/decks/present/posterMeasure.ts, signature: "export function rulerTicks(lengthCanvasPx: number, unit: RulerUnit, screenPxPerCanvasPx: number): RulerTick[]"}
      - {path: packages/core/src/decks/present/posterMeasure.ts, signature: "export function clampPosterZoom(zoom: number): number"}
      - {path: packages/core/src/decks/dom/openPosterPreview.ts, signature: "export interface PosterPreviewOptions { html: string; theme: string; store: CalibrationStore; resolveAsset: (path: string) => Promise<string>; loadMath?: DeckFrameOptions[\"loadMath\"]; unit?: RulerUnit; onSelectLeaf?: (block: string, leaf: number) => void }"}
      - {path: packages/core/src/decks/dom/openPosterPreview.ts, signature: "export interface SmallTextFlag { block: string; leaf: number; pt: number; text: string }"}
      - {path: packages/core/src/decks/dom/openPosterPreview.ts, signature: "export interface PosterPreviewController { zoom(): number; setZoom(zoom: number): void; setUnit(unit: RulerUnit): void; smallText(): SmallTextFlag[]; calibrated(): boolean; destroy(): void }"}
      - {path: packages/core/src/decks/dom/openPosterPreview.ts, signature: "export function openPosterPreview(host: HTMLElement, options: PosterPreviewOptions): Promise<PosterPreviewController>"}
    decided:
      - "Do not run pnpm gate or any lint; check only with node scripts/agents/run.mjs typecheck core and the tests.command. Tests are hidden; never edit them."
      - "No new dependency; posterMeasure.ts is pure and runtime-neutral; openPosterPreview.ts in dom/. No style= markup; positions and transforms through CSSOM. Each file under 400 lines."
      - "smallTextThresholdPt(size): 24 * shorterSideMm / 841 (in converted at 25.4 mm/in; a px size uses px / 96 * 25.4), rounded to 1 decimal. A0 gives 24, A1 16.9 (594 mm), A2 12. Leaf print size in pt = computed font-size in canvas px * 0.75 (96 px/in, 72 pt/in); a leaf is flagged when that is strictly below the threshold."
      - "Calibration: the card is 85.6 mm wide; calibrationFromCard(screenPx, now) gives pxPerMm = screenPx / 85.6 rounded to 4 decimals and measuredAt now.toISOString(); screenPx must be finite and > 0 (else RangeError). Uncalibrated, pxPerMm is 96 / 25.4. The UI flow: a 'Calibrate' button shows a horizontal line with a draggable end handle (pointer capture) and the text 'Drag the line to the width of a bank card (85.6 mm)'; Save calls store.save and the ruler switches to it; Cancel restores. Until a calibration exists the ruler region shows 'Not calibrated'."
      - "Zoom 1 means real size: one mm of poster spans pxPerMm screen px, so the screen px per canvas px at zoom z is z * pxPerMm * 25.4 / 96. clampPosterZoom clamps to 0.1..4 (non-finite gives 1). Mod+wheel (ctrlKey or metaKey) multiplies zoom by 1.1 per wheel step keeping the point under the pointer fixed; plain drag or Space+drag pans (pointer capture); the initial zoom fits the whole poster in the host."
      - "rulerTicks(length, unit, screenPxPerCanvasPx): offsets in canvas px from 0 to length inclusive. mm: a tick every 1 mm when one mm spans >= 4 screen px, else every 5 mm when 5 mm >= 4 px, else every 10 mm; major (with label, the mm count) every 10 mm, or every 100 mm when 10 mm spans < 40 screen px. in: a tick every 1/8 in when that spans >= 4 screen px, else every 1/2 in, else 1 in; major with label every inch. Canvas px per mm is 96 / 25.4; offsets rounded to 2 decimals; labels are integers as strings."
      - "Rulers: a top and a left ruler strip, each an SVG of ticks re-rendered on zoom, pan and unit change; a toggle button 'mm' / 'in' (aria-pressed) calls setUnit. The poster is one deck frame (slide 0)."
      - "Small text: after the frame loads, every leaf of every block (DeckLeaf order from parseDeck) is read through the frame's contentDocument with getComputedStyle font-size; flagged leaves are listed in a `[data-small-text]` list (`<pt> pt: <first 40 chars>`, the list heading 'Text below <threshold> pt'; 'No text below <threshold> pt' when none) and each gets a marker element over its rect on the canvas; clicking a list entry calls onSelectLeaf(block, leaf). smallText() returns the flags in leaf order with pt rounded to 1 decimal. A talk passed in is refused with an Error 'Poster preview needs a poster'."
      - "openPosterPreview awaits store.load() before the first render; destroy removes DOM and listeners."
    acceptance:
      - {id: 7.2a, check: "smallTextThresholdPt gives 24 for A0, 16.9 for A1, 12 for A2 and works for in sizes and landscape"}
      - {id: 7.2b, check: "calibrationFromCard and rulerTicks give the stated px per mm, tick spacing and labels in mm and in; clampPosterZoom clamps to 10%..400%"}
      - {id: 7.2c, check: "the preview loads the calibration from the store, shows 'Not calibrated' without one, and a calibration drag saved through the store changes the ruler"}
      - {id: 7.2d, check: "Mod+wheel zooms within the limits, drag pans, and the unit toggle switches the ruler labels between mm and in"}
      - {id: 7.2e, check: "a leaf below the threshold is listed with its size and marked on the canvas, larger text is not, and no style= attribute is used"}
      - {id: A6, check: "the poster preview shows the calibrated ruler in mm and in and flags text below the size threshold"}
