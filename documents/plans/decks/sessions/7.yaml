  - id: "7.1"
    plan: decks
    sha: 54b5c6f9
    goal: "A pure presenter state (slide index, timer, black screen) driven by keys and synced through a PresenterChannel port, and openPresenter mounting the audience view and the presenter view (notes, timer, current and next slide) over the deck frame."
    level: behaviour
    runner: {agent: implementer, model: opus}
    depends_on: ["7.0"]
    create: [packages/core/src/decks/present/index.ts, packages/core/src/decks/present/presenterState.ts, packages/core/src/decks/present/presenterChannel.ts, packages/core/src/decks/dom/openPresenter.ts]
    edit:
      - {path: packages/core/src/decks/present/index.ts, lines: "1-15", why: "new barrel: header comment, exports of presenterState.ts and presenterChannel.ts"}
      - {path: packages/core/src/decks/dom/index.ts, lines: "1-40", why: "export openPresenter, its option and controller types, and re-export the present/ barrel so hosts reach them through the lazy ./deckEditor entry (from 5.3)"}
    read:
      - {path: documents/plans/decks/plan.yaml, lines: "30-33", why: "D9 presenter keys, views and channel"}
      - {path: documents/contracts/decks.md, lines: "1-300", why: "#vocabulary: slides and the notes element"}
      - {path: packages/core/src/decks/dom/deckFrame.ts, lines: "1-300", why: "mountDeckFrame (5.1): the frame each view renders a slide with"}
      - {path: packages/core/src/decks/deckParse.ts, lines: "1-400", why: "parseDeck: slides and notes text (1.2)"}
