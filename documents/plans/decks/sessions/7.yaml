      - {path: packages/core/src/decks/present/presenterState.ts, signature: "export function presenterElapsedMs(state: PresenterState, now: number): number"}
      - {path: packages/core/src/decks/present/presenterState.ts, signature: "export function formatPresenterTime(ms: number): string"}
      - {path: packages/core/src/decks/present/presenterState.ts, signature: "export function presenterKeyAction(key: string): PresenterAction | \"exit\" | null"}
      - {path: packages/core/src/decks/present/presenterChannel.ts, signature: "export type PresenterMessage = { type: \"state\"; state: PresenterState } | { type: \"action\"; action: PresenterAction } | { type: \"hello\" } | { type: \"exit\" }"}
      - {path: packages/core/src/decks/present/presenterChannel.ts, signature: "export interface PresenterChannel { post(message: PresenterMessage): void; onMessage(listener: (message: PresenterMessage) => void): () => void; close(): void }"}
      - {path: packages/core/src/decks/present/presenterChannel.ts, signature: "export function parsePresenterMessage(value: unknown): PresenterMessage | null"}
      - {path: packages/core/src/decks/present/presenterChannel.ts, signature: "export function createBroadcastPresenterChannel(name: string, factory?: (name: string) => BroadcastChannel): PresenterChannel"}
      - {path: packages/core/src/decks/dom/openPresenter.ts, signature: "export interface PresenterOptions { role: \"audience\" | \"presenter\"; html: string; theme: string; slide?: number; channel: PresenterChannel; resolveAsset: (path: string) => Promise<string>; loadMath?: DeckFrameOptions[\"loadMath\"]; now?: () => number; requestFullscreen?: (element: HTMLElement) => Promise<void>; onExit?: () => void }"}
      - {path: packages/core/src/decks/dom/openPresenter.ts, signature: "export interface PresenterController { state(): PresenterState; dispatch(action: PresenterAction): void; destroy(): void }"}
      - {path: packages/core/src/decks/dom/openPresenter.ts, signature: "export function openPresenter(host: HTMLElement, options: PresenterOptions): PresenterController"}
    decided:
      - "Do not run pnpm gate or any lint; check only with node scripts/agents/run.mjs typecheck core and the tests.command. Tests are hidden; never edit them."
      - "No new dependency. present/ is runtime-neutral (no DOM, no clock: time comes in as `now`); openPresenter.ts lives in dom/. DeckFrameOptions is the options type of mountDeckFrame from 5.1 (use the name 5.1 gives it). Each file stays under 400 lines; no style= markup (CSSOM only, as the editor)."
      - "createPresenterState(count, slide = 0): slide clamped to 0..count-1, black false, startedAt null, pausedAt null, pausedTotal 0; count must be an integer >= 1 (else RangeError)."
      - "reducePresenter is pure and returns a new object (the same object when nothing changes). next/previous move by one and stop at the ends; first and last go to 0 and count-1; goto clamps to 0..count-1 (non-integer goto is ignored). Any slide move clears black. The timer starts on the first next (or goto/last that changes the slide): startedAt = now when it was null. pauseTimer sets pausedAt = now when started and not paused; resumeTimer adds now - pausedAt to pausedTotal and clears pausedAt; resetTimer sets startedAt, pausedAt null and pausedTotal 0. toggleBlack flips black."
      - "presenterElapsedMs: 0 before start; else (pausedAt ?? now) - startedAt - pausedTotal, never below 0. formatPresenterTime: `m:ss` below one hour (`0:00`, `12:05`), `h:mm:ss` from one hour, whole seconds floored."
      - "presenterKeyAction (KeyboardEvent.key values): ArrowRight, ArrowDown, ' ' (Space), PageDown give next; ArrowLeft, ArrowUp, PageUp previous; Home first; End last; b and B toggleBlack; Escape gives \"exit\"; anything else null."
      - "parsePresenterMessage accepts only the four shapes with valid fields (a state with integer slide and count >= 1, booleans and numbers or null as typed; an action of a known kind) and drops unknown keys; anything else is null. createBroadcastPresenterChannel posts and receives through a BroadcastChannel of that name (factory defaults to `new BroadcastChannel`), passing only parsed messages to listeners; close() closes it and stops listeners."
      - "Sync rule: the presenter view owns the state. It posts {type: state} after every change and when it receives hello; it applies actions it receives. The audience view never changes state itself: its keys post {type: action}, it renders each received state, and it posts hello once on open. Both post exit on Escape and call onExit; receiving exit calls onExit too."
      - "Audience view DOM: a root `.ls-deck-present` with one deck frame showing state.slide scaled to fit the host (CSSOM transform), and a black cover element with `hidden` toggled by state.black. On open it calls requestFullscreen(root) when given (rejections are ignored). Presenter view DOM: the current slide frame, the next slide frame (an end label 'End of presentation' after the last slide), the notes of the current slide as text in a `[data-presenter-notes]` region (text 'No notes' when none), the slide label `Slide <n> of <count>`, the timer text from formatPresenterTime in `[data-presenter-timer]` updated each second (setInterval 1000, cleared by destroy), and buttons Pause/Resume, Reset, Previous, Next, Black screen with accessible names."
      - "Keys are read on the host's ownerDocument keydown and on each frame's contentDocument, through presenterKeyAction. destroy() removes the DOM, the listeners and the interval and does not close the channel (the host owns it)."
    acceptance:
      - {id: 7.1a, check: "reducePresenter: next/previous/first/last/goto clamp at the ends, a move clears black, the timer starts on the first advance, pause, resume and reset give the stated elapsed time"}
      - {id: 7.1b, check: "presenterKeyAction maps every D9 key, Escape to exit and others to null; formatPresenterTime formats below and above one hour"}
      - {id: 7.1c, check: "parsePresenterMessage accepts the four shapes and rejects malformed values; the broadcast channel delivers only parsed messages and stops after close"}
      - {id: 7.1d, check: "the presenter view shows notes, timer, slide label, current and next slide; the audience view shows the current slide and the black cover; neither uses a style= attribute"}
      - {id: 7.1e, check: "over one shared fake channel the audience follows every presenter change, audience keys reach the presenter as actions, Escape on either side calls onExit, and destroy clears the interval"}
      - {id: A5, check: "presenter mode shows notes, timer, current and next slide, and the full-screen audience view follows the presenter state"}
