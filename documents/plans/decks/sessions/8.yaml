      - {id: 8.1d, check: "an edit message becomes exactly one WorkspaceEdit with the minimal replace on deck.html and on theme.css; a stale baseVersion posts update instead"}
      - {id: 8.1e, check: "a change made in the text editor (or undo) posts update; the editor's own applied edit is not echoed back"}
      - {id: 8.1f, check: "parseDeckPageMessage accepts the four shapes and rejects malformed ones; minimalReplace gives the shortest single replace"}
