    decided:
      - "Do not run pnpm gate or any lint; check only with node scripts/agents/run.mjs typecheck vscode and the tests.command. Tests are hidden; never edit them."
      - "No new dependency. Each new file starts with a one-line `// <capability>` header and stays under 400 lines. DECK_EDITOR_VIEW_TYPE = \"labshelf.deckEditor\" (export const from index.ts, not a seam)."
      - "renderDeckHtmlShell takes the same options as renderHtmlShell (dataImages ignored) and writes the same document with this CSP: `default-src 'none'; script-src 'nonce-<nonce>' <cspSource>; style-src <cspSource> 'unsafe-inline'; img-src <cspSource> data: blob:; font-src <cspSource> data:; frame-src 'self' about: blob:;`. style-src carries no nonce, because a nonce makes browsers ignore 'unsafe-inline' and the srcdoc slide frame inherits this policy. renderHtmlShell's output is unchanged for every input."
      - "package.json contributes.customEditors gains {viewType: labshelf.deckEditor, displayName: \"LabShelf Deck Editor\", selector: [{filenamePattern: \"**/talks/*/deck.html\"}, {filenamePattern: \"**/posters/*/deck.html\"}], priority: \"option\"}; labshelf.sourceEditor is untouched. registerDeckEditor calls window.registerCustomEditorProvider(DECK_EDITOR_VIEW_TYPE, provider, {webviewOptions: {retainContextWhenHidden: true}, supportsMultipleEditorsPerDocument: false}) and pushes the disposable on context.subscriptions."
      - "resolveCustomTextEditor: theme uri = sibling theme.css of the document; webview.options {enableScripts: true, localResourceRoots: [dist/deckEditor, the webview chunks dir as the source editor uses, the deck folder]}; html from renderDeckHtmlShell with dist/deckEditor/deckEditor.js and .css (renderBundleMissingHtml when the bundle is missing). Nothing is posted before the page sends ready; then init {deck: document text, theme: theme.css text or '' when missing, version: document.version, assetBase: asWebviewUri(deck folder).toString() + '/', kind from parseDeck(text).model?.kind ?? null} (parseDeck from @labshelf/core). The page's resolveAsset is async and resolves new URL(path, assetBase).href. The deck editor registers directly with window.registerCustomEditorProvider (not registerCustomEditorWithReopen, which forces supportsMultipleEditorsPerDocument: true); registerDeckEditor is called from startExtension.ts beside registerNotesEditor. The host bundle never imports @labshelf/core/deckEditor at runtime (it pulls DOM code); type-only imports are fine."
      - "minimalReplace(before, after): null when equal; else the longest common prefix and then the longest common suffix not overlapping it give one {from, to, insert} in before's offsets (UTF-16)."
      - "createDeckSync.applyFromPage: when baseVersion differs from deck.version it posts update with the current texts and resolves false. Else it builds ONE vscode.WorkspaceEdit holding minimalReplace of the deck (as a replace on deck.uri) and, when theme is given and differs from the current theme.css text, minimalReplace on themeUri (the theme document opened with workspace.openTextDocument; a missing theme.css is created with WorkspaceEdit.createFile then inserted), applies it with workspace.applyEdit, and resolves its result; one call per page gesture, so VS Code's undo of the document undoes one gesture."
      - "Echoes and external edits: deckSync listens to workspace.onDidChangeTextDocument for deck.uri and themeUri. A change whose resulting text equals the text it just applied is swallowed; any other change (text editor typing, undo, redo, git) posts update {deck, theme, version}. Undo and redo are VS Code's (the page runs openDeckEditor with history: \"host\" and forwards Mod+Z/Mod+Shift+Z to nothing). A save message calls deck.save() and, when the theme document is dirty, saves it too. dirty is posted after each applied edit and after save."
      - "parseDeckPageMessage accepts only the four shapes (edit needs string deck, optional string theme, integer baseVersion >= 0; command one of the six names) and drops unknown keys; anything else null. A command message runs the VS Code command labshelf.decks.<command> with the document uri (registered by 8.2 and 10.3; an unregistered command logs a warning, nothing else)."
      - "Webview entry deckEditorEntry.ts: imports core tokens.css, vscodeHost.css, base.css, ../../webview/editorPage.css and @labshelf/core/styles/deck-editor.css, sends ready, on init loads openDeckEditor lazily (dynamic import of @labshelf/core/deckEditor, so it lands in a chunk) and calls openDeckEditor(root, {html: init.deck, theme, resolveAsset, history: \"host\", onChange}) where onChange(change) posts edit {deck: change.html, theme: change.theme, baseVersion: last known version}; on update it calls controller.setDocument(update.deck, update.theme) and records the version. The wire messages keep the field name deck. The editor's read-only mode (validateDeck errors) needs nothing from the host."
