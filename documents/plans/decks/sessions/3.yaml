      - "QR tests check the structure of the matrix (size 17+4v, finder, timing and alignment patterns, format bits for ECC M and the chosen mask, version bits from v7) and read the data back by unmasking, de-interleaving and checking the Reed-Solomon codewords with a small decoder inside the test; no new dependency."
    acceptance:
      - {id: 3.0a, check: "tests.hidden of 3.1, 3.2 and 3.3 list existing files under documents/plans/decks/tests/ and plan red reports each spec red"}
    tests: {none: "writes the session's tests"}

  - id: "3.1"
    plan: decks
    sha: 54b5c6f9
    goal: "Linked blocks (D5): read the links of a deck, find the source text of a LaTeX or Typst label, hash sources to 12 hex, derive fresh, stale or missing, and rewrite a block's hash (and a cite block's text) as a splice."
    level: behaviour
    runner: {agent: implementer, model: sonnet}
    depends_on: ["3.0"]
    create: [packages/core/src/decks/deckLinks.ts]
    edit:
      - {path: packages/core/src/decks/index.ts, lines: "1-30", why: "export the public names of deckLinks.ts"}
    read:
      - {path: documents/plans/decks/plan.yaml, lines: "20-22", why: "D5"}
      - {path: documents/contracts/decks.md, lines: "1-300", why: "#links (session 1)"}
      - {path: packages/core/src/decks/deckParse.ts, lines: "1-120", why: "DeckModel, DeckBlock.source with ranges (session 1)"}
      - {path: packages/core/src/decks/deckEdit.ts, lines: "1-60", why: "DeckEditResult and setText through applyDeckEdit (session 1)"}
      - {path: packages/core/src/hash/index.ts, lines: "1-20", why: "deriveTextSha256Hex"}
      - {path: packages/core/src/writing/noteLinks/originState.ts, lines: "1-18", why: "the 12-hex origin hash model this follows"}
      - {path: packages/core/src/latex/source.ts, lines: "18-95", why: "scanLatexSource labels with ranges"}
    seams:
      - {path: packages/core/src/decks/deckLinks.ts, signature: "export type DeckLinkKind = \"figure\" | \"eq\" | \"table\" | \"cite\""}
      - {path: packages/core/src/decks/deckLinks.ts, signature: "export type DeckLinkState = \"fresh\" | \"stale\" | \"missing\""}
      - {path: packages/core/src/decks/deckLinks.ts, signature: "export interface DeckLink { block: string; slide: number; kind: DeckLinkKind; target: string; hash: string | null }"}
      - {path: packages/core/src/decks/deckLinks.ts, signature: "export interface DeckLinkSources { readFigure(path: string): Promise<Uint8Array | undefined>; labelSource(label: string): Promise<string | undefined>; citeText(key: string): Promise<string | undefined> }"}
      - {path: packages/core/src/decks/deckLinks.ts, signature: "export interface DeckLinkStatus { state: DeckLinkState; hash?: string; text?: string }"}
      - {path: packages/core/src/decks/deckLinks.ts, signature: "export function readDeckLinks(model: DeckModel): DeckLink[]"}
      - {path: packages/core/src/decks/deckLinks.ts, signature: "export function findLabelSource(format: ProjectFormat, text: string, label: string): string | undefined"}
      - {path: packages/core/src/decks/deckLinks.ts, signature: "export function deckLinkHash(content: string | Uint8Array): Promise<string>"}
      - {path: packages/core/src/decks/deckLinks.ts, signature: "export function deriveLinkState(link: DeckLink, sources: DeckLinkSources): Promise<DeckLinkStatus>"}
      - {path: packages/core/src/decks/deckLinks.ts, signature: "export function updateDeckLink(html: string, block: string, hash: string, text?: string): DeckEditResult"}
    decided:
      - "Do not run pnpm gate or any lint; check only with node scripts/agents/run.mjs typecheck core and the tests.command. Tests are hidden; never edit them."
      - "Runtime-neutral, no new dependency; the file starts with a one-line `// <capability>` header and stays under 400 lines."
      - "readDeckLinks: every model block with a source whose ref is `<kind>:<target>` with kind figure|eq|table|cite and a non-empty target without whitespace, in source order; hash is the data-source-hash value when it is 12 lowercase hex, else null. Other refs are skipped (the validator reports them)."
      - "deckLinkHash: the first 12 characters of deriveTextSha256Hex(content)."
      - "findLabelSource: LaTeX — the innermost \\begin{<env>} … \\end{<env>} pair enclosing `\\label{<label>}` (comments skipped), from the backslash of \\begin to the closing brace of \\end, trimmed; a label outside any environment gives undefined. Typst — the text from the start of the paragraph holding `<label>` (after the previous blank line or the file start) up to and including `<label>`, trimmed. An absent label gives undefined."
      - "deriveLinkState: the current content is readFigure(target) bytes for figure, labelSource(target) for eq and table, citeText(target) for cite; undefined gives {state: missing}; otherwise hash = deckLinkHash(content) and state fresh when it equals link.hash, else stale (a null link hash is stale); text is the content for cite links. Hosts build citeText from formatCitations(paper).apa of the library record, or the trimmed .bib entry text when the library lacks the key, and labelSource from findLabelSource over the manuscript files."
      - "updateDeckLink: the block must exist and have data-source (else {ok: false}); hash must be 12 lowercase hex (else {ok: false}). It replaces the data-source-hash value range, or inserts ` data-source-hash=\"<hash>\"` right after the data-source attribute when absent. With text, for a cite block it then applies setText to leaf 0 (the block needs a leaf, else {ok: false}); text is ignored for other kinds. Every other byte is kept."
    acceptance:
      - {id: 3.1a, check: "readDeckLinks lists figure, eq, table and cite links with block, slide, target and hash (null when absent or malformed)"}
      - {id: 3.1b, check: "findLabelSource gives the trimmed enclosing environment in LaTeX and the paragraph up to the label in Typst, undefined for an absent label"}
      - {id: 3.1c, check: "deriveLinkState gives fresh, stale and missing for each kind; deckLinkHash is the first 12 hex of SHA-256"}
      - {id: 3.1d, check: "updateDeckLink rewrites or inserts the hash and a cite block's text, keeping every other byte; bad block or hash gives {ok: false}"}
      - {id: A9, check: "a block linked to a figure, an equation and a citation shows stale after the source changes and fresh after updateDeckLink"}
    tests:
      hidden: []
      command: "node scripts/agents/run.mjs test core --spec 3.1 --plan decks -- packages/core/__tests__/decks/deckLinks.test.ts"
    commands: ["node scripts/agents/run.mjs typecheck core"]
    do_not_touch: [packages/core/src/qmd/]

  - id: "3.2"
    plan: decks
    sha: 54b5c6f9
    goal: "A dependency-free QR encoder (byte mode, ECC M, versions 1 to 10, mask by penalty) and a one-line SVG writer without style attributes, exported from the core root."
    level: behaviour
    runner: {agent: implementer, model: opus}
    depends_on: ["3.0"]
    create: [packages/core/src/qr/index.ts, packages/core/src/qr/qrEncode.ts, packages/core/src/qr/qrSvg.ts]
    edit:
      - {path: packages/core/src/qr/index.ts, lines: "1-10", why: "new barrel: header comment, exports of qrEncode.ts and qrSvg.ts"}
      - {path: packages/core/src/index.ts, lines: "1-40", why: "add `export * from \"./qr/index.js\";` after the decks export"}
    read:
      - {path: documents/plans/decks/plan.yaml, lines: "41-43", why: "D12 QR"}
      - {path: packages/core/src/hash/index.ts, lines: "1-2", why: "barrel style of a small core domain"}
    seams:
      - {path: packages/core/src/qr/qrEncode.ts, signature: "export function encodeQr(text: string): boolean[][]"}
      - {path: packages/core/src/qr/qrEncode.ts, signature: "export function qrVersionFor(byteLength: number): number"}
      - {path: packages/core/src/qr/qrSvg.ts, signature: "export interface QrSvgOptions { margin?: number; label?: string }"}
      - {path: packages/core/src/qr/qrSvg.ts, signature: "export function formatQrSvg(matrix: readonly (readonly boolean[])[], options?: QrSvgOptions): string"}
    decided:
      - "Do not run pnpm gate or any lint; check only with node scripts/agents/run.mjs typecheck core and the tests.command. Tests are hidden; never edit them."
      - "Runtime-neutral, no dependency; each file starts with a one-line `// <capability>` header and stays under 400 lines (Reed-Solomon and the version tables may sit in a private qrTables.ts)."
      - "encodeQr follows ISO/IEC 18004: the text as UTF-8 bytes in byte mode (mode 0100, 8-bit count for versions 1-9, 16-bit for 10), error correction level M, the smallest version 1..10 that fits (qrVersionFor; M byte capacities 14, 26, 42, 62, 84, 106, 122, 152, 180, 213), terminator and 0xEC/0x11 padding, Reed-Solomon over GF(256) with polynomial 0x11D, block split and interleave per the standard table, finder, separator, timing, alignment and dark module, format information (BCH, mask 0x5412) and version information from version 7."
      - "The mask is the one of 0..7 with the lowest total penalty (the four N1..N4 rules of the standard: runs of 5+ as 3 + (run - 5), 2x2 blocks 3 each, finder-like 1011101 with 4 light modules 40 each in rows and columns, dark ratio 10 per 5% step from 50%); ties go to the lowest mask number."
      - "encodeQr returns a fresh square matrix of size 17 + 4 x version, true for dark, matrix[row][column]; text over 213 bytes throws RangeError `Text is too long for a QR code (213 bytes at most).`. qrVersionFor throws the same RangeError over 213."
      - "formatQrSvg: margin default 4 modules; n = size + 2 x margin; output is one line `<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 n n\" shape-rendering=\"crispEdges\" role=\"img\" aria-label=\"<label>\">` (label default `QR code`, escaped), a `<rect width=\"n\" height=\"n\" fill=\"#fff\"/>`, one `<path fill=\"#000\" d=\"…\"/>` made of `M<x> <y>h1v1h-1z` per dark module (x, y include the margin), and `</svg>`; no style attribute, no newline."
    acceptance:
      - {id: 3.2a, check: "qrVersionFor and encodeQr pick the smallest version for 1, 14, 15, 106, 107 and 213 bytes and refuse 214"}
      - {id: 3.2b, check: "the matrix has the finder, timing, alignment and dark-module patterns and format bits for level M and its mask; versions 7 to 10 carry version bits"}
      - {id: 3.2c, check: "decoding the matrix (unmask, read, Reed-Solomon check) gives the input bytes for ASCII, UTF-8 and a share URL `https://labshelf.org/share/#…` of 120 characters"}
      - {id: 3.2d, check: "the chosen mask has the lowest penalty of the eight; the same text gives the same matrix"}
      - {id: 3.2e, check: "formatQrSvg writes one line with the viewBox, margin, one path of dark modules, an aria-label and no style attribute"}
    tests:
      hidden: []
      command: "node scripts/agents/run.mjs test core --spec 3.2 --plan decks -- packages/core/__tests__/qr/qrEncode.test.ts packages/core/__tests__/qr/qrSvg.test.ts"
    commands: ["node scripts/agents/run.mjs typecheck core"]
    do_not_touch: [packages/core/src/qmd/]

  - id: "3.3"
    plan: decks
    sha: 54b5c6f9
    goal: "The base layout and print CSS of a deck size, shared by the editor frame and the export, and exportDeckHtml: one offline HTML file with assets and fonts as data URIs, the theme inlined, math pre-rendered, keyboard navigation and `#print`."
    level: contract
    runner: {agent: implementer, model: opus}
    depends_on: ["3.0", "3.1"]
    create: [packages/core/src/decks/deckLayoutCss.ts, packages/core/src/decks/deckExport.ts]
    edit:
      - {path: packages/core/src/decks/index.ts, lines: "1-35", why: "export the public names of deckLayoutCss.ts and deckExport.ts"}
    read:
      - {path: documents/plans/decks/plan.yaml, lines: "26-28", why: "D7 base layout CSS"}
      - {path: documents/plans/decks/plan.yaml, lines: "38-40", why: "D11 single-file HTML"}
      - {path: packages/core/src/decks/deckParse.ts, lines: "1-120", why: "parseDeck model and ranges (session 1)"}
      - {path: packages/core/src/decks/deckTokens.ts, lines: "1-120", why: "tokenizeDeckHtml for attribute ranges (session 1)"}
      - {path: packages/core/src/decks/deckValidate.ts, lines: "1-60", why: "validateDeck: an export refuses a deck with errors (session 1)"}
      - {path: packages/core/src/decks/deckSizes.ts, lines: "1-150", why: "deckCanvasPx, formatDeckSize (session 1)"}
      - {path: packages/core/src/latex/hover/renderMathSvg.ts, lines: "20-50", why: "the math renderer hosts pass in; never import MathJax here"}
    seams:
      - {path: packages/core/src/decks/deckLayoutCss.ts, signature: "export function deckBaseCss(size: DeckSize): string"}
      - {path: packages/core/src/decks/deckLayoutCss.ts, signature: "export function deckPrintCss(size: DeckSize): string"}
      - {path: packages/core/src/decks/deckExport.ts, signature: "export interface DeckExportOptions { theme: string; readAsset(path: string): Promise<Uint8Array | undefined>; renderMath?: (tex: string, display: boolean) => string }"}
      - {path: packages/core/src/decks/deckExport.ts, signature: "export function exportDeckHtml(html: string, options: DeckExportOptions): Promise<string>"}
      - {path: packages/core/src/decks/deckExport.ts, signature: "export function deckAssetMime(path: string): string"}
    decided:
      - "Do not run pnpm gate or any lint; check only with node scripts/agents/run.mjs typecheck core and the tests.command. Tests are hidden; never edit them."
      - "Runtime-neutral, no dependency, no MathJax import (the host passes renderMath, for example renderMathSvg from @labshelf/core/math). Each file starts with a one-line `// <capability>` header and stays under 400 lines."
      - "deckBaseCss(size), with W x H = deckCanvasPx(size): `html,body{margin:0;padding:0}` `[data-slide]{position:relative;box-sizing:border-box;width:<W>px;height:<H>px;overflow:hidden}` `[data-block]{position:absolute;box-sizing:border-box}` `[data-notes]{display:none}` joined by \\n, numbers as formatDeckSize writes them. It is never written into deck.html; session 5's editor frame and the export use it."
      - "deckPrintCss(size): `@page{size:<w><unit> <h><unit>;margin:0}` with the deck's own unit and numbers, then `@media print{[data-slide]{break-after:page}[data-slide]:last-of-type{break-after:auto}}`."
      - "deckAssetMime by lowercase extension: png image/png, jpg and jpeg image/jpeg, gif image/gif, svg image/svg+xml, webp image/webp, avif image/avif, woff font/woff, woff2 font/woff2, ttf font/ttf, otf font/otf, pdf application/pdf, else application/octet-stream."
      - "exportDeckHtml: when validateDeck(html, {theme}) has an error it rejects with Error `The deck has errors: <codes joined by , >.`. Otherwise the result is the deck source with only these splices: the theme link is replaced by `<style data-deck-theme>` + the theme with each url() inlined + `</style>`, preceded by `<style data-deck-base>` + deckBaseCss + \\n + deckPrintCss + `</style>`; each relative asset reference the validator checks (src, srcset candidates, poster, link href, SVG image and use href, url() in style attributes and style elements) becomes `data:<mime>;base64,<bytes>` from readAsset (a reference readAsset gives undefined for is kept as written); each data-math element's content becomes renderMath(tex, display) with the TeX kept in a `data-tex` attribute added to the start tag (math left as escaped TeX when renderMath is absent or throws); `<script data-deck-runtime>…</script>` is inserted right before `</body>`."
      - "The runtime script (under 2 KB, no external reference) scales the current slide to fit the window, shows one slide at a time on screen, navigates with ArrowRight, ArrowDown, Space, PageDown (next), ArrowLeft, ArrowUp, PageUp (previous), Home and End, keeps the slide number in location.hash as `#<n>` (1-based), and when location.hash is `#print` shows all slides and calls window.print() after load; in print media all slides show at full size."
      - "The output has no reference to http:, https: or `//` outside `<a href>` and the xmlns of inline SVG, and is deterministic for the same input."
    acceptance:
      - {id: 3.3a, check: "deckBaseCss and deckPrintCss give the stated CSS for a talk in px and posters in mm and in"}
      - {id: 3.3b, check: "exportDeckHtml inlines the theme, images, srcset, CSS url() fonts as data URIs with the right mime and keeps every other byte of the deck"}
      - {id: 3.3c, check: "math elements hold the rendered SVG and a data-tex attribute; without renderMath the TeX stays"}
      - {id: 3.3d, check: "the runtime script is present once before </body>; a deck with errors rejects naming the codes"}
      - {id: A7, check: "the single-file HTML of the sample talk and poster has no external URL outside <a href> and opens offline (offline part of A7)"}
    tests:
      hidden: []
      command: "node scripts/agents/run.mjs test core --spec 3.3 --plan decks -- packages/core/__tests__/decks/deckLayoutCss.test.ts packages/core/__tests__/decks/deckExport.test.ts"
    commands: ["node scripts/agents/run.mjs typecheck core"]
    do_not_touch: [packages/core/src/qmd/]
