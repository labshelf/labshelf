depends_on: ["1"]
owns: [packages/core/src/decks/, packages/core/src/qr/, packages/core/src/index.ts, packages/core/__tests__/decks/, packages/core/__tests__/qr/, documents/plans/decks/]
status: pending
packages:
  - id: "3.0"
    plan: decks
    sha: 54b5c6f9
    goal: "write the hidden tests of 3.1, 3.2, 3.3, fill their tests.hidden in this file and prove them red with plan red"
    level: task
    runner: {agent: tester, model: opus}
    depends_on: []
    edit:
      - {path: documents/plans/decks/sessions/3.yaml, lines: "1-400", why: "fill tests.hidden of 3.1, 3.2 and 3.3 with the written test paths"}
