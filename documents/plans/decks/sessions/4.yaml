      - "findChromium order: (1) env LABSHELF_CHROMIUM when set and exists →
        source env (set but missing: skipped); (2) system: the PATH names
        google-chrome, google-chrome-stable, chromium, chromium-browser,
        microsoft-edge, microsoft-edge-stable, brave-browser, chrome, msedge,
        brave through which, then the install paths of the platform through
        exists, first hit wins → source system; (3) managed() when given and it
        gives a path → source managed; else undefined."
      - "Install paths. darwin: for base in /Applications and
        <homeDir>/Applications: Google Chrome.app/Contents/MacOS/Google Chrome,
        Microsoft Edge.app/Contents/MacOS/Microsoft Edge, Brave
        Browser.app/Contents/MacOS/Brave Browser,
        Chromium.app/Contents/MacOS/Chromium. win32: for base in env
        PROGRAMFILES, PROGRAMFILES(X86), LOCALAPPDATA (those set, keys compared
        case-insensitively): Google\\Chrome\\Application\\chrome.exe,
        Microsoft\\Edge\\Application\\msedge.exe,
        BraveSoftware\\Brave-Browser\\Application\\brave.exe,
        Chromium\\Application\\chrome.exe, joined with \\. linux and others:
        /usr/bin/google-chrome, /usr/bin/google-chrome-stable,
        /usr/bin/chromium, /usr/bin/chromium-browser, /snap/bin/chromium,
        /usr/bin/microsoft-edge, /usr/bin/brave-browser. findSystemChromium
        wires process.env, process.platform, os.homedir(), fs.access and
        findExecutable."
      - "printDeckPdf: writes html to deck.html in a fresh mkdtemp folder, runs
        chromium with args `--headless`, `--disable-gpu`, `--no-first-run`,
        `--no-default-browser-check`, `--no-pdf-header-footer`,
        `--user-data-dir=<temp>/profile`, `--print-to-pdf=<temp>/deck.pdf`, then
        the pathToFileURL of the html, through run (default runCancellable) with
        cwd the temp folder and timeoutMs default 120000; a non-zero code or a
        missing or empty PDF rejects with Error `Chromium could not print the
        deck: <output tail>`. Returns the PDF bytes; the temp folder is removed
        in every case. Page size comes from the @page rule exportDeckHtml
        writes."
      - "exportDeckPdf: find (default findSystemChromium()) → printDeckPdf and
        write the bytes to out → {kind: pdf, path: out}. When no Chromium is
        found or printing rejects (logged at warn), it writes html to out with
        the .pdf extension replaced by .html (`.html` appended when out has no
        .pdf) and returns {kind: fallback, htmlPath, message: \"No Chromium was
        found, so the deck opened for printing. Install Chrome or Chromium to
        save the PDF automatically.\"} (when printing failed the message starts
        `Chromium could not print the deck, so the deck opened for printing.`
        and keeps the second sentence). It never opens anything itself; the host
        opens htmlPath with `#print`."
    acceptance:
