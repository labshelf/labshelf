schema: session/v1
id: "4"
goal: "Decks export to PDF through Chromium: core finds a system Chromium (env
  override, PATH, per-OS install paths) or a managed chrome-headless-shell
  installed on request under the shared tools lock, prints the single-file HTML
  to a PDF of the deck's page size, and falls back to the print view with a
  message; the terminal gets `labshelf deck export`."
depends_on:
  - "2"
  - "3"
owns:
  [
    packages/core/src/decks/node/,
    packages/core/src/latex/node/index.ts,
    documents/contracts/managed-tools.md,
    packages/terminal/src/cli/,
    packages/core/__tests__/decks/,
    packages/terminal/__tests__/cli/,
    documents/plans/decks/
  ]
status: pending
packages:
