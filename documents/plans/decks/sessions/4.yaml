        Each new file starts with a one-line `// <capability>` header."
      - "chromiumPin returns a fresh copy of one Chrome for Testing Stable
        version of chrome-headless-shell, taken at implementation time from
        https://googlechromelabs.github.io/chrome-for-testing/last-known-good-v\
        ersions-with-downloads.json: keys darwin-arm64 (mac-arm64), darwin-x64
        (mac-x64), linux-x64 (linux64), win32-x64 (win64); linux-arm64 has no
        build and is absent. url is
        `https://storage.googleapis.com/chrome-for-testing-public/<version>/<cft
        platform>/chrome-headless-shell-<cft platform>.zip`; sha256 (64
        lowercase hex) is computed by downloading each zip once while writing
        the pin (note the date in a comment); executable is the path inside the
        zip, `chrome-headless-shell-<cft platform>/chrome-headless-shell`
        (`.exe` on win64)."
      - "Layout: `<toolsDir>/chrome/<version>/` holds the unpacked zip;
        `<toolsDir>/chrome/chrome-pin.json` ({version, sha256}) is written last,
        after the swap; staging folders are
        `<toolsDir>/chrome/.staging-chrome-*`. status() is installed true with
        version and executable (absolute) when chrome-pin.json names the pin
        version and its executable file exists; anything else is installed
        false."
      - "install(): the platform key is `<platform>-<arch>`; without a pin entry
        it rejects with Error `chrome-headless-shell has no build for <key>.`.
        Under withToolLock(toolsDir, \"chrome install\", logger, …):
        downloadVerified(url, sha256, fetchImpl, signal) into the staging
        folder, extractArchive(zip, \"zip\", staging), check the executable
        exists (else reject `The chrome-headless-shell archive has no
        <executable>.`), chmod 755 off Windows, removeQuarantine on darwin,
        rename into chrome/<version> replacing an older one, write
        chrome-pin.json, resolve the absolute executable path. onProgress gets
        `Downloading chrome-headless-shell <version>`, `Unpacking`, `Done`. A
        hash mismatch rejects and leaves no chrome/<version> and no pin file. It
        runs only when a host calls it after the user accepts."
      - "createSharedChromiumProvider builds the provider on
        resolveSharedToolsDir(env, platform, homeDir) with process.arch."
      - "managed-tools.md: #layout gets a `### Chrome` subsection
        (chrome/<version>/, chrome-pin.json, .staging-chrome-*, downloaded only
        when the user accepts, used by deck PDF export after a system Chromium);
        #lock says only LabShelf apps change tex/, python/ and chrome/."
