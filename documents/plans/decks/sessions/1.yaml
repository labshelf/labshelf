  - id: "1.4"
    plan: decks
    sha: 54b5c6f9
    goal: "applyDeckEdit applies move, resize, setText, slide and block operations and size changes as text splices on the parsed ranges, keeping every other byte, with results that validate."
    level: behaviour
    runner: {agent: implementer, model: opus}
    depends_on: ["1.1", "1.2", "1.3"]
    create: [packages/core/src/decks/deckEdit.ts]
    edit:
      - {path: packages/core/src/decks/index.ts, lines: "1-25", why: "export applyDeckEdit and its types"}
    read:
      - {path: documents/contracts/decks.md, lines: "1-300", why: "#vocabulary and #sizes"}
      - {path: documents/plans/decks/plan.yaml, lines: "8-19", why: "D1, D2 scale rule, D4 splices"}
      - {path: packages/core/src/decks/deckParse.ts, lines: "1-400", why: "parseDeck and the ranges the splices use (from 1.2)"}
      - {path: packages/core/src/decks/deckSizes.ts, lines: "1-150", why: "formatDeckSize, isDeckSizeAllowed, deckCanvasPx (from 1.2)"}
      - {path: packages/core/src/decks/deckValidate.ts, lines: "1-400", why: "the tests validate edit results (from 1.3)"}
      - {path: packages/core/src/decks/themeCss.ts, lines: "1-200", why: "theme edits stay setThemeProperty; the A3 tests combine both"}
    seams:
      - {path: packages/core/src/decks/deckEdit.ts, signature: "export type DeckEdit = { kind: \"move\"; block: string; left: number; top: number } | { kind: \"resize\"; block: string; left: number; top: number; width: number; height: number } | { kind: \"setText\"; block: string; leaf: number; text: string } | { kind: \"moveSlide\"; from: number; to: number } | { kind: \"addSlide\"; at: number; html?: string } | { kind: \"duplicateSlide\"; slide: number } | { kind: \"deleteSlide\"; slide: number } | { kind: \"addBlock\"; slide: number; html: string } | { kind: \"deleteBlock\"; block: string } | { kind: \"setSize\"; size: DeckSize; scale: boolean }"}
      - {path: packages/core/src/decks/deckEdit.ts, signature: "export type DeckEditResult = { ok: true; html: string } | { ok: false; error: string }"}
      - {path: packages/core/src/decks/deckEdit.ts, signature: "export function applyDeckEdit(html: string, edit: DeckEdit): DeckEditResult"}
    decided:
      - "Do not run pnpm gate or any lint; check only with node scripts/agents/run.mjs typecheck core and the tests.command. Tests are hidden; never edit them."
      - "No new dependency; no DOM, no Node API (runtime-neutral). Pure and never throws: every failure is {ok: false, error} with a one-sentence error. Over 400 lines, move slide operations into a private file in packages/core/src/decks/ not exported from the barrel."
      - "Each edit parses html with parseDeck and splices only the ranges it names; every byte outside the splices stays. No model gives {ok: false}. An unknown block id, a slide or leaf index out of range, a non-finite number, or a negative width or height gives {ok: false}."
      - "Numbers are written rounded to 2 decimals (Math.round(n * 100) / 100), trailing zeros dropped, -0 as 0, followed by px (12.5px, 3px)."
      - "move writes left and top; resize writes left, top, width and height. An existing declaration's value range (rectRanges) is replaced by the new value. A missing declaration is appended to the style value in the order left, top, width, height: when the value's trimmed text is non-empty and does not end with `;`, a `;` is inserted right after it; then each missing declaration as `<prop>: <n>px;`, preceded by one space unless the value is empty. A block without a style attribute gets ` style=\"<decls>\"` (declarations joined by one space) inserted right before the `>` or `/>` of its start tag."
      - "setText replaces the leaf's contentRange with the text, escaping & as &amp;, < as &lt; and > as &gt;, each \\n written as <br>; the leaf's own start and end tags stay byte for byte (inline markup inside the leaf is replaced). A math leaf takes the TeX the same way."
      - "Line rule for removals: removing a range also removes its line when the range is alone on it (only spaces and tabs before it since the previous line break or start of file, and a line break or end of file right after); then the indentation and the one line break after (\\n or \\r\\n) go too. sep of a slide is \\n followed by the spaces and tabs before its start tag on its line."
      - "addSlide {at, html}: html defaults to `<section data-slide></section>`; at is 0..slides.length; for at < length `html + sep(slides[at])` is inserted at slides[at].range.from; for at = length `sep(last) + html` is inserted at the last slide's range.to; with no slides `html + \\n` is inserted at the end of bodyContentRange. The html must parse as one section with data-slide (else {ok: false}); its block ids must be new. A poster refuses addSlide and duplicateSlide (a poster has exactly one slide)."
      - "duplicateSlide {slide}: the slide's source text, with each data-block id x renamed to x-n for the smallest n from 2 such that x-n is used neither in the deck nor earlier in the copy, inserted as `sep + copy` at the slide's range.to. A renamed id longer than 40 characters gives {ok: false}."
      - "deleteSlide {slide}: removes the slide range by the line rule; deleting the only slide gives {ok: false}. moveSlide {from, to}: both in 0..length-1; from = to returns html unchanged; otherwise the slide text is removed by the line rule and inserted as with addSlide at index to of the remaining slides."
      - "addBlock {slide, html}: html must parse as exactly one element with a valid, new data-block id (else {ok: false}); it is inserted unchanged right before the slide's notes start tag when the slide has notes, else right before the slide's `</section>`. deleteBlock {block}: removes the block range by the line rule."
      - "setSize {size, scale}: isDeckSizeAllowed(model.kind, size) must hold (else {ok: false}); the data-deck-size value (sizeRange) becomes formatDeckSize(size). When scale is true and the current size is valid, each block with a rect gets left and width times newWidth / oldWidth and top and height times newHeight / oldHeight (deckCanvasPx), written as move/resize write them; blocks without a rect are left as they are. scale with an invalid current size gives {ok: false}; scale false changes only the size attribute."
      - "Theme changes are not a DeckEdit: they go through setThemeProperty on theme.css (1.2)."
    acceptance:
      - {id: 1.4a, check: "move and resize replace only the four values (and append missing declarations or the style attribute as stated), keeping other declarations"}
      - {id: 1.4b, check: "setText escapes &, <, > and newlines, keeps the leaf's tags and touches nothing else"}
      - {id: 1.4c, check: "addSlide, duplicateSlide (ids renamed -2, -3), deleteSlide and moveSlide give the stated text; a poster refuses a second slide; the last slide cannot be deleted"}
      - {id: 1.4d, check: "addBlock and deleteBlock insert and remove one block; a duplicate id is refused"}
      - {id: 1.4e, check: "setSize writes the size and scales block geometry only when scale is set; a size not allowed for the kind is refused"}
      - {id: 1.4f, check: "unknown block, out-of-range index and bad numbers give {ok: false} and never throw"}
