      - {path: packages/core/src/decks/deckParse.ts, signature: "export interface DeckBlock { id: string; slide: number; range: DeckRange; startTag: DeckRange; styleRange: DeckRange | null; rect: DeckRect | null; rectRanges: { left?: DeckRange; top?: DeckRange; width?: DeckRange; height?: DeckRange }; leaves: DeckLeaf[]; source?: { ref: string; hash?: string; range: DeckRange; hashRange?: DeckRange } }"}
