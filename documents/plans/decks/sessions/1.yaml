    decided:
      - "Headings give the anchors (node scripts/docs/doc.mjs contracts/decks lists them). Present tense, English, no history."
      - "#folders: decks live only in `talks/<name>/` and `posters/<name>/` at the project root; the deck is `<folder>/deck.html`, its theme `<folder>/theme.css`; assets are any files inside the folder (suggested `assets/`), referenced by relative paths that stay inside it; labshelf.yaml is not involved (decks are found by folder)."
      - "#vocabulary: the root attributes data-deck, data-deck-version=\"1\", data-deck-size; the single theme link in head; slides as `<section data-slide>` direct children of body (a poster has exactly one); blocks as direct children of a slide with data-block id `^[a-z][a-z0-9-]{0,39}$` unique in the deck and an inline style with left, top, width, height in px (at most 2 decimals; other declarations kept); speaker notes as one `<aside data-notes>` direct child of a slide; math as `<span data-math>` and `<div data-math=\"display\">` holding TeX; the text-leaf definition of D1 (a block element itself is not a leaf, so text meant to be edited sits in an element inside the block); every non-void element closed explicitly, `/>` accepted as an empty element; inside a block HTML and CSS are free. Ends with a short complete example talk."
      - "#sizes: the size syntax, the presets of D2 with their ids and labels from spec 1.2, the custom ranges, the canvas rule (talk px as written; poster physical size at 96 px/in, 25.4 mm/in, rounded to 2 decimals) and the scale rule on size change."
      - "#theme: theme values are CSS custom properties in the first `:root` rule of theme.css; the editor lists and edits only those; an edit changes only the value of one property (appended at the end of the rule when missing, a new `:root` rule at the end of the file when there is none)."
      - "#links: data-source=\"figure:<project path>|eq:<label>|table:<label>|cite:<key>\" and data-source-hash=\"<12 lowercase hex>\" on a block; what each hash is taken of (D5) through deriveTextSha256Hex of core/hash; states fresh, stale, missing; Update rewrites the hash (cite blocks also their text)."
      - "#diagnostics: the diagnostic shape {code, severity, slide?, block?, file?, line, column, message, hint}, the sort order, the rule that errors block an MCP write and warnings never do, that an invalid deck opens read-only, and the code table copied from spec 1.3 decided (code, severity, trigger), one row per code DECK001 to DECK024."
      - "#mcp: a placeholder paragraph saying session 2 fills it with the deck tools (deck_rules, project_context, deck_list, deck_read, deck_create, deck_edit, deck_validate)."
