    decided:
      - "Do not run pnpm gate or any lint; check only with node scripts/agents/run.mjs typecheck core and the tests.command. Tests are hidden; never edit them."
      - "No new dependency; no DOM, no Node API in these files (runtime-neutral, they run in Node for MCP). Each file stays under 400 lines."
      - "All ranges are [from, to) offsets in UTF-16 code units of the input string. Line and column are 1-based; column counts UTF-16 code units from the line start; a line ends at \\n (\\r\\n counts as one break). deckLineColumn(text, offset) gives them for any offset 0..text.length."
      - "parseDeckSize: `<w>x<h><unit>` with lowercase x and unit, no spaces. px: positive integers without leading zeros. mm and in: positive numbers with at most 1 decimal. Anything else is null. No range check (that is isDeckSizeAllowed). formatDeckSize writes the same syntax with trailing zeros dropped (`841x1189mm`, `36x48in`, `100.5x200mm`); parseDeckSize(formatDeckSize(s)) equals s."
      - "isDeckSizeAllowed: talk needs px with each side 320..7680; poster needs mm or in with each side (in converted at 25.4 mm/in) 100..2000 mm; bounds inclusive."
      - "deckCanvasPx: px as written; mm as value / 25.4 * 96; in as value * 96; each side rounded to 2 decimals (A0 portrait gives 3178.58 x 4493.86)."
      - "listDeckSizePresets, in this order. talk: {id talk-16-9, label \"16:9\", 1920x1080px}, {talk-4-3, \"4:3\", 1440x1080px}, {talk-16-10, \"16:10\", 1920x1200px}. poster: a0-portrait \"A0 portrait\" 841x1189mm, a0-landscape \"A0 landscape\" 1189x841mm, a1-portrait 594x841mm, a1-landscape 841x594mm, a2-portrait 420x594mm, a2-landscape 594x420mm, arch-e-portrait \"ARCH E portrait\" 36x48in, arch-e-landscape \"ARCH E landscape\" 48x36in, poster-36x48in \"36 × 48 in\" 36x48in, poster-48x36in \"48 × 36 in\" 48x36in (× is U+00D7; A1 and A2 labels follow the A0 pattern). A fresh array each call."
      - "tokenizeDeckHtml: tokens in source order covering doctype, comments, start tags (attribute names lowercased, values entity-decoded; value null for a bare attribute; valueRange is inside the quotes), end tags (name lowercased) and text (entity-decoded: amp, lt, gt, quot, apos, nbsp and numeric references; unknown references kept as written). script, style, textarea and title content up to the matching end tag is one text token with raw: true and no decoding. Problems (never thrown): unterminated comment, tag or quoted attribute value, a duplicate attribute in one tag."
      - "Tree building in parseDeck: void elements are area base br col embed hr img input link meta source track wbr; a start tag ending in `/>` is an empty element; every other element needs an explicit end tag. An end tag closes the nearest open element of that name, and each open element it skips is a problem (`<name> is not closed`); an end tag with no open match is a problem and is ignored; elements still open at the end are problems. No implied tags (a missing </p> is a problem)."
      - "parseDeck returns no model only when there is no html element or no body element inside it; problems then still lists the markup problems. Otherwise a model is always returned, however wrong its content: kind is data-deck when talk or poster else null; version is the data-deck-version value or null; size is parseDeckSize of data-deck-size or null; sizeRange is the value range of data-deck-size or null; themeLink is the range of the first link element with data-deck-theme or null."
      - "The model holds only what sits where D1 puts it: slides are section elements with data-slide that are direct children of body; blocks are elements with data-block that are direct children of a slide (in source order, slide is the slide index); notes is the first aside with data-notes that is a direct child of the slide. Elements elsewhere are not in the model (the validator finds them from tokens). range spans the start tag to the end of the end tag; contentRange spans what lies between them; startTag is the block's start tag range."
      - "Block style: styleRange is the value range of the style attribute (inside the quotes) or null. Declarations split on `;` outside parentheses and quotes; property names compare lowercase; for left, top, width, height the last declaration counts and rectRanges holds its value range, trimmed. rect is set only when all four values match `^-?\\d+(\\.\\d{1,2})?px$`; width and height may not be negative; otherwise rect is null."
      - "Leaves: an element inside a block (not the block itself) whose children are only text, br, the phrasing elements a b i em strong u s sub sup small mark code span, or math elements; elements inside a leaf are not leaves; an empty element that is not void is a leaf. A `<span data-math>` or `<div data-math=\"display\">` is a leaf with math inline or display. leaves are in source order. text is the decoded text content with each br as \\n and math as its TeX source."
      - "Block source: data-source value as ref with range its value range; data-source-hash value as hash with hashRange. Notes text is the decoded text content."
      - "readThemeProperties: the declarations whose names start with `--` in the first rule whose selector, trimmed with comments removed, is exactly `:root`; top-level rules only (rules inside @media and other at-rules are skipped); comments and strings are skipped when scanning; value is trimmed; range is the trimmed value's range; source order, duplicates kept. No :root rule gives []."
      - "setThemeProperty: name must match `^--[A-Za-z0-9_-]+$` and value must be non-empty and contain none of ; { } (else throws RangeError). It replaces the value range of the last declaration of that name in the first :root rule. When the rule lacks it, it inserts before the rule's `}`: a `;` after the last declaration when that one has none, then `\\n  <name>: <value>;\\n` with the whitespace before `}` kept after it. When no :root rule exists it appends `:root {\\n  <name>: <value>;\\n}\\n` to the css, preceded by \\n when the css is non-empty and does not end with one. Every other byte is kept."
      - "The barrel decks/index.ts exports the public names of deckSizes.ts, deckParse.ts (including DeckRange and DeckParseProblem re-exported from deckTokens.ts) and themeCss.ts; tokenizeDeckHtml and deckLineColumn stay private to the domain (1.3 imports them from ./deckTokens.js)."
    acceptance:
      - {id: 1.2a, check: "parseDeckSize and formatDeckSize round-trip valid sizes and reject malformed ones; isDeckSizeAllowed enforces the D2 ranges and units; deckCanvasPx converts mm and in at 96 px/in"}
      - {id: 1.2b, check: "listDeckSizePresets returns the D2 presets with the ids, labels and sizes in the order stated"}
      - {id: 1.2c, check: "parseDeck of a sample talk gives kind, version, size, theme link, slides, blocks with rect and the ranges whose slices are the expected source text"}
      - {id: 1.2d, check: "leaves, math leaves, notes and data-source are found; elements out of place are left out of the model"}
      - {id: 1.2e, check: "unclosed, mismatched and stray tags are problems with line and column; a document without html or body has no model"}
      - {id: 1.2f, check: "readThemeProperties lists the first :root rule's custom properties; setThemeProperty replaces, appends and creates a :root rule keeping every other byte"}
    tests:
      hidden: [documents/plans/decks/tests/1.2/packages/core/__tests__/decks/deckSizes.test.ts, documents/plans/decks/tests/1.2/packages/core/__tests__/decks/deckParse.test.ts, documents/plans/decks/tests/1.2/packages/core/__tests__/decks/themeCss.test.ts]
      command: "node scripts/agents/run.mjs test core --spec 1.2 --plan decks -- packages/core/__tests__/decks/deckSizes.test.ts packages/core/__tests__/decks/deckParse.test.ts packages/core/__tests__/decks/themeCss.test.ts"
    commands: ["node scripts/agents/run.mjs typecheck core"]
    do_not_touch: [packages/core/src/qmd/]

  - id: "1.3"
    plan: decks
    sha: 54b5c6f9
    goal: "validateDeck returns deterministic, sorted diagnostics with code, severity, location and hint for every D1 to D3 and D5 rule, and listDeckRules lists the rules for deck_rules."
    level: contract
    runner: {agent: implementer, model: opus}
    depends_on: ["1.1", "1.2"]
    create: [packages/core/src/decks/deckValidate.ts]
    edit:
      - {path: packages/core/src/decks/index.ts, lines: "1-20", why: "export validateDeck, listDeckRules and their types"}
    read:
      - {path: documents/contracts/decks.md, lines: "1-300", why: "#vocabulary, #links and #diagnostics"}
      - {path: documents/plans/decks/plan.yaml, lines: "8-22", why: "D1, D2, D3, D5"}
      - {path: packages/core/src/decks/deckTokens.ts, lines: "1-300", why: "tokenizeDeckHtml, deckLineColumn, DeckRange (from 1.2)"}
      - {path: packages/core/src/decks/deckParse.ts, lines: "1-400", why: "parseDeck and the model (from 1.2)"}
      - {path: packages/core/src/decks/deckSizes.ts, lines: "1-150", why: "parseDeckSize, isDeckSizeAllowed, deckCanvasPx (from 1.2)"}
      - {path: packages/core/src/decks/themeCss.ts, lines: "1-200", why: "readThemeProperties for the theme check (from 1.2)"}
    seams:
      - {path: packages/core/src/decks/deckValidate.ts, signature: "export type DeckSeverity = \"error\" | \"warning\""}
      - {path: packages/core/src/decks/deckValidate.ts, signature: "export interface DeckDiagnostic { code: string; severity: DeckSeverity; slide?: number; block?: string; file?: \"theme.css\"; line: number; column: number; message: string; hint: string }"}
      - {path: packages/core/src/decks/deckValidate.ts, signature: "export interface DeckRule { code: string; severity: DeckSeverity; summary: string; hint: string }"}
      - {path: packages/core/src/decks/deckValidate.ts, signature: "export interface DeckValidateOptions { theme?: string; files?: ReadonlySet<string> }"}
      - {path: packages/core/src/decks/deckValidate.ts, signature: "export function validateDeck(html: string, options?: DeckValidateOptions): DeckDiagnostic[]"}
      - {path: packages/core/src/decks/deckValidate.ts, signature: "export function listDeckRules(): DeckRule[]"}
    decided:
      - "Do not run pnpm gate or any lint; check only with node scripts/agents/run.mjs typecheck core and the tests.command. Tests are hidden; never edit them."
      - "No new dependency; no DOM, no Node API (runtime-neutral). Pure: no clock, no randomness; never throws (any input string gives a diagnostic list). Over 400 lines, move rule groups into private files in packages/core/src/decks/ (for example deckValidateAssets.ts) not exported from the barrel."
      - "Codes and severities (the table copied into decks.md#diagnostics). DECK001 error: no html element, no body, or data-deck missing or not talk|poster. DECK002 error: data-deck-version missing or not \"1\". DECK003 error: data-deck-size missing, malformed (parseDeckSize null) or outside the D2 range for its kind. DECK004 error: the size unit does not fit the kind (talk with mm or in, poster with px); reported instead of DECK003 for that case. DECK005 error: no slide (body has no `<section data-slide>` child). DECK006 error: a poster with more than one slide (on each slide after the first). DECK007 error: an element with data-slide that is not a section direct child of body. DECK008 error: theme link missing, more than one (on each extra), not in head, or without rel=\"stylesheet\" and href=\"theme.css\"."
      - "DECK009 error: an element with data-block that is not a direct child of a slide, or that is inside another block. DECK010 error: a block id that does not match `^[a-z][a-z0-9-]{0,39}$`, or repeats an earlier id (on the repeat). DECK011 error: a block whose left, top, width or height is missing from its style or not `<number>px` with at most 2 decimals, or a negative width or height. DECK012 warning: a block whose rect leaves the slide canvas (left or top below 0, left+width or top+height above deckCanvasPx); only when size and rect are valid. DECK013 error: a script element, an attribute whose name starts with on, or a javascript: URL in any attribute (value trimmed, ASCII whitespace and control characters removed, compared case-insensitively). DECK014 error: an iframe, object, embed, frame, frameset, form or base element, or a meta with http-equiv refresh (case-insensitive)."
      - "DECK015 error: an unsafe asset reference: an absolute path (`/`), a scheme other than data: (http:, https:, file:, blob: and any other), a protocol-relative `//`, or a relative path whose normalised form leaves the folder (`..` above the root). Checked in src, each srcset candidate, poster, href of link, href and xlink:href of SVG image and use, and every CSS url() in style attributes, style elements and the theme. href of `<a>` is not an asset (only DECK013 applies to it). A url() of only `#fragment` is allowed. DECK016 warning: when options.files is given, a safe relative reference whose normalised path (leading ./ removed, %xx decoded, ?query and #fragment dropped) is not in files; data: URLs and fragments are never checked. theme.css itself is referenced by the theme link and is checked against files the same way."
      - "DECK017 error: a slide with more than one notes element (on each extra), or an aside data-notes that is not a direct child of a slide. DECK018 warning: a notes element in a poster. DECK019 error: a data-math element whose TeX has unbalanced braces ({ and } not preceded by a backslash; a } before its { counts). DECK020 error: data-source on an element that is not a block, a value not of the form figure:<path>|eq:<label>|table:<label>|cite:<key> with a non-empty rest without whitespace, a figure path that is absolute or leaves the project, or a data-source-hash that is not 12 lowercase hex. DECK021 warning: a block with data-source and no data-source-hash. DECK022 warning: heavy CSS: any backdrop-filter declaration, a filter declaration inside @keyframes, or a transition or transition-property naming filter; in style attributes, style elements and the theme. DECK023 error: malformed markup: every problem from tokenizeDeckHtml and parseDeck (unterminated comment or tag or quote, duplicate attribute, unclosed, mismatched or stray tag). DECK024 warning: options.theme is given and its first :root rule has no custom property (readThemeProperties empty)."
      - "Each rule yields one diagnostic per occurrence. Location: line and column of the offending start tag, or of the attribute name for attribute rules, of `url(` for CSS references, of the declaration's property name for CSS rules, of the data-deck-size value for DECK003/DECK004, of the `<body` tag for DECK005 (1:1 when there is no body), and 1:1 for DECK001 when there is no html element and DECK024. slide is the 0-based index of the model slide holding the location and block the id of the model block holding it, each only when one holds it. Diagnostics found in options.theme carry file \"theme.css\" with line and column in the theme text."
      - "Rules run in this scope: DECK013, DECK014, DECK015, DECK016, DECK019, DECK022 and DECK023 on every input from tokens; the rest need the model (when parseDeck gives none, DECK001 alone stands for them). Theme rules (DECK015, DECK016, DECK022 on the theme's CSS, and DECK024) run only when options.theme is given."
      - "message is one sentence naming what was found (for example the bad id or the URL); hint equals the rule's hint. Output sorted by deck diagnostics first then theme ones, each by line, column, code; then message for full determinism. Same input gives a deep-equal result."
      - "listDeckRules returns the 24 rules DECK001 to DECK024 in code order, each with the severity above, a one-sentence summary and a one-line fix hint in the imperative (for example DECK011 hint: \"Give the block an inline style with left, top, width and height in px.\"). A fresh array each call."
      - "Sample talk (error-free, used by the tests): `<!doctype html>`, `<html lang=\"en\" data-deck=\"talk\" data-deck-version=\"1\" data-deck-size=\"1920x1080px\">`, a head with meta charset, a title and `<link rel=\"stylesheet\" href=\"theme.css\" data-deck-theme>`, a body with two slides: the first a title block `<div data-block=\"title\" style=\"left: 120px; top: 80px; width: 1680px; height: 200px;\"><h1>Title</h1></div>` and an `<aside data-notes>`; the second a block with a paragraph, a `<div data-math=\"display\">\\frac{a}{b}</div>` and `<img src=\"assets/plot.png\" alt=\"Plot\">`. Theme `:root { --deck-bg: #ffffff; --deck-fg: #1a1a1a; }`, files {theme.css, assets/plot.png}."
