    seams:
      - {path: packages/core/src/share/deckQr.ts, signature: "export interface ShareQrInsert { svgPath: string; svg: string; html: string }"}
      - {path: packages/core/src/share/deckQr.ts, signature: "export function insertShareQr(html: string, link: string, slide: number): { ok: true; insert: ShareQrInsert } | { ok: false; error: string }"}
      - {path: packages/vscode/src/share/node/shareDeck.ts, signature: "export function runShareDeck(deckUri: vscode.Uri, host: ShareHost, ui: { copyText(text: string): Promise<boolean>; info(message: string, ...actions: string[]): Thenable<string | undefined> }): Promise<string | undefined>"}
      - {path: packages/vscode/src/share/node/shareDeck.ts, signature: "export function runInsertQr(deckUri: vscode.Uri, link: string, slide: number): Promise<boolean>"}
    decided:
      - "Do not run pnpm gate or any lint; check only with node scripts/agents/run.mjs typecheck core, vscode and browser and the tests.command. Tests are hidden; never edit them."
      - "No new dependency. ShareHost.shareDeck is `shareDeck(deckPath: string, onProgress: (progress: ShareProgress) => void): Promise<ShareFolderResult>` (same result type as shareFolder; deckPath is the deck.html path in the host's terms); every ShareHost implementation and fake gains it."
      - "insertShareQr(html, link, slide): matrix = encodeQr(link) (3.2), svg = formatQrSvg(matrix, {margin: 4}); svgPath `assets/share-qr.svg`; the block html is `<div data-block=\"<id>\" style=\"left: <l>px; top: <t>px; width: <s>px; height: <s>px;\"><img src=\"assets/share-qr.svg\" alt=\"QR code of the share link\"></div>` with id share-qr (share-qr-2, -3… when taken), s = 20% of the shorter canvas side rounded to an integer, placed at the bottom-right corner with a margin of 4% of the shorter side; html is applyDeckEdit(html, {kind: \"addBlock\", slide, html: block}). A link that encodeQr refuses, or an applyDeckEdit failure, gives {ok: false, error}."
