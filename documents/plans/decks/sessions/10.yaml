    seams:
      - {path: packages/core/src/share/deckShare.ts, signature: "export interface DeckShareManifest { v: 1; kind: \"deck\"; title: string; deck: \"talk\" | \"poster\"; size: string; bytes: number; parts: SharedPdfPart[] }"}
      - {path: packages/core/src/share/deckShare.ts, signature: "export function decodeDeckShareManifest(value: unknown): DeckShareManifest | undefined"}
      - {path: packages/core/src/share/deckShare.ts, signature: "export function sealDeckManifest(linkKey: Uint8Array, shareId: string, manifest: DeckShareManifest): Promise<Uint8Array>"}
      - {path: packages/core/src/share/deckShare.ts, signature: "export function openDeckManifest(linkKey: Uint8Array, shareId: string, sealed: Uint8Array): Promise<DeckShareManifest | undefined>"}
      - {path: packages/core/src/share/deckShare.ts, signature: "export interface BuiltDeckShare { shareId: string; key: Uint8Array; manifest: DeckShareManifest; blobs: { name: string; bytes: Uint8Array }[] }"}
      - {path: packages/core/src/share/deckShare.ts, signature: "export function buildDeckShare(input: { title: string; deck: \"talk\" | \"poster\"; size: string; html: string; partLimits?: { partBytes: number } }): Promise<BuiltDeckShare>"}
      - {path: packages/core/src/share/deckShare.ts, signature: "export function uploadDeckShare(options: { share: BuiltDeckShare; relayUrl: string; backend: ShareBackend; registry: ShareRegistryStore; logger: ILogger; now?: () => Date }): Promise<string>"}
      - {path: packages/core/src/share/deckShare.ts, signature: "export type OpenedAnyShare = { kind: \"folder\"; share: OpenedShare } | { kind: \"deck\"; link: ShareLinkParts; manifest: DeckShareManifest; loadHtml(): Promise<{ ok: true; html: string } | { ok: false; error: LoadPdfError; detail?: string }> }"}
      - {path: packages/core/src/share/deckShare.ts, signature: "export function openAnyShare(text: string, readerFor: (relayUrl: string) => ShareReader): Promise<{ ok: true; opened: OpenedAnyShare } | { ok: false; error: OpenShareError; detail?: string }>"}
    decided:
      - "Do not run pnpm gate or any lint; check only with node scripts/agents/run.mjs typecheck core and the tests.command. Tests are hidden; never edit them."
      - "No new dependency; runtime-neutral (WebCrypto only). shareCrypto.ts, decodeShareManifest, SHARE_MANIFEST_VERSION, sealShareManifest, openShareManifest, buildShare, uploadShare, openShare and their types are not edited (shareFlows.ts changes only ShareEntry and recordOf). The Worker and the link format are unchanged."
      - "Deck manifest key: HKDF-SHA256 over the 16-byte link key, empty salt, info `labshelf-share-deck-manifest`, 256 bits, AES-GCM, implemented in deckShare.ts (shareCrypto's private hkdfBits is copied, not exported). Sealed with sealFrame under FrameContext {shareId, docKey: \"manifest\", kind: \"share-deck-manifest\"}; the JSON is UTF-8 of the manifest object. A paper manifest never opens as a deck and the reverse (different key and AAD)."
      - "Parts reuse the paper blob format: the HTML's UTF-8 bytes are split into parts of at most partLimits.partBytes (default the paper KV_LIMITS part size, 20 MiB), each sealed with sealShareBlob; parts are SharedPdfPart {blob, content, size} so openShareBlob decrypts them; bytes is the total plaintext size. decodeDeckShareManifest needs v 1, kind deck, string title, deck talk|poster, a size parseDeckSize accepts, integer bytes >= 0 and parts whose sizes sum to bytes; unknown fields are dropped; anything else undefined."
      - "buildDeckShare: shareId randomHex(16) and a random 16-byte key as buildShare does. uploadDeckShare follows uploadShare: registry entry {id, folder: title, relayUrl, key, createdAt, blobs, kind: \"deck\"} written first, blobs before the manifest, removeShare on failure; it returns the formatted link (formatShareLink). Revoking a deck uses the existing removeShare unchanged."
      - "openAnyShare: parse and fetch exactly as openShare; then openShareManifest (paper) first, giving {kind: folder, share} identical to what openShare returns; else openDeckManifest, giving kind deck with loadHtml that fetches, opens and joins the parts (errors network, missing, tampered as loadPdf has them); else {ok: false, error: unreadable}. openShare keeps returning unreadable for a deck link (the pre-deck behaviour, accepted)."
      - "share-link.md #deck: manifest fields, frame kind, HKDF label (frozen like the others), parts, the old-viewer behaviour and the registry kind; #share-list adds the optional kind."
    acceptance:
      - {id: 10.1a, check: "sealDeckManifest and openDeckManifest round-trip; a deck manifest does not open as a paper manifest and a paper manifest does not open as a deck; decodeDeckShareManifest rejects malformed values"}
      - {id: 10.1b, check: "buildDeckShare splits the HTML into convergent parts that openShareBlob opens; uploadDeckShare writes the registry entry with kind deck before blobs and manifest"}
      - {id: 10.1c, check: "openAnyShare opens a paper link as folder exactly as openShare, a deck link as deck whose loadHtml returns the HTML, and reports removed after removeShare"}
      - {id: 10.1d, check: "regression: a paper share built, uploaded and opened with the existing functions gives the same manifest and PDFs, decodeShareManifest gives the same results as before, openShare of a deck link is unreadable, and the registry keeps kind deck and drops other kinds"}
      - {id: A8, check: "a deck shared by link opens through openAnyShare; revoking makes it unreadable; existing paper share links keep working"}
