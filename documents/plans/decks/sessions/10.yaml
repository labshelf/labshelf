    level: contract
    runner: {agent: implementer, model: opus}
    depends_on: ["10.0"]
    create: [packages/core/src/share/deckShare.ts]
    edit:
      - {path: packages/core/src/share/shareFlows.ts, lines: "22-56", why: "ShareEntry gains optional kind: \"deck\"; recordOf keeps it when it is \"deck\" and drops any other value"}
      - {path: packages/core/src/share/index.ts, lines: "1-37", why: "export deckShare.ts"}
      - {path: documents/contracts/share-link.md, lines: "1-200", why: "new #deck section; #share-list mentions kind"}
    read:
      - {path: documents/plans/decks/plan.yaml, lines: "39-41", why: "D12 share format and compatibility"}
      - {path: packages/core/src/share/shareCrypto.ts, lines: "1-153", why: "paper manifest, frame contexts, HKDF labels, convergent blobs (read only, not edited)"}
