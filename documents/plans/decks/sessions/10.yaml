      - "Share Deck as Link (runShareDeck): saves the deck when dirty, calls host.shareDeck through the existing rights notice and progress dialogs (runShareFolderDialog wording with 'deck' for 'folder'), copies the link, and shows 'Link copied.' with Open Link and Insert QR Code. Manage Shared Links lists deck entries with 'Talk' or 'Poster' and revokes them through the existing removeShare."
