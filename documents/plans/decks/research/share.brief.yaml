risks:
  - "Q1 manifest fields: the manifest has ONLY `v: 1` (const SHARE_MANIFEST_VERSION = 1, shareCrypto.ts:11) plus folder and papers. There is NO `kind` field in the manifest. 'share-manifest' is the AES-GCM AAD kind in the frame context (shareCrypto.ts:91), not a JSON field. The link has no version or kind either."
  - "Old-viewer behaviour on an unknown manifest: decodeShareManifest returns undefined for v !== 1, so openShare answers 'unreadable' and the page shows 'This link is incomplete or damaged' (shareStates.ts:23). The same happens for a deck sealed under a different frame kind, because the AAD mismatch makes openFrame fail. That is graceful but misleading. Existing paper links are unaffected as long as the v=1 decoder is not touched."
  - "Choice: (a) new frame kind plus manifest {v:2,kind:'deck'} on the same /share/ path (old viewers show the 'damaged' error; the Worker unchanged), or (b) its own page path such as labshelf.org/deck/ (parseShareLink requires pathname ending '/share/', so a new parser or a path-suffix parameter is needed). The Worker routes need no change in either case, since they are opaque."
  - "Size limits: every Worker value is capped at 25 MiB (KV_VALUE_LIMIT; client KV_LIMITS maxBlobBytes 25 MiB, partBytes 20 MiB in shareFlows.ts:116). The manifest has no split mechanism, so a deck's HTML must be under about 25 MiB or its assets must go to blobs. Revoked blobs are shared across shares by hash with no refcount (the contract notes a revoke on one device can break another device's share)."
  - "The sealed manifest is encrypted with AES-GCM under a random per-frame nonce, 16-byte link key; revocation deletes the manifest first, and KV edge copies may serve it for up to about a minute."
  - "Share creation exists only for LABRARY FOLDERS: VS Code command 'Share Folder as Link…' (packages/vscode/package.json ~259, registered in packages/vscode/src/share/node/register.ts) and the browser library context menu through browserShareHost.ts; both call runShareFolderDialog (core share/dom). The relay must be connected (Cloudflare account); otherwise 'noRelay' dialog. No deck share UI exists. Project shares (projectShare*.ts, collab/) are a separate live-sync protocol (sockets on /project/<id>) and are unrelated to share links."
  - "The viewer page is the website: website/src/share.ts (entry), website/src/share/*.ts, bundled by website/build/build.mjs into website/dist and hosted at labshelf.org/share/. It is NOT in packages/browser. Viewer bundle size matters: it ships the library UI and the pdf.js reader; a deck viewer should be its own lazy bundle."
  - "Coupling to watch: OpenedShare.manifest is typed ShareManifest in shareFlows.ts; changing it to a union ripples into shareImport.ts, website/src/share.ts, downloadMenu and shareLibrary. Prefer a separate openDeckShare, or an openAnyShare that returns {kind:'folder'}|{kind:'deck'}, so openShare's existing signature stays."
  - "The scripts/ eslint or file-header rules require a first-line '// <capability sentence>' header on each new file, and code-placement rules live in the 'code' doc (node scripts/docs/doc.mjs code#placement) which I did not read."
