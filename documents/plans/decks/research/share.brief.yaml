schema: brief/v1
area: share links, relay Worker, share viewer (for the decks plan, D10/A8)
question: "How do share links, the relay Worker and the share page work, and where does a deck share branch off without breaking paper shares?"
sha: 54b5c6f9
reuse:
  - {symbol: sealFrame/openFrame, path: packages/core/src/collab/invite/shareKey.ts, lines: "99-125", why: "AES-GCM frame (1 version byte + 12 nonce + ct/tag) with AAD = length-prefixed shareId, docKey, kind. A deck manifest can reuse it with a new kind or docKey, so a paper manifest never opens as a deck and the reverse."}
  - {symbol: hkdfBits/aesKey/manifestKey/sealShareBlob/openShareBlob, path: packages/core/src/share/shareCrypto.ts, lines: "93-153", why: "HKDF-SHA256 with frozen info labels 'labshelf-share-manifest' and 'labshelf-share-blob'. Blobs are convergent: key and nonce derive from the plaintext SHA-256, blob = 0x01 + ciphertext, blob name = SHA-256 of the sealed bytes. A deck's assets (images, fonts) can ship as blobs unchanged. hkdfBits and aesKey are module-private, so export or copy them for a deck manifest key."}
  - {symbol: formatShareLink/parseShareLink, path: packages/core/src/share/shareLink.ts, lines: "21-48", why: "Link is https://labshelf.org/share/#<worker host>/<shareId hex32>/<key base64url, 16 bytes>. The key lives in the fragment, which browsers never send. The link carries no kind, so the viewer learns it only from the decrypted manifest. Any origin whose path ends in /share/ is accepted and the fragment is percent-decoded first."}
  - {symbol: buildShare/uploadShare/removeShare/openShare, path: packages/core/src/share/shareFlows.ts, lines: "135-288", why: "Create, upload, revoke and open flows, all bound to the paper ShareManifest type. A deck variant should parallel them: random shareId (randomHex(16)) and key (16 random bytes), blobs first, manifest last, and the registry entry written before the upload."}
  - {symbol: ShareBackend/ShareReader/createWorkerShareBackend/createWorkerShareReader/resolveRelayBackend, path: packages/core/src/share/shareBackend.ts, lines: "5-91", why: "Ports and HTTP client. The Worker treats manifest and blobs as opaque bytes, so a deck needs no Worker change if it stays under /share/<id>/manifest and /share/<id>/blob/<hash>."}
  - {symbol: ShareEntry/ShareRegistryStore/updateShareRegistry/loadShareRegistry, path: packages/core/src/share/shareFlows.ts, lines: "22-83", why: "Per-device shares.json list ({id, folder, relayUrl, key, createdAt, blobs[]}) used by 'Manage Shared Links' and by revoke. A deck share must be listed here too to be revocable. The entry has no kind field, and the 'folder' field would hold the deck title. Unknown fields are dropped on load (recordOf)."}
  - {symbol: describe* messages and OPEN_SHARE_FAILURE, path: packages/core/src/share/folderShare.ts, lines: "84-138", why: "Shared wording for share notices and failures; reuse it for decks."}
  - {symbol: runShareFolderDialog/showLink, path: packages/core/src/share/dom/shareDialogs.ts, lines: "27-71", why: "Rights notice, then progress dialog, then 'link copied' dialog with an Open Link button. A QR image would be added here, or in a new deck dialog."}
  - {symbol: qr code generator, path: "(none)", why: "NOT FOUND: no QR encoder in the repo or any package.json. rg -i 'qrcode|qr code' hits only documents/plans/decks/brief.md. A dependency-free encoder (byte mode, ECC M, versions up to what a link needs) would go in core, e.g. packages/core/src/qr/ with an index.ts barrel exported from packages/core/src/index.ts, using the 'Name.ts + __tests__' pattern. A share link is about 100 to 110 bytes (host about 50 + 32 hex + 22 b64), so version 6 to 7 at M. The output should be a boolean matrix, plus an SVG or PNG renderer for the image block."}
edit:
  - {path: packages/core/src/share/shareCrypto.ts, lines: "10-34", why: "SHARE_MANIFEST_VERSION = 1 and interface ShareManifest { v: 1; folder: string; papers: SharedPaper[] }. There is no 'kind' field today. A deck manifest should be a distinct type, a distinct decoder and a new kind or version. Do NOT change decodeShareManifest or the version constant."}
  - {path: packages/core/src/share/shareCrypto.ts, lines: "74-121", why: "decodeShareManifest returns undefined unless value.v === 1 and folder is a string and papers is an array. openShareManifest uses manifestContext {docKey:'manifest', kind:'share-manifest'}. Add a deck seal/open pair here or in a new file (shareDeck.ts) with its own FrameContext kind, e.g. 'share-deck-manifest', and its own HKDF info label."}
  - {path: packages/core/src/share/shareFlows.ts, lines: "232-247", why: "openShare is the dispatch point: fetchManifest, then openShareManifest, else error 'unreadable'. A kind branch goes here: try the paper manifest, then the deck manifest, and return a discriminated OpenedShare (kind 'folder' | 'deck'). OpenedShare today is {link, manifest: ShareManifest, loadPdf}, so a union will break every consumer: website/src/share.ts, browser and vscode importLink via shareImport.ts."}
  - {path: website/src/share.ts, lines: "97-114", why: "open() calls openShare and then createShareLibrary(manifest) and showLibrary/showPaper. Branch on the opened kind here to mount the deck viewer (a new website/src/share/ module). The page URL is labshelf.org/share/ and the link stays in the fragment. ?paper=<id> is the query for the reader; a deck could use ?slide=."}
  - {path: website/src/share/shareStates.ts, lines: "19-26", why: "openErrorState maps 'unreadable' to 'This link is incomplete or damaged'. A deck link opened by a pre-deck viewer lands here (see risks), so a new-viewer error text for decks may be wanted."}
  - {path: website/build/build.mjs, lines: "33", why: "esbuild entryPoints: share -> website/src/share.ts. A separate deck viewer bundle is registered here if the deck share gets its own page. The HTML shell and CSS are in website/ (see website/css/share.css, shareStyles.ts)."}
  - {path: packages/core/src/share/shareFlows.ts, lines: "22-32", why: "Add an optional 'kind' to ShareEntry, and to recordOf at 48-55 so it survives load/save. Without it, a revoke still works (it deletes manifest and listed blobs) but Manage Shared Links cannot tell decks from folders."}
  - {path: packages/core/src/share/libraryShareHost.ts, lines: "58-83", why: "ShareHost interface (shareFolder, sharedLinks, revokeLink, importLink, copyText, openLink). Add a deck share method here, implemented in packages/vscode/src/share/node/host.ts (about line 110) and packages/browser/src/libraryUi/host/browserShareHost.ts (about line 41)."}
read:
  - {path: documents/contracts/share-link.md, lines: "1-60", why: "The contract. Sections: #link, #encryption, #manifest, #worker-endpoints, #upload-and-revoke, #open-in-labshelf, #share-list. Quotes: 'The manifest is JSON with a version `v`; a reader refuses a value it does not know, and drops unknown or mistyped fields.' 'The derivation labels are frozen.' 'Manifest: AES-GCM key derived from the link key, sealed as one frame bound to the share id.' 'They carry no version of their own.' (the Worker endpoints). 'A blob cannot exceed the KV value limit. A larger PDF is split into parts of plaintext; part sizes sum to the PDF size.' Chunking is by part, not streaming. The contract must be amended for a deck kind (the plan says this is decided in its contract package)."}
  - {path: packages/core/src/relay/worker/answerRelayRequest.ts, lines: "72-135", why: "Share endpoints. KV_VALUE_LIMIT = 25 MiB for any PUT (manifest or blob), refusal 'tooLarge'. KV keys are share:<id>:manifest and blob:<hash>. GET is public and CORS-open. A blob GET returns 404 if the share's manifest is missing, which is how revoke works. PUT/DELETE/HEAD need the owner bearer secret. A blob PUT must hash to the path hash. The Worker never parses manifest content, so it is kind-agnostic."}
  - {path: packages/core/src/relay/relayPaths.ts, lines: "10-17", why: "SHARE_PATH (prefix '/share/', manifest(id), blob(id, hash)) and SHARE_REFUSAL. The relay protocol version (contracts/relay#versions) is not carried by share endpoints; share GETs are raw bytes."}
  - {path: packages/core/src/share/shareImport.ts, lines: "1-124", why: "Importing a share into a library (reads ShareManifest papers). A deck link pasted into Import must fail cleanly, not crash."}
  - {path: website/src/share/shareLibrary.ts, lines: "25-50", why: "createShareLibrary(manifest) builds the read-only folder from papers. It takes ShareManifest and must not receive a deck."}
  - {path: packages/core/src/share/libraryShareMessages.ts, lines: "1-60", why: "Only http(s) URLs reach the host browser opener. Relevant to Open Link for a deck."}
  - {path: packages/vscode/src/share/node/register.ts, lines: "1-40", why: "Registers the vscode:// importShare URI handler and the share commands (package.json commands 'Share Folder as Link…', 'Manage Shared Links…', 'Import Papers from Share Link…', around lines 259-269)."}
callers:
  - {symbol: openShare, path: website/src/share.ts, lines: "100-100", why: "The share page. Also called from shareImport.ts (import of a pasted link) for the VS Code and browser apps."}
  - {symbol: createShareLink, path: packages/core/src/share/folderShare.ts, lines: "70-82", why: "Called by the VS Code host (packages/vscode/src/share/node/host.ts) and the browser host (packages/browser/src/storage/libraryMutations.ts, wrapped by browserShareHost.ts)."}
  - {symbol: removeShare, path: packages/core/src/share/shareFlows.ts, lines: "257-288", why: "Revoke. Also called inside uploadShare's failure path (191). Reached from the Manage Shared Links dialog (runManageShareLinksDialog, shareDialogs.ts line 118)."}
  - {symbol: SHARE_MANIFEST_VERSION/decodeShareManifest/openShareManifest, path: packages/core/src/share/shareCrypto.ts, lines: "11-121", why: "Used by shareFlows.ts, plus the tests under packages/core/__tests__/share/."}
