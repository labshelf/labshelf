contracts: ["ui#implementation", "ui#applying-the-principles", "code#placement"]
commands: ["node scripts/agents/run.mjs test core -- __tests__/qmd/dom/drawingEditor", "pnpm --filter @labshelf/core tokens"]
risks:
  - "Tests are jest, not vitest; DOM tests need the per-file docblock '@jest-environment jsdom'"
  - "No iframe/sandbox/srcdoc precedent in core DOM, and the vscode CSP has no frame-src, so the sandboxed slide iframe needs a CSP change; browser extension pages' CSP not checked"
  - "No existing fullscreen/presenter, mm/in handling, calibration, OffscreenCanvas or colour/number/split-pane component; they are greenfield, and createPicker and attachSash are not exported as reusable widgets"
  - "Drawing toolbar ICONS are private and kept small for a 60 KB chunk budget; a deck editor chunk should also be lazy and mind its budget"
  - "@codemirror/lang-html is not a dependency; HTML source highlighting needs a new dependency or plain text"
  - "Slide thumbnails cannot be rasterised from an iframe under the CSP without a new approach; scaled live iframes are the likely path"
  - "The ui.md rules are high-level; the concrete no-style=-attribute rule lives in code comments (canvas.ts, labelField.ts) and the openDrawingEditor test"
