tests:
  - {path: packages/core/__tests__/qmd/dom/drawingEditor/openDrawingEditor.test.ts, covers: "jsdom editor test: accessible names, pointer/keyboard, Done/Esc commit, no style= attribute in the DOM; mocks the lazy math loader"}
  - {path: packages/core/__tests__/qmd/dom/drawingEditor/snap.test.ts, covers: "pure snapping"}
  - {path: packages/core/__tests__/qmd/dom/drawingEditor/state.test.ts, covers: "state and undo history"}
