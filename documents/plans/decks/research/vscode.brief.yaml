risks:
  - "Nested iframe: no webview in packages/* embeds an iframe or uses srcdoc/sandbox (search found only the browser app's reader iframe in packages/browser/src/libraryUi/editorArea/tabKinds.ts:83, which is not a VS Code webview). renderHtmlShell has `default-src 'none'` and no frame-src/child-src, so an iframe would be blocked until the CSP gets `frame-src`. Not verified here: a VS Code webview is itself an iframe and nested srcdoc/blob iframes generally work in it with a sandbox attribute and their own CSP meta in the srcdoc, but test this in a real webview, and note that the srcdoc cannot load vscode-webview-resource URLs unless the outer CSP (img-src/style-src/font-src with cspSource) and localResourceRoots (add the project folder) allow it. Assets of a deck folder need localResourceRoots to include the deck's project folder and asWebviewUri rewriting, or inlining as data/blob URLs in the host."
  - "No bundle-size check or budget script exists (rg found none in scripts/); D11 (<= ~1 MB) must be measured by hand from dist/ after `build:webview --production`. pdfjs-dist is kept external to avoid pulling ~1 MB into bundles (webviews.mjs comment). MathJax is loaded as a dynamic import chunk (chunks/), which counts for the budget."
  - "Undo: the source editor is a CustomTextEditor, so undo/redo is VS Code's own document undo stack (WorkspaceEdits applied through applyEdit); I found no custom undo code in provider/documentSync. For decks, apply every edit as a WorkspaceEdit so Cmd+Z in the native text editor and the deck editor agree (A4). 'During a drag only a transform changes; HTML written on release' means one edit per release. Check the page's own undo does not duplicate this."
  - "The existing sync is built on the OT-style SourceAuthority (version, updates); a deck editor must either reuse it (push text changes as {from,to,insert}) or send whole-document replacements; the latter breaks cursor/echo handling in the text editor."
  - "No notes custom editor exists in packages/vscode: notes are .qmd files opened via openSourceAt in the LabShelf source editor (viewType labshelf.sourceEditor covers only *.tex and *.typ). The 'qmd notes editor' you mentioned was not found as a separate provider."
  - "No Chromium discovery or chrome-headless-shell code exists yet (only nativeHost files mention chrome for browsers). Spawning must go through core's run.ts in packages/core/src/latex/node (Node only); the web VS Code extension has no child process, so export commands must be registered via the node platform (desktopPlatform.ts), not the shared tree."
  - "Priority 'default' with filenamePattern 'deck.html' would capture every deck.html in any folder in VS Code; pick a more specific selector or 'option' and offer a Reopen with Deck Editor command like labshelf.sourceEditor.reopen."
  - "The vscode tests run under jest (ts-jest), not vitest: packages/vscode/jest.config.js, mock in packages/vscode/__mocks__/vscode (commands.js, env.js, webviewPanel.js, window.js, workspace.js). The mock lacks EndOfLine and languages.onDidChangeDiagnostics; tests that need them patch vscode with jest.mock as provider.test.ts:8-16 does."
