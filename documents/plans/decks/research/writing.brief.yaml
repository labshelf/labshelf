schema: brief/v1
area: core writing-project domain for the decks plan (D1, D4, D5)
question: "How a writing project, its labels, citations, staleness (figures and note origins), math, file ports and DOM or HTML tooling are modelled in core, and where a new decks module goes"
sha: 54b5c6f9
reuse:
  - {symbol: readProjectEntry, path: packages/core/src/writing/project/projectEntry.ts, lines: "38-60", why: "Project root and main file (Q1). Takes a folder and a ProjectFolderReader and returns {kind:ready, folder, settings, main} or {kind:broken, reason}. main comes from labshelf.yaml `main`, else detectEntryFile. A project root is a folder holding labshelf.yaml (PROJECT_FILE). A deck would hang off a ReadyProject."}
  - {symbol: detectEntryFile / detectFormat / findBuildRoots / buildRootOf, path: packages/core/src/writing/project/buildRoot.ts, lines: "17-135", why: "Picks the main manuscript and the build roots. findBuildRoots (line 97) takes {path,text}[] and returns the roots: LaTeX files with documentclass, and Typst files no other file includes. buildRootOf (line 130) maps a file to its root. Format is 'latex' or 'typst' (ProjectFormat)."}
  - {symbol: parseProjectFile / ProjectSettings / UserSettings / FigureRecipe, path: packages/core/src/writing/project/projectFile.ts, lines: "10-60", why: "labshelf.yaml model. The user keys are figures (path to {run, inputs[]}), values, check. A decks key (D1) would be added next to figures. CONTRACT documents/contracts/library-format.md#labshelfyaml. YAML parsing keeps the user's comments and unknown keys."}
  - {symbol: listProjectFiles / readOptionalText / ProjectReadContext, path: packages/core/src/writing/project/projectReads.ts, lines: "13-50", why: "Project file access over the fs port. ProjectReadContext is {fs: LibraryFileSystem, paths: PathOps, logger}. listProjectFiles returns sorted, '/'-separated relative paths and skips hidden folders and node_modules. Throws if the folder is missing. readOptionalText returns undefined for a non-file."}
  - {symbol: findOutlineHeadings / deriveNestedHeadings / findDeepestContaining, path: packages/core/src/writing/outline/outline.ts, lines: "6-50", why: "Manuscript outline for LaTeX or Typst: headings with levels, nested. findSourceHeadings in writing/citations/citeKeys.ts:104 is a flatter version, {line,title}[], built on scanLatexSource and scanTypstHeadings."}
  - {symbol: scanLatexSource / LatexSourceFacts, path: packages/core/src/latex/source.ts, lines: "18-95", why: "One LaTeX scan returns labels, refs, sections, macros and includes, with ranges (LabelFact has only name and range). The label's kind (equation, table or figure) is NOT recorded, so a deck must derive the kind from the surrounding environment itself."}
  - {symbol: createProjectLabels, path: packages/core/src/latex/projectLabels.ts, lines: "21-58", why: "Project-wide label index for .tex files with a debounced rescan (ProjectLabel {name,file}). LaTeX only. Typst labels come from the Typst scan: symbols.labels in packages/core/src/typst/language/syntax.ts:161-176, with readLinkedLabels in service.ts:305."}
  - {symbol: readLatexProjectSources / readLatexProjectTexts / resolveIncludePath, path: packages/core/src/latex/sourceProject.ts, lines: "30-110", why: "Follows \\input and \\include from the main file, so you get every file of a manuscript. Also deriveMathJaxMacros (line 104) turns the project's macros into a MathJaxMacros record for renderMathSvg."}
  - {symbol: walkProjectSources / scanCiteKeys / findCitationSites / findCiteKeyOccurrences, path: packages/core/src/writing/citations/citeKeys.ts, lines: "26-140", why: "Cite keys used in the project. walkProjectSources is in writing/citations/projectSources.ts:20 (async generator, takes OpenSources so unsaved editor text wins). listProjectCiteKeys is in bibliography.ts:248."}
  - {symbol: derivePapersByCiteKey, path: packages/core/src/writing/citations/citeKeys.ts, lines: "349-358", why: "THE way a cite key resolves to a library PaperRecord. Case-sensitive; on a duplicate key the smallest id wins. createBibliography (bibliography.ts:194) uses it to give {text, resolved, missing}. parseBibEntries (bibliography.ts:34) and readBibField (:59) read a project's .bib. deriveCitationEntries (writing/citations/quotes.ts:69) gives card entries with a .bib fallback for keys the library lacks."}
  - {symbol: formatCitations / formatInTextCitation / formatAuthors, path: packages/core/src/library/record.ts, lines: "154-230", why: "Q3 answer: NOT CSL. Hand-written formatters. formatCitations(paper) returns {apa, mla, chicago, inText}. formatInTextCitation gives 'Vaswani et al., 2017'. formatAuthors gives 'A & B' or 'A et al.'. All are pure text from a PaperRecord (CitedPaper pick), so they are safe for a slide's citation and reference list. Nothing renders a project .bib entry the same way; for a key only in .bib, map BibEntry fields by hand. createBibtexEntry is in packages/core/src/import/bibtex/bibtexEntry.ts:26."}
  - {symbol: deriveFigureBuildState / readFigureBuildStates, path: packages/core/src/writing/figures/figureState.ts, lines: "18-32, 110-125", why: "Q2 figure recipes. The source is the labshelf.yaml entry figures[path] = {run, inputs[]} (inputs are paths or globs *, **, ?, project-relative). Staleness is MTIME, not a hash: stale when any existing input's mtimeMs is greater than the figure file's mtimeMs. States are missing, stale {newerInputs} or fresh, each with missingInputs. It reads through fs.stat (modifiedAt helper) and walks the folder once, only for glob inputs. Exposed as ProjectContentPort.readFigureStates (writing/projectService.ts:41,89)."}
  - {symbol: deriveOriginState / scanOrigins / deriveOriginHash / readOriginLatex, path: packages/core/src/writing/noteLinks/originState.ts, lines: "1-18", why: "Q2 note origins, the closer model for decks' linked blocks. The source is a trailing comment on the manuscript line, `% labshelf: <notePath>#<label> @<12hex>` (ORIGIN_COMMENT in originSyntax.ts:9; `//` in Typst). The 12 hex are the first 12 chars of the SHA-256 of the trimmed LaTeX (originComment.ts:8, via deriveTextSha256Hex from core/hash). State is a THREE-WAY HASH comparison. Note hash changed gives 'stale'. Manuscript hash changed gives 'diverged'. Both changed gives 'both'. Note or label gone gives 'missing'. Otherwise 'fresh'. scanOrigins (scanOrigins.ts:12) finds the origins in a source."}
  - {symbol: listNoteInsertables / buildInsert / buildUpdate / diffOrigin, path: packages/core/src/writing/noteLinks/noteInsertables.ts, lines: "10-125", why: "Builds the note-side hash. For an output (cell result), outOfDate = deriveCodeHash(cell code) !== output.source (line 74) and the insert is refused when it is out of date (line 107). buildUpdate (:114) and diffOrigin (:120) do update and compare. The note-side reader in writing/checks/noteOrigins.ts:16 (readNoteOrigins) lists the non-fresh origins for the Checklist."}
  - {symbol: renderMathSvg / createMathImageUri / loadCoreMath, path: packages/core/src/latex/hover/renderMathSvg.ts, lines: "20-50", why: "Q4. renderMathSvg(tex, display, macros?) returns an SVG STRING (MathJax SVG output, fontCache 'local'; liteAdaptor, so no DOM needed) and throws the TeX error on a parse failure. The MathJax document is cached per macro set. SVG sizes are in ex (createMathImageUri converts them to px at 7 px/ex for a data-URI image). It runs in Node as is (liteAdaptor, no document), and in the browser. Entry: packages/core/src/latex/hover/index.ts, exported as '@labshelf/core/math' (package.json exports './math'). loadCoreMath (index.ts:11) just returns Promise.resolve({renderMathSvg}). The lazy seam is in the CALLER: qmd/dom/mathView.ts:19 does `() => import('../../latex/hover/index.js')` (type MathLoader)."}
  - {symbol: parseMathSvg / svgDimension, path: packages/core/src/qmd/dom/drawingEditor/mathSvg.ts, lines: "11-30", why: "Browser-only (DOMParser): SVG string to an Element with style attributes removed and vertical-align moved into the --qmd-math-valign custom property, because the webview CSP forbids style=. Read-only reuse from qmd. A Node HTML export should keep the raw string from renderMathSvg instead and mind the CSP (style on the root svg)."}
  - {symbol: sanitizeSvg (allowlist), path: packages/core/src/qmd/drawing/dom/sanitize.ts, lines: "1-60", why: "Only sanitizer in core, and it is SVG-only. It uses an allowlist of tags and attributes and rejects the whole markup on any violation. It is DOM-based (needs a Document), and qmd is read-only for this plan, so a deck needs its own HTML sanitizer or the same pattern in a new module."}
edit:
  - {path: packages/core/src/writing/project/projectFile.ts, lines: "10-60", why: "If decks are declared in labshelf.yaml (D1), add the key to UserSettings and validate it as readFigures does (lines 49-60). Contract documents/contracts/library-format.md#labshelfyaml must change with it."}
  - {path: packages/core/src/writing/index.ts, lines: "1-39", why: "Barrel of the writing domain. If the deck code is a writing/decks/ package, add `export * from './decks/index.js'` here. This is the usual point for hosts to import it."}
  - {path: packages/core/package.json, lines: "50-80", why: "Only if a new lazily-loaded entry is wanted (like './math'); exports map. mathjax-full 3.2.2 is already a dependency, and no HTML parser or sanitizer is declared."}
read:
  - {path: packages/core/src/ports/fileSystem.ts, lines: "1-60", why: "Q5. There is no single FileSystem port with watch. Three layers: IFileSystem {ensureDir, writeText, readText, exists}; LocalFileSystem {listDir(path): string[], readFile/writeFile (Uint8Array), deleteFile, stat(path) -> {isFile,isDirectory,mtimeMs,size}|undefined, ensureDir}; LibraryFileSystem extends both and adds rename, trash, removeTree, mkdir. INVARIANT: POSIX string paths; writes are atomic. NO watch method: change notification is host-side (vscode/src/writing/projects/projectFigures.ts watches figure files and fires onDidChange; core/src/writing/staleSources.ts takes SourceEvents). The base for any host is BytesFileSystem (packages/core/src/files/bytesFileSystem.ts, exported from files/index.ts). Paths go through PathOps (core/path)."}
  - {path: packages/core/src/writing/staleSources.ts, lines: "1-60", why: "StaleSources: marks a built root stale when a source changes after a successful build. Event-driven, not by hash or mtime. A second staleness model."}
  - {path: packages/core/src/writing/projectService.ts, lines: "21-100", why: "ProjectContentPort: what hosts call for project reads (readFigureStates and others). createProjectContent({fs,path,logger,deviceDirs}) builds it. Add decks reads here if hosts should get them through the same port."}
  - {path: packages/core/src/writing/checks/checklistSignals.ts, lines: "115-130", why: "Where stale figures reach the Checklist (state.status==='stale'). Also see checks/noteOrigins.ts and checklist.ts for where non-fresh note origins reach the Checklist."}
  - {path: packages/vscode/src/writing/projects/projectFigures.ts, lines: "1-50", why: "Q2 where the figure state is SHOWN: the VS Code Writing view lists FigureNode {path, recipe, state} per project; the view row text is built from state. It also watches the files and asks before running a figure command."}
  - {path: packages/core/src/writing/dom/sourceEditor/noteLinks.ts, lines: "120-140", why: "Where note-origin state is shown: the editor marks the manuscript equations with the state of their copy, and the 'Insert from note' picker adds ' · out of date' to the description when item.outOfDate (line 133). The same string is in packages/vscode/src/writing/citations/noteLinks.ts:308."}
  - {path: packages/core/src/qmd/dom/outputView.ts, lines: "240-275", why: "Where a note's code output shows 'Out of date — <what> since this ran' (caption exists only while out of date; words carry the state, not colour). Source of the 'out of date' wording; read-only qmd."}
  - {path: packages/core/src/hash/index.ts, lines: "1-20", why: "deriveTextSha256Hex and deriveCodeHash; use these for a block hash rather than a private one (the modules lint also checks private copies of shared exports)."}
