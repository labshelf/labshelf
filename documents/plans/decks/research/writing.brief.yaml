  - "node scripts/agents/run.mjs test core -- packages/core/__tests__/writing/figures/figureState.test.ts"
  - "node scripts/agents/run.mjs test core -- packages/core/__tests__/writing/noteLinks"
  - "pnpm lint:modules"
  - "node scripts/docs/doc.mjs code#placement"
  - "node scripts/docs/doc.mjs code#modules"
risks:
  - "Q6 test env: core uses JEST (ts-jest, jest.config.cjs), NOT vitest. Default testEnvironment is node; DOM tests opt in per file with a first-line `/** @jest-environment jsdom */` (jest-environment-jsdom 29 / jsdom 20, for example __tests__/writing/dom/sourceEditor/review.test.ts). Tests live under packages/core/__tests__/ mirroring src, match **/*.test.ts, and the moduleNameMapper strips .js from relative imports. Core package.json has no happy-dom, no linkedom."
  - "Q6 parsers: core declares NO HTML parser, sanitizer or CSS parser dependency. parse5 7.3.0, htmlparser2 8.0.2 and jsdom 20 exist in node_modules only as transitive deps of jest; do not import them from product code without adding them to packages/core/package.json. The only sanitizer is the SVG allowlist at qmd/drawing/dom/sanitize.ts (DOM-based, read-only qmd). Runtime HTML work in the browser or webview can use DOMParser as parseMathSvg does."
  - "Q5: LocalStat has mtimeMs, so an mtime staleness check like figures' works over any host. There is no watch in the port; any watching a deck needs must be host-side."
  - "Staleness has two models. Figures: mtime of output against inputs, with the recipe in labshelf.yaml and nothing stored in the output. Note origins: a stored 12-hex content hash in a comment next to the copy, compared both ways (note side and copy side). Linked deck blocks that copy text want the origin model, with two hashes giving four states; blocks derived from files (images) want the figure model."
  - "The origin hash is of LaTeX equation text only (scanOrigins and ORIGIN_COMMENT are LaTeX/Typst comment syntax). A deck is HTML, so the comment syntax (an HTML comment or a data attribute) and its scanner would be new; reuse OriginState, deriveOriginState and the 12-hex hash shape, not scanOrigins."
  - "MathJax is about 2.5 MB of CommonJS with import-time side effects (TRAP in latex/hover/index.ts:2): import only through '@labshelf/core/math' or a dynamic import, never from the core root, or it lands in every browser and webview bundle. It registers an HTML handler at import time (RegisterHTMLHandler(adaptor) in renderMathSvg.ts:12). renderMathSvg uses AllPackages minus autoload, require and noerrors, so no network or dynamic extension loading; safe in Node. Output is SVG only, not CHTML."
  - "The label kind (equation, table, figure) is not recorded by scanLatexSource (LabelFact is name and range). For a Typst label, context is the line prefix (syntax.ts:176). A deck that needs kinds must infer them from the enclosing environment."
  - "Code for decks cannot live under packages/core/src/qmd/ (read-only). Q7 placement: a new domain or subfolder needs an index.ts barrel (other files are private); a subfolder below a domain is a package and must hide something and hold together; a file holds one concept up to 400 lines; files under 80 lines used by one sibling belong in it; DOM or Node code goes in a dom/ or node/ runtime folder (still part of the enclosing package); core never imports app storage or libraryUi. Runtime-neutral code reaches the platform through ports. `pnpm lint:modules` (scripts/lint/modules.mjs; baseline scripts/lint/modulesBaseline.json) enforces rules no-index, hides-nothing, orphan-file, misplaced, cycle-with-parent, satellite and shared-name. SHARED_MODULES (modules.mjs:~15) lists the core folders (encoding, errors, guards, hash, json, path, ...) whose exports must not be re-declared privately; add a new shared core module there. Package.json exports map, packages/core/tsconfig.neutral.json, tsconfig.dom.json and tsconfig.node.json (checked by `pnpm run lint:runtime`) may need the new folder."
  - "The pre-tool hook blocks rg/grep of known symbols (it asked for node scripts/code/facts.mjs). No lookup was missed, but the callers list above comes from rg on file paths, not from facts callers."
  - "Not found: any CSL processor, a project-wide figure/table/equation label kind index, a watch method on any core port."
