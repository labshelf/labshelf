schema: brief/v1
area: terminal MCP server and PDF export engine discovery for the decks plan
question: "Is there an MCP server or a Chromium finder today, where would `labshelf mcp` register, and what can a deck exporter reuse"
sha: 54b5c6f9
reuse:
  - {symbol: runProjectCommand, path: packages/terminal/src/cli/project/projectCommands.ts, lines: "15-25", why: "Switch over install, build, cite, projects and check. Each case is run*(ctx, positionals, flags, io) and returns an exit code. Throw UsageError for exit code 2."}
  - {symbol: runProjects, path: packages/terminal/src/cli/projectsCommand.ts, lines: "1-47", why: "Smallest subcommand template. It takes ctx (Pick<AppContext,'paths'|'logger'>), positionals, flags and io, catches errors, logs them with ctx.logger.error and returns 0 or 1."}
  - {symbol: findProject, path: packages/terminal/src/cli/build/findProject.ts, lines: "28-42", why: "Resolves a project from a folder path, a project id or the cwd. It returns a ready ProjectEntry (folder, settings, main) or throws UsageError. Reuse it for MCP project selection, but apply an allow-list (D6), because it accepts any existing folder."}
  - {symbol: readProject / listProjects / findLibraryProjectFolder / listProjectFiles / listBibliographyFiles / readOptionalText, path: packages/core/src/writing/project/projectReads.ts, lines: "22-121", why: "Project-folder reads. readProject is at 67 and listProjects at 88. findLibraryProjectFolder is at 97. listBibliographyFiles at 112 lists the .bib files a main file loads."}
  - {symbol: createNodeProjectReadCompositionRoot / listLibraryProjects, path: packages/core/src/writing/project/node/projectReads.ts, lines: "11-30", why: "Node wiring for the project reads, exported from @labshelf/core/node. nodeFileReads gives {fs, paths}."}
  - {symbol: createProjectSources, path: packages/core/src/writing/projectSources.ts, lines: "11-30", why: "Reads the manuscript text of a build root. LaTeX follows includes through readLatexProjectSources; Typst reads the root file alone."}
  - {symbol: detectEntryFile / findBuildRoots / deriveBuildRootFolder, path: packages/core/src/writing/project/buildRoot.ts, lines: "28-130", why: "Main-file and format detection (LaTeX or Typst)."}
  - {symbol: outline (headings with level, nesting and the section holding a position), path: packages/core/src/writing/outline/outline.ts, lines: "1-60", why: "Lists the headings of a LaTeX or Typst source and nests them into sections. Use it for the manuscript outline and for bounded section reads."}
  - {symbol: parseBibEntries / readBibField / extractPlainField / listProjectCiteKeys, path: packages/core/src/writing/citations/bibliography.ts, lines: "17-60, 248-262", why: "Parses .bib text into entries and fields. listProjectCiteKeys lists the keys the project cites."}
  - {symbol: readFigureBuildStates, path: packages/core/src/writing/figures/figureState.ts, lines: "110-140", why: "Project figure facts: the figure state derived from the labshelf.yaml figure commands and their inputs. There is no generic 'list figure image files' function; the figure node folder is packages/core/src/writing/figures/node/."}
  - {symbol: isInside / checkRelativePath, path: packages/core/src/path/index.ts, lines: "4-5", why: "Path confinement for the D6 requirement that writes stay inside the project's deck folders."}
  - {symbol: runCancellable, path: packages/core/src/latex/node/run.ts, lines: "147-185", why: "The only generic process runner in core. It spawns (executable, args, cwd, AbortSignal, {timeoutMs, env, logger}) and returns stdout and stderr with the exit code. It kills the process tree and handles timeout and cancellation. It is in latex/node but is generic, and it is the closest thing to a process port. A deck exporter can run headless Chrome through it with --print-to-pdf."}
  - {symbol: findExecutable / envValue / subdirs, path: packages/core/src/latex/node/systemTex.ts, lines: "20-45", why: "PATH lookup (honours Windows PATHEXT and case) and subfolder listing. Exported through latex/node/index.ts. Use it to find 'chromium', 'google-chrome' and similar on PATH."}
  - {symbol: locateTool, path: packages/core/src/qmd/compute/node/locateTool.ts, lines: "77-130", why: "Pattern for finding a tool via an override, then PATH, then per-OS install locations (Windows Program Files scan). A browser finder should copy this pattern. It is typed only for wolframscript, Rscript and python."}
  - {symbol: resolveSharedToolsDir / withToolLock, path: packages/core/src/latex/node/managedTex.ts, lines: "16-24, 107-135", why: "Shared tools root (macOS ~/Library/Application Support/LabShelf, Windows %LOCALAPPDATA%\\LabShelf, Linux $XDG_DATA_HOME/labshelf) and the exclusive .lock with stale takeover. A managed chrome-headless-shell folder would sit beside tex/ and python/."}
  - {symbol: createManagedPythonProvider / createSharedPythonProvider, path: packages/core/src/qmd/compute/node/managedPython.ts, lines: "37-120", why: "Closest template for a managed chrome-headless-shell. It has status(), install(onProgress) under withToolLock, a staged install, and a pin file. It is built by createSharedPythonProvider({env, platform, homeDir, logger, fetchImpl})."}
  - {symbol: PYTHON_PIN, path: packages/core/src/qmd/compute/pythonPin.ts, lines: "1-60", why: "Pin template: per platform key (darwin-arm64, darwin-x64, linux-x64, linux-arm64, win32-x64) a URL and SHA-256. A chrome-headless-shell pin would take the same shape."}
  - {symbol: installPythonTree, path: packages/core/src/qmd/compute/node/installPython.ts, lines: "97-160", why: "Staged install: download, verify, unpack into .staging-*, swap in, remove macOS quarantine."}
  - {symbol: downloadVerified / extractArchive, path: packages/core/src/latex/node/verify.ts, lines: "10-60", why: "SHA-256-checked download and archive unpacking. Check whether extractArchive handles .zip: Chrome for Testing ships zips, and the Python pin ships tar.gz."}
edit:
  - {path: packages/terminal/src/terminalEntry.ts, lines: "103-148", why: "runLibraryFreeCommand is the dispatch for commands that need no opened library (init, sync-help, move, native host, doctor). Add `if (args.command === 'mcp')` here, before `return undefined`. stdout must stay clean JSON-RPC and io.out normalises text. A server that resolves the library itself fits here, calling resolveLibraryRoot(libraryFlag, process.env, config). A server that needs ctx instead fits the post-resolve section at lines 168-178, beside `where` and `conflicts`, before openLibrary at line 180."}
  - {path: packages/terminal/src/terminalEntry.ts, lines: "151-182", why: "main(): handles --version and --help first, then fires `void refreshSystemLaunchers` (line 158) unless it is a native-host command. mcp should skip it like the native-host commands, to avoid side effects in a stdio server. After resolveRoot, openLibrary builds AppContext and runOpenedLibrary runs runLibraryCommand."}
  - {path: packages/terminal/src/cli/index.ts, lines: "1-11", why: "Barrel of the CLI. Export the new runMcp from the new folder here, so terminalEntry imports it from ./cli/index.js."}
  - {path: packages/terminal/src/cli/usage.ts, lines: "10-48", why: "USAGE help text. Add an `mcp` line under a section (for example Writing or Setup)."}
  - {path: packages/terminal/src/cli/mcp/, lines: "new", why: "New folder cli/mcp/ with an index.ts. Proposed layout: a stdio JSON-RPC transport and dispatcher, and a tool registry. Deck tools belong in core, not here (see risks)."}
  - {path: packages/terminal/src/cli/libraryCommands.ts, lines: "150-170", why: "Alternative route: the switch on command (ls, search, show, add, bib, open, status, tag, mv, copy) delegates unknown words to runProjectCommand at line 15 of projectCommands.ts. Registering mcp there means the library is opened, which suits the ai-mcp D2 composition root. It also means the TUI-oriented watcher is off (watch is only true for the TUI) and ctx.dispose runs on exit."}
  - {path: packages/core/src/latex/node/run.ts, lines: "147-185", why: "No edit needed unless a browser runner is added. For a Chromium exporter, create a new core module (for example packages/core/src/decks/node/) that calls runCancellable. Do not put the launcher in latex/node."}
read:
  - {path: documents/plans/ai-mcp/plan.md, lines: "12-30", why: "D2: a local process `labshelf mcp` starts from the terminal composition root and delegates to core operations. Saved-library reads need no GUI app; live selection and unsaved editor state need an active app connection. D5: reuse core operations, do not expose every CLI command, no separate model inside the server. D6: reads and writes only inside explicitly authorised library and project roots, including resolved paths (symlinks); never expose credentials or labshelf.yaml writes; treat retrieved text as untrusted; log failures with ILogger without paper text or secrets. Both are unchecked drafts and the plan status is draft."}
  - {path: documents/plans/ai-mcp/research/hosts.md, lines: "1-20", why: "Transport: a compatible client starts `labshelf mcp` as a local child process over stdio. Closing the client ends the process. Each client gets its own process."}
  - {path: documents/plans/ai-mcp/research/cli-integration.md, lines: "1-60", why: "Read-only tool candidates for the MCP surface (D3); not read in detail."}
  - {path: documents/plans/decks/brief.md, lines: "15-19", why: "D5 and D9 as specified in the task."}
  - {path: packages/core/src/qmd/compute/node/managedPython.ts, lines: "1-60", why: "Imports, ManagedPythonOptions and readStatus, to copy for a browser provider."}
  - {path: packages/core/src/ports/index.ts, lines: "1-8", why: "Ports are IFileSystem, LocalFileSystem, LibraryFileSystem, ILogger, LogSink, SidecarPort, FetchLike and NativeMessagePort. There is no process or spawn port."}
  - {path: packages/core/src/helper/node/runHelperHost.ts, lines: "150-220", why: "Existing stdio, native-messaging-style host that creates the shared Python provider (line 189). It uses the native-messaging framing, not JSON-RPC, but is the in-repo example of a stdio server loop."}
  - {path: packages/terminal/src/cli/build/buildEnvironment.ts, lines: "60-90", why: "Shows how the terminal builds core services (createProjectContent with NodeLibraryFileSystem, ProjectBuildQueue, createSharedTexProvider). Typst builds are rejected there (rejectTypst), so the CLI cannot build Typst today."}
callers:
  - {symbol: runProjectCommand, path: packages/terminal/src/cli/libraryCommands.ts, lines: "170-180", why: "Falls through to runProjectCommand from the default case of the command switch."}
  - {symbol: createSharedPythonProvider, path: packages/terminal/src/helper/helperEntry.ts, lines: "119", why: "Helper host call site. Others are packages/core/src/helper/node/runHelperHost.ts:189 and packages/vscode/src/activation/node/desktopPlatform.ts:137."}
  - {symbol: runLibraryFreeCommand, path: packages/terminal/src/terminalEntry.ts, lines: "168", why: "Called from main() before the library is resolved; it returns undefined for any command it does not handle."}
tests:
  - {path: packages/terminal/__tests__/cli/, covers: "Terminal CLI tests: args.test.ts, libraryCommands.test.ts, projectsCommand.test.ts, runCheck.test.ts, doctor.test.ts, conflictsCommand.test.ts, openCommand.test.ts, plus build/, citation/, project/, nativeHost/, libraryLocation/, syncGuide/. A new mcp subcommand test goes in packages/terminal/__tests__/cli/mcp/."}
  - {path: packages/terminal/__tests__/cli/projectsCommand.test.ts, covers: "Pattern to copy for a project-reading subcommand with a fake ctx and Output"}
  - {path: packages/terminal/__tests__/compositionRoot.test.ts, covers: "openLibrary and AppContext"}
  - {path: packages/terminal/__tests__/cli/build/, covers: "Build environment and findProject"}
contracts: ["contracts/managed-tools#layout", "contracts/managed-tools#lock", "contracts/managed-tools#python-install", "code#placement", "code#modules", "contracts/library-format.md#project-folder-labshelf", "contracts/library-format.md#labshelfyaml"]
commands:
  - "node scripts/agents/run.mjs test terminal -- packages/terminal/__tests__/cli/projectsCommand.test.ts"
  - "node scripts/agents/run.mjs test terminal"
  - "node scripts/agents/run.mjs test core -- <path under packages/core/__tests__>"
  - "pnpm lint:modules"
  - "node scripts/docs/doc.mjs contracts/managed-tools#layout"
risks:
  - "Q1 No MCP server exists. `@modelcontextprotocol/sdk` is in no package.json. The only 'mcp' hit is scripts/verify/mcpChromePath.mjs, a dev-time check of the chrome-devtools MCP config in .mcp.json that points at ms-playwright's Chrome for Testing in ~/Library/Caches (not a product path). The ai-mcp plan is draft and its D2/D6 are unchecked."
  - "Minimal stdio MCP without the SDK: read stdin newline-delimited JSON-RPC 2.0 and write only JSON to stdout (no console.log, no io.out, since io.out normalises text and adds newlines). Handle `initialize` (return protocolVersion, capabilities {tools:{}} and serverInfo), the `notifications/initialized` notification (no reply), `ping`, `tools/list` and `tools/call` (result {content:[{type:'text',text}], isError}). Return -32601 for unknown methods and -32602 for bad params. Log to stderr or ILogger, never stdout. Validate arguments with core's guards/json helpers. Placement per code#placement: protocol, tools and deck logic go in packages/core/src/ (a new neutral module, for example decks/ and mcp/, with node/ for disk access); the terminal owns only the stdio wiring and the `mcp` subcommand. Adding the SDK is a dependency decision for the user, since it also brings zod. Hand-rolled JSON-RPC is roughly 150 lines, and ai-mcp D4 wants control of tool schema size."
  - "pnpm lint:modules enforces that cli/ subfolders expose only index.ts, a file is at most 400 lines, and shared helpers are not copied privately. libraryCommands.ts is 290 lines, so do not grow it."
  - "terminalEntry.ts line 158 `void refreshSystemLaunchers(DIST_DIR)` runs for every command except native-host ones. It is fire-and-forget and writes nothing to stdout, but check it before the mcp launch, since a stdio server must be quiet and fast."
  - "runCommand/main in terminalEntry.ts wraps UsageError to exit code 2 and writes errors with io.err (stderr). That is fine for MCP, because stderr is the diagnostic channel."
  - "Typst cannot be built from the terminal: buildEnvironment.ts rejectTypst. This only matters if decks need a manuscript build."
  - "Q4 Managed tools: no chrome-headless-shell, Chrome, Chromium, Edge or Brave detection and no puppeteer or playwright dependency exist in core, terminal or vscode source. The only Chrome-related code is the native messaging host installer (packages/core/src/nativeHost/*, packages/terminal/src/cli/nativeHost/*), which writes browser manifest folders for Chrome, Edge and Brave. It does not find executables. Do not reuse it for finding a browser, but it lists the per-OS browser profile directory names."
  - "Adding chrome-headless-shell to the managed-tools contract (documents/contracts/managed-tools.md): a new section in Layout (a `chrome/` folder beside tex/ and python/, with a pin file, .staging-chrome-*/ and .lock), a pin module like pythonPin.ts (Chrome for Testing JSON gives per-platform zip URLs, but the downloads have no published SHA-256, so the pin must hold hashes computed at pin time), a provider like managedPython.ts (status, install under withToolLock) and a Quarantine removal on macOS. Check that extractArchive handles .zip. The lock section already says only LabShelf apps change tex/ or python/, so that wording needs updating too. Helper installers and --install-python are Python-specific; a CLI flag or `labshelf doctor` entry would be new."
  - "Q5 Process seam: there is no process port in packages/core/src/ports. Core node modules spawn directly with node:child_process (runCancellable in latex/node/run.ts, cellSession.ts in qmd/compute/node, execFileImpl injected into installPython for tests, terminal platform/system.ts for open and clipboard). Tests inject execFileImpl or similar. For a deck exporter either call runCancellable (lives under latex/node, so importing from a decks module crosses a domain boundary; check lint:modules) or add a small injected RunProcess type to the exporter's options, following the execFileImpl pattern."
  - "VS Code: no browser launching either. The webview/Helper path in D9 is out of this brief's scope."
  - "Q3 project resolution has no single 'read sections and figures' function. Manuscript = createProjectSources + outline, bib = listBibliographyFiles + parseBibEntries (generated bibliography per BIBLIOGRAPHY_HEADER in bibliography.ts:183), figures = readFigureBuildStates plus a file walk (not found as a ready-made figure list). Check packages/core/src/writing/project/projectEntry.ts and projectFile.ts for ProjectSettings (id, title, format, figures)."
  - "Q6 Test layout: packages/terminal/__tests__/{cli,platform,library,libraryUi,screen,helper,fixtures} with jest.config.cjs (ts-jest through the aliased typescript-js 6). Run through node scripts/agents/run.mjs test terminal."
  - "`labshelf build` for a library without TeX prompts through a TTY; an MCP server has no TTY, so createTtyAsk() returns undefined and prompts decline."
