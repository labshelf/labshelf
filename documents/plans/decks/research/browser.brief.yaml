schema: brief/v1
area: browser extension glue for decks (editor tab, project files, Helper PDF, print fallback)
question: "how the extension reaches project files, how a Helper message is added, how a deck editor page/tab is added, CSP/sandbox, print, Firefox/Chrome, tests"
sha: 54b5c6f9
reuse:
  - {symbol: TAB_KIND_SPECS, path: packages/core/src/libraryUi/tabModel.ts, lines: "20-41", why: "There is ONE extension page that opens projects: libraryPage (libraryUi/libraryPage.ts, bundle libraryPage/pageEntry.js). Project files (source, note, preview, comments, history, search) are workspace TABS of that page, not separate pages. A deck editor fits as a new tab kind (e.g. 'deck' with params projectId, path). Add the kind here (id = kind + URI-encoded params), then register its body in the browser TAB_KINDS."}
  - {symbol: TAB_KINDS, path: packages/browser/src/libraryUi/editorArea/tabKinds.ts, lines: "60-100", why: "Record<TabKindName, TabKind>; each kind is define(kind, () => import('./xTab.js')), so esbuild splitting emits it as a lazy chunk under libraryPage/chunks (does not grow the first load). loadPaper (line ~80) already mounts an iframe in a tab with renderElement('iframe', ...). TabContext gives ctx.fs (LibraryFileSystem), ctx.project() (session, helperProject, notes), ctx.tab.setDirty/onBeforeClose, ctx.logger."}
  - {symbol: createNoteSaver / projectNoteTab mountTab, path: packages/browser/src/libraryUi/editorArea/projectNoteTab.ts, lines: "1-60", why: "Pattern for an editor tab that writes project files: serial save queue, setDirty, onBeforeClose flush, toast on failure. Copy this shape for the deck editor save."}
  - {symbol: LibraryFileSystem (ctx.fs), path: packages/browser/src/storage/libraryFileSystem.ts, lines: "1-60", why: "How files are reached: ONE LibraryFileSystem that routes to a folder served by the bridge (native host dev.labshelf.bridge, started as labshelf-bridge by the standalone helper binary or a desktop app: BridgeClient/BridgeFileSystem in packages/core/src/bridge), or a folder the user picked with the File System Access API (storage/pickedDir.ts DirFileSystem, wins over the bridge), or IndexedDB (storage/idb.ts IdbFileSystem) when neither. Project paths are library-root-relative, '/'-separated, confined (no .., no symlink escape, Windows device names refused). Writes go through writeFile+chunk+commit (base64 chunks, atomic via .research/tmp). Project-relative access: storage/projectNoteFiles.ts."}
  - {symbol: createBrowserLatexHelper / getBrowserCellPorts, path: packages/browser/src/helper/client.ts, lines: "1-30", why: "Browser side of Helper: connectBrowserNative(HELPER_HOST_NAME) for hello, then a binary WebSocket (openHelperSocket, lines 30-60) using encodeConnectionMessage(envelope, payloadBytes) frames, so a reply can carry raw bytes (a PDF) as payload and a request could carry the HTML as payload instead of base64 in JSON. cellPorts.ts shows the lazy one-connection-per-page pattern and the 'LabShelf Helper is not ready' toast (NO_HELPER)."}
  - {symbol: ILatexHelper.runCell / NativeHelperSession.runCell, path: packages/core/src/helper/helperClient.ts, lines: "183-205", why: "Template for a new request/reply: readySocket(), socket.request({type, ...}, step => step.type==='x' ? {done: ...} : undefined, onId), AbortSignal -> cancel message. A printPdf call follows this."}
  - {symbol: downloadTextFile, path: packages/browser/src/platform/bx.ts, lines: "16-27", why: "Existing way to save a file: Blob -> URL.createObjectURL -> bx.downloads.download({saveAs:true}), revoke after 60 s. Reuse/generalise for saving the PDF bytes (Uint8Array) and the self-contained HTML export. 'downloads' permission already in both manifests."}
  - {symbol: showPdf / URL.createObjectURL + bx.tabs.create, path: packages/browser/src/writing/projectList.ts, lines: "90-102", why: "Existing way to open generated content in a new tab: blob URL + bx.tabs.create({url}). Same used by writing/builds.ts:68 for PDFs. This is the print-fallback route: open a blob: text/html tab then call print there (no code does window.print today, see risks)."}
read:
  - {path: documents/plans/decks/brief.md, lines: "15-21", why: "D6 editor (sandboxed iframe, own CSP), D9 export order, D11 ~1 MB size budget."}
  - {path: packages/browser/build/build.mjs, lines: "12-34", why: "ENTRIES list: esbuild per entry, ESM, target chrome125/firefox128, .css loaded as text, splitting only for libraryPage and reader. No size gate in the build; the only perf script is packages/browser/scripts/perfCheck.mjs (manual, needs Chromium + bridge, not CI). Measure the 1 MB budget yourself on dist/*/libraryPage/chunks."}
  - {path: packages/browser/src/libraryPage/index.html, lines: "1-40", why: "The page HTML: loads ../ui/styles/*.css and pageEntry.js. New CSS for the deck editor needs a <link> here (copyAssets copies ui/styles) or a text-imported CSS inside the chunk."}
  - {path: packages/browser/manifest.chrome.json, lines: "1-75", why: "MV3. extension_pages CSP is only \"script-src 'self' 'wasm-unsafe-eval'; object-src 'self';\" (no style-src/frame-src/child-src, so inline styles and iframes are allowed). No 'sandbox' key. permissions: storage, activeTab, scripting, downloads, offscreen (Chrome only), nativeMessaging. web_accessible_resources only libraryPage/index.html. No new manifest entry is needed for a tab kind."}
  - {path: packages/browser/manifest.firefox.json, lines: "1-75", why: "Differs from Chrome only by: no key/minimum_chrome_version, browser_specific_settings.gecko (id labshelf@lucanaasser.dev, strict_min_version 128), protocol_handlers web+labshelf -> /libraryPage/index.html?link=%s, no 'offscreen' permission, background.scripts instead of service_worker. Same CSP."}
  - {path: packages/core/src/helper/helperMessages.ts, lines: "10-100", why: "Protocol: PROTOCOL_VERSION = 10 (line 12), HELPER_VERSION 0.4.0, limits MAX_SOCKET_MESSAGE_BYTES = 16 MiB (line 16), MAX_CELL_CODE_BYTES 1 MiB, MAX_PROJECT_BYTES 500 MiB; ToHelperMessage union (lines ~58-80) and ToPageMessage (line ~82+)."}
  - {path: packages/core/src/helper/parseHelperMessage.ts, lines: "255-290", why: "Every incoming message has a validator in the table keyed by type (runCell at 263, readToHelper at 275, readToPage for replies like cellResult at 349). Unknown keys dropped, unknown type refused."}
  - {path: packages/core/src/helper/node/runHelperHost.ts, lines: "28-75 and 184-215", why: "createCellHandlers is the model for a handler (message, send) => reply; runHelperHost registers handlers by type in the createHelperAnswerer({...}) object at lines ~192-200. A new printPdf handler is added there (new createPrintHandlers module under packages/core/src/helper/node, exported from node/index.ts)."}
  - {path: packages/core/src/helper/node/helperConnection.ts, lines: "14-60", why: "Frame limits: native stdio frames IN from the page cap at 4 MiB (MAX_INCOMING_FRAME_BYTES line 18); native frames OUT from the helper cap at 1 MiB (MAX_OUTGOING_FRAME_BYTES line 46, browser host-message limit); the loopback WebSocket carries up to 16 MiB per message (MAX_SOCKET_MESSAGE_BYTES). So send the deck HTML and read the PDF over the SOCKET (as binary payload), never over the native port. Deck with inlined images larger than 16 MiB must be chunked or the images referenced from files under the project (the helper can read the project root, openProject) ."}
  - {path: packages/core/src/helper/node/helperBuild.ts, lines: "75-90", why: "Example of the 16 MiB check turned into a 'limit' error; a PDF reply must do the same."}
  - {path: packages/core/src/helper/helperPaths.ts, lines: "135-150", why: "ILatexHelper interface (the page-facing port) and its fakes: add printPdf here; packages/core/__tests__/helper/fakeHelperClient.ts must gain the method."}
  - {path: packages/terminal/src/helper/helperEntry.ts, lines: "1-150", why: "Standalone LabShelf Helper entry (native-messaging host dev.labshelf.helper; same binary is labshelf-bridge for the library folder). It calls runHelperHost, so core handlers reach it with no terminal change. packages/core/src/helper/node/runHelperScriptHost.ts is the same host inside desktop apps (host 'vscode' | 'terminal'), so a core handler is available in all three."}
  - {path: documents/contracts/helper.md, lines: "#messages #version #transport", why: "Contract to update with the new message; protocol version must be bumped (10 -> 11) and ready.protocol comparison asks the older side to update."}
  - {path: documents/contracts/bridge.md, lines: "#framing #paths #file-transfer", why: "File access rules the deck save must respect (chunked base64 writes, 1 write at a time, library-relative confined paths)."}
