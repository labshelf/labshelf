risks:
  - "Q1 answer: only the library page (libraryPage/index.html -> libraryUi/libraryPage.ts) opens writing projects; there is no separate companion or note page. Notes (notes/*.qmd) open in projectNoteTab, other files in sourceTab, via workspace.openTab(kind, params). Reader page (reader/index.html) is papers only."
  - "Sandboxed iframe: no sandbox manifest key exists and none is needed. A <iframe sandbox srcdoc> inside an extension page inherits the extension_pages CSP script-src 'self', so inline <script> in the deck is blocked (fine for static decks; inline <style> and images from data:/blob: are NOT restricted since the CSP has no style-src/img-src, but check deck 'own CSP' in D6: a <meta http-equiv=CSP> inside srcdoc can only tighten it). Without allow-same-origin the iframe has an opaque origin, so editor-to-frame needs postMessage or allow-same-origin (which makes sandbox moot with scripts). Chrome MV3 'sandbox' pages (relaxed CSP) are Chrome only; Firefox does not support the manifest sandbox key, so do not use it. Nothing in the repo uses srcdoc or sandbox today (the only iframes are the PDF reader frame in tabKinds.ts loadPaper and the preview frame in writing/builds.ts, both src= to extension pages). Verify in a real Firefox and Chrome run."
  - "No window.print() or print dialog code exists anywhere in packages/*/src. Print fallback has to be new: open blob text/html in bx.tabs.create and call print from a script, but the extension_pages CSP blocks inline script and a blob: page opened as a tab is not an extension page (no extension CSP, own origin), so a small injected script in the blob HTML or a dedicated extension print page (new ENTRIES item in build.mjs + html + @page CSS) is required. Prefer a dedicated deck/print page: it can call window.print() with CSP-safe external script."
  - "Firefox: bx.tabs.create with a blob: URL created in the page works (projectList.ts does it for PDFs). Chrome blocks navigating to blob: from some contexts only in the service worker; here it is the page, fine."
  - "Helper limits: deck HTML plus inlined images over 16 MiB (socket) fails; native port in is 4 MiB and out 1 MiB so never use it for decks. Chromium launch, system Chromium discovery and chrome-headless-shell download (D9) do not exist in the repo (rg for headless/chrome-headless-shell found nothing outside latex build sandbox code); managed-tools.md is the pattern. Standalone Helper also runs in vscode/terminal host mode, so the handler must degrade with a clear error code when no Chromium exists, and the page then falls back to print."
  - "Protocol version bump (10 -> 11) makes an older installed Helper show an 'update LabShelf Helper' prompt even for users who never print; consider gating the new message by an optional ready capability instead (ready.python is the existing precedent: 'a helper that omits it predates Python')."
  - "Firefox vs Chrome handled in: packages/browser/manifest.*.json (diff above), build.mjs chromeOnly entry for offscreen, platform/bx.ts (webextension-polyfill 'bx'), PLATFORM: comments in writing/builds.ts:~50 and in contracts/helper (Firefox ws upgrade CSP). There is NO packages/browser/src/platform folder wrapper for tabs/print differences beyond bx.ts."
  - "Size budget D11 (~1 MB): no automated check exists; esbuild output has sourcemaps on (sourcemap: true) so measure .js only. Lazy tab chunk keeps first load unchanged."
  - "browser jest runs in testEnvironment node with a mocked webextension-polyfill (__tests__/support); DOM-heavy tab bodies are tested through core dom with fakes, check __tests__/libraryUi/editorArea for the harness before writing the deck tab test. Coverage thresholds only apply to the listed collectCoverageFrom files."
