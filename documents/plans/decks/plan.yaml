schema: plan/v1
slug: decks
title: Talks and posters (decks) in writing projects
status: approved
level: N3
goal: "A LaTeX or Typst writing project gets talks and posters as HTML decks. An external Claude writes them through `labshelf mcp` under editability rules the server hands out, and every write is validated deterministically. The user edits them in a LabShelf deck editor in VS Code and the browser, presents talks with a presenter view, previews posters at real size with a calibrated ruler, exports PDF and single-file HTML, and shares them by an encrypted link with a QR code. Brief: documents/plans/decks/brief.md."
decisions:
  - id: D1
    text: "Deck folders are `talks/<name>/` and `posters/<name>/` at the project root, nothing else. A deck is `<folder>/deck.html` with `<folder>/theme.css` beside it; assets are any files inside the deck folder (suggested `assets/`), referenced by relative paths that stay inside the folder. Vocabulary v1 (documents/contracts/decks.md): `<html data-deck=\"talk|poster\" data-deck-version=\"1\" data-deck-size=\"<w>x<h><unit>\">`; exactly one `<link rel=\"stylesheet\" href=\"theme.css\" data-deck-theme>` in head; slides are `<section data-slide>` direct children of body (a poster has exactly one); blocks are direct children of a slide with `data-block=\"<id>\"` (id `^[a-z][a-z0-9-]{0,39}$`, unique in the deck) and an inline style holding `left`, `top`, `width`, `height` in px (numbers with at most 2 decimals; other declarations in that attribute are free and kept); speaker notes are one `<aside data-notes>` direct child of a slide; math is `<span data-math>TeX</span>` or `<div data-math=\"display\">TeX</div>` holding TeX source; a text leaf is an element inside a block whose children are only text, `<br>` and phrasing elements (a b i em strong u s sub sup small mark code span) or math, not itself inside another leaf; only leaves are edited as text. Inside a block HTML and CSS are free."
    why: "Brief D1 left names, units and the theme file to the contract package; fixing them here lets session 1's tests pin them. Inline left/top/width/height keep deck.html readable and printable on its own; px everywhere (posters at 96 px/in) gives one coordinate system."
  - id: D2
    text: "Sizes: `<w>x<h>px` (integers) for talks, `<w>x<h>mm` or `<w>x<h>in` (up to 1 decimal) for posters. Presets: talks 16:9 1920x1080px, 4:3 1440x1080px, 16:10 1920x1200px; posters A0 841x1189mm, A1 594x841mm, A2 420x594mm, ARCH E 36x48in, 36x48in, 48x36in, each portrait or landscape (landscape swaps). Any custom size within 320..7680 px per side for talks and 100..2000 mm per side for posters. Canvas px of a poster = physical size at 96 px/in. Changing size scales block geometry by the width and height ratios when `scale` is set (the editor sets it), else keeps it."
    why: "Brief D2; the ranges keep raster and print sane."
  - id: D3
    text: "One pure validator `validateDeck(html, {theme?, files?})` in core returns diagnostics sorted by (line, column, code): `{code, severity: error|warning, slide?, block?, line, column, message, hint}`. Codes are DECK-prefixed and listed in documents/contracts/decks.md#diagnostics (session 1 spec 1.3 lists them). Errors block an MCP write; warnings never do. Scripts, on* attributes, javascript: URLs, iframe/object/embed/frame/form/base and meta refresh are errors; an asset reference that is absolute, remote (http, https, //) or escapes the deck folder is an error (an `<a href>` to http(s) is allowed); backdrop-filter and animated filter are warnings. An invalid deck opens read-only with its diagnostics."
    why: "Brief D3; no scripts at all lets the editor frame run without allow-scripts."
  - id: D4
    text: "Deck HTML is parsed by a small offset-keeping tokenizer in core (no new dependency): the model holds source ranges for the root attributes, the theme link, each slide, block, style declaration, leaf and notes element. Every edit operation is a list of text splices on those ranges, so applying it keeps every other byte; edits to theme.css change only the value of one custom property in its first `:root` rule (added at the end of that rule when missing)."
    why: "Byte-for-byte round trip (A3) and no DOM in core logic (runs in Node for MCP)."
  - id: D5
    text: "Linked blocks: a block may carry `data-source=\"figure:<project path>|eq:<label>|table:<label>|cite:<key>\"` and `data-source-hash=\"<12 hex>\"` (first 12 hex of SHA-256 through core/hash). The current hash is of the figure file bytes, of the trimmed source text of the environment holding the label (LaTeX or Typst), or of the library record's formatCitations().apa for a cite key (.bib entry text when the library lacks the key). States fresh, stale, missing; the editor shows a stale block with an 'Out of date' badge and an Update action that rewrites the hash (and for cite blocks the text); the words carry the state, not colour."
    why: "Brief D4, following the note-origin hash model (writing brief) with one hash side, since the deck copy is free to differ."
  - id: D6
    text: "MCP: a hand-rolled JSON-RPC 2.0 server over newline-delimited stdio in core (`packages/core/src/mcp/`, protocol version 2025-06-18; initialize, notifications/initialized, ping, tools/list, tools/call; -32601/-32602 errors; nothing but JSON-RPC on stdout, logs to stderr), no SDK dependency. `labshelf mcp [--project <folder|id>]` (default: the project holding the cwd, via findProject) runs it with deck tools: deck_rules, project_context, deck_list, deck_read, deck_create, deck_edit, deck_validate. Writes resolve real paths and must land in `talks/*/` or `posters/*/` of that project; every write is validated and refused with the diagnostics when there is an error. project_context returns at most 64 KB per call (outline, one section by heading, figure files, bibliography entries), paginated by a cursor. Library read tools stay with the ai-mcp plan."
    why: "Brief D5; ai-mcp D2/D6 (terminal composition root, authorised roots); no SDK keeps control of tool schema size and avoids zod."
  - id: D7
    text: "Editor rendering: the slide renders in an iframe with `sandbox=\"allow-same-origin\"` (never allow-scripts) whose srcdoc carries a CSP meta (`default-src 'none'; style-src 'unsafe-inline' <asset origin>; img-src <asset origin> data: blob:; font-src <asset origin> data:`); the parent reads geometry and edits leaves through contentDocument. Base layout CSS (slide size, `[data-block]{position:absolute}`, notes hidden) is generated from data-deck-size and injected; it is never written to deck.html. Assets reach the frame through a host port `resolveAsset(path) -> Promise<string>` (VS Code: webview URIs with the project in localResourceRoots; browser: blob URLs of downscaled proxies, max 1600 px, originals on export). The VS Code deck webview has its own shell CSP adding `style-src 'unsafe-inline'`, `img-src cspSource data: blob:`, `font-src cspSource data:` and `frame-src 'self' about: blob:`; the editor chrome itself still uses no style= markup (only CSSOM)."
    why: "Brief D6 isolation; srcdoc frames inherit the parent CSP (vscode and ui briefs), so the deck page needs inline styles allowed while scripts stay nonce-only."
  - id: D8
    text: "Editor interaction: one live frame for the current slide; strip thumbnails rasterised through an SVG foreignObject of the slide (assets inlined as proxy data URLs) onto a 320 px wide canvas, cached by SHA-256 of slide HTML plus theme, falling back to a static scaled frame when the raster fails. Drag and resize change only a CSS transform until release, then write one edit. Snapping on by default (Alt off): to an 8 px grid in slide px, to slide edges and centre and to other blocks' edges and centres within 6 screen px, with dotted guides. Undo/redo: an internal history of (deck, theme) snapshots per gesture; in VS Code the host owns undo (each gesture is one WorkspaceEdit, VS Code's document undo applies), the editor runs with `history: \"host\"`. Source view: a plain CodeMirror view (no new language dependency) of deck.html; source edits re-parse after 300 ms idle. Theme panel lists the custom properties of theme.css's first :root rule (colour inputs for colour values, text inputs otherwise). Keyboard: arrows nudge 1 px, Shift 10 px, Delete removes a block, Mod+D duplicates a slide in the strip."
    why: "Brief D6 performance rules; the drawing editor's snap/history patterns (ui brief)."
  - id: D9
    text: "Presenter: audience view full screen (requestFullscreen when allowed), presenter view with notes, elapsed timer (starts on first advance, pause and reset), current and next slide; both follow one PresenterChannel port (BroadcastChannel in the browser; host relay between two webview panels in VS Code, the audience panel moved to a new window). Keys: Right, Down, Space, PageDown next; Left, Up, PageUp previous; Home, End; B black screen; Esc leaves."
    why: "Brief D7."
  - id: D10
    text: "Poster preview: zoom (Mod+wheel, 10%..400%) and pan (drag, Space+drag) over the whole poster; rulers on top and left in mm or in (toggle). Calibration: the user drags a line to match a card of 85.6 mm once; the result (screen px per mm) is stored device-local (VS Code globalState without sync, browser storage.local) and never synced; until calibrated the ruler uses 96 px/in and says 'Not calibrated'. Small-text warning: a text leaf whose computed font size at print is below 24 pt x (shorter poster side / 841 mm) is flagged in a list and on the canvas."
    why: "Brief D8; the threshold scales linearly with the shorter side (A1 about 17 pt)."
  - id: D11
    text: "Export: single-file HTML from core (images and fonts as data URIs, theme inlined, math pre-rendered to SVG with the core MathJax, base layout and `@page { size: <w> <h>; margin: 0 }` CSS, one small inline script for keyboard navigation and scaling, and `#print` calls window.print()). PDF from that file through Chromium, in order: LABSHELF_CHROMIUM env override, a system Chrome, Edge, Brave or Chromium (PATH names and per-OS install paths), the managed chrome-headless-shell (documents/contracts/managed-tools.md gains a `chrome/` folder with a pinned version and SHA-256 per platform, downloaded only when the user accepts), run `--headless --print-to-pdf --no-pdf-header-footer`; in the browser through LabShelf Helper's new `printPdf` message (announced by an optional ready capability, no protocol bump). With none, the HTML opens with `#print` in the default browser (or a browser tab) and a message says installing Chromium (browser: the Helper) saves the PDF automatically. PDF is RGB."
    why: "Brief D9; one export path for every host; a capability flag avoids forcing every Helper user to update."
  - id: D12
    text: "Share: the deck travels as its single-file HTML in convergent blobs (split in parts under the 25 MiB KV limit as PDFs are) with a manifest sealed under a new frame kind `share-deck-manifest` and a new HKDF info label `labshelf-share-deck-manifest`: `{v: 1, kind: \"deck\", title, deck: \"talk\"|\"poster\", size, parts: [{blob, bytes}]}`. Same link format and Worker paths, so the Worker is unchanged; paper manifests, their decoder and openShare stay untouched; a new openAnyShare tries the paper manifest, then the deck manifest. A pre-deck viewer shows its existing 'damaged link' message for a deck link (accepted). The share list entry gains an optional `kind: \"deck\"`; revoking works as for folders. The share page presents a deck in a sandboxed frame (allow-scripts, no same-origin). QR: a dependency-free encoder in core (`packages/core/src/qr/`, byte mode, ECC M, versions 1-10) writes `assets/share-qr.svg` into the deck folder and inserts an image block."
    why: "Brief D10: the link, encryption and paper manifest are frozen; a new frame kind cannot be confused with a paper manifest."
  - id: D13
    text: "Size budget: the deck editor is a lazy chunk (core export `./deckEditor`, like `./drawingEditor`) and each extension's added JavaScript is at most 1 MB minified, MathJax and CodeMirror already shipped not counted; a build test measures it. No bundled Chromium, no theme fonts."
    why: "Brief D11."
  - id: D14
    text: "Defaults where the brief is silent, keeping current behaviour: code lives in a new core domain `packages/core/src/decks/` (dom/, node/, editor/ inside it); labshelf.yaml is not changed (decks are found by folder); the VS Code deck editor registers with priority `option` for `**/talks/*/deck.html` and `**/posters/*/deck.html` and project commands open decks with it, so other deck.html files keep opening as text; the terminal gets `labshelf deck export <deck> --pdf|--html` besides `labshelf mcp`; no new dependencies anywhere."
    why: "Unattended run: the user is away; these keep existing files, commands and dependencies as they are."
acceptance:
  - id: A1
    check: "The validator returns the same diagnostics for the same input, each with code, severity, location and hint; an error-free sample talk and poster pass; each rule has a failing sample (tests)"
  - id: A2
    check: "Through MCP a client gets the rules, creates a deck in a project, a write that breaks a rule is rejected with the diagnostics, and a write outside the project's deck folders is refused (tests over stdio)"
  - id: A3
    check: "Move, resize, edit text, reorder/add/duplicate/delete slides, theme change and size change round-trip: everything else stays byte for byte and the result validates (tests)"
  - id: A4
    check: "In VS Code a deck opens in the LabShelf deck editor; drag, resize, text edit, undo and theme change write the file; the text editor and the deck editor show each other's edits (tests on the provider and sync, then by hand)"
  - id: A5
    check: "Presenter mode shows notes, timer, current and next slide, and the full-screen view follows (tests on the presenter state and DOM, then by hand)"
  - id: A6
    check: "The poster preview shows the calibrated ruler in mm and in and flags text below the size threshold (tests, then by hand)"
  - id: A7
    check: "PDF export gives a PDF of the deck's page size with a system Chromium; with none it opens the print fallback with the Chromium message; the single-file HTML opens offline (tests; the Chromium test runs when a Chromium is found)"
  - id: A8
    check: "A deck shared by link opens in the viewer and presents; revoking makes it unreadable; existing paper share links keep working (tests)"
  - id: A9
    check: "A block linked to a paper element shows out of date when the source changes (tests)"
