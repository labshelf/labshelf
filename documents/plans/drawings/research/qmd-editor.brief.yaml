contracts: ["qmd-items#outputs", "qmd-items#format", "qmd-items#project-notes"]
commands:
  - "node scripts/agents/run.mjs test core -- packages/core/__tests__/qmd/editor/bodyToDoc.test.ts"
risks:
  - "```{.tikz} reads today as code_cell lang null; a figure div as raw_block. Both round-trip; a new node must keep exact bytes."
  - "Plot PNGs are inline data URIs; the editor has no file port."
  - "Items are merged three-way and held in Yjs; a sidecar file would sit outside merge and sharing."
  - "MathJax SVG has style= attributes the webview CSP forbids; parseMathSvg strips them."
  - "Collab undo and normal history differ; commit a drawing as one setNodeMarkup transaction."
