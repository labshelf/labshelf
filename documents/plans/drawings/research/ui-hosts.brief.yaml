commands: ["node scripts/agents/run.mjs test core -- packages/core/__tests__/qmd/dom.test.ts", "node scripts/agents/run.mjs build vscode", "node scripts/agents/run.mjs build browser", "pnpm --filter @labshelf/core tokens"]
risks:
  - "UI rules: reuse core/ui/dom widgets; tokens not app CSS; shared icon set; keyboard access; empty/error/long states; light/dark; status not by colour alone; accessible names."
  - "Deps: no d3 or SVG library in core. Has mathjax-full, plotly.js-strict-dist-min, pdf-lib, pdfjs-dist, prosemirror-*, codemirror, yjs, typst.ts."
  - "No file-writing path from the editor. Plot PNGs are data URIs inside the .qmd output block, not files."
  - "CSP: no style= attributes in VS Code webviews, no blob:, no eval. SVG presentation attributes untested against style-src."
  - "PDF: LabShelf never runs Quarto; no TikZ or pandoc-ext/diagram handling anywhere. SVG to PDF in Quarto needs rsvg/inkscape."
  - "Bundle: no budget; heavy modules are lazy subpath exports (@labshelf/core/math)."
  - "Lint gates: depcruise, knip, jscpd, lint:modules (first-line header comment), lint:rules, lint:words."
