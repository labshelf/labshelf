      - {path: packages/core/src/qmd/drawing/block.ts, signature: "export interface DrawingBlock { model: DrawingModel; tikz: string; png: string; alt: string; svg: string; source: string; handEdited: boolean } export function readDrawingBlock(text: string): DrawingBlock | null; export function formatDrawingBlock(parts: { model: DrawingModel; tikz: string; png: string; alt: string; svg: string }, eol: string): string | null"}
    decided:
      - "D1 and D2 of plan.yaml are the spec. formatDrawingBlock returns null over 256 KB (262144 UTF-8 bytes)."
      - "readDrawingBlock returns null for anything that is not exactly the div with D1's five parts in order (blank lines between them allowed, \\n or \\r\\n); tikz is the tikzpicture text inside the guard; handEdited is true when source differs from its hash. The guard and the `\\fi` fence must match D1 exactly or the block is not a drawing."
      - "parseDrawingModel rejects unknown `v`, dangling point or axes ids, duplicate ids, non-finite numbers and empty or reversed ranges; it does not parse `expr` (an unparsable expression is still a valid model), and rounds coordinates to 0.01."
    acceptance:
      - {id: A1, check: "round trip, rejection cases and model validation as A1"}
    tests:
