  - id: "1.2"
    plan: drawings
    sha: a0318427
    goal: "Function language: parse plain math and the LaTeX forms of D9 into an AST without eval, evaluate it, and sample a function adaptively with breaks and clipping."
    level: behaviour
    runner:
      agent: implementer
      model: sonnet
    edit: []
    create:
      - packages/core/src/qmd/drawing/expr.ts
      - packages/core/src/qmd/drawing/sample.ts
    seams:
      - {path: packages/core/src/qmd/drawing/expr.ts, signature: "export type ExprResult = { ok: true; evaluate(x: number): number } | { ok: false; error: string; at: number }; export function parseExpr(source: string): ExprResult"}
      - {path: packages/core/src/qmd/drawing/sample.ts, signature: "export function sampleFunction(f: (x: number) => number, domain: readonly [number, number], range: readonly [number, number], maxPoints?: number): Array<Array<readonly [number, number]>>"}
    decided:
      - "D9 is the spec. A recursive-descent parser; `x` is the only variable; `^` is right-associative and binds tighter than unary minus (`-x^2` = -(x^2)); implicit multiplication between a number, `x`, a constant, a function call or a parenthesis (`2x`, `2(x+1)`, `x sin(x)`); `log` is base 10, `ln` natural."
      - "LaTeX is normalised first: `\\frac{a}{b}` to `(a)/(b)`, `\\sqrt{a}` to `sqrt(a)`, `\\sin` etc. to `sin` (an argument without parentheses binds the next factor: `\\sin x` = sin(x)), `\\pi` to pi, `e^{a}` to exp(a), `\\cdot` and `\\times` to `*`, `\\left(`/`\\right)` to parentheses, braces to parentheses."
      - "error names the first unexpected token; `at` is its 0-based offset in the original source."
      - "Sampling: 64 equal intervals, a midpoint added where the turn angle exceeds 5° or a value is non-finite, up to maxPoints (default 400); a run breaks at non-finite values and where consecutive |Δy| exceeds the range height; each run is clipped to the range (the crossing point is interpolated). Points rounded to 4 significant digits."
    acceptance:
      - {id: A6, check: "syntax, LaTeX forms, no eval, subdivision, asymptote breaks and clipping as A6"}
    tests:
      hidden: [packages/core/__tests__/qmd/drawing/expr.test.ts, packages/core/__tests__/qmd/drawing/sample.test.ts]
      command: node scripts/agents/run.mjs test core --spec 1.2 --plan drawings -- packages/core/__tests__/qmd/drawing
