packages:
  - id: "5.1"
    plan: drawings
    sha: a0318427
    goal: "openDrawingEditor: in-place SVG canvas with grid, guides, hit testing, pointer and keyboard events into applyEvent, live rendering through layout and formatDrawingSvg, toolbar with the tools and styles of D6 (eight tools, Function included) and the shared icons, Done/Esc/outside click commit; lazy subpath export in core/package.json."
    level: behaviour
    runner:
      agent: implementer
      model: fable
    create:
      - packages/core/src/qmd/drawing/editor/openDrawingEditor.ts
      - packages/core/src/qmd/drawing/editor/canvas.ts
      - packages/core/src/qmd/drawing/editor/toolbar.ts
      - packages/core/src/qmd/drawing/editor/drawing-editor.css
    edit:
      - {path: packages/core/package.json, lines: "62-67", why: "subpath export like @labshelf/core/math"}
      - {path: packages/core/src/qmd/dom/qmdEditor.ts, lines: "1-140", why: "replace session 3's stub drawing editor loader (rejects 'the drawing editor is not available yet') with the real lazy import of openDrawingEditor"}
      - {path: packages/core/tools/codicons/codicons.json, lines: "1-29", why: "tool icons, then `pnpm --filter @labshelf/core codicons`"}
    read:
      - {path: documents/plans/drawings/research/ui-hosts.brief.yaml, lines: "1-52", why: "UI kit, CSP, tokens, theme"}
      - {path: packages/core/src/qmd/dom/plotRender.ts, lines: "1-60", why: "lazy loading and theme redraw"}
    seams:
      - {path: packages/core/src/qmd/drawing/editor/openDrawingEditor.ts, signature: "export function openDrawingEditor(host: HTMLElement, model: import(\"../model.js\").DrawingModel, done: (model: import(\"../model.js\").DrawingModel | null) => void): { destroy(): void }"}
    decided:
      - "Read `node scripts/docs/doc.mjs ui` sections implementation and applying-the-principles first. Toolbar buttons have accessible names with the shortcut in the title; status never by colour alone."
      - "DOM contract the tests rely on: the toolbar has one button per tool with accessible names Select, Point, Line, Arrow, Circle, Rectangle, Function, Label, each with its shortcut letter (V P L A C R F T) in its title; the active tool's button has aria-pressed=\"true\", the others \"false\"; colour, dash and thick controls, undo, redo and Done buttons are named so. MathJax is reached only through loadCoreMath of src/latex/hover/index (the tests mock that module)."
      - "A7 is checked in the test by bundling openDrawingEditor.ts with the repo's esbuild (bundle, minify, src/latex/hover/index external) and asserting at most 61440 bytes."
      - "Pointer capture during drags; coordinates converted with getScreenCTM; the canvas grows by 2 units past the furthest element."
      - "No style= anywhere: positions are SVG attributes, everything else CSS classes."
    acceptance:
      - {id: A7, check: "editor chunk at most 60 KB minified, MathJax not counted"}
      - {id: A8, check: "no style= in the editor DOM (test), CSP by hand"}
    tests:
      hidden: [documents/plans/drawings/tests/5.1/packages/core/__tests__/qmd/drawing/editor/openDrawingEditor.test.ts]
      command: node scripts/agents/run.mjs test core --spec 5.1 --plan drawings -- packages/core/__tests__/qmd/drawing/editor/openDrawingEditor.test.ts
    commands:
      - node scripts/agents/run.mjs build vscode
      - node scripts/agents/run.mjs build browser
  - id: "5.2"
    plan: drawings
    sha: a0318427
    goal: "Labels: an in-place TeX field over the point or segment (Enter, Tab, Esc as D7), rendered with MathJax through the exported parseMathSvg, the expression field of a function (live curve while typing) and the axes range fields, broken labels and expressions boxed and blocking commit (D9, D10)."
    level: behaviour
    runner:
      agent: implementer
      model: opus
    depends_on: ["5.1"]
    create:
      - packages/core/src/qmd/drawing/editor/labelField.ts
    edit:
      - {path: packages/core/src/qmd/dom/mathView.ts, lines: "14-40", why: "export parseMathSvg"}
    seams:
      - {path: packages/core/src/qmd/drawing/editor/openDrawingEditor.ts, signature: "export function openDrawingEditor(host: HTMLElement, model: import(\"../model.js\").DrawingModel, done: (model: import(\"../model.js\").DrawingModel | null) => void): { destroy(): void }"}
    decided:
      - "Same DOM contract as 5.1. Double-click on empty canvas makes a point and focuses an in-place TeX input over it at once; Enter confirms, Tab confirms and moves to the next point, Esc leaves the point unlabelled. Double-click on a segment opens its label field; double-click on axes opens the range and axis-label fields; the Function tool opens the expression field and the curve redraws on every input event."
      - "Labels typeset with MathJax reached only through loadCoreMath of src/latex/hover/index, the output passed through parseMathSvg, now exported from src/qmd/dom/mathView.ts (style= stripped). A label or expression that does not parse shows its source in a red dashed box (CSS class, no style=), the editor names it in a status line, and Done does not call `done` while one is broken."
    acceptance:
      - {id: A5, check: "label flow"}
      - {id: A6, check: "a bad expression is boxed, named and blocks commit"}
    tests:
      hidden: [documents/plans/drawings/tests/5.2/packages/core/__tests__/qmd/drawing/editor/labelField.test.ts]
      command: node scripts/agents/run.mjs test core --spec 5.2 --plan drawings -- packages/core/__tests__/qmd/drawing/editor/labelField.test.ts
  - id: "5.3"
    plan: drawings
    sha: a0318427
    goal: "The user checks A9 by hand in VS Code and in the browser."
    level: task
    runner:
      agent: main
      model: opus
    edit: []
    depends_on: ["5.2"]
    decided:
