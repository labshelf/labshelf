    seams:
      - {path: packages/core/src/qmd/drawing/png.ts, signature: "export interface CanvasFactory { create(width: number, height: number): { getContext(kind: '2d'): CanvasRenderingContext2D | null; toDataURL(type: 'image/png'): string } } export function paintDrawingPng(svg: string, canvas: CanvasFactory, scale?: number): string | null"}
    decided:
      - "Walks the SVG (DOMParser) and paints path (Path2D with the d string), line, circle, rect, polygon, polyline and use (resolving local #ids, applying transform attributes); currentColor is black, fill none unless set; returns null for anything the sanitizer would reject. Never loads an image."
      - "Tests use @napi-rs/canvas (already a core dependency, Node only) as the CanvasFactory; the DOM host passes document.createElement('canvas')."
    acceptance:
      - {id: A8, check: "paints without loading an image"}
      - {id: A3, check: "PNG uses the same geometry as the SVG"}
    tests:
