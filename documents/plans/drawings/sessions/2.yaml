      command: node scripts/agents/run.mjs test core --spec 1.3 --plan drawings -- packages/core/__tests__/qmd/drawing

  - id: "2.3"
    plan: drawings
    sha: a0318427
    goal: "PNG painter: paints a sanitized drawing SVG on a canvas at 3× with Path2D, black on white, and returns a data URL (D11)."
    level: behaviour
    runner:
      agent: implementer
      model: sonnet
    depends_on: ["2.2"]
    edit: []
    create:
      - packages/core/src/qmd/drawing/png.ts
    read:
