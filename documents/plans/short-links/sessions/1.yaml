    decided:
      - "formatRelayHost(url): url must be https with no username, password, query or hash and a pathname of `/` (else throw TypeError naming the URL). When the hostname matches /^ls-([a-z2-7]{12})\\.([a-z0-9-]+)\\.workers\\.dev$/ and there is no port, the result is `<group1>.<group2>`. Otherwise the result is URL.host (hostname plus `:port` when present); when that text would itself match the short form /^[a-z2-7]{12}\\.[a-z0-9-]+$/ it is ambiguous and formatRelayHost throws TypeError."
      - "parseRelayHost(text): text matching /^([a-z2-7]{12})\\.([a-z0-9-]+)$/ returns `https://ls-<1>.<2>.workers.dev`. Any other text is a whole host: it returns `https://<text>` when new URL(`https://${text}`) succeeds and its host equals text exactly (so lower case, no path, no userinfo, no trailing dot) and text contains no `~`; else undefined. The result never ends in `/`, so it equals the relay URLs stored elsewhere (https://<host>)."
      - "Share link: `https://labshelf.org/s/#<formatRelayHost(relayUrl)>.<bytesToBase64Url(key)>`. SHARE_PAGE_ORIGIN stays https://labshelf.org; export SHARE_PAGE_PATH = \"/s/\"."
      - "parseShareLink(text): trims, new URL (failure → notShareLink); pathname must end in `/s/` (any origin, so test and local pages work) else notShareLink; fragment = decodeURIComponent(hash without #) (failure → notShareLink; keep the PLATFORM comment: VS Code percent-encodes fragments). Split at the LAST `.`: no `.` or empty host part → notShareLink. Host part through parseRelayHost (undefined → badHost); key part through decodeKeyBytes(_, SHARE_LINK_KEY_BYTES) (undefined → badKey). Returns {relayUrl, key}; never throws."
      - "resolveShareLink(link) = {...link, shareId: await deriveShareId(link.key)}, deriveShareId imported from ../collab/index.js (or shareKey.js if collab/index does not export it). The share id is no longer random and never in the link."
      - "formatShareImportUri(link) unchanged except the type: vscode://labshelf.labshelf/importShare?link=<encodeURIComponent(formatShareLink(link))>."
      - "Invite: `labshelf://join#v1.<bytesToBase64Url(shareKey)>` followed, when relays is non-empty, by `.` and the relays' formatRelayHost(url) joined by `~`. With no relays there is no trailing dot. formatInvite stays async for its callers even if nothing awaits."
      - "parseInvite(text): fragment = first match of /labshelf:\\/\\/join#(\\S+)/ with trailing [.,;:!?)\\]}>\"']+ stripped (as today). Version = text before the first `.` (or the whole fragment): not /^v\\d+$/ → notAnInvite; not v1 → unsupportedVersion. Then key = text up to the next `.` or the end: decodeKeyBytes(_, SHARE_KEY_BYTES) undefined → badKey. The rest after that `.` (absent → relays []) split on `~`; any entry that parseRelayHost rejects, or an empty entry, → badRelayList. shareId = await deriveShareId(shareKey). Returns {ok: true, invite: {shareId, shareKey, relays: [{url}]}}; never throws."
      - "Remove encodeRelayList, decodeRelayList, toRelay and the relayToken field. Keep isHttpsUrl exported unchanged (relayList.ts and browser keys.ts use it). Keep InviteWithoutRelayError and assertInviteHasRelay."
      - "Callers outside these files (shareFlows, deckShare, shareImport, shareDialogs, projectShareFlows, browser keys, website) are packages 1.2 and 1.3; leave them failing typecheck if they must, but do not edit them."
    acceptance:
      - {id: 1.1a, check: "formatRelayHost('https://ls-abcdefghijkl.someone.workers.dev') is 'abcdefghijkl.someone' and parseRelayHost of that returns the URL back"}
      - {id: 1.1b, check: "a whole host round-trips: https://relay.example, https://relay.someone.workers.dev, https://labshelf-relay.owner.workers.dev, https://host.example:8443"}
      - {id: 1.1c, check: "formatRelayHost throws for http:, a path, a query, and an ambiguous whole host like https://abcdefghijkl.com; parseRelayHost returns undefined for '', 'a/b', 'Upper.Case', 'x~y'"}
      - {id: 1.1d, check: "formatShareLink of an ls- Worker is https://labshelf.org/s/#abcdefghijkl.someone.<22 chars> and parseShareLink returns the same relayUrl and key; a percent-encoded fragment parses too; any origin with path /s/ parses"}
      - {id: 1.1e, check: "parseShareLink errors: not a URL, path /share/ or /other/, empty fragment, no dot → notShareLink; bad host → badHost; key of wrong length or alphabet → badKey"}
