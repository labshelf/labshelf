      - {id: 1.1h, check: "parseInvite errors: no labshelf://join# → notAnInvite; v2 → unsupportedVersion; bad key → badKey; an entry like 'a/b' or an empty entry between ~ → badRelayList; the parsed shareId equals deriveShareId(key)"}
