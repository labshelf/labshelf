  - "Neither host sets ServeSpacesOptions.author: every member writes 'Me'."
  - "Browser store not reloaded after mirror writes."
  - "update(data) remounts all message editors on every space snapshot: flicker under chat traffic."
  - "Chat file text-merged by the mirror; concurrent appends rely on item-block text merge."
  - "No typing/presence port in Spaces."
  - "discussions*.ts, discussionText.ts, discussions.css and the dom test are untracked uncommitted work."
