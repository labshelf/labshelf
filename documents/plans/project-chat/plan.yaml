      - packages/core/src/collab/mirror/projectProfile.ts
      - packages/core/__tests__/projectChat/
      - packages/core/__tests__/collab/
      - documents/contracts/collaboration.md
      - documents/contracts/qmd-items.md
  - id: "2"
