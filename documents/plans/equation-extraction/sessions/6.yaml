      - "Anthropic: POST https://api.anthropic.com/v1/messages, headers x-api-key: <key>, anthropic-version: 2023-06-01, content-type: application/json; body {model: AI_VISION_MODELS.anthropic, max_tokens, messages: [{role: 'user', content: [{type: 'image', source: {type: 'base64', media_type: 'image/png', data}}, {type: 'text', text: prompt}]}]}; the LaTeX is the joined text blocks of content."
      - "OpenAI: POST https://api.openai.com/v1/chat/completions, headers authorization: Bearer <key>, content-type: application/json; body {model: AI_VISION_MODELS.openai, messages: [{role: 'user', content: [{type: 'text', text: prompt}, {type: 'image_url', image_url: {url: 'data:image/png;base64,<data>'}}]}]}; the LaTeX is choices[0].message.content."
