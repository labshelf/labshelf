    callers:
      - {symbol: readTarGz, path: packages/core/src/templates/universeSource.ts, lines: "197-200"}
    seams:
      - {path: packages/core/src/encoding/archive.ts, signature: "export function gunzip(bytes: Uint8Array, maxBytes: number): Promise<Uint8Array>; export function readTarGz(bytes: Uint8Array, maxBytes: number): Promise<TarEntry[]>; export function readTar(bytes: Uint8Array): TarEntry[]"}
      - {path: packages/core/src/import/identifiers/arxiv.ts, signature: "export function arxivIdOfRecord(record: Pick<PaperRecord, 'doi' | 'url'>): string | undefined"}
      - {path: packages/core/src/equations/arxivSource.ts, signature: "export type EprintFiles = { kind: 'tex'; files: Map<string, string> } | { kind: 'none'; why: 'pdf' | 'empty' | 'unreadable' }; export function unpackEprint(bytes: Uint8Array): Promise<EprintFiles>; export interface EprintCache { read(arxivId: string): Promise<Uint8Array | undefined>; write(arxivId: string, bytes: Uint8Array): Promise<void> }; export function loadEprint(arxivId: string, env: { fetch: FetchLike; cache: EprintCache; logger: ILogger; headers?: Record<string, string> }, signal?: AbortSignal): Promise<EprintFiles>; export const EPRINT_CACHE_DIR = '.research/sources/arxiv'"}
      - {path: packages/core/src/equations/flatten.ts, signature: "export function findMainFile(files: Map<string, string>): string | undefined; export function flattenSource(files: Map<string, string>, main: string): string"}
    decided:
      - "Sniff order: 1f 8b gzip → unpack; then 'ustar' at offset 257 → tar; '%PDF' → none(pdf); else treat as one TeX file named main.tex. Size cap 64 MiB unpacked; links rejected as in readTarGz today."
      - "Only .tex, .sty, .cls, .bbl, .def files are kept as text; UTF-8 decode with fatal: true, fallback Latin-1."
      - "loadEprint reads the cache first; on a miss fetches https://arxiv.org/e-print/<id> following redirects, writes the raw bytes (even a PDF) and unpacks; a non-2xx response throws and writes nothing."
      - "flattenSource removes comments first (removeComments), replaces \\input{x}, \\include{x}, \\subfile{x} with the file text (x, x.tex, relative to the main file's folder), leaves a missing file's command as is, and stops a cycle at the second visit."
      - "Main file: the only file with both \\documentclass and \\begin{document}; with several, the one named like ms/main/paper first, else the largest."
      - "arxivIdOfRecord = extractArxivIdentifierFromDoi(doi) ?? extractArxivIdentifierFromUrl(url), normalised."
      - "Contract: add `sources/arxiv/<arxiv id>  cached arXiv e-prints; rebuildable` beside tmp/ staging/ templates/ in library-format#layout. Fetch and edit only that section."
    acceptance:
      - {id: 1.1a, check: "tar.gz, single gzipped TeX, plain TeX, PDF and Latin-1 e-prints unpack as specified"}
      - {id: 1.1b, check: "a second loadEprint for the same id does not fetch; a failed fetch caches nothing"}
      - {id: 1.1c, check: "flatten resolves nested inputs with and without .tex in subfolders, ignores commented inputs and stops cycles"}
      - {id: 1.1d, check: "the template and synctex tests still pass on the moved reader"}
      - {id: A1, check: "e-prints unpack, flatten and download once"}
    tests:
