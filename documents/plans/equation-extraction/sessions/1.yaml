  - id: "1.3"
    plan: equation-extraction
    sha: 62b39630f
    goal: "Given the text inside a box and the source equations, core picks the equation the box shows, or none."
    level: behaviour
    runner: {agent: implementer, model: opus}
    depends_on: ["1.2"]
    create: [packages/core/src/equations/match.ts]
    edit:
      - {path: packages/core/src/equations/index.ts, lines: "1-20", why: "exports"}
    read:
      - {path: packages/core/src/equations/enumerate.ts, lines: "1-40", why: "SourceEquation"}
      - {path: documents/plans/equation-extraction/plan.yaml, lines: "1-60", why: "D7"}
    seams:
      - {path: packages/core/src/equations/match.ts, signature: "export interface EquationMatch { equation: SourceEquation; by: 'number' | 'text'; score: number }; export function matchEquation(boxText: string, equations: SourceEquation[]): EquationMatch | undefined"}
    decided:
      - "A number token is '(' + number + ')' with optional spaces, number like 3, 3a, 2.3, A.1; the number wins only when exactly one equation has it."
      - "Normalisation: Unicode Greek letters and common math symbols map to names, TeX commands map to their names, spacing and grouping commands are dropped; compare as a multiset of tokens."
      - "Text match needs a score at or above 0.6 and a lead of at least 0.1 over the second best; else undefined."
      - "Empty or whitespace box text returns undefined."
    acceptance:
      - {id: 1.3a, check: "a box text with (4) picks the equation numbered 4 even when its symbols are garbled"}
      - {id: 1.3b, check: "an unnumbered display matches by its symbols; two near-identical equations give undefined"}
      - {id: A4, check: "number, similarity and fall-through"}
    tests:
      hidden: [documents/plans/equation-extraction/tests/1.3/match.test.ts]
      command: "node scripts/agents/run.mjs test core --spec 1.3 --plan equation-extraction -- packages/core/__tests__/equations"
    commands: ["node scripts/agents/run.mjs typecheck core"]
