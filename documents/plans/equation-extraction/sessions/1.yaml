    commands: ["node scripts/agents/run.mjs typecheck core"]
  - id: "1.2"
    plan: equation-extraction
    sha: 62b39630f
    goal: "From a flattened TeX text, core lists every display equation with env, labels, LaTeX numbers and offsets, and returns each one's LaTeX with the author's macros expanded."
    level: behaviour
    runner: {agent: implementer, model: opus}
    depends_on: ["1.1"]
    create: [packages/core/src/equations/enumerate.ts, packages/core/src/equations/numbering.ts, packages/core/src/equations/macros.ts]
    edit:
      - {path: packages/core/src/equations/index.ts, lines: "1-20", why: "exports"}
    read:
      - {path: packages/core/src/latex/findMathSpan.ts, lines: "6-45", why: "MATH_ENVIRONMENTS to copy"}
      - {path: packages/core/src/latex/source.ts, lines: "72-200", why: "scanLatexSource macros and readMacro; check nested braces before reuse"}
      - {path: documents/plans/equation-extraction/plan.yaml, lines: "1-60", why: "D5 and D6"}
    seams:
      - {path: packages/core/src/equations/enumerate.ts, signature: "export interface SourceEquation { env: string; body: string; latex: string; labels: string[]; numbers: string[]; offset: number }; export function listEquations(tex: string): SourceEquation[]"}
      - {path: packages/core/src/equations/macros.ts, signature: "export interface MacroTable { readonly size: number }; export function collectMacros(tex: string): MacroTable; export function expandMacros(latex: string, macros: MacroTable): string"}
    decided:
      - "Numbering and the returned LaTeX follow plan D5 exactly; `latex` is the expanded form (D6) with \\label, \\nonumber, \\notag and \\tag removed; `body` is the raw text between delimiters."
      - "numbers lists one entry per numbered row in row order (equation has at most one); an unnumbered display has numbers []."
      - "Macros are collected from the whole text; when a command is defined twice, the last definition is used for every equation."
      - "Expansion: depth 32, output cap 64 KiB; past either the expansion stops and the text so far plus the unexpanded rest is returned."
      - "Verbatim environments and \\verb are skipped when enumerating."
    acceptance:
      - {id: 1.2a, check: "equation, align (with \\nonumber and \\tag), gather, multline, eqnarray, alignat, \\[ \\] and $$ give the right numbers and labels"}
      - {id: 1.2b, check: "subequations give 3a 3b; numberwithin section gives 2.1; \\appendix switches to A.1"}
      - {id: 1.2c, check: "newcommand with args and a default, def with #1#2, let, DeclareMathOperator(*) and nested macros expand; a self-recursive macro stops at the cap"}
      - {id: A2, check: "enumeration and numbering"}
      - {id: A3, check: "macro expansion"}
    tests:
      hidden: [documents/plans/equation-extraction/tests/1.2/enumerate.test.ts, documents/plans/equation-extraction/tests/1.2/macros.test.ts]
