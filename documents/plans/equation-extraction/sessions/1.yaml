owns: [documents/contracts/library-format.md, packages/core/src/encoding/, packages/core/src/templates/universeSource.ts, packages/core/src/writing/synctexFile.ts, packages/core/src/import/identifiers/arxiv.ts, packages/core/src/equations/, packages/core/__tests__/equations/, packages/core/__tests__/encoding/, packages/core/__tests__/templates/sources/]
status: pending
