    sha: 62b39630f
    goal: "The arXiv id comes from a paper record, the e-print is fetched once and cached under .research/sources/arxiv/<id>, and its bytes unpack into a flattened main TeX text, through one shared gzip/tar reader."
    level: contract
    runner: {agent: implementer, model: sonnet}
