      - path: packages/core/src/equations/node/pix2texRunner.ts
        signature: "export function createPix2texSource(runner: Pix2texRunner): EquationSource"
    decided:
      - Find pix2tex_worker.py through __dirname the same way installPix2tex.ts finds pix2tex-requirements/ (and bundledCellDrivers its scripts).
      - "plan red: the worker-script-path test reads PIX2TEX_WORKER_SCRIPT, a const no stub provides, so it fails on a real assertion before implementation; accepted."
      - "Also in packages/core/src/equations/node/pix2texRunner.ts (not a stub seam): export const PIX2TEX_WORKER_SCRIPT: string"
      - Order and timings as plan D8. A system Python counts only if `python -c 'import pix2tex'` exits 0 (checked once, cached).
      - "Worker protocol: one JSON line per request {id, png: base64} → {id, latex} or {id, error}; stderr goes to the logger; a worker crash fails the pending request and the next read starts a new worker."
      - Requests are serialised; cancel kills the worker.
      - "find(): a non-empty settingPython() wins (origin 'setting', no weightsDir); else managed.status() 'installed' gives managed.pythonPath() with weightsDir managed.weightsDir(); else locatePython() whose canImport(python) is true (origin 'system'). canImport is called at most once per python path. read() with nothing found rejects with an Error whose message contains 'pix2tex'."
      - "Spawn: spawn(python, [PIX2TEX_WORKER_SCRIPT], env) where env has LABSHELF_PIX2TEX_WEIGHTS set when weightsDir is known; PIX2TEX_WORKER_SCRIPT is the absolute path of pix2tex_worker.py next to the built module. Each request writes one line `JSON.stringify({id, png: base64})` + newline to stdin; the matching stdout line `{id, latex}` resolves read, `{id, error}` rejects with that error. Defaults idleMs 300000, timeoutMs 60000. Timeout or abort rejects read and kills the worker; the worker's exit with a request pending rejects it; the next read spawns a new worker; idleMs after the last reply the worker is killed; dispose() kills it."
      - "createPix2texSource: id 'pix2tex'; available() is find() !== undefined; read(request, onProgress, signal) returns {latex} from runner.read(request.png, signal), or undefined for an empty reply."
    acceptance:
