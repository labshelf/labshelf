      - "Research first, in this package: the pix2tex version, the last torch CPU wheels per platform (darwin-arm64, darwin-x64, win-x64, linux-x64, linux-arm64; Intel macOS may need an older torch), the weight file URLs with SHA-256, and the total download size; write hash-pinned requirements files with `uv pip compile --generate-hashes` or pip-tools and record the sizes in pix2texPin.ts. A platform with no torch wheel reports 'none' (no install offer)."
      - "Install: ensure managed Python, `python -m venv` in staging, `pip install --require-hashes --no-deps -r <platform file>` with the torch CPU index, download weights with downloadVerified, then rename staging into place; all under withToolLock; status 'installed' only when a marker with the pin version exists."
