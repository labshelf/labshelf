    decided:
      - "Order and timings as plan D8. A system Python counts only if `python -c 'import pix2tex'` exits 0 (checked once, cached)."
      - "Worker protocol: one JSON line per request {id, png: base64} → {id, latex} or {id, error}; stderr goes to the logger; a worker crash fails the pending request and the next read starts a new worker."
      - "Requests are serialised; cancel kills the worker."
    acceptance:
