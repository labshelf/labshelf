      - "Layout: `root` is `<shared tools>/pix2tex`; the lock is withToolLock(root, ...) so `<root>/.lock` exists while steps run; staging goes through the managed Python's withStagingDir pattern (`<root>/.staging-*`); the finished install is `<root>/venv/` (python at venv/bin/python3, or venv/Scripts/python.exe on win32), `<root>/weights/<file>` per pin weight, and the marker `<root>/pix2tex-pin.json` holding `{version}`, written last. status(): 'unsupported' when pix2texPlatform is undefined or its pin entry is null; 'installed' only when the marker's version equals PIX2TEX_PIN.version; else 'missing'."
      - "install order: python.status() and python.install() when missing; run(base python, ['-m', 'venv', <staging venv>]); run(<staging venv python>, ['-m', 'pip', 'install', '--require-hashes', '--no-deps', '-r', <requirements file>, ...index args]); download(url, sha256) per weight, written under the staging weights; then rename into place and write the marker. A non-zero exit or a thrown download rejects install, leaves no venv, weights or marker under root and no staging folder, and a later status() is 'missing'. Requirement files live in packages/core/src/equations/node/pix2tex-requirements/<platform>.txt and are copied with the build."
