    decided:
      - "plan red: createBrowserEquationPort already exists, so its tests fail on real assertions, and the no-helper and no-reconnect tests pass before implementation; accepted."
      - "An old helper (no ocr capability) is offered as installHelper with the update wording the setup card already uses."
      - "Sources [arxiv, pix2tex]. The pix2tex source (id 'pix2tex') is available when helper() is given and, after connect() if status() is undefined (a rejected connect counts as no helper), helperCanOcr(status) holds; read calls helper().ocr(request.png, signal): ok → {latex}; reason 'missing' → undefined and remembers pix2tex is missing; any other failure throws its message."
