    decided:
      - "Shipping: core has no build step and the pix2tex provider and runner find packages/core/src/equations/node/pix2tex-requirements/ and pix2tex_worker.py through __dirname; the helper binary's bundle must copy both beside the compiled module (check the built output contains them)."
      - "plan red: this package extends existing helper modules, so most tests fail on real assertions and the parser direction tests already pass before implementation; accepted."
      - "Also in packages/core/src/helper/helperMessages.ts (not a stub seam): ToHelperMessage gains `Envelope<'ocr'> & { bytes: number }` (the PNG is the frame payload), `Envelope<'cancelOcr'> & { requestId: string }`, `Envelope<'installPix2tex'>`; ToPageMessage gains `Envelope<'ocrResult'> & { latex: string }` and `Envelope<'ocrFailed'> & { reason: HelperOcrFailure; message: string }`"
      - "Also in packages/core/src/helper/helperMessages.ts (not a stub seam): export const OCR_FAILURES = ['missing', 'limit', 'failed'] as const"
      - "Also in packages/core/src/helper/helperMessages.ts (not a stub seam): export const OCR_CAPABILITY = 'ocr'"
      - "Also in packages/core/src/helper/helperMessages.ts (not a stub seam): export const MAX_OCR_PNG_BYTES = 4 * 1024 * 1024"
      - "Also in packages/core/src/helper/helperPaths.ts (not a stub seam): ILatexHelper gains `ocr(png: Uint8Array, signal: AbortSignal): Promise<HelperOcrResult>` and `installPix2tex(onProgress: OnHelperProgress): Promise<void>`"
      - "Shapes as plan D10. The handler registers its AbortController before any await. The install reuses the 'python' progress phase. PNG over 4 MiB is refused with ocrFailed."
      - "ocr: payload over MAX_OCR_PNG_BYTES → ocrFailed 'limit' without calling the runner; runner.find() undefined → ocrFailed 'missing'; runner.read resolves → ocrResult {latex}; read rejects → ocrFailed 'failed' with the error text; aborted by cancelOcr → ocrFailed 'failed' with message 'Cancelled.' (as cancelPrint). Exactly one reply per ocr id. cancelOcr sends no reply and is unqueued; an unknown requestId is ignored."
      - "installPix2tex: each provider progress sends `progress {phase: 'python', message: 'Installing pix2tex', fraction?}` under the request id; success sends `ready` with protocol, readyFields() and capabilities [...HELPER_CAPABILITIES]; failure logs and sends `error {code: 'pix2tex-install-failed', message}`. HELPER_CAPABILITIES gains OCR_CAPABILITY."
      - "Client: ocr on a status without OCR_CAPABILITY resolves `{ok: false, reason: 'unsupported', message: 'Update LabShelf Helper to read equations.'}` without sending; aborting the signal posts cancelOcr and resolves 'cancelled' at once (as printPdf). installPix2tex follows installPython."
      - "The helper host builds the runner with createPix2texRunner (no setting Python, the managed provider over the helper's shared tools dir and managed Python, locateTool for the system Python) and registers the three handlers."
    acceptance:
