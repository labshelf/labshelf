  - id: "3.3"
    plan: interactive-plots
    goal: The Mathematica driver answers a Graphics or Graphics3D last value, and a Manipulate frame that renders to one, with the PNG plus a labshelf-plot spec (2D lines and points, 3D polygon meshes, axis labels and title), PNG only when the graphic holds anything else, and never TeXForm for graphics.
    level: behaviour
    runner:
      agent: implementer
      model: opus
    sha: 03731db3
    depends_on:
      - "3.1"
    create: []
    edit:
      - path: packages/core/src/qmd/compute/node/cellDriver.wl
        lines: 1-107
        why: header comment; spec builder beside pngBytes; toFrame adds plot; evaluate answers graphics with text+plot instead of latex
    read:
      - path: packages/core/src/qmd/plot/plotSpec.ts
        lines: 1-25
        why: the labshelf-plot v1 shape and caps (PLOT_MESH_TRIANGLES 20000)
      - path: packages/core/__tests__/qmd/compute/node/cellDriver.wl.test.ts
        lines: 1-80
        why: how the real-kernel tests build the runner and skip without wolframscript
      - path: packages/core/src/qmd/compute/node/cellDriverProtocol.ts
        lines: 9-69
        why: "DriverResponse.plot (from 3.1): a string"
      - path: documents/plans/interactive-plots/research/renderer-spike.md
        lines: 1-40
        why: measured spec sizes and per-frame times for Plot and Plot3D
    decided:
      - 'Response shape: a graphic answers <|"text" -> "data:image/png;base64," <> BaseEncode[pngBytes[g]], "plot" -> json|>; "plot" is omitted when no spec can be built. json is the spec exported with ExportString[spec, "RawJSON", "Compact" -> True] and decoded with FromCharacterCode[ToCharacterCode[...], "UTF-8"] (as emit does), so the outer emit encodes it once as a JSON string.'
      - "What is a graphic: a result with head Graphics or Graphics3D, or Legended[g_Graphics | g_Graphics3D, ___] (PNG of the whole Legended, spec from g). In evaluate this branch comes before the TeXForm fallback; a Manipulate frame (toFrame) whose evaluated body is a graphic adds \"plot\" beside its \"text\" and \"controls\". Any other value keeps today's handling."
      - "2D spec (Graphics): walk Normal[g]'s primitives. Containers List, GraphicsGroup[x, ___] (Plot3D wraps its polygons in it), Annotation[x, ___], Tooltip[x, ___], Style[x, ___], StatusArea[x, ___], Mouseover[x, ___], Hyperlink[x, ___], EventHandler[x, ___] are recursed into; directives (anything with head RGBColor, Hue, GrayLevel, CMYKColor, Opacity, Thickness, AbsoluteThickness, PointSize, AbsolutePointSize, Dashing, AbsoluteDashing, Directive, EdgeForm, FaceForm, Arrowheads, CapForm, JoinForm) are skipped. Line[pts] gives one line trace; Line[{seg1, seg2, …}] gives one line trace with the segments joined by a Null point (JSON null in x and y). Point[p] or Point[{p…}] gives one points trace. Any other primitive (Polygon, Text, Disk, Circle, Rectangle, Arrow, Raster, Inset, BezierCurve, …) means no spec. A graphic with no traces gives no spec."
      - "3D spec (Graphics3D): each GraphicsComplex[vertices, prims] whose prims hold Polygon primitives gives one mesh trace: vertices = the GraphicsComplex vertex list (3D points only), faces = every Polygon's index lists, 1-based to 0-based, a polygon with n > 3 indices split as a fan (0,i,i+1). Polygon[{{i,j,k}, …}], Polygon[{i,j,k}] and Polygon[{i,j,k}, VertexNormals -> …] forms are read; VertexColors/VertexNormals options ignored. Line primitives inside a GraphicsComplex that has polygons (Plot3D's mesh lines) are dropped. A Graphics3D with no polygons: Line and Point with explicit 3D coordinates (after Normal) give line/points traces with z. Directives and the containers above are skipped as in 2D; any other primitive means no spec. When the total face count exceeds 20000 there is no spec."
      - "Numbers: each coordinate is N'd and rounded to 4 significant digits by the driver (a zero stays 0); a coordinate that is not a finite real makes it Null in a line trace and drops the point from a points trace; a mesh vertex that is not finite means no spec."
      - "Labels: PlotLabel -> title; AxesLabel -> axes.x/y(/z).label, read from Options[g, …] (a single label is the y label in 2D and the z label in 3D, as Mathematica draws it (Plot stores a lone AxesLabel as {None, label})). A string label is used as is; Style[s, ___] and HoldForm[s] unwrap; None, Automatic or {} give no label; any other expression is ToString[expr, InputForm]. No log scales or ranges are emitted (out of scope; Plotly autoranges)."
      - 'Spec: <|"v" -> 1, "dim" -> 2 or 3, optional "title", "axes" -> <|"x" -> <|label?|>, "y" -> <|…|>, (3D) "z" -> <|…|>|>, "traces" -> {…}|>; traces carry only type and data (no name, no colour, so the theme palette applies).'
      - "Building the spec never fails the cell: it runs under Quiet and Check, outside the message capture of the cell, and any failure, message or unexpected shape gives no spec (the PNG still answers). Nothing it does writes to stdout."
      - "Header comment (lines 1-5) mentions that a Graphics or Graphics3D last value or Manipulate frame answers {text: PNG data URL, plot?: spec JSON}."
