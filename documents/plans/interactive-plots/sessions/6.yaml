    level: behaviour
    runner:
      agent: implementer
      model: opus
    sha: 145c59e2
    depends_on:
      - "3.3"
    create: []
    edit:
      - path: packages/core/src/qmd/compute/node/cellDriver.wl
        lines: 165-250
        why: main reads request preview; evaluate and toFrame skip pngBytes when preview is on and specJson gives a spec
    read:
      - path: packages/core/src/qmd/compute/node/cellDriver.py
        lines: 182-230
        why: the Python driver's preview gate (figure_result), the behaviour to mirror
      - path: packages/core/src/qmd/compute/node/cellSession.ts
        lines: 170-190
        why: "the request line carries preview: true only for a preview request"
      - path: packages/core/__tests__/qmd/compute/node/cellDriver.wl.test.ts
        lines: 1-80
        why: how the real-kernel tests build the runner and skip without a usable wolframscript
      - path: documents/plans/interactive-plots/tests/5.1/packages/core/__tests__/qmd/compute/node.test.ts
        lines: 140-230
        why: the Python and R preview tests; the Mathematica ones follow the same shape
    decided:
      - main reads preview = (Lookup[request, "preview", False] === True) and passes it to evaluate; any other value is no preview.
      - 'Preview with a spec: a graphic last value (graphicOf[result] =!= None) answers <|"plot" -> json|> with no "text" key; a Manipulate frame answers <|"controls" -> …, "plot" -> json|> with no "text" key. The PNG is not rendered at all in this case (pngBytes is not called): that is the point of D9.'
      - "Preview without a spec (specJson gives None, e.g. Graphics[{Disk[]}]) answers exactly as without preview: the PNG data URL in text and no plot. A frame that is not a graphic, an error, a string, Null or a latex value answers as without preview."
      - Without preview (key absent or false) every response is unchanged from 3.3.
      - The spec is still built outside the cell's message capture, as in 3.3, so a spec failure never fails the cell. A PNG that is still rendered (no preview, or no spec) keeps today's place and message handling.
      - Header comment mentions that a preview with a spec leaves out the PNG.
