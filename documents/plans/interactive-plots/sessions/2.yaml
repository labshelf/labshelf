      - packages/core/src/qmd/plot/plotSpec.ts
      - packages/vscode/src/ui/htmlShell.ts
      - packages/vscode/src/spaces/view.ts
      - packages/core/src/qmd/dom/outputView.ts
  - id: "2.2"
    plan: interactive-plots
    goal: "A stored output holding a labshelf-plot spec shows as an interactive figure (the PNG shown until it is drawn and kept when it cannot be), updates in place when its content changes to another spec, opens interactive in the expand overlay, and lets zoom, pan and rotate work inside the editor."
    level: behaviour
    runner: {agent: implementer, model: sonnet}
    sha: e3d4a141
    depends_on: ["2.1"]
    edit:
      - {path: packages/core/src/qmd/dom/outputView.ts, lines: "1-267", why: "imports; openPlot overlay; OutputView fields, constructor and render (plot branch before readOutputImage); stopEvent, destroy, createOutputView(loadMath?, loadPlotly?)"}
      - {path: packages/core/src/qmd/dom/qmd-editor.css, lines: "168-192", why: "output and plot preview styles: add .qmd-output-plot, .is-3d, .is-loading, the expanded plot height, .qmd-plot-error and the --qmd-plot-palette custom property"}
    read:
      - {path: packages/core/src/qmd/dom/plotView.ts, lines: "1-250", why: "renderPlot, PlotHandle (drawn, update, destroy), PlotlyLoader, loadCorePlotly, DEFAULT_PLOT_PALETTE (written by 2.1)"}
      - {path: packages/core/src/qmd/item/cellOutput.ts, lines: "95-142", why: "readOutputPlot(content) -> {image: OutputImage | null, spec} | null; readOutputImage"}
      - {path: packages/core/src/ui/dom/widgets/dialog.ts, lines: "12-40", why: "mountOverlay(content, onDismiss) -> {close}; onDismiss runs on Escape or scrim click"}
      - {path: packages/core/__tests__/qmd/dom/codeCellView.test.ts, lines: "1-90", why: "how output views are mounted in tests (mount helper, outputDoc, createOutputView with a fake math loader)"}
      - {path: packages/core/src/qmd/dom/qmdEditor.ts, lines: "118-126", why: "createOutputView() caller: keeps the defaults"}
    callers:
      - {symbol: createOutputView, path: packages/core/src/qmd/dom/qmdEditor.ts, lines: "123-123"}
    decided:
      - "createOutputView(loadMath?, loadPlotly?: PlotlyLoader): the second loader defaults to loadCorePlotly; the qmdEditor.ts caller is unchanged."
      - "render(), stored content only (no preview shown): readOutputPlot(content) is tried before readOutputImage. A plot gets dom classes qmd-output-figure and qmd-output-interactive (removed again for any other content). The body holds, in order: the PNG as today's `img.qmd-output-image` when plot.image is set, then the plot root `div.qmd-output-plot.is-loading` (plus `is-3d` when spec.dim is 3), then the `.qmd-output-expand` button. renderPlot(root, spec, loadPlotly) draws it. When drawn resolves the img is removed and is-loading is dropped. When drawn rejects the root is removed and the img stays; without an img the body shows `div.qmd-plot-error` with the text `The plot could not be drawn.`"
      - "In place: when the shown content changes from one plot to another and this view has a live handle, it calls handle.update(newSpec) on the same root (no replaceChildren, no new renderPlot), toggles is-3d, and keeps the expand button; an img still waiting is removed once that update resolves."
      - "Leaving a plot (the content becomes text, math, an image, or a preview is shown) destroys the handle before the body is replaced. Previews are unchanged in this package: CellResult has no plot field yet (session 3 adds it, session 5 routes it to handle.update)."
      - "Expand on a plot: opens the existing overlay panel `section.qmd-plot-preview` (header label = spec.title ?? image alt ?? `Plot`, the close button as today) holding `div.qmd-output-plot.qmd-plot-expanded` (plus is-3d) instead of the img, drawn by its own renderPlot with the current spec. Closing it, by the close button or by mountOverlay's dismiss, destroys that handle. An image-only output keeps today's img overlay."
      - "Interaction: stopEvent returns true for any event other than dragstart whose target is inside `.qmd-output-plot`, as well as the existing action and expand buttons. The plot root has a dragstart listener that calls preventDefault, so dragging inside the figure zooms, pans or rotates instead of moving the output; a drag started elsewhere on the output still moves it."
      - "destroy() destroys the plot handle and closes the overlay, which destroys the expanded handle."
      - "CSS (qmd-editor.css, no inline style anywhere): `:root { --qmd-plot-palette: <DEFAULT_PLOT_PALETTE joined with \", \"> }`; `.qmd-output-plot { position: relative; width: 100%; height: 360px; }`; `.qmd-output-plot.is-3d { height: 440px; }`; `.qmd-output-plot.is-loading { position: absolute; top: 0; left: 0; visibility: hidden; }` (it keeps its size so Plotly lays out while the PNG shows); `.qmd-plot-preview > .qmd-output-plot { height: min(80vh, 720px); }`; `.qmd-plot-error` drawn like .qmd-output-caption text. No filter applies to .qmd-output-plot (the dark-theme inversion stays on the PNG only)."
    acceptance:
      - {id: 2.2a, check: "an output with PNG plus spec draws the spec into .qmd-output-plot with the injected Plotly, shows the PNG until drawn and removes it after; the output has qmd-output-interactive"}
      - {id: 2.2b, check: "when the loader fails, the PNG stays and the plot root is gone; a spec without PNG then shows .qmd-plot-error"}
      - {id: 2.2c, check: "updating the node to another plot content keeps the same .qmd-output-plot element and calls react again without purge; updating it to text purges the plot and shows the text"}
      - {id: 2.2d, check: "expand on a plot opens .qmd-plot-preview with its own .qmd-output-plot drawn by react; closing it purges that root"}
      - {id: 2.2e, check: "stopEvent is true for a mousedown inside the plot and false for a dragstart; a dragstart inside the plot is default-prevented"}
      - {id: 2.2f, check: "destroying the view purges the plot; an image-only output and a text output render as before"}
