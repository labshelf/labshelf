      - "node scripts/agents/run.mjs build browser"
      - "Build check (A5 split): plotly's code, the string 'Cannot addRelatedStyleRule', must appear only in split chunk files, never in an entry bundle. grep -rl 'Cannot addRelatedStyleRule' over packages/vscode/dist and the browser build output; every match must be a chunk file (chunks/), none an entry."
      - "Testing policy: never run pnpm gate or any lint; check only with the commands above and tests.command."
    do_not_touch:
