packages:
  - id: "3.1"
    plan: interactive-plots
    goal: A cell result carries an optional plot spec from the driver response to CellResult, and storing a result with a valid spec writes the PNG line followed by the labshelf-plot fence.
    level: contract
    runner:
      agent: implementer
      model: sonnet
    sha: 03731db3
    depends_on: []
    create:
      - packages/core/src/qmd/compute/plotContent.ts
    edit:
      - path: packages/core/src/qmd/compute/node/cellDriverProtocol.ts
        lines: 9-69
        why: "DriverResponse (line 9) gains plot?: string; toResult copies it onto an ok result"
      - path: packages/core/src/qmd/compute/cellRunner.ts
        lines: 10-11
        why: "CellResult gains plot?: string with its doc comment"
      - path: packages/core/src/qmd/compute/writeCellOutput.ts
        lines: 56-65
        why: "formatContent: plot branch through formatPlotContent"
    read:
      - path: packages/core/src/qmd/item/cellOutput.ts
        lines: 90-145
        why: pngOutput, OutputImage, formatPlotContent(image|null, spec), readOutputPlot, PLOT_FENCE
      - path: packages/core/src/qmd/plot/plotSpec.ts
        lines: 195-237
        why: parsePlotSpec(json) -> PlotSpec | null (normalises; null on malformed or over the triangle cap); formatPlotSpec drops over 256 KB
      - path: packages/core/__tests__/qmd/compute/writeCellOutput.test.ts
        lines: 1-60
        why: how writeCellOutput is tested
      - path: packages/core/__tests__/qmd/compute/node/cellDriverProtocol.test.ts
        lines: 1-60
        why: how toResult is tested
      - path: documents/contracts/qmd-items.md
        lines: 88-105
        why: the stored plot output grammar (already documented; no contract change in this package)
    seams:
      - path: packages/core/src/qmd/compute/cellRunner.ts
        signature: "export interface CellResult { status: CellStatus; language: CellLanguage; latex?: string; text?: string; error?: string; durationMs: number; restarted?: boolean; controls?: CellControl[]; plot?: string }"
      - path: packages/core/src/qmd/compute/node/cellDriverProtocol.ts
        signature: "export interface DriverResponse { id: number; latex?: string; text?: string; error?: string; controls?: CellControl[]; plot?: string }"
      - path: packages/core/src/qmd/compute/plotContent.ts
        signature: 'export function plotContent(result: import("./cellRunner.js").CellResult): string | null'
    decided:
      - "CellResult.plot is the labshelf-plot spec JSON as the driver sent it (a string, not parsed); doc comment: `plot` is the cell's labshelf-plot spec JSON, beside the PNG in `text`."
      - "toResult: on a response without error, a string `plot` is copied onto the ok result; a non-string plot is ignored; an error response never carries plot; an ended outcome never carries plot."
      - 'writeCellOutput formatContent, for a non-error result with result.latex undefined: when result.plot is a string and parsePlotSpec(result.plot) returns a spec, the content is formatPlotContent(image, spec) where image = pngOutput(result.text) ? {alt: "Python plot", src: <that data URL>} : null. formatPlotContent itself drops a spec over the size cap and keeps the PNG line.'
      - "When plot is missing or parsePlotSpec returns null, formatContent behaves exactly as today (PNG line, fenced text, or empty). A spec with no PNG and text that is not a PNG: the content is formatPlotContent(null, spec) (the fence alone); the text is not written."
      - The image alt stays `Python plot` for every language (today's bytes).
      - Error and timeout results ignore plot.
      - "plotContent(result) (new file plotContent.ts, header comment + CONTRACT qmd-items#outputs) holds the plot branch: it returns formatPlotContent(image, spec) for a non-error result whose plot parses, else null; writeCellOutput's formatContent calls it first (after the error and latex branches) and falls back to today's code on null."
    acceptance:
      - id: 3.1a
        check: toResult copies a string plot from a response onto the ok result next to text and controls; drops it for an error response and for an ended outcome; ignores a non-string plot
      - id: 3.1b
        check: writeCellOutput with text = a PNG data URL and a valid plot writes the PNG line, a blank line, the ```{=labshelf-plot} fence with the normalised spec JSON on one line, and the closing fence; readOutputPlot of the written content returns that spec and image (A1)
      - id: 3.1c
        check: writeCellOutput with an invalid plot JSON, or a spec over the triangle cap, writes only the PNG line as today; with a spec whose JSON exceeds 256 KB the PNG line is kept and no fence written
      - id: 3.1d
        check: writeCellOutput with a valid plot and no PNG writes the fence alone; an error result with a plot writes the error block only; CRLF bodies get CRLF inside the written block
    tests:
      hidden:
        - documents/plans/interactive-plots/tests/3.1/packages/core/__tests__/qmd/compute/plotContent.test.ts
      command: node scripts/agents/run.mjs test core --spec 3.1 --plan interactive-plots -- packages/core/__tests__/qmd/compute/plotContent.test.ts
    commands:
      - node scripts/agents/run.mjs typecheck core
      - node scripts/agents/run.mjs test core -- packages/core/__tests__/qmd/compute/writeCellOutput.test.ts packages/core/__tests__/qmd/compute/node/cellDriverProtocol.test.ts
      - "Testing policy: never run pnpm gate or any lint; check only with the commands above and tests.command."
    do_not_touch:
      - packages/core/src/qmd/item/
      - packages/core/src/qmd/plot/
      - packages/core/src/qmd/dom/
      - packages/core/src/helper/
          - packages/core/src/qmd/compute/node/cellDriver.py
      - packages/core/src/qmd/compute/node/cellDriver.R
  - id: "3.2"
    plan: interactive-plots
    goal: "Helper protocol 10: cellResult carries plot and runCell carries preview, end to end through the message types, the parser, the helper host, the page client, the browser's cell runner and the helper contract."
    level: contract
    runner:
      agent: implementer
      model: sonnet
    sha: 03731db3
    depends_on:
      - "3.1"
    create: []
    edit:
      - path: packages/core/src/helper/helperMessages.ts
        lines: 11-91
        why: "PROTOCOL_VERSION (11) 9 -> 10; runCell gains preview?: boolean; cellResult gains plot?: string"
      - path: packages/core/src/helper/parseHelperMessage.ts
        lines: 263-354
        why: runCell reads optional boolean preview; cellResult reads optional string plot
      - path: packages/core/src/helper/helperPaths.ts
        lines: 125-127
        why: "HelperCellRequest gains preview?: boolean"
      - path: packages/core/src/helper/helperClient.ts
        lines: 100-105
        why: cellResultOf copies plot
      - path: packages/core/src/helper/node/runHelperHost.ts
        lines: 49-55
        why: pass preview to runner.run; send plot in cellResult
      - path: packages/browser/src/helper/cellPorts.ts
        lines: 27-33
        why: createHelperCellRunner forwards request.preview
      - path: documents/contracts/helper.md
        lines: 31-41
        why: runCell and cellResult field lists; protocol version 10
    read:
      - path: packages/core/__tests__/helper/helperCells.test.ts
        lines: 1-80
        why: test setup for createCellHandlers and parseHelperMessage round trips
      - path: packages/browser/__tests__/helper/cellPorts.test.ts
        lines: 1-60
        why: browser test of createHelperCellRunner; add a case that preview is forwarded
      - path: packages/core/src/qmd/compute/cellRunner.ts
        lines: 10-14
        why: CellResult.plot (from 3.1) and CellRequest.preview
    callers:
      - symbol: createHelperCellRunner
        path: packages/browser/src/helper/cellPorts.ts
        lines: 27-33
      - symbol: createCellHandlers
        path: packages/core/src/helper/node/runHelperHost.ts
        lines: 32-75
    seams:
      - path: packages/core/src/helper/helperPaths.ts
        signature: "export interface HelperCellRequest { code: string; cwd: string; timeoutMs: number; language: CellLanguage; noteKey: string; params?: Record<string, CellParamValue>; preview?: boolean }"
    decided:
      - "runCell `preview?: boolean`: parsed with readOptionalField(body, \"preview\", readBoolean); a non-boolean preview is refused like any malformed field. The helper host passes `preview: true` into runner.run's request only when the message has preview true (omitted otherwise); timeouts stay the page's `timeoutMs`."
      - 'cellResult `plot?: string`: parsed with readOptionalField(body, "plot", readString); the host sends it only when result.plot is defined; cellResultOf copies it onto the CellResult only when defined.'
      - "The browser's createHelperCellRunner adds `preview: true` to the helper request when request.preview is true, else omits it; the page's preview timeout (20 s) is unchanged."
      - "PROTOCOL_VERSION becomes 10. The helper contract: runCell lists `preview?` (a preview run whose result the page shows but never stores; drivers may skip work for it), cellResult lists `plot?` (the labshelf-plot spec JSON, see qmd-items.md#outputs), and `The protocol version is 10.`. Existing tests that pin the literal version number are updated to PROTOCOL_VERSION or 10."
      - "No size limit is added for plot: the socket's existing frame cap applies."
    acceptance:
      - id: 3.2a
        check: PROTOCOL_VERSION is 10; parseHelperMessage accepts runCell with preview true or false and cellResult with a string plot, and refuses a non-boolean preview and a non-string plot
      - id: 3.2b
        check: "createCellHandlers' runCell passes preview: true to the runner request when the message has it and omits preview otherwise; a runner result with plot answers cellResult carrying the same plot, and one without plot answers without the key"
      - id: 3.2c
        check: the native helper client's runCell resolves to a CellResult carrying plot from a cellResult, and sends preview in its runCell when the request has it
    tests:
      hidden:
        - documents/plans/interactive-plots/tests/3.2/packages/core/__tests__/helper/node/index.test.ts
      command: node scripts/agents/run.mjs test core --spec 3.2 --plan interactive-plots -- packages/core/__tests__/helper/node/index.test.ts
    commands:
      - node scripts/agents/run.mjs typecheck core
      - node scripts/agents/run.mjs typecheck browser
      - node scripts/agents/run.mjs test core -- packages/core/__tests__/helper
      - "node scripts/agents/run.mjs test browser -- packages/browser/__tests__/helper/cellPorts.test.ts (add visible cases: createHelperCellRunner forwards preview: true to helper.runCell and omits it for a normal run)"
      - "Testing policy: never run pnpm gate or any lint; check only with the commands above and tests.command."
    do_not_touch:
      - packages/core/src/qmd/
      - packages/vscode/
      - packages/terminal/
