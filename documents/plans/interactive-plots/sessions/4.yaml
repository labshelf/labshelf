        lines: 1-80
        why: how the real driver is spawned and spoken to in tests
    callers: []
    seams: []
    decided:
      - 'Response: when figure_result makes a PNG and the figure is extractable, the payload is {"text": <png data URL>, "plot": <spec JSON string, json.dumps(spec, separators=(",", ":"), allow_nan=False)>}; otherwise {"text": <png>} as today. The PNG is always made (preview skipping is session 5). Extraction never raises: any exception inside it means no spec.'
      - Extract before savefig and before the PNG facecolor/legend changes; read the figure state only, never change it.
      - "A figure is extractable only when it has exactly one Axes and nothing else visible: figure.texts empty (a suptitle is allowed and is the title when the axes title is empty), no figure-level images, no colorbar (a second Axes already excludes it). In the Axes, every visible child is one of: Line2D (2D) / Line3D (3D) in axes.lines; a scatter PathCollection (2D) / Path3DCollection (3D) in axes.collections; a Poly3DCollection from plot_surface or plot_trisurf (3D only). Any other visible collection (PolyCollection from fill_between or bar3d, LineCollection from errorbar or vlines, QuadMesh, contour sets), any visible patch in axes.patches (bars, histograms), any image, any text in axes.texts, any table means no spec. Legends, ticks, grid and spines are ignored. Invisible artists are ignored."
      - dim is 3 when the axes has a `get_zlim` (mplot3d Axes3D), else 2.
      - "Line2D -> {type: \"line\", x, y} (3D: x, y, z from get_data_3d()); a line with linestyle none or \"\" and a marker -> type \"points\". Scatter -> {type: \"points\"} from get_offsets() (3D: the collection's _offsets3d). name = the artist label unless it starts with \"_\". color = the artist's colour as #rrggbb (matplotlib.colors.to_hex); for a scatter or a mesh whose face colours are not all equal, no color key (the theme palette)."
      - "Surfaces (plot_surface, plot_trisurf) -> one {type: \"mesh\", vertices, faces} per collection: the 3D polygons of the collection (read from the collection's stored 3D vertices; quads split into two triangles (0,1,2),(0,2,3); polygons with more than 4 corners fan-triangulated), vertices deduplicated by exact coordinates, faces as index triples. If the stored 3D vertices cannot be read on the installed matplotlib, no spec. More than 20 000 triangles in total means no spec."
      - 'Numbers: every coordinate rounded to 4 significant digits in Python (float(f"{v:.4g}")); NaN and infinities become null in line/points arrays; a mesh vertex that is not finite drops the polygon. A line or points trace over 2000 points is passed whole (core decimates).'
      - 'Axes: x, y (and z for 3D) each {label?: get_xlabel() if non-empty, log?: true when get_xscale() == "log", range?: [lo, hi] = get_xlim() only when autoscaling of that axis is off}. title = axes.get_title() if non-empty, else the suptitle text if any. v = 1.'
      - 'Missing module: when the cell raises ModuleNotFoundError with a non-empty .name, the error is the usual last traceback line, then a newline, then `Install it with: "<sys.executable>" -m pip install <top-level module>` (top-level = name.split(".")[0]). Other errors are unchanged. Session 5 adds the copy button for a line starting `Install it with: `.'
      - No new dependency; matplotlib and numpy are only used when the cell already imported matplotlib.pyplot (today's rule). The driver header comment mentions the plot field.
      - Real-matplotlib tests find their interpreter in env LABSHELF_TEST_PYTHON, else python3 on PATH; they skip with a console.warn reason when that interpreter cannot import matplotlib. In this session LABSHELF_TEST_PYTHON points at a scratch venv with matplotlib 3.11 (see tests.command).
    acceptance:
      - id: 4.2a
        check: plt.plot of a line with a label and xlabel/ylabel/title/log y returns text = PNG data URL and plot = a dim 2 spec with one line trace, its name, its colour, the labels, title and log flag
      - id: 4.2b
        check: plt.scatter returns a points trace; plot_surface on a 3D axes returns a dim 3 spec with a mesh whose faces index its vertices and whose triangle count is 2 per grid cell; ax.plot of a 3D line returns a line with z
      - id: 4.2c
