  - id: "4.3"
    plan: interactive-plots
    goal: The R driver returns a PNG for anything a cell draws, a labshelf-plot spec beside it for a ggplot of line, path and point layers, and the install.packages command for a missing package, through a raw-JSON emitter with fast escaping (D7).
    level: behaviour
    runner:
      agent: implementer
      model: opus
    sha: bb37baf9
    depends_on: []
    create: []
    edit:
      - path: packages/core/src/qmd/compute/node/cellDriver.R
        lines: 1-194
        why: json_string (112-123) gains an ASCII fast path; emit (126-133) writes raw JSON fields; run_cell (136-161) opens a png device around the evaluation, builds the spec for a ggplot last value and the install hint
    read:
      - path: packages/core/src/qmd/plot/plotSpec.ts
        lines: 1-30
        why: the spec types and caps
      - path: packages/core/__tests__/qmd/compute/node/cellDriver.R.test.ts
        lines: 1-80
        why: how the real R driver is run in tests (findRscript, skip when missing)
      - path: packages/core/__tests__/qmd/compute/node/rDriver.test.ts
        lines: 1-60
        why: R driver through the runner and the bundle copy check
    callers: []
    seams: []
    decided:
      - "Graphics: before evaluating a cell the driver opens `png(<tempfile pattern>%03d.png, width = 6.4, height = 4.8, units = \"in\", res = 160, bg = \"transparent\")` with the display list enabled, and remembers its device number. After the evaluation (and after printing a visible last value, which draws a ggplot or lattice object into it), if that device is still open and something was drawn on it, the driver closes it and returns the newest page file as `data:image/png;base64,...` in `text`; otherwise it closes it (when still open) and returns today's text. Temp files are deleted after reading. Devices the cell opened itself are left alone. A cell that drew nothing behaves exactly as today."
      - When a PNG is returned, the visible value's printed text and warnings are not returned (the PNG is the result, as in Python); printed output still goes to stdout before the sentinel as today.
      - Base64 is implemented in base R on the raw bytes (vectorised with bitwAnd/bitwShiftL/bitwShiftR on integer vectors, no per-byte loop); no package is needed.
      - "ggplot spec: when the visible last value inherits \"ggplot\" and requireNamespace(\"ggplot2\", quietly = TRUE), build b <- ggplot2::ggplot_build(value). No spec unless: every layer's geom inherits GeomLine, GeomPath or GeomPoint; the plot has one panel (no facets: every layer's PANEL has one level); x and y scales are continuous with an identity or log10 transformation; inside each (layer, group) the colour is constant. Then one trace per (layer, group): GeomPoint -> points, GeomLine and GeomPath -> line (GeomLine sorted by x, as ggplot draws it); x and y from the built data (10^value on a log10 axis, with log: true on that axis); color = the group's colour as #rrggbb via grDevices::col2rgb (alpha dropped); no name. Axes labels and title from the plot's resolved labels (ggplot2::get_labs(value) when it exists, else value$labels): x, y, title, each only when a non-empty string. dim 2, v 1. Any error while building the spec means no spec."
      - Numbers are written with signif(x, 4) and up to 4 significant digits (format with `digits = 4`, no scientific padding issues, `-0` written as 0); NA, NaN and infinite values are null.
      - "Emitter: emit's payload values are either character (escaped through json_string) or raw JSON (a value of class \"labshelf_json\", written as is). The spec is built with a small raw-JSON writer (objects, arrays of numbers, strings) inside the driver. json_string keeps its exact output, but text with only printable ASCII and no quote or backslash, plus \\n, \\r and \\t, goes through a vectorised gsub path instead of the per-code-point loop; the loop stays only for text with other characters."
      - "Missing package: an error condition of class packageNotFoundError uses its $package; otherwise a message matching `there is no package called [‘'\"]<pkg>[’'\"]` gives <pkg>. The error becomes the usual message, a newline, then `Install it with: install.packages(\"<pkg>\")`. Other errors are unchanged. Session 5 adds the copy button for a line starting `Install it with: `."
      - "The driver stays base R: ggplot2 is only touched through requireNamespace when the last value is a ggplot. The header comment mentions graphics and the plot field."
    acceptance:
      - id: 4.3a
        check: "`plot(1:10)` returns text = a PNG data URL (decodes to a PNG signature) and no plot key; a cell that draws nothing returns its text as today"
      - id: 4.3b
        check: "with ggplot2 installed, a ggplot with geom_line, or geom_point with a colour per group, returns the PNG and a dim 2 spec: one trace per group of the right type, x/y values matching the data to 4 significant digits, #rrggbb colours, labels from labs(x, y, title); scale_y_log10 gives log: true and untransformed y values"
      - id: 4.3c
        check: a ggplot with geom_bar, or with facet_wrap, returns the PNG and no plot key
      - id: 4.3d
        check: '`library(surelyMissingPkgXyz)` returns an error whose last line is exactly `Install it with: install.packages("surelyMissingPkgXyz")`'
      - id: 4.3e
        check: text with non-ASCII, quotes, backslashes, tabs and newlines round-trips through the driver unchanged (JSON parse of the response), and a 200 000 character ASCII value is returned in under 2 s
    tests:
      hidden:
        - documents/plans/interactive-plots/tests/4.3/packages/core/__tests__/qmd/compute/node/cellDriver.R.test.ts
      command: node scripts/agents/run.mjs test core --spec 4.3 --plan interactive-plots -- packages/core/__tests__/qmd/compute/node/cellDriver.R.test.ts
    commands:
