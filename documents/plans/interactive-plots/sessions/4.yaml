    decided:
      - 'locateTool("python", {override, platform, env, exists}): an override that exists wins; else findExecutable("python3", env), then findExecutable("python", env); the first acceptable one is returned; else undefined. No install-folder search for python.'
      - "Stubs are not acceptable: on win32 a path containing `\\WindowsApps\\` (the Microsoft Store alias, case-insensitive) is skipped; on darwin `/usr/bin/python3` and `/usr/bin/python` are skipped unless `exists` is true for `/Library/Developer/CommandLineTools/usr/bin/python3` or `/Applications/Xcode.app/Contents/Developer/usr/bin/python3` (otherwise running it opens the Command Line Tools installer). A skipped name moves on to the next name."
      - "createNodeCellRunner's python launch: `await locate?.(\"python\")`; when it returns a path, launch it with [\"-u\", drivers.python]; when it returns undefined (or locate is absent), fall back to today's managed Python (installed state and pythonPath), else undefined (reported missing as today)."
      - 'VS Code: setting `labshelf.cells.pythonPath`, string, default "", markdownDescription: "Path of the Python interpreter that runs Python cells in notes. When empty, LabShelf uses the first `python3` or `python` on PATH, then its own managed Python." locateCellTool reads it at each launch (trimmed; empty means search).'
      - 'The helper (browser) has no setting: its locate passes python to locateTool("python") with no override.'
      - The managed Python provider, its install flow and its status reporting are unchanged.
