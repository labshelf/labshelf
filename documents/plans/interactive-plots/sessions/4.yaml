      - node scripts/agents/run.mjs test core -- packages/core/__tests__/qmd/compute/node/rDriver.test.ts
      - "Testing policy: never run pnpm gate or any lint; check only with the commands above and tests.command."
    do_not_touch:
      - packages/core/src/qmd/compute/node/cellDriver.py
      - packages/core/src/qmd/compute/node/cellDriver.wl
      - packages/core/src/qmd/compute/node/nodeCellRunner.ts
