risks:
  - "Plotly strict avoids eval, fine for all hosts."
  - "Plotly injects a <style> element and inline style attributes; htmlShell and spaces allow nonce styles only. Conflicts with the session-5 strict-CSP rule. Spaces has no img-src."
  - "Only the reader shell allows blob: workers/images."
  - "No bundle size check exists; dist/chunks ships entirely."
  - "Terminal does not render qmd HTML; needs nothing."
  - "CSP strings pinned by three vscode tests."
