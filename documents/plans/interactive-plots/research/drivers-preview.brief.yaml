risks:
  - "Managed Python = python-build-standalone 3.12 + sympy + mpmath only. No numpy/matplotlib; user site packages unused. Python plots need pinned wheels or a user-Python setting."
  - "R driver has no plots; multi-language D9 and cell-params D8 put graphics/interactive charts out of scope (new plan supersedes)."
  - "Latency: debounce, per-note queue, Mathematica double PNG export, helper hop, base64 per tick."
  - "Ownership: multi-language-cells session 5 owns packages/core/ and cell-params session 5 owns qmd/dom, qmd/item, qmd/compute; both blocked only on manual checks."
  - "cell-params D3: nothing cancelled; streaming must keep one-in-flight in the dom loop."
  - "R emit escapes code point by code point: slow for large payloads."
