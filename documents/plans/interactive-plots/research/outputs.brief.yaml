risks:
  - "Grammar today: content is Markdown between opener and closing :::. Latex '$$ tex $$'; text/error a fenced block; PNG one '![Python plot](data:image/png;base64,...)' line. cell and source attrs mandatory; unknown content shows as monospace text."
  - "Recommended plug-in: a ```{=labshelf-plot} JSON fence plus the PNG line inside the existing div. Older builds: plainOutput (outputView.ts:44-50) strips the first fence and shows JSON as text, and readOutputImage rejects non-single-image content, so no PNG there. An opener attribute variant would change findOutputs, NodeView attrs and formatOutput pairs."
  - "Size: JSON specs for surfaces/meshes plus the PNG data URL grow the .qmd; consider a cap with PNG-only fallback."
  - "Preview results are not Markdown: previewContent/shownKey cache by string; fluid sliders need a typed result.plot branch updating the plot in place (Plotly.react)."
  - "CSP: VS Code editor webview style-src nonce only (htmlShell.ts:18) vs reader unsafe-inline (shell.ts:60); verify Plotly strict dist under each host (reader, library page, VS Code custom editor, browser ext). img-src data: only when dataImages."
  - "Two files named qmdBlocks.ts: editor/qmdBlocks.ts (parse; readDiv) and dom/qmdBlocks.ts (caret/drag). Plot container must not swallow dragstart (OutputView.stopEvent)."
  - "PNG dark theme is CSS filter on .qmd-output-image and .qmd-plot-preview > img; canvas/SVG plot is not filtered and must theme itself. openPlot expand overlay is img-only."
  - "Not traced: packages/terminal and Quarto/export paths; no labshelf-output matches outside core/src. Pandoc ignoring unknown raw-format fences is believed but not run."
  - "Opener detected by three independent paths (cellOutput.ts parseDivOpener; notesTab.ts:316 regex; qmdBlocks.ts:140 includes(OUTPUT_CLASS)); keep any opener change compatible with all three."
