schema: brief/v1
area: cell outputs in .qmd and the shared qmd editor (interactive plots)
question: "how outputs are stored and rendered, and where a plot-spec output kind plugs in"
sha: f0c0a40b
reuse:
  - {symbol: formatOutput, path: packages/core/src/qmd/item/cellOutput.ts, lines: "64-78", why: "Writes the opener (class labshelf-output; attrs cell, source, engine, ran, [params], [status=error]) plus content, with line endings normalised to eol and a trailing eol added. Throws if isBalanced fails. A fenced JSON block inside content is safe: lineKinds treats lines inside code fences as text (itemFile.ts:215-219)."}
  - {symbol: findOutputs, path: packages/core/src/qmd/item/cellOutput.ts, lines: "35-62", why: "Finds top-level divs with class labshelf-output and non-empty cell and source. content is the raw bytes between the fences; start/end are UTF-16 offsets. Never interprets content, so a new content kind needs no change here."}
  - {symbol: pngOutput / readOutputImage, path: packages/core/src/qmd/item/cellOutput.ts, lines: "90-100", why: "pngOutput matches /^data:image\\/png;base64,[A-Za-z0-9+/]+={0,2}$/. readOutputImage accepts only a content that is exactly one image line. A content with a plot block plus the PNG fails this match, so the new parser must run before it or replace it."}
  - {symbol: loadCoreMath / MathLoader / renderMathInto, path: packages/core/src/qmd/dom/mathView.ts, lines: "11-52", why: "Lazy-load model: loadCoreMath = () => import(\"../../latex/hover/index.js\"), TRAP comment (about 2.5 MB CommonJS with import-time side effects, import lazily only). Loader is injected (createOutputView(loadMath?) outputView.ts:264-266) so tests pass a fake. Placeholder first, then await loader, then replace; failure shows .qmd-math-error. PLATFORM: webview CSP forbids markup style=, parseMathSvg strips style attrs; Plotly sets inline styles heavily."}
  - {symbol: --ls-plot-filter, path: packages/core/src/ui/dom/tokens.css, lines: "88,223", why: "Dark default invert(1) hue-rotate(180deg), light none. Overridden in tokensCss.ts:131 and vscodeHost.css:75, mapped in reader/dom/styles/notes.css:95. A client-side plot must theme itself and not inherit this filter."}
edit:
  - {path: packages/core/src/qmd/item/cellOutput.ts, lines: "90-100", why: "Add a pure parser/formatter for the plot kind next to pngOutput/readOutputImage (e.g. readOutputPlot(content) returning spec and fallback PNG); export from qmd/item/index.ts. Bytes stay verbatim because the editor keeps raw."}
  - {path: packages/core/src/qmd/compute/cellRunner.ts, lines: "11", why: "CellResult is {status, language, latex?, text?, error?, durationMs, restarted?, controls?}. Add optional plot?. Preview path at line 46 (preview?(result)). Wire shape also in qmd/compute/node/cellDriverProtocol.ts, helper/helperMessages.ts, reader/protocol/messages.ts; drivers cellDriver.py/.wl/.R in qmd/compute/node/."}
  - {path: packages/core/src/qmd/compute/writeCellOutput.ts, lines: "56-70", why: "formatContent(result): error -> fenced block, latex -> '$$ latex $$\\n', text PNG -> '![Python plot](data)\\n', other text -> fenced. Add the plot branch (fenced JSON plus PNG fallback line) and a writeCellOutput.test.ts case."}
  - {path: packages/core/src/qmd/dom/outputView.ts, lines: "24-32,107-135", why: "previewContent(result) maps a CellResult to a markdown string; OutputView.render chooses readOutputImage (img plus expand button) or renderOutputText, cached by shownKey. Add plot branch to both and to renderPreviewResult (also used by codeCellView.ts:147). Dispose in destroy(). Fluid sliders need in-place plot update, not replaceChildren."}
  - {path: packages/core/src/qmd/dom/qmd-editor.css, lines: "162-192", why: "Output styles: .qmd-output-body 172-173, .qmd-output-image 177 (filter), .is-out-of-date opacity .5 at 178, .qmd-plot-preview > img 192 (expand overlay, openPlot outputView.ts:57-65). Add plot container style. Reader overrides width in reader/dom/styles/notes.css:82."}
read:
  - {path: documents/contracts/qmd-items.md, lines: "Outputs section (doc.mjs contracts/qmd-items#outputs)", why: "Current grammar and the Cell parameters preview paragraph (previews never written). Update both for a new kind."}
  - {path: packages/core/src/qmd/editor/qmdBlocks.ts, lines: "125-148", why: "readDiv builds an output node only if the opener line contains OUTPUT_CLASS and findOutputs(raw)[0] exists. Node attrs {cell, source, engine, ran, raw, gap}; raw is the exact block bytes, serialised back unchanged, so round trip is byte-identical for any content."}
  - {path: packages/core/src/qmd/editor/qmdSchema.ts, lines: "150-160", why: "output node spec; toDOM is <pre data-output> of raw."}
  - {path: packages/core/src/qmd/dom/outputView.ts, lines: "16-22,203-236", why: "outputContent(raw) strips opener and closing :::. Stale marker (checkSource/showStale): code hash differs from source -> 'Out of date - the code changed since this ran'; params differ -> 'the parameters changed'; toggles .is-out-of-date and prepends .qmd-output-caption. Content-kind independent."}
  - {path: packages/core/src/qmd/item/itemFile.ts, lines: "182-240", why: "findTopLevelDivs, isBalanced, lineKinds. Fences respected. TRAP at 215-216 about Pandoc closing/opening ::: lines."}
  - {path: packages/vscode/build/webviews.mjs, lines: "29-42", why: "Per-host lazy chunk resolution: esbuild ESM splitting:true, so dynamic import becomes a chunk beside the entry, served under script-src nonce + cspSource (htmlShell.ts:18). reader/shell.ts:60 allows style-src unsafe-inline and img-src data:. htmlShell.ts:17-18 style-src nonce only; img-src data: only if dataImages. Browser ext: packages/browser/build/build.mjs:22,25 splitting with chunks/[name]-[hash]."}
  - {path: packages/core/package.json, lines: "33,67", why: "mathjax-full dependency; './math' export maps to src/latex/hover/index.ts. Plot renderer should get its own entry imported lazily by relative path plus an export."}
