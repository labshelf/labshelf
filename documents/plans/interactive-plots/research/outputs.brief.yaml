commands:
  - "node scripts/agents/run.mjs test core -- packages/core/__tests__/qmd/item/cellOutput.test.ts"
  - "node scripts/agents/run.mjs test core -- packages/core/__tests__/qmd/compute/writeCellOutput.test.ts"
  - "node scripts/agents/run.mjs test core -- packages/core/__tests__/qmd/dom"
