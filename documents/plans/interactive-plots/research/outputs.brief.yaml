  - {symbol: renderPreviewResult, path: packages/core/src/qmd/dom/codeCellView.ts, lines: "147", why: "Drag-preview for a cell without stored output."}
  - {symbol: previewResult / CellControls, path: packages/core/src/qmd/dom/inlineViews.ts, why: "OutputView subscribes to controls.previewResult() (outputView.ts:112); cellParamStrip.ts, codeCellParams.ts, cellRunStatus.ts feed it."}
  - {symbol: findOutputs, path: packages/core/src/writing/noteLinks/noteInsertables.ts, lines: "56-72", why: "Masks outputs and matches only DISPLAY ($$) in output.content; a plot output is ignored safely."}
  - {symbol: skippedLines, path: packages/core/src/writing/checks/noteTasks.ts, lines: "20-30", why: "Skips whole output divs. Safe."}
  - {symbol: output skip, path: packages/core/src/reader/dom/notesTab.ts, lines: "305-325", why: "Excerpt extractor: skipDiv from /^:::.*labshelf-output/ to next bare ::: while tracking fences. Safe if JSON stays fenced."}
  - {symbol: writeCellOutput, path: packages/core/src/qmd/compute/writeCellOutput.ts, lines: "21-52", why: "Used via cellRunner storeResult (cellRunner.ts:83) and reader/dom/cellRuns.ts."}
