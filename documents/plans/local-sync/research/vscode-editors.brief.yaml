risks:
  - "Q1: NO 300 ms autosave in vscode documentSync.ts. It never saves on its own; document.save() runs only on a webview {type:'save'} message (documentSync.ts:172), sent on user save (editor.ts:495, documentMode.ts:83-87). The TextDocument stays dirty until VS Code files.autoSave or the user saves; no LabShelf code reads files.autoSave. The only 300 ms host save is for LaTeX typing (build/autoBuild.ts:87-111). If D6b/D6c assume a 300 ms source-editor autosave in the host, that is wrong."
  - "Q1 echo filter: documentSync.ts:128-137 pushes accepted changes onto shared.expected before applyEdit; onDocumentChange (66-81) matches via sameChanges (from/to/insert sorted), splices on match, else external. External: authority.external(changes) at line 77, then broadcastSince (54-64) posts {type:'updates'} or, on RangeError, {type:'resync'}; postDirty at line 80."
  - "Q2 notes editor never saves. Webview 'save'/'create' go through applyItem (138-151) to itemMessageEdit (63-70, toWorkspaceEdit 54-60) and workspace.applyEdit, serialized by an edits promise chain. No document.save(), no dirty message. Failure shows showErrorMessage and posts {type:'update', text}. NO echo suppression: listener 154-156 posts {type:'update', text: document.getText()} for every change incl. own echoes. Posts dropped until page sends 'ready' (135)."
  - "Q3 deck editor: page sends deck/theme text with baseVersion; applyFromPage (130) queued; apply (113-127) builds one WorkspaceEdit (buildPageEdit 79-86) over deck.html and optionally theme.css. Stale page (isCurrent 110-111) gets full {type:'update'} and false. Echo: createEchoTracker (63-76) text-based, one expected text per uri, consumed on first change; listener 102-108 skips echoes else postUpdate re-posts both full texts. Sync never saves; deckEditor/provider.ts:79 saves on explicit save request (theme at 81 if dirty); provider.ts:150-151 posts dirty on change and save. alias (91-92,124) maps page base version to doc version."
  - "Q4: no LabShelf code reacts to a dirty TextDocument whose file changed on disk. Existing FileSystemWatchers cover library fs (library/fileSystem.ts:155-166), project tree, outputs, chat, checklist notes/*.qmd (projects/checklist.ts:342), code links; none for editor documents. VS Code itself prompts a save conflict for a dirty doc and reloads a clean one (firing onDidChangeTextDocument, which reaches the external path in all three editors). The three editors share no common listener (documentSync joinShared is source-editor only; notes 154 and deck 102 have their own). Natural hook: a new vscode-level service near customEditorTabs.ts or writing/index.ts activation using createFileSystemWatcher, workspace.textDocuments lookup, workspace.fs read of disk text, mergeLocalFile, then applyEdit. A base text must be tracked since TextDocument exposes none."
  - "Q5: vscode has no node-diff3 dependency; add it to packages/vscode/package.json (check bundling in packages/vscode/build, not inspected) or have core expose a diff3-bound merge. vscode imports core as '@labshelf/core' and subpaths @labshelf/core/sourceEditor, /deckWorkspace, /deckEditor, /math in webview entries. Not verified that the barrel exposes createTextMerge to vscode (writing/index.ts:29 re-exports it)."
  - "Mock: no TextDocument class in __mocks__/vscode; tests build plain objects (uri, getText, positionAt, isDirty, version, save). Mock files: __mocks__/vscode/index.js, api/workspace.js, types/text.js (WorkspaceEdit line 19)."
