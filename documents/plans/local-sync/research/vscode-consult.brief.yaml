risks:
  - "createItemApplier is private (serialises edits, autosave.schedule, posts {type:'update', text} on failure); export it for the qmd consult channel."
  - "No consult code exists in packages/vscode/src. paperIdsWithNotes and projectNotes have no single existing function (see deps.noteSource(project) in bridges.ts 277-281, src/localSync/paperNotesPort.ts 8-16)."
  - "sourceEditorEntry.ts has no test; keep logic in a testable module."
  - "createAuthorities is per-provider; hoist or a tab and a consult window of the same file diverge on one TextDocument."
  - "Each consult doc needs its own acquire/release on window close and on panel dispose."
  - "resolveCodeFile throws 'outside the project' when projectRoot is undefined."
  - "Authority text is LF-normalised in initMessage; the consult doc init must do the same."
