risks:
  - "Paper note writes bypass the replica until the port uses readText/writeText."
  - "No view re-renders on replica changes; reader needs a doc observer that reloads notes and pushes them."
  - "Reader is its own realm (iframe or page): own hub; no unload hook to flush/release."
  - "setQmdDocText replaces changed fragments, detaching bound y-prosemirror editors."
