risks:
  - "Writers that bypass an open TextDocument (all land on disk, so an open editor sees only an external-change reload and a dirty doc gets a conflict): (a) every paper notes.qmd write via node fs (nodePaperNotesPort.ts:44 writeFileAtomic), reached from reader note messages and library-pane handlers; (b) VscodeFileSystem.writeText/writeFile (fileSystem.ts:44-65), used by project notes (writing/projects/noteFiles.ts:28), citation scopes (citationScopeStore.ts:30), project copy (projects/commands.ts:221), NoteFileIo for assets (reader/noteFiles.ts), createOutputProjectFiles (outputs/projectOutputs.ts:40), equation cache (equations/equationPort.ts:53, binary), tree create file (projects/tree.ts:221, empty), import PDF bytes (library/import.ts:127, binary)."
  - "Direct workspace.fs.writeFile of text: spaces/view.ts:80, share/node/shareDeck.ts:97 (svg), activation/node/exportDeck.ts:68 (html), reader/panel.ts:60 (markdown export), writing/deckEditor/commands.ts:151, collab/comments.ts:56, collab/suggestions.ts:177 (suggestions.ts:183 looks up an open doc nearby), writing/notesEditor/index.ts:14 (empty new file), deckWorkspaceHost.ts:240 (PDF, binary). Direct node fs: writing/sourceEditor/node/dictionaryStore.ts (dictionary, not user docs), writing/sourceEditor/node/deckStylePreview.ts:78 (temp preview), relay/node/remoteLibrary.ts:212 (writeFileAtomic for sync mirror; relevant to local-sync, bypasses docs)."
  - "Only deckWorkspaceHost.writeProjectFile does applyEdit+save. collab/binding.ts:120 uses applyEdit without save. No shared helper exists: facts fn finds only writeProjectFile (private), reader/citeInProject.ts:43 insertAt, and core projectValues.ts:23 addMainLine (takes OpenSources + writer)."
  - "PaperNotesPort is the host-neutral seam (HostAdapters.createPaperNotesPort in activation/hostAdapters.ts; only desktop impl is createNodePaperNotesPort); the browser has its own in packages/browser/src/storage/records.ts. The port gets only a notesPath locator and tmpDir, no vscode.Uri; a doc-aware VS Code port needs uriOf (available on HostAdapters)."
  - "ExternalChangeWatcher does not watch notes outside papers/** and does not refresh open docs; it only re-indexes."
