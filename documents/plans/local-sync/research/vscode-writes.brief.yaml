schema: brief/v1
area: vscode-writes
question: "which VS Code LabShelf text writes bypass an open TextDocument (plan local-sync D6a), and what can a write-through-TextDocument fix reuse"
sha: df63894a0
reuse:
  - {symbol: writeProjectFile, path: packages/vscode/src/writing/sourceEditor/deckWorkspaceHost.ts, lines: "100-107", why: "private, the only write-through-open-TextDocument helper. Code: key=target.toString(); document = workspace.textDocuments.find(uri.toString()===key) ?? await openTextDocument(target); edit = new WorkspaceEdit(); edit.replace(target, new Range(document.positionAt(0), document.positionAt(document.getText().length)), text); if(!await applyEdit(edit)) throw 'Could not write'; if(!await document.save()) throw 'Could not save'. Not shared; used only by deckWorkspaceHost.ts:178 (deckWorkspace writeFile request)."}
  - {symbol: replace.ts apply+save pattern, path: packages/vscode/src/writing/search/replace.ts, lines: "47-107", why: "builds a map of open file docs (textDocuments filter scheme file), applyEdit, then saves the ones that were clean (wasClean); a second variant of the same idea"}
  - {symbol: citationFixes applyEdit, path: packages/vscode/src/writing/preview/citationFixes.ts, lines: "74-126", why: "applyEdit on bib/source docs, no save at 126 (throws if refused)"}
  - {symbol: writeFileAtomic, path: packages/core/src/library/node/fileSystem.ts, lines: "13-13", why: "node temp+rename writer used by nodePaperNotesPort and relay remoteLibrary.ts:212"}
  - {symbol: createPaperNotesLocator, path: packages/core/src/library/layout.ts, lines: "100-100", why: "maps paperId to notes.qmd path (used libraryRootController.ts:39)"}
edit:
  - {path: packages/vscode/src/library/fileSystem.ts, lines: "28-104", why: "VscodeFileSystem implements LibraryFileSystem. writeText(filePath, content) (44) = writeFile(filePath, TextEncoder bytes). writeFile(filePath, Uint8Array) (49-65): ensureDir(dirname), ensureDir(tmpDir), writes to dot-prefixed .<name>.<uuid>.tmp in the library tmpDir (or next to target if outside root, tmpDirFor 69-74, EXDEV trap) via vscode.workspace.fs.writeFile, then workspace.fs.rename(tmp, target, {overwrite:true}); on error deletes tmp and throws 'Failed to write <path>: ...'. It never consults open TextDocuments, so an open dirty/clean doc of that file only learns of the change via the file watcher reload. Constructor (root|undefined, paths: PathOps, uriOf). Natural hook for a write-through-document branch in writeText."}
  - {path: packages/vscode/src/activation/node/desktopPlatform.ts, lines: "113-113", why: "desktop wiring: createPaperNotesPort: createNodePaperNotesPort. This path uses node fs (not VscodeFileSystem, not TextDocument); to route paper notes.qmd through a document, replace this adapter."}
  - {path: packages/core/src/qmd/node/nodePaperNotesPort.ts, lines: "22-48", why: "createNodePaperNotesPort(location{notesPath,tmpDir}, logger): read = node fs.readFile utf8 (ENOENT -> null); write = writeFileAtomic(file, text, tmpDir); throws if paper not in index. Also used by packages/terminal/src/library/sidecars.ts:22, so keep node behaviour; do the VS Code variant as a new HostAdapters.createPaperNotesPort."}
read:
  - {path: packages/vscode/src/library/fileSystem.ts, lines: "139-184", why: "ExternalChangeWatcher: 3 createFileSystemWatcher patterns (papersRoot/**, paperDataRoot/**/sidecar file, projectsRoot/**); create/change/delete debounced 1000ms into one onChange (re-index); skips isExternalChangeNoise(uri.fsPath). It re-indexes only; it does not reload docs."}
  - {path: packages/vscode/src/activation/libraryRootController.ts, lines: "13-43", why: "createFileSystem (14-16) = new VscodeFileSystem(root.fsPath, adapters.paths, adapters.uriOf), one per library root, built in buildServices (line ~62) and passed as services.fileSystem. createSidecarStores 33-43 builds PaperNotesStore(adapters.createPaperNotesPort({notesPath: createPaperNotesLocator(id=>store.paper(id)?.record.path, join), tmpDir: ()=>layout().tmpDir()}, logger), {logger}) -> services.paperNotesStore (line 79,89)."}
  - {path: packages/core/src/qmd/paperNotes.ts, lines: "58-76", why: "PaperNotesStore.mutate: queue per paper, read port -> parse -> change -> port.write(paperId, serializeItemFile). Every paper-notes write funnels through port.write (line 74), so one port is the single choke point."}
  - {path: packages/core/src/reader/noteMessages.ts, lines: "42-60", why: "writeNote(): reader addNote/editNote/moveNote/removeNote/colorNote (lines 121-129) call notes.addItem/editItem/setAnchor/removeItem/setAttribute on ctx.ports.notes, then pushNotes(loadReaderNotes). Also cell-run write at line 76 (notes.editItem)."}
  - {path: packages/core/src/libraryUi/paperHandlers.ts, lines: "61-70", why: "library-pane paper note add/edit/remove (addItem/editItem/removeItem), cell write-back at 117"}
  - {path: packages/vscode/src/writing/notesEditor/provider.ts, lines: "135-150", why: "the LabShelf notes custom editor already writes through the TextDocument (itemMessageEdit + workspace.applyEdit, no explicit save), the model to match"}
  - {path: packages/vscode/src/writing/projects/noteFiles.ts, lines: "15-31", why: "project notes io: fs.ensureDir + fs.writeText via LibraryFileSystem, bypasses an open doc"}
