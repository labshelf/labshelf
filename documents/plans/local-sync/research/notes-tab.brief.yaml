risks:
  - "mountNoteFile has NO collab option and nothing mounts a shared .qmd note item by item; only QmdEditorOptions.collab (fragment plus REQUIRED awareness) exists, untested. mathCheckPlugin.test.ts line 8 says a collab mount cannot be built under jsdom (ySyncPlugin dispatches during EditorView construction), so test at doc level or with a fake mountQmdEditor."
  - "Awareness is required by qmdEditor's collab type; make it optional (skip yCursorPlugin) as session 3 did for createCollabExtensions."
  - "No exported item list/get-fragment/observe API in sharedQmdDoc.ts; bodies.get(key) is undefined for loose segments and before sync. setQmdDocText REPLACES an item's fragment when an external text changes its body, so a view bound to the old fragment edits a detached one: rebind the item's editor on every bodies change for its key, not only on order change."
  - "Item metadata (fence line with author/created, close line, eol/trailing/unterminated) lives OUTSIDE fragments in attrs/tails; header meta must be parsed from attrs.get(key); file text reads correctly only via readQmdDocText."
  - "Item add/remove while bound: order/attrs/bodies/tails are separate maps; a key in order without attrs is skipped by readQmdDocText (73), so the UI list must filter the same way. Today updateFile remounts ALL items when ids or order change (mountNoteFile.ts 214-217), losing carets of the others: prefer per-item mount/unmount."
  - "Save semantics: today save per item goes to ProjectNotesStore.editItem (queued, latest wins). With a replica the Y edit is the save and DiskWriters persists after 300 ms; opened.flush() is immediate. The replica gives no dirty signal: set on onChange, clear after flush. onBeforeClose and dispose must flush then release."
  - "Empty file with create: mountEmpty calls create(newItemId(), body); with a replica this must add keys to the doc (replica.replace(serializeItemFile(...)) is simplest). Project notes pass no addItem so they show 'is empty' without an editor."
  - "Cell runs write output back with editor.setBody(next) plus change() (mountNoteFile.ts 126-142); with collab that must be a ProseMirror transaction on the bound view. bodyOf, cellsAbove and otherBodies read text snapshots (s.latest, s.items) that go stale once the fragment is the truth."
  - "isItemFileName is true for any .qmd (comments.qmd too); only tabKinds isProjectNotePath restricts the note tab to notes/*.qmd. openLiveBinding in sourceTab.ts uses doc.getText('content') regardless of kind: for a qmd-kind replica that Y.Text is unrelated, so verify sourceTab never live-binds a .qmd."
  - "VS Code notesEditorEntry also uses mountNoteFile (line 58); the new option must leave the text path untouched."
  - "Other writers (PaperNotesStore, ProjectNotesStore) keep calling LibraryFileSystem; per D5 their writes become replica.replace(text), which setQmdDocText applies item by item, so open item editors see a body change as a replaced fragment (see rebind risk)."
