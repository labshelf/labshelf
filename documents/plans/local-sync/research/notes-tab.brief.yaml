  - {path: packages/browser/src/libraryUi/editorArea/noteFileTab.ts, lines: "35-57", why: "createNoteWriter queues editItem(id, body) per item one after another, latest body per item wins, tab.setDirty(pending>0); create calls addItem. Replaced by the replica: the Y edit is the save, the disk writer persists, opened.flush() is the immediate persist."}
