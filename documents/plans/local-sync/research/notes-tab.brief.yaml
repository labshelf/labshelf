  - {path: packages/core/src/qmd/dom/mountNoteFile.ts, lines: "167-225", why: "mountEmpty creates the first item through options.create; render/updateFile remount all items when ids or order change. With a replica, mount/unmount per observed item and write new items as new keys."}
  - {path: packages/core/src/qmd/dom/qmdEditor.ts, lines: "144-155", why: "collab.awareness is REQUIRED (yCursorPlugin). D2 says no awareness between own views: make it optional and skip yCursorPlugin when absent (cf. createCollabExtensions in packages/core/src/collab/dom/editorCollab.ts 130-165, presence optional)."}
