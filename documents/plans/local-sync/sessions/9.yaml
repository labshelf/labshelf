    decided:
      - "Opener keys are library-relative hub paths: manuscript/projectNote -> join(project folder, path); paperNotes -> createPaperFiles(paper.path, joinWith('/')).notes; code -> the path as listed (already library-relative). It opens live.open(key), awaits replica.ready (on failure releases and rethrows), and returns editableFromReplica(replica, key, () => file.flush()) wrapped so release() flushes then calls the LiveFile's release() exactly once (never replica.release() directly). The tab's own file and a consult window of it share the one replica (refcount)."
      - "No hub (readPageLiveFiles() resolves undefined): the source tab mounts without the consult footer."
      - "ConsultIo: listPapers = listCachedPaperRecords; paperPdfBase64 = PDF bytes base64; annotationsOf via PaperSidecarStore; paperNotesText = paper notes port read; paperIdsWithNotes = papers whose notes.qmd stats; projects/listFiles reuse libraryCitation's ready-project listing (no third copy of listReady: export and reuse it); projectNotes = the project's .qmd files; listCodeFiles = over ready projects, library-relative paths of files that pass the same filter as codeLinkSource (deriveCodeLanguage defined, not .tex); open = async no-op; browse present only when picked.available."
      - "Picked files: available = typeof window.showOpenFilePicker === 'function' (Chromium); the default picker calls it with no await before it, so the chooser's click gesture holds through answerConsult. pick() keeps the FileSystemFileHandle in a Map by a fresh id; null when cancelled (AbortError). open(id): reads handle.getFile().text() into a fresh Y.Doc's Y.Text, returns {kind:'text', path: name, binding:{collab:{text}}, release}; every change writes the whole text through handle.createWritable() 300 ms after the last change; release flushes a pending write once and stops observing. A second open of the same id gets its own doc (single view, no hub)."
      - "ConsultClient = (request) => answerConsult(io, {projectId}, request), called directly (same page). pdfSource(bytes) = {assets: extensionPdfAssets(), createWorker: createPdfWorker, readBytes: async () => bytes.slice(0)}."
