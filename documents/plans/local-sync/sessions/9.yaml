    decided:
      - "Protocol: the consult messages ride beside the editor's own, like projectSearch: guards isConsultOutbound/isConsultInbound accept exactly the shapes in seams (ConsultRequest/ConsultRef/ConsultReply checked with isConsultRequest/isConsultReply and the ref guard from consultRequests.ts; updates arrays are not inspected beyond Array.isArray). parseSourceEditorInbound/Outbound are unchanged."
      - "Window key: the page makes one key per consult window (any string); every consultDoc/consultRelease names it. Two windows of the same file are two keys and two clients."
      - "consult {id, request} -> post {type:'consultReply', id, reply: await answerConsult(io, {projectId}, request)}; projectId is the panel's project id, omitted when the panel has none."
      - "consultFile {id, key, ref}: resolve the ref to a file URI: manuscript/projectNote -> the project's folder joined with the path (reject absolute or '..' paths); paperNotes -> the paper's notes.qmd (createPaperFiles(paper.path).notes); code -> resolveCodeFile(project folder, path) (the allow-list: workspace folders + picked; throws otherwise); paper and pickedFile -> error reply. Open it with vscode.workspace.openTextDocument. A .qmd file is kind qmd, anything else kind text. Reply {type:'consultFileReply', id, key, file} or file {error: <sentence>} on any failure."
      - "Text file session: acquire the URI's authority from the shared registry (the same SourceAuthority a source editor tab of that file uses), join it with createDocumentSync whose post wraps every message as {type:'consultDoc', key, message}; init = {kind:'text', path, text: authority text LF-normalised, lineBreak, version, dirty} as initMessage builds it. consultDoc push/save -> that member's receive. consultRelease or panel dispose -> dispose the member and release the authority exactly once."
      - "qmd session: init {kind:'qmd', path, text: document.getText()}; saveItem/createItem -> createItemApplier (exported from notesEditor/provider.ts, which serialises edits, applies itemMessageEdit and schedules the 300 ms autosave of session 5); every onDidChangeTextDocument of that URI posts {type:'consultDoc', key, message:{type:'update', text}}; release disposes the listener."
      - "VS Code ConsultIo: listPapers = library papers; paperPdfBase64 = exported bridges paperPdf; annotationsOf = highlightsOf; paperNotesText = paperNotes.read; paperIdsWithNotes = papers whose notes.qmd exists (workspace.fs.stat); projects/listFiles reuse createReaderCiteIo's pieces; projectNotes = the project's .qmd files from listFiles; listCodeFiles = listWorkspaceCodeFiles(project folder) or [] without a project; browse = browseCodeFile(project folder) -> {path, name: basename} or null, and browse is omitted without a project; open = async no-op."
      - "createAuthorities moves to packages/vscode/src/writing/sourceEditor/authorities.ts as one module-level registry (acquire(document)/release(document), refcounted by URI); the provider uses it unchanged in behaviour."
      - "packages/vscode/jest.config.js gains '@labshelf/core/consult' -> '../core/src/writing/consult/dom/index.ts' in coreSubpathFiles (for 9.2's tests)."
      - "Testing policy: run only node scripts/agents/run.mjs typecheck core, typecheck vscode and the listed test commands, never pnpm gate or lint."
