    decided:
      - "createAutosave (localSync/autosave.ts, delay default AUTO_SAVE_DELAY_MS = 300): schedule(document) (re)starts that document's timer; when it fires, document.save() runs only if document.isDirty; documents are timed independently; dispose() cancels every pending timer without saving. The notes and deck editors each use one per panel and dispose it with the panel."
      - "Notes editor: after a page 'save' or 'create' edit has been applied to the document, schedule document.save() AUTO_SAVE_DELAY_MS (300 ms) after the last such edit (debounced per editor panel); the timer saves only if document.isDirty; disposing the panel cancels a pending timer without saving. Explicit saves keep working."
      - "Deck editor: after deckSync applies a page edit, schedule a save of deck.html and, when it was edited, theme.css 300 ms after the last page edit, each only if dirty; cancelled on dispose. The explicit save request (deckEditor/provider.ts:79) is unchanged."
      - "followNotesFile: calls onChange 100 ms after the last of: vscode.workspace.onDidChangeTextDocument for a document whose uri.toString() equals notesUri.toString() (events with no contentChanges ignored), and change/create/delete of a vscode.workspace.createFileSystemWatcher(new vscode.RelativePattern(<folder uri>, 'notes.qmd' or the file name)). Dispose stops the listeners, the watcher and a pending timer."
      - "ReaderPanel._subscribe: when the panel has a paper with source.notes, push followNotesFile(vscode.Uri.file(createPaperFiles(paper.path, join).notes), () => void this.controller.refreshNotes()) onto this._disposables. A reader note write still force-pushes as today; the later refresh is deduped by refreshNotes."
