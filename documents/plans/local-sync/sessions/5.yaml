      - {path: packages/vscode/src/localSync/diskMerge.ts, signature: "export function createDiskMerge(deps: { textMerge: import('@labshelf/core').TextMerge; logger?: import('@labshelf/core').ILogger }): DiskMerge"}
    decided:
      - "track is refcounted per document uri (toString()); the last dispose stops watching. While tracked: one vscode.workspace.createFileSystemWatcher(new vscode.RelativePattern(<folder uri>, <file name>)) for the file, and one onDidSaveTextDocument listener."
      - "base: at track, document.getText() when the document is clean, else the disk text read at track time; after every save of the document (onDidSaveTextDocument) base = document.getText()."
      - "On the watcher's change or create event (work serialized per file): read the disk text with vscode.workspace.fs.readFile + TextDecoder. Clean document -> base = disk text, nothing else (VS Code reloads a clean document itself). Dirty document and disk == base -> nothing (own save echo). Dirty document and disk != base -> mergeLocalFile({path: uri.fsPath, base, local: document.getText(), other: disk}, textMerge); then vscode.commands.executeCommand('workbench.action.files.revert', uri) so the document holds the disk text with no 'file is newer' state; then replaceDocumentText(document, merged.text) from ./documentText.js when merged.text != disk, followed by document.save(); base = merged.text."
      - "Conflict (merged.conflict set): the document keeps its side (merged.text is local), the other side is written with vscode.workspace.fs.writeFile(vscode.Uri.file(conflict.copyPath), bytes), and vscode.window.showWarningMessage names the copy's file name, e.g. 'LabShelf kept your edits in notes.qmd; the version saved on disk is in <copy file name>.'"
      - "Delete events are ignored. Errors are logged through deps.logger and never thrown out of the watcher callback."
      - "Wiring: HostAdapters gains textMerge: TextMerge; the desktop platform sets it to mergeText from @labshelf/core/node; any other HostAdapters implementation (extensionPlatform.ts or tests' fakes) gets it too (a web build without node-diff3 may make it optional and skip the merge service; keep current behaviour there). startExtension creates one DiskMerge, disposes it with the extension context, and passes it to the three editor registrations as a dependency (diskMerge?: DiskMerge on their deps, optional so existing tests keep compiling). Each provider calls diskMerge?.track(document) when it resolves its editor and disposes the handle with the panel (deck: deck.html and, when open, theme.css)."
      - "Contract: add to documents/contracts/local-sync.md#hosts the VS Code dirty-document merge (base = text at last save; revert + merged edit + save; conflict copy + warning)."
      - "Testing policy: run only node scripts/agents/run.mjs typecheck vscode and the listed test commands, never pnpm gate or lint."
    acceptance:
      - {id: "5.2a", check: "a tracked dirty document whose file changes on disk in another paragraph ends with both edits: revert is executed for its uri, then one edit applies the merged text and the document is saved; no conflict copy is written"}
      - {id: "5.2b", check: "a tracked clean document whose file changes takes no action besides updating base (no revert, no edit, no save); a change whose disk text equals base (own save) does nothing"}
      - {id: "5.2c", check: "an overlapping change keeps the document's text, writes the disk text to the .labshelf-conflict copy path from mergeLocalFile, and shows one warning naming the copy"}
      - {id: "5.2d", check: "track is refcounted: two tracks of the same uri make one watcher; the watcher is disposed only after both handles are disposed; after a save base becomes the saved text"}
      - {id: A4, check: "core of A4: the source editor tracks its document, so a .tex with an unsaved edit in another paragraph takes a disk save from the browser in without a 'file is newer' dialog"}
      - {id: A5, check: "core of A5: the notes editor tracks its document, so a .qmd edited in two windows merges the other window's saved edit item by item"}
