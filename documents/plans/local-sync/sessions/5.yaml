    decided:
      - openDocumentOf finds the document in vscode.workspace.textDocuments whose uri.toString() equals the given uri's toString(); closed documents (isClosed true) do not count.
      - "replaceDocumentText: no-op (no applyEdit) when the text is equal; otherwise one vscode.WorkspaceEdit with a single replace of only the changed middle range (minimalReplace offsets mapped through document.positionAt), applied with vscode.workspace.applyEdit; throws Error('Could not edit <fsPath>') when applyEdit resolves false. It does not save."
      - "writeThroughDocument: no open document -> resolves false and touches nothing. Open document -> replaceDocumentText, then document.save() when the document is dirty after the edit; throws Error('Could not save <fsPath>') when save resolves false; resolves true. A dirty document with unsaved edits elsewhere is saved with them (the TextDocument is the live copy, D1)."
      - "VscodeFileSystem.readText(path): the open document's getText() when one is open, else today's disk read. writeText(path, text): writeThroughDocument(uriOf(path), text) first; when it resolves false, today's atomic temp + rename write. writeFile (bytes) is unchanged and never consults documents."
      - "createDocumentPaperNotesPort: read(id) -> notesPath(id) undefined ? inner.read(id) : (open document ? its getText() : inner.read(id)); write(id, text) -> notesPath(id) defined and writeThroughDocument(uriOf(path), text) true ? done : inner.write(id, text)."
