    decided:
      - "Protocol (contract): WebviewToHost gains {command:'consult'; message: ConsultOutbound}; isWebviewMessage accepts it only when isConsultOutbound(message). HostToWebview gains the ConsultInbound members as they are (type 'consultReply' | 'consultFileReply' | 'consultDoc'). The init message gains hasConsult?: true, set by the host controller when ports.consult exists (as hasEquationPort)."
      - "ReaderHostPorts.consult?: ReaderConsultPort. The host builds the port bound to its own post (it answers with ConsultInbound through ports.post); the 'consult' handler calls ports.consult.handle(message) and logs a rejection through READER_LOG_MODULE; with no port it drops the message (no reply exists to send). The controller does not own the port's lifetime; the host disposes it."
      - "ReaderStartOptions.consult?: () => Promise<ConsultSetup | undefined>. startReader calls it once after the UI is built and never when boot.preview; a defined result builds createConsult({...setup, root: document.body, onError: log through the reader's console/logger as the reader does today}) and calls toolbar.setConsult({choose, windows}); undefined or a rejection leaves the button hidden. pagehide disposes the consult (flushes and releases open files)."
      - "Toolbar: setConsult(undefined) hides; setConsult(c) shows a 'Consult' icon button (icon 'book', label 'Consult', aria-label 'Consult') in the end group before Find, and a chips strip (renderConsultChips over c.windows) right after it; the chips strip is empty when no window is open. Clicking the button calls choose(). Chips raise (bringIntoView) and close as the footer's do. While a consult window is open the toolbar does not autohide."
      - "renderConsultChips is the footer's chip rendering moved out (same DOM and classes), returning the strip and an unsubscribe; createConsultFooter uses it; footer DOM unchanged."
      - "The core reader never imports host code; the VS Code and browser wiring is 10.2 and 10.3."
      - "Testing policy: run only node scripts/agents/run.mjs typecheck core, typecheck vscode, typecheck browser and the listed test commands, never pnpm gate or lint."
    acceptance:
