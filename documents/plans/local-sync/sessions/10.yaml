      - {id: "10.1b", check: "the host controller's init carries hasConsult: true only when ports.consult exists; a consult command reaches ports.consult.handle with the message; without the port it is dropped without throwing"}
      - {id: "10.1c", check: "Toolbar: hidden Consult button until setConsult; after it the button calls choose(), and the chips strip lists one chip per open window, updates on open/close, and a chip's close button closes its window; setConsult(undefined) hides them again"}
      - {id: "10.1d", check: "createConsultFooter renders the same chips as before (existing consultFooter tests stay green)"}
      - {id: A9, check: "reader part of A9: the reader toolbar's Consult opens the chooser (checked by hand in both hosts)"}
