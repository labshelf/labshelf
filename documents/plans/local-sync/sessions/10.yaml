# Handoff (run 1, 100k context warning): specs 10.1-10.3 written and pending; next run: tester for 10.1 and 10.2 (hidden tests), plan red, plan lint (A1/A2/A3/A7/A8 "in no spec" lines predate this session), then implementer 10.1, then 10.2 and 10.3 in parallel, finish session with gate: lint milestone, plan close.
# Scouted at c85312145 by two explorers (core+VS Code reader, browser reader); their findings are folded into the specs below.
# Owns are wide because this session is a lint milestone (the finisher fixes lint across the packages).
# Decisions (recorded): the reader gets the consult through a startReader option, not through HostBridge, so each host builds its own client/openFile.
#  VS Code: the webview builds them with createWebviewConsult over the reader channel ({command:'consult', message: ConsultOutbound} out, ConsultInbound members of HostToWebview in),
#  the host answers through the optional ReaderHostPorts.consult port (createConsultFiles + createVscodeConsultIo per panel).
#  Browser: the reader runs in the hub's own page, so readerPage passes a direct client (answerConsult) and the LiveFiles opener; no channel, no port.
#  The reader has no project: consult runs with no projectId (paper notes, all projects' manuscripts and notes, no code list, no Browse in VS Code;
#  browser keeps Browse on Chromium). Previews (boot.preview) never show Consult.
