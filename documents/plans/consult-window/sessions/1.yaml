      command: node scripts/agents/run.mjs test core --spec 1.1 --plan consult-window -- packages/core/__tests__/writing/consult/answerConsult.test.ts packages/core/__tests__/writing/consult/consultRequests.test.ts
    commands:
      - node scripts/agents/run.mjs typecheck core
