risks:
  - "Browser: the project file tree (core sidebar via renderTreeItem) has no draggable rows and no dragstart; other editor tabs accept no file drops (editorArea only accepts TAB_MIME). The whole browser drag source is new: define a MIME carrying {projectId, path}; reject drops from another project."
  - "VS Code: the project tree is a native TreeView/Explorer; no TreeDragAndDropController or webview drop handling exists in packages/vscode/src. Not verified: Explorer drag into a webview supplies text/uri-list (and 'application/vnd.code.uri-list'), and VS Code historically requires holding Shift to drop onto a webview/custom editor; check before promising plain drops. Parse file:// URIs with decodeURIComponent; may be multiple lines; ignore # comments."
  - "Webview cannot see fs paths reliably; resolve in the host (deckWorkspaceHost) where isInside/checkRelativePath exist; an image outside the project should be rejected or copied (HTML deck provider.ts pickImage copies into assets/; the compiled one does not)."
  - "Path is relative to the deck FILE's folder (pickImage contract). For a slide in an included file (node.file set), LaTeX resolves from the main document's dir while Typst #image resolves relative to the including file; decide the base per format."
  - "Pickers accept pdf/eps; Typst #image does not take pdf/eps; filter by format on drop."
  - "slideGrid.ts dragover only preventDefaults when gs.dragFrom>=0, so add a file branch without regressing reorder. Stage drop must be on .dw-stage, not the PDF canvas."
  - "insertSourceElement writes src unescaped (spaces, braces in LaTeX)."
  - "chosenTarget excludes column/columns/code nodes (falls back to the slide); a drop onto a column in the structure panel needs explicit handling."
