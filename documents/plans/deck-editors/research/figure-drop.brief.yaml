  - {symbol: insertElement, path: packages/core/src/decks/dom/workspace/workspaceEdits.ts, lines: "162-170", why: "the workspace's figure insert: picks target (chosenTarget: selection in Visual / node at cursor, else current slide or poster last block), awaits ports.pickImage() for src, calls insertSourceElement on textOf(ws,file) and apply(...). A drop needs the same with a given src and target instead of pickImage. Refactor: split into insertFigureAt(ws, target, src)."}
