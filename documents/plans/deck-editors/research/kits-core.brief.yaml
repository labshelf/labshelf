risks:
  - "Test harness is jest (packages/core/jest.config.cjs, testEnvironment node, jsdom per file by docblock), NOT vitest. No canvas jsdom package; jsdom canvas getContext returns null/unsupported. So palette extraction must be a pure function over RGBA Uint8ClampedArray (width,height) tested directly; the DOM decode step (img -> canvas -> getImageData) needs injected deps like slideThumbnails RasterDeps (createCanvas/loadImage) and must be faked in tests. @napi-rs/canvas is available only on the Node side (import/node/nativeCanvas.ts)."
  - "No palette / quantisation / dominant-colour code exists in core (grep hits were unrelated: typst stdlib markup, pageBlocks, versionDiff, textLines). Must be written new; use relativeLuminance/isLightColour from ui/tokens/themes.ts, check the result with validateDeckStyle + deckStyleContrast; extracted fonts/scale have no source so take them from current/DEFAULT."
  - "Footer: not expressible today. HTML decks have no footer concept in deckParse/deckProject/deckLayoutCss/theme.css (only a statusBar footer element in the editor UI); compiled templates have only setbeamercolor{footline}. A footer text or logo written into a deck needs new contract text (and per-template insertion: beamer setbeamertemplate{footline}, tikzposter, Typst touying footer, HTML a per-slide block or theme.css rule). Cheapest in-scope: store footer in the Kit and do not apply it, or add insertion only for HTML via imageBlockHtml/textBlockHtml per slide; flag as out of reach without a contract."
  - "Logo insertion: imageBlockHtml (HTML, needs id/rect/slide edit via deckEdit) and insertSourceElement kind figure (compiled, caption + 80% width, placed after a chosen node) exist; neither targets title slide or every slide, and a logo path in the kits folder must be copied into the deck folder/asset path since src is relative to the deck (resolveAsset/assetOrigin in html shell ctx.options)."
  - "Apply for a kit must stay a single undo step: Style apply already is (editThemeCss / setSourceDeckStyle via apply(ws, change)); logo/footer edits would be a second change unless merged into one."
  - "Panel keydown handler stops propagation inside the panel; a file picker for From logo needs a host port (no file-picker precedent in the Style panel; browser vs VS Code differ), as the compiled adapter did for stylePreview (optional port, browser omits it)."
  - "Library kits folder: not defined in contracts (decks.md ## Folders L7 and library-format.md have no kits entry); a new folder needs library-format contract text. mineSource.ts was not found as a JSON store; the closest are projectRegistry.ts and writeRecords.ts."
  - "Barrel exports: normaliseDeckStyle not exported from decks/index.ts; kits code in decks/ would import from ./deckStyleTokens.js directly. Core Style files max 400 lines: panel.ts 160, candidates.ts 90, presets.ts 40, types.ts 17, index.ts 4, style.css 42."
