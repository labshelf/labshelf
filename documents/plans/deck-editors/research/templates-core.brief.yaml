risks:
  - "No source scaffold exists for beamerposter, touying or peace-of-posters; only tikzposter and plain Typst"
  - "DECK_STYLE_PRESETS lives in dom/shell/style/panel.ts; a pure module must not import DOM code: move it to a non-DOM file"
  - "orientedPreset is private in sizePicker.ts; nothing in deckSizes.ts swaps orientation"
  - "LaTeX posters are limited to a0, a1, a2 papers; free sizes for Typst and HTML only"
  - "Neither host has a webview for creation today"
  - "When applying a preset at creation, spread it over DEFAULT_DECK_STYLE the way the panel's preset() does"
