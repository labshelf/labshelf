risks:
  - "Session 4 changes since 47328126f: added deckStylePreview.ts (136) and its test (256), the deckStylePreview request, small edits to deckWorkspaceHost.ts (176), deckWorkspacePorts.ts (93), registerWritingView.ts (314), platformPort.ts, typstBuilds.ts; both webview entries gained only the deck-shell-style.css import. Browser deckTab.ts and deckWorkspaceTab.ts are unchanged and pass no stylePreview."
  - "Line counts of files to change: core/writing/protocol.ts 283; vscode deckWorkspaceHost.ts 176, deckWorkspacePorts.ts 93, sourceEditorEntry.ts 303, sourceEditor/provider.ts 332, registerWritingView.ts 314, deckEditor/provider.ts 147, deckMessages.ts 77, deckEditorEntry.ts 150, deckEditor/index.ts 88; browser deckTab.ts 296 (close), deckWorkspaceTab.ts 99, deckAssets.ts 105, writing/source.ts 314, libraryUi/host/handlers.ts 314. Tests: browser deckTab.test.ts 399 (at limit), vscode deckEditor/provider.test.ts 316, documentSync.test.ts 336."
  - "No kits code exists in core, and no pick-a-file-return-bytes exists in VS Code (both pickImage hosts return only a path). Browser has input type=file for images (writing/source.ts:57-69) but it copies into a project instead of returning bytes to a panel."
  - "No library open: in VS Code host.current() is undefined, so kits answers must return an empty list or a clear error (host.require() offers setup); in the browser the library root '' always exists. Create <root>/kits with fs.ensureDir before writing; use PathOps, not string joins; sanitise kit file names (no '..' or separators) since the webview sends them."
  - "CSP and resource roots: compiled-deck webview localResourceRoots exclude the library, so show a kit logo as a data: URL from base64 (source editor shell CSP must be checked: cspImages 'data' mode has no blob:). The HTML deck webview allows only the deck folder as a resource root. A logo path stored in the kit is relative to the library root and must be resolved through the host, not as a URI."
  - "Base64 size: postMessage carries base64 (33 percent bigger). Cap picked image bytes (e.g. refuse over about 5 MB, or downscale in the webview before storing). base64() in deckWorkspaceHost.ts chunks at 0x8000, fine for large files."
  - "Channel asymmetry: compiled decks use the generic request(id, method, params) protocol validated by core protocol.ts PARAMS (a new method needs the union entry and a validator). HTML decks use ad hoc typed messages whitelisted in parseDeckPageMessage (union and switch)."
  - "provideDeckWorkspace is a module-level singleton, so the kits service is global to the extension, not per panel."
  - "Browser pickQuickEntry only lists project files; a kit logo from outside the project needs the input type=file path, whose dialog must open synchronously from the click, so the core Kits button handler must call the port before any await."
  - "The HTML deck webview in VS Code is not covered by the compiled-deck bridge; its kits messages need their own library-root access (not in DeckEditorProviderDeps), so thread the root via deckEditor/index.ts."
