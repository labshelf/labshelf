risks:
  - "Workspace receives NO log text and NO problems: only DeckBuildState {state,errors}. Both hosts have result.problems at build end (file,line); extend the state/port with located vbox problems, no raw log needed."
  - "Overfull \\vbox is severity 'info', no kind, not deduped by line; 'has occurred while \\output is active' lines carry no line number so cannot map to a frame; 'detected at line N' is where the output routine fired (usually frame end), should fall in node.line..endLine. Prefer a new BuildProblemKind in explainBadBox (log.ts ~255-257); BuildProblemKind also feeds reader previewProblems.ts and previewProtocol.ts (check exhaustiveness)."
  - "Beamer overlays: one frame -> several pages; mapPagesToSlides uses page labels so a frame's pages share a slide index; pageOfSlide returns only the FIRST page. Without labels and pages != slides, slidePages is null and the fallback slide+1 is wrong with overlays; badge-by-line for LaTeX is independent of pages."
  - "Typst: no labels, no SyncTeX (ports.links absent). Only pdf.count vs slide count is known; slidePages is null whenever they differ, so the spilling slide is unidentifiable by the existing map. Options: match page text runs to slide titles (as matchTalk does via matchTextRects) or flag the whole deck."
  - "Tree may include slides from included files (node.file); compare file with path normalisation. Grid/structure slide indices are tree indexes; gs.slides in slideGrid is the tree indexes of kind 'slide'."
  - "Stale data: problem lines refer to text at build time; after edits tree lines move. Clear badges on edit or accept staleness."
  - "HEAD is 51b0fbe37 on feature/deck-editors."
