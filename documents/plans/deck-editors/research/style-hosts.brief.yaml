risks:
  - "BUILD COPY: Typst can preview in memory with no file written (TypstSession.compile sources, or buildProject options.unsaved). The PDF is whole-document, so show page N in pdf.js. LaTeX has no source override: latexmk runs in project.folder, so a LaTeX preview needs a new copy of the project (or main plus inputs) in a temp dir with the candidate Style, a separate outDir, and other frames removed. Not found: any dest-preview, charts or drawings snapshot compile, or per-frame or per-page compile; only includeonly per include."
  - "BROWSER: no in-page Typst or LaTeX compile (packages/browser/src/writing/typst.ts only re-exports completion). Every browser build goes through the local Helper (helper.compile with projectId, main, mode full or preview; HelperCompileRequest has no source text and no output dir). A browser build copy needs a new Helper request. Without a Helper or a previous build, use swatches. Protocol: packages/core/src/helper/ (parseHelperMessage.ts:255, helperClient.ts:99, helperProject.ts, node/projectHandlers.ts:122, node/helperBuild.ts:181)."
  - "No pickLogo or kits port exists. deckPickImage returns only a relative path, not bytes. Palette extraction needs the bytes in the webview (new host method returning base64, like deckPdf) and a canvas, so it belongs in core DOM, with the browser downscale as precedent."
  - "VS Code library root only from WritingHost.current()?.root (undefined when no library; host.require() offers setup). Create the kits folder with ensureDir. Use PathOps (projects.paths), not slash joins. Deck webview localResourceRoots (sourceEditor/provider.ts:309) allow only the bundle, chunks and pdf.js, so a logo from the library needs base64 or a blob."
  - "File sizes: deckWorkspaceHost.ts 162, deckWorkspacePorts.ts 89, deckEditor/provider.ts 147, deckMessages.ts 77, deckEditorEntry.ts 149, sourceEditor/provider.ts 332 (avoid adding), browser deckWorkspaceTab.ts 99, deckTab.ts 296 (near the 400 limit), deckAssets.ts 105."
  - "Ports for new features must be added in workspace/types.ts (compiled) and shell/html/types.ts (HTML), not shell/types.ts."
  - "provideDeckWorkspace is a module-level singleton, so a kits or preview service there is global to the extension. A build-copy compile must not run alongside the user's build: reuse the core build queue or a separate TypstSession queue (TypstSession holds one set of shadowed sources and serialises)."
