risks:
  - "Much of the main-file two-way flow already exists: ws.sync defaults true, pick() reveals node.range[0] in split, cursorMoved selects the node under the cursor. Gaps: included-file nodes never reveal or open on stage click or panel select (guards node.file undefined at workspaceView.ts lines 19 and 50); a cursor in an included file never selects; stage click reveals only the range start; the Sync toggle is not persisted; no tests; harness cursor is fixed at 0."
  - "Loop: reveal or select dispatches a CodeMirror selection, the feed fires cursor(), debounced 120ms cursorMoved runs findSourceDeckPathAt, which at a range start picks the innermost node and may replace the clicked block with its first child. The equal-path early return stops the cycle only when the path is unchanged. Add an echo guard (remember the offset just revealed and ignore the next cursor event there) or reveal an offset that maps back to the same path. pick is async with a click ticket and the debounce can apply a stale cursor after a newer click."
  - "Edits: apply() also moves the cursor; textChanged is skipped while ws.ownEdit, and the debounced cursorMoved normally runs after the tree refresh."
  - "Included files open in a separate VS Code editor via files.open; the webview gets no cursor event from it, so source to stage for included files needs a new host message (onDidChangeTextEditorSelection) and a new port field. Browser files.open may be absent, so Split there may not be able to show another file."
  - "In both hosts the Split code pane is the in-webview CodeMirror of the main file only."
  - "findSourceDeckPathAt ranges are inclusive at the end, so a cursor on the boundary of two sibling nodes maps to the earlier one."
  - "Not read in full: shell/header.ts, shell/layout.ts, vscode deckWorkspaceHost.ts, browser deckWorkspaceTab.ts files.open. Line ranges for those are approximate; confirm before editing."
