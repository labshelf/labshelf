risks:
  - "leafText/escapeText flatten hand-written inline markup today; commit compares plain text so a formatting-only change counts as unchanged"
  - "no sanitiser for deck inline HTML; contenteditable produces div/font/nested spans; paste can inject HTML"
  - "toolbar buttons outside the frame: the frame's focusout/pointerdown commit and close the leaf, losing the selection; buttons need mousedown preventDefault"
  - "window.prompt is unavailable in VS Code webviews; a link needs an in-page input"
  - "a selection across leaves or blocks needs defined behaviour; native undo inside contenteditable is separate from deck history"
