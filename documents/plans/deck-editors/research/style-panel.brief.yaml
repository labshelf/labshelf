  - {path: packages/core/src/decks/dom/workspace/types.ts, lines: "23-53", why: "DeckWorkspacePorts (compiled adapter): path, editing: SourceDeckEditing, editor, subscribe({text(), cursor(offset)}), pdf:{assets, read(), createWorker?}, build:{run(), onState(listener)}, links?, present(), posterPreview(), exportPdf(), showProblems(), pickImage?(), mode:{read(), write()}. NO compile-a-copy or preview-build port: build.run() saves and builds the file root."}
