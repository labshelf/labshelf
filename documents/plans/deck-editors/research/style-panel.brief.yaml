risks:
  - "Callers notes: createThemePopover has one caller (shell/html/shell.ts); mountThemePanel is only called inside themePanel.ts; createToolButton is also used by deckSourceView.ts:9 and createSizePopover by shell.ts:43, so they stay when themePanel.ts is trimmed. ctx.editor.editTheme is called from shell/html/props.ts:47-48 and the Theme popover; controller field deckEditorCore.ts:26. mountDeckShell is called only by shell/html/shell.ts and workspace/workspaceUi.ts (the two adapters)."
  - "doc.mjs not run: no contract sections checked. Check module rules on a shell/style/ -> shell/html/fields.ts import and the CSS token lint (scripts/lint/cssTokens.mjs)."
  - "The shell has no adapter interface; a shared Style panel needs a new port type in shell/types.ts (current style, apply(style), preview render of the current slide, theme or SourceDeckChange writer)."
  - "No panel-switch or tab mechanism in the shell: props is one element replaced wholesale, left has local tab state; only tab helper is fields.ts tabs(); only popover is createToolbarPopover."
  - "No compile-a-copy port on the compiled side; the only render is the last built PDF canvas. HTML side can render a candidate theme through the srcdoc/thumbnail path. Check plan D4-D8."
  - "HTML undo: editTheme changes one property per undo step, so nine tokens would be several steps; commitSteps (deckEditorCore.ts:117) can do one entry but is not exposed."
  - "Compiled undo: editing.undo/redo are optional on SourceDeckEditing."
  - "File sizes (lines), limit 400: shell-panels.css 371, shell-stage.css 373, shell.css 366 (near limit; new Style CSS needs its own file). deckEditorCore.ts 192, deck-editor.css 146, themePanel.ts 97, shell/html/shell.ts 202, props.ts 90, left.ts 107, fields.ts 68, propsStyle.ts 82, actions.ts 106, stageTools.ts 90, shell/types.ts 89, header.ts 80, layout.ts 36, insertBar.ts 39, index.ts 11, workspaceUi.ts 126, workspaceEdits.ts 132, workspaceView.ts 180, workspaceState.ts 51, workspace/types.ts 53, stage.ts 251, structurePanel.ts 135, propertiesPanel.ts 170, slideThumbnails.ts 194, deckFrame.ts 239, deckEditorMount.ts 71, pdfDeck.ts 191. Tests: shell.test.ts 343, workspace.test.ts 213, linking.test.ts 369 (near limit)."
