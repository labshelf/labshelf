  - {path: packages/core/src/decks/dom/deckFrame.ts, lines: "15-17", why: "DeckFrame = {frame: HTMLIFrameElement, ready, blocks(), leaves(), setSlide(i), update(html, theme), destroy()}."}
  - {path: packages/core/src/decks/dom/deckFrame.ts, lines: "69-76", why: "buildSlideSrcdoc: the stage is a sandboxed srcdoc iframe of ONE slide with the theme inlined as style[data-deck-theme] from the theme.css text; no CSS-variable injection. A preview means update(html, otherTheme) or another frame or thumbnail built with the candidate theme."}
  - {path: packages/core/src/decks/dom/deckFrame.ts, lines: "190-239", why: "mountDeckFrame: update(html, theme) re-sets srcdoc."}
