    decided:
      - "Units: the minimap port speaks the stage's own page units (pt for compiled, canvas px for HTML); it scales to a box 160 px wide keeping the page aspect, drawn with absolutely positioned divs (no canvas): .dsh-minimap page, .dsh-minimap-box per section/block, .dsh-minimap-view for the viewport. A click or drag on it calls panTo with the page point under the pointer. Hidden when page() is null or the whole page is visible. Posters only; talks get no minimap. It sits at the bottom-right of the stage, above the zoom bar layer, aria-label 'Poster overview'."
