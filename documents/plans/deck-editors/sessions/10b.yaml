    decided:
      - "Geometry in page pt from the top-left (linking rects). A column's left/width is the union of its block rects' x extent; its blocks are its block rects in order. columns() returns null (and the overlay is hidden) when linking has no rect for a column, when the build is running or failed (stale PDF), or with the hand tool: gestures are only offered on a fresh build."
      - "Drag: a press on a block rect starts a drag after 4 px (the select click below 4 px stays a normal pick); the slot is the column nearest the pointer x and the index before the first other block whose centre is below the pointer y; a 4 px blue bar (.dsh-poster-drop) shows there; release calls move (workspacePoster.ts -> moveSourcePosterBlock -> apply, one undo step) unless the slot is the block's own place; Escape or pointercancel cancels with no write; the click after a drag does not re-pick."
      - "Gap: one handle per adjacent column pair, role=separator, aria-orientation vertical, the strip between the two columns' x extents, blue line on hover (.dsh-poster-gap); dragging shows the line following the pointer and on release calls resize(gap, deltaPt) -> resizeSourcePosterGap with delta converted to mm (pt * 25.4/72) -> apply. Nothing is written during the drag. Gap handles only show when readSourcePosterLayout gives ratios (not for null ratios)."
      - "Poster Settings: a Poster button (shellButton, aria-pressed) next to Style in the insert bar, posters only; it shows the panel in place of properties as the Style toggle does (the two are exclusive). Panel: Orientation Portrait/Landscape toggle (switchSourcePosterOrientation; disabled when landscape is null), Outer margin and Section gap fields in cm (blank and disabled when null; bad input restores the shown value), each change one apply. No header height field; a muted note says 'Header height follows the template in LaTeX and Typst.'."
      - "Overflow: after each build, overflowingPosterBlocks(tree, build overflow marks, main path, page count) sets the keys; structure panel block rows get the existing overflow badge with title 'Content overflows this block'; the stage outlines those blocks with .dw-outline is-overflow (add the CSS in shell-stage.css: red dashed). After an orientation switch, the next build that has overflow puts 'Some blocks overflow after the orientation change' in the status bar."
      - "Edits go only through workspacePoster.ts functions that call apply(ws, change); a null change uses apply's existing flash. Window listeners are removed on destroy and on workspace dispose."
      - "Files under 400 lines; do not import shell/html/* from workspace or shell/source (copy the few field helpers needed, or use shell/index.ts exports). Implementer checks: only `node scripts/agents/run.mjs typecheck core` and the tests.command; no pnpm gate, no lint."
