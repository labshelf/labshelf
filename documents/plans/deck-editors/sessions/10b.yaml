    decided:
      - "Check the import paths of SourceDeckChange, SourceDeckNode and SourceDeckFormat with `node scripts/code/facts.mjs def <name>` and fix the seam import paths to where they are really defined; the signatures otherwise stand."
      - "Templates: tikzposter (documentclass tikzposter), beamerposter (usepackage beamerposter), typst (any Typst poster, including peace-of-posters, whose column-boxes stay unsupported). readSourcePosterLayout returns null for a talk, an unknown template or a poster with no column structure. It never throws."
      - "Lengths (sourceDeckPosterLengths.ts): parseSourceLength reads `<number><unit>` with unit mm, cm, in, pt (pt = 1/72 in for both formats; the 0.4% TeX point difference is accepted), returns mm rounded to 2 decimals, null for anything else (em, fr, %, macros). formatSourceLength writes `<n><unit>` with at most 2 decimals and no trailing zeros (e.g. `15mm`, `1.5cm`)."
      - "Ratios. LaTeX: one number per top-level column read from the column header (`\\column{0.5}` in tikzposter, `\\begin{column}{0.45\\textwidth}` in beamerposter, readSourceDeckColumnWidth). Typst: `#grid(columns: (1fr, 2fr), ...)` reads the fr numbers (an integer `columns: 3` reads as three 1s; any non-fr track makes ratios null); `#columns(n, ...)` reads n equal ratios with columnsCall 'columns'. setSourcePosterRatios needs one positive ratio per existing column (else null) and writes: LaTeX fractions normalised to sum 1 with 2 decimals (the last column takes the remainder so the sum is exactly 1.00), replacing only the number so `\\textwidth` and options stay; Typst grid `(r1fr, r2fr)` with ratios normalised to sum = column count, 2 decimals, no trailing zeros, a single column written `(1fr,)`. A Typst `#columns(n, gutter: g)[A #colbreak() B]` is rewritten to `#grid(columns: (..fr), gutter: g,` then one `  [` cell `],` per column holding that column's text without the `#colbreak()` lines, then `)`; other named args of #columns are kept. Text outside the columns call is unchanged."
      - "resizeSourcePosterGap(gap i, delta mm): moves width from column i+1 to column i, where the column area is the page width minus twice the margin minus the gaps (Typst: page width and margin from `#set page`, gap from gutter; LaTeX: paper width from the documentclass or beamerposter size, margin and gap from the tikzposter options or 0 for beamerposter). Each column keeps at least 10% of the column area (clamped, not refused). Writes through setSourcePosterRatios. null when the gap index is out of range or the page width is unknown."
      - "moveSourcePosterBlock moves the block at from.column/from.index (indices into the tree's poster columns and their block children) to before the to.index-th block of to.column (index clamped; past the end means after the column's last block), keeping whole lines and the block's indentation re-based to the target's. Same column uses moveSourceDeckNodeTo. A Typst block (`= Heading` and its body up to the next heading or colbreak) moves as a whole. Moving into an empty column inserts at the start of its body. null when an index is out of range or from equals the resulting position."
      - "Spacing (outer margin and section gap, mm). tikzposter: documentclass key=value options `margin` (outer) and both `colspace` and `blockverticalspace` (gap); read absent keys as tikzposter defaults margin 0 mm, colspace 15 mm, blockverticalspace 15 mm; write `margin=<len>`, `colspace=<len>`, `blockverticalspace=<len>` in mm, other options kept in order, new ones appended. Typst: `margin:` of `#set page(...)` (a single length; a dictionary margin reads null and is not written) and `gutter:` of the poster's #columns or #grid call (absent reads 0 for grid, the Typst default 4% is reported as null for #columns), written in cm when the source used cm else mm. beamerposter: margin and gap read null and setSourcePosterSpacing returns null. Values must be finite and >= 0, else null. The argument splitting must respect parentheses: do not reuse setTypstPage's naive split on ',' for margin."
      - "Header height is not mapped to source: tikzposter, beamerposter and Typst titles have no height parameter LabShelf can rely on. The compiled Poster Settings shows no header-height field (recorded as a deviation from D13 in the log)."
      - "switchSourcePosterOrientation: tikzposter swaps the `portrait`/`landscape` documentclass option (absent reads portrait); beamerposter sets `orientation=landscape|portrait` in its package options (absent reads portrait); Typst swaps `width:` and `height:` of `#set page(...)`, or with `#set page(\"a0\", ...)`/`paper:` toggles `flipped: true` (absent reads false). Column ratios, margins and the content are not changed. landscape in SourcePosterLayout reports the current state."
      - "overflowingPosterBlocks returns the 'c.b' keys (column index dot block index, both 0-based, the same keys linking.ts matchPoster uses) of poster blocks that overflow: a LaTeX `Overfull \\vbox` mark whose file is mainPath (or matches it with sameSourcePath) and whose line falls in a block's range lines; for Typst, when pages > 1 every block of the last column is returned (the page spilled). Empty when nothing overflows."
      - "Contract: documents/contracts/decks.md `## Poster sections` gains `### Compiled posters` listing exactly the shapes above (ratios per template, spacing keys, orientation markers, the #columns to #grid rewrite, no header height)."
      - "New files stay under 400 lines; do not grow sourceDeckEdit.ts beyond exporting its helpers. Implementer checks: only `node scripts/agents/run.mjs typecheck core` and the tests.command; no pnpm gate, no lint."
