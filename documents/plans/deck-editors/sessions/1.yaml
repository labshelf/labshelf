    decided:
      - "Fix in core: mountDeckFrame derives the allowed origins from the URLs resolveAsset returns (http(s) origins only, deduplicated) and adds them to img-src, font-src and media-src; an explicit assetOrigin still works. This covers every host without each passing an origin."
      - deckFrameCsp output with no origin and with an explicit one is unchanged.
      - "Checks: only node scripts/agents/run.mjs typecheck core and tests.command; no commits."
      - "User screenshots: on the VS Code editing canvas the image shows only its alt text ('Grafo') while the strip thumbnail shows it, and equations show raw TeX ('\\pi(x) \\sim \\frac{x}{\\log x}', 'E = mc^2'). Find out why equations are not rendered in the frame (same CSP: KaTeX fonts or styles blocked, or the renderer not run in the editing frame) and fix it in this package; add a test."
      - Move deckFrameCsp and the origin collection into a new packages/core/src/decks/dom/deckFrameCsp.ts, which the hidden test deckFrameCsp.test.ts imports. deckFrame.ts re-exports deckFrameCsp, so existing imports keep working. Adjust only the hidden test's import path if it imports from deckFrame.
      - "Resume (after a first run): the CSP part is done (deckFrameCsp.ts, deckFrame.ts); openPresenter/openPosterPreview need no change because mountDeckFrame derives origins. The equation cause is found: a missing injection in the VS Code webview entry. Add one module-level `const loadMath = () => import(\"@labshelf/core/math\");` as in deckTab.ts and pass it to openDeckWorkspace, openPresenter and openPosterPreview. The frame's math rendering is already covered by deckFrame.test.ts 5.1c; if a vscode webview test checks the options passed to openDeckWorkspace, extend it, otherwise no new test."
