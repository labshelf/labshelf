  - id: "1.3"
    plan: deck-editors
    sha: 658a013d
    goal: "Pages on the LaTeX/Typst stage draw with their images: renders on the stage canvas are serialised so a newer render never resets the canvas mid-draw, and render errors are reported, not swallowed."
    level: behaviour
    depends_on:
      - "1.1"
    runner:
      agent: implementer
      model: opus
    edit:
      - path: packages/core/src/decks/dom/pdfDeck.ts
        lines: 40-110
        why: "render: cancel the previous task and await its settlement before resizing the canvas; render to an offscreen canvas and blit, or keep one in-flight render per canvas, latest request wins"
      - path: packages/core/src/decks/dom/workspace/stage.ts
        lines: 1-158
        why: "draw: do not swallow render errors; show a one-line note on the stage and log to console"
      - path: packages/core/src/decks/dom/workspace/workspaceView.ts
        lines: 1-80
        why: "stale outlines from 1.1: remove the DrawnOutline type and its cast; use StageOutline"
      - path: packages/core/src/decks/dom/workspace/workspace-stage.css
        lines: 40-60
        why: ".dw-outline-stale: the colour of .dw-outline-selected with border-style dashed"
    read:
      - path: packages/core/src/reader/dom/pdfLoader.ts
        lines: 1-120
        why: the reader preview's working pdf.js setup to compare
      - path: packages/vscode/src/writing/sourceEditor/deckWorkspaceHost.ts
        lines: 85-162
        why: deckPdf / deckAssets
    decided:
      - "User screenshot evidence for the overlapping-render cause: on a beamer talk in VS Code the page draws at about 60% of its canvas, with the title box and footer covering only the left part and the rest blank. The strip thumbnails show the same. That is a smaller-scale render painted into a canvas that a concurrent call sized for a larger scale: render() cancels only a task already registered, and the second call resizes the canvas while the first is awaiting getPage. This also explains images missing from the stage, because they decode asynchronously and are wiped when the canvas is resized. Fix it by giving each canvas a generation counter: a render whose generation is stale returns before resizing or drawing."
      - "The root cause is unconfirmed (no real webview). Lead: overlapping layout() calls on one reused canvas; errors swallowed by stage draw. Fix that, and add a dev-only console.warn with the pdf.js error so the user's hand check can confirm or refute it."
      - "Write a jsdom test with a fake pdf.js page whose render is slow: two overlapping render calls produce exactly one completed paint of the latest page and no canvas resize while a task is in flight."
      - "Checks: only node scripts/agents/run.mjs typecheck core and tests.command; no commits."
      - "Also (left by 1.1): widen StageOutline's tone in stage.ts with \"stale\", remove workspaceView.ts's DrawnOutline cast, and add .dw-outline-stale (dashed, selected colour) to workspace-stage.css. No other change to workspaceView.ts."
      - "Resume (after a first run): the pdfDeck.ts generation counter and stage.ts error note are written; keep them. Still to do: the jsdom test file, the stale tone above, typecheck."
    acceptance:
      - id: A2
        check: "overlapping renders never resize the canvas during an in-flight task; the latest request paints; a render error shows a stage note; hand check: a beamer slide with a PNG and a JPEG shows both images on the Visual stage in VS Code and the browser"
    create:
      - packages/core/__tests__/decks/dom/pdfDeck.test.ts
    commands:
