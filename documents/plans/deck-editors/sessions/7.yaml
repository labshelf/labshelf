  - id: "7.3"
    plan: deck-editors
    sha: 51b0fbe37
    depends_on: ["7.2"]
    goal: "A figure dragged from the file tree is inserted (rest of A7): dropping an image on the stage, a grid cell or a structure row of a compiled deck inserts a figure there through the existing figure insert; VS Code accepts Explorer drops (uri lists), the browser's project file tree rows become draggable with a LabShelf project-file payload."
    level: behaviour
    runner: {agent: implementer, model: opus}
    edit:
