      hidden: []
      command: node scripts/agents/run.mjs test core --spec 7.3 --plan deck-editors -- packages/core/__tests__/decks/dom/workspace packages/core/__tests__/decks/dom/shell/source/slideGrid.test.ts packages/core/__tests__/libraryUi/dom/projectFileDrag.test.ts
