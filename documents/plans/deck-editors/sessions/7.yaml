      - {path: packages/vscode/src/writing/sourceEditor/webview/deckWorkspacePorts.ts, lines: "105-120", why: "dropImage via a deckDropImage request"}
      - {path: packages/vscode/src/writing/sourceEditor/deckWorkspaceHost.ts, lines: "180-200", why: "deckDropImage handler next to deckPickImage"}
    read:
      - {path: documents/plans/deck-editors/research/figure-drop.brief.yaml, lines: "1-120", why: "scout notes and risks"}
      - {path: packages/core/src/decks/sourceDeckInsert.ts, lines: "34-58", why: "insertSourceElement figure forms"}
      - {path: packages/core/src/libraryUi/dom/paperDrag.ts, lines: "1-40", why: "custom MIME payload precedent"}
      - {path: packages/core/src/libraryUi/dom/sidebar/sidebarSpaces.ts, lines: "11-24", why: "dragover/drop wiring precedent"}
      - {path: packages/core/src/decks/dom/workspace/linking.ts, lines: "160-200", why: "pathAt for the node under the drop point"}
      - {path: packages/core/__tests__/decks/dom/workspace/workspaceHarness.ts, lines: "1-120", why: "rig"}
    decided:
      - "Port: DeckWorkspacePorts.dropImage?(drop: {uris: string[]; paths: string[]}): Promise<string | undefined> returns the image path relative to the deck file's folder (same contract as pickImage), or undefined to refuse. uris come from 'application/vnd.code.uri-list' or 'text/uri-list' (lines, '#' comments skipped); paths from PROJECT_FILE_DRAG_MIME payloads of the deck's own project. Without the port, drops are not accepted (no preventDefault)."
      - "Core accepts a drag (dragover preventDefault, dropEffect 'copy', class is-drop-target on the target) only when dataTransfer.types holds one of those MIME types; the grid's internal reorder drag keeps working unchanged."
      - "Target: a grid cell or a structure slide thumb -> that slide; a structure block row -> that node (container: end of its body; leaf: after it; column/columns/code nodes -> their slide); the stage -> the node under the drop point via the same hit test as a click, else the current slide, else for a poster the last block. The insert goes through insertFigure(ws, target, src), i.e. insertSourceElement(format, textOf(ws, node.file), target, 'figure', src) and one apply (one undo step for the main file; an included file is written as today)."
      - "Hosts refuse (undefined): a file that is not an image (png, jpg, jpeg, svg, gif, webp, pdf, eps), pdf/eps for a Typst deck, a file outside the deck's project. The browser payload is {projectId, path} with path project-relative; the browser resolves posixPathOps.relative(folder || '.', path). VS Code resolves the uri's fsPath relative to the deck document's folder with '/' joins, like deckPickImage. VS Code needs Shift held to drop onto a webview: that is VS Code's rule, noted in the hand checks, not worked around. The LabShelf VS Code tree view gets no drag controller in this session."
      - "Sidebar: rows of project files get draggable=true and a dragstart that sets PROJECT_FILE_DRAG_MIME to JSON {projectId, path} (read the row key format in folderModel.ts and the browser treeClick to get both); other rows are unchanged."
      - "Files at most 400 lines; no new dependency."
      - "Testing policy: write the failing tests first (packages/core/__tests__/decks/dom/workspace/workspaceDrop.test.ts, a file-drop case in slideGrid.test.ts, packages/core/__tests__/libraryUi/dom/projectFileDrag.test.ts, browser and VS Code port tests next to their existing ones), then implement. Run only `node scripts/agents/run.mjs typecheck core|vscode|browser` and the commands below; never pnpm gate or any lint."
    acceptance:
      - {id: "7.3a", check: "dropping a payload on a grid cell of a LaTeX talk inserts \\includegraphics with the path the port returned into that slide, as one apply; a refused drop changes nothing"}
      - {id: "7.3b", check: "dropping on a structure block row inserts after a leaf and at the end of a container; dropping on the stage targets the node under the point or the current slide"}
      - {id: "7.3c", check: "a plain text drag or a drag without the port is not accepted; grid reorder still works"}
      - {id: "7.3d", check: "the browser port returns a path relative to the deck folder and refuses pdf for Typst and another project's file; the VS Code handler resolves a file:// uri inside the project and refuses one outside"}
      - {id: A7, check: "A figure dragged from the file tree is inserted"}
