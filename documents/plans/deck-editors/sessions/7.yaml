    seams:
      - path: packages/core/src/decks/sourceDeckOverflow.ts
        signature: "export interface DeckOverflowMark { file: string; line: number }"
      - path: packages/core/src/decks/sourceDeckOverflow.ts
        signature: "export function overfullSlides(tree: readonly SourceDeckNode[], marks: readonly DeckOverflowMark[], mainPath: string): Set<number>"
      - path: packages/core/src/decks/sourceDeckOverflow.ts
        signature: "export function spilledTypstSlides(tree: readonly SourceDeckNode[], textOf: (file: string | undefined) => string, pageTexts: readonly string[]): Set<number>"
    decided:
      - "log.ts: a problem read from an `Overfull \\vbox` line gets kind 'overfullPage' (severity and message unchanged); \\hbox keeps 'overfull'. Every exhaustive use of BuildProblemKind is updated (typecheck shows them)."
      - "DeckOverflowMark.file is the project-relative '/' path of the source file the warning came from; line is 1-based. Hosts send only overfullPage problems that have a line (VS Code: path relative to the project folder; browser: the helper's file resolved against the deck file's folder, '/' separated). DeckBuildState.overflow is optional; absent = none."
      - "overfullSlides: returns the indexes i in tree with tree[i].kind === 'slide' such that some mark has sameSourcePath(mark.file, tree[i].file ?? mainPath, '/') and tree[i].line <= mark.line <= tree[i].endLine. Marks matching no slide are ignored."
      - "spilledTypstSlides: slides = indexes of kind 'slide' in tree order; if pageTexts.length <= slides.length -> empty set. Otherwise each slide gets a first page, walking forward from the previous slide's first page + 1 (first slide from page 0): a slide with a title takes the first such page whose text, whitespace-collapsed and lower-cased, contains its title collapsed the same way; an untitled slide takes previous + 1. If any titled slide is not found -> empty set (unknown, no badge). A slide spills when (next slide's first page, or pageTexts.length for the last) minus its first page is more than 1, unless its source text (textOf(node.file) sliced by node.range) contains an overlay call: #pause, #uncover, #only, #meanwhile, #alternatives, #one-by-one or `pause`."
      - "Workspace: for a talk, after a succeeded build's PDF loads, ws.overflow = LaTeX ? overfullSlides(tree, build.overflow ?? [], ports.path) : spilledTypstSlides(tree, textOf, page texts from pdf.textRuns joined with spaces). It is kept on a failed build and replaced on the next succeeded one. Posters: no badges (the print check is session 10)."
      - "Badge: a <span class='dsh-overflow-badge' title='Content overflows this slide'>Overflow</span> in the grid cell caption and in the structure panel slide thumb, pill shape with the --ls-warning colour; the grid re-renders its cells when overflow changes."
      - "Contract: documents/contracts/decks.md gets two sentences under the compiled-deck section on what an overflow badge means per format (link #style unchanged). Files at most 400 lines; no new dependency."
      - "Testing policy: hidden tests under documents/plans/deck-editors/tests/7.2/ are read-only to you. Also add jsdom tests for the badges (slideGrid.test.ts, a workspace test). Run only `node scripts/agents/run.mjs typecheck core|vscode|browser` and the commands below; never pnpm gate or any lint."
    acceptance:
      - {id: "7.2a", check: "parseTexLog of a log with `Overfull \\vbox (12.3pt too high) detected at line 42` from ./talk.tex gives a problem with kind 'overfullPage' and line 42; an Overfull \\hbox keeps kind 'overfull'"}
      - {id: "7.2b", check: "overfullSlides marks the frame whose lines hold the mark, in the main file and in an included file (by file), ignores marks outside every frame and marks of another file"}
      - {id: "7.2c", check: "spilledTypstSlides: 3 titled slides over 4 pages where slide 2's title is on page 1 and slide 3's on page 3 -> {slide 2}; pages == slides -> empty; a missing title -> empty; a spilling slide with #pause is not marked"}
      - {id: "7.2d", check: "the slide grid and the structure panel show the Overflow badge on the marked slides after a build state with overflow, and none without"}
      - {id: A7, check: "Overflow badges appear per D10 for LaTeX and Typst talks"}
