        - documents/plans/deck-editors/tests/7.2/packages/core/__tests__/latex/log.test.ts
      command: node scripts/agents/run.mjs test core --spec 7.2 --plan deck-editors -- packages/core/__tests__/decks/sourceDeckOverflow.test.ts packages/core/__tests__/latex/log.test.ts
