    level: contract
    runner: {agent: implementer, model: opus}
    edit:
      - {path: packages/core/src/latex/log.ts, lines: "160-260", why: "BuildProblemKind gains 'overfullPage', set on Overfull \\vbox problems"}
      - {path: packages/core/src/decks/sourceDeckOverflow.ts, lines: "1-140", why: "new: DeckOverflowMark, overfullSlides, spilledTypstSlides"}
