    goal: "Split follows the selection both ways by default (part of A7): a stage click or a structure-panel pick selects the node's source range in the Split editor (an included-file node opens its file at its line without taking focus), moving the cursor selects the node under it, with no echo loop; the VS Code host also reports the cursor of an opened included file so it selects too."
