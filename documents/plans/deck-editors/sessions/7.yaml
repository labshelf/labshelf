    decided:
      - "Sync stays on by default (ws.sync = true, the 'Sync selection' checkbox checked); it is not persisted. Every automatic follow below happens only in Split and only while ws.sync is on; the explicit Show code action and the 'Reveal in preview' button work regardless."
      - "Stage/panel -> source: picking a node on the stage (pick) or in the structure panel (select fromPanel) in Split calls editing.select(node.range[0], node.range[1]) for a main-file node (was reveal(range[0]), and the panel ignored ws.sync), and files.open(node.file, node.line) for an included-file node when the port has open (none -> nothing)."
      - "Echo guard: right after the workspace calls editing.select or editing.reveal it stores editing.cursor() in ws.echo; the next cursorMoved whose offset equals ws.echo is ignored and clears ws.echo; any other offset clears ws.echo and is handled. So clicking a block never replaces the selection with its first child. A newer stage click cancels a pending debounced cursor (the cursor timer is cleared when pick starts)."
      - "Source -> stage: cursorMoved keeps its rule for the main file (innermost node at the offset among main-file nodes, unchanged path is a no-op). New optional port DeckSourceFiles.onCursor?(listener: (path: string, line: number) => void): () => void (project-relative path, 1-based line). When it fires in Split with sync on, the workspace selects findSourceDeckPathAtLine(tree, line, node => node.file === path); no match -> nothing; it never calls open or reveal back. Unsubscribed on dispose."
      - "VS Code: the openFile handler opens the file with viewColumn Beside and preserveFocus true when the request carries {preserveFocus: true} (the follow path sends it; Show code keeps today's focus behaviour). The host posts {type: 'deckCursor', path, line} on vscode.window.onDidChangeTextEditorSelection for a document inside the deck's project that is not the deck's own document (path relative to the project folder, '/' separated); the webview port feeds it to onCursor listeners. Browser: no files.open and no onCursor, unchanged."
      - "Files at most 400 lines; no new dependency."
      - "Testing policy: write the failing tests first (packages/core/__tests__/decks/dom/workspace/workspaceSync.test.ts in jsdom, extending workspaceHarness.ts; a VS Code test next to the existing sourceEditor tests for the deckCursor message and preserveFocus), then implement. Run only `node scripts/agents/run.mjs typecheck core`, `node scripts/agents/run.mjs typecheck vscode` and the commands below; never pnpm gate or any lint."
    acceptance:
      - {id: "7.1a", check: "in Split, a stage pick of a main-file frame calls editing.select with that frame's range; the echoed cursor event does not change the selection to a child"}
      - {id: "7.1b", check: "in Split, moving the cursor into another frame selects that frame on the stage and in the panel after the debounce; with Sync selection unchecked nothing follows either way; in Visual nothing follows"}
      - {id: "7.1c", check: "in Split, picking an included-file slide calls files.open(file, line); an onCursor event for that file and a line inside a slide selects that slide"}
      - {id: "7.1d", check: "VS Code host posts deckCursor for a selection in an included file and opens the follow request with preserveFocus"}
      - {id: A7, check: "Split follows the selection both ways by default"}
    tests:
      hidden: []
      command: node scripts/agents/run.mjs test core --spec 7.1 --plan deck-editors -- packages/core/__tests__/decks/dom/workspace
    commands:
