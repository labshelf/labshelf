      - {path: packages/core/src/decks/deckGroupGesture.ts, signature: "export interface DeckGroupGesture { kind: \"move\" | \"resize\"; handle?: ResizeHandle; members: readonly { id: string; rect: DeckRect }[]; start: DeckRect; origin: { x: number; y: number } }"}
      - {path: packages/core/src/decks/deckGroupGesture.ts, signature: "export function groupGesture(kind: \"move\" | \"resize\", members: readonly { id: string; rect: DeckRect }[], origin: { x: number; y: number }, handle?: ResizeHandle): DeckGroupGesture"}
