    decided:
      - "Selection: pressing a block that belongs to a group selects the whole group (Shift toggles the whole group). The Elements list and existing selection API are unchanged."
      - "Drag: pressing a block that is already selected (no Shift) drags all selected blocks; pressing an unselected one selects it (plus its group) and drags that selection. Snap others = the slide's blocks not in the selection; snap grid = deckGridFromTheme(theme, canvas); Alt (event.altKey) disables snapping as today. Live feedback transforms every member's frame element and overlay box. Release commits groupEdits as one undo step labelled 'Move blocks'/'Resize blocks' ('Move block'/'Resize block' for one block, as today) and keeps the selection. Spacing guides (kind 'spacing') render with class deck-editor-guide-spacing."
      - "Resize: with one block selected, its 8 handles as today; with several, one union box with 8 handles (members outlined, no handles of their own); dragging a union handle resizes all proportionally."
      - "Marquee: with the select tool, a press on the stage background (not on a block box, not with the hand tool or Space held) starts a rectangle (div.deck-editor-marquee in the overlay); on release the selection becomes marqueeBlocks of the current slide's blocks (Shift: added to the current selection). A press and release without movement (under 3 screen px) clears the selection as today."
      - "Clipboard: one in-memory DeckClip per page (module scope in arrange.ts), shared by every editor in that page; nothing is written to the system clipboard. Mod+C copies the selected blocks (copyDeckBlocks with the theme). Mod+V pastes into the current slide with offset 24 when the slide holds a block with the same rect as a clipped block, else 0, as one undo step 'Paste', and selects the pasted ids. Mod+D duplicates the selection (copy without touching the clipboard, paste with offset 24, label 'Duplicate'). Read-only, editing text, or dragging: none of these act (the idle() wrapper)."
      - "Group: Mod+G with 2 or more selected blocks writes a group edit with a fresh id (freeDeckBlockId(model, 'group')), label 'Group'; Shift+Mod+G ungroups every group among the selected blocks as one step, label 'Ungroup'. keys.ts maps Mod+c, Mod+v, Mod+g (no Shift), Mod+Shift+g; an input, CodeMirror or contenteditable target is ignored as today."
      - "Properties panel with several blocks selected: title 'N blocks', section 'Align' with the six side toggles (alignDeckBlocks of the selection, groups as units), section 'Distribute' with 'Horizontally' and 'Vertically' (disabled with fewer than 3 units), section 'Group' with 'Group' (Mod+G) and 'Ungroup' (enabled when a selected block has a group), and Delete. One block: unchanged ('Align on the slide' now via alignDeckBlocks with one unit; a grouped single block cannot occur since groups select whole)."
      - "The editor parses with parseDeck(html, {theme}) so cell blocks have rects and can be selected, dragged and resized; dragging a cell block off the grid writes px (move/resize clear its classes, 8.1)."
      - "UI text is English. New DOM code gets jsdom tests in new files (openDeckEditor.test.ts is at its 400-line limit): packages/core/__tests__/decks/dom/deckEditorMulti.test.ts (multi drag, union resize, marquee, groups, grid place on release, Alt) and packages/core/__tests__/decks/dom/shell/html/arrange.test.ts (Mod+C/V/D, Mod+G, Shift+Mod+G, align/distribute buttons, one undo step each). Files at most 400 lines; no new dependency."
      - "Testing policy: write the failing tests first, then implement. Run only `node scripts/agents/run.mjs typecheck core` and the commands below; never pnpm gate or any lint."
