      - {path: packages/core/src/decks/deckAlign.ts, signature: "export type DeckAlignSide = \"left\" | \"center\" | \"right\" | \"top\" | \"middle\" | \"bottom\""}
      - {path: packages/core/src/decks/deckAlign.ts, signature: "export interface DeckItem { id: string; rect: DeckRect; group?: string }"}
      - {path: packages/core/src/decks/deckAlign.ts, signature: "export function alignDeckBlocks(items: readonly DeckItem[], side: DeckAlignSide, canvas: { width: number; height: number }): DeckEdit[]"}
      - {path: packages/core/src/decks/deckAlign.ts, signature: "export function distributeDeckBlocks(items: readonly DeckItem[], axis: \"x\" | \"y\"): DeckEdit[]"}
    decided:
      - "snapDeckRect keeps every current behaviour when grid is absent (existing deckSnap tests stay green) and returns cell: null then. With grid: the column starts and ends (x) and row starts and ends (y) of deckGridLines are extra targets with the same 6-screen-px threshold; a grid line target has no 'other' and draws a full-extent guide like the slide targets. After snapping, cell = deckRectCell(result rect, grid, canvas); disabled (Alt) -> no snapping, cell null."
      - "Equal spacing (move only, per axis, only when no edge/centre/grid target on that axis is closer): among others that overlap the moving rect on the other axis (positive overlap), take the nearest one entirely before (prev) and entirely after (next). Between case: if prev and next exist, the position that makes the two gaps equal is a target. Chain case: if prev has its own nearest neighbour before it (same band rule relative to prev) with gap g, the position at prev.end + g is a target; mirrored for next. The closest target within the threshold wins; ties go to the between case. A spacing snap adds one guide per equal gap: {axis, kind: 'spacing', from: gap start, to: gap end, at: the middle of the overlap band on the other axis}. Rounding: 2 decimals; no 8 px rounding on an axis that snapped."
      - "Group gesture: start = union of member rects; groupRect snaps the union exactly as gestureRect snaps one rect (move: delta from origin; resize: the handle's edges, min size 8) with options.snap passed through; others must not include members (the caller's job). groupEdits: one member -> a place edit when result.cell is set, else move (move gesture) or resize (resize gesture) of that member to result.rect; several members -> never place: move applies the union's delta to each member (move edit), resize maps each member proportionally from the start union to the result union (resize edit, 2 decimals). No change -> []."
      - "marqueeBlocks: ids of blocks with a rect whose area overlaps the marquee (positive overlap on both axes, touching edges do not count), in input order, then expanded so a hit group member brings every block of its group (expandGroups). expandGroups returns ids plus every block sharing a group with one of them, in blocks' order, no duplicates."
      - "Align: units = each group (all its items, union rect) and each ungrouped item. One unit -> align it to the canvas (left 0, center (W-w)/2, right W-w, top 0, middle (H-h)/2, bottom H-h); several units -> align each unit to the union of all units on that side. A unit moves as a whole (every item of a group gets the same delta). Edits are move edits with values rounded to 2 decimals, only for items that change. Distribute: needs 3 or more units, else []; sort units by start on the axis (left or top); first and last stay; the others are placed so the gaps between consecutive units are equal (total free space = span of first start to last end minus the sum of sizes, divided by units-1); move edits as above."
      - "Files at most 400 lines; no new dependency. Testing policy: run only `node scripts/agents/run.mjs typecheck core` and the tests.command; never pnpm gate or any lint."
