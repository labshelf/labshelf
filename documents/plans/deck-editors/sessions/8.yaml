      - {id: "8.2e", check: "align to the canvas for one unit and to the union for several, groups as units; distribute evens the gaps of 3 or more units"}
      - {id: A8, check: "multi-block drag and resize, marquee, align and distribute, equal-spacing guides and grid snapping (geometry part)"}
