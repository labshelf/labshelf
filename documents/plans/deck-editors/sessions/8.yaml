    decided:
      - "Layout grid: DeckGrid is in slide px. defaultDeckGrid(canvas) = {columns: 12, rows: 6, margin: Math.round(canvas.width / 24), gutter: Math.round(canvas.width / 64)}. deckGridFromTheme reads the custom properties --deck-grid-columns, --deck-grid-rows (integers 1..24), --deck-grid-margin and --deck-grid-gutter (a non-negative number followed by px) from the first declaration of each anywhere in the theme text (comments ignored); a missing or invalid one takes its default. One margin is used on all four sides."
      - "Geometry: column width cw = (W - 2*margin - (columns-1)*gutter)/columns, row height rh = (H - 2*margin - (rows-1)*gutter)/rows, with W, H the canvas. deckCellRect: left = margin + (col-1)*(cw+gutter), width = span*cw + (span-1)*gutter, top and height the same with row/rows/rh; every value rounded to 2 decimals. Cells are 1-based; col+span-1 <= columns and row+rows-1 <= rows. deckRectCell returns the cell whose rect matches the given rect within 0.5 px on all four edges, else null. deckGridLines returns the sorted, de-duplicated column starts and ends (x) and row starts and ends (y), 2 decimals."
      - "Markup: a grid-placed block carries the four classes col-<c> row-<r> span-<s> rows-<n> (in any order, among any other classes) and no left, top, width or height in its style (other declarations kept; a style attribute left empty is removed). A block with all four valid classes and none of the four px properties has DeckBlock.cell set and rect = deckCellRect(cell, grid, canvas) with grid = deckGridFromTheme(options.theme ?? '', canvas) of the model's size. When px geometry is present it wins and cell is unset. Partial or out-of-range cell classes: cell unset, rect from px as today (missing px -> rect null, DECK011 as today)."
      - "parseDeck(html: string, options?: { theme?: string }): existing calls keep working. DeckBlock gains cell?: DeckCell, group?: string (the data-group value) and classRange: DeckRange | null (the class attribute value range, null when absent). Nothing else in the parse result changes."
      - "Base CSS: deckBaseCss(size) appends `:where(:root){--deck-grid-columns:12;--deck-grid-rows:6;--deck-grid-margin:<m>px;--deck-grid-gutter:<g>px}` with the defaults of that size's canvas (theme.css overrides it whatever the order) and deckGridCss(): for N in 1..24 the rules [data-block].col-N{left:...}, .span-N{width:...}, .row-N{top:...}, .rows-N{height:...} as calc() over var(--deck-grid-columns|rows|margin|gutter) and 100%, matching deckCellRect."
      - "Edits: new kind {kind: 'place', block, cell} removes the block's px left/top/width/height declarations and any old col-/row-/span-/rows- classes and writes the four cell classes (class attribute added after data-block when absent); an invalid cell for the deck's grid is an error result. move and resize on a block that has a cell drop its four cell classes (and an emptied class attribute) and write px as today. {kind: 'group', blocks: string[], group: string} sets data-group=\"<group>\" on each block (replacing an old value; at least 2 blocks on the same slide, group id matches the block id pattern and is not a block id, else error). {kind: 'ungroup', group} removes data-group from every block carrying that value (none -> error). Groups are flat: no wrapper element, no nesting; a block is in at most one group."
      - "Clipboard (pure): copyDeckBlocks returns the exact source text of each listed block in document order (unknown ids skipped; none -> null); a cell block is copied as is. pasteDeckBlocks inserts the clip's blocks at the end of the slide's content (before its notes) as one result: every data-block id is renamed with freeDeckBlockId using the old id minus a trailing -<n> as prefix (unique against the deck and earlier pasted ids), every data-group value is replaced by a fresh group id (same rule, prefix 'group') shared by the blocks that shared it; offset > 0 shifts px blocks' left and top by offset, and turns a cell block into px geometry at its cell rect plus offset (cell classes dropped); offset 0 keeps geometry. ids lists the new block ids in order. A bad slide index or an invalid block returns an error result and ids []."
      - "Validation: a block with a cell and no px geometry is not DECK011; its cell rect is checked against the canvas like a px rect. validateDeck passes its theme option to parseDeck."
      - "Contract: documents/contracts/decks.md Vocabulary: blocks have either the px inline geometry or the four cell classes; the four --deck-grid-* variables, their defaults and the cell geometry formula; data-group flat groups. ### HTML decks lists grid snapping per D3 (a block that ends on grid lines is written as cell classes, off the grid as px, Alt disables snapping), groups, copy/paste/duplicate, align/distribute. Vocabulary version stays 1 (old decks stay valid)."
      - "Files at most 400 lines; no new dependency. Testing policy: run only `node scripts/agents/run.mjs typecheck core` and the tests.command; never pnpm gate or any lint."
    acceptance:
