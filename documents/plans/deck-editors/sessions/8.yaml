    seams:
      - {path: packages/core/src/decks/deckSnap.ts, signature: "export interface SnapGuide { axis: \"x\" | \"y\"; at: number; from: number; to: number; kind?: \"spacing\" }"}
      - {path: packages/core/src/decks/deckSnap.ts, signature: "export interface DeckSnapInput { rect: DeckRect; moving: \"move\" | ResizeHandle; others: readonly DeckRect[]; canvas: { width: number; height: number }; scale: number; disabled?: boolean; grid?: DeckGrid }"}
