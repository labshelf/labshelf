    seams:
      - {path: packages/core/src/decks/dom/shell/poster/stage.ts, signature: "export function createPosterStage(ctx: import(\"../html/types.js\").ShellContext): { element: HTMLElement; render(): void; destroy(): void }"}
    decided:
      - "The poster stage is active only when ctx.view.model.kind is poster and readPosterLayout(view.html, view.theme) is not null; otherwise its element is empty and it does nothing. It renders from readPosterLayout on every shell render (rects in slide px times view.scale, placed like the floating bar: stage offset in .dsh-centre)."
      - "Section drag: a capture-phase pointerdown listener on the editor viewport takes presses (tool select, not read-only, button 0) on an overlay box `[data-block-box]` whose block id is a header or section of the layout, and on its handles. It stops propagation so deckEditorInput never starts a free drag, resize or marquee, selects the block through ctx.editor.selectBlocks, and after 4 px of movement adds class is-dragging to the editor root and shows `.dsh-poster-drop`, a horizontal blue bar at the slot under the pointer: the column whose x range holds the pointer, before the first section whose vertical centre is below the pointer. Release commits movePosterSection through controller.replace labelled 'Move section'; release without movement is a plain select; Escape or pointercancel cancels. The header band is selectable but not draggable."
      - "Gap handles: one `.dsh-poster-gap` element per PosterGap (data-gap-kind, data-gap-index, data-gap-column, aria-label 'Resize columns' or 'Resize sections'), cursor col-resize/row-resize, a 2 px --ls-focus line on hover and during a drag. Dragging (setPointerCapture on the handle) moves the line live; release commits resizePosterGap with the delta in slide px (pointer delta / view.scale) labelled 'Resize columns' or 'Resize sections'. A zero delta commits nothing."
      - "Section and header overlay boxes get class `dsh-poster-locked` on each render; poster.css hides their resize handles. Free blocks keep today's behaviour exactly."
      - "controller.replace(html, theme, label): one history entry and one onChange through commitSteps(ed, [() => ({ok: true, html})], label, undefined, theme); a failed PosterEditResult shows its error as the editor notice (as a failing step does) and changes nothing."
      - "CSS classes use the .dsh-poster- prefix in poster.css; colours only from --ls-* tokens."
