    decided:
      - "Markup (contract `## Poster sections`): a sectioned poster is a poster whose slide has at least one block with `data-poster=\"section\"`. The header band is one block `data-poster=\"header\"`. A section block carries `data-column=\"N\"` (0-based integer) and optional `data-weight=\"W\"` (positive number, at most 2 decimals, default 1). Sections and the header stay ordinary `data-block` direct children of the slide with px geometry in `style`, so DECK009/DECK011, parseDeck, the overlay and the export are unchanged. Order inside a column is document order. Blocks without `data-poster` stay free blocks (logos, QR codes) and reflow never touches them. A poster without sections behaves exactly as today. Invalid or missing attribute values read as their defaults (column 0, weight 1); a column beyond the last reads as the last column. No new DECK code."
      - "Content of a section is plain HTML inside the block: an optional `<h2>` header, `<p>`/lists, and figures as `<figure><img src alt><figcaption>…</figcaption></figure>` so the caption is attached by being in the same element. The header band holds `<h1>` title and `<p>` authors. Text inside stays editable through the existing text leaves."
      - "Poster Settings are theme.css custom properties in the first :root rule, written with setThemeProperty: `--poster-columns` (space-separated positive ratios, 1 to 6 numbers, default `1 1 1`), `--poster-section-margin`, `--poster-content-margin`, `--poster-header-height` (px lengths, at most 2 decimals), `--poster-type-scale` (0.5..2, default 1). Defaults when absent or invalid: section margin round2(min(W,H)/40), content margin round2(min(W,H)/80), header height round2(H*0.12), with W×H the canvas px (deckCanvasPx). readPosterSettings never throws."
      - "Reflow: m = sectionMargin. Header (when present) at left m, top m, width W-2m, height headerHeight. Body top = header ? 2m + headerHeight : m; body height Hb = H - bodyTop - m. Column widths: (W - 2m - (n-1)m) * r_i / sum(r), x from m with m between columns. Sections in a column: heights (Hb - (k-1)m) * w_j / sum(w), y from bodyTop with m between. All values round2 (2 decimals). Columns with no section leave an empty slot. Reflow writes each header/section block's left/top/width/height px through the existing resize edit semantics (other style declarations kept, cell classes removed), and nothing else. readPosterLayout returns the same rects without writing, plus gaps: one `column` gap per pair of adjacent columns (index i between column i and i+1, rect the m-wide strip over the body height) and one `section` gap per pair of adjacent sections in a column (index j between section j and j+1, rect the m-tall strip over the column width). readPosterLayout returns null for a talk or an unsectioned poster."
      - "Every PosterEditResult edit reflows before returning and returns the unchanged theme when it did not change it. movePosterSection sets data-column and moves the block's whole text (with its line when it stands alone) to before the index-th section of the target column (index clamped; past the end means after the column's last section, or after the last sectioned block); a section that is the only one of its column may leave the column empty. resizePosterGap(column, i, delta px): moves delta of width from column i+1 to column i, each column keeping at least 10% of the column area, rewrites --poster-columns as ratios rounded to 2 decimals that sum to the column count. resizePosterGap(section, j in column c, delta): moves weight between sections j and j+1 so section j grows by delta px, each keeping at least 10% of the column's section height, data-weight rounded to 2 decimals. Unknown ids, roles or gaps return ok false with an English error."
      - "setPosterSettings: size goes through the setSize semantics without scaling (scale false) and must pass isDeckSizeAllowed; margins must be finite and >= 0, headerHeight finite and > 0; columns 1..6 positive ratios. switchPosterOrientation swaps width and height of the size (a preset name maps to its other orientation preset, e.g. a0-portrait <-> a0-landscape; a custom size swaps its sides) and reflows with the same settings except header height scaled by newH/oldH. Column count does not change."
      - "addPosterSection(column, title='New section') appends `<div data-block id=…data-poster=\"section\" data-column=…><h2>title</h2><p>Text</p></div>` after the column's last section (or after the last sectioned block, or at the end of the slide), id from freeDeckBlockId with base `section`; it never adds a header band. addPosterFigure appends `<figure><img src=\"SRC\" alt=\"\"><figcaption>CAPTION</figcaption></figure>` (caption default 'Figure caption', both attribute and text escaped) at the end of the section's content. Neither changes the theme except by reflow (it never does)."
      - "Type scale: posterTypeSizes returns px (pt * 96/72, round2) from floor = smallTextThresholdPt(size) pt: caption floor, body 1.33 floor, heading 2 floor, authors 1.75 floor, title 3.5 floor, each times typeScale. Base CSS (deckLayoutCss.ts) gains rules for `[data-poster]` (box-sizing border-box, padding var(--poster-content-margin, 24px), overflow hidden, display flex, flex-direction column, gap var(--poster-content-margin, 24px)), `[data-poster] figure` (margin 0, display flex, flex-direction column, min-height 0, flex 1 1 auto), its `img` (max-width 100%, min-height 0, flex 1 1 auto, object-fit contain) and font-size rules for `[data-poster] h1, h2, p, li, figcaption` from `--poster-font-title|heading|body|caption` and `[data-poster=\"header\"] p` from `--poster-font-authors`, each with a fallback. setPosterSettings and reflowPoster write those five `--poster-font-*` variables from posterTypeSizes so pasted text is print-sized. A block's own style still wins (the inherit rule in base CSS stays)."
      - "Sizes: poster sides 100..2438.4 mm (96 in); the DECK003 message, the size picker message and the contract Sizes line say so. scaffoldDeck for a poster writes a header band (title h1 = the name, authors p) and three sections (Introduction, Methods, Results) in columns 0,1,2, reflowed, and the theme gets the Poster Settings variables; talks unchanged."
      - "deckEdit.ts is at 400 lines: do not grow it. posterSectionEdits.ts may call applyDeckEdit for the resize/setSize steps. Each new file stays under 400 lines."
      - "Implementer checks: only `node scripts/agents/run.mjs typecheck core` and the tests.command; no pnpm gate, no lint."
    acceptance:
