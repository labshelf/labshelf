      - "Form, inside the first top-level :root rule (the one readThemeProperties reads), at its end: a line `  /* labshelf:style */`, one `  --name: value;` line per token in DECK_STYLE_TOKENS order (fonts written as-is, e.g. `--deck-font: Inter;`), a line `  /* labshelf:style end */`. Being last in :root, its values win over earlier declarations of the same names. No :root rule -> `:root {` + block + `}` appended at the end of the file (a newline before it when the file does not end in one). Existing block -> replaced in place. Every byte outside the block stays."
