        signature: "export function readSourceDeckStyle(format: SourceDeckFormat, text: string): SourceDeckStyleRead | null"
      - path: packages/core/src/decks/deckStyleSource.ts
        signature: "export function setSourceDeckStyle(format: SourceDeckFormat, text: string, style: DeckStyle): SourceDeckChange | null"
    decided:
      - "Also exported from deckStyleTokens.ts: DECK_STYLE_TOKENS: readonly DeckStyleToken[] (the order of the type) and DEFAULT_DECK_STYLE: DeckStyle. validateDeckStyle returns one problem string per bad token naming it, [] when valid. readSourceDeckStyle returns null when the source is no deck of a known template; setSourceDeckStyle returns null for an unknown template or an invalid style."
      - "Tokens: colours are `#rrggbb` lower case (input `#rgb` and upper case are normalised on write and on read); fonts are one family name each, matching /^[A-Za-z0-9 ._+-]+$/ after trim, non-empty; scale is a factor 0.5 to 3 (the base text size is multiplied by it). DEFAULT_DECK_STYLE: primary #1f5673, accent #c75b12, background #ffffff, text #1a1a1a, muted #6b7280, headingFont \"Inter\", bodyFont \"Inter\", monoFont \"JetBrains Mono\", scale 1."
      - "Contrast: WCAG 2 relative luminance, ratio (L1+0.05)/(L2+0.05) rounded to 2 decimals; pairs against background: text minimum 4.5, muted 3, primary 3, accent 3, returned in that order. One luminance implementation in core: export it from ui/tokens/themes.ts (next to isLightColour, which then uses it) or put it in deckStyleTokens.ts and nowhere else."
      - "Diff: diffDeckStyleBlock(before, after) is compareLines of the two block texts (writing/history/index.js); an empty `before` (no block yet) gives only added lines. If importing writing/history from decks/ breaks a module rule (`node scripts/lint/modules.mjs` check, read only, do not update baselines), move compareLines' pure LCS into a neutral module both import instead of copying it."
      - "Template: LaTeX class beamer with a beamerposter \\usepackage -> beamerposter; class beamer -> beamer; class tikzposter -> tikzposter; other LaTeX -> null. Typst: an @preview import of touying -> touying, of peace-of-posters -> peace-of-posters; else, when detectSourceDeckKind is talk or poster -> typst; else null. Comments are ignored for detection (removeComments for LaTeX) but the block is located in the raw text."
      - "Markers: LaTeX `% labshelf:style` and `% labshelf:style end`, Typst `// labshelf:style` and `// labshelf:style end`, each alone on its line (leading spaces allowed). The block is from the start of the opening marker line to the end of the closing marker line (newline included). An opening marker without a closing one is no block: the writer then returns null rather than guess."
      - "Placement of a new block (existing block: replaced in place). LaTeX: on the line after the last preamble line before \\begin{document} that starts (after spaces) with \\documentclass, \\usepackage, \\RequirePackage or \\use<letters> (\\usetheme, \\usecolortheme, \\usecolorstyle, \\usefonttheme, ...). Typst plain: after the last top-level preamble statement, where the preamble is the leading run of blank lines, comments and statements starting with #import, #set, #show or #let, a statement running until its (), [] and {} balance (strings and comments skipped); touying and peace-of-posters: the same, but a `#show:` line (show-everything rule) ends the preamble before it, and for peace-of-posters calls of set-theme, update-theme, set-poster-layout, update-poster-layout (bare or with the import alias, `#pop.set-theme(...)`) count as preamble statements. The block is surrounded by exactly what is needed to sit on its own lines; no other byte outside it changes."
      - "Write rule: setSourceDeckStyle always writes the whole block in the canonical form below from the given DeckStyle (a hand edit inside the block is replaced on write, read back before). cursor = the offset of the block start. Same text in -> same text out (idempotent)."
      - "LaTeX common body (all three templates), colour names lsPrimary, lsAccent, lsBackground, lsText, lsMuted: `\\definecolor{lsPrimary}{HTML}{1F5673}` (hex upper case, no #) for the five colours; `\\def\\lsScale{1}`; fonts only under LuaLaTeX/XeLaTeX: `\\iftutex` / `\\usepackage{fontspec}` / `\\setmainfont{<bodyFont>}` / `\\setsansfont{<bodyFont>}` / `\\setmonofont{<monoFont>}` / `\\newfontfamily\\lsHeadingFont{<headingFont>}` / `\\else` / `\\let\\lsHeadingFont\\relax` / `\\fi`. pdfLaTeX keeps its fonts (the contract says so); scale is stored in \\lsScale for templates to use and has no effect by itself in LaTeX (contract says so)."
      - "beamer and beamerposter add: `\\setbeamercolor{normal text}{fg=lsText,bg=lsBackground}`, `\\setbeamercolor{background canvas}{bg=lsBackground}`, `\\setbeamercolor{structure}{fg=lsPrimary}`, `\\setbeamercolor{frametitle}{fg=lsPrimary}`, `\\setbeamercolor{title}{fg=lsPrimary}`, `\\setbeamercolor{block title}{fg=lsBackground,bg=lsPrimary}`, `\\setbeamercolor{alerted text}{fg=lsAccent}`, `\\setbeamercolor{footline}{fg=lsMuted}`, `\\setbeamerfont{frametitle}{family=\\lsHeadingFont}`, `\\setbeamerfont{title}{family=\\lsHeadingFont}`."
      - "tikzposter adds `\\definecolorstyle{labshelf}{\\colorlet{colorOne}{lsPrimary}\\colorlet{colorTwo}{lsAccent}\\colorlet{colorThree}{lsMuted}}{` then one \\colorlet per line for backgroundcolor (lsBackground), framecolor (lsPrimary), titlefgcolor (lsBackground), titlebgcolor (lsPrimary), blocktitlebgcolor (lsPrimary), blocktitlefgcolor (lsBackground), blockbodybgcolor (lsBackground), blockbodyfgcolor (lsText), innerblocktitlebgcolor (lsAccent), innerblocktitlefgcolor (lsBackground), innerblockbodybgcolor (lsBackground), innerblockbodyfgcolor (lsText), notefgcolor (lsText), notebgcolor (lsBackground), noteframecolor (lsMuted), then `}` and `\\usecolorstyle{labshelf}`. It sits after \\usetheme, so it wins over the theme's colours."
      - "Typst common body: `#let ls-primary = rgb(\"#1f5673\")` for the five colours (ls-primary, ls-accent, ls-background, ls-text, ls-muted), `#let ls-heading-font = \"Inter\"`, `#let ls-body-font = \"Inter\"`, `#let ls-mono-font = \"JetBrains Mono\"`, `#let ls-scale = 1`. plain typst then: `#set page(fill: ls-background)`, `#set text(font: ls-body-font, fill: ls-text, size: ls-scale * 1em)`, `#show heading: set text(font: ls-heading-font, fill: ls-primary)`, `#show raw: set text(font: ls-mono-font)`, `#show link: set text(fill: ls-accent)`. A show rule outside the block that sets its own colour (the plain poster scaffold's heading fill) keeps winning; the contract says so and session 5's templates use the ls- names."
      - "touying adds `#let ls-colors = config-colors(primary: ls-primary, secondary: ls-accent, tertiary: ls-muted, neutral-lightest: ls-background, neutral-darkest: ls-text)` and the plain rules except `#set page(fill:)`; the block sits before the `#show: <theme>.with(...)` line, and a theme takes the colours when its call passes `ls-colors` (templates do; the contract says the user may add it). peace-of-posters adds, with the import's alias prefix (`pop.` for `as pop`, none for `: *`), `#pop.update-theme(heading-box-args: (fill: ls-primary, stroke: ls-primary), heading-text-args: (fill: ls-background, font: ls-heading-font), body-box-args: (fill: ls-background, stroke: ls-primary), body-text-args: (fill: ls-text, font: ls-body-font))` and `#set text(font: ls-body-font, fill: ls-text)`; the block sits after the last set-theme / set-poster-layout call."
      - "Read-back: parse only lines inside the block, tolerant of spacing and extra lines: LaTeX \\definecolor{ls<Name>}{HTML}{RRGGBB} (also {rgb}{r,g,b} 0-1 and {RGB}{r,g,b} 0-255, converted to hex), \\setmainfont{..} -> bodyFont, \\setmonofont{..} -> monoFont, \\newfontfamily\\lsHeadingFont{..} (optional [options] skipped) -> headingFont, \\def\\lsScale{n} -> scale; Typst `#let ls-<name> = rgb(\"#..\")` (also `rgb(r, g, b)` 0-255), `#let ls-*-font = \"..\"`, `#let ls-scale = n`. A token not found or invalid is absent from `style` (Partial); no block -> style {}."
      - "Contract: documents/contracts/decks.md `### Themes` becomes `### Style` with the tokens, value rules, markers, placement, each of the six forms verbatim as a code block, the read-back and rewrite rules, what wins over what, the diff and the contrast pairs; fix every link to #themes in documents/ (`grep -rn \"#themes\" documents`)."
      - "Do not remove sourceDeckThemes.ts or the Theme menu here (3.3). Files at most 400 lines."
      - "Testing policy: run only `node scripts/agents/run.mjs typecheck core` and the tests.command below; never pnpm gate or any lint."
    acceptance:
