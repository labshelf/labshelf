      - {id: "3.1d", check: "setSourceDeckStyle returns null for an unknown template, an opening marker without its end, or an invalid style (validateDeckStyle names each bad token: colour not hex, font with quotes or braces, scale outside 0.5-3)"}
      - {id: "3.1e", check: "deckStyleContrast: #1a1a1a on #ffffff gives ratio ~17.4 ok; #777777 text on #ffffff gives 4.48 not ok (minimum 4.5); four pairs in order text, muted, primary, accent"}
      - {id: "3.1f", check: "diffDeckStyleBlock of the block before and after a primary change has exactly the changed lines as removed/added (the \\definecolor{lsPrimary} or #let ls-primary line); from '' every line is added"}
      - {id: A5, check: "core half of A5 for compiled decks: the style block is read, written as one SourceDeckChange (one undo step), diffed and contrast-checked; the contract names the forms"}
