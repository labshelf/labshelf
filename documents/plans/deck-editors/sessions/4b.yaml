    decided:
      - "Wire values: a kit crosses as the DeckKit JSON object; an image crosses as {name: string, base64: string}. deckKits (params {}) -> DeckKit[]; deckSaveKit (params {kit: object, logo?: {name, base64}}) -> DeckKit; deckPickKitImage (params {}) -> {name, base64} | null. The host re-validates a received kit with parseDeckKit(JSON.stringify(kit)) and rejects 'Invalid kit.' when null; the store re-checks the logo."
      - "No library open (libraryRoot() undefined): deckKits returns []; deckSaveKit rejects 'Open a LabShelf library to save kits.'; deckPickKitImage still works."
      - "pickImage: vscode.window.showOpenDialog({canSelectMany: false, filters: {Images: ['png','jpg','jpeg','svg','webp','gif']}, openLabel: 'Use image'}); cancel -> null; a file over DECK_KIT_MAX_IMAGE_BYTES rejects with the 5 MB message; else bytes from vscode.workspace.fs.readFile, name = basename."
      - "HTML decks: page message {type:'kits', id, request:'list'} | {..., request:'save', kit, logo?} | {..., request:'pickImage'}; the parser whitelists exactly these shapes (id via isId; kit an object; logo {name: string, base64: string}); the host answers {type:'kitsResult', id, ok: true, value} or {type:'kitsResult', id, ok: false, error}. The webview's port resolves or rejects the pending promise by id."
      - "The kits handler is one module-level service built in registerWritingView and given to both the deck bridge (provideDeckWorkspace) and the HTML deck provider; it holds no per-panel state."
      - "Files at most 400 lines; sourceEditor/provider.ts (332) is not edited."
