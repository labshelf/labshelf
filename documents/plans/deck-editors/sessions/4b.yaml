        signature: "export interface DeckKitStoreDeps { fs: Pick<LibraryFileSystem, \"listDir\" | \"readText\" | \"writeText\" | \"writeFile\" | \"ensureDir\" | \"exists\">; paths: PathOps; root: string }"
