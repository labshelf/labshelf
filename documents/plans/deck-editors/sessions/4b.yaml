        signature: "export function listDeckKits(deps: DeckKitStoreDeps): Promise<DeckKit[]>"
      - path: packages/core/src/decks/deckKitStore.ts
        signature: "export function saveDeckKit(deps: DeckKitStoreDeps, kit: DeckKit, logo?: DeckKitImage): Promise<DeckKit>"
