    decided:
      - "Without options.kits the panel is exactly as today (no section, the existing panel tests pass unchanged)."
      - "Section title 'Kits'. Body: one row per kit (from kits.list(), loaded when the panel mounts and after each save): the kit name, five swatches (primary, accent, background, text, muted) and a 'Use' button (aria-label 'Use <name>'); an empty list shows the note 'No kits yet.'; a list that rejects shows 'Kits could not be read.'. Below: buttons 'From logo…' and 'Save as Kit'. A status line (role status) shows the last message."
      - "Use: the kit's style becomes a card named after the kit; an existing card with the same name is replaced, else the card is appended; it becomes the chosen card (drawAll). Nothing is written until Apply, which stays the only writer (one undo step through the port)."
      - "From logo…: calls kits.pickImage() synchronously inside the click handler (the browser input needs the user gesture); null -> nothing; then readImagePixels -> extractPalette -> styleFromPalette(palette, chosen card's style) -> a card named 'From <file name>' chosen as above, and the image is remembered as that card's logo. Errors (decode failure, pick rejection, too large) show in the status line, e.g. 'This image could not be read.'"
      - "Save as Kit: opens an inline form: Name (text input, prefilled with the chosen card's name when it came from a kit, else empty), Footer (optional text input), Save and Cancel buttons. Save is disabled while the name is empty or the chosen style is invalid. Save calls kits.save({name, style: chosen card's style, footer?}, logo of the chosen card if it came from a logo); success -> status 'Saved <name>.', form closes, list reloads; rejection -> status shows the error message. Keys typed in the form stay in the panel (the panel's keydown handler already stops propagation)."
      - "readImagePixels: SVG by extension (image/svg+xml) and png/jpeg/webp/gif by extension; decodes through a Blob URL and an Image (default deps), revokes the URL; long side scaled to at most 64 px; returns Uint8ClampedArray; rejects when the canvas has no 2d context."
      - "Browser port (deckKitsPort.ts): list/save call listDeckKits/saveDeckKit with {fs: ctx.fs, paths: posixPathOps, root: ''}; pickImage creates a hidden <input type=file accept='image/png,image/jpeg,image/svg+xml,image/webp,image/gif'>, clicks it synchronously, resolves null on cancel, rejects with the 5 MB message above DECK_KIT_MAX_IMAGE_BYTES, else {name: file.name, bytes}."
