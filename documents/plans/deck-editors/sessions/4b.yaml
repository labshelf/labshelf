      - path: packages/core/src/decks/deckKitPalette.ts
        signature: "export function styleFromPalette(palette: readonly string[], base: DeckStyle): DeckStyle"
    decided:
      - "Also exported from deckKit.ts: DECK_KIT_VERSION = 1, DECK_KIT_FOLDER = \"kits\", DECK_KIT_MAX_IMAGE_BYTES = 5 * 1024 * 1024 (hosts refuse a picked image above it with the error \"The image is larger than 5 MB.\"). DeckKitsPort lives in deckKit.ts (not in dom/) so both hosts and both adapters import it without a DOM dependency."
      - "File: <library root>/kits/<slug>.json; slug = deckKitSlug(name): lower case, NFKD with combining marks removed, every run of characters outside [a-z0-9] becomes one '-', leading and trailing '-' trimmed, cut to 60 characters (then trailing '-' trimmed again), '' -> 'kit'. Saving a kit whose slug exists overwrites it (same name = same kit)."
      - "JSON form (serializeDeckKit): JSON.stringify({version: 1, name, style, logo?, footer?}, null, 2) + \"\\n\", keys in that order, style keys in DECK_STYLE_TOKENS order and normalised (normaliseDeckStyle), logo and footer omitted when absent."
      - "parseDeckKit(text) returns null for invalid JSON, a non-object, version !== 1, a name that is not a string or is empty after trim or longer than 80 characters (name is trimmed), or a style that is missing a token or fails validateDeckStyle after normalising (every one of the 9 tokens is required). logo is kept only when it is a string of the form `kits/<file>` with <file> having no '/', '\\\\' or '..' and an extension in png, jpg, jpeg, svg, webp, gif (case-insensitive); otherwise dropped, the kit still valid. footer is kept only when it is a string of at most 200 characters (trimmed; empty -> dropped). Unknown keys are ignored."
      - "listDeckKits: the folder paths.join(root, 'kits'); a missing folder (exists false) gives []; each `*.json` entry is read with readText and parsed; invalid or unreadable files are skipped (no throw); the result is sorted by name with localeCompare (base sensitivity)."
      - "saveDeckKit: throws an Error naming the problem when the name is empty or over 80 characters, or validateDeckStyle(style) is non-empty; ensureDir(kits folder). With a logo: its extension (from logo.name, lower case) must be png, jpg, jpeg, svg, webp or gif (else throw \"Unsupported image type.\"), bytes over DECK_KIT_MAX_IMAGE_BYTES throw the 5 MB message; it is written with writeFile to kits/<slug>.<ext> and the stored kit's logo is `kits/<slug>.<ext>` (always '/' separated, relative to the library root). Without a logo, a logo already on the given kit is kept as is if it passes the parse rule. Writes serializeDeckKit with writeText and returns the stored kit (as parseDeckKit would read it back)."
      - "extractPalette(pixels, count = 6): pixels is RGBA, 4 numbers per pixel. Pixels with alpha < 128 are skipped. Each kept pixel goes to a bucket keyed by the top 4 bits of r, g, b; a bucket's colour is the mean of its pixels (rounded). Buckets sorted by pixel count descending (ties: lower key first); then merged greedily: a bucket whose colour is within Euclidean RGB distance 48 of an already kept colour adds its count to that colour (the kept colour does not change). Returns up to `count` colours as lower-case #rrggbb, most frequent first; [] for no kept pixel. A uniform region of one colour gives that exact colour."
      - "styleFromPalette(palette, base): fonts, scale, background, text and muted come from base. A colour is chromatic when its HSL saturation >= 0.25 and its relative luminance is within [0.02, 0.9]. primary = the first chromatic colour of the palette; accent = the next chromatic colour whose hue differs from primary's by at least 30 degrees (circular); a missing primary keeps base.primary and a missing accent keeps base.accent. Each taken colour is then adjusted until its contrast with base.background (deckStyleContrast ratio, i.e. WCAG) is at least 3: mix it toward #000000 in 5 % steps when the background is light (isLightColour), toward #ffffff otherwise, up to 20 steps. The result passes validateDeckStyle; with the default base all four deckStyleContrast pairs are ok."
      - "Contract `## Kits` in documents/contracts/decks.md (anchor #kits): the folder and file name rule, the JSON form with an example, the parse rules above, where the logo is stored, the palette rule in two sentences, and what applying does in this version: a Kit applied from the Style panel writes its Style tokens through the format's style block (link #style and #theme) as one undo step; its logo and footer are stored and shown but not written into decks yet. library-format.md Layout gains `kits/   deck Kits, see decks.md#kits`."
      - "Do not touch the Style panel (shell/style/), the adapters' behaviour, or any host: 4b.2 and 4b.3 do. Files at most 400 lines."
      - "Testing policy: run only `node scripts/agents/run.mjs typecheck core` and the tests.command below; never pnpm gate or any lint. The hidden tests under documents/plans/deck-editors/tests/4b.1/ are read-only to you."
    acceptance:
      - {id: "4b.1a", check: "deckKitSlug('Universidade de São Paulo — IF') is 'universidade-de-sao-paulo-if'; '' and '***' give 'kit'; long names are cut to 60"}
      - {id: "4b.1b", check: "serializeDeckKit then parseDeckKit round-trips a kit with logo and footer exactly; parseDeckKit returns null for bad JSON, version 2, empty name, a missing token, an invalid colour; drops a logo '../x.png', 'kits/a/b.png' or 'kits/x.exe' and a 300-character footer while keeping the kit"}
      - {id: "4b.1c", check: "listDeckKits over an in-memory fs: missing folder -> []; two valid files and one broken one -> the two kits sorted by name; non-json files ignored"}
      - {id: "4b.1d", check: "saveDeckKit writes kits/<slug>.json in the decided form, overwrites a kit of the same name, writes a logo to kits/<slug>.png and stores logo 'kits/<slug>.png'; rejects an invalid style, an empty name, a .bmp logo and a logo over 5 MB"}
      - {id: "4b.1e", check: "extractPalette of an image 70 % #ffffff, 20 % #0b5394, 10 % #e69138 gives ['#ffffff', '#0b5394', '#e69138']; transparent pixels are ignored; close colours merge; [] for an all-transparent image"}
      - {id: "4b.1f", check: "styleFromPalette of that palette over DEFAULT_DECK_STYLE gives primary #0b5394, an accent darkened from #e69138 with contrast >= 3 against #ffffff, base fonts, scale, background, text and muted; a palette of greys only keeps base primary and accent; the result passes validateDeckStyle"}
      - {id: A6, check: "core half of A6 Kits: the kit format, store and palette extraction exist, are pinned by tests, and the contract names them"}
    tests:
      hidden:
        - documents/plans/deck-editors/tests/4b.1/packages/core/__tests__/decks/deckKit.test.ts
        - documents/plans/deck-editors/tests/4b.1/packages/core/__tests__/decks/deckKitStore.test.ts
