    decided:
      - "Gallery DOM (all English, classes `dtg-*`): root `div.dtg` with a heading 'New talk or poster', or 'New presentation' / 'New poster' when init.kind is set. A group aria-label 'Kind' with buttons 'Presentation' and 'Poster' (aria-pressed), absent when init.kind is set (default talk). A group aria-label 'Format' with one button per init.formats entry, labelled 'Visual' (html), 'LaTeX', 'Typst', aria-pressed, the first pressed; absent when there is one format. An input aria-label 'Title' with placeholder 'Presentation title' or 'Poster title'."
      - "A group aria-label 'Template' with one button per listDeckTemplates(kind, format) entry, aria-label the template name, aria-pressed, holding a preview (`.dtg-preview`, a box with the header band and one flex column per layout column sized by ratio, sections sized by weight, a takeaway section filled with the primary colour; a talk preview is a 16:9 box with a title bar), the name and the description. Generic is pressed at first; a change of kind or format keeps the pressed id when it still exists, else Generic."
      - "Size: a select aria-label 'Size' listing listTemplateSizes(kind, format) by label; for posters only the presets of the pressed orientation (square ones always), and a group aria-label 'Orientation' with 'Portrait' and 'Landscape' (aria-pressed, Portrait first pressed) that switches the list, keeping the same paper by orientDeckSize when it is listed. Defaults: 16:9 for talks, A0 portrait for posters."
      - "Palette: a group aria-label 'Palette' with 'Default' (style null, pressed first) and one button per DECK_STYLE_PRESETS name with swatches of primary, accent, background and text; then, when init.kits is non-empty, a subheading 'Your kits' and one button per kit with aria-label 'Kit: <name>' and its swatches. The pressed palette colours the template previews (Default uses DEFAULT_DECK_STYLE)."
      - "Buttons 'Cancel' and 'Create'. Create is disabled while the trimmed title is empty; clicking it, or Enter in the title when enabled, calls onCreate once with {kind, format, template, title (trimmed), size, style (the preset's or kit's style, or null)}. Cancel or Escape on the gallery calls onCancel. destroy removes the element and its listeners."
      - "Styles: templateGallery.css uses the --ls-* design tokens like the deck shell sheets (read `node scripts/docs/doc.mjs ui` sections on tokens), shipped as @labshelf/core/styles/deck-template-gallery.css and linked in the browser library page and its vendorReader sheet list."
      - "Browser: openNewDeckDialog mounts the gallery inside mountOverlay; it resolves the choice on Create, null on Cancel, Escape or an overlay dismiss, and closes the overlay either way. createDeck(fs, project, kind, {kits, pick}) calls pick({kind, formats: ['html', the project's format], kits}) (default pick openNewDeckDialog, kits default []); null returns undefined; otherwise the folder name comes from findFreeDeckName(deckFolderName(title)) as today, the files of scaffoldDeckFromTemplate(choice, name) are written with ensureDir/writeText, and the path of deck.html or the main file is returned (same paths as today). newDeck in session.ts passes kits from createBrowserKitsPort(context.fs).list(), [] when it throws. The sidebar menu items stay as they are."
      - "Files under 400 lines. Implementer checks: only `node scripts/agents/run.mjs typecheck core`, `node scripts/agents/run.mjs typecheck browser` and the tests.command plus `node scripts/agents/run.mjs test browser -- packages/browser/__tests__/writing/decks.test.ts`; no pnpm gate, no lint."
