    decided:
      - "Templates, in this order (Blank first): talks in every format: `blank` (Blank: the title slide only) and `generic` (Generic: title, Motivation, Results, Conclusion). Posters in every format: `blank` (Blank: header band and one full-width section), `generic` (Generic: three columns), `better-poster` (Better Poster: a wide centre column with the main finding in one large plain-language sentence, narrow side columns), `billboard` (Billboard: a large header and type, one big key result beside a narrow column). Each has an English one-sentence description. listDeckTemplates returns fresh copies; an unknown kind or format gives []."
      - "POSTER_SECTION_TEMPLATES ids, in order: introduction, methods, results, conclusion, references, acknowledgements, contact, main-finding, key-figure; titles in title case ('Main finding', 'Key figure'), text a one-sentence English prompt (e.g. 'What the problem is and why it matters.'). Layouts: blank columns [1], header 0.12, sections [introduction c0]; generic columns [1,1,1], header 0.12, [introduction c0, methods c1, results c2] (exactly today's poster); better-poster columns [1,2,1], header 0.08, [introduction c0, methods c0, results c0, main-finding c1 takeaway, key-figure c2, references c2, contact c2]; billboard columns [2,1], header 0.16, typeScale 1.25, [main-finding c0 weight 2 takeaway, key-figure c0, methods c1, results c1, contact c1]. headerHeight is the fraction of the canvas height (px = round2(H * fraction))."
      - "HTML: talk blank == scaffoldDeck('talk', name, size) and poster generic == scaffoldDeck('poster', name, size) byte for byte when style is null. Talk generic adds three `<section data-slide>` slides after the title slide, each with a heading block and a text block (block ids unique in the deck) and an empty `<aside data-notes>`. Other posters use the same markup as scaffoldDeck's poster (contract `## Poster sections`): one `data-poster=\"section\"` block per layout section with `data-column`, `data-weight` only when given, `<h2>title</h2><p>text</p>`; a takeaway section holds `<p class=\"poster-takeaway\">` with its text and no h2, and the theme gets one rule `.poster-takeaway { font-size: var(--poster-font-title, 96px); font-weight: 700; line-height: 1.15; }`. The Poster Settings are written with the layout's columns, header height and type scale, then reflowed. validateDeck reports no error for any template output. Files: `[{path: 'deck.html'}, {path: 'theme.css'}]`."
      - "LaTeX and Typst: talk generic == scaffoldSourceDeck(format, title, shape) byte for byte; talk blank is the same preamble with the title slide only; poster generic == scaffoldSourceDeck output. Other posters: tikzposter `\\begin{columns}` with one `\\column{f}` per layout column (f = ratio / sum, 2 decimals) holding `\\block{title}{text}` per section in order (a takeaway block is `\\block{}{\\Huge text}`); Typst `#grid(columns: (Rfr, ...), gutter: 3cm, [...], ...)` with one cell per column holding `= title` and the text (a takeaway is `#text(size: 72pt, weight: \"bold\")[text]`); billboard multiplies the Typst base text size by its type scale. All keep the `labshelf: poster` marker comment. Files: one `{path: sourceDeckMainFile(format)}`. The shape comes from the size: a talk is 4:3 when w/h is within 0.01 of 4/3, else 16:9; a LaTeX poster maps to the A paper whose sides match in either orientation, landscape when w > h."
      - "style non-null: HTML theme.css goes through setThemeStyle, LaTeX/Typst through setSourceDeckStyle; a null result throws RangeError. scaffoldDeckFromTemplate throws RangeError for a bad name (isDeckName), an unknown template, a disallowed size or a size not in listTemplateSizes for a source format."
      - "listTemplateSizes: html -> listDeckSizePresets(kind); latex/typst talk -> the talk-16-9 and talk-4-3 presets; latex poster -> the six A0-A2 presets; typst poster -> listDeckSizePresets('poster')."
      - "parseDeckTemplateChoice never throws: an object with kind talk|poster, format html|latex|typst, template among listDeckTemplates(kind, format) ids, title a string non-empty after trim (trimmed, at most 200 chars), size {w,h,unit} allowed by isDeckSizeAllowed and, for a source format, equal to one of listTemplateSizes, and style null or a DeckStyle with no validateDeckStyle error (normalised); otherwise null."
      - "deckSizeOrientation: square when w == h, else portrait when h > w. orientDeckSize swaps w and h when the size is not already in that orientation (square unchanged). sizePicker.ts's private orientedPreset delegates to it; its behaviour is unchanged."
      - "DeckStylePreset and DECK_STYLE_PRESETS move verbatim to deckStylePresets.ts (no DOM import); dom/shell/style/panel.ts imports them and keeps re-exporting both names so dom/shell/style/index.ts and its callers are unchanged."
      - "Each file stays under 400 lines; deckEdit.ts is not touched. Implementer checks: only `node scripts/agents/run.mjs typecheck core` and the tests.command; no pnpm gate, no lint."
    acceptance:
      - {id: 5.1a, check: "listDeckTemplates gives blank and generic for talks and blank, generic, better-poster, billboard for posters in each format, Blank first"}
