      - {path: packages/browser/src/storage/noteFiles.ts, signature: "export function createBrowserNoteFileIo(fs: NoteFileIo['fs'], pick?: NoteFileIo['pick']): NoteFileIo"}
    decided:
      - "Both hosts build a NoteFileIo and use core's answerNoteFileRequest / noteFilesPortFor; no host re-implements path checks, base64 or the reply shape. Writes go through the host's LibraryFileSystem (atomic by its invariant)."
      - "Folders: reader and library pane paper notes = the paper's record path (papers/<id>/); Spaces = createLibraryLayout(root, join).spaceDir(spaceId) joined with the note path's parent (notes/x.qmd -> spaces/<id>/notes), so assets land in spaces/<id>/notes/assets/; browser project notes = <project folder>/notes from the existing ProjectFolderOf. VS Code project notes have no noteFile protocol (notesEditor webview); they stay without files and are listed as open in the handoff."
      - "VS Code pick: vscode.window.showOpenDialog({canSelectMany: false, filters: {Data: accept without dots}, openLabel: 'Import'}), then vscode.workspace.fs.readFile and TextDecoder UTF-8; name is the file's basename; cancel -> null."
      - "Browser pick: default pick is a hidden input type=file with accept joined by ',', clicked synchronously when called (the request reaches the in-page host in the same task as the user's click), resolving null on 'cancel'; {name: file.name, text: await file.text()}. It lives in packages/browser/src/storage/noteFiles.ts as the default of the pick parameter so tests inject a fake."
      - "From 4.1: core libraryUi mounts no paper-note editor; paper and project note editors are mounted through mountNoteFile by browser editorArea/noteFileTab.ts and vscode notesEditorEntry.ts, so the browser tab passes its files option (noteFilesPortFor over the in-page io, folder by note kind) and the vscode notesEditor stays without files (open in the handoff). reader/dom/noteBoxes.ts editors are all read-only and get no files."
      - "Testing policy (unattended): never run pnpm gate or any lint; check with node scripts/agents/run.mjs typecheck vscode, typecheck browser and the spec's tests command."
    acceptance:
      - {id: 4.4a, check: "VS Code: with a fake fs and a mocked showOpenDialog, the io writes papers/p1/assets/c.csv and reads it back, a missing file is null, a cancelled dialog is null, a picked file returns its basename and text; the library pane 'paper.noteFile' case posts a noteFile.reply with the same requestId"}
      - {id: 4.4b, check: "browser: with a writable fake LibraryFileSystem the io writes and reads assets under <project>/notes and spaces/<id>/notes, and a cancelled pick is null"}
    tests:
      hidden:
        - documents/plans/charts/tests/4.4/packages/vscode/__tests__/reader/noteFiles.test.ts
        - documents/plans/charts/tests/4.4/packages/browser/__tests__/storage/noteFiles.test.ts
