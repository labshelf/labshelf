    decided:
      - "Found by 4.3: the Axes panel writes range in data units; Plotly reads a log axis range as log10 values. toAxis maps a range on a type 'log' axis to [Math.log10(min), Math.log10(max)]; a log range with a bound <= 0 is left out (autorange) rather than sent as NaN. Linear axes and the model are unchanged. Applies to 2D axes and the 3D scene axes alike."
      - "Testing policy (unattended): never run pnpm gate or any lint; check with node scripts/agents/run.mjs typecheck core and the spec's tests command."
