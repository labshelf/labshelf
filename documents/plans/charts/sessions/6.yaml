    decided:
      - "Axis options: width=<cm>cm, height from the aspect, xmin/xmax/ymin/ymax from the view, xlabel/ylabel, ymode=log or xmode=log, legend entries from trace names, trig format plots=rad, samples from steps (default 100 for 2D, steps for 3D); for 3D, view={az}{el} computed from the stored layout.camera eye (D13), Plotly's default eye when absent; variables inlined with their stored values."
      - "fn2d y: `\\addplot[domain=a:b, samples=n, <colour>]{expr};`; x=f(y): `\\addplot({expr},{y})` with variable=y; parametric: `\\addplot[variable=t, domain=a:b]({x},{y});`; polar: parametric with x = r*cos(θ), y = r*sin(θ). fn3d surface: `\\addplot3[surf, domain=a:b, domain y=c:d, samples=n, samples y=m]{expr};`; parametric surface uses `({x},{y},{z})` with variable=u, variable y=v; 3D curve `\\addplot3[variable=t, domain=a:b, samples y=0]`."
      - "Data: line and scatter `\\addplot coordinates {...}` (only marks for scatter), area with fill and `\\closedcycle`, bar with ybar and symbolic x coords when x is text, scatter3d `\\addplot3[only marks] coordinates`. Any other type, implicit curves, relations, or a table over 2000 rows -> null (image-only)."
      - "Colours as `{rgb,255:red,R;green,G;blue,B}`; the export palette is the light theme's."
      - "Testing policy (unattended): never run pnpm gate or any lint; check with node scripts/agents/run.mjs typecheck core and the spec's tests command."
    acceptance:
      - {id: 6.3a, check: "z = exp(-x^2-y^2) on [-2,2] writes \\addplot3[surf,domain=-2:2,...]{exp(-x^2-y^2)} inside the \\@ifundefined{pgfplotsset} guard"}
      - {id: 6.3b, check: "pie and heatmap return null and their block has no latex part; a bar chart with text x uses symbolic x coords"}
      - {id: 6.3c, check: "with pdflatex on PATH, a document with \\usepackage{pgfplots} and three generated charts compiles (skipped otherwise)"}
      - {id: A9, check: "guarded pgfplots for mappable charts, image-only for the rest, compiles when pdflatex is present"}
    tests:
      none: "pending: written in 6.0"
