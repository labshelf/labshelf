    goal: "2D function samplers into Plotly traces: y=f(x), x=f(y), relations (<, >, ≤, ≥) as shaded regions, parametric x(t), y(t), polar r(θ), implicit F(x,y)=0 by marching squares, all with the chart's variables (D8)."
