      - {path: packages/core/src/qmd/drawing/expr.ts, signature: "export type ExprResult = { ok: true; ast: ExprNode; evaluate(x: number, env?: Readonly<Record<string, number>>): number } | { ok: false; error: string; at: number }"}
      - {path: packages/core/src/qmd/drawing/exprPgf.ts, signature: "export function formatPgfExpr(ast: ExprNode, env?: Readonly<Record<string, number>>): string"}
    decided:
      - "Default vars ['x'] keeps every drawing caller unchanged. The first var is the positional x of evaluate; the others and params come from env (missing ones evaluate to NaN)."
      - "A letter run that is not a function, constant or declared name splits into one-letter declared names when every letter is one (xy -> x*y, ax with param a -> a*x); otherwise 'unknown name'."
      - "formatPgfExpr: x and y keep their names, t becomes t (callers set variable=t), θ/theta becomes x for polar (the caller maps it), params are inlined as numbers, ^ kept, log -> log10, ln -> ln, trig unchanged (axis option 'trig format plots=rad' is written by the caller), mod -> mod, sign -> sign, round -> round, sec/csc/cot -> sec/cosec/cot."
      - "Testing policy (unattended): never run pnpm gate or any lint; check with node scripts/agents/run.mjs typecheck core and the spec's tests command, plus the existing expr, sample, layout and drawingEditor tests."
