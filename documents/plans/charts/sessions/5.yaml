      - {path: packages/core/src/qmd/drawing/sample.ts, lines: "1-131", why: "sampleFunction gains an option {round: false, maxPoints} (default unchanged)"}
    read:
      - {path: packages/core/src/qmd/drawing/expr.ts, lines: "1-260", why: "parseExpr with vars from 5.1"}
      - {path: packages/core/__tests__/qmd/drawing/sample.test.ts, lines: "1-120", why: "existing sampler behaviour that must not change"}
    seams:
      - {path: packages/core/src/qmd/chart/sample2d.ts, signature: "export function fnTraces2d(fn: ChartFn, vars: readonly ChartVar[], view: { x: [number, number]; y: [number, number] }, colour: string): { traces: Record<string, unknown>[]; error: { message: string; at: number; part: number } | null }"}
      - {path: packages/core/src/qmd/chart/implicit.ts, signature: "export function marchingSquares(f: (x: number, y: number) => number, x: [number, number], y: [number, number], n: number): [number, number][][]"}
    decided:
      - "y=f(x): sampleFunction without rounding, 1000 points, runs joined with null gaps in one trace. x=f(y): same with axes swapped. Relations: the curve dashed for strict < and >, solid for ≤ and ≥, and a fill to the view edge (below for <, ≤; above for >, ≥) with opacity 0.25 using a closed polygon per run."
      - "Parametric and polar: t or θ uniform over domain (default [0, 2π]), steps default 400, a jump taller than the view breaks the run. Implicit: n = 200 grid cells per axis, segments chained into polylines."
      - "Testing policy (unattended): never run pnpm gate or any lint; check with node scripts/agents/run.mjs typecheck core and the spec's tests command, plus the existing sample tests."
    acceptance:
      - {id: 5.2a, check: "y = 4*sin(x) + 5*cos(x/2) on [-10, 10] gives one trace with finite points; 1/x has a null gap at 0"}
      - {id: 5.2b, check: "y < x^2 gives a dashed curve and a filled region below it; y >= x a solid line and a region above"}
      - {id: 5.2c, check: "x = cos t, y = sin t and r = 1 (polar) trace the unit circle; x^2 + y^2 - 1 = 0 by marching squares gives a closed polyline near radius 1"}
      - {id: 5.2d, check: "a variable a in y = a*x changes the samples when its value changes; a bad expression returns its message, offset and part"}
    tests:
      none: "pending: written in 5.0"
