      - "Nested overlays: mountOverlay ignores Escape and Tab while an overlay mounted after it is still open (the topmost overlay owns the keys), so Esc in the discard confirm only closes the confirm. A fullscreen overlay is not dismissed by a scrim mousedown."
      - "Existing tests this package updates itself (they are not hidden tests): chartView.test.ts calls createChartView with loose loaders (() => Promise<unknown>, jest.fn(async () => undefined)); retype those calls to the new loader type, assertions unchanged; add dialog.test.ts cases for the fullscreen and onEscape options."
      - The editor root carries .ls-dialog .ls-dialog-full; its buttons are <button> elements named Cancel, Apply and Ok. The editor is dirty after any bubbling input or change event inside it or any model change from a pane; Apply clears dirty. The written PNG has widthCm 16 (D6) and the block keeps pgf null until session 5.
      - files is NoteFilesPort from session 3; type it as an optional interface imported from qmd/noteFiles.ts once it exists, or declare a local structural type now.
      - "Bundle check: A10 is checked by the hidden index.test.ts esbuild measurement (at most 150 KB minified without Plotly and MathJax); no separate webview build."
      - "Testing policy (unattended): never run pnpm gate or any lint; check with node scripts/agents/run.mjs typecheck core and the spec's tests command."
