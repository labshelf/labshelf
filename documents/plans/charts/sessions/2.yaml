      - Plan D6, D9. A null model opens the picker (2.2 provides it; until then a placeholder pane). Apply writes and keeps the editor open; Ok writes and closes; Cancel and Esc on a clean editor close without writing; a dirty editor asks 'Discard changes to this chart?' (askDialog, danger).
