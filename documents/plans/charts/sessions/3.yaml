        check: parseCsv reads quoted fields, embedded newlines, CRLF, BOM, semicolon with comma decimals and tab files; formatCsv(parseCsv(x)) is stable
      - id: 3.1b
        check: "header detection: a first row of text over numeric columns becomes names"
      - id: 3.1c
        check: placeTable keeps a small table inline and moves a large one to assets/<id>.csv with src set and data removed
