  - id: "3.1"
    plan: charts
    sha: cfd449df
    goal: "Pure CSV and table code: RFC 4180 parse with delimiter sniffing (comma, semicolon, tab), header detection, typed cells (number, text, empty), format back to CSV, column letters, and the inline-or-external rule of D4."
    level: behaviour
