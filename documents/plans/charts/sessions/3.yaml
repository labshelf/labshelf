      - path: packages/core/src/qmd/projectNoteWriter.ts
        lines: 1-30
        why: IProjectAssetWriter precedent
      - path: packages/core/src/qmd/sendTo.ts
        lines: 10-70
        why: write the sibling first, then the item
      - path: packages/core/src/spaces/spacesHostPort.ts
        lines: 1-25
        why: Spaces host port
    seams:
      - path: packages/core/src/qmd/noteFiles.ts
        signature: "export interface NoteFilesPort { read(path: string): Promise<Uint8Array | null>; write(path: string, bytes: Uint8Array): Promise<void>; pickTextFile(accept: readonly string[]): Promise<{ name: string; text: string } | null> }"
      - path: packages/core/src/qmd/noteFiles.ts
        signature: "export function safeNotePath(path: string): string | null"
      - path: packages/core/src/qmd/noteFiles.ts
        signature: "export function createNoteFilesClient(post: (message: unknown) => void, onReply: (listener: (message: unknown) => void) => () => void): NoteFilesPort"
      - path: packages/core/src/qmd/dom/chartSource.ts
        signature: 'export async function readChartSource(files: import("../noteFiles.js").NoteFilesPort | undefined, src: string): Promise<{ table: import("../chart/model.js").ChartTable; missing: null } | { table: null; missing: string }>'
      - path: packages/core/src/qmd/dom/chartEditor/commitChart.ts
        signature: 'export async function commitChart(model: import("../../chart/model.js").ChartModel, table: import("../../chart/model.js").ChartTable, files: import("../../noteFiles.js").NoteFilesPort | undefined): Promise<{ model: import("../../chart/model.js").ChartModel; error: null } | { model: null; error: string }>'
      - path: packages/core/src/qmd/noteFiles.ts
        signature: 'export type NoteFileRequest = { type: "noteFile.read"; requestId: string; path: string } | { type: "noteFile.write"; requestId: string; path: string; base64: string } | { type: "noteFile.pick"; requestId: string; accept: string[] }'
      - path: packages/core/src/qmd/noteFiles.ts
        signature: 'export type NoteFileReply = { type: "noteFile.reply"; requestId: string; base64?: string | null; file?: { name: string; text: string } | null; error?: string }'
      - path: packages/core/src/qmd/noteFiles.ts
        signature: "export function isNoteFileRequest(raw: unknown): raw is NoteFileRequest"
      - path: packages/core/src/qmd/noteFiles.ts
        signature: "export function isNoteFileReply(raw: unknown): raw is NoteFileReply"
    decided:
      - safeNotePath accepts only relative POSIX paths under assets/ without '..', empty segments or a drive letter; everything else is refused before any message is posted.
      - "noteFiles.ts exports the identity-free request and reply the client posts and receives: type NoteFileRequest = { type: 'noteFile.read'; requestId: string; path: string } | { type: 'noteFile.write'; requestId: string; path: string; base64: string } | { type: 'noteFile.pick'; requestId: string; accept: string[] }; type NoteFileReply = { type: 'noteFile.reply'; requestId: string; base64?: string | null; file?: { name: string; text: string } | null; error?: string }, plus guards isNoteFileRequest(raw: unknown): raw is NoteFileRequest (rejects a path safeNotePath refuses) and isNoteFileReply(raw: unknown): raw is NoteFileReply. read resolves null on base64 null (missing file); pick resolves null on file null (cancelled; text is UTF-8, 10 MB limit); any reply with error rejects with Error(error). Replies with an unknown requestId are ignored."
      - "Each protocol wraps the request with the note identity it already uses for note saves and answers with NoteFileReply unchanged: reader (WebviewToHost uses 'command') { command: 'noteFile'; request: NoteFileRequest } for the panel's paper, accepted by isWebviewMessage, and the host-to-webview union gains NoteFileReply; library pane UiToHost { type: 'paper.noteFile'; id: string; request: NoteFileRequest } accepted by parseUiMessage, host-to-UI union gains NoteFileReply; Spaces SpacesToHost { type: 'space.noteFile'; spaceId: string; path: string; request: NoteFileRequest } where path is the note (isSpaceQmdPath), accepted by parseSpacesMessage, host-to-page union gains NoteFileReply. Every validator rejects a malformed or unsafe request. Project notes reuse NoteFileRequest in their own channel in 4.1."
      - "Wire the port into the qmd editor options (optional) and from there into ChartEditorHost.files (retyped from object to NoteFilesPort) and the chart view; host implementations come in 4.1. Commit happens in openChartEditor before host.done: placeTable; if csv, files.write(csv.path, UTF-8 bytes) and only on success call done with the placed model (src set, data removed); on a failing write done is not called, the editor stays open and shows the error. Without files, a large table stays inline."
      - "chartView: a block with src reads it through files on mount; null or no files keeps the stored PNG and shows 'Data file <src> not found' under it; the editor then opens with the grid readOnly. A read CSV is parsed with parseCsv and drawn as the table."
      - "Testing policy (unattended): never run pnpm gate or any lint; check with node scripts/agents/run.mjs typecheck core and the spec's tests command."
      - "From 3.2: mountDataGrid has no path option and its readOnly note says 'Data file not found; the grid is read-only.'. dataEditor shows 'Data file <src> not found' with the path when the editor opens on a missing CSV, and passes readOnly to the grid; it passes host.files.pickTextFile(['.csv', '.tsv', '.txt']) as pickFile when files is set. A grid edit that drops src keeps going through commitChart, so a large table returns to assets/<id>.csv on commit."
      - "createChartView(loadPlotly?, openEditor?, files?: NoteFilesPort) takes the port as its third argument; qmdEditor passes options.files there."
      - 'readChartSource is what chartView calls on mount for a block with src: no port, a null read, or a rejected read give { table: null, missing: "Data file <src> not found" }; a read gives parseCsv of the UTF-8 text. commitChart is what openChartEditor calls on Ok/Apply before host.done: placeTable(model, table); csv null -> { model }; else files.write(csv.path, UTF-8 bytes) first and { model } (src set, data removed) on success, { model: null, error: <message> } on failure; without files a large table stays inline. Protocol validator tests live in qmd/noteFiles.test.ts (one test file per source file; the existing messages tests are not touched).'
      - "The three protocol validators call isNoteFileRequest for the wrapped request. Their accept and reject cases are not hidden tests (they cannot fail through a stub): the implementer adds them to the existing packages/core/__tests__/reader/protocol/messages.test.ts, libraryUi/protocol/messages.test.ts and spaces/spacesProtocol.test.ts, and runs those files."
    acceptance:
      - id: 3.3a
        check: safeNotePath refuses '../x.csv', '/x.csv', 'C:/x.csv', 'assets/../x.csv' and accepts 'assets/ab12cd34.csv'
      - id: 3.3b
        check: createNoteFilesClient posts read, write and pick requests and resolves on the matching reply id; protocol validators accept the new messages
      - id: 3.3c
        check: committing a chart with a large table writes assets/<id>.csv through the port before the block; a failing write leaves the block unchanged
      - id: A5
        check: grid edit, paste, import; large table to assets/<id>.csv referenced by src; missing CSV shows PNG and 'Data file … not found'
    tests:
      hidden:
        - documents/plans/charts/tests/3.3/packages/core/__tests__/qmd/noteFiles.test.ts
        - documents/plans/charts/tests/3.3/packages/core/__tests__/qmd/dom/chartEditor/commitChart.test.ts
        - documents/plans/charts/tests/3.3/packages/core/__tests__/qmd/dom/chartSource.test.ts
      command: node scripts/agents/run.mjs test core --spec 3.3 --plan charts -- packages/core/__tests__/qmd/noteFiles.test.ts packages/core/__tests__/qmd/dom/chartEditor/commitChart.test.ts packages/core/__tests__/qmd/dom/chartSource.test.ts
    commands:
      - node scripts/agents/run.mjs typecheck core
      - node scripts/agents/run.mjs test core --spec 3.3 --plan charts -- packages/core/__tests__/reader/protocol/messages.test.ts packages/core/__tests__/libraryUi/protocol/messages.test.ts packages/core/__tests__/spaces/spacesProtocol.test.ts packages/core/__tests__/qmd/dom/chartView.test.ts packages/core/__tests__/qmd/dom/chartEditor/openChartEditor.test.ts
