    edit:
      - path: packages/core/src/qmd/chart/index.ts
        lines: 1-4
        why: export csv and table API
      - path: packages/core/src/qmd/dom/chartEditor/traceCards.ts
        lines: 1-187
        why: drop its private columnLetter and import it from chart/table.ts
      - path: packages/core/src/qmd/dom/chartEditor/dataEditor.ts
        lines: 1-10
        why: import columnLetter from chart/table.ts instead of traceCards.ts
    read:
