        signature: "export function mountDataGrid(root: HTMLElement, table: ChartTable, options: { onChange(table: ChartTable): void; pickFile?: () => Promise<{ name: string; text: string } | null>; readOnly?: boolean }): { update(table: ChartTable): void; destroy(): void }"
    decided:
      - Rendered as a role=grid table; arrows move, Enter or typing edits, Tab moves right, Esc cancels the edit (handled before the overlay's Esc), Delete clears. The grid shows at least 15 columns and 30 rows and grows; rows beyond 500 are windowed (only visible rows rendered).
      - "Import: replaces the table after confirming when it is not empty; parse errors are listed under the grid ('Row 12: unclosed quote'). Without pickFile the button is absent and the hint says 'Paste CSV or TSV into the grid'."
      - readOnly (missing CSV file, D4) disables editing and shows 'Data file <path> not found'.
      - "Testing policy (unattended): never run pnpm gate or any lint; check with node scripts/agents/run.mjs typecheck core and the spec's tests command."
      - "Markup the tests rely on: role=grid, role=columnheader letters, role=rowheader numbers, role=gridcell cells (selected by click or focus, aria-selected=true); the cell editor is an input inside the grid. Plain buttons named (aria-label) Add row, Delete row, Add column, Delete column and Import data from CSV file act on the selected cell. Paste reads event.clipboardData.getData(text/plain) through parseCsv. The import confirm is askDialog. dataEditor passes no pickFile until 3.3 wires host.files."
    acceptance:
      - id: 3.2a
        check: typing in a cell and Enter updates the table; arrows and Tab move; Esc cancels an edit without closing the editor
      - id: 3.2b
        check: pasting TSV at B2 fills from B2; adding and deleting a row and a column update the table
      - id: 3.2c
        check: Import with a fake pickFile replaces the table after confirmation and lists parse errors
    tests:
      hidden:
        - documents/plans/charts/tests/3.2/packages/core/__tests__/qmd/dom/chartEditor/dataGrid.test.ts
      command: node scripts/agents/run.mjs test core --spec 3.2 --plan charts -- packages/core/__tests__/qmd/dom/chartEditor/dataGrid.test.ts
    commands:
      - node scripts/agents/run.mjs typecheck core
  - id: "3.3"
    plan: charts
    sha: cfd449df
    goal: NoteFilesPort in core with path safety, one request/reply message pair per protocol (reader, library pane, Spaces) for read, write and pick, the chart commit writing the CSV first then the block, a missing CSV degrading to the PNG, and the contracts updated (D4, D5).
    level: contract
    runner:
