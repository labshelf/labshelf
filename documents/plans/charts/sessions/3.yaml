        lines: 1-120
        why: ChartTable (line 9), ChartModel (line 23) and readTable from 1.2
      - path: documents/contracts/qmd-items.md
        lines: 217-262
        why: the charts section written in 1.2 (data vs src)
    seams:
      - path: packages/core/src/qmd/chart/csv.ts
        signature: "export function parseCsv(text: string): { table: ChartTable; delimiter: ',' | ';' | '\\t'; header: boolean; errors: { row: number; message: string }[] }"
      - path: packages/core/src/qmd/chart/csv.ts
        signature: "export function formatCsv(table: ChartTable): string"
      - path: packages/core/src/qmd/chart/table.ts
        signature: "export function columnLetter(index: number): string"
      - path: packages/core/src/qmd/chart/table.ts
        signature: "export function placeTable(model: ChartModel, table: ChartTable): { model: ChartModel; csv: { path: string; text: string } | null }"
    decided:
      - "Numbers: '.' decimal; a ';'-delimited file also accepts ',' decimals. Quoted fields, doubled quotes, embedded newlines, CRLF and a BOM are handled. Ragged rows pad with empty cells."
      - "placeTable: inline (data set, src removed) when JSON.stringify(model with data) is under 65536 UTF-8 bytes; else src = 'assets/<model.id>.csv', data removed, csv text returned for the caller to write. Letters A..Z, AA.."
      - "Testing policy (unattended): never run pnpm gate or any lint; check with node scripts/agents/run.mjs typecheck core and the spec's tests command."
      - "columnLetter already exists as a private helper in packages/core/src/qmd/dom/chartEditor/traceCards.ts; move it to table.ts (0-based: 0 -> A, 25 -> Z, 26 -> AA) and import it there."
    acceptance:
