    create:
      - packages/core/src/qmd/noteFiles.ts
      - packages/core/src/qmd/dom/chartSource.ts
      - packages/core/src/qmd/dom/chartEditor/commitChart.ts
    edit:
      - path: packages/core/src/qmd/dom/qmdEditor.ts
        lines: 40-165
        why: "QmdEditorOptions (line 42) gains files?: NoteFilesPort, passed to createChartView at line 160 (371 lines now; keep the file under 400 lines)"
      - path: packages/core/src/qmd/dom/chartView.ts
        lines: 1-269
        why: read src through the port on mount; missing file shows the PNG and 'Data file <path> not found'; commit writes the CSV first
      - path: packages/core/src/qmd/dom/chartEditor/openChartEditor.ts
        lines: 1-210
        why: "ChartEditorHost (line 15) has the placeholder files?: object, retyped to NoteFilesPort; host.files reaches the grid's pickFile and the commit"
