      - path: documents/contracts/qmd-items.md
        lines: 217-262
        why: "charts section: assets/<id>.csv rule, CSV first then block, missing file behaviour, deleting a chart keeps the CSV"
      - path: documents/contracts/spaces.md
        lines: 13-30
        why: a Space also reads and writes notes/assets/<id>.csv
      - path: packages/core/src/qmd/index.ts
        lines: 1-15
