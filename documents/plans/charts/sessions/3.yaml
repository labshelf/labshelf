      - "Messages carry the note identity the protocol already uses for note saves (paper id, project id + slug, space id + slug) plus the relative path; replies carry bytes as base64 for read and an error string on failure. Pick replies carry name and text (UTF-8, 10 MB limit)."
      - "Wire the port into the qmd editor options (optional) and from there into ChartEditorHost.files and the chart view; host implementations come in 4.1. Commit order: placeTable; if csv, write it and only on success write the block; on failure keep the editor open with the error."
