        why: "HtmlShellOptions gains `images?: CspImages` (replacing dataImages: true becomes images 'data'); the img-src part comes from cspImageSource; qmd-hosting webviews (source editor, library pane, notes views) pass 'qmd'"
      - path: packages/vscode/src/spaces/view.ts
        lines: 170-190
        why: Spaces webview CSP uses cspImageSource(webview.cspSource, 'qmd')
      - path: packages/vscode/src/writing/sourceEditor/provider.ts
        lines: 60-75
        why: "renderHtmlShell gets images: 'qmd'"
      - path: packages/vscode/src/libraryUi/listPanel.ts
        lines: 95-106
        why: "library pane: dataImages: true becomes images: 'qmd' (it hosts qmd notes and shows data: thumbnails)"
    read:
      - path: documents/plans/charts/research/plotly.brief.yaml
        lines: 1-80
        why: "loader, preparePlotlyStyles, CSP strings per host, toImage path (blob: img)"
      - path: packages/core/src/qmd/dom/plotView.ts
        lines: 1-95
        why: PlotlyApi, loadCorePlotly, preparePlotlyStyles
      - path: packages/vscode/src/reader/shell.ts
        lines: 50-70
        why: "reader CSP (already img-src blob: data:)"
      - path: packages/vscode/src/writing/sourceEditor/provider.ts
        lines: 55-75
        why: source editor shell options
      - path: documents/plans/interactive-plots/research/renderer-spike.md
        lines: 1-120
        why: "the earlier renderer spike: how it ran Plotly under CSP"
    seams:
      - path: packages/vscode/src/ui/cspImages.ts
        signature: export type CspImages = 'none' | 'data' | 'qmd'
      - path: packages/vscode/src/ui/cspImages.ts
        signature: "export function cspImageSource(cspSource: string, images: CspImages): string"
    decided:
      - "The existing packages/vscode/__tests__/ui/htmlShell.test.ts passes dataImages: true; update it to images: 'data' (it is in owns)."
      - "cspImageSource returns the img-src directive with a leading space and trailing semicolon, ready to splice into a CSP string: 'none' -> '' (no img-src, as today), 'data' -> ' img-src <cspSource> data:;' (today's dataImages), 'qmd' -> ' img-src <cspSource> data: blob:;'. renderHtmlShell and the Spaces shell both call it; every current caller of renderHtmlShell keeps its exact CSP except the qmd-hosting ones, which gain blob: (and data: if they lacked it)."
      - "Run the spike with any headless Chromium already available (playwright or puppeteer in node_modules, or a Chrome/Chromium binary with --headless=new and a local file or http server); install nothing into the repo. The harness lives in the scratchpad, not in the repo. Page: the exact CSP meta string each host builds (source editor, Spaces, reader, browser extension page), the strict Plotly bundle, preparePlotlyStyles, one heatmap with a colour bar and one surface; call toImage png and svg, and check the colour bar renders (the plotView.ts showscale trap)."
      - "Write toimage-spike.md: per host, toImage png ok / fails (console CSP error), svg ok / fails, colour bar ok / fails, and the decision for charts. If no headless browser is available, say so, decide from the CSP strings and Plotly's code path, and keep the CSP change (it is required by the code path either way)."
      - "If png fails even with img-src blob: data:, add to this session a pending package 1.4 (spec in the session file) for the fallback design the spike recommends; do not implement it here."
      - "Testing policy (unattended): never run pnpm gate or any lint; check with node scripts/agents/run.mjs typecheck vscode and the spec's tests command."
    acceptance:
