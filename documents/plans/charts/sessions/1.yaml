        check: "htmlShell builds img-src with cspSource, data: and blob: for qmd-hosting webviews and leaves other webviews unchanged; Spaces likewise (tests on the CSP strings)"
      - id: A3
        check: toimage-spike.md records png, svg and colour bar results per host CSP and the decision
    tests:
