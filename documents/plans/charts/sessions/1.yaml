        - documents/plans/charts/tests/1.1/packages/vscode/__tests__/ui/cspImages.test.ts
      command: node scripts/agents/run.mjs test vscode --spec 1.1 --plan charts -- packages/vscode/__tests__/ui/cspImages.test.ts
