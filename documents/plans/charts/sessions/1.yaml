    decided:
      - "model.ts also exports `CHART_TRACE_TYPES: readonly ChartTraceType[]` (the ten types in the order of ChartTraceType). Column references are letters A..Z then AA.. (spreadsheet style). ticks is Plotly's dtick (a positive number); grid is whether grid lines show; legend is {show, x?, y?, orientation?}; an id is 8 lowercase hex."
      - "Plan D2, D3, D4, D13 (layout.camera is read and validated now: eye required, center and up optional, each {x, y, z} finite numbers rounded to 4 decimals; vars[].value is required and finite; the src field is read and validated now: a relative path under assets/, no '..', ending .csv). ChartFn is `{kind: 'y'|'x'|'param'|'polar'|'implicit'|'surface'|'param3d'|'curve3d', rel?: '='|'<'|'>'|'<='|'>=', expr: string[] (one per component), domain?: [number, number], domain2?: [number, number], steps?: number | [number, number], color?: string, name?: string, hidden?: boolean}`; the expressions are stored as text and not parsed here."
