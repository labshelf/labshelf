contracts: ["ui#implementation", "ui#notebook-flow", "code#modules", "code#files", "qmd-items#drawings", "qmd-items#project-notes", "library-format#project-folder-labshelf", "spaces", "collaboration"]
commands:
  - "node scripts/docs/doc.mjs ui#implementation"
  - "node scripts/docs/doc.mjs code#modules"
  - "pnpm --filter @labshelf/core tokens"
risks:
  - "UI rules (ui#implementation): reuse ui/dom widgets; tokens only, never edit tokens.css; shared icon set; classes only; no colour-only state (glyph plus words); check light, dark and widths."
  - "Code rules (code#modules): one concept per file up to 400 lines; files under 80 lines used by one sibling belong in that file; a subfolder is a module with index.ts; lint:modules enforces. 50 lines per function (ESLint)."
  - "code#files: write atomically, preserve unknown content, never overwrite unparsable files, handle partially synced files: a note may arrive before its CSV, so the block must show its stored image and a 'data file missing' state, never crash."
  - "No attachment mechanism for paper notes; project notes and Spaces have only write-only assets/<itemId>.png. Drawings and inline images embed data: URIs in the item body."
  - "Collaboration mirrors project files (core/src/collab/sharedFiles.ts, mirror/fileReconcile.ts); a sibling CSV in a project folder syncs only if sharedFiles accepts the path. Spaces are not shared. No contract documents a data file beside notes."
  - "VS Code webviews: input type=file is unreliable; plan a protocol message + showOpenDialog + workspace.fs.readFile. Browser: input type=file in the gesture works; drag-and-drop or paste of CSV text works in every host without a port."
