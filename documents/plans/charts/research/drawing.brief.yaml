risks:
  - "Contract (qmd-items.md:165-216): ONE top-level fenced div '::: {.labshelf-drawing source=<12 hex sha256 of tikz>}' with 5 parts in order: ```{=latex} guard \\makeatletter\\@ifundefined{tikzpicture}{\\iftrue}{<tikzpicture>\\iffalse}\\makeatother, PNG image line ![](data:image/png;base64,..){width=<cm>cm fig-alt=\"..\"}, ```{=latex} \\fi, ```{=labshelf-svg} one-line SVG, ```{=labshelf-drawing} one-line model JSON. Hand-edited TikZ (source mismatch) is shown and flagged. Anything else is kept as text (raw_block). Over 262144 UTF-8 bytes is neither written nor read. Writer uses \\n then the file eol. The node holds the raw bytes; unedited blocks are byte-identical."
  - "Version: unknown v is invalid (model.ts:164 returns null so the whole block becomes raw text). v:2 needs a contract change and a reader accepting 1 and 2; today's LabShelf shows a v:2 block as plain text, not as the stored figure."
  - "PDF: no LabShelf code builds a LaTeX header; the user's header with \\usepackage{tikz} makes Quarto PDF show TikZ and skip the PNG (the guard); HTML/Word use the PNG; labshelf-svg and labshelf-drawing fences are skipped by Pandoc. LabShelf never edits front matter. pgfplots would need \\usepackage{pgfplots} and its own guard on a pgfplots macro."
  - "Lazy load: the node view imports only drawingEditor/index.ts; hosts consume through esbuild splitting:true. The 60 KB limit appears only in documents/plans/drawings/plan.yaml:42,61; no automated check."
  - "Adding kinds touches state.ts, gestures.ts, canvas.ts hit testing, toolbar.ts, model.ts reader, layout/svg/tikz, sanitize allowlist (qmd/drawing/dom/sanitize.ts) and tests. Line counts: block 166, expr 225, layout 239, model 196, sample 131, svg 300, tikz 118; editor canvas 340, gestures 358, labelField 247, openDrawingEditor 333, snap 122, state 315, toolbar 147; drawingView 242. Src files are capped at 400 lines and test files at 500: several editor files have little room, so new behaviour goes in new files."
  - "documents/plans/drawings: sessions 1-4 done, session 5 blocked then merged later; its hand check (plan l.65) is not recorded as done."
