schema: brief/v1
area: drawing editor expression parser and sampler (chart function plots)
question: "what expr.ts and sample.ts support today, who calls them, tests, printer, other evaluators, math input"
sha: 37f97412
reuse:
  - {symbol: parseExpr, path: packages/core/src/qmd/drawing/expr.ts, lines: "217-225", why: "entry: returns {ok,evaluate(x)} or {ok:false,error,at}. 225 lines total. Recursive descent + tree-walk interpreter (evaluateNode 197-215), no eval, no compile step. Precedence: sum(115) < product(129, * / and implicit mult) < unary minus(143) < power(149, right-assoc, exponent may be signed 156). So -x^2 = -(x^2). Implicit mult when next token is a name, \\frac, ( or { (124-127): 4x, 2(x+1), x sin x. Function arg without parens binds to parsePower (189): cos x, sin x^2 = sin(x^2)."}
  - {symbol: FUNCTIONS/CONSTANTS, path: packages/core/src/qmd/drawing/expr.ts, lines: "21-30", why: "functions: sin cos tan asin acos atan arcsin arccos arctan sinh cosh tanh exp ln(natural) log(base10) sqrt abs floor ceil; all single-arg, trig in RADIANS; constants pi, e. LaTeX subset: \\frac{}{}, \\left( \\right), \\cdot, \\times, \\pi, \\sin etc, braces as groups (readCommand 45-58)."}
  - {symbol: Node (AST) and Token, path: packages/core/src/qmd/drawing/expr.ts, lines: "6-19", why: "AST: num | var (NO name, always x) | neg | bin(+ - * / ^) | call{fn: JS function, arg}. Node is not exported; call holds the closure not the function name, so a printer cannot recover the name without changing the node to carry it."}
  - {symbol: sampleFunction, path: packages/core/src/qmd/drawing/sample.ts, lines: "118-131", why: "1D only. (f, domain, range, maxPoints=400) -> Array<Array<[x,y]>> runs rounded to 4 sig digits. 64 base intervals, up to 6 adaptive bisection passes where turn angle > 5deg or at a finite/non-finite edge, capped by maxPoints. Non-finite y breaks runs (68-86); a jump taller than the range height breaks the run (78); runs clipped to range (92-116). No fixed step option, no 2D grid, no contour, no parametric."}
edit:
