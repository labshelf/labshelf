risks:
  - "Errors: ParseFailure {message, at offset} (expr.ts:32-34, 100-106). The tokenizer reads whole letter runs (73), so 'xy' or 'ax' is ONE unknown name: implicit multiplication between variables needs a tokenizer change for several variables."
  - "Case-sensitive; no theta/t/u/v/y names; no comparison tokens (<, <=, =), no commas, no multi-arg functions (min, max, atan2), no mod, no sec/csc/cot, no sign/round."
  - "Printer: none. No expr-to-string, LaTeX or pgfplots printer anywhere. pgfplots caveats: trig in degrees (need deg(x) or 'trig format plots=rad'), log is log10 there, ln ok, ^ ok, abs ok, pi ok."
  - "Other evaluators: none (no mathjs/mathlive/katex). expr.ts is the only math parser; no duplication risk."
  - "No MathLive/KaTeX input in the app. The only expression input is a plain text field in packages/core/src/qmd/dom/drawingEditor/labelField.ts (invalid on !parseExpr(...).ok, line 148); error message+offset shown from openDrawingEditor.ts:129-130."
  - "evaluate is a closure tree walk per sample; fine for 100x100 grids but consider a compile-to-closure step. round4 (sample.ts:5) is too coarse for grids/implicit solving; use raw samples internally."
  - "expr.ts is exported through packages/core/src/qmd/drawing/index.ts:4 (export *); keep evaluate(x) backward compatible (e.g. evaluate(x, env?)) for the 6 callers."
