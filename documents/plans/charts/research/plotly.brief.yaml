schema: brief/v1
area: current Plotly use (loader, figure/theme, CSP, toImage, bundling, tests, export fallbacks)
question: "what does a new labshelf-chart block rendered with Plotly reuse, and what constrains it (CSP, PNG export, bundling, tests, contracts)"
