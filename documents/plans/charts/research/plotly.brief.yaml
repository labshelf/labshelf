  - {symbol: preparePlotlyStyles, path: packages/core/src/qmd/dom/plotView.ts, lines: "25-46", why: "pre-creates the two empty <style> elements Plotly looks up by id, carrying the page nonce, so nonce-only style-src hosts work. The maplibre hash id is specific to 4.2.0."}
  - {symbol: PlotlyApi, path: packages/core/src/qmd/dom/plotView.ts, lines: "9-18", why: "the Plotly surface core calls: react, purge, relayout, downloadImage(png), Plots.resize. A chart that needs toImage or restyle must extend this interface (and the fake in the test harness)."}
  - {symbol: readPlotTheme, path: packages/core/src/qmd/dom/plotView.ts, lines: "71-90", why: "reads --ls-fg, --ls-desc, --ls-border-soft, --ls-font, --ls-bg and --qmd-plot-palette from computed style; sameTheme (92-95)."}
  - {symbol: toPlotlyFigure, path: packages/core/src/qmd/dom/plotView.ts, lines: "275-323", why: "builds {data, layout, config}: transparent backgrounds, theme font and colours, uirevision 'labshelf', config {displaylogo:false, responsive:true, displayModeBar:false, scrollZoom:false, doubleClick:false}. TRAP near 186: showscale stays false because the colour bar writes inline style attributes the nonce-only CSP blocks."}
  - {symbol: renderPlot, path: packages/core/src/qmd/dom/plotRender.ts, lines: "276-306", why: "the plot handle: loadPlotly, queued Plotly.react draws (pump 188, callReact 167), theme redraw (watchTheme 46-65, MutationObserver + prefers-color-scheme), update(spec), destroy() purges (262-272)."}
  - {symbol: PlotHandle.downloadPng, path: packages/core/src/qmd/dom/plotRender.ts, lines: "258-261", why: "the only image export of a plot: downloadImage(root,{format:'png'}); wired to the Download PNG tool at outputPlot.ts:95. Plotly.toImage is not used anywhere."}
  - {symbol: paintDrawingPng, path: packages/core/src/qmd/drawing/dom/png.ts, lines: "1-6", why: "drawing PNG painter with Path2D, loads no image, so it needs no img-src or blob:. A CSP-safe precedent if toImage fails."}
