risks:
  - "Loading: dynamic import only (plotView.ts:59). plotly-strict.min.js is 5,183,835 bytes; esbuild splits it into a lazy chunk loaded on the first plot."
  - "CSP, source editor webview (htmlShell.ts:18): nonce-only script/style, no img-src unless dataImages, never blob:. Reader webview (vscode/src/reader/shell.ts:60): style-src 'unsafe-inline', img-src cspSource blob: data:. Spaces (vscode/src/spaces/view.ts:179): nonce-only, no img-src. Browser extension pages: script-src 'self' 'wasm-unsafe-eval' only, no style-src or img-src restriction."
  - "Strict dist has no eval or new Function. Inline style attributes are still blocked (colour bar trap at plotView.ts:186): colourscale charts need the colour bar, so verify or work around it. The renderer spike is documents/plans/interactive-plots/research/renderer-spike.md."
  - "toImage: the strict bundle contains toImage and downloadImage. It rasterises the SVG by loading it as an <img> from a blob: URL (data: on Safari and for svg), draws on a canvas and calls toDataURL. So PNG export needs img-src blob: (or data:), which the source editor webview does not give. downloadPng is likely broken in the VS Code editor webview today; untested."
  - "toImage format 'svg' returns the SVG string as a data URL without needing a canvas; the SVG itself could be rasterised by a CSP-safe path or the host could add img-src blob: to the editor shell."
  - "No dist in this worktree, plotly.js-strict-dist-min is not installed here (only in the main checkout's node_modules): run pnpm install before building."
  - "No jest mock for plotly; all tests inject a fake loader."
  - "Cell plots' PNG comes from the cell driver, not the browser; nothing in core turns a plot into PDF/LaTeX. A chart needs its own fallback (PNG line) in its contract."
