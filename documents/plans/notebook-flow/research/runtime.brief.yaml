risks:
  - "Today: Mathematica any Message = error (result replaced by the message text); Python warnings neither captured nor reported; R warnings appended to the text, lost with a PNG; R message() and Python stderr not captured."
  - "CellResult crosses to webviews through helper/helperMessages.ts, libraryUi/protocol/messages.ts, spaces/spacesProtocol.ts, reader/protocol/messages.ts (math-in-prose session 2 already landed evalMath there); a new optional field must be accepted by each parser."
  - "durationMs includes queue wait and spawn; not stored in the output block (only ran is)."
  - "math-in-prose D13 lists warnings in ordinary cells as out of scope, so this plan owns it."
