risks:
  - "Stores: VS Code webviews = acquireVsCodeApi getState/setState (webviewGlobals.d.ts:9-10), per panel, replaces everything: merge and key by note. Browser = localStorage via prefs.ts. Reader sidecar is on disk and synced: not for fold state. No per-note view-state store exists."
  - "Core is host-agnostic: fold state is injected as a port (load/save callbacks), never localStorage in core."
  - "No cross-item run coordinator exists; each host posts per-cell runCell with its own requestId."
  - "Runs write outputs back; a run flushes drafts first (notesTab save.flush, flushBeforeRun). Run all must flush once."
  - "Mixed languages run in parallel host-side; note order holds only if the coordinator awaits each cell's end before the next."
  - "math-in-prose session 3 edits notesTab, cellRuns, paneState, mountSpaceNotes, projectNoteTab (onEvalMath wiring): ranges move."
  - "No test for browser projectNoteTab.ts."
