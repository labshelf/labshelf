  - id: "2.1"
    plan: notebook-flow
    sha: 69a0bc79
    goal: "packages/core/src/qmd/noteRuns.ts: a runtime-neutral coordinator over NotebookCell targets that runs a scope sequentially, stops at the first non-ok end, reports progress and cancels as one (D4, D6)."
    level: behaviour
    runner: {agent: implementer, model: opus}
    depends_on: ["2.0"]
    create:
      - packages/core/src/qmd/noteRuns.ts
    edit:
      - {path: packages/core/src/qmd/index.ts, lines: "1-40", why: "export the coordinator and its types"}
    read:
      - {path: documents/plans/notebook-flow/research/hosts.brief.yaml, lines: "1-60", why: "per-host editors, flush, per-language host queues"}
      - {path: packages/core/src/qmd/compute/cellRunner.ts, lines: "1-84", why: "CellRunState end states (done, error, cancelled, missing; timeout maps to error)"}
    seams:
      - {path: packages/core/src/qmd/noteRuns.ts, signature: "export type CellRunEnd = 'ok' | 'error' | 'cancelled' | 'missing'"}
      - {path: packages/core/src/qmd/noteRuns.ts, signature: "export interface NotebookCell { readonly key: string; readonly itemId: string; readonly language: string; readonly sectionKeys: readonly string[]; run(): Promise<CellRunEnd>; cancel(): void; setQueue(state: 'queued' | 'not-run' | null): void }"}
      - {path: packages/core/src/qmd/noteRuns.ts, signature: "export type RunScope = { kind: 'all' } | { kind: 'above'; cell: string } | { kind: 'below'; cell: string } | { kind: 'section'; section: string } | { kind: 'restartAll' }"}
      - {path: packages/core/src/qmd/noteRuns.ts, signature: "export interface NoteRunsOptions { cells(): readonly NotebookCell[]; flush(): Promise<void> | void; restart(language: string): Promise<void>; onProgress?(progress: { done: number; total: number; running: string | null } | null): void }"}
      - {path: packages/core/src/qmd/noteRuns.ts, signature: "export function createNoteRuns(options: NoteRunsOptions): { run(scope: RunScope): Promise<{ ran: number; stoppedAt: string | null; end: CellRunEnd }>; stop(): void; readonly running: boolean }"}
    decided:
      - "Plan D4, D6. cells() is read when a run starts (note order across items, from the host)."
      - "above(cell) = every cell before it, exclusive; below(cell) = the cell and all after it; section(key) = cells whose sectionKeys include key; restartAll = restart(language) once per distinct language among the cells, in first-appearance order, then all."
      - "At start: flush once, setQueue('queued') on every cell of the scope; before running one, setQueue(null). On a non-ok end: stop, setQueue('not-run') on each remaining cell, resolve with stoppedAt = that cell's key."
      - "stop(): cancel the running cell, setQueue(null) on the rest (not 'not-run'), resolve with end 'cancelled'. A second run while one runs is refused (returns the first's promise)."
      - "onProgress after every change, and null at the end. No DOM, no host messages in this file."
    acceptance:
      - {id: 2.1a, check: "all runs every cell once in order, awaiting each; the second cell starts only after the first resolves"}
      - {id: 2.1b, check: "above, below and section select the specified cells; restartAll restarts each language once before running"}
      - {id: 2.1c, check: "an error in cell 2 of 4 stops the run; cells 3 and 4 get not-run and never run"}
      - {id: 2.1d, check: "stop() cancels the running cell and clears the queue of the others"}
      - {id: A2, check: "scopes in note order, stop at first error, Not run after"}
    tests:
      none: "pending: written in 2.0"
