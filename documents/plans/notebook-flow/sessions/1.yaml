    decided:
      - Plan D1, D3. Today cellState carries only a state string and the result reaches the view only through the written document, so the run info needs its own path; this package is that path, end to end, and nothing renders it yet (1.3 does).
      - 'Message fields are flat and optional: `{type: "cellState", requestId, state, durationMs?, warnings?}` (and paper./space. alike); warnings present only when non-empty. Host-to-view messages are not validated today; keep it so. The reader PROTOCOL_VERSION is not bumped (optional field, host and view ship together).'
      - createCellRuns posts info {durationMs, warnings?} with the end state of a non-preview run whose port returned a result (done or error, including timeout); never with running, cancelled, missing, or after a thrown failure.
      - "Helper parser: `warnings` is kept only when it is an array of at most 21 strings each at most 500 characters; anything else drops the field and keeps the rest of cellResult. PROTOCOL_VERSION is bumped only if the helper parser refuses unknown fields today; record which in the helper contract."
      - cellRunStatus.ts exports `const CELL_RAN_EVENT = "qmd-cell-ran"`; the event is a CustomEvent<CellRunInfo> dispatched on the .qmd-cell element, bubbles false.
      - "CellRunGroup.show: on an end state with info for a normal run, dispatch `new CustomEvent(CELL_RAN_EVENT, {detail: info})` on the `.qmd-cell.is-run-requested` element of that row before the class is removed; previews dispatch nothing."
      - Existing tests that compare a whole done or error cellState with toEqual (e.g. packages/core/__tests__/reader/cellMessages.test.ts, packages/core/__tests__/spaces/serveSpacesCells.test.ts) are updated to expect durationMs; that is the intended change, not a regression.
