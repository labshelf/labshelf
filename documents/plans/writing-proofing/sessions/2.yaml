schema: session/v1
id: "2"
goal: "The source editor uses the core proofing logic: spelling and rule diagnostics with actions (D6), Ctrl+Space corrections and completions (D7) and the install notice (D8), all behind the optional proofing dep."
depends_on: ["1"]
owns:
  - packages/core/src/writing/dom/sourceEditor/
  - packages/core/__tests__/writing/dom/sourceEditor/
status: pending
packages:
  - id: "2.1"
    plan: writing-proofing
    sha: ca526c265
    goal: "A proofing extension (sourceEditor/proofing.ts) that resolves the document language, loads the checker from the store, and runs a linter() source of spelling and simple-rule diagnostics over the visible prose, with Add to dictionary, Ignore in this file and rule fixes; wired through SourceEditorDeps.proofing for LaTeX and Typst (D6)."
    level: behaviour
    runner: {agent: implementer, model: sonnet}
    edit:
      - {path: packages/core/src/writing/dom/sourceEditor/proofing.ts, lines: "1-1", why: "state field with language + checker status, linter source, actions"}
      - {path: packages/core/src/writing/dom/sourceEditor/editor.ts, lines: "182-249", why: "SourceEditorDeps.proofing?: ProofingSetting; add the extension in sourceLanguage for latex and both typst branches"}
      - {path: packages/core/src/writing/dom/sourceEditor/index.ts, lines: "1-20", why: "export ProofingSetting"}
      - {path: packages/core/__tests__/writing/dom/sourceEditor/proofing.test.ts, lines: "1-1", why: "tests with a fake DictionaryStore over the real en/pt files"}
    read:
      - {path: packages/core/src/writing/dom/sourceEditor/editor.ts, lines: "132-174", why: "applyProblems uses setDiagnostics; lint keymap"}
      - {path: packages/core/src/writing/dom/sourceEditor/mathPreview.ts, lines: "10-60", why: "setting shape"}
      - {path: packages/core/src/writing/proofing/index.ts, lines: "1-400", why: "session 1 API"}
    decided:
      - "ProofingSetting = {store: DictionaryStore; enabled: boolean; disable(): void}. enabled false or absent: the extension is not added."
      - "State: a StateField holding {language: DocumentLanguage; status: 'loading' | 'ready' | 'missing' | 'unsupported' | 'failed'; checker?}. The language is re-detected when a change touches the preamble (before \\begin{document}) or a #set text line, debounced 500 ms; a changed tag reloads the checker. Checkers are cached per tag per store (module-level WeakMap keyed by store)."
      - "linter(source, {delay: 400}): only for status ready; window = visible ranges ±2000 chars merged; prose via findProseRanges(format, text, from, to); words not check()-ed and not in the per-file ignore set → Diagnostic {severity: 'warning', source: 'spelling', message: '\"<word>\" is not in the <Language> dictionary. Ctrl+Space shows corrections.', actions: Add to dictionary, Ignore in this file}; rule findings → severity 'info', source 'writing', action 'Fix' applying the fix. Cap 500 diagnostics."
      - "Add to dictionary: store.addUserWord(word), checker.addWord(word), then forceLinting. Ignore in this file: an in-memory Set in the state field."
      - "Build problems (applyProblems/setDiagnostics) and linter diagnostics must coexist: if setDiagnostics replaces linter output in @codemirror/lint 6.9, move build problems to their own linter source or merge both in applyProblems; a test pins that both survive each other's updates."
      - "Expose for 2.2 and 2.3: proofingStateOf(state) and a ProofingStatus effect; the store and checker getters."
      - "Testing policy: run only typecheck core and the listed tests."
    acceptance:
      - {id: "2.1a", check: "a LaTeX doc with \\usepackage[brazilian]{babel} and 'nao sei' gets one spelling diagnostic on 'nao'; '\\cite{nao}' and '$nao$' get none; English doc with 'teh' gets one"}
      - {id: "2.1b", check: "Add to dictionary calls store.addUserWord and removes the diagnostic; Ignore in this file removes it for that file only"}
      - {id: "2.1c", check: "'the the' gets an info diagnostic whose Fix leaves 'the'; build problems set through applyProblems are still present after linting, and spelling diagnostics after applyProblems"}
      - {id: "2.1d", check: "a Typst editor without openTab also gets diagnostics; with proofing absent or enabled false there are none"}
      - {id: A2, check: "misspellings flagged, markup never, build problems kept"}
      - {id: A3, check: "simple rules flagged with a working fix"}
      - {id: A6, check: "core half: Add to dictionary calls the store; disabled proofing shows nothing"}
    tests:
      hidden: []
      command: node scripts/agents/run.mjs test core --spec 2.1 --plan writing-proofing -- packages/core/__tests__/writing/dom/sourceEditor/proofing.test.ts
    commands:
      - node scripts/agents/run.mjs typecheck core
  - id: "2.2"
    plan: writing-proofing
    sha: ca526c265
    goal: "A word CompletionSource answering only on explicit completion (Ctrl+Space) inside prose: corrections for a misspelled word, else dictionary completions, inflections and document words; added to the LaTeX and Typst completion lists (D7)."
    level: behaviour
    runner: {agent: implementer, model: sonnet}
    depends_on: ["2.1"]
    edit:
      - {path: packages/core/src/writing/dom/sourceEditor/wordCompletion.ts, lines: "1-1", why: "the source"}
      - {path: packages/core/src/writing/dom/sourceEditor/latex.ts, lines: "136-153", why: "add the source last in override"}
      - {path: packages/core/src/writing/dom/sourceEditor/typst.ts, lines: "159-175", why: "add it to the Typst override"}
      - {path: packages/core/src/writing/dom/sourceEditor/editor.ts, lines: "243-249", why: "Typst without openTab gets autocompletion with only the word source"}
      - {path: packages/core/__tests__/writing/dom/sourceEditor/wordCompletion.test.ts, lines: "1-1", why: "tests"}
    read:
      - {path: packages/core/src/writing/dom/sourceEditor/typst.ts, lines: "84-102", why: "explicit-aware source pattern"}
      - {path: packages/core/src/writing/dom/sourceEditor/proofing.ts, lines: "1-400", why: "proofingStateOf from 2.1"}
    decided:
      - "Returns null when !context.explicit, when the caret is not in a prose range, or when proofing status is not ready. Word before the caret via matchBefore(/[\\p{L}\\p{M}'’-]+/u)."
      - "Misspelled whole word (caret at its end): options = checker.suggest(word) in order, type 'text', boost descending, label replaces the whole word. Otherwise prefix completions: document words (prose words of the doc with the prefix, frequency-ranked, excluding the prefix itself) first, then checker.complete(prefix); case follows the typed prefix (capitalised prefix → capitalised options). filter: false for corrections, validFor the word regex."
      - "Another source (citation, reference, command, Typst service) that returns a result wins: the word source returns null when the text before the caret matches a command or a cite/ref argument context."
      - "Testing policy: run only typecheck core and the listed tests."
    acceptance:
      - {id: "2.2a", check: "typing 'comput' with activateOnTyping produces no word options; explicit completion at 'comput' in a pt-BR doc lists 'computador' and 'computadores'"}
      - {id: "2.2b", check: "explicit completion at the end of 'nao' lists 'não' first and applying it replaces the word; inside \\cite{..} and $..$ the word source returns null"}
      - {id: "2.2c", check: "a word used earlier in the document is offered before dictionary words; Typst with and without openTab offers words"}
      - {id: A4, check: "no completion on typing; Ctrl+Space corrections and completions in LaTeX and Typst"}
    tests:
      hidden: []
      command: node scripts/agents/run.mjs test core --spec 2.2 --plan writing-proofing -- packages/core/__tests__/writing/dom/sourceEditor/wordCompletion.test.ts
    commands:
      - node scripts/agents/run.mjs typecheck core
  - id: "2.3"
    plan: writing-proofing
    sha: ca526c265
    goal: "The install notice: a top panel shown when the language's dictionary is missing (Install / Not now, busy, error with Retry) or unsupported (dismiss), styled with core ui tokens (D8)."
    level: behaviour
    runner: {agent: implementer, model: opus}
    depends_on: ["2.1"]
    edit:
      - {path: packages/core/src/writing/dom/sourceEditor/proofingNotice.ts, lines: "1-1", why: "showPanel provider driven by the proofing state"}
      - {path: packages/core/src/writing/dom/sourceEditor/editorTheme.ts, lines: "1-400", why: "panel styles as EditorView theme rules over --ls-* tokens (no core TS imports a .css)"}
      - {path: packages/core/src/writing/dom/sourceEditor/proofing.ts, lines: "1-400", why: "include the notice extension; Install → store.install(tag) then reload the checker"}
      - {path: packages/core/__tests__/writing/dom/sourceEditor/proofingNotice.test.ts, lines: "1-1", why: "tests"}
    read:
      - {path: packages/core/src/writing/dom/sourceEditor/toolbar.ts, lines: "1-40", why: "button rendering helpers"}
      - {path: packages/core/src/ui/dom/widgets/page.ts, lines: "124-150", why: "notice styling precedent"}
    decided:
      - "Read `node scripts/docs/doc.mjs ui#implementation` first. Use existing core/ui/dom buttons and --ls-* tokens; no hard-coded colours; works in light and dark."
      - "Missing: 'No <name> dictionary installed.' + buttons Install (primary) and Not now. Busy: 'Installing the <name> dictionary…' with buttons disabled. Failed: 'Could not install the <name> dictionary: <error>.' + Retry and Not now. Unsupported: 'Spelling is not available for <name>.' + Dismiss. Not now and Dismiss hide the panel for this editor until the language changes."
      - "role=status on the panel text; buttons are real <button>s reachable by keyboard."
      - "Testing policy: run only typecheck core and the listed tests."
    acceptance:
      - {id: "2.3a", check: "a fr document with a store that lacks fr shows the panel; Install calls store.install('fr'), shows the busy state, then hides the panel and diagnostics appear"}
      - {id: "2.3b", check: "a rejected install shows the error text and Retry; Not now hides it; an unsupported language shows the unsupported text"}
      - {id: A5, check: "core half: the notice installs through the store, then checking starts; failure shows Retry"}
    tests:
      hidden: []
      command: node scripts/agents/run.mjs test core --spec 2.3 --plan writing-proofing -- packages/core/__tests__/writing/dom/sourceEditor/proofingNotice.test.ts
    commands:
      - node scripts/agents/run.mjs typecheck core
