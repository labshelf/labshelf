schema: session/v1
id: "3"
goal: "VS Code: en-US and pt-BR ship in the VSIX, other dictionaries download into globalStorageUri through the extension host, user words persist on the machine, and labshelf.writing.spelling toggles it (D5, D9, D10)."
depends_on: ["2"]
owns:
  - packages/core/src/writing/protocol.ts
  - packages/core/__tests__/writing/protocol.test.ts
  - packages/vscode/
status: pending
packages:
  - id: "3.1"
    plan: writing-proofing
    sha: ca526c265
    goal: "Protocol and webview side: request methods dictionaryList, dictionaryRead, dictionaryInstall, userWords, addUserWord in the source editor protocol, and a DictionaryStore in the webview built on them, passed as deps.proofing with the Init flag."
    level: contract
    runner: {agent: implementer, model: sonnet}
    edit:
      - {path: packages/core/src/writing/protocol.ts, lines: "30-275", why: "methods in SourceEditorRequestMethod and PARAMS (tag: string; word: string); Init gains spelling: boolean"}
      - {path: packages/core/__tests__/writing/protocol.test.ts, lines: "1-400", why: "parser cases for each method"}
      - {path: packages/vscode/src/writing/sourceEditor/webview/hostPorts.ts, lines: "20-60", why: "dictionaryStore port over ask()"}
      - {path: packages/vscode/src/writing/sourceEditor/webview/sourceEditorEntry.ts, lines: "227-256", why: "proofing: {store, enabled: init.spelling !== false, disable: ports.request('disableSpelling')}"}
    read:
      - {path: documents/plans/writing-proofing/research/hosts.brief.yaml, lines: "1-400", why: "protocol and CSP facts"}
    decided:
      - "Bytes cross postMessage as Uint8Array (structured clone); dictionaryRead returns {aff, dic} or null. The webview never fetches (CSP has no connect-src)."
      - "disableSpelling is a request like disableMathPreview."
    acceptance:
      - {id: "3.1a", check: "the protocol parser accepts each new method with valid params and rejects missing tag/word"}
      - {id: "3.1b", check: "the webview store's read('pt-BR') posts dictionaryRead and resolves with the reply bytes"}
    tests:
      hidden: []
      command: node scripts/agents/run.mjs test core --spec 3.1 --plan writing-proofing -- packages/core/__tests__/writing/protocol.test.ts
    commands:
      - node scripts/agents/run.mjs typecheck core
      - node scripts/agents/run.mjs typecheck vscode
  - id: "3.2"
    plan: writing-proofing
    sha: ca526c265
    goal: "Extension host: a NodeDictionaryStore (bundled files in dist/dictionaries, downloads and user words under globalStorageUri/dictionaries), the bridge cases, the build copy of dictionary-en and dictionary-pt with their licenses, and the labshelf.writing.spelling setting."
    level: contract
    runner: {agent: implementer, model: sonnet}
    depends_on: ["3.1"]
    edit:
      - {path: packages/vscode/src/writing/sourceEditor/node/dictionaryStore.ts, lines: "1-1", why: "store: list = bundled + installed dirs; read; install via core fetchDictionary with global fetch, written atomically (temp then rename); user words in words.txt"}
      - {path: packages/vscode/src/writing/sourceEditor/bridges.ts, lines: "160-215", why: "answer() cases"}
      - {path: packages/vscode/src/writing/sourceEditor/provider.ts, lines: "20-100", why: "deps carry the store; Init spelling from configuration"}
      - {path: packages/vscode/src/writing/sourceEditor/index.ts, lines: "1-22", why: "build the store from context.globalStorageUri and extensionUri"}
      - {path: packages/vscode/package.json, lines: "1352-1356", why: "labshelf.writing.spelling boolean default true, description"}
      - {path: packages/vscode/build/host.mjs, lines: "84-93", why: "copyDictionaries: node_modules dictionary-en, dictionary-pt index.aff/.dic + license into dist/dictionaries/<tag>/"}
      - {path: packages/vscode/__tests__/writing/sourceEditor/dictionaryStore.test.ts, lines: "1-1", why: "tests over a temp dir and fake fetch"}
      - {path: packages/vscode/__tests__/writing/sourceEditor/bridges.test.ts, lines: "1-400", why: "bridge cases"}
    read:
      - {path: packages/vscode/src/reader/node/pdfjs.ts, lines: "20-30", why: "globalStorageUri cache precedent"}
      - {path: packages/vscode/src/writing/sourceEditor/bridges.ts, lines: "170-180", why: "disableMathPreview write to config: copy for disableSpelling"}
    decided:
      - "Layout: <globalStorage>/dictionaries/<tag>/index.aff|index.dic and <globalStorage>/dictionaries/words.txt (one word per line). Bundled tags are read from <extension>/dist/dictionaries/<tag>/."
      - "install of a bundled tag is a no-op; a failed download leaves no partial dir; errors go to the ILogger with context and are rethrown with a readable message."
      - "Check the VSIX file rules (package.json files / .vscodeignore) so dist/dictionaries is packed."
    acceptance:
      - {id: "3.2a", check: "list() includes en-US and pt-BR from the bundled dir and an installed fr after install('fr') with a fake fetch; a 404 leaves no fr dir"}
      - {id: "3.2b", check: "addUserWord persists to words.txt and userWords() returns it from a new store instance"}
      - {id: "3.2c", check: "the host build writes dist/dictionaries/en-US and pt-BR with their license files"}
      - {id: A7, check: "VS Code half: en-US and pt-BR in the VSIX dist"}
      - {id: A8, check: "typecheck and the vscode suite pass"}
      - {id: A9, check: "by hand in VS Code (the user)"}
    tests:
      hidden: []
      command: node scripts/agents/run.mjs test vscode --spec 3.2 --plan writing-proofing -- packages/vscode/__tests__/writing/sourceEditor/dictionaryStore.test.ts packages/vscode/__tests__/writing/sourceEditor/bridges.test.ts
    commands:
      - node scripts/agents/run.mjs typecheck vscode
      - node scripts/agents/run.mjs build vscode
