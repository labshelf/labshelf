schema: session/v1
id: "4"
goal: "Browser extension: en-US and pt-BR ship in the build, other dictionaries download from jsDelivr into a separate IndexedDB database, user words persist on the device, and a Spelling toggle sits next to Math preview (D5, D9, D10)."
depends_on: ["2"]
owns:
  - packages/browser/
  - packages/core/src/libraryUi/prefs.ts
status: pending
packages:
  - id: "4.1"
    plan: writing-proofing
    sha: ca526c265
    goal: "An IdbDictionaryStore (bundled files read by relative URL from the extension, downloads and user words in the 'labshelf-dictionaries' IndexedDB), the vendorDictionaries build step, the spelling pref and toggle, and deps.proofing in sourceTab.ts."
    level: contract
    runner: {agent: implementer, model: sonnet}
    edit:
      - {path: packages/browser/src/storage/dictionaries.ts, lines: "1-1", why: "store over its own IndexedDB (idb library), stores 'files' (tag → {aff, dic}) and 'words'"}
      - {path: packages/browser/build/vendorDictionaries.mjs, lines: "1-1", why: "copy dictionary-en / dictionary-pt aff, dic and license into dist/<target>/libraryPage/dictionaries/<tag>/"}
      - {path: packages/browser/build/build.mjs, lines: "76-79", why: "run the new step"}
      - {path: packages/browser/src/libraryUi/editorArea/sourceTab.ts, lines: "80-125", why: "proofing: {store, enabled: prefs.spelling(), disable: save pref + toast}"}
      - {path: packages/browser/src/libraryUi/prefs.ts, lines: "26-105", why: "spelling() / saveSpelling() and the toggle next to Math preview"}
      - {path: packages/core/src/libraryUi/prefs.ts, lines: "37-69", why: "deriveSpelling like deriveMathPreview (stored only when false) — owned by this session for this edit only"}
      - {path: packages/browser/__tests__/storage/dictionaries.test.ts, lines: "1-1", why: "tests with fakeIdb and a fake fetch"}
    read:
      - {path: packages/browser/build/vendorFonts.mjs, lines: "1-24", why: "vendor step model; how fonts are referenced at runtime (relative URL)"}
      - {path: packages/browser/__tests__/support/fakeIdb.ts, lines: "1-400", why: "IndexedDB fake"}
      - {path: packages/browser/manifest.firefox.json, lines: "30-95", why: "confirm host permissions and CSP allow the jsDelivr fetch on Firefox"}
    decided:
      - "Bundled read: fetch(new URL('./dictionaries/<tag>/index.aff', document.baseURI or the page URL)) from the library page; never the library IndexedDB."
      - "install(tag) uses core fetchDictionary with window fetch, then one IndexedDB transaction; a failure stores nothing."
      - "If the Firefox manifest lacks a permission for cdn.jsdelivr.net, add it to host_permissions in both manifests and state it in the report (manifest change)."
    acceptance:
      - {id: "4.1a", check: "list() includes en-US and pt-BR and, after install('fr') with a fake fetch, fr; a failed fetch stores nothing; read('fr') returns the bytes from a new store instance"}
      - {id: "4.1b", check: "addUserWord persists and userWords() returns it after reopening the database"}
      - {id: "4.1c", check: "the chrome build output contains libraryPage/dictionaries/en-US and pt-BR with their license files"}
      - {id: "4.1d", check: "spelling() defaults to true; saving false hides proofing in the next mounted source editor"}
      - {id: A7, check: "browser half: en-US and pt-BR in the extension build"}
      - {id: A9, check: "by hand in the browser (the user)"}
    tests:
      hidden: []
      command: node scripts/agents/run.mjs test browser --spec 4.1 --plan writing-proofing -- packages/browser/__tests__/storage/dictionaries.test.ts
    commands:
      - node scripts/agents/run.mjs typecheck browser
      - node scripts/agents/run.mjs build browser
