  - id: "1.3"
    plan: multi-language-cells
    sha: 006c2a0b
    goal: "A node session manager runs one persistent driver per (note key, language) with the D3 protocol, lazy start, idle close, cancel/timeout as kill plus restarted flag, restart and dispose."
    level: behaviour
    runner: {agent: implementer, model: opus}
    depends_on: ["1.2"]
    create:
      - packages/core/src/qmd/compute/node/cellSessions.ts
    edit:
      - {path: packages/core/src/latex/node/run.ts, lines: "62-143", why: "export killTree and createKillSwitch for reuse"}
    read:
      - {path: documents/plans/multi-language-cells/research/runtime.brief.yaml, lines: "1-60", why: "risks: leaks, framing, Windows"}
      - {path: packages/core/src/qmd/compute/node/nodeCellRunner.ts, lines: "1-78", why: "result mapping to reuse"}
    seams:
      - {path: packages/core/src/qmd/compute/node/cellSessions.ts, signature: "export interface DriverLaunch { command: string; args: string[]; env?: Record<string, string> }; export interface CellSessionsOptions { launch(language: CellLanguage): Promise<DriverLaunch | undefined>; idleMs?: number; now?: () => number; logger?: ILogger }; export function createCellSessions(options: CellSessionsOptions): ICellRunner"}
    decided:
      - "launch returning undefined gives {status: missing, language}."
      - "Requests are serialised per process; ids are a counter; a response line is the sentinel \u0001LABSHELF\u0001 followed by JSON {id, latex?|text?|error?}; other stdout and stderr lines are collected and appended to the result text."
      - "Timeout counts from the write of the request, not from spawn. Cancel or timeout kill the process tree; the next run on that key spawns anew and returns restarted: true."
      - "A process that exits on its own is dropped; the run in flight returns error with the stderr tail; the next run returns restarted: true."
      - "Idle timer (default 10 min) is unref'd; dispose kills every process and resolves when they exit."
      - "spawn with stdio pipes, cwd from opts, env PYTHONIOENCODING=utf-8 plus launch.env; split lines on \r?\n; detached on POSIX for group kill."
      - "Tests use a fake driver: a small node script in the test folder speaking the protocol (echo, keep a variable, sleep, exit), so no Python, Wolfram or R is needed."
    acceptance:
      - {id: 1.3a, check: "two runs on one key share state in the fake driver; two keys do not"}
      - {id: 1.3b, check: "prints before the response line end up in the result text and do not break the next run"}
      - {id: 1.3c, check: "cancel and timeout kill the process; the next run returns restarted: true"}
      - {id: 1.3d, check: "restart kills without running; idle close after idleMs; dispose leaves no child process"}
      - {id: 1.3e, check: "launch undefined gives status missing with the language"}
      - {id: A3, check: "cancel, timeout and restart kill; next run starts fresh with restarted; idle close; dispose leaves no driver"}
    tests:
      hidden: [documents/plans/multi-language-cells/tests/1.3/cellSessions.test.ts]
      command: "node scripts/agents/run.mjs test core --spec 1.3 --plan multi-language-cells -- packages/core/__tests__/qmd/compute/node"
