schema: session/v1
id: "2"
goal: Python, Mathematica and R each have a persistent driver and a launcher, and the node runner dispatches cells by language through the session manager.
depends_on: ["1"]
owns:
  - packages/core/src/qmd/compute/node/
  - packages/core/__tests__/qmd/compute/node/
  - packages/vscode/scripts/
  - packages/vscode/package.json
status: pending
packages:
  - id: "2.1"
    plan: multi-language-cells
    goal: "cellDriver.py becomes a persistent D3 driver with one namespace per process, and createNodeCellRunner runs Python through createCellSessions."
    level: behaviour
    runner: {agent: implementer, model: sonnet}
    edit:
      - {path: packages/core/src/qmd/compute/node/cellDriver.py, lines: "1-27", why: "stdin loop, framed responses, same SymPy rule"}
      - {path: packages/core/src/qmd/compute/node/nodeCellRunner.ts, lines: "1-78", why: "build on createCellSessions; python launch from PythonProvider"}
    read:
      - {path: packages/core/src/qmd/compute/node/cellSessions.ts, lines: "1-200", why: "the manager from 1.3"}
      - {path: packages/core/src/qmd/compute/node/managedPython.ts, lines: "11-119", why: "PythonProvider"}
    seams:
      - {path: packages/core/src/qmd/compute/node/nodeCellRunner.ts, signature: "export function createNodeCellRunner(options: { python: PythonProvider; drivers: { python: string; mathematica: string; r: string }; locate?: (language: \"mathematica\" | \"r\") => Promise<string | undefined>; logger?: ILogger }): ICellRunner"}
    decided:
      - "The driver keeps one globals dict for the life of the process; sys.path has the cwd; the last expression rule and the SymPy to LaTeX rule are unchanged."
      - "python missing (provider status missing) gives status missing, language python."
      - "Mathematica and R launchers come from 2.2 and 2.3; until then locate returns undefined for them."
      - "Tests that need real Python skip without it, as today."
    acceptance:
      - {id: 2.1a, check: "with managed Python, x = 2 then x + 1 gives 3 in one note key; a SymPy cell still gives LaTeX"}
      - {id: 2.1b, check: "a print in a cell appears as text and the result still parses"}
      - {id: A2, check: "state shared within a note per language and not across notes (fake drivers; real ones when installed)"}
    tests:
      hidden: [documents/plans/multi-language-cells/tests/2.1/pythonDriver.test.ts]
      command: "node scripts/agents/run.mjs test core --spec 2.1 --plan multi-language-cells -- packages/core/__tests__/qmd/compute/node"
  - id: "2.2"
    plan: multi-language-cells
    goal: "cellDriver.wl runs Wolfram Language cells persistently through wolframscript and returns TeXForm, and locateTool finds wolframscript and Rscript per D6."
    level: behaviour
    runner: {agent: implementer, model: sonnet}
    depends_on: ["2.1"]
    create:
      - packages/core/src/qmd/compute/node/cellDriver.wl
      - packages/core/src/qmd/compute/node/locateTool.ts
    edit:
      - {path: packages/core/src/qmd/compute/node/nodeCellRunner.ts, lines: "1-120", why: "mathematica launch: wolframscript -file cellDriver.wl"}
    read:
      - {path: packages/core/src/latex/node/systemTex.ts, lines: "1-80", why: "findExecutable to reuse"}
    seams:
      - {path: packages/core/src/qmd/compute/node/locateTool.ts, signature: "export function locateTool(tool: \"wolframscript\" | \"Rscript\", options?: { override?: string; platform?: NodeJS.Platform; env?: NodeJS.ProcessEnv; exists?: (path: string) => Promise<boolean> }): Promise<string | undefined>"}
    decided:
      - "The driver reads lines with ReadLine on the stdin stream, parses JSON with ImportString[line, \"RawJSON\"], evaluates with ToExpression in one context kept for the process, and writes the sentinel line with ExportString[assoc, \"RawJSON\", \"Compact\" -> True]."
      - "Null result gives no latex and no text; String gives text; anything else gives latex ToString[TeXForm[expr]]; a Message or $Failed gives error with the message text."
      - "locateTool: override first, then PATH, then the D6 locations for the platform; exists is injectable for tests."
      - "Real-wolframscript tests skip when locateTool finds nothing."
    acceptance:
      - {id: 2.2a, check: "locateTool finds a fake tool on PATH and in each D6 location, and prefers the override"}
      - {id: 2.2b, check: "with wolframscript installed, x = 2 then x + 1 gives 3 and Integrate[x^2, x] gives LaTeX for x^3/3"}
    tests:
      hidden: [documents/plans/multi-language-cells/tests/2.2/locateTool.test.ts, documents/plans/multi-language-cells/tests/2.2/wolframDriver.test.ts]
      command: "node scripts/agents/run.mjs test core --spec 2.2 --plan multi-language-cells -- packages/core/__tests__/qmd/compute/node"
  - id: "2.3"
    plan: multi-language-cells
    goal: "cellDriver.R runs R cells persistently through Rscript and returns the printed value as text; the VS Code bundle ships all three drivers."
    level: behaviour
    runner: {agent: implementer, model: sonnet}
    depends_on: ["2.2"]
    create:
      - packages/core/src/qmd/compute/node/cellDriver.R
    edit:
      - {path: packages/core/src/qmd/compute/node/nodeCellRunner.ts, lines: "1-140", why: "r launch: Rscript --vanilla cellDriver.R"}
      - {path: packages/vscode/package.json, lines: "1-80", why: "build step that copies cellDriver.py to out/; add .wl and .R"}
    decided:
      - "The driver reads stdin with readLines(file(\"stdin\"), n = 1), parses JSON without packages (a minimal parser for {id, code} in base R), evaluates with withVisible(eval(parse(text = code), envir = .GlobalEnv)) per expression, and returns capture.output(print(value)) for the last visible value."
      - "Errors give error with conditionMessage; warnings are appended to text."
      - "Real-R tests skip when locateTool finds no Rscript."
      - "Find the copy step for cellDriver.py with grep in packages/vscode (package.json scripts or scripts/); add the other two drivers the same way."
    acceptance:
      - {id: 2.3a, check: "with R installed, x <- 2 then x + 1 gives text containing 3; an error cell gives error"}
      - {id: 2.3b, check: "the VS Code build output contains cellDriver.py, cellDriver.wl and cellDriver.R"}
    tests:
      hidden: [documents/plans/multi-language-cells/tests/2.3/rDriver.test.ts]
      command: "node scripts/agents/run.mjs test core --spec 2.3 --plan multi-language-cells -- packages/core/__tests__/qmd/compute/node"
