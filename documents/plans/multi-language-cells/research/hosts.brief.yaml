risks:
  - "Contracts list no languages; qmd-items#outputs, helper#messages and helper#version (protocol 7 -> 8) need updates."
  - "cwd is not a per-note key (VS Code os.tmpdir, browser 'paper:notes'); the key must travel in the request."
  - "Helper has no note concept; restart needs a new message and an UNQUEUED entry."
  - "Module-level registries need disposal on deactivate and helper shutdown."
  - "No path settings exist in VS Code; browser has no options for tool paths; the helper must find Mathematica/R itself."
