      - "UI 13.6 – NoteInsertSource: listProjectNotes/readProjectNote over the ProjectNotesStore of the project (`list(project.settings.id)` / `read(id, path)`, null becomes undefined); listCitedPaperIds = `listProjectCiteKeys(...)` of the project mapped through `derivePapersByCiteKey(papers)` to PaperRecord ids (unknown keys dropped, no duplicates); readPaperNote = the raw notes.qmd text of the paper (a PaperNotesPort `read`, or `notesText` of the parsed ItemFile), null becomes undefined. Every reader catches its own error, logs it and returns undefined/[] so one bad note never empties the picker. The `paper:<id>/notes.qmd` notePath is the core convention; parse the id back with that prefix."
      - "UI 13.6 – Picker \"Insert from note\": one quick pick, title \"Insert from note\", placeholder \"Search equations and outputs by label or note\". Separator entries \"Equations\" then \"Outputs\" (a group with no items is omitted). Each item: label = the item label (e.g. eq-energy); description = the source note title, and for a paper note the paper's title from the paper records (fallback the paper id); equation icon `symbol-operator`-like, output icon `output`-like (use what the app's icon set has). An output with `outOfDate` stays listed with \" · out of date\" appended to its description; picking it shows the error text of `buildInsert` as a warning and inserts nothing. Empty state: no picker, an information message \"No equations or outputs found in this project's notes or the cited papers' notes.\" Loading: VS Code passes the items promise to showQuickPick (its own busy state); the browser awaits the list then opens the picker. Error from the list: an error message \"Could not read the notes: <message>\" and the error logged. Keyboard: the picker is fully keyboard driven (type to filter, arrows, Enter, Escape cancels with no change)."
      - "UI 13.6 – Insert: LaTeX files only (Typst: the command is not offered; if run anyway it shows the `buildInsert` Typst error as a warning). The `buildInsert` text replaces the selection as one edit; when the cursor's line has text before the cursor a line break is put before it, and when it has text after the cursor a line break is put after it, so the block and its origin comment sit on their own lines. After the insert the state is recomputed once (it is fresh)."
      - "UI 13.6 – State per origin, computed for every `scanOrigins(language, text)` origin: manuscriptHash = `deriveOriginHash(readOriginLatex(language, text, origin))`; the note side is the `listNoteInsertables` item with the same notePath and label, `{ hash: await deriveOriginHash(item.latex) }`, or undefined; state = `deriveOriginState(...)`. Recomputed when a document opens, after it is saved, after a note .qmd is saved, and after an insert or update; never per keystroke. A later computation wins over an earlier one still running."
      - 'UI 13.6 – Marks and words: fresh has no mark at all. Mark range = the origin comment on the origin line. stale: info level, message "<label>: the note changed since it was inserted. Update from note replaces this copy."; diverged: warning level, "<label>: edited here, so it differs from the note. LabShelf will not overwrite it."; both: warning level, "<label>: edited here and changed in the note. LabShelf will not overwrite it."; missing: warning level, "<label>: not found in <note path>. The note or its label was removed or renamed." Hover on the mark: the same sentence, then the actions that apply: stale → "Update from note" and "Show differences"; diverged and both → "Show differences" only; missing → none.'
      - 'UI 13.6 – Update from note (stale only): `buildUpdate(origin, "stale", item, language)`; undefined means the state changed since, so do nothing but recompute. Otherwise apply its range and text as one edit (one undo step); the document is left unsaved like any edit. No write action exists for diverged, both or missing.'
      - 'UI 13.6 – Show differences: `diffOrigin(origin, readOriginLatex(...), item)` gives two texts, left "In the manuscript", right "In the note", titled "<label>: manuscript ↔ note". Read-only; nothing is written.'
