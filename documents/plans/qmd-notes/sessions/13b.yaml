      - 'Command `labshelf.writing.insertFromNote` (title "Research: Insert from Note", category LabShelf, icon $(symbol-operator)) and `labshelf.writing.updateFromNote` (title "Research: Update from Note", category LabShelf; arguments: document uri and origin line; hidden from the command palette with `when: false`). insertFromNote in the palette with `labshelf.writing.inProject && editorLangId == latex`. A third internal command `labshelf.writing.showNoteDiff` (same arguments, palette `when: false`) opens the diff. All handlers run through runSafely.'
