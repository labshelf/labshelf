  - id: "10.7"
    plan: qmd-notes
    goal: Register the `spaceNote` and `discussion` writers of Send to on the 10.1 stores, so Send to lists Space notes and threads.
    level: behaviour
    runner:
      agent: implementer
      model: sonnet
    depends_on:
      - "10.2"
    edit:
      - path: packages/core/src/spaces/index.ts
        lines: 1-28
        why: export the Send to writers
    create:
      - packages/core/src/spaces/spaceSendTargets.ts
    read:
      - path: packages/core/src/spaces/spaceNotesStore.ts
        lines: 1-400
        why: store created by 10.1 (whole file)
      - path: packages/core/src/spaces/spaceDiscussionsStore.ts
        lines: 1-400
        why: store created by 10.1 (whole file)
      - path: packages/core/src/qmd/sendTo.ts
        lines: 1-120
        why: SendTarget and ISendTargetWriter (created by 9.3)
    seams:
      - path: packages/core/src/spaces/spaceSendTargets.ts
        signature: "export interface SpaceAssetWriter { write(spaceId: string, path: string, bytes: Uint8Array): Promise<void> }"
      - path: packages/core/src/spaces/spaceSendTargets.ts
        signature: "export function createSpaceSendWriters(notes: SpaceNotesStore, discussions: SpaceDiscussionsStore, assets: SpaceAssetWriter): { spaceNote: ISendTargetWriter; discussion: ISendTargetWriter }"
      - path: packages/core/src/qmd/sendTo.ts
        signature: "export interface ISendTargetWriter { append(target: SendTarget, body: string, extra?: SendExtra): Promise<void> } (from 9.3; SendExtra = { itemId?: string; author?: string; blob?: { path: string; bytes: Uint8Array } })"
    decided:
      - The writers implement the `ISendTargetWriter` of Send to (`packages/core/src/qmd/sendTo.ts`, created by 9.3; `SendTarget` kinds `spaceNote` and `discussion`). They live in `spaces/` so session 10 does not edit session 9's files; the apps register them where they register the project-note writer.
      - "`spaceNote` appends with `notes.addItem(spaceId, target.path, body, extra?.author, extra?.itemId)`; `discussion` appends a message with `discussions.addMessage(spaceId, target.path, body, extra?.author, extra?.itemId)`. The author is the `sender` of the send request, passed by `sendTo` as `extra.author`; the item id is the one `sendTo` chose (`extra.itemId`), so the body's image path already holds it."
      - "A figure blob: `extra.blob.path` is `assets/<item id>.png`, relative to the folder of the target file; the writer writes it with `assets.write(spaceId, <dirname of target.path>/<blob.path>, bytes)` (path relative to the Space folder, e.g. `discussions/assets/<item id>.png`), before the append. A rejected asset write rejects `append` and nothing is appended; `sendTo` logs it (9.3)."
      - "Listing: Send to lists the Space notes and threads from the 10.1 `list` calls."
    acceptance:
      - id: 10.7a
        check: sending a quote to a Space note appends one item with the `labshelf:` back-link
      - id: 10.7b
        check: 'appending a quote to a thread with `extra = {itemId: "n-1", author: "Ana"}` calls `addMessage` with author `Ana` and id `n-1`; a figure with `blob.path` `assets/n-1.png` writes `discussions/assets/n-1.png` through `SpaceAssetWriter` before `addMessage`; a rejected asset write rejects and calls no `addMessage`'
    tests:
      hidden:
        - documents/plans/qmd-notes/tests/10.7/packages/core/__tests__/spaces/spaceSendTargets.test.ts
      command: node scripts/agents/run.mjs test core --spec 10.7 --plan qmd-notes -- packages/core/__tests__/spaces/spaceSendTargets.test.ts
