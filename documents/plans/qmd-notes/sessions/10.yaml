        - documents/plans/qmd-notes/tests/10.1/packages/core/__tests__/spaces/spaceNotesStore.test.ts
        - documents/plans/qmd-notes/tests/10.1/packages/core/__tests__/spaces/spaceDiscussionsStore.test.ts
      command: node scripts/agents/run.mjs test core --spec 10.1 --plan qmd-notes -- packages/core/__tests__/spaces/spaceNotesStore.test.ts packages/core/__tests__/spaces/spaceDiscussionsStore.test.ts
    commands:
