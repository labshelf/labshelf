        lines: 1-385
        why: parse and serialize item files
      - path: packages/core/src/qmd/item/itemUpdate.ts
        lines: 1-209
        why: item edits
      - path: packages/core/src/ports/fileSystem.ts
        lines: 1-52
        why: LibraryFileSystem port used by the stores
      - path: packages/core/src/qmd/projectNotesStore.ts
        lines: 1-40
        why: deriveNoteSlug (created by 9.1)
    seams:
      - path: packages/core/src/spaces/spaceNotesStore.ts
        signature: "export interface SpaceNotesStore { list(spaceId: string): Promise<SpaceNoteEntry[]>; create(spaceId: string, title: string): Promise<string>; read(spaceId: string, path: string): Promise<SpaceQmdItem[]>; addItem(spaceId: string, path: string, body: string, author?: string, id?: string): Promise<string>; editItem(spaceId: string, path: string, id: string, body: string): Promise<void>; removeItem(spaceId: string, path: string, id: string): Promise<void> }"
      - path: packages/core/src/spaces/spaceNotesStore.ts
        signature: "export function createSpaceNotesStore(ctx: StoreContext): SpaceNotesStore"
      - path: packages/core/src/spaces/spaceNotesStore.ts
        signature: "export interface SpaceNoteEntry { path: string; title: string; updated: string }"
      - path: packages/core/src/spaces/spaceNotesStore.ts
        signature: "export interface SpaceQmdItem { id: string; body: string; author?: string; created?: string }"
      - path: packages/core/src/spaces/spaceDiscussionsStore.ts
        signature: export type ThreadStatus = 'open' | 'resolved'
      - path: packages/core/src/spaces/spaceDiscussionsStore.ts
        signature: "export interface SpaceThreadEntry { path: string; title: string; status: ThreadStatus; messages: number; updated: string }"
      - path: packages/core/src/spaces/spaceDiscussionsStore.ts
        signature: "export interface SpaceDiscussionsStore { list(spaceId: string): Promise<SpaceThreadEntry[]>; create(spaceId: string, title: string, body: string, author?: string): Promise<string>; read(spaceId: string, path: string): Promise<SpaceQmdItem[]>; addMessage(spaceId: string, path: string, body: string, author?: string, id?: string): Promise<string>; editMessage(spaceId: string, path: string, id: string, body: string): Promise<void>; removeMessage(spaceId: string, path: string, id: string): Promise<void>; setStatus(spaceId: string, path: string, status: ThreadStatus): Promise<void> }"
      - path: packages/core/src/spaces/spaceDiscussionsStore.ts
        signature: "export function createSpaceDiscussionsStore(ctx: StoreContext): SpaceDiscussionsStore"
    decided:
      - 'One file per note and one per thread. A note file: items as in any `.qmd`; the first item starts with `# <title>`. A thread file: the first item is the topic (`# <title>` plus body, attribute `status="open"|"resolved"`); each message is one item with `author` and `created`, in file order.'
      - "Code is flat in `packages/core/src/spaces/` per documents/code.md#modules: `spaceNotesStore.ts` and `spaceDiscussionsStore.ts`, no subfolder. Shared path helpers (slug-to-path, the `notes/` and `discussions/` folder names) live in `spaceNotesStore.ts` and are imported by the discussions store, never copied."
      - Slugs reuse `deriveNoteSlug(title, taken)` from `packages/core/src/qmd/projectNotesStore.ts` (created by 9.1), imported, never copied.
      - Writes go through `runSerially(ctx, spaceId, …)` of `spaceStore.ts` (serial per Space), re-read first, atomic, identical bytes in all apps (documents/code.md#files). If importing from `spaceStore.ts` makes an import cycle, move `StoreContext` and `runSerially` to the new notes file and re-export them from `spaceStore.ts`.
      - "`SpaceStore` gains the members `readonly notes: SpaceNotesStore` and `readonly discussions: SpaceDiscussionsStore`, built from its own context, so `serveSpaces` and the apps take them from the store they already have."
      - Merge across devices is session 2's block merge (the Space scan already walks `spaces/<id>/**/*.qmd`); nothing here.
      - Store paths are relative to the Space folder (`notes/<slug>.qmd`, `discussions/<slug>.qmd`); `create` returns that path. `list` of a Space without the folder is `[]`. `title` is the first item's `# ` heading; `updated` is the file's modification time as an ISO string; a thread entry's `messages` counts the items after the topic.
      - "`addItem`/`addMessage` return the item id (new from `newItemId()` unless `id` is passed, which Send to uses) and stamp `created` from `ctx.now()`; `author` is written only when given. `read` returns the items in file order with `id`, `body`, `author`, `created`."
      - "`setStatus` changes only the `status` attribute value of the topic item: the file bytes differ by that value alone, and setting it back restores the original bytes."
      - "D17: sharing a Space is out of scope: files and local UI only, no share kind, no relay doc."
    acceptance:
      - id: 10.1a
        check: "create note: the file `notes/<slug>.qmd` exists with a first item starting `# <title>`; list returns it with title and updated time"
      - id: 10.1b
        check: 'create thread: `discussions/<slug>.qmd` has a topic item with `status="open"`'
      - id: 10.1c
        check: add message keeps `author` and `created` and appends in file order
      - id: 10.1d
        check: setStatus resolved sets `status="resolved"` on the topic and nothing else changes
      - id: 10.1e
        check: concurrent adds to one thread keep both messages
    tests:
