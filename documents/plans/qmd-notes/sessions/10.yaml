      - node scripts/agents/run.mjs test core
    do_not_touch:
      - packages/core/src/qmd/
      - packages/core/src/collab/
  - id: "10.2"
    plan: qmd-notes
    goal: The Space views read and edit notes and threads through Space protocol messages, guarded by the page parser and served by `serveSpaces`.
    level: contract
    runner:
      agent: implementer
      model: sonnet
    depends_on:
      - "10.1"
    edit:
      - path: packages/core/src/spaces/spacesProtocol.ts
        lines: 1-201
        why: new message types in SpacesToHost and HostToSpaces, their parsers in parseSpacesMessage, path validation
      - path: packages/core/src/spaces/serveSpaces.ts
        lines: 1-185
        why: ACTION_LABELS entries, handlers for the new messages, posting spaceNotes, spaceDiscussions and spaceQmd
      - path: packages/core/src/spaces/index.ts
        lines: 1-28
        why: export the new message types
    create: []
    read:
      - path: packages/core/src/spaces/spacesHostPort.ts
        lines: 1-19
        why: host port, unchanged
      - path: packages/core/src/spaces/spaceStore.ts
        lines: 1-267
        why: notes and discussions accessors from 10.1
    seams:
      - path: packages/core/src/spaces/spacesProtocol.ts
        signature: "export function isSpaceQmdPath(spaceId: string, path: unknown): path is string"
    decided:
      - "host to view: `spaceNotes {spaceId, notes: {path, title, updated}[]}`, `spaceDiscussions {spaceId, threads: {path, title, status, messages, updated}[]}`, `spaceQmd {spaceId, path, items: {id, body, author, created}[]}`."
      - "view to host: `createSpaceNote {spaceId, title}`, `createSpaceThread {spaceId, title, body}`, `addSpaceItem {spaceId, path, body}`, `editSpaceItem {spaceId, path, id, body}`, `removeSpaceItem {spaceId, path, id}`, `setThreadStatus {spaceId, path, status}`."
      - "Every `path` is validated to stay inside `notes/` or `discussions/` of that Space: reject `..`, absolute paths and anything not ending in `.qmd`; a message that fails is dropped whole (documents/code.md#messages)."
      - The new messages are not `SpaceMutation`s (they act on the notes and discussions stores, not on the Space file); they are added to the `SpacesToHost` union and parsed in `parseSpacesMessage`. The `ACTION_LABELS` record must gain an entry for each new view-to-host type; a failed handler is logged and shown as a notice.
      - "`serveSpaces` posts `spaceNotes` and `spaceDiscussions` with the open Space and `spaceQmd` on request and after each change; `spaceQmd` is posted for the path the view has open."
      - "Apps are not touched: they already hand `serveSpaces` the store."
      - Message paths are relative to the Space folder (`notes/<slug>.qmd`), the same paths the stores take; `isSpaceQmdPath` is exported from `spacesProtocol.ts` (and `spaces/index.ts`).
      - "`spaceDiscussions.threads[].messages` is the message count (items after the topic). `serveSpaces` posts `spaceQmd` for the changed path after every item change (add, edit, remove), `spaceNotes` after `createSpaceNote` and `spaceDiscussions` after `createSpaceThread`, `setThreadStatus` and a new message."
      - A failed note or thread action is logged through `ILogger` and posted as the existing error notice; a dropped message (bad path) writes nothing.
    acceptance:
      - id: 10.2a
        check: guard tests for each new view-to-host message accept a valid one and drop one with a missing or mistyped field
      - id: 10.2b
        check: path escapes (`..`, absolute, other Space folder, not `.qmd`, outside `notes/` and `discussions/`) are rejected by the guard
      - id: 10.2c
        check: "a `serveSpaces` test: an `addSpaceItem` appends one item and the host posts the updated `spaceQmd`"
    tests:
      hidden:
