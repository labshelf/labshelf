  - id: "10.1"
    plan: qmd-notes
    goal: Store Space notes as `spaces/<id>/notes/<slug>.qmd` and discussion threads as `spaces/<id>/discussions/<slug>.qmd`, with create, list, read and edit.
    level: contract
    runner:
      agent: implementer
      model: sonnet
    depends_on: []
    edit:
      - path: packages/core/src/spaces/spaceStore.ts
        lines: 1-267
        why: expose the notes and discussions stores built on the store context (StoreContext, runSerially), so apps need no wiring change
      - path: packages/core/src/spaces/index.ts
        lines: 1-28
        why: export the two stores and their types
    create:
      - packages/core/src/spaces/spaceNotesStore.ts
      - packages/core/src/spaces/spaceDiscussionsStore.ts
    read:
      - path: documents/plans/qmd-notes/research/spaces-collab.md
        lines: 5-9
        why: Spaces on disk
