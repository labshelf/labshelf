    read:
      - path: documents/contracts/qmd-items.md
        lines: 42-60
        why: "outputs and merge sections: style and neighbouring facts"
    decided:
      - "Content: origin comment grammar for LaTeX and Typst, path forms, hash rule, the five states and the never-overwrite rule. Present tense, each fact once."
      - finish checks the section against the code of 13.1 and 13.2.
    acceptance:
