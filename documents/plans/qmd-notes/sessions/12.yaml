packages:
  - id: "12.1"
    plan: qmd-notes
    goal: A runtime-neutral `ICellRunner` port and the function that turns a run result into an output block inside the note.
    level: contract
    runner:
      agent: implementer
      model: opus
    edit:
      - path: packages/core/src/qmd/item/cellOutput.ts
        lines: 20-69
        why: CreateOutputInput gains an optional status; formatOutput writes it as the last opener attribute when present
      - path: documents/contracts/qmd-items.md
        lines: 42-48
        why: "#outputs: document the optional status=error attribute"
    create:
      - packages/core/src/qmd/compute/index.ts
      - packages/core/src/qmd/compute/cellRunner.ts
      - packages/core/src/qmd/compute/writeCellOutput.ts
    read:
      - path: packages/core/src/qmd/item/cellOutput.ts
        lines: 1-76
        why: findOutputs and deriveCodeHash (the cell source hash, async) to reuse by import
      - path: packages/core/src/qmd/item/itemUpdate.ts
        lines: 92-135
        why: setItemBody and the item edit style; the writer returns a new body, the host stores it
      - path: packages/core/src/qmd/item/itemFile.ts
        lines: 1-60
        why: line splitting and code fence helpers (findCodeFences) to locate a cell and its end
    seams:
      - path: packages/core/src/qmd/compute/cellRunner.ts
        signature: export type CellStatus = "ok" | "error" | "timeout" | "cancelled" | "missing-python";
      - path: packages/core/src/qmd/compute/cellRunner.ts
        signature: "export interface CellResult { status: CellStatus; latex?: string; text?: string; error?: string; durationMs: number }"
      - path: packages/core/src/qmd/compute/cellRunner.ts
        signature: "export interface ICellRunner { run(code: string, opts: { cwd: string; signal: AbortSignal; timeoutMs: number }): Promise<CellResult> }"
      - path: packages/core/src/qmd/compute/writeCellOutput.ts
        signature: "export function writeCellOutput(body: string, cellLabel: string, result: CellResult, meta: { engine: string; ran: string }): Promise<string>"
      - path: packages/core/src/qmd/item/cellOutput.ts
        signature: 'export interface CreateOutputInput { readonly cell: string; readonly source: string; readonly engine: string; readonly ran: string; readonly content: string; readonly status?: "error" }'
    decided:
      - "D11: cells run through a core port ICellRunner in packages/core/src/qmd/compute/cellRunner.ts; cancel kills the process (12.2, 12.3). The port is runtime-neutral: no Node import in cellRunner.ts, writeCellOutput.ts or index.ts."
      - CellResult.status is one of ok, error, timeout, cancelled, missing-python; latex, text and error are optional; durationMs is always present.
      - "writeCellOutput takes an item body, a cell label and a result and returns the new body. It inserts or replaces the `::: {.labshelf-output cell=<label> source=<hash> engine=... ran=...}` block right after that cell (D3). source = deriveCodeHash(cell code) from packages/core/src/qmd/item/cellOutput.ts (first 12 hex chars of SHA-256, `#|` lines excluded, trailing newline trimmed); ran is ISO-8601 UTC; engine is like `python-3.12 sympy-1.13`. The function is async because deriveCodeHash is."
      - "Block content: `$$ <latex> $$` when latex is present, else the text in a plain fenced code block; an error result writes the error text and the block gets the attribute status=error. cancelled and missing-python write nothing and return the body unchanged. Uses formatOutput and findOutputs from cellOutput.ts; a formatOutput throw (content closing the block early) is not caught."
      - "A cell without `#| label:` gets `#| label: cell-<n>` written on first run (n = the cell position in the item, 1-based) so the output can reference it; a rerun finds the cell by that label and replaces the existing block."
      - Writes never touch text outside the item body it was given (the host passes one item body and stores the result with setItemBody).
      - The default timeout of 60 s is passed by the host, not by the port.
      - "Content format: latex as the single line `$$ <latex> $$\\n`; text without latex as ```` ```\\n<text>\\n```\\n ````; an error as the error text in the same plain fenced block. The block follows the cell's closing fence on the next line; a rerun replaces the old block in place."
      - The error opener comes from formatOutput with status "error" (cellOutput.ts is extended for it, its existing callers and tests are unchanged since the field is optional); an ok block has no status attribute.
      - "A timeout result writes like an error: a status=error block whose text is result.error when present, else `timed out after <round(durationMs / 1000)> s`."
      - "The caller passes the label: the existing `#| label:` or `cell-<n>` for an unlabeled cell. Writing the label does not change the source hash (deriveCodeHash skips `#|` lines). A cancelled or missing-python result adds no label either."
      - A body with no cell for the label is returned unchanged.
      - finish checks the write-back against documents/contracts/qmd-items.md#outputs.
    acceptance:
      - id: 12.1a
        check: a first run inserts the output block right after its cell
      - id: 12.1b
        check: a rerun replaces the existing block for that cell instead of adding a second
      - id: 12.1c
        check: an error result writes the error text with status=error
      - id: 12.1d
        check: "a cell without a label gets `#| label: cell-<n>` on first run"
      - id: 12.1e
        check: text and items outside the given body are byte-identical; cancelled and missing-python leave the body unchanged
    tests:
      hidden:
        - documents/plans/qmd-notes/tests/12.1/packages/core/__tests__/qmd/compute/writeCellOutput.test.ts
      command: node scripts/agents/run.mjs test core --spec 12.1 --plan qmd-notes -- packages/core/__tests__/qmd/compute/writeCellOutput.test.ts
    commands:
      - node scripts/agents/run.mjs typecheck core
      - node scripts/agents/run.mjs test core
    do_not_touch:
      - packages/core/src/qmd/item/itemFile.ts
      - packages/core/src/qmd/item/itemUpdate.ts
    depends_on: []
  - id: "12.2"
    plan: qmd-notes
    goal: A stuck process ends in `runCancellable`; timeout, then SIGTERM to the group, then SIGKILL after a grace period, with stdout and stderr separable.
    level: behaviour
    runner:
      agent: implementer
      model: sonnet
    edit:
      - path: packages/core/src/latex/node/run.ts
        lines: 17-82
        why: CancellableOptions gain timeoutMs, killGraceMs, separateStreams; runCancellable escalates and rejects with ProcessTimedOut; killTree sends the signals
    read:
      - path: documents/plans/qmd-notes/research/helper.md
        lines: 33-35
        why: "Running processes: the cancel and kill behaviour to keep"
      - path: packages/core/src/latex/node/run.ts
        lines: 140-165
        why: buildLatexProject, the caller whose behaviour must stay byte for byte
      - path: packages/core/src/helper/node/helperBuild.ts
        lines: 99-130
        why: how a cancelled build is treated by the helper
    seams:
      - path: packages/core/src/latex/node/run.ts
        signature: "export class ProcessTimedOut extends Error { constructor(timeoutMs: number) }"
      - path: packages/core/src/latex/node/run.ts
        signature: "export interface RunOutcome { code: number | null; output: string; stdout?: string; stderr?: string }"
    decided:
      - Options gain timeoutMs? (none by default), killGraceMs? (default 2000) and separateStreams? (the result then has stdout and stderr tails). Defaults keep build behaviour byte for byte.
      - "On timeout: SIGTERM to the process group, then SIGKILL to the group after killGraceMs if the child has not exited; the promise rejects with ProcessTimedOut beside BuildCancelled. A cancel keeps its current path and also escalates to SIGKILL after the grace period."
      - Windows keeps `taskkill /pid <pid> /T /F`.
      - Escalation is logged through ILogger (an optional logger in the options); the file is packages/core/src/latex/node/run.ts (formerly latex/build/node/runCancellable.ts).
      - The logger option is named `logger` (ILogger); a timeout and each escalation to SIGKILL log at least one entry. ProcessTimedOut has name "ProcessTimedOut" and its message contains timeoutMs.
      - A child that obeys SIGTERM ends the run at once, without waiting for killGraceMs. SIGKILL goes to the whole process group, so grandchildren die too.
      - With separateStreams, stdout and stderr each keep their own tail of OUTPUT_LIMIT (64 KiB), `output` stays the merged tail, and onOutput still gets every chunk. Without it the result has exactly the keys code and output.
      - An already aborted signal still rejects at once with BuildCancelled; a cancel still rejects with BuildCancelled, never ProcessTimedOut.
      - finish checks this against documents/contracts/helper.md only through unchanged build behaviour.
    acceptance:
      - id: 12.2a
        check: a timeout kills a sleeping child and rejects with ProcessTimedOut
      - id: 12.2b
        check: a child that ignores SIGTERM receives SIGKILL after the grace period
      - id: 12.2c
        check: existing build and cancel tests pass and build callers are unchanged
    tests:
      hidden:
        - documents/plans/qmd-notes/tests/12.2/packages/core/__tests__/latex/build/node/runCancellable.test.ts
      command: node scripts/agents/run.mjs test core --spec 12.2 --plan qmd-notes -- packages/core/__tests__/latex/build/node/runCancellable.test.ts
    commands:
      - node scripts/agents/run.mjs typecheck core
      - node scripts/agents/run.mjs test core
    do_not_touch:
      - packages/core/src/latex/node/preview.ts
      - packages/core/src/latex/node/build.ts
    depends_on: []
  - id: "12.3"
    plan: qmd-notes
    goal: NodeCellRunner implements ICellRunner with the managed Python and a bundled driver.
    level: contract
    runner:
      agent: implementer
      model: sonnet
    depends_on:
      - "12.1"
      - "12.2"
    edit:
      - path: packages/core/src/qmd/compute/node/index.ts
        lines: 1-20
        why: export createNodeCellRunner beside the managed Python exports (index.ts created by 11.1)
    create:
      - packages/core/src/qmd/compute/node/nodeCellRunner.ts
      - packages/core/src/qmd/compute/node/cellDriver.py
    read:
      - path: packages/core/src/qmd/compute/cellRunner.ts
        lines: 1-30
        why: the port and CellResult to implement (created in 12.1)
      - path: packages/core/src/qmd/compute/node/managedPython.ts
        lines: 1-400
        why: PythonProvider, PythonStatus and createSharedPythonProvider (created by 11.1)
      - path: packages/core/src/latex/node/run.ts
        lines: 17-82
        why: runCancellable with timeoutMs and separateStreams (12.2)
      - path: packages/core/src/latex/node/managedTex.ts
        lines: 340-364
        why: createSharedTexProvider, the composition pattern for the shared provider
      - path: packages/core/package.json
        lines: 1-60
        why: "files and exports: the cellDriver.py asset must ship with core and be found at runtime"
    seams:
      - path: packages/core/src/qmd/compute/node/nodeCellRunner.ts
        signature: "export function createNodeCellRunner(options: { python: PythonProvider; logger: ILogger; driverPath?: string }): ICellRunner"
      - path: packages/core/src/qmd/compute/node/index.ts
        signature: export { createNodeCellRunner } from "./nodeCellRunner.js"; // beside createSharedPythonProvider and type PythonProvider (11.1)
    decided:
      - "The interpreter path is not on PythonStatus: session 11 defines the optional provider method `PythonProvider.pythonPath?(): string`. The runner calls python.status() once per run and, when it is installed, python.pythonPath(); it never calls install(). A provider without the method counts as missing Python (status missing-python)."
      - createSharedPythonProvider takes the createSharedTexProvider option shape {env, platform, homeDir, logger, fetchImpl}; the tests build it that way and skip (with a logged reason) when its status is missing.
      - The temp file is created at call time directly in os.tmpdir() (read on each run, so TMPDIR changes are honoured) and deleted in a finally after every run, ok or error; nothing else is left in the temp dir.
      - "The runner reads the last stdout line as JSON {latex?, text?, error?}; a custom driverPath printing only {text} gives status ok with that text. ok carries latex for SymPy objects and only text otherwise (latex undefined); error is the one-line last traceback line (e.g. `SyntaxError: ...`, `ZeroDivisionError: ...`). stderr never appears in the result."
      - The cell runs with cwd = opts.cwd. missing-python returns {status, durationMs} with no latex or text.
      - NodeCellRunner lives in packages/core/src/qmd/compute/node/nodeCellRunner.ts with the driver asset cellDriver.py beside it, shipped with core (package.json files/exports updated if needed); the driver is under 40 lines.
      - The runner writes the cell code to a temp file in the OS temp dir and passes its path as the driver argument (runCancellable ignores stdin), and deletes the file after the run.
      - "The driver exec()s all statements but the last, eval()s the last if it is an expression, and prints one JSON line {latex, text}: sympy.latex(result) for SymPy objects, str otherwise. An exception prints {error} with the last line of the traceback."
      - Status missing-python when the provider reports state missing or has no pythonPath method. Python stderr goes to the log, not into the note. A timeout from runCancellable maps to status timeout and a cancel to cancelled; durationMs is measured by the runner.
      - Only the managed Python is used (D11); a system Python is never used.
      - Tests are skipped when no Python is on the test machine, with a logged reason; the missing-python tests use a fake provider (state missing, or installed without pythonPath) and always run.
    acceptance:
      - id: 12.3a
        check: a SymPy cell differentiating x**2 returns LaTeX `2 x`
      - id: 12.3b
        check: a syntax error is reported as status error with the error line
      - id: 12.3c
        check: "`while True: pass` ends with status timeout"
      - id: 12.3d
        check: a fake provider reporting missing yields status missing-python
    tests:
      hidden:
        - documents/plans/qmd-notes/tests/12.3/packages/core/__tests__/qmd/compute/node/nodeCellRunner.test.ts
      command: node scripts/agents/run.mjs test core --spec 12.3 --plan qmd-notes -- packages/core/__tests__/qmd/compute/node/nodeCellRunner.test.ts
    commands:
      - node scripts/agents/run.mjs typecheck core
      - node scripts/agents/run.mjs test core
      - node scripts/agents/run.mjs build core
    do_not_touch:
      - packages/core/src/qmd/compute/node/managedPython.ts
      - packages/core/src/qmd/compute/node/installPython.ts
