      - node scripts/agents/run.mjs test core
    do_not_touch:
      - packages/core/src/qmd/itemFile.ts
      - packages/core/src/qmd/itemUpdate.ts

  - id: "12.2"
    plan: qmd-notes
    goal: A stuck process ends in `runCancellable`; timeout, then SIGTERM to the group, then SIGKILL after a grace period, with stdout and stderr separable.
    level: behaviour
    runner: {agent: implementer, model: sonnet}
    edit:
      - {path: packages/core/src/latex/node/run.ts, lines: "17-82", why: "CancellableOptions gain timeoutMs, killGraceMs, separateStreams; runCancellable escalates and rejects with ProcessTimedOut; killTree sends the signals"}
    read:
      - {path: documents/plans/qmd-notes/research/helper.md, lines: "33-35", why: "Running processes: the cancel and kill behaviour to keep"}
      - {path: packages/core/src/latex/node/run.ts, lines: "140-165", why: "buildLatexProject, the caller whose behaviour must stay byte for byte"}
      - {path: packages/core/src/helper/node/helperBuild.ts, lines: "99-130", why: "how a cancelled build is treated by the helper"}
    seams:
      - {path: packages/core/src/latex/node/run.ts, signature: "export class ProcessTimedOut extends Error { constructor(timeoutMs: number) }"}
      - {path: packages/core/src/latex/node/run.ts, signature: "export interface RunOutcome { code: number | null; output: string; stdout?: string; stderr?: string }"}
    decided:
      - "Options gain timeoutMs? (none by default), killGraceMs? (default 2000) and separateStreams? (the result then has stdout and stderr tails). Defaults keep build behaviour byte for byte."
      - "On timeout: SIGTERM to the process group, then SIGKILL to the group after killGraceMs if the child has not exited; the promise rejects with ProcessTimedOut beside BuildCancelled. A cancel keeps its current path and also escalates to SIGKILL after the grace period."
      - "Windows keeps `taskkill /pid <pid> /T /F`."
      - "Escalation is logged through ILogger (an optional logger in the options); the file is packages/core/src/latex/node/run.ts (formerly latex/build/node/runCancellable.ts)."
      - "The logger option is named `logger` (ILogger); a timeout and each escalation to SIGKILL log at least one entry. ProcessTimedOut has name \"ProcessTimedOut\" and its message contains timeoutMs."
      - "A child that obeys SIGTERM ends the run at once, without waiting for killGraceMs. SIGKILL goes to the whole process group, so grandchildren die too."
      - "With separateStreams, stdout and stderr each keep their own tail of OUTPUT_LIMIT (64 KiB), `output` stays the merged tail, and onOutput still gets every chunk. Without it the result has exactly the keys code and output."
      - "An already aborted signal still rejects at once with BuildCancelled; a cancel still rejects with BuildCancelled, never ProcessTimedOut."
      - "finish checks this against documents/contracts/helper.md only through unchanged build behaviour."
    acceptance:
      - {id: "12.2a", check: "a timeout kills a sleeping child and rejects with ProcessTimedOut"}
      - {id: "12.2b", check: "a child that ignores SIGTERM receives SIGKILL after the grace period"}
      - {id: "12.2c", check: "existing build and cancel tests pass and build callers are unchanged"}
    tests:
      hidden:
        - documents/plans/qmd-notes/tests/12.2/packages/core/__tests__/latex/build/node/runCancellable.test.ts
      command: "node scripts/agents/run.mjs test core --spec 12.2 --plan qmd-notes -- packages/core/__tests__/latex/build/node/runCancellable.test.ts"
    commands:
      - node scripts/agents/run.mjs typecheck core
      - node scripts/agents/run.mjs test core
    do_not_touch:
      - packages/core/src/latex/node/preview.ts
      - packages/core/src/latex/node/build.ts

  - id: "12.3"
    plan: qmd-notes
    goal: "NodeCellRunner implements ICellRunner with the managed Python and a bundled driver."
    level: contract
    runner: {agent: implementer, model: sonnet}
    depends_on: ["12.1", "12.2"]
    edit:
      - {path: packages/core/src/qmd/compute/node/index.ts, lines: "1-20", why: "export createNodeCellRunner beside the managed Python exports (index.ts created by 11.1)"}
    create:
      - packages/core/src/qmd/compute/node/nodeCellRunner.ts
      - packages/core/src/qmd/compute/node/cellDriver.py
    read:
      - {path: packages/core/src/qmd/compute/cellRunner.ts, lines: "1-30", why: "the port and CellResult to implement (created in 12.1)"}
      - {path: packages/core/src/qmd/compute/node/managedPython.ts, lines: "1-400", why: "PythonProvider, PythonStatus and createSharedPythonProvider (created by 11.1)"}
      - {path: packages/core/src/latex/node/run.ts, lines: "17-82", why: "runCancellable with timeoutMs and separateStreams (12.2)"}
      - {path: packages/core/src/latex/node/managedTex.ts, lines: "340-364", why: "createSharedTexProvider, the composition pattern for the shared provider"}
      - {path: packages/core/package.json, lines: "1-60", why: "files and exports: the cellDriver.py asset must ship with core and be found at runtime"}
    seams:
      - {path: packages/core/src/qmd/compute/node/nodeCellRunner.ts, signature: "export function createNodeCellRunner(options: { python: PythonProvider; logger: ILogger; driverPath?: string }): ICellRunner"}
      - {path: packages/core/src/qmd/compute/node/index.ts, signature: "export { createNodeCellRunner } from \"./nodeCellRunner.js\"; // beside createSharedPythonProvider and type PythonProvider (11.1)"}
    decided:
      - "The interpreter path is not on PythonStatus: session 11 defines the optional provider method `PythonProvider.pythonPath?(): string`. The runner calls python.status() once per run and, when it is installed, python.pythonPath(); it never calls install(). A provider without the method counts as missing Python (status missing-python)."
      - "createSharedPythonProvider takes the createSharedTexProvider option shape {env, platform, homeDir, logger, fetchImpl}; the tests build it that way and skip (with a logged reason) when its status is missing."
      - "The temp file is created at call time directly in os.tmpdir() (read on each run, so TMPDIR changes are honoured) and deleted in a finally after every run, ok or error; nothing else is left in the temp dir."
      - "The runner reads the last stdout line as JSON {latex?, text?, error?}; a custom driverPath printing only {text} gives status ok with that text. ok carries latex for SymPy objects and only text otherwise (latex undefined); error is the one-line last traceback line (e.g. `SyntaxError: ...`, `ZeroDivisionError: ...`). stderr never appears in the result."
      - "The cell runs with cwd = opts.cwd. missing-python returns {status, durationMs} with no latex or text."
      - "NodeCellRunner lives in packages/core/src/qmd/compute/node/nodeCellRunner.ts with the driver asset cellDriver.py beside it, shipped with core (package.json files/exports updated if needed); the driver is under 40 lines."
      - "The runner writes the cell code to a temp file in the OS temp dir and passes its path as the driver argument (runCancellable ignores stdin), and deletes the file after the run."
      - "The driver exec()s all statements but the last, eval()s the last if it is an expression, and prints one JSON line {latex, text}: sympy.latex(result) for SymPy objects, str otherwise. An exception prints {error} with the last line of the traceback."
      - "Status missing-python when the provider reports state missing or has no pythonPath method. Python stderr goes to the log, not into the note. A timeout from runCancellable maps to status timeout and a cancel to cancelled; durationMs is measured by the runner."
      - "Only the managed Python is used (D11); a system Python is never used."
      - "Tests are skipped when no Python is on the test machine, with a logged reason; the missing-python tests use a fake provider (state missing, or installed without pythonPath) and always run."
    acceptance:
      - {id: "12.3a", check: "a SymPy cell differentiating x**2 returns LaTeX `2 x`"}
      - {id: "12.3b", check: "a syntax error is reported as status error with the error line"}
      - {id: "12.3c", check: "`while True: pass` ends with status timeout"}
      - {id: "12.3d", check: "a fake provider reporting missing yields status missing-python"}
    tests:
      hidden:
        - documents/plans/qmd-notes/tests/12.3/packages/core/__tests__/qmd/compute/node/nodeCellRunner.test.ts
      command: "node scripts/agents/run.mjs test core --spec 12.3 --plan qmd-notes -- packages/core/__tests__/qmd/compute/node/nodeCellRunner.test.ts"
    commands:
      - node scripts/agents/run.mjs typecheck core
      - node scripts/agents/run.mjs test core
      - node scripts/agents/run.mjs build core
    do_not_touch:
      - packages/core/src/qmd/compute/node/managedPython.ts
      - packages/core/src/qmd/compute/node/installPython.ts

  - id: "12.4"
    plan: qmd-notes
    goal: The browser runs and cancels cells through the helper with `runCell` and `cancelCell` messages.
    level: contract
    runner: {agent: implementer, model: sonnet}
    depends_on: ["12.1", "12.3"]
    edit:
      - {path: packages/core/src/helper/helperMessages.ts, lines: "1-94", why: "runCell and cancelCell in ToHelperMessage, cellResult in ToPageMessage, limits, PROTOCOL_VERSION bump"}
      - {path: packages/core/src/helper/parseHelperMessage.ts, lines: "1-319", why: "guards for runCell and cancelCell"}
      - {path: packages/core/src/helper/helperClient.ts, lines: "1-189", why: "runCell(request, signal) posting cancelCell on abort"}
      - {path: packages/core/src/helper/helperPaths.ts, lines: "123-141", why: "ILatexHelper gains runCell"}
      - {path: packages/core/src/helper/index.ts, lines: "1-32", why: "export the new types"}
      - {path: packages/core/src/helper/node/runHelperHost.ts, lines: "38-72", why: "build createNodeCellRunner and spread the cell handlers into the dispatcher with resolveCwd"}
      - {path: packages/core/src/helper/node/helperHandlers.ts, lines: "62-62", why: "cancelCell joins the UNQUEUED set"}
      - {path: packages/core/src/helper/node/helperProjects.ts, lines: "275-322", why: "LibraryProjects gains rootOf(projectId), the folder of an open project, for resolveCwd"}
      - {path: packages/core/__tests__/helper/parseHelperMessage.test.ts, lines: "41-41", why: "the version test expects 7"}
      - {path: documents/contracts/helper.md, lines: "1-51", why: "runCell, cancelCell, cellResult, protocol version"}
    create:
      - packages/core/src/helper/node/cellHandlers.ts
    read:
      - {path: documents/plans/qmd-notes/research/helper.md, lines: "5-14", why: "Contracts"}
      - {path: documents/plans/qmd-notes/research/helper.md, lines: "22-27", why: "Handlers"}
      - {path: packages/core/src/helper/node/helperHandlers.ts, lines: "55-130", why: "UNQUEUED set and the dispatcher: cancelCell must run while another message waits in the queue"}
      - {path: packages/core/src/helper/node/helperBuild.ts, lines: "146-258", why: "cancel handler and tokens registered before any await, the pattern to follow"}
      - {path: packages/core/src/helper/node/projectHandlers.ts, lines: "221-264", why: "createTexInstallHandlers, the handler-factory shape"}
      - {path: packages/core/src/helper/node/runHelperHost.ts, lines: "50-72", why: "where handlers are composed"}
    seams:
      - {path: packages/core/src/helper/node/cellHandlers.ts, signature: "export function createCellHandlers(options: { runner: ICellRunner; resolveCwd(scope: string): string | undefined; logger: ILogger }): { runCell: HelperHandler; cancelCell: HelperHandler }"}
      - {path: packages/core/src/helper/helperPaths.ts, signature: "runCell(request: { code: string; cwd: string; timeoutMs: number }, signal: AbortSignal): Promise<CellResult>;"}
      - {path: packages/core/src/helper/helperMessages.ts, signature: "| { type: \"runCell\"; code: string; cwd: string; timeoutMs: number } | { type: \"cancelCell\"; requestId: string } // ToHelperMessage; ToPageMessage gains { type: \"cellResult\"; status: CellStatus; latex?: string; text?: string; error?: string; durationMs: number }"}
      - {path: packages/core/src/helper/helperMessages.ts, signature: "export const MAX_CELL_CODE_BYTES = 1024 * 1024; export const MAX_CELL_TIMEOUT_MS = 600_000;"}
      - {path: packages/core/src/helper/node/helperProjects.ts, signature: "rootOf(projectId: string): string | undefined; // on LibraryProjects"}
    decided:
      - "Message runCell {code, cwd, timeoutMs} answers cellResult carrying the CellResult fields, with the envelope id as the request id. cwd names a project id or a paper scope, never a raw path: the helper resolves it from its known projects and papers and refuses an unknown one with an error reply."
      - "Message cancelCell {requestId} is UNQUEUED (added to the UNQUEUED set in helperHandlers.ts) and aborts that run signal."
      - "Handlers live in packages/core/src/helper/node/cellHandlers.ts (flat in helper/node, per the current layout); the abort controller of a run is registered before any await, as the build token is."
      - "PROTOCOL_VERSION is bumped by one over the value left by session 11 and documents/contracts/helper.md documents runCell, cancelCell, cellResult and the version."
      - "ILatexHelper.runCell posts cancelCell with the run id when the signal aborts; the page never sees the request id."
      - "Input limits (code size, timeoutMs range) are enforced in parseHelperMessage and stated in helper.md."
      - "PROTOCOL_VERSION is 7 (session 11 leaves 6); any other v, including a string, is refused with code version as today."
      - "code: a string of at most MAX_CELL_CODE_BYTES (1 MiB); larger is refused with code limit. timeoutMs: an integer 1..600000; anything else (0, negative, fractional, string, null, larger) is refused."
      - "cwd is a scope, not a path: a project id (isHelperProjectId) or `paper:<paperId>`. Empty, or containing `/`, `\\`, `~` at the start, or equal to `..` is refused by the guard (code project-id). Keys a message does not define are dropped."
      - "cellResult is a toPage message only (runCell and cancelCell are toHelper only; the wrong direction is unknown-type); status must be one of the five CellStatus values and durationMs a number."
      - "runHelperHost resolves a project id to LibraryProjects.rootOf (the folder while the project is open) and `paper:<id>` to os.tmpdir(); anything else is undefined, and createCellHandlers then replies `error` under the request id without running. The runner is createNodeCellRunner over the shared Python provider of session 11."
      - "runCell stays queued; cancelCell for an id that is not running answers nothing and does not fail the dispatcher. The run's cellResult (including cancelled) is sent under the runCell envelope id."
      - "finish checks the messages against documents/contracts/helper.md."
    acceptance:
      - {id: "12.4a", check: "guard tests accept valid runCell and cancelCell and refuse a missing field, an oversized code, a bad timeout and a raw path as cwd"}
      - {id: "12.4b", check: "a handler test runs a fake runner and cancels it by request id while another message waits in the queue"}
      - {id: "12.4c", check: "an unknown cwd scope is refused with an error reply"}
      - {id: "12.4d", check: "the protocol version is bumped and a mismatched version is refused as before"}
    tests:
      hidden:
        - documents/plans/qmd-notes/tests/12.4/packages/core/__tests__/helper/parseCellMessages.test.ts
        - documents/plans/qmd-notes/tests/12.4/packages/core/__tests__/helper/node/cellHandlers.test.ts
      command: "node scripts/agents/run.mjs test core --spec 12.4 --plan qmd-notes -- packages/core/__tests__/helper/parseCellMessages.test.ts packages/core/__tests__/helper/node/cellHandlers.test.ts"
    commands:
