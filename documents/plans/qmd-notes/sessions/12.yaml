      - node scripts/agents/run.mjs test core
    do_not_touch:
      - packages/core/src/helper/node/helperBuild.ts
      - packages/core/src/helper/node/projectHandlers.ts
      - packages/core/src/qmd/compute/node/managedPython.ts

