      - {path: packages/core/src/spaces/dom/mountSpaceNotes.ts, lines: "1-200", why: "Space note editors (10.6) pass `onRunCell` when `canRunCells` is true"}
      - {path: packages/core/src/spaces/dom/mountSpaceDiscussions.ts, lines: "1-200", why: "discussion editors (10.6) pass `onRunCell` when `canRunCells` is true"}
    create: []
    read:
      - {path: packages/core/src/qmd/dom/qmdEditor.ts, lines: "1-60", why: "mountQmdEditor and its `onRunCell` option (created by session 4)"}
      - {path: packages/core/src/qmd/compute/index.ts, lines: "1-20", why: "writeCellOutput and CellResult (12.1)"}
      - {path: packages/core/__tests__/libraryUi/protocol/messages.test.ts, lines: "1-40", why: "layout of the existing guard tests"}
    seams:
      - {path: packages/core/src/libraryUi/protocol/messages.ts, signature: '| { type: "paper.runCell"; id: string; itemId: string; label: string; code: string; requestId: string }'}
      - {path: packages/core/src/libraryUi/protocol/messages.ts, signature: '| { type: "paper.cancelCell"; requestId: string }'}
      - {path: packages/core/src/libraryUi/protocol/messages.ts, signature: '| { type: "paper.cellState"; requestId: string; state: CellRunState }'}
      - {path: packages/core/src/reader/protocol/messages.ts, signature: '| { command: "runCell"; itemId: string; label: string; code: string; requestId: string } | { command: "cancelCell"; requestId: string } // WebviewToHost, guarded by isWebviewMessage'}
      - {path: packages/core/src/reader/protocol/messages.ts, signature: '| { type: "cellState"; requestId: string; state: CellRunState } // HostToWebview; init gains canRunCells?: boolean'}
      - {path: packages/core/src/spaces/spacesProtocol.ts, signature: '| { type: "space.cancelCell"; requestId: string } // SpacesToHost, parsed by parseSpacesMessage; HostToSpaces gains { type: "space.cellState"; requestId: string; state: CellRunState }; SpaceSnapshot gains canRunCells?: boolean'}
      - {path: packages/core/src/reader/dom/notesTab.ts, signature: "setCanRunCells(canRun: boolean): void; showCellState(requestId: string, state: CellRunState): void // on NotesTab"}
      - {path: packages/core/src/reader/dom/noteBoxes.ts, signature: "setCanRunCells(canRun: boolean): void; showCellState(requestId: string, state: CellRunState): void // on NoteBoxLayer"}
      - {path: packages/core/src/spaces/spacesProtocol.ts, signature: '| { type: "space.runCell"; path: string; itemId: string; label: string; code: string; requestId: string }'}
      - {path: packages/core/src/qmd/compute/cellRunner.ts, signature: 'export type CellRunState = "running" | "done" | "error" | "cancelled" | "missing-python";'}
    decided:
      - "D11: a view never runs code; it asks its host. One pair per protocol, in that protocol's naming style: library UI `paper.runCell {id, itemId, label, code, requestId}` / `paper.cancelCell {requestId}`, reader `runCell {itemId, label, code, requestId}` / `cancelCell {requestId}`, spaces `space.runCell {path, itemId, label, code, requestId}` / `space.cancelCell {requestId}`. Host to view: `cellState {requestId, state}` with state `running | done | error | cancelled | missing-python` (`CellRunState`, declared once in `packages/core/src/qmd/compute/cellRunner.ts`, the three protocols import it)."
      - "`requestId` is made by the view and echoed by the host; a view ignores a `cellState` for an unknown request. Guards drop a message whole when `itemId`, `label`, `code` or `requestId` is missing, empty or not a string, or when `state` is not one of the five values."
      - "The host finds the item, runs the code with the runner of 12.7 or 12.8, writes the result with `writeCellOutput` into the item body, stores it through the notes store of that area (`PaperNotesStore.editItem`, the reader notes store, the Space notes store) and then pushes the updated items exactly as after any other write (`details`, `updateNotes`, the Space items message). `cellState done|error|cancelled|missing-python` follows that push; `cancelled` and `missing-python` write nothing."
      - "Whether a runner exists is a host fact: the host sets `canRunCells` on its first message of the area (library UI `details`, reader `init`, Space state). A view passes `onRunCell` to `mountQmdEditor` only when `canRunCells` is true; otherwise the Run button stays hidden (session 4 behaviour). Hosts without a runner (the terminal, build previews, read-only panes) never set it."
      - "A host without the runner port that receives a `runCell` anyway answers `cellState {state: \"error\"}`, logs it and writes nothing."
      - "Opening a note runs nothing: a view sends `runCell` only on the user pressing Run."
      - "These are core files; the host-side runner (`NodeCellRunner`, helper client) and the wiring of the port are 12.7 (VS Code) and 12.8 (browser). Project notes and comments use no core view protocol: project notes are 9.7 and 9.8, comments pass no `onRunCell`."
      - "Apply the design outcome of 12.6 for the states shown (Run, running with Cancel, error, install prompt)."
      - "Reader view-to-host messages use the `command` discriminant like every WebviewToHost message (`runCell`, `cancelCell`); host-to-view uses `type: cellState`. Library UI and Spaces use `type` (`paper.*`, `space.*`)."
      - "Host-to-view messages are not guarded: views trust their host, as for every existing host message. The only view-side check is that a `cellState` for a requestId the view did not send is ignored."
      - "canRunCells placement: library UI on the `details` message and in its `details` payload (either is read); reader on `init`; Spaces on the `space` state (SpaceSnapshot). Absent means false."
      - "Reader seam: NotesTab and NoteBoxLayer keep their 7.x constructors (ctx with `eventBus` and `host`); the reader's init handler calls setCanRunCells(init.canRunCells === true) on both, a `cellState` message is routed to showCellState on both, and Run posts `{command: runCell, ...}` through ctx.host like the other reader messages."
      - "View affordances (12.6): the Run control is a <button> whose text, aria-label or title matches /run/i; while running it shows a Cancel <button> matching /cancel/i that sends the cancel message with the same requestId; done, error, cancelled and missing-python remove Cancel; missing-python shows text that mentions Python (the install prompt)."
      - "A `space.runCell` whose path is outside `notes/` or `discussions/` is dropped by parseSpacesMessage."
    acceptance:
      - {id: "12.5a", check: "each protocol's view-to-host guard accepts valid run and cancel messages and drops them with a missing, empty or mistyped field; a Space run outside notes/ or discussions/ is dropped"}
      - {id: "12.5b", check: "each view passes `onRunCell` to its editors only when the host says `canRunCells`, sends `runCell` with the item id, label, code and a request id when Run is pressed, shows Cancel while a matching `cellState` is running and removes it on the four end states, mentions Python on missing-python, and ignores a `cellState` for an unknown request (library UI, reader Notes tab and text boxes, Space notes and discussions)"}
    tests:
      hidden:
        - documents/plans/qmd-notes/tests/12.5/packages/core/__tests__/libraryUi/protocol/runCellMessages.test.ts
        - documents/plans/qmd-notes/tests/12.5/packages/core/__tests__/reader/protocol/runCellMessages.test.ts
        - documents/plans/qmd-notes/tests/12.5/packages/core/__tests__/spaces/runCellMessages.test.ts
        - documents/plans/qmd-notes/tests/12.5/packages/core/__tests__/libraryUi/dom/runCellView.test.ts
        - documents/plans/qmd-notes/tests/12.5/packages/core/__tests__/reader/dom/runCellView.test.ts
        - documents/plans/qmd-notes/tests/12.5/packages/core/__tests__/spaces/dom/runCellView.test.ts
      command: "node scripts/agents/run.mjs test core --spec 12.5 --plan qmd-notes -- packages/core/__tests__/libraryUi packages/core/__tests__/reader packages/core/__tests__/spaces"
    commands:
      - node scripts/agents/run.mjs typecheck core
      - node scripts/agents/run.mjs test core
