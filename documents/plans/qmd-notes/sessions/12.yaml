  - id: "12.1"
    plan: qmd-notes
    goal: A runtime-neutral `ICellRunner` port and the function that turns a run result into an output block inside the note.
    level: contract
    runner: {agent: implementer, model: opus}
    edit:
      - {path: packages/core/src/qmd/cellOutput.ts, lines: "20-69", why: "CreateOutputInput gains an optional status; formatOutput writes it as the last opener attribute when present"}
      - {path: documents/contracts/qmd-items.md, lines: "42-48", why: "#outputs: document the optional status=error attribute"}
    create:
      - packages/core/src/qmd/compute/index.ts
      - packages/core/src/qmd/compute/cellRunner.ts
      - packages/core/src/qmd/compute/writeCellOutput.ts
    read:
      - {path: packages/core/src/qmd/cellOutput.ts, lines: "1-76", why: "findOutputs and deriveCodeHash (the cell source hash, async) to reuse by import"}
      - {path: packages/core/src/qmd/itemUpdate.ts, lines: "92-135", why: "setItemBody and the item edit style; the writer returns a new body, the host stores it"}
      - {path: packages/core/src/qmd/itemFile.ts, lines: "1-60", why: "line splitting and code fence helpers (findCodeFences) to locate a cell and its end"}
    seams:
      - {path: packages/core/src/qmd/compute/cellRunner.ts, signature: 'export type CellStatus = "ok" | "error" | "timeout" | "cancelled" | "missing-python";'}
      - {path: packages/core/src/qmd/compute/cellRunner.ts, signature: "export interface CellResult { status: CellStatus; latex?: string; text?: string; error?: string; durationMs: number }"}
      - {path: packages/core/src/qmd/compute/cellRunner.ts, signature: "export interface ICellRunner { run(code: string, opts: { cwd: string; signal: AbortSignal; timeoutMs: number }): Promise<CellResult> }"}
      - {path: packages/core/src/qmd/compute/writeCellOutput.ts, signature: "export function writeCellOutput(body: string, cellLabel: string, result: CellResult, meta: { engine: string; ran: string }): Promise<string>"}
      - {path: packages/core/src/qmd/cellOutput.ts, signature: "export interface CreateOutputInput { readonly cell: string; readonly source: string; readonly engine: string; readonly ran: string; readonly content: string; readonly status?: \"error\" }"}
    decided:
      - "D11: cells run through a core port ICellRunner in packages/core/src/qmd/compute/cellRunner.ts; cancel kills the process (12.2, 12.3). The port is runtime-neutral: no Node import in cellRunner.ts, writeCellOutput.ts or index.ts."
      - "CellResult.status is one of ok, error, timeout, cancelled, missing-python; latex, text and error are optional; durationMs is always present."
      - "writeCellOutput takes an item body, a cell label and a result and returns the new body. It inserts or replaces the `::: {.labshelf-output cell=<label> source=<hash> engine=... ran=...}` block right after that cell (D3). source = deriveCodeHash(cell code) from packages/core/src/qmd/cellOutput.ts (first 12 hex chars of SHA-256, `#|` lines excluded, trailing newline trimmed); ran is ISO-8601 UTC; engine is like `python-3.12 sympy-1.13`. The function is async because deriveCodeHash is."
      - "Block content: `$$ <latex> $$` when latex is present, else the text in a plain fenced code block; an error result writes the error text and the block gets the attribute status=error. cancelled and missing-python write nothing and return the body unchanged. Uses formatOutput and findOutputs from cellOutput.ts; a formatOutput throw (content closing the block early) is not caught."
      - "A cell without `#| label:` gets `#| label: cell-<n>` written on first run (n = the cell position in the item, 1-based) so the output can reference it; a rerun finds the cell by that label and replaces the existing block."
      - "Writes never touch text outside the item body it was given (the host passes one item body and stores the result with setItemBody)."
      - "The default timeout of 60 s is passed by the host, not by the port."
      - "Content format: latex as the single line `$$ <latex> $$\\n`; text without latex as ```` ```\\n<text>\\n```\\n ````; an error as the error text in the same plain fenced block. The block follows the cell's closing fence on the next line; a rerun replaces the old block in place."
      - "The error opener comes from formatOutput with status \"error\" (cellOutput.ts is extended for it, its existing callers and tests are unchanged since the field is optional); an ok block has no status attribute."
      - "A timeout result writes like an error: a status=error block whose text is result.error when present, else `timed out after <round(durationMs / 1000)> s`."
      - "The caller passes the label: the existing `#| label:` or `cell-<n>` for an unlabeled cell. Writing the label does not change the source hash (deriveCodeHash skips `#|` lines). A cancelled or missing-python result adds no label either."
      - "A body with no cell for the label is returned unchanged."
      - "finish checks the write-back against documents/contracts/qmd-items.md#outputs."
    acceptance:
      - {id: "12.1a", check: "a first run inserts the output block right after its cell"}
      - {id: "12.1b", check: "a rerun replaces the existing block for that cell instead of adding a second"}
      - {id: "12.1c", check: "an error result writes the error text with status=error"}
      - {id: "12.1d", check: "a cell without a label gets `#| label: cell-<n>` on first run"}
      - {id: "12.1e", check: "text and items outside the given body are byte-identical; cancelled and missing-python leave the body unchanged"}
