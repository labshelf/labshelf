  - id: "12.5"
    plan: qmd-notes
    goal: Each core view that mounts `mountQmdEditor` (paper detail notes, reader Notes tab and text boxes, Space notes and discussions) passes `onRunCell`, which asks its host to run the cell through one message pair per protocol and receives the cell state.
    level: contract
