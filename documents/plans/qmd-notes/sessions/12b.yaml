        - documents/plans/qmd-notes/tests/12.5/packages/core/__tests__/reader/protocol/runCellMessages.test.ts
        - documents/plans/qmd-notes/tests/12.5/packages/core/__tests__/spaces/runCellMessages.test.ts
        - documents/plans/qmd-notes/tests/12.5/packages/core/__tests__/libraryUi/dom/runCellView.test.ts
        - documents/plans/qmd-notes/tests/12.5/packages/core/__tests__/reader/dom/runCellView.test.ts
        - documents/plans/qmd-notes/tests/12.5/packages/core/__tests__/spaces/dom/runCellView.test.ts
      command: node scripts/agents/run.mjs test core --spec 12.5 --plan qmd-notes -- packages/core/__tests__/libraryUi packages/core/__tests__/reader packages/core/__tests__/spaces
    commands:
