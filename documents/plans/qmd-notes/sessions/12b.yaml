        signature: "export function createCellHandlers(options: { runner: ICellRunner; resolveCwd(scope: string): string | undefined; logger: ILogger }): { runCell: HelperHandler; cancelCell: HelperHandler }"
      - path: packages/core/src/helper/helperPaths.ts
        signature: "runCell(request: { code: string; cwd: string; timeoutMs: number }, signal: AbortSignal): Promise<CellResult>;"
      - path: packages/core/src/helper/helperMessages.ts
        signature: '| { type: "runCell"; code: string; cwd: string; timeoutMs: number } | { type: "cancelCell"; requestId: string } // ToHelperMessage; ToPageMessage gains { type: "cellResult"; status: CellStatus; latex?: string; text?: string; error?: string; durationMs: number }'
      - path: packages/core/src/helper/helperMessages.ts
        signature: export const MAX_CELL_CODE_BYTES = 1024 * 1024; export const MAX_CELL_TIMEOUT_MS = 600_000;
      - path: packages/core/src/helper/node/helperProjects.ts
        signature: "rootOf(projectId: string): string | undefined; // on LibraryProjects"
    decided:
      - "Message runCell {code, cwd, timeoutMs} answers cellResult carrying the CellResult fields, with the envelope id as the request id. cwd names a project id or a paper scope, never a raw path: the helper resolves it from its known projects and papers and refuses an unknown one with an error reply."
      - Message cancelCell {requestId} is UNQUEUED (added to the UNQUEUED set in helperHandlers.ts) and aborts that run signal.
      - Handlers live in packages/core/src/helper/node/cellHandlers.ts (flat in helper/node, per the current layout); the abort controller of a run is registered before any await, as the build token is.
      - PROTOCOL_VERSION is bumped by one over the value left by session 11 and documents/contracts/helper.md documents runCell, cancelCell, cellResult and the version.
      - ILatexHelper.runCell posts cancelCell with the run id when the signal aborts; the page never sees the request id.
      - Input limits (code size, timeoutMs range) are enforced in parseHelperMessage and stated in helper.md.
      - PROTOCOL_VERSION is 7 (session 11 leaves 6); any other v, including a string, is refused with code version as today.
      - "code: a string of at most MAX_CELL_CODE_BYTES (1 MiB); larger is refused with code limit. timeoutMs: an integer 1..600000; anything else (0, negative, fractional, string, null, larger) is refused."
      - "cwd is a scope, not a path: a project id (isHelperProjectId) or `paper:<paperId>`. Empty, or containing `/`, `\\`, `~` at the start, or equal to `..` is refused by the guard (code project-id). Keys a message does not define are dropped."
      - cellResult is a toPage message only (runCell and cancelCell are toHelper only; the wrong direction is unknown-type); status must be one of the five CellStatus values and durationMs a number.
      - runHelperHost resolves a project id to LibraryProjects.rootOf (the folder while the project is open) and `paper:<id>` to os.tmpdir(); anything else is undefined, and createCellHandlers then replies `error` under the request id without running. The runner is createNodeCellRunner over the shared Python provider of session 11.
      - runCell stays queued; cancelCell for an id that is not running answers nothing and does not fail the dispatcher. The run's cellResult (including cancelled) is sent under the runCell envelope id.
      - finish checks the messages against documents/contracts/helper.md.
    acceptance:
