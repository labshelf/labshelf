      - {path: documents/contracts/qmd-items.md, lines: "7-14", why: "#format"}
    seams:
      - {path: packages/core/src/qmd/sendTo/sendTo.ts, signature: "export type SendTarget = { kind: 'projectNote'; projectId: string; path: string } | { kind: 'spaceNote'; spaceId: string; path: string } | { kind: 'discussion'; spaceId: string; path: string }"}
      - {path: packages/core/src/qmd/sendTo/sendBody.ts, signature: "export type SendPayload = { kind: 'quote'; key: string; page: number; text: string } | { kind: 'figure'; key: string; page: number; image: Uint8Array; mime: string } | { kind: 'equation'; key: string; page: number; latex: string } | { kind: 'item'; sourcePath: string; itemId: string; body: string }"}
      - {path: packages/core/src/qmd/sendTo/sendBody.ts, signature: "export function createSendBody(payload: SendPayload, itemId: string): string"}
      - {path: packages/core/src/qmd/sendTo/sendTo.ts, signature: "export interface SendExtra { itemId?: string; author?: string; blob?: { path: string; bytes: Uint8Array } }"}
      - {path: packages/core/src/qmd/sendTo/sendTo.ts, signature: "export interface ISendTargetWriter { append(target: SendTarget, body: string, extra?: SendExtra): Promise<void> }"}
      - {path: packages/core/src/qmd/sendTo/sendTo.ts, signature: "export interface SendRequest { target: SendTarget; payload: SendPayload; sender?: string }"}
      - {path: packages/core/src/qmd/sendTo/sendTo.ts, signature: "export function sendTo(writers: Partial<Record<SendTarget['kind'], ISendTargetWriter>>, deps: { logger: ILogger; newItemId: () => string }): (request: SendRequest) => Promise<{ itemId: string }>"}
      - {path: packages/core/src/qmd/sendTo/projectNoteWriter.ts, signature: "export interface IProjectAssetWriter { write(projectId: string, path: string, bytes: Uint8Array): Promise<void> }"}
      - {path: packages/core/src/qmd/sendTo/projectNoteWriter.ts, signature: "export function createProjectNoteWriter(store: ProjectNotesStore, assets: IProjectAssetWriter): ISendTargetWriter"}
      - {path: packages/core/src/qmd/sendTo/recentTargets.ts, signature: "export interface IKeyValueStore { get(key: string): Promise<unknown>; set(key: string, value: unknown): Promise<void> }"}
      - {path: packages/core/src/qmd/sendTo/recentTargets.ts, signature: "export function createRecentTargets(store: IKeyValueStore, key: string): { list(): Promise<SendTarget[]>; push(target: SendTarget): Promise<void> }"}
    decided:
      - "Code in `packages/core/src/qmd/sendTo/`: `sendBody.ts` (`SendPayload`, `createSendBody`), `sendTo.ts` (`SendTarget`, `SendExtra`, `ISendTargetWriter`, `SendRequest`, `sendTo`), `projectNoteWriter.ts` (the `projectNote` writer over `ProjectNotesStore`), `recentTargets.ts` (`IKeyValueStore`, `createRecentTargets`), `index.ts` exporting all of them."
      - "`sendTo` picks the item id first with the injected `newItemId()`, builds the body with `createSendBody(payload, itemId)`, and calls the writer of `target.kind` with `extra = {itemId, author: request.sender, blob}`; `blob` is set for a figure only, as `{path: \"assets/<item id>.png\", bytes: payload.image}`. It resolves `{itemId}`. A target kind with no registered writer rejects with an error and is logged. The `created` time comes from the store, not from `sendTo`."
      - "`blob.path` is relative to the folder of the target file (the folder holding `target.path`), so the body's `![](assets/<item id>.png)` resolves from the note. Writers write the blob first and append the item only after the blob write succeeded."
      - "A writer error (blob or append) makes `sendTo` log it through `logger.error` with the target and reject with the same error; on a blob failure the note file is never written."
      - "Bodies (blocks separated by one blank line): quote is every line of `text` prefixed `> `, then `[<key>, p. <page>](labshelf:<key>#p<page>)`, e.g. `> Attention is all you need.\\n\\n[vaswani2017, p. 3](labshelf:vaswani2017#p3)`; equation is `$$\\n<latex>\\n$$` then the same link; figure is `![](assets/<item id>.png)` then the same link; item is its `body` then `[Source](<sourcePath>#<itemId>)` with the source item's path and id. The link format follows `formatPaperLink` in `library/record.ts`."
      - "`createProjectNoteWriter` appends with `store.addItem(projectId, target.path, body, extra.author, extra.itemId)` and writes a blob through `IProjectAssetWriter.write(projectId, <dirname of target.path>/<blob.path>, bytes)` (path relative to the project folder). A target path whose file does not exist yet is created by `addItem` (9.1), holding just the sent item."
      - "Recents: `list` gives at most 8 targets, most recent first; `push` moves an equal target (same kind, project or space id, path) to the front instead of duplicating it; a stored value that is not a valid list reads as empty. Stored device-locally under `key` through `IKeyValueStore` (VS Code `globalState`, browser `chrome.storage.local`), never in the library. The caller pushes after a successful send."
      - "Space targets write through session 10's writers (10.7); until they are registered, `spaceNote`/`discussion` sends reject as unregistered and the menu lists projects only."
      - "The project checklist note is an ordinary project note: no separate kind."
    acceptance:
      - {id: "9.3a", check: "createSendBody gives the documented body for each payload kind (quote, equation, figure with `assets/<item id>.png`, item with its source link)"}
      - {id: "9.3b", check: "sendTo with the `createProjectNoteWriter` writer to a project note path that does not exist yet creates that file holding one item whose id is the injected `newItemId()` and whose author is the request `sender`"}
      - {id: "9.3c", check: "after 10 pushes `list` returns the last 8, most recent first; pushing an existing target moves it to the front without a duplicate"}
      - {id: "9.3d", check: "a figure send whose asset write rejects makes `sendTo` reject, leaves the note file unwritten and logs one error; a successful figure send writes `notes/assets/<item id>.png` before the item"}
    tests:
      hidden: [documents/plans/qmd-notes/tests/9.3/packages/core/__tests__/qmd/sendTo/sendTo.test.ts]
      command: "node scripts/agents/run.mjs test core --spec 9.3 --plan qmd-notes -- packages/core/__tests__/qmd/sendTo/sendTo.test.ts"
    commands:
      - node scripts/agents/run.mjs typecheck core
      - node scripts/agents/run.mjs test core
    do_not_touch:
      - packages/core/src/library/record.ts
      - apps

