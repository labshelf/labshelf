        check: createSendBody gives the documented body for each payload kind (quote, equation, figure with `assets/<item id>.png`, item with its source link)
      - id: 9.3b
        check: sendTo with the `createProjectNoteWriter` writer to a project note path that does not exist yet creates that file holding one item whose id is the injected `newItemId()` and whose author is the request `sender`
