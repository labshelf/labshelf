      - packages/core/src/qmd/item/itemUpdate.ts
      - "the `.labshelf/checklist.json` format (`parseChecklistFile`, `serializeChecklistFile`, `ManualItem`)"

  - id: "9.3"
    plan: qmd-notes
    goal: "D10: \"Send to…\" on a selection (PDF passage, figure crop, equation, item) appends an item with a `labshelf:` back-link to a chosen `.qmd` target, remembering recent targets per device."
    level: contract
    runner: {agent: implementer, model: opus}
    depends_on: ["9.1"]
    edit:
