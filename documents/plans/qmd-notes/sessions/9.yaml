schema: session/v1
id: "9"
goal: Projects hold notes as `.qmd` files in `notes/`; task-list items in them are checklist items ticked from either place; any reader selection or editor item can be sent to a `.qmd` target with a back-link; a manuscript line that cites a paper shows that paper's notes.
depends_on: ["7", "8"]
owns:
  - packages/core/src/qmd/index.ts
  - packages/core/src/qmd/projectNotes/
  - packages/core/src/qmd/sendTo/
  - packages/core/src/writing/checks/
  - packages/core/src/writing/citations/
  - packages/core/src/reader/dom/
  - packages/vscode/src/writing/
  - packages/vscode/src/activation/startExtension.ts
  - packages/vscode/package.json
  - packages/browser/src/writing/
  - packages/browser/src/libraryUi/
  - packages/browser/src/storage/
  - documents/contracts/library-format.md
  - documents/contracts/qmd-items.md
  - packages/core/__tests__/qmd/projectNotes/
  - packages/core/__tests__/qmd/sendTo/
  - packages/core/__tests__/writing/checks/
  - packages/core/__tests__/writing/citations/
  - packages/core/__tests__/reader/dom/
  - packages/vscode/__tests__/writing/
  - packages/browser/__tests__/writing/
  - packages/browser/__tests__/libraryUi/
  - packages/browser/__tests__/storage/
status: pending
packages:
  - id: "9.1"
    plan: qmd-notes
    goal: "`ProjectNotesStore` lists, creates, reads and edits the `.qmd` notes of a project."
    level: contract
    runner: {agent: implementer, model: sonnet}
    edit:
      - {path: packages/core/src/qmd/index.ts, lines: "1-6", why: "export the project notes API"}
    create:
      - packages/core/src/qmd/projectNotes/
    read:
      - {path: packages/core/src/qmd/paperNotes.ts, lines: "1-200", why: "PaperNotesStore: store shape to mirror (created by session 6)"}
      - {path: packages/core/src/qmd/item/itemUpdate.ts, lines: "92-140", why: "pure addItem, setItemBody, removeItem on an ItemFile, and newItemId (:45)"}
      - {path: packages/core/src/qmd/item/itemFile.ts, lines: "341-395", why: "parseItemFile and serializeItemFile"}
      - {path: packages/core/src/writing/project/projectFile.ts, lines: "120-130", why: "PROJECT_FORMATS stays latex/typst"}
      - {path: packages/core/src/collab/commentsFile.ts, lines: "1-180", why: "injected file access pattern (comments file store)"}
      - {path: documents/contracts/qmd-items.md, lines: "15-60", why: "#items and #merge"}
    seams:
      - {path: packages/core/src/qmd/projectNotes/noteSlug.ts, signature: "export function deriveNoteSlug(title: string, taken: ReadonlySet<string>): string"}
      - {path: packages/core/src/qmd/projectNotes/projectNotesStore.ts, signature: "export interface IProjectNoteFiles { list(projectId: string): Promise<string[]>; read(projectId: string, path: string): Promise<string | null>; write(projectId: string, path: string, text: string): Promise<void> }"}
      - {path: packages/core/src/qmd/projectNotes/projectNotesStore.ts, signature: "export function createProjectNotesStore(files: IProjectNoteFiles, logger: ILogger): ProjectNotesStore"}
      - {path: packages/core/src/qmd/projectNotes/projectNotesStore.ts, signature: "export interface ProjectNoteEntry { path: string; title: string }"}
      - {path: packages/core/src/qmd/projectNotes/projectNotesStore.ts, signature: "export interface ProjectNotesStore { list(projectId: string): Promise<ProjectNoteEntry[]>; create(projectId: string, title: string): Promise<string>; read(projectId: string, path: string): Promise<string | null>; addItem(projectId: string, path: string, body: string, author?: string, id?: string): Promise<string>; editItem(projectId: string, path: string, id: string, body: string): Promise<void>; removeItem(projectId: string, path: string, id: string): Promise<void> }"}
    decided:
      - "Project notes are `<project>/notes/<slug>.qmd`; slug = lowercase ASCII words of the title joined by `-`, suffix `-2`, `-3` on collision. The first item's body starts with `# <title>`. `PROJECT_FORMATS` stays `latex`/`typst` (notes are not a manuscript format)."
      - "Files under `packages/core/src/qmd/projectNotes/`: `projectNotesStore.ts` (`ProjectNotesStore` with `list(projectId)`, `create(projectId, title)`, `read(projectId, path)`, `addItem`, `editItem`, `removeItem`), `noteSlug.ts`, `index.ts`. `ProjectNotesStore` is a thin layer over the pure `addItem`/`setItemBody`/`removeItem` of `qmd/itemUpdate.ts` and the parser of `qmd/itemFile.ts`."
      - "File IO goes through an injected `IProjectNoteFiles {list, read, write}` port; each write re-reads, applies, writes atomically, serial per file. A missing file reads as empty. Every write failure is logged through `ILogger`."
      - "Merge across devices is the block merge of `qmd/mergeItemFiles.ts` (`.qmd` is already in the mergeable set); nothing here."
      - "The store is runtime-neutral; the apps build `IProjectNoteFiles` in their composition roots."
      - "Port paths are relative to the project folder (`notes/<slug>.qmd`); `IProjectNoteFiles.list` may return any project file paths and the store keeps only names ending exactly in `.qmd` (not `.qmd.bak`). Taken slugs for `create` are the base names of the listed `.qmd` files. `create` returns the new path."
      - "`addItem` returns the item id (a new `newItemId()` unless `id` is passed, which Send to uses); `addItem` on a missing file creates the file with that one item. `editItem` and `removeItem` change only the named item. `read` returns the file text or `null`."
    acceptance:
      - {id: "9.1a", check: "create with a title whose slug is taken gives `-2`, then `-3`; the first item body starts with `# <title>`"}
      - {id: "9.1b", check: "list ignores files that are not `.qmd`"}
      - {id: "9.1c", check: "two concurrent addItem on one file keep both items"}
    tests:
      hidden: [documents/plans/qmd-notes/tests/9.1/packages/core/__tests__/qmd/projectNotes/projectNotesStore.test.ts]
      command: "node scripts/agents/run.mjs test core --spec 9.1 --plan qmd-notes -- packages/core/__tests__/qmd/projectNotes/projectNotesStore.test.ts"
    commands:
      - node scripts/agents/run.mjs typecheck core
      - node scripts/agents/run.mjs test core
