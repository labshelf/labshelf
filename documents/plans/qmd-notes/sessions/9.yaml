        signature: "export type SendPayload = { kind: 'quote'; key: string; page: number; text: string } | { kind: 'figure'; key: string; page: number; image: Uint8Array; mime: string } | { kind: 'equation'; key: string; page: number; latex: string } | { kind: 'item'; sourcePath: string; itemId: string; body: string }"
      - path: packages/core/src/qmd/sendTo/sendBody.ts
        signature: "export function createSendBody(payload: SendPayload, itemId: string): string"
      - path: packages/core/src/qmd/sendTo/sendTo.ts
