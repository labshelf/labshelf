      - packages/core/src/qmd/item/itemFile.ts
      - packages/core/src/qmd/item/itemUpdate.ts
      - packages/core/src/qmd/item/mergeItemFiles.ts
      - apps

  - id: "9.2"
    plan: qmd-notes
    goal: "D9: the checklist and problems are views derived from project `.qmd` files; `- [ ]` / `- [x]` in a project note is a checklist item, and ticking it in the Checklist view edits the note."
    level: contract
    runner: {agent: implementer, model: sonnet}
    depends_on: ["9.1"]
    edit:
      - {path: packages/core/src/writing/checks/checklist.ts, lines: "152-258", why: "ChecklistInput (:152), ChecklistItem (:164), toItems (:198), byKind (:212), bySection (:231) gain the noteTask member"}
      - {path: packages/core/src/writing/checks/checklistSignals.ts, lines: "1-116", why: "readChecklistSignals fills noteTasks from ProjectNotesStore.list"}
      - {path: packages/core/src/writing/checks/checklistSidebar.ts, lines: "20-80", why: "row key (:24-29) and row (:67-75) for a noteTask"}
      - {path: packages/core/src/writing/checks/index.ts, lines: "1-11", why: "export the note task API"}
      - {path: packages/core/__tests__/writing/checks/checklist.test.ts, lines: "263-281", why: "the buildChecklist inputs gain `noteTasks` and `noteTitles`"}
      - {path: packages/core/__tests__/writing/checks/checklistSignals.test.ts, lines: "170-180", why: "the empty signals gain `noteTasks: []`"}
    create:
      - packages/core/src/writing/checks/noteTasks.ts
    read:
      - {path: documents/plans/qmd-notes/research/comments-checklist.md, lines: "28-33", why: "Checklist section of the research"}
      - {path: packages/core/src/writing/checks/todoMarkers.ts, lines: "1-54", why: "scanTodos, the sibling signal scanner"}
      - {path: packages/core/src/qmd/projectNotes/projectNotesStore.ts, lines: "1-200", why: "ProjectNotesStore (created by 9.1)"}
    seams:
      - {path: packages/core/src/writing/checks/noteTasks.ts, signature: "export interface NoteTask { file: string; itemId: string; line: number; text: string; done: boolean }"}
      - {path: packages/core/src/writing/checks/noteTasks.ts, signature: "export function scanNoteTasks(file: string, text: string): NoteTask[]"}
      - {path: packages/core/src/writing/checks/noteTasks.ts, signature: "export function toggleNoteTask(store: ProjectNotesStore, projectId: string, task: NoteTask): Promise<{ status: 'ok' } | { status: 'changed' }>"}
    decided:
      - "New input field `noteTasks: NoteTask[]` on `ChecklistInput` with `NoteTask = {file, itemId, line, text, done}` (line = zero-based line inside the file); new union member `{kind: \"noteTask\", done: boolean, task: NoteTask}` of `ChecklistItem`, grouped as `todo` in `byKind`, placed under the note's title in `bySection`."
      - "Code in `packages/core/src/writing/checks/noteTasks.ts`: `scanNoteTasks` reads task-list lines from item bodies, skipping code cells and output blocks; `toggleNoteTask` flips `[ ]` and `[x]` on that line through `ProjectNotesStore.editItem`, after checking the line text still matches, else reports \"changed on disk\" and the caller rereads."
      - "`readChecklistSignals` fills `noteTasks` from `ProjectNotesStore.list` (the store is passed in the read context by the apps). Manual `.labshelf/checklist.json` items stay as they are."
      - "`scanNoteTasks(file, text)` takes the whole `.qmd` text; only lines inside `.labshelf-item` blocks count; lines inside code fences (```` ```{lang} ```` cells and plain ```` ``` ```` fences) and inside `.labshelf-output` blocks are skipped; `line` is zero-based in the file; `text` is the line without the `- [ ] ` / `- [x] ` marker."
      - "`toggleNoteTask` passes `task.file` as the path to `ProjectNotesStore.editItem`, writes once on success, keeps every other byte (CRLF included), and returns `{status: 'changed'}` with no write when the line on disk differs in any way from the task (other text, lines moved, already in the target state)."
      - "`readChecklistSignals(context, project, notes?: { store: ProjectNotesStore; projectId: string })` gains an optional third argument (no change to `ProjectReadContext`); `ChecklistSignals` gains `noteTasks: NoteTask[]` and `noteTitles: Map<string, string>` (file to title from `list`), both empty when `notes` is absent. `ChecklistInput` gains the same two fields; `bySection` puts a note's tasks under section `{id: \"note:<file>\", title, file}`."
      - "`checklistSidebar.ts` renders a noteTask row with the note's title as tooltip and a link to the note; the row key is `noteTask:<file>:<itemId>:<line>`."
    acceptance:
      - {id: "9.2a", check: "scanNoteTasks finds open and done tasks and ignores tasks inside code cells and output blocks"}
      - {id: "9.2b", check: "toggleNoteTask edits only that line of the note"}
      - {id: "9.2c", check: "toggleNoteTask on a line that changed refuses and leaves the file untouched"}
    tests:
      hidden: [documents/plans/qmd-notes/tests/9.2/packages/core/__tests__/writing/checks/noteTasks.test.ts]
      command: "node scripts/agents/run.mjs test core --spec 9.2 --plan qmd-notes -- packages/core/__tests__/writing/checks/noteTasks.test.ts"
    commands:
      - node scripts/agents/run.mjs typecheck core
      - node scripts/agents/run.mjs test core
    do_not_touch:
