    decided:
      - "Message `installPython {}` produces `progress` (new phase `python` in `PROGRESS_PHASES`) then `ready`; `ready` gains an optional `python: \"missing\" | \"installed\"` (the parser rejects any other value with `invalid-field` and keeps it absent when absent). The hello `ready` and the `installPython` `ready` always carry it; the TeX install replies do not (they stay unchanged), and the client keeps the last known `python` when a `ready` omits it."
      - "installPython handler: throws if handed another type (like the TeX handlers); sends `{type: \"progress\", phase: \"python\", message: \"Installing Python\", fraction?}` for each provider progress callback (fraction only when given), then `{type: \"ready\", protocol: PROTOCOL_VERSION, helperVersion, host, tex: await texStatus(), python: <installed status>.state}` with the request id. When install throws: log through `logger.error`, send `{type: \"error\", code: \"python-install-failed\", message: formatError(error)}` with the request id, and no ready."
      - "runHelperHost builds `options.python ?? createSharedPythonProvider({env: process.env, platform: process.platform, homeDir: os.homedir(), logger, fetchImpl: fetch})`, spreads `createPythonHandlers({python, texStatus: () => tex.status(), helperVersion, host, logger})` into the handlers and passes `pythonStatus: () => python.status()` to answerHello. Handler map type is `HelperHandlers` from helperHandlers.ts."
      - "Handler file `packages/core/src/helper/node/pythonHandlers.ts` is modelled on the TeX install handlers in `helperHandlers.ts` and spread into `runHelperHost.ts`. Queued (not UNQUEUED). The provider defaults to `createSharedPythonProvider` when `runHelperHost` options give none, so no app wiring changes."
      - "Bump `PROTOCOL_VERSION` by one (documents/code.md#messages: a changed message raises the version)."
      - "finish checks this against documents/contracts/helper.md."
    acceptance:
      - {id: "11.2a", check: "guard test: `installPython` passes the parser and a malformed one is dropped"}
      - {id: "11.2b", check: "createPythonHandlers with a fake provider: installPython sends progress with phase python (one per provider callback, same id) then ready with python installed and tex from texStatus; a provider whose install throws yields one error with code python-install-failed and no ready; answerHello with pythonStatus returning missing sends a ready with python missing"}
      - {id: "11.2c", check: "PROTOCOL_VERSION is one higher and a client with the old version is refused"}
