        - documents/plans/qmd-notes/tests/11.2/packages/core/__tests__/helper/node/pythonHandlers.test.ts
      command: "node scripts/agents/run.mjs test core --spec 11.2 --plan qmd-notes -- packages/core/__tests__/helper/parseInstallPython.test.ts packages/core/__tests__/helper/node/pythonHandlers.test.ts"
