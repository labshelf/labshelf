    decided:
      - "D11: Python + SymPy is a managed tool under `<shared root>/python/`, pinned by version and SHA-256 like TeX. No Pyodide, nothing bundled in the extension."
      - "Pin `packages/core/src/qmd/compute/pythonPin.ts` (runtime-neutral data): python-build-standalone release tag and Python version, one `{url, sha256}` per `darwin-arm64`, `darwin-x64`, `linux-x64`, `linux-arm64`, `win32-x64` (`install_only` archives); `sympy` and `mpmath` pure-Python wheels `{version, url, sha256}`."
      - "Node code is flat in `packages/core/src/qmd/compute/node/` (documents/code.md#modules: one concept per file, a file under 80 lines used by one file belongs in it): `managedPython.ts` (layout, status, install under `withToolLock(root, \"install\", logger, …)`; the shared factory with root `resolveSharedToolsDir(...)/\"python\"`), `installPython.ts` (download each archive with `downloadVerified`, stage in the staging dir, extract and take the single top dir, install wheels by unzipping into `site-packages` (a wheel is a zip; no pip run), clear quarantine on macOS, swap in), `index.ts` (exports managedPython.ts's public names)."
      - "Layout: the archive's single top dir (python-build-standalone `install_only`, top dir `python/`) becomes the contents of `<root>`: `managedPythonPaths` gives the interpreter `<root>/bin/python3` and site-packages `<root>/lib/python<major.minor>/site-packages` (major.minor from `PYTHON_PIN.version`), and on win32 `<root>/python.exe` and `<root>/Lib/site-packages`. The hidden test fixture also carries `bin/<arch>/python` files; the implementation relies only on these paths."
      - "Status (no lock, creates nothing on disk): installed when the interpreter file and `<sitePackages>/sympy-<pin sympy version>.dist-info` both exist; it reports `{state: \"installed\", version: PYTHON_PIN.version, sympy: PYTHON_PIN.wheels.sympy.version}` with exactly these three keys, else `{state: \"missing\"}`."
      - "`pythonPath()` returns the interpreter path of `managedPythonPaths` whether or not it is installed; the managed and shared providers implement it. It is optional on the interface so fakes with only status and install stay valid; session 12's runner treats a provider without it as missing Python."
      - "Archive key `${platform}-${arch}` with `arch` defaulting to `process.arch`; a key missing from `PYTHON_PIN.archives` throws `no Python build for <key>`. Every archive is `.tar.gz` (extractArchive kind `tar.gz`)."
      - "Install, inside the lock: when `<root>/.pin.json` equals the JSON of `{release, version, archive: <this key's {url, sha256}>, wheels}` of the current pin, return status without downloading (the recheck that makes a concurrent second install a no-op); otherwise download and verify the archive and both wheels with `downloadVerified` before anything is written, then in `withStagingDir(root, \"python\", …)`: extract, `findSingleTopDir`, unzip the wheels into the staged tree's site-packages, then swap in: remove every entry of `<root>` except `.lock` and `.staging-*`, rename each child of the staged top dir into `<root>`, write `.pin.json` last. On darwin run `removeQuarantine(root, …)` after the swap. A failed install leaves the previous install and `.pin.json` as they were."
      - "Wheel unzip without external tools (GNU tar on Linux cannot read zip): read the end-of-central-directory record and central directory with Buffer, inflate method 8 with `zlib.inflateRawSync`, copy method 0, reject other methods and entry names that are absolute or contain `..`; directories come from the entry paths. Lives in installPython.ts."
      - "Progress: `onProgress(message, fraction)` with fractions in 0..1 (downloads, extract, wheels, 1 at the end)."
      - "Reuse `resolveSharedToolsDir`, `withToolLock`, `downloadVerified` and `extractArchive` from `packages/core/src/latex/node/` by import; the staging-dir, single-top-dir and clear-quarantine helpers of the TeX install are imported too (find them with `node scripts/code/facts.mjs fn 'stage install dir'` or `def`); never copy. `withStagingDir` and `findSingleTopDir` are private to `texInstallers.ts`: add `export` to both (the only edit under packages/core/src/latex/); `removeQuarantine` and `RunFile` are already exported."
      - "Status is `{state: \"missing\"} | {state: \"installed\", version, sympy}`. A system Python is not used (pinned SymPy is the contract for reproducible outputs)."
      - "Progress and failures go through `ILogger`; a hash mismatch aborts before anything is written."
    acceptance:
      - {id: "11.1a", check: "install from local fixture archives into a temp root yields a layout whose status is installed with version and sympy"}
      - {id: "11.1b", check: "a hash mismatch leaves no folder"}
      - {id: "11.1c", check: "a second install under the lock waits and rechecks instead of installing twice"}
