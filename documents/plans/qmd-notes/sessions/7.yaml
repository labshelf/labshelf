  - id: "7.1"
    plan: qmd-notes
    goal: Design the Notes tab, its filter and rows, the text-box tool in the reader toolbar and the look of a box, and write the outcome into the decided of 7.4 and 7.6.
    level: task
    runner:
      agent: main
      model: opus
