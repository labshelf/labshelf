  - id: "7.2"
    plan: qmd-notes
    goal: Add the note messages to the reader protocol and their guards, and stop the protocol from creating annotations of type note.
    level: contract
    runner:
      agent: implementer
      model: sonnet
    depends_on: []
    edit:
      - path: packages/core/src/reader/protocol/messages.ts
        lines: 1-219
        why: HostToWebview init/updateNotes, WebviewToHost addNote/editNote/moveNote/removeNote, createAnnotation type narrowed to highlight, guards in isWebviewMessage
      - path: packages/core/src/reader/hostMessages.ts
        lines: 37-48
        why: "createAnnotation handler: only highlights are created, drop the store.addNote branch so it still typechecks"
      - path: packages/core/__tests__/reader/protocol/messages.test.ts
        lines: 1-1
        why: update any createAnnotation case that uses type note (re-locate with grep before editing)
    create: []
    read:
      - path: documents/plans/qmd-notes/research/reader.md
        lines: 16-19
        why: Protocol and sidebar
      - path: packages/core/src/reader/protocol/messages.ts
        lines: 78-99
        why: HostToWebview init and updateAnnotations
      - path: packages/core/src/reader/protocol/messages.ts
        lines: 122-150
        why: WebviewToHost createAnnotation and update/delete
      - path: packages/core/src/reader/protocol/messages.ts
        lines: 166-205
        why: isWebviewMessage guard
      - path: packages/core/src/qmd/item/itemFile.ts
        lines: 248-295
        why: ItemAnchor, parseAnchor, formatAnchor
    seams:
      - path: packages/core/src/reader/protocol/messages.ts
        signature: "export interface ReaderNote { id: string; anchor: string; body: string; created: string; author: string }"
    decided:
      - "Host to webview: `updateNotes {items: ReaderNote[]}`, also carried by `init` as `notes: ReaderNote[]` (the same list). `anchor` is the attribute string, empty when the item has none."
      - "Webview to host: `addNote {anchor: string, body: string}`, `editNote {id, body}`, `moveNote {id, anchor}` (text-box move/resize) and `removeNote {id}`."
      - "Anchors travel as the attribute string and the guard validates them with `parseAnchor` from `packages/core/src/qmd/item/itemFile.ts`: an anchor of unknown kind is rejected for `addNote` (and for `moveNote`, which also carries an anchor); an empty anchor is valid (unanchored)."
      - '`createAnnotation` creates only highlights: type becomes `"highlight"`, and its guard branch for `"note"` goes.'
      - The reader-host contract no longer exists (`documents/contracts/` holds only what both sides cannot read from one codebase), so the protocol is specified by these types and their guard tests; no contract file is edited. finish checks this against `documents/code.md#contracts`.
    acceptance:
      - id: 7.2a
        check: guard accepts valid addNote, editNote, moveNote and removeNote messages
      - id: 7.2b
        check: "guard rejects malformed note messages: empty id, non-string body, addNote with an anchor of unknown kind"
      - id: 7.2c
