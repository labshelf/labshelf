  - id: "7.5"
    plan: qmd-notes
    goal: Pure functions that find the largest empty box around a point of a page and snap a dragged box to text and page margins.
    level: behaviour
    runner:
      agent: implementer
      model: opus
    depends_on: []
    edit:
      - path: packages/core/src/reader/text/index.ts
        lines: 1-5
