        lines: 1-139
        why: "textBoxes, derivePageFrame, deriveBoxInPage: how text and page fractions are measured today (do not import DOM code into the new file)"
      - path: packages/core/src/reader/text/geometry.ts
        lines: 160-195
        why: existing Rect type in this folder
      - path: documents/plans/qmd-notes/research/reader.md
        lines: 32-33
        why: "Text layer: geometry exists only live in the DOM"
    seams:
      - path: packages/core/src/reader/text/textBoxPlacement.ts
        signature: "export interface PageRect { x: number; y: number; w: number; h: number }"
      - path: packages/core/src/reader/text/textBoxPlacement.ts
        signature: "export function fitEmptyBox(point: { x: number; y: number }, rects: readonly PageRect[]): PageRect | null"
      - path: packages/core/src/reader/text/textBoxPlacement.ts
        signature: "export function snapBox(rect: PageRect, rects: readonly PageRect[]): PageRect"
    decided:
      - "Runtime-neutral, no DOM, in `packages/core/src/reader/text/textBoxPlacement.ts` (the old plan's `reader/geometry/` folder is the existing runtime-neutral `reader/text/` folder now); inputs are in page fractions: text rects `{x, y, w, h}[]` and a click point or a drag rect."
      - "`fitEmptyBox(point, rects)`: the largest rectangle around the point that overlaps no text rect, capped at 0.4 page width and 0.25 page height, at least 0.05 by 0.03, else null."
      - "`snapBox(rect, rects)`: edges within 0.01 of a text rect edge or of the page margin snap to it; a rect overlapping text is shrunk off the text on its smallest-overlap side."
      - Fractions are rounded to 4 decimals (the anchor contract in `documents/contracts/qmd-items.md`).
      - "The page margin is the page edge: 0 and 1 on each axis."
      - "`fitEmptyBox`: the box contains the point; the caps apply per axis (w <= 0.4, h <= 0.25); among boxes that contain the point, overlap no text rect and stay inside the page, it returns the one with the largest area under those caps. A point on text returns null."
      - "`snapBox`: snapping moves only the edge that is within 0.01, leaving the opposite edge in place; a rect that touches no text and has no edge within 0.01 is returned unchanged. Every fraction of the result is rounded to 4 decimals."
      - Text rects come only from the live DOM `.textLayer` (no stored geometry exists), gathered by 7.6; this package never reads the DOM.
    acceptance:
      - id: 7.5a
        check: an empty column gives a box capped at 0.4 by 0.25
      - id: 7.5b
        check: a point between two paragraphs gives a box that fits the gap
      - id: 7.5c
        check: a drag rect over text is shrunk off the text on its smallest-overlap side
      - id: 7.5d
        check: edges within 0.01 of the page margin or a text edge snap to it
      - id: 7.5e
        check: an area smaller than 0.05 by 0.03 returns null
    tests:
