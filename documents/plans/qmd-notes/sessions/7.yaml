  - id: "7.5"
    plan: qmd-notes
    goal: Pure functions that find the largest empty box around a point of a page and snap a dragged box to text and page margins.
    level: behaviour
    runner: {agent: implementer, model: opus}
    depends_on: []
    edit:
      - {path: packages/core/src/reader/text/index.ts, lines: "1-5", why: "export textBoxPlacement"}
    create:
      - packages/core/src/reader/text/textBoxPlacement.ts
    read:
      - {path: packages/core/src/reader/dom/pageHighlights.ts, lines: "1-139", why: "textBoxes, derivePageFrame, deriveBoxInPage: how text and page fractions are measured today (do not import DOM code into the new file)"}
      - {path: packages/core/src/reader/text/geometry.ts, lines: "160-195", why: "existing Rect type in this folder"}
      - {path: documents/plans/qmd-notes/research/reader.md, lines: "32-33", why: "Text layer: geometry exists only live in the DOM"}
    seams:
      - {path: packages/core/src/reader/text/textBoxPlacement.ts, signature: "export interface PageRect { x: number; y: number; w: number; h: number }"}
      - {path: packages/core/src/reader/text/textBoxPlacement.ts, signature: "export function fitEmptyBox(point: { x: number; y: number }, rects: readonly PageRect[]): PageRect | null"}
      - {path: packages/core/src/reader/text/textBoxPlacement.ts, signature: "export function snapBox(rect: PageRect, rects: readonly PageRect[]): PageRect"}
    decided:
      - "Runtime-neutral, no DOM, in `packages/core/src/reader/text/textBoxPlacement.ts` (the old plan's `reader/geometry/` folder is the existing runtime-neutral `reader/text/` folder now); inputs are in page fractions: text rects `{x, y, w, h}[]` and a click point or a drag rect."
      - "`fitEmptyBox(point, rects)`: the largest rectangle around the point that overlaps no text rect, capped at 0.4 page width and 0.25 page height, at least 0.05 by 0.03, else null."
      - "`snapBox(rect, rects)`: edges within 0.01 of a text rect edge or of the page margin snap to it; a rect overlapping text is shrunk off the text on its smallest-overlap side."
      - "Fractions are rounded to 4 decimals (the anchor contract in `documents/contracts/qmd-items.md`)."
      - "The page margin is the page edge: 0 and 1 on each axis."
      - "`fitEmptyBox`: the box contains the point; the caps apply per axis (w <= 0.4, h <= 0.25); among boxes that contain the point, overlap no text rect and stay inside the page, it returns the one with the largest area under those caps. A point on text returns null."
      - "`snapBox`: snapping moves only the edge that is within 0.01, leaving the opposite edge in place; a rect that touches no text and has no edge within 0.01 is returned unchanged. Every fraction of the result is rounded to 4 decimals."
      - "Text rects come only from the live DOM `.textLayer` (no stored geometry exists), gathered by 7.6; this package never reads the DOM."
    acceptance:
      - {id: "7.5a", check: "an empty column gives a box capped at 0.4 by 0.25"}
      - {id: "7.5b", check: "a point between two paragraphs gives a box that fits the gap"}
      - {id: "7.5c", check: "a drag rect over text is shrunk off the text on its smallest-overlap side"}
      - {id: "7.5d", check: "edges within 0.01 of the page margin or a text edge snap to it"}
      - {id: "7.5e", check: "an area smaller than 0.05 by 0.03 returns null"}
    tests:
      hidden: [documents/plans/qmd-notes/tests/7.5/packages/core/__tests__/reader/text/textBoxPlacement.test.ts]
      command: "node scripts/agents/run.mjs test core --spec 7.5 --plan qmd-notes -- packages/core/__tests__/reader/text/textBoxPlacement.test.ts"
    commands:
      - "node scripts/agents/run.mjs typecheck core"
      - "node scripts/agents/run.mjs test core"
    do_not_touch:
      - packages/core/src/reader/dom/

  - id: "7.6"
    plan: qmd-notes
    goal: "D7: a text box is a paper-note item with anchor `p<page> box <x> <y> <w> <h>`, drawn over its page, always visible, never changing the PDF; long content is clipped and expands on click."
    level: behaviour
    runner: {agent: implementer, model: opus}
    depends_on: ["7.1", "7.3", "7.4", "7.5"]
    edit:
      - {path: packages/core/src/reader/dom/toolbar.ts, lines: "1-354", why: "text-box tool toggle button and its ToolbarActions entry"}
      - {path: packages/core/src/reader/dom/readerUi.ts, lines: "50-213", why: "build the box layer and the tool, feed the layer from the same `init`/`updateNotes` source as the Notes tab"}
      - {path: packages/core/src/reader/dom/styles/reader.css, lines: "250-278", why: "`.rd-note-layer`, box, clip fade and expanded state, tokens only"}
    create:
      - packages/core/src/reader/dom/noteBoxes.ts
      - packages/core/src/reader/dom/boxTool.ts
    read:
      - {path: packages/core/src/reader/dom/pageHighlights.ts, lines: "56-139", why: "PageHighlights layer: textlayerrendered rebuild, percent positions set through CSSOM, derivePageFrame and deriveBoxInPage"}
      - {path: packages/core/src/reader/dom/styles/reader.css, lines: "250-270", why: ".rd-hl-layer rules (pointer-events none)"}
      - {path: packages/core/src/reader/text/textBoxPlacement.ts, lines: "1-1", why: "fitEmptyBox and snapBox from 7.5 (re-read whole file)"}
      - {path: packages/core/src/qmd/item/itemFile.ts, lines: "248-295", why: "formatAnchor and the box ItemAnchor"}
      - {path: documents/plans/qmd-notes/research/reader.md, lines: "12-15", why: "Drawing: page lookup, no rotation code"}
    seams:
      - {path: packages/core/src/reader/dom/noteBoxes.ts, signature: "export class NoteBoxLayer { constructor(ctx: Pick<ReaderContext, \"eventBus\" | \"host\">); show(notes: readonly ReaderNote[]): void }"}
      - {path: packages/core/src/reader/dom/boxTool.ts, signature: "export class BoxTool { constructor(ctx: ReaderContext); setActive(on: boolean): void }"}
    decided:
      - "The 7.1 design outcome is written here before this package runs."
      - "Creation mode is a toolbar toggle. In it a click calls `fitEmptyBox` and a drag calls `snapBox`; Escape leaves the mode. Then the tool sends `addNote {anchor: formatAnchor({kind: \"box\", ...}), body: \"\"}` and the box opens in edit state."
      - "The layer `.rd-note-layer` per page is built like `.rd-hl-layer`: rebuilt on pdf.js `textlayerrendered` (PLATFORM: pdf.js drops page children on re-render), positions in percent so zoom needs no recompute. The layer has `pointer-events: none` and the boxes `pointer-events: auto`; it is inserted above the text layer so boxes are clickable while empty space still selects text. Unrendered pages have no layer."
      - "Box content renders read-only through the core editor (`mountQmdEditor` with `readOnly: true`, session 4); it is clipped to the box with a token-based fade; a click expands it to show all content and edit it, an outside click or Escape collapses it."
      - "Move and resize handles send `moveNote {id, anchor}` with the snapped box."
      - "Text rects for snapping come from the live DOM `.textLayer` of the page, measured with `derivePageFrame`/`deriveBoxInPage` of `pageHighlights.ts`."
      - "Positions are set through the CSSOM like `pageHighlights.ts` does, never through markup `style=` strings."
    acceptance:
      - {id: "7.6a", check: "typecheck passes for core and the vscode and browser reader bundles build"}
      - {id: "A5", check: "in VS Code and the browser reader, the tool draws a box in an empty area of page 10; it shows rendered content at any zoom and in the same place on another device"}
    tests: {none: "checked by the user by hand in the app"}
    commands:
      - "node scripts/agents/run.mjs typecheck core"
      - "node scripts/agents/run.mjs build vscode"
      - "node scripts/agents/run.mjs build browser"
    do_not_touch:
      - packages/core/src/reader/text/textBoxPlacement.ts
      - packages/core/src/reader/dom/pageHighlights.ts
