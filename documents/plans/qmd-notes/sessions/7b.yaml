    seams:
      - path: packages/core/src/reader/dom/notesTab.ts
        signature: "export class NotesTab implements SidebarPanel { readonly el: HTMLElement; show(notes: readonly ReaderNote[]): void; onShow(): void; onHide(): void }"
    decided:
      - UI text names an item "note" through `QMD_VOCABULARY.item` exported from `packages/core/src/qmd/dom/qmdEditor.ts` (re-exported by `qmd/dom/index.ts`) (D16); every user-visible "note"/"Notes" string below is built from it, capitalised where it starts a label.
      - "7.1 design, tab: TAB_META gains `notes: { label: \"Notes\", icon: \"note\" }` after `annotations` (the `note` icon exists in `renderIcon.ts`). The panel reuses `rd-panel` and `rd-panel-header` like AnnotationsTab: the header shows the label and the item count."
      - "7.1 design, filter: a row under the header with a native `<select>` (aria-label \"Show\") holding All / This page / On highlights / Text boxes / Unanchored, and an `<input type=search>` (placeholder \"Filter notes\", aria-label the same) matching the body case-insensitively. The row wraps to two lines at narrow sidebar width. Filter state lives in the tab and survives each `show()` (pushes never reset it). \"This page\" follows the current page (the tab takes a `currentPage(): number` getter and re-filters on the pdf.js `pagechanging` event)."
      - "7.1 design, rows: grouped like AnnotationsTab with `rd-ann-group` headings \"Page N\", then a last group \"Unanchored\". A row is: an anchor chip button, the item's editor, a delete icon button (`trash`). Chip by anchor kind: highlight → the colour dot `rd-color-<colour>` of the referenced annotation (from `setAnnotations`); a highlight id missing from the annotation list shows the `warning` icon with title \"Highlight not found\" and the row sorts under Unanchored; box → the `text-box` icon; page → the text \"p. N\". Chip title \"Go to page N\"; clicking it jumps; unanchored rows have no chip."
      - "7.1 design, NotesTab API: besides the seam it has `setAnnotations(annotations: readonly Annotation[]): void` (fed from the same `updateAnnotations` as AnnotationsTab) so chips and page groups resolve highlight anchors. Constructor: `(host: HostBridge, goToPage: (page: number) => void, currentPage: () => number, eventBus)`."
      - "7.1 design, editing: rows are keyed by item id; `show()` updates rows in place, so a row whose editor has focus keeps its editor and caret and only unfocused rows take a changed body. The editor sends `editNote` on blur and after typing pauses (debounce in the tab, about one second), only when the body changed. Escape in an editor blurs it."
      - "7.1 design, delete (principle 5): an item with an empty body is removed at once; otherwise the first click turns the trash button into a confirm state (class `rd-danger`, aria-label \"Confirm delete\") and a second click sends `removeNote`; blur or Escape cancels the confirm state."
      - "7.1 design, states: no items → `rd-empty` \"No notes yet. Select text and choose Add to note, or draw a text box.\"; items but none match the filter → `rd-empty` \"No notes match.\"; light, dark and the page themes come from `--ls-reader-*` tokens only; every control has keyboard focus with the existing `:focus-visible` rule."
      - "7.1 design, icon: add lucide's `type` icon to `renderIcon.ts` as `text-box` in the same style as its neighbours (paths `<path d=\"M12 4v16\"/><path d=\"M4 7V5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v2\"/><path d=\"M9 20h6\"/>`); 7.6 uses it for the toolbar tool."
      - "7.1 design, selection bubble: \"Add to note\" is an icon button (`note` icon, title and aria-label \"Add to note\") after the colour buttons, separated by the bubble's existing divider style if one exists, else a gap. It highlights in the first colour of the bubble's list. When the new item arrives it opens the sidebar on the Notes tab and focuses that item's editor."
      - "Filter: All / This page / On highlights / Text boxes / Unanchored, plus a text filter on the body. Order by page then created; unanchored items last."
      - Each row edits its body in `mountQmdEditor` (session 4, `packages/core/src/qmd/dom/`); an edit sends `editNote`, delete sends `removeNote`. No `onRunCell` here (cells run from session 12 on).
      - "\"Add to note\" posts the existing `createAnnotation` highlight, and when the next `updateAnnotations` list holds an annotation id not in the previous list, posts `addNote {anchor: \"hl:<that annotation id>\", body: \"\"}` and focuses the new item's editor. D6: a note on a highlight anchors to the annotation id; geometry stays in `data.json`."
      - Jump uses the page scroll the Annotations tab already uses (its `goToPage`).
      - Panel CSS uses tokens only, in `reader.css`.
    acceptance:
      - id: 7.4a
        check: typecheck passes for core
      - id: 7.4b
        check: the panel lists items, the filters narrow the list, an item body edits and saves, and a click jumps to its page
      - id: 7.4c
        check: selecting text and choosing Add to note creates a highlight and a new focused item anchored to it (checked by the user by hand)
    tests:
