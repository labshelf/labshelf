  - id: "7.6"
    plan: qmd-notes
    goal: "D7: a text box is a paper-note item with anchor `p<page> box <x> <y> <w> <h>`, drawn over its page, always visible, never changing the PDF; long content is clipped and expands on click."
    level: behaviour
    runner:
      agent: implementer
      model: opus
    depends_on:
      - "7.4"
    edit:
      - path: packages/core/src/reader/dom/toolbar.ts
        lines: 1-354
        why: text-box tool toggle button and its ToolbarActions entry
      - path: packages/core/src/reader/dom/readerUi.ts
        lines: 50-213
        why: build the box layer and the tool, feed the layer from the same `init`/`updateNotes` source as the Notes tab
      - path: packages/core/src/reader/dom/styles/reader.css
        lines: 250-278
        why: "`.rd-note-layer`, box, clip fade and expanded state, tokens only"
      - path: packages/core/src/reader/keymap.ts
        lines: 35-60
        why: "base binding `{ key: \"b\", mod: true, alt: true, action: \"toggleBoxTool\", label: \"Text box tool\", group: \"View\" }`, beside the other mod+alt chord (goToPage); re-locate the bindings list and the action type with grep"
    create:
      - packages/core/src/reader/dom/noteBoxes.ts
      - packages/core/src/reader/dom/boxTool.ts
    read:
      - path: packages/core/src/reader/dom/pageHighlights.ts
        lines: 56-139
        why: "PageHighlights layer: textlayerrendered rebuild, percent positions set through CSSOM, derivePageFrame and deriveBoxInPage"
      - path: packages/core/src/reader/dom/styles/reader.css
        lines: 250-270
        why: .rd-hl-layer rules (pointer-events none)
      - path: packages/core/src/reader/text/textBoxPlacement.ts
        lines: 1-1
        why: fitEmptyBox and snapBox from 7.5 (re-read whole file)
      - path: packages/core/src/qmd/item/itemFile.ts
        lines: 248-295
        why: formatAnchor and the box ItemAnchor
      - path: documents/plans/qmd-notes/research/reader.md
        lines: 12-15
        why: "Drawing: page lookup, no rotation code"
    seams:
      - path: packages/core/src/reader/dom/noteBoxes.ts
        signature: 'export class NoteBoxLayer { constructor(ctx: Pick<ReaderContext, "eventBus" | "host">); show(notes: readonly ReaderNote[]): void }'
      - path: packages/core/src/reader/dom/boxTool.ts
        signature: "export class BoxTool { constructor(ctx: ReaderContext); setActive(on: boolean): void }"
    decided:
      - "7.1 design, tool: a toggle icon button (`text-box` icon from 7.4) in the toolbar's right group before Find, title \"Text box (<Mod>+<Alt>+B)\" built like the other titles, `aria-pressed` reflecting the mode; pressed state uses `--ls-reader-active`. `ToolbarActions` gains `toggleBoxTool(): void`; `Toolbar` gains `setBoxToolActive(on: boolean): void`. The keymap action `toggleBoxTool` (Mod+Alt+B) does the same and shows in the `?` cheatsheet."
      - "7.1 design, mode: while on, the viewer container has class `rd-box-mode`: crosshair cursor over pages and no text selection on the text layer. A drag shows a draft rectangle `.rd-box-draft` (dashed border in `--ls-reader-active`). The mode is one-shot: it ends after a box is created, on Escape or on the toggle. A click where `fitEmptyBox` returns null creates nothing and the mode stays on."
      - "7.1 design, box look: `.rd-note-box` has background `--ls-reader-surface`, a thin border `--ls-reader-border`, a small radius and text `--ls-reader-fg`; its font size is the reader's small UI size times pdf.js' `--scale-factor`, so the box clips the same content at every zoom and on every device. Content taller than the box is clipped with a bottom fade made with `mask-image` (alpha only, so no colour) and the class `rd-note-box-clipped`. An empty box shows the editor placeholder."
      - "7.1 design, expanded: class `rd-note-box-open`: height grows to the content up to the page bottom, then scrolls; it is raised above other boxes, gets `--ls-reader-shadow` and a border in `--ls-reader-active`; the editor is editable (remount with `readOnly: false` or toggle it, whichever `QmdEditorHandle` allows). Collapsing (outside click, Escape) sends `editNote` when the body changed. A newly created box opens expanded with focus."
      - "7.1 design, handles: shown only while expanded or on hover/focus: a move strip along the top edge and a resize handle at the bottom-right corner; a drag shows the draft rectangle and on release sends `moveNote` with the `snapBox` result."
      - "7.1 design, keyboard and a11y: each box has `tabindex=0`, role `button`, aria-label \"Note on page N\" (vocabulary word); Enter or Space expands it, Escape collapses it. Deleting is done in the Notes tab."
      - 'Creation mode is a toolbar toggle. In it a click calls `fitEmptyBox` and a drag calls `snapBox`; Escape leaves the mode. Then the tool sends `addNote {anchor: formatAnchor({kind: "box", ...}), body: ""}` and the box opens in edit state.'
      - "The layer `.rd-note-layer` per page is built like `.rd-hl-layer`: rebuilt on pdf.js `textlayerrendered` (PLATFORM: pdf.js drops page children on re-render), positions in percent so zoom needs no recompute. The layer has `pointer-events: none` and the boxes `pointer-events: auto`; it is inserted above the text layer so boxes are clickable while empty space still selects text. Unrendered pages have no layer."
      - "Box content renders read-only through the core editor (`mountQmdEditor` with `readOnly: true`, session 4); it is clipped to the box with a token-based fade; a click expands it to show all content and edit it, an outside click or Escape collapses it."
      - Move and resize handles send `moveNote {id, anchor}` with the snapped box.
      - Text rects for snapping come from the live DOM `.textLayer` of the page, measured with `derivePageFrame`/`deriveBoxInPage` of `pageHighlights.ts`.
      - Positions are set through the CSSOM like `pageHighlights.ts` does, never through markup `style=` strings.
    acceptance:
      - id: 7.6a
        check: typecheck passes for core and the vscode and browser reader bundles build
      - id: A5
        check: in VS Code and the browser reader, the tool draws a box in an empty area of page 10; it shows rendered content at any zoom and in the same place on another device
    tests:
      none: checked by the user by hand in the app
    commands:
      - node scripts/agents/run.mjs typecheck core
      - node scripts/agents/run.mjs build vscode
      - node scripts/agents/run.mjs build browser
    do_not_touch:
      - packages/core/src/reader/text/textBoxPlacement.ts
      - packages/core/src/reader/dom/pageHighlights.ts
