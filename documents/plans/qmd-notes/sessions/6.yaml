    plan: qmd-notes
    goal: A `PaperNotesStore` that reads, adds, edits, re-anchors and removes the items of a paper's `notes.qmd` through an injected file port, with a Node adapter and `paperNotesPath` in the library layout.
    level: contract
    runner: {agent: implementer, model: sonnet}
    depends_on: []
    edit:
      - {path: packages/core/src/library/layout.ts, lines: "27-75", why: "add paperNotesPath(paperId) to LibraryLayout and createLibraryLayout beside paperDataPath; PAPER_NOTES_FILE already exists (:16)"}
