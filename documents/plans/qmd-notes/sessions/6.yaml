      - {path: packages/core/src/ports/hostPorts.ts, lines: "26-30", why: "SidecarPort, the shape the notes port copies"}
      - {path: packages/core/src/qmd/item/itemUpdate.ts, lines: "92-135", why: "addItem, setItemBody, removeItem and newItemId used by the store"}
      - {path: packages/core/src/qmd/item/itemFile.ts, lines: "245-290", why: "ItemAnchor and parseAnchor/formatAnchor for setAnchor"}
    seams:
      - {path: packages/core/src/library/layout.ts, signature: "paperNotesPath(paperId: string): T;"}
      - {path: packages/core/src/qmd/paperNotes.ts, signature: "export interface PaperNotesPort { read(paperId: string): Promise<string | null>; write(paperId: string, text: string): Promise<void> }"}
      - {path: packages/core/src/qmd/paperNotes.ts, signature: "export interface PaperNotesStoreOptions { logger?: ILogger; newId?: () => string; now?: () => string }"}
      - {path: packages/core/src/qmd/paperNotes.ts, signature: "export class PaperNotesStore { constructor(port: PaperNotesPort, options?: PaperNotesStoreOptions) }"}
      - {path: packages/core/src/qmd/paperNotes.ts, signature: "read(paperId: string): Promise<ItemFile>"}
      - {path: packages/core/src/qmd/paperNotes.ts, signature: "addItem(paperId: string, input: { anchor?: ItemAnchor; body: string; author?: string; created?: string; attrs?: readonly (readonly [string, string])[] }): Promise<string>"}
      - {path: packages/core/src/qmd/paperNotes.ts, signature: "editItem(paperId: string, id: string, body: string): Promise<void>"}
      - {path: packages/core/src/qmd/paperNotes.ts, signature: "setAnchor(paperId: string, id: string, anchor: ItemAnchor): Promise<void>"}
      - {path: packages/core/src/qmd/paperNotes.ts, signature: "removeItem(paperId: string, id: string): Promise<void>"}
      - {path: packages/core/src/qmd/paperNotes.ts, signature: "export function notesText(file: ItemFile): string"}
      - {path: packages/core/src/qmd/node/nodePaperNotesPort.ts, signature: "export function createNodePaperNotesPort(layout: Pick<LibraryLayout<string>, \"paperNotesPath\" | \"tmpDir\">, logger?: ILogger): PaperNotesPort"}
    decided:
      - "D6: paper notes live in `.research/papers/<id>/notes.qmd`; in the browser they sit in IndexedDB beside `data.json` under the same relative path from `layout.paperNotesPath`."
      - "`paperNotesPath(id)` is `join(paperDataDir(id), PAPER_NOTES_FILE)`, added next to `paperDataPath` in `library/layout.ts`."
      - "File access goes through `PaperNotesPort` declared in `packages/core/src/qmd/paperNotes.ts` (the sidecar port is `data.json`-specific); the concept stays in one file, no `paperNotes/` folder (code.md#modules). `SidecarPort` is not reused or widened."
      - "A missing file reads as an empty `ItemFile`. Each mutator runs in a per-paper queue: re-read the file, apply the edit with `addItem`/`setItemBody`/`removeItem` from `itemUpdate.ts`, write once. A failed write does not poison the queue behind it. Concurrent adds on one paper keep both."
      - "The parser keeps loose text, so unparseable content is impossible and nothing is overwritten blind. Every write failure is logged through `ILogger` and rethrown."
      - "`addItem` returns the new item id (from `newItemId`, injectable for tests); `created` defaults to `now()`; extra `attrs` are kept on the opening line. `setAnchor` serves the text boxes of session 7."
      - "`notesText(file)` joins the item bodies (and loose text) with newlines; it is what the search indexer uses (6.3)."
      - "`createNodePaperNotesPort` mirrors `createNodeSidecarPort`: UTF-8 text, a missing file reads as null, the write is atomic through `layout.tmpDir()`."
      - "A write failure is logged with `logger.error` and the original error is rethrown; the file stays as it was."
      - "`editItem`, `removeItem` and `setAnchor` with an unknown item id reject with an error and write nothing."
      - "`notesText` joins the item bodies and the loose text in file order with newlines and leaves out the item fences and ids; an empty file gives \"\"."
      - "`PaperNotesStore`, `notesText`, `PaperNotesPort` are exported from `@labshelf/core` through `qmd/index.ts` (session 7 tests import them from there, with `parseItemFile` and `ItemSegment`)."
    acceptance:
      - {id: "6.1a", check: "adding to a missing file creates `notes.qmd` with one item"}
      - {id: "6.1b", check: "editItem and removeItem change only that item and keep loose text and unknown attributes"}
      - {id: "6.1c", check: "two concurrent addItem calls on one paper keep both items"}
      - {id: "6.1d", check: "a failing port write is logged and the next write still runs"}
    tests:
      hidden:
        - documents/plans/qmd-notes/tests/6.1/packages/core/__tests__/qmd/paperNotes.test.ts
      command: "node scripts/agents/run.mjs test core --spec 6.1 --plan qmd-notes -- packages/core/__tests__/qmd/paperNotes.test.ts"
    commands:
