schema: session/v1
id: "6"
goal: Core keeps a paper's notes in `.research/papers/<id>/notes.qmd` through a notes store; the paper record has no note field, and the library UI protocol and detail pane read and edit the notes file.
depends_on:
  - "2"
  - "5"
owns:
  - packages/core/src/qmd/paperNotes.ts
  - packages/core/src/qmd/node/
  - packages/core/src/qmd/index.ts
  - packages/core/src/node/index.ts
  - packages/core/src/library/layout.ts
  - packages/core/src/library/record.ts
  - packages/core/src/library/search.ts
  - packages/core/src/library/libraryStore.ts
  - packages/core/src/library/mutations/
  - packages/core/src/model/paper.ts
  - packages/core/src/import/paper/networkImport.ts
  - packages/core/src/libraryUi/paperHandlers.ts
  - packages/core/src/libraryUi/protocol/messages.ts
  - packages/core/src/libraryUi/store/libraryStore.ts
  - packages/core/src/libraryUi/dom/detailPane/
  - packages/core/src/libraryUi/dom/list/tray.ts
  - packages/core/src/libraryUi/dom/flows/paperFlows.ts
  - packages/core/__tests__/qmd/
  - packages/core/__tests__/library/
  - packages/core/__tests__/libraryUi/
status: pending
packages:
  - id: "6.1"
    plan: qmd-notes
    goal: A `PaperNotesStore` that reads, adds, edits, re-anchors and removes the items of a paper's `notes.qmd` through an injected file port, with a Node adapter and `paperNotesPath` in the library layout.
    level: contract
    runner:
      agent: implementer
      model: sonnet
    depends_on: []
    edit:
      - path: packages/core/src/library/layout.ts
        lines: 27-75
        why: add paperNotesPath(paperId) to LibraryLayout and createLibraryLayout beside paperDataPath; PAPER_NOTES_FILE already exists (:16)
      - path: packages/core/src/qmd/index.ts
        lines: 1-6
        why: export paperNotes.ts
      - path: packages/core/src/node/index.ts
        lines: 1-20
        why: re-export the Node adapter of the notes port next to the sidecar port
    create:
      - packages/core/src/qmd/paperNotes.ts
      - packages/core/src/qmd/node/index.ts
      - packages/core/src/qmd/node/nodePaperNotesPort.ts
    read:
      - path: documents/plans/qmd-notes/research/reader.md
        lines: 1-34
        why: Annotations and sidecar section (re-locate the heading before reading further)
      - path: packages/core/src/reader/sidecar/sidecarStore.ts
        lines: 129-192
        why: per-paper queue, injected options and the load-modify-save pattern to mirror
      - path: packages/core/src/reader/node/nodeSidecarPort.ts
        lines: 1-34
        why: Node port over the layout with an atomic write, to mirror
      - path: packages/core/src/ports/hostPorts.ts
        lines: 26-30
        why: SidecarPort, the shape the notes port copies
      - path: packages/core/src/qmd/item/itemUpdate.ts
        lines: 92-135
        why: addItem, setItemBody, removeItem and newItemId used by the store
      - path: packages/core/src/qmd/item/itemFile.ts
        lines: 245-290
        why: ItemAnchor and parseAnchor/formatAnchor for setAnchor
    seams:
      - path: packages/core/src/library/layout.ts
        signature: "paperNotesPath(paperId: string): T;"
      - path: packages/core/src/qmd/paperNotes.ts
        signature: "export interface PaperNotesPort { read(paperId: string): Promise<string | null>; write(paperId: string, text: string): Promise<void> }"
      - path: packages/core/src/qmd/paperNotes.ts
        signature: "export interface PaperNotesStoreOptions { logger?: ILogger; newId?: () => string; now?: () => string }"
      - path: packages/core/src/qmd/paperNotes.ts
        signature: "export class PaperNotesStore { constructor(port: PaperNotesPort, options?: PaperNotesStoreOptions) }"
      - path: packages/core/src/qmd/paperNotes.ts
        signature: "read(paperId: string): Promise<ItemFile>"
      - path: packages/core/src/qmd/paperNotes.ts
        signature: "addItem(paperId: string, input: { anchor?: ItemAnchor; body: string; author?: string; created?: string; attrs?: readonly (readonly [string, string])[] }): Promise<string>"
      - path: packages/core/src/qmd/paperNotes.ts
        signature: "editItem(paperId: string, id: string, body: string): Promise<void>"
      - path: packages/core/src/qmd/paperNotes.ts
        signature: "setAnchor(paperId: string, id: string, anchor: ItemAnchor): Promise<void>"
      - path: packages/core/src/qmd/paperNotes.ts
        signature: "removeItem(paperId: string, id: string): Promise<void>"
      - path: packages/core/src/qmd/paperNotes.ts
        signature: "export function notesText(file: ItemFile): string"
      - path: packages/core/src/qmd/node/nodePaperNotesPort.ts
        signature: 'export function createNodePaperNotesPort(layout: Pick<LibraryLayout<string>, "paperNotesPath" | "tmpDir">, logger?: ILogger): PaperNotesPort'
    decided:
      - "D6: paper notes live in `.research/papers/<id>/notes.qmd`; in the browser they sit in IndexedDB beside `data.json` under the same relative path from `layout.paperNotesPath`."
      - "`paperNotesPath(id)` is `join(paperDataDir(id), PAPER_NOTES_FILE)`, added next to `paperDataPath` in `library/layout.ts`."
      - File access goes through `PaperNotesPort` declared in `packages/core/src/qmd/paperNotes.ts` (the sidecar port is `data.json`-specific); the concept stays in one file, no `paperNotes/` folder (code.md#modules). `SidecarPort` is not reused or widened.
      - "A missing file reads as an empty `ItemFile`. Each mutator runs in a per-paper queue: re-read the file, apply the edit with `addItem`/`setItemBody`/`removeItem` from `itemUpdate.ts`, write once. A failed write does not poison the queue behind it. Concurrent adds on one paper keep both."
      - The parser keeps loose text, so unparseable content is impossible and nothing is overwritten blind. Every write failure is logged through `ILogger` and rethrown.
      - "`addItem` returns the new item id (from `newItemId`, injectable for tests); `created` defaults to `now()`; extra `attrs` are kept on the opening line. `setAnchor` serves the text boxes of session 7."
      - "`notesText(file)` joins the item bodies (and loose text) with newlines; it is what the search indexer uses (6.3)."
      - "`createNodePaperNotesPort` mirrors `createNodeSidecarPort`: UTF-8 text, a missing file reads as null, the write is atomic through `layout.tmpDir()`."
      - A write failure is logged with `logger.error` and the original error is rethrown; the file stays as it was.
      - "`editItem`, `removeItem` and `setAnchor` with an unknown item id reject with an error and write nothing."
      - '`notesText` joins the item bodies and the loose text in file order with newlines and leaves out the item fences and ids; an empty file gives "".'
      - "`PaperNotesStore`, `notesText`, `PaperNotesPort` are exported from `@labshelf/core` through `qmd/index.ts` (session 7 tests import them from there, with `parseItemFile` and `ItemSegment`)."
    acceptance:
      - id: 6.1a
        check: adding to a missing file creates `notes.qmd` with one item
      - id: 6.1b
        check: editItem and removeItem change only that item and keep loose text and unknown attributes
      - id: 6.1c
        check: two concurrent addItem calls on one paper keep both items
      - id: 6.1d
        check: a failing port write is logged and the next write still runs
    tests:
      hidden:
        - documents/plans/qmd-notes/tests/6.1/packages/core/__tests__/qmd/paperNotes.test.ts
      command: node scripts/agents/run.mjs test core --spec 6.1 --plan qmd-notes -- packages/core/__tests__/qmd/paperNotes.test.ts
    commands:
      - node scripts/agents/run.mjs typecheck core
      - node scripts/agents/run.mjs test core
    do_not_touch:
      - packages/core/src/reader/sidecar/
  - id: "6.3"
    plan: qmd-notes
    goal: Remove `note` from the paper record and core logic (no code reads or writes it); search reads note text from `notes.qmd`.
    level: behaviour
    runner:
      agent: implementer
      model: sonnet
    depends_on:
      - "6.1"
    edit:
      - path: packages/core/src/model/paper.ts
        lines: 1-68
        why: drop `note` from PaperRecord (:43)
      - path: packages/core/src/library/record.ts
        lines: 55-65
        why: stop setting record.note (:61)
      - path: packages/core/src/library/mutations/paperRecordWrite.ts
        lines: 1-100
        why: drop `note` from WriteRecordOptions, owned fields and the file comment
      - path: packages/core/src/library/mutations/paperMutations.ts
        lines: 108-175
        why: drop `note` from PaperFieldsUpdate and applyPatch
      - path: packages/core/src/library/mutations/paperService.ts
        lines: 135-190
        why: stop keeping and comparing `note` in the reindex path
      - path: packages/core/src/library/search.ts
        lines: 1-20
        why: SearchField and HasField keep `note`
      - path: packages/core/src/library/search.ts
        lines: 186-225
        why: SearchExtra gains notesText; searchDoc feeds `note` and `rest` from it; `has:note` reads the doc
      - path: packages/core/src/library/search.ts
        lines: 280-287
        why: syntax help for note:/has:note stays accurate
      - path: packages/core/src/library/libraryStore.ts
        lines: 110-150
        why: hold notes text per paper like annotationText and pass it to searchDoc
      - path: packages/core/src/import/paper/networkImport.ts
        lines: 40-70
        why: ImportExtra no longer picks `note`
    create: []
    read:
      - path: documents/plans/qmd-notes/research/reader.md
        lines: 1-34
        why: Paper record `note` section (re-locate the heading)
      - path: packages/core/src/library/mutations/paperRecordWrite.ts
        lines: 60-100
        why: how metadata.yaml is rewritten preserving unknown keys
      - path: packages/core/src/library/search.ts
        lines: 95-130
        why: field aliases (`note`, `notes`)
      - path: packages/core/__tests__/library/search/searchDoc.test.ts
        lines: 1-35
        why: layout of the existing search tests
    callers:
      - symbol: searchDoc
        path: packages/core/src/library/libraryStore.ts
        lines: 139-148
      - symbol: searchDoc
        path: packages/core/src/libraryUi/listModel.ts
        lines: 30-35
    seams:
      - path: packages/core/src/library/search.ts
        signature: "export interface SearchExtra { annotations?: string; folder?: string; notesText?: string }"
      - path: packages/core/src/library/libraryStore.ts
        signature: "setNotesText(text: Map<string, string>): void"
    decided:
      - The record type drops `note`; every other `note` read or write in `paper.ts`, `record.ts`, `paperRecordWrite.ts`, `paperMutations.ts`, `paperService.ts` and `networkImport.ts` is deleted.
      - 'No migration (documents/code.md#contracts): no code reads the `note` key of `metadata.yaml` or the `content` of `type: "note"` annotations; a `note` key already in a file is ignored and, as any unknown key, kept by `writePaperRecord`. Session 7 (7.3) removes the note annotation type.'
      - "Search: `searchDoc` takes `notesText` (the item bodies joined by `notesText(file)` from 6.1), supplied by the indexer through `LibraryStore.setNotesText`; the `note:` field matches it, plain words match it through `rest`, and `has:note` is true when it is non-blank."
      - Apps feed `setNotesText` in 6.5 and 6.7; this package only adds the seam.
    acceptance:
      - id: 6.3a
        check: a word inside a `notes.qmd` item matches `note:word` and a plain word query; `has:note` follows the notes text
      - id: 6.3b
        check: no `note` key remains on PaperRecord, PaperFieldsUpdate or WriteRecordOptions, no core code reads or writes one, and core typechecks
      - id: A4
        check: no core code reads a `note` key of `metadata.yaml`; the notes text for search comes from `notes.qmd` (the app and terminal halves are 6.5-6.7)
    tests:
      hidden:
        - documents/plans/qmd-notes/tests/6.3/packages/core/__tests__/library/search/notesSearch.test.ts
      command: node scripts/agents/run.mjs test core --spec 6.3 --plan qmd-notes -- packages/core/__tests__/library/search/notesSearch.test.ts
    commands:
      - node scripts/agents/run.mjs typecheck core
      - node scripts/agents/run.mjs test core
    do_not_touch:
      - packages/core/src/libraryUi/
      - packages/vscode/
      - packages/browser/
      - packages/terminal/
  - id: "6.4"
    plan: qmd-notes
    goal: The detail pane shows a paper's notes as items edited with `mountQmdEditor`, and the library UI protocol carries items instead of a `note` string.
    level: behaviour
    runner:
      agent: implementer
      model: sonnet
    depends_on:
      - "6.3"
    edit:
      - path: packages/core/src/libraryUi/protocol/messages.ts
        lines: 36-50
        why: replace view-to-host `paper.setNote` with add/edit/remove note messages
      - path: packages/core/src/libraryUi/protocol/messages.ts
        lines: 60-70
        why: PaperDetails (host-to-view `details`) carries the note items
      - path: packages/core/src/libraryUi/protocol/messages.ts
        lines: 195-225
        why: guard table entries for the three messages
      - path: packages/core/src/libraryUi/paperHandlers.ts
        lines: 1-57
        why: the shared handlers answer the three messages instead of setPaperNote
      - path: packages/core/src/libraryUi/store/libraryStore.ts
        lines: 190-205
        why: drop applyNote, which patched record.note
      - path: packages/core/src/libraryUi/dom/flows/paperFlows.ts
        lines: 35-50
        why: writeNote becomes add/edit/remove note flows
      - path: packages/core/src/libraryUi/dom/detailPane/detailTabs.ts
        lines: 95-115
        why: the note textarea (:104) becomes the notes section mounting one editor per item
      - path: packages/core/src/libraryUi/dom/detailPane/paneState.ts
        lines: 90-132
        why: drafts and note state line (:123 reads p.note)
      - path: packages/core/src/libraryUi/dom/detailPane/detailPaneActions.ts
        lines: 90-125
        why: Edit note focuses a new empty item; copyNote reads the items
      - path: packages/core/src/libraryUi/dom/detailPane/detailPane.ts
        lines: 55-70
        why: .note-input focus guards (:63) now refer to the item editors
      - path: packages/core/src/libraryUi/dom/detailPane/detailPane.ts
        lines: 115-180
        why: .note-input key and input handlers (:122, :145, :174)
      - path: packages/core/src/libraryUi/dom/list/tray.ts
        lines: 163-180
        why: shortNote (:175) shows the first line of the last item instead of record.note
      - path: packages/core/__tests__/libraryUi/protocol/messages.test.ts
        lines: 20-55
        why: lists `paper.setNote` as well-formed (:27, :51); replace with the three new messages
    read:
      - path: packages/core/src/qmd/dom/vocabulary.ts
        lines: 1-30
        why: the word "note" for UI text (created by session 4)
      - path: packages/core/src/libraryUi/protocol/messages.ts
        lines: 190-264
        why: how guard tables and message tags are declared
      - path: packages/core/__tests__/libraryUi/protocol/messages.test.ts
        lines: 1-40
        why: layout of the existing guard tests
    seams:
      - path: packages/core/src/libraryUi/protocol/messages.ts
        signature: "export interface PaperNoteView { id: string; anchor: string; body: string; created: string; author: string }"
      - path: packages/core/src/libraryUi/protocol/messages.ts
        signature: '| { type: "paper.addNote"; id: string; body: string }'
      - path: packages/core/src/libraryUi/protocol/messages.ts
        signature: '| { type: "paper.editNote"; id: string; itemId: string; body: string }'
      - path: packages/core/src/libraryUi/protocol/messages.ts
        signature: '| { type: "paper.removeNote"; id: string; itemId: string }'
    decided:
      - The detail pane lists the paper's items (newest last) and mounts one `mountQmdEditor` (session 4, `packages/core/src/qmd/dom/`) per item; a flat note textarea no longer exists.
      - "Host to view: the existing `details` message (`PaperDetails`) gains `notes: PaperNoteView[]` (item id, anchor attribute text, body, created, author). View to host: `paper.addNote {id, body}`, `paper.editNote {id, itemId, body}`, `paper.removeNote {id, itemId}`, named in the existing `paper.*` style and guarded in the guard table of `messages.ts` (a message that fails its guard is dropped whole)."
      - "`paper.setNote` and `applyNote` are deleted; `onChange` of an editor posts `paper.editNote`."
      - The short note of the tray shows the first non-blank line of the last item, or the placeholder; its inline edit adds or edits that item.
      - The `Edit note` command focuses a new empty item (adds no item until the user types).
      - UI text uses the word from `packages/core/src/qmd/dom/vocabulary.ts` (D16).
      - The view is read-only where the host serves no notes (read-only library pane keeps working).
      - "Guards: `id` and `itemId` are non-empty strings; `body` is a string and may be empty or multi-line. A note message failing its guard is dropped by `parseUiMessage` and by `parseDetailsMessage` inside a `library` envelope; `paper.setNote` is no longer accepted."
    acceptance:
      - id: 6.4a
        check: guard tests accept the three new messages with valid fields and drop them with missing or mistyped fields
      - id: 6.4c
        check: the guard no longer accepts `paper.setNote`, and core's tests pass with it gone
    tests:
      hidden:
        - documents/plans/qmd-notes/tests/6.4/packages/core/__tests__/libraryUi/protocol/paperNoteMessages.test.ts
      command: node scripts/agents/run.mjs test core --spec 6.4 --plan qmd-notes -- packages/core/__tests__/libraryUi/protocol/paperNoteMessages.test.ts
    commands:
      - node scripts/agents/run.mjs typecheck core
      - node scripts/agents/run.mjs test core
    do_not_touch:
      - packages/vscode/
      - packages/browser/
      - packages/terminal/
