      - path: packages/vscode/src/spaces/view.ts
        lines: 1-385
        why: a user of the cell hosts / run port
      - path: packages/vscode/src/libraryUi/handlers.ts
        lines: 1-368
        why: a user of the cell hosts / run port
    decided:
      - "Read `node scripts/docs/doc.mjs code#placement` first. Move `createCellHosts` and runCell.ts into a node folder (e.g. `packages/vscode/src/qmd/node/` exported only to `activation/node`, or into `activation/node/`) and have the desktop platform provide the cell hosts as an optional platform member; the neutral startExtension uses what the platform gives (web build without it keeps the current web behaviour: no local cell runner). A plain move of runCell.ts to qmd/node/ re-exported from the neutral qmd/index.ts fails the `vscode-neutral-no-vscode-node-folder` rule, so neutral code must not import the node folder."
      - No behaviour change on desktop. Do not run pnpm gate or pnpm lint; you may run `pnpm lint:deps` and `node scripts/lint/modules.mjs` (read-only) to check.
    acceptance:
