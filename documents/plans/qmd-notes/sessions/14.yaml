      - id: A8
        check: A Space has Notes and Discussions tabs backed by one `.qmd` per note or thread (check in the browser and in VS Code)
      - id: A9
        check: Without Python installed, Run explains what to install; after installing from the app, a SymPy cell runs from VS Code and from the browser through the helper, its result is written into the note, a stuck cell is cancelled, and editing the cell marks the result out of date (check in VS Code and in the browser)
      - id: A10
        check: Inserting an equation from a note writes the origin comment; editing the note marks it stale with an update action; editing the manuscript marks it diverged and nothing is overwritten (check in VS Code and in the browser)
