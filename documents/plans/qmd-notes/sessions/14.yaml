    decided:
      - "Split by concept into module-level functions taking `deps`, `refresh` and `guarded`: refresh, insert (picker and build), update and diff, hover tooltip. `createNoteLinks` keeps the same signature and returned API."
      - No behaviour change. Do not run pnpm gate or any lint; check only with the commands below.
