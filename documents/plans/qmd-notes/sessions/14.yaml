    plan: qmd-notes
    goal: The VS Code cell hosts and the cell run port live in a Node-only folder and reach the neutral activation through the desktop platform, so `lint:deps` reports no Node imports outside a node folder.
    level: contract
    runner:
      agent: implementer
      model: opus
    edit:
