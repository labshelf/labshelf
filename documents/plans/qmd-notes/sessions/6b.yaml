    read:
      - path: packages/terminal/src/libraryUi/keymap.ts
        lines: 80-90
        why: the `e` shortcut (:84) keeps the action name `note`; only its help text changes
      - path: packages/terminal/src/libraryUi/libraryScreen/input/runShortcut.ts
        lines: 95-105
