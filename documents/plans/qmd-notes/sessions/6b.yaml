packages:
  - id: "6.5"
    plan: qmd-notes
    goal: The VS Code and browser hosts answer the 6.4 messages through `PaperNotesStore` and feed note text to search.
    level: behaviour
    runner:
      agent: implementer
      model: sonnet
    depends_on: []
    edit:
      - path: packages/vscode/src/libraryUi/handlers.ts
        lines: 250-258
        why: setNote (:255) calls updatePaperFields({note}); replace with the notes store
      - path: packages/vscode/src/libraryUi/handlers.ts
        lines: 280-322
        why: error labels (:284) and dispatch (:319) for paper.setNote
      - path: packages/vscode/src/activation/libraryRootController.ts
        lines: 55-75
        why: build PaperNotesStore beside the PaperSidecarStore (:66)
      - path: packages/vscode/src/activation/hostAdapters.ts
        lines: 30-40
        why: adapter createPaperNotesPort beside createSidecarPort
      - path: packages/vscode/src/activation/node/desktopPlatform.ts
        lines: 50-65
        why: wire createNodePaperNotesPort like createNodeSidecarPort (:58)
      - path: packages/browser/src/libraryUi/host/handlers.ts
        lines: 32-50
        why: setNote (:40) goes through the notes store
      - path: packages/browser/src/libraryUi/host/context.ts
        lines: 100-112
