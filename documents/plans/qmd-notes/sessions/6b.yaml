      - path: packages/browser/src/storage/libraryMutations.ts
        lines: 115-125
        why: drop the setNote implementation (:121)
    read:
      - path: packages/core/src/qmd/paperNotes.ts
        lines: 1-200
        why: PaperNotesStore and PaperNotesPort (6.1)
      - path: packages/core/src/libraryUi/paperHandlers.ts
        lines: 1-57
        why: the shared handler port the hosts implement (6.4)
      - path: packages/vscode/__tests__/libraryUi/listPanel.test.ts
        lines: 183-192
        why: the existing note routing test to rewrite
    decided:
      - "The notes store is built in each app's composition: VS Code in `activation/libraryRootController.ts` with `createNodePaperNotesPort`; the browser from `createPaperNotesPort(fs)` in `storage/records.ts`, writing `layout.paperNotesPath(id)` through the library file system like the sidecar port."
      - Hosts put the items into `details.notes` and answer `paper.addNote`/`paper.editNote`/`paper.removeNote`; a note change refreshes the details and the notes text for search (`setNotesText`).
      - "`libraryMutations.setNote` and `hostController`-level `note` fields are removed; nothing in the hosts reads or writes a record `note`."
    acceptance:
      - id: 6.5a
        check: VS Code and browser hosts add, edit and remove an item through the store and the details message shows it
      - id: 6.5b
        check: the details of a paper carry its `notes.qmd` items and no host reads a record `note`
      - id: 6.5c
        check: typecheck and tests of vscode and browser pass
      - id: A4
        check: VS Code and the browser show the same notes from `notes.qmd`; neither reads a `note` key of metadata.yaml
    tests:
      none: glue between existing host ports and the tested store; the hosts' existing suites are updated and must pass
    commands:
