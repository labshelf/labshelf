      - path: packages/browser/src/libraryUi/host/snapshots.ts
        lines: 20-30
        why: set the notes text for search
      - path: packages/browser/src/storage/records.ts
        lines: 120-140
        why: add createPaperNotesPort beside createSidecarPort (:127) over the same file system
      - path: packages/browser/src/storage/index.ts
        lines: 1-9
        why: export createPaperNotesPort
      - path: packages/browser/src/storage/libraryMutations.ts
        lines: 15-30
