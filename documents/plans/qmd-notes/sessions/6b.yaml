  - id: "6.6"
    plan: qmd-notes
    goal: The note typed in the browser capture popup becomes the first item of the captured paper's `notes.qmd`.
    level: behaviour
    runner:
      agent: implementer
      model: sonnet
    depends_on:
      - "6.5"
    edit:
      - path: packages/browser/src/capture/pdfFinding.ts
        lines: 130-150
        why: importPaper no longer receives `note` in `extra` (:145); the note is written after the paper exists
      - path: packages/browser/src/background/handlers.ts
        lines: 135-155
        why: capture.save passes msg.note (:150) on to the save, which writes it with PaperNotesStore.addItem
      - path: packages/browser/src/storage/libraryMutations.ts
        lines: 1-142
        why: drop any remaining `note` use (the field leaves the record in 6.3)
    read:
      - path: packages/browser/src/popup/captureFlow.ts
        lines: 110-125
        why: the popup sends `note` in capture.save (:117-120); stays as is
      - path: packages/browser/src/platform/messages.ts
        lines: 10-20
        why: capture.save message shape (`note`, :16); stays as is
      - path: packages/browser/src/popup/entry.ts
        lines: 10-20
        why: the popup's note field wiring; stays as is
      - path: packages/core/src/qmd/paperNotes.ts
        lines: 1-200
        why: PaperNotesStore.addItem
      - path: packages/browser/__tests__/capture/pdfFindingSave.test.ts
        lines: 1-60
        why: layout and fixtures of the existing save tests
    seams:
      - path: packages/browser/src/capture/pdfFinding.ts
        signature: 'interface SaveOptions { folder?: string; tags?: string[]; note?: string; notes?: Pick<PaperNotesStore, "addItem"> }'
      - path: packages/browser/src/capture/pdfFinding.ts
        signature: 'export async function writeOrAsk(log: ILogger, mutations: LibraryMutations, draft: CaptureDraft, opts: SaveOptions = {}, ifNoPdf: MissingPdfAction = "ask"): Promise<WriteDecision>'
      - path: packages/browser/src/storage/records.ts
        signature: 'export function createPaperNotesPort(fs: Pick<LibraryFileSystem, "stat" | "readFile" | "writeFile">): PaperNotesPort'
    decided:
      - The popup field (`popup/index.html`, `popup/entry.ts`) and the `capture.save` `note` field stay unchanged.
      - The notes store reaches the save through `SaveOptions.notes` (only `addItem` is needed); `writeOrAsk` keeps its signature. `background/handlers.ts` builds `new PaperNotesStore(createPaperNotesPort(fs))` (6.5) and passes it with `msg.note`.
      - "After `importPaper` resolves, the save calls `opts.notes.addItem(paper.id, {body: note.trim()})` with `paper.id` of the `PaperRecord` that `importPaper` returned. The `extra` passed to `importPaper` has no `note` key."
      - A note that is missing, empty or only whitespace calls no `addItem`, so no `notes.qmd` is created.
      - 'A rejected `addItem` is logged with `log.error` and the capture still returns `{kind: "saved"}` with the saved paper; nothing is rolled back.'
      - The captured paper's record has no `note` key.
    acceptance:
      - id: 6.6a
        check: '`writeOrAsk` with `opts.note` "  idea  " and a fake `notes` calls `addItem(paper.id, {body: "idea"})` once after `importPaper`, and the `extra` given to `importPaper` has no `note` key'
      - id: 6.6b
        check: "`writeOrAsk` with no note, an empty note or a whitespace note never calls `addItem`"
      - id: 6.6c
        check: 'when `addItem` rejects, the error is logged and `writeOrAsk` still resolves to `{kind: "saved"}`'
    tests:
      hidden:
        - documents/plans/qmd-notes/tests/6.6/packages/browser/__tests__/capture/pdfFindingNotes.test.ts
      command: node scripts/agents/run.mjs test browser --spec 6.6 --plan qmd-notes -- packages/browser/__tests__/capture/pdfFindingNotes.test.ts
    commands:
      - node scripts/agents/run.mjs typecheck browser
      - node scripts/agents/run.mjs test browser
    do_not_touch:
      - packages/core/
      - packages/browser/src/libraryUi/
