      - path: packages/terminal/__tests__/cli/libraryCommands.test.ts
        lines: 1-60
        why: layout and fixtures of the existing show tests
    decided:
      - "D13: `labshelf show` prints the segments of `notes.qmd` in file order: each item as a line starting with `— ` followed by the `YYYY-MM-DD` of `created` and, when anchored, the anchor attribute text (e.g. `— 2026-10-23 p10 box 0.12 0.4 0.3 0.1`), then its body lines; loose text is printed as is, with no dated line. A paper without `notes.qmd` or with an empty one prints no notes block and no `— ` line."
      - "`show` never prints a `note:` line or a `note` key left in `metadata.yaml`; `show --json` prints the record without a `note` key."
      - Editing notes in `$EDITOR` writes only `notes.qmd`; `metadata.yaml` is untouched.
      - The note key (`e`) opens `notes.qmd` itself in `$EDITOR` (creating it empty if missing) and reloads after the editor exits; an editor failure shows the existing warning and changes nothing.
      - The preview shows the first lines of the last item.
      - The terminal feeds `LibraryStore.setNotesText` so search finds note text; the terminal's search help text keeps listing notes.
    acceptance:
      - id: 6.7a
        check: "`show` of a paper with two items prints both bodies, each under its dated line, and loose text as is"
      - id: 6.7b
        check: the note action opens `notes.qmd` and the terminal reloads the notes after exit
      - id: A4
        check: the terminal shows the same notes as VS Code and the browser, from `notes.qmd`, and reads no `note` key
    tests:
