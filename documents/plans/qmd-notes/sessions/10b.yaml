schema: session/v1
id: 10b
goal: A Space shows working Notes and Discussions tabs.
depends_on:
  - "10"
owns:
  - packages/core/src/spaces/
status: pending
packages:
  - id: "10.5"
    plan: qmd-notes
    goal: Design the Notes tab and the Discussions tab from documents/ui.md.
    level: task
    runner:
      agent: main
      model: opus
    depends_on: []
    edit: []
    create: []
    read:
      - path: documents/ui.md
        lines: 1-32
        why: principles, where things are, how to design
      - path: documents/plans/qmd-notes/research/spaces-collab.md
        lines: 10-17
        why: Notes, Discussions, Research chat placeholders
    decided:
      - "Notes tab: list, New note, a note open in the core editor. Discussions tab: topic list with Open/Resolved filter and search, thread view with messages, reply box in the core editor."
      - Space notes only; the Paper notes group of the placeholder is removed unless the outcome keeps it with a source.
      - UI text per `packages/core/src/qmd/dom/vocabulary.ts` (D16, created by session 4).
    acceptance:
      - id: 10.5a
        check: outcome written into the decided of 10.6
    tests:
      none: design, no code
    commands: []
  - id: "10.6"
    plan: qmd-notes
    goal: Replace the placeholder Notes and Discussions with working views.
    level: behaviour
    runner:
      agent: implementer
      model: sonnet
    depends_on:
      - "10.5"
    edit:
      - path: packages/core/src/spaces/dom/mountSpace.ts
        lines: 1-167
        why: remove the placeholder spaceNotes, group and renderSpaceDiscussions; mountSpacePositioned keeps Not available yet only for discover; mountBody mounts the new views
      - path: packages/core/src/spaces/dom/positioned.css
        lines: 1-31
        why: drop rules nothing uses, add rules for the working views, tokens only
    create:
      - packages/core/src/spaces/dom/mountSpaceNotes.ts
      - packages/core/src/spaces/dom/mountSpaceDiscussions.ts
    read:
      - path: packages/core/src/spaces/dom/mountSpacePapers.ts
        lines: 1-159
        why: "shape of a Space tab view: mount, update, dispose over the transport"
      - path: packages/core/src/spaces/spacesProtocol.ts
        lines: 1-201
        why: messages from 10.2
      - path: packages/core/src/spaces/dom/index.ts
        lines: 1-4
        why: exports
      - path: packages/core/src/qmd/dom/qmdEditor.ts
        lines: 1-400
        why: mountQmdEditor (created by session 4)
    seams:
      - path: packages/core/src/spaces/dom/mountSpaceNotes.ts
        signature: "export function mountSpaceNotes(root: HTMLElement, context: OverviewContext): SpaceBody"
      - path: packages/core/src/spaces/dom/mountSpaceDiscussions.ts
        signature: "export function mountSpaceDiscussions(root: HTMLElement, context: OverviewContext): SpaceBody"
    decided:
      - Two files named like the other tab views (`mountSpaceNotes.ts`, `mountSpaceDiscussions.ts`) replace the placeholders; the placeholder markup and CSS rules nothing uses are deleted.
      - The editor is `mountQmdEditor` from `packages/core/src/qmd/dom/qmdEditor.ts` (created by session 4).
      - "`mountSpacePositioned` keeps Not available yet only for `discover`. Tokens only. No `onRunCell` here (cells run from session 12 on)."
      - The design outcome of 10.5 is appended here before the run.
    acceptance:
      - id: 10.6a
        check: typecheck of core, vscode and browser passes
      - id: A8
        check: in VS Code and the browser a Space has Notes and Discussions tabs backed by one `.qmd` per note or thread
    tests:
      none: UI checked by the user by hand in the app
    commands:
      - node scripts/agents/run.mjs typecheck core
      - node scripts/agents/run.mjs typecheck vscode
      - node scripts/agents/run.mjs typecheck browser
    do_not_touch:
      - packages/vscode/
      - packages/browser/
