    decided:
      - "D8: comments, review comments and suggestions become items in `.labshelf/comments.qmd`; the anchor is the existing quote/prefix/suffix anchor."
      - "Mapping: each comment is one item. The first comment of a thread carries the thread: `#<thread id>`, `anchor=\"quote:…\"`, `file=\"<POSIX path>\"`, `resolved=\"true\"` only when resolved, and optional `start`/`end` (base64 Yjs relative positions, shared projects only). Replies are items with `thread=\"<thread id>\"` and no anchor. Author and `created` come from the comment. The body is the comment body (LabShelf Markdown)."
      - "Thread order is the order of the first items; reply order is file order. Flat items keep D4's merge per id, so two offline replies both survive."
      - "Existing ids are kept verbatim as item ids (thread and comment ids need no `n-` prefix; the contract allows any id the parser accepts); new ids use `newItemId`."
      - "`COMMENTS_PATH` is `.labshelf/comments.qmd`. An unreadable file is never overwritten (the kept rule of `updateCommentsDocument`). Unknown attributes and text outside items survive a rewrite."
      - "No migration (documents/code.md#contracts): `comments.json` is not read and its parse code is deleted. `parseCommentsFile`, `serializeCommentsFile` and their key-order helpers in `commentsFile.ts` go; search all packages for other users before deleting and update them."
      - "Document the mapping in `documents/contracts/qmd-items.md` under a `#comments` anchor and point the `comments.json` bullet of `library-format.md#project-folder-labshelf` (now line 78) to it."
      - "Unreadable means top-level git conflict markers (`<<<<<<<`, `=======`, `>>>>>>>` lines outside items): `parseCommentsQmd` returns undefined, `loadCommentsDocument` returns undefined, `updateCommentsDocument` rejects without writing. Any other text parses: a `comments.json` text is loose text and yields zero threads (A7)."
      - "`CommentsDocument.threads` holds `CommentThread` values; `addThreadReply`, `setThreadResolved`, `addThread` and `deriveCommentThreads` stay exported and operate on them. The extra keys of a parsed document are what makes a rewrite keep unknown attributes and loose text; `serializeCommentsQmd({threads})` of plain threads writes none."
      - "`renderCommentsFile` and `importCommentsFile` change to the .qmd here, with their current signatures, because they used the deleted JSON helpers; 8.3 adds the mirror and seeding wiring and its hidden tests."
      - "`.labshelf/comments.json` is replaced by `.labshelf/comments.qmd` in `EXCLUDED_PATHS` of `packages/core/src/templates/node/templateFolder.ts` (line 59) and in the two template tests that list it (`writeProjectAsTemplate.test.ts` line 44, `checkTemplateForPublish.test.ts` line 146), so a template never carries comments."
      - "The browser and VS Code stores use only `loadCommentsDocument`, `updateCommentsDocument` and `COMMENTS_PATH` (no parse helpers), so they keep compiling; their comments.json tests and texts are moved by 8.7 and 8.8."
      - "finish checks this against documents/contracts/qmd-items.md, documents/contracts/library-format.md and documents/contracts/collaboration.md."
    acceptance:
      - {id: "8.1a", check: "threads → file → threads are equal, replies included"}
      - {id: "8.1b", check: "the resolved flag is written only when true and read back"}
      - {id: "8.1c", check: "reply order is file order and thread order is the order of first items"}
