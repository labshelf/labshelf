      - {id: "A7", check: "COMMENTS_PATH is `.labshelf/comments.qmd`, `parseCommentsFile` and `serializeCommentsFile` are not exported from collab, and a comments.json text in the store reads as zero threads (the typecheck in `commands` proves nothing else uses the deleted helpers)"}
