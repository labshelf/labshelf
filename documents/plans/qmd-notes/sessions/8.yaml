      - "D14: the shared doc of a `.qmd` path is a `Y.Map` named `qmd` with `order: Y.Array<string>` (segment keys: item ids, loose segments `loose-<n>`), `attrs: Y.Map<key, string>` (the exact fence line per item) and `bodies: Y.Map<key, Y.XmlFragment>` (via `prosemirrorJSONToYXmlFragment`/`yXmlFragmentToProsemirrorJSON` and `bodyToDoc`/`docToBody`). Other text files keep `Y.Text` `content`."
