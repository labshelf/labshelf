      - path: packages/core/src/qmd/sendTo/index.ts
        lines: 1-20
        why: Send to API (created by 9.3)
      - path: packages/core/src/qmd/projectNotes/projectNotesStore.ts
        lines: 1-200
        why: ProjectNotesStore (created by 9.1)
      - path: packages/core/src/writing/citations/index.ts
        lines: 1-27
        why: citeSiteNotes built by 9.4
      - path: packages/core/src/qmd/dom/qmdEditor.ts
        lines: 1-400
        why: mountQmdEditor (created by session 4)
    decided:
      - Gutter marker as a CodeMirror `gutter` extension with a popover listing items, in `packages/browser/src/writing/noteGutter.ts`.
      - Recent Send to targets in `chrome.storage.local`.
      - Notes open in `mountQmdEditor` in a project note tab.
      - "`projectTaskProgress.ts` of the old plan is now `projectChecklist` in `packages/browser/src/libraryUi/spaces.ts`."
      - Design details come from 9.6 (written into this decided by the main thread).
    acceptance:
      - id: 9.8a
        check: typecheck and browser tests pass
      - id: 9.8b
        check: 'A6 by hand in the browser: Send to the project note, the checklist row appears and ticking it ticks the note; the source editor gutter shows "N notes" at a cite site'
    tests:
      none: UI and host glue, checked by the user by hand in the app
    commands:
