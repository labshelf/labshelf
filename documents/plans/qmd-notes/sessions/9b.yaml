schema: session/v1
id: 9b
goal: A manuscript line that cites a paper shows its notes, and VS Code and the browser wire project notes, the checklist from notes and Send to into their UI.
depends_on:
  - "9"
owns:
  - packages/core/src/writing/citations/
  - packages/core/src/reader/dom/
  - packages/vscode/src/writing/
  - packages/vscode/src/activation/startExtension.ts
  - packages/vscode/package.json
  - packages/browser/src/writing/
  - packages/browser/src/libraryUi/
  - packages/browser/src/storage/
  - packages/core/__tests__/writing/citations/
status: pending
packages:
  - id: "9.4"
    plan: qmd-notes
    goal: From backlinks, each cite site in a manuscript knows how many notes the cited paper has, for "N notes" in the editors.
    level: behaviour
    runner:
      agent: implementer
      model: sonnet
    edit:
      - path: packages/core/src/writing/citations/backlinks.ts
        lines: 1-51
        why: add citeSiteNotes next to the backlink index
      - path: packages/core/src/writing/citations/index.ts
        lines: 21-21
        why: export citeSiteNotes and its type
    read:
      - path: documents/plans/qmd-notes/research/comments-checklist.md
        lines: 34-38
        why: Backlinks section of the research
      - path: packages/core/src/writing/citations/citeKeys.ts
        lines: 100-140
        why: findCitationSites and CitationSite
      - path: packages/core/src/qmd/paperNotes.ts
        lines: 1-200
        why: "PaperNotesStore.read: item count of a paper's notes (created by session 6)"
    seams:
      - path: packages/core/src/writing/citations/backlinks.ts
        signature: "export function citeSiteNotes(sites: readonly { file: string; line: number; key: string }[], notesCount: (citeKey: string) => number): CiteSiteNotes[]"
      - path: packages/core/src/writing/citations/backlinks.ts
        signature: "export interface CiteSiteNotes { file: string; line: number; citeKey: string; notes: number }"
    decided:
      - "`citeSiteNotes(sites, notesCount: (citeKey) => number)` returns `{file, line, citeKey, notes}[]` with `notes > 0` only, in `packages/core/src/writing/citations/backlinks.ts` (the backlinks concept file; the old plan's `writing/backlinks/` folder does not exist)."
      - Cite key to paper id resolution is the caller's, with `derivePapersByCiteKey` (`citeKeys.ts`) as `addBacklinks` callers already do; `citeSiteNotes` only counts.
      - "`citeSiteNotes` keeps the input order of the sites and calls `notesCount` with the site's `key`; a count of 0 skips the site."
      - Counts are recomputed when `projectBacklinks` runs (`deriveProjectBacklinks` in `backlinks.ts`), never per keystroke.
    acceptance:
      - id: 9.4a
        check: two cite sites of one key both report its count
      - id: 9.4b
        check: a key without notes is skipped
    tests:
      hidden:
        - documents/plans/qmd-notes/tests/9.4/packages/core/__tests__/writing/citations/index.test.ts
      command: node scripts/agents/run.mjs test core --spec 9.4 --plan qmd-notes -- packages/core/__tests__/writing/citations/index.test.ts
    commands:
      - node scripts/agents/run.mjs typecheck core
      - node scripts/agents/run.mjs test core
    do_not_touch:
      - packages/core/src/writing/citations/projectSources.ts
    depends_on: []
  - id: "9.6"
    plan: qmd-notes
    goal: Design the UI of project notes, Send to and cite-site notes from `documents/ui.md`.
    level: task
    runner:
      agent: main
      model: opus
    edit: []
    read:
      - path: documents/ui.md
        lines: 1-60
        why: "#principles, #where-things-are, #how-to-design (find ranges with `node scripts/docs/doc.mjs ui`)"
      - path: documents/plans/qmd-notes/research/editor-ui.md
        lines: 1-27
        why: editor UI research
    decided:
      - 'Design from `documents/ui.md`: "New note" in the project view and the notes list, checklist rows of kind `noteTask` (link to the note), the Send to menu (recent targets first, then projects, then Spaces) in the reader selection menu and the editor item menu, and "N notes" at cite sites (VS Code code lens + hover, browser CodeMirror gutter + popover).'
      - UI text uses the word "note" from the single vocabulary entry (D16), so a rename is one change.
    acceptance:
      - id: 9.6a
        check: outcome written into the decided of 9.7 and 9.8
    tests:
      none: design, no code
    depends_on: []
  - id: "9.7"
    plan: qmd-notes
    goal: VS Code creates and opens project notes, shows note tasks in the checklist and ticks them, offers Send to, and shows "N notes" at cite sites.
    level: behaviour
    runner:
      agent: implementer
      model: sonnet
    depends_on:
      - "9.4"
      - "9.6"
    edit:
      - path: packages/vscode/src/writing/projects/checklist.ts
        lines: 1-343
        why: "act on noteTask rows: tick through toggleNoteTask, reread when the note changed on disk"
      - path: packages/vscode/src/writing/projects/checklistSignals.ts
        lines: 1-124
        why: pass the ProjectNotesStore to readChecklistSignals
      - path: packages/vscode/src/writing/projects/commands.ts
        lines: 1-245
        why: New note and Open note commands
      - path: packages/vscode/src/writing/citations/index.ts
        lines: 1-5
        why: export the note lens and hover registration
      - path: packages/vscode/src/writing/citations/backlinks.ts
        lines: 1-181
        why: compute citeSiteNotes when ProjectBacklinks refreshes (:164)
      - path: packages/vscode/src/activation/startExtension.ts
        lines: 1-152
        why: composition root builds the stores and Send to writers
      - path: packages/vscode/package.json
        lines: 582-740
        why: commands and menu entries (checklist commands at :582, :736)
      - path: packages/core/src/reader/dom/selectionBubble.ts
        lines: 1-138
        why: Send to entry in the reader selection menu; the only core file this package touches
    create:
      - packages/vscode/src/writing/citations/noteLens.ts
    read:
      - path: packages/vscode/src/writing/citations/hover.ts
        lines: 1-116
        why: HoverProvider pattern for cite keys
      - path: packages/core/src/qmd/sendTo/index.ts
        lines: 1-20
        why: Send to API (created by 9.3)
      - path: packages/core/src/qmd/projectNotes/projectNotesStore.ts
        lines: 1-200
        why: ProjectNotesStore (created by 9.1)
      - path: packages/core/src/writing/citations/index.ts
        lines: 1-27
        why: citeSiteNotes built by 9.4
      - path: packages/core/src/reader/dom/selectionBubble.ts
        lines: 13-70
        why: SelectionBubbleContent and CommentOnSelection, the selection menu
    decided:
      - Stores and Send to writers are built in the composition root (`startExtension.ts`).
      - "Cite sites: a `CodeLensProvider` on `.tex`/`.typ` shows \"N notes\"; a `HoverProvider` shows the first lines of the last items; the lens opens the paper's notes."
      - Recent Send to targets use `globalState`.
      - Design details come from 9.6 (written into this decided by the main thread).
      - The only core change is the Send to entry in `selectionBubble.ts`, which posts a message the VS Code and browser hosts both handle.
    acceptance:
      - id: 9.7a
        check: typecheck and vscode tests pass
      - id: 9.7b
        check: 'A6 by hand in VS Code: select a passage in the reader, Send to the project note, the item appears with a link to the page; its `- [ ]` is in the Checklist and ticking there ticks it in the note; the manuscript cite site shows "N notes"'
      - id: A6
        check: selecting a passage in the reader and choosing Send to → project "modern-thesis" adds an item with a link back to the page to that project's note; a `- [ ]` in it appears in the project Checklist, and ticking it there ticks it in the note; manuscript cite sites show "N notes" in VS Code and the browser
    tests:
      none: UI and host glue, checked by the user by hand in the app
    commands:
      - node scripts/agents/run.mjs typecheck vscode
      - node scripts/agents/run.mjs test vscode
    do_not_touch:
      - core, except the Send to entry in `packages/core/src/reader/dom/selectionBubble.ts`
  - id: "9.8"
    plan: qmd-notes
