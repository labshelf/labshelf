  - id: "9.7.3"
    plan: qmd-notes
    goal: The VS Code reader's "Send to…" picks a project note (or a new one) and appends the quoted passage with its page link.
    level: behaviour
    runner:
      agent: implementer
      model: opus
    depends_on:
      - "9.7.2"
    create:
      - packages/vscode/src/reader/sendToNote.ts
    edit:
      - {path: packages/vscode/src/reader/panel.ts, lines: 40-140, why: "optional `sendTo?: ReaderSendToDeps` on ReaderPanelDeps (:118-127); spread `sendToNote` into the host ports (createVsCodeOutputPorts :50-66) when present"}
      - {path: packages/vscode/src/reader/panel.ts, lines: 300-342, why: "PdfReaderDeps (:314-318) gains the optional `sendTo`"}
      - {path: packages/vscode/src/activation/registerPanelCommands.ts, lines: 1-160, why: "optional `sendTo` on PanelCommandsDeps, forwarded into PdfReaderDeps (:141)"}
      - {path: packages/vscode/src/activation/startExtension.ts, lines: 30-152, why: "build the ReaderSendToDeps from writing.projects, writing.notes, context.globalState, writing.logger and pass it to registerPanelCommands"}
    read:
      - {path: packages/core/src/qmd/sendTo/sendTo.ts, lines: 1-44, why: "SendTarget, sendTo(writers, {logger, newItemId})"}
      - {path: packages/core/src/qmd/sendTo/projectNoteWriter.ts, lines: 1-26, why: "IProjectAssetWriter; createProjectNoteWriter(store, assets)"}
      - {path: packages/core/src/qmd/sendTo/recentTargets.ts, lines: 1-46, why: "IKeyValueStore; createRecentTargets(store, key)"}
      - {path: packages/core/src/qmd/sendTo/targetChoices.ts, lines: 1-60, why: "SendTargetChoice, deriveSendTargetChoices"}
      - {path: packages/core/src/qmd/sendTo/sendBody.ts, lines: 1-15, why: SendPayload}
      - {path: packages/core/src/reader/hostPorts.ts, lines: 55-85, why: "ReaderHostPorts.sendToNote(request: {key, page, text}): Promise<void>"}
      - {path: packages/vscode/src/writing/projects/noteFiles.ts, lines: 1-60, why: "project id → folder (9.7.1), for the asset writer and opening the note"}
    decided:
      - "sendToNote.ts exports `interface ReaderSendToDeps { projects: WritingProjects; notes: ProjectNotesStore; recent: <createRecentTargets result>; logger: ILogger; newItemId(): string }` and `createSendToNote(deps): ((request) => Promise<void>) | undefined`-style logic: panel.ts provides the port only when at least one ready writing project exists at the time of the call (otherwise the core handler's `Send to is not available here` applies — check at call time and show that information message if none)."
      - "Flow: build the projects list `{projectId: settings.id, name, notes: await notes.list(id)}` for ready projects; `deriveSendTargetChoices(recent.list(), projects)`; showQuickPick (title `Send to…`, label/description from the choice, choices with `recent: true` under a `Recent` separator, the rest under per-project or no separator). `newNote` asks the title with showInputBox and creates it with notes.create first. Then `sendTo({ projectNote: createProjectNoteWriter(notes, assets) }, { logger, newItemId })` with target and payload `{ kind: \"quote\", key, page, text }`; push the target to recent; show `Sent to <note title>` with an `Open` action opening the note file. Cancel at any step does nothing. Errors propagate (the core handler notifies `Failed to send: …`)."
      - "assets: an IProjectAssetWriter writing into the project folder through projects.fs (ensureDir parent, then write bytes) — follow the interface in projectNoteWriter.ts."
      - "recent: createRecentTargets over a Memento adapter on context.globalState, key `labshelf.sendTo.recent`. newItemId: the id generator the other item writers in vscode use, else crypto.randomUUID."
      - "Keep `sendTo` optional so the other createOrShow callers (writing/preview/panel.ts, writing/history/versionCompare.ts) do not change."
      - "Host strings use the literal word \"note\" with a `// D16: QMD_VOCABULARY.item` comment. All core symbols come from the `@labshelf/core` root."
    acceptance:
      - {id: 9.7.3a, check: typecheck vscode and vscode tests pass}
      - {id: 9.7.3b, check: "A6 by hand in VS Code: select a passage in the reader, Send to the project note, the item appears with a link to the page; its `- [ ]` is in the Checklist and ticking there ticks it in the note"}
    tests:
      none: host glue, checked by the user by hand in the app
    commands:
      - node scripts/agents/run.mjs typecheck vscode
      - node scripts/agents/run.mjs test vscode
    do_not_touch:
      - packages/core
      - packages/vscode/src/writing/citations
