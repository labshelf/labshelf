    depends_on: []
    edit:
      - {path: packages/vscode/src/writing/projects/commands.ts, lines: 1-245, why: "registerProjectNoteCommands({context, projects, store, logger})"}
      - {path: packages/vscode/src/activation/startExtension.ts, lines: 30-80, why: "call registerProjectNoteCommands with writing.projects, writing.notes, writing.logger after registerWritingView (:41)"}
