    decided:
      - "`labshelf.projects.newNote` (title `New Note`, category as the neighbouring writing commands): needs a ready open project (the one the other project commands use; none → information message `Open a writing project first`), asks the title with showInputBox (empty/cancel → nothing), calls store.create(projectId, title), opens the created file in the text editor with vscode.window.showTextDocument."
      - "`labshelf.projects.openNote` (title `Open Note…`): showQuickPick over store.list(projectId), label the note title, description the relative path; with no notes the only item is `No notes yet — New Note…`, which runs newNote. Picking opens the file in the text editor."
      - "The Checklist buttons already call these commands (9.7.1). No view/title menu entry: the Checklist is a mirrored spec, not a contributed view."
