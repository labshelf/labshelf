        lines: 1-321
        why: FileComments reads comments.qmd through the store; review comments (addSourceComment) land as items; bodies render math; the doc comment (line 39) and the WARN message (line 117) name comments.qmd instead of comments.json
      - path: packages/vscode/src/collab/threads.ts
        lines: 1-136
        why: commentsOf builds MarkdownString bodies with rendered math
    create: []
    read:
      - path: documents/plans/qmd-notes/research/comments-checklist.md
        lines: 19-27
        why: Review comments and Comment UI
      - path: packages/vscode/src/collab/comments.ts
        lines: 40-125
        why: FileComments, the unshared project's store
      - path: packages/vscode/src/collab/comments.ts
        lines: 264-311
        why: SharedComments, the shared project's store
      - path: packages/core/src/collab/index.ts
        lines: 1-44
        why: the core comment API
    decided:
      - Bodies are `MarkdownString`; math is rendered in the host with `renderMathSvg` (`@labshelf/core/math`, loaded lazily) into `data:image/svg+xml` images.
      - "PLATFORM: confirm the comment widget shows data-URI images; if it does not, stop and report."
      - Review comments (`addReviewComment` → `addSourceComment`) keep their path and land as items of `comments.qmd`.
      - Apply the design outcome of 8.6.
