    path: packages/browser/src/writing/editor.ts
    lines: "306-308"
  - symbol: mountSourceEditor
    path: packages/browser/src/libraryUi/editorArea/sourceTab.ts
    lines: "61-65"
  - symbol: createSourceActions
    path: packages/browser/src/libraryUi/editorArea/sourceTab.ts
tests:
  - path: packages/browser/__tests__/writing/editorMount.test.ts
    covers: "Mounts mountSourceEditor in jsdom with a fake SourceFileAccess, finds the view with EditorView.findFromDOM(host), dispatches changes, flush(), dispose(). Best model for a mounted-extension test."
  - path: packages/browser/__tests__/writing/sourceInsert.test.ts
    covers: "Mocks pickQuickEntry and askInputBox with jest.mock of @labshelf/core/dom spreading jest.requireActual, asserts entries and insertText calls. Model for the picker flow."
  - path: packages/browser/__tests__/writing/sourceActions.test.ts
    covers: "createSourceActions"
  - path: packages/browser/__tests__/writing/editorSave.test.ts
    covers: "save scheduling"
contracts: ["documents/contracts/qmd-items.md#manuscript-links"]
commands:
  - "node scripts/agents/run.mjs test browser -- packages/browser/__tests__/writing/editorMount.test.ts"
  - "node scripts/agents/run.mjs test browser -- packages/browser/__tests__/writing/sourceInsert.test.ts"
risks:
  - "Test runner is jest, not vitest. DOM tests start with the docblock jest-environment jsdom plus jest-environment-options with customExportConditions node and node-addons; copy lines 1-4 of editorMount.test.ts. CodeMirror is tested with a real EditorView in jsdom; no EditorState-only test seen."
  - "CSS: no separate stylesheet for the source editor; styles are JS EditorView.theme in editor.ts:20-70 and noteGutter.ts:176-193. Page-level classes such as ls-source-notice are in packages/browser/src/libraryPage/page.css:25-29. Tokens are in packages/core/src/ui/dom/tokens.css (and vscodeHost.css): --ls-error (line 8), --ls-warning (71), --ls-desc muted text (7), --ls-section-fg gutter and muted (16), --ls-mark-accent comment and note accent (80), plus --ls-focus, --ls-widget-bg, --ls-menu-fg, --ls-menu-border, --ls-widget-shadow, --ls-radius, --ls-space-N, --ls-text-sm. Patterns: lint underline wavy var(--ls-error) or var(--ls-warning); diagnostics border-left 3px; comment range uses color-mix of --ls-mark-accent 22 percent with transparent. No success colour token found."
  - "Decoration.line is not used anywhere in packages/browser/src; only Decoration.mark, Decoration.widget and gutter markers."
  - "No existing function lists cited paper ids, and no raw-text project note reader exists; NoteInsertSource must be assembled in browser code. A project notes store exists in the session wiring (mountProjectWiring.ts near 118) but is not passed to TabContext or editorDeps."
  - "For a shared (collab) file the save scheduler is a no-op (editor.ts:343), so onSaved never fires; refreshNotes runs only on open and reload there."
  - "Path forms: project note paths from store.list are project-relative (notes/x.qmd); paper notes are paper:ID/notes.qmd and must be mapped back to createPaperNotesPort(fs).read(ID)."
