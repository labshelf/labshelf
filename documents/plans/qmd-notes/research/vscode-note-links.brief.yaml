risks:
  - "VS Code mock: jest.config.js maps vscode to packages/vscode/__mocks__/vscode (index.js spreads ./types and ./api). Jest globals, no imports. api has workspace (applyEdit jest.fn true, fs stat mock), window (showQuickPick, showTextDocument, showInformationMessage, activeTextEditor), commands (registerCommand records {command,handler}, executeCommand jest.fn), env, extensions. types/languageFeatures.js:40-49 mocks languages with only createDiagnosticCollection, registerCompletionItemProvider, registerHoverProvider, registerDocumentLinkProvider, registerDefinitionProvider, registerDocumentSymbolProvider, registerCodeActionsProvider. registerCodeLensProvider and registerTextDocumentContentProvider are NOT mocked."
  - "Virtual documents: no TextDocumentContentProvider anywhere in packages/vscode/src, so no scheme to reuse for vscode.diff. Only vscode.diff use is conflicts.ts:119 with file URIs."
  - "package.json: contributes.commands starts at line 52. writing.* commands run about 368-611. Editing ones: bold 539, italic 545, insertSymbol 551, insertTable 557, insertImage 563, citeFromLibrary 569, searchInProject 575, checklist.addItem 581, runCheck 587, projects.newNote 593, projects.openNote 598, regenerateFigure 603. Pattern {command, title:'Research: <Verb Noun>', category:'LabShelf', icon:'$(codicon)'}. The projects.* note commands have no Research: prefix or icon."
  - "commandPalette (starts 736): editing commands use when 'labshelf.writing.inProject && editorLangId =~ /^(latex|typst)$/' (about 770-788: citeFromLibrary, searchInProject, insertSymbol, insertTable, insertImage); bold/italic use only labshelf.writing.inProject; showInPreview uses editorLangId == latex; project note commands use labshelf.writing.projectOpen. editor/context (1025) has only showInPreview. explorer/context has setMain with resourceExtname =~ /^\\.(tex|typ)$/. Line numbers +-3."
  - "No existing function lists paper ids cited by a project or reads a paper's notes.qmd as raw text; PaperNotesStore.read returns a parsed ItemFile. paperService.listPapers() needs controller.currentServices() (undefined with no library open)."
  - "ProjectNotesStore.read returns string|null while core NoteInsertSource expects string|undefined. createProjectNoteFiles throws if the project id is not open."
  - "registerEditingSupport receives only WritingParts (no notes, no backlinks); the startExtension.ts:49-50 site already has writing.notes, writing.backlinks, writing.projects and controller."
