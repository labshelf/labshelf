schema: plan/v1
slug: qmd-notes
title: Notes in Quarto Markdown everywhere
status: in_progress
level: N3
goal: Every place a user writes outside LaTeX or Typst (paper notes, text boxes on a PDF page, project notes, comments and review suggestions, Space notes and discussions) is Quarto Markdown underneath, edited in one rich editor that never shows the syntax. One `.qmd` file holds every item of one case (all notes of a paper, one discussion thread), and LabShelf shows the items one by one. Notes carry math, code cells with their results, and links back to papers; they feed the project checklist and the manuscript, and code cells run in an optional Python that the user chooses to install through the helper.
decisions:
  - id: D1
    text: 'The format is "LabShelf Markdown": a defined subset of Quarto Markdown, specified in the contract `documents/contracts/qmd-items.md`. Code lives in the core domain `packages/core/src/qmd/` (runtime-neutral root, `dom/` for the editor).'
    why: One format, one parser, one editor for every writing field.
  - id: D2
    text: 'One file per case. Each item is a fenced div `::: {#<id> .labshelf-item anchor="…" author="…" created="…"}` … `:::`. Ids are `n-` + ULID. An anchor is `hl:<annotation id>`, `p<page> box <x> <y> <w> <h>`, `quote:<base64url JSON of quote, prefix and suffix>`, or absent. Text outside any item is kept and shown as an item without anchor; nothing a user wrote is ever dropped.'
    why: Few files, readable in Quarto, safe against hand edits.
  - id: D3
    text: 'A cell result is stored inside the file, right after its cell, as `::: {.labshelf-output cell="<label>" source="<first 12 hex characters of the SHA-256 of the cell code without its #| lines>" engine="…" ran="…"}`. A result whose `source` does not match the cell code shows as out of date.'
    why: A note or a message carries its results; the receiver sees them without running anything.
  - id: D4
    text: "`.qmd` item files merge by block: three-way against the existing per-device base, keyed by item id (union of new items, one-sided edits kept, deletes honoured, edit beats delete, both-sided edits merged as text inside the item). Applies in projects, paper folders and Space folders."
    why: Line merge turns two appends into conflict markers.
  - id: D5
    text: Rich editor on ProseMirror. The schema and the `.qmd` ↔ ProseMirror conversion live in `packages/core/src/qmd/editor/` and round-trip byte for byte on files LabShelf wrote; the DOM editor lives under `packages/core/src/qmd/dom/`. Math renders through `@labshelf/core/math` (MathJax SVG), loaded lazily.
    why: The user asked for an editor that never shows syntax.
  - id: D6
    text: Paper notes live in `.research/papers/<id>/notes.qmd`. The paper record has no `note` field and annotations have no `note` type; old values are not read. Highlight geometry stays in `data.json`, and a note on a highlight anchors to the annotation id.
    why: One home for what a user writes about a paper.
  - id: D7
    text: A text box on a PDF page is a paper-note item with anchor `p<page> box <x> <y> <w> <h>` in page fractions (as highlights), drawn over the page, always visible, never changing the PDF; long content is clipped and expands on click.
    why: The macOS Preview behaviour the user asked for.
  - id: D8
    text: Project comments, review comments and suggestions become items in `.labshelf/comments.qmd` (anchor = the existing quote/prefix/suffix anchor). The first item of a thread carries its anchor, file and resolved state; replies carry `thread=<first item id>`. `comments.json` is not read.
    why: Same paradigm; comment bodies get math and code.
  - id: D9
    text: "The project checklist and problems are views derived from project `.qmd` files: a task-list item `- [ ]` in a project note is a checklist item, and ticking it in either place edits the note."
    why: One source of truth, no copies.
  - id: D10
    text: '"Send to…" on any selection (PDF passage, figure crop, equation, item) appends an item with a `labshelf:` back-link to a chosen `.qmd` target (project note, Space note or discussion), remembering recent targets.'
    why: Capture without leaving the reader.
  - id: D11
    text: Python + SymPy is a managed tool under `<shared root>/python/`, pinned by version and SHA-256 like TeX (`documents/contracts/managed-tools.md`). Cells run through a core port `ICellRunner`; the helper adds `runCell`/`cancelCell` messages for the browser, VS Code runs the same core node runner directly. Cancel kills the process. No Pyodide, nothing bundled in the extension.
    why: The user chooses what to install.
  - id: D12
    text: "An equation inserted into a manuscript ends with `% labshelf: <note path>#<eq label> @<hash of inserted LaTeX>`. The editor compares hashes: manuscript changed → diverged (never overwritten), note changed → stale (one-click update). Figures and numbers from notes reuse the existing `figures:` and `values:` of `labshelf.yaml`."
    why: Stateless provenance that survives sync and git.
  - id: D13
    text: 'Terminal: notes open as `.qmd` text in `$EDITOR`, `labshelf show` prints them; no rich editor, no cells. Equation capture from PDFs, AI, notation tables and "check this step" stay in `documents/ideas/computational-notes.md`.'
    why: Keeps the terminal a text tool and this plan bounded.
  - id: D14
    text: "Live collaboration of a shared `.qmd` file: the shared doc holds its item bodies as `Y.XmlFragment`s bound with y-prosemirror, and the disk mirror serializes them to `.qmd`. Other text files keep `Y.Text`."
    why: y-prosemirror is the maintained binding; a text-diff bridge loses cursor intent. (Q1, answered 2026-10-22.)
  - id: D15
    text: Python is installed on demand from the app (Run → "Install Python for calculations", as TeX today) and by an option in the helper installers that runs the same install.
    why: The installers have no component pages today and a user who skipped it can still add it later. (Q2.)
  - id: D16
    text: The UI calls an item "note", from one vocabulary entry so a rename is one change.
    why: No better word was proposed. (Q3.)
  - id: D17
    text: Space discussions get the format and the local UI now; sharing a Space comes with a Space-sharing plan.
    why: Space sharing does not exist yet. (Q4.)
  - id: D18
    text: "No migrations: legacy data (`note` key, note annotations, `comments.json`) is not read and its code is deleted."
    why: "documents/code.md#contracts: there are no old libraries to preserve."
acceptance:
  - id: A1
    check: "`qmd-items` contract tests: parse → serialize is byte-identical on fixtures; text outside items survives; unknown attributes survive; a malformed fence never loses text."
  - id: A2
    check: Two devices each add a note to the same `notes.qmd` offline; after sync both notes are there, no conflict markers. A note deleted on one device and untouched on the other stays deleted; deleted on one and edited on the other stays, edited.
  - id: A3
    check: In VS Code and in the browser, a note shows headings, lists, task lists, rendered display and inline math, a code cell and its result, with no Markdown syntax visible; Source mode shows the `.qmd`.
  - id: A4
    check: A paper's notes live as items in `notes.qmd`; `metadata.yaml` has no `note` key and no code reads one; the terminal shows the same notes.
  - id: A5
    check: In the reader, the text-box tool draws a box in an empty area of page 10; it shows its rendered content on the page at any zoom, and opening the paper on another device shows it in the same place.
  - id: A6
    check: Selecting a passage in the reader and choosing Send to → project "modern-thesis" adds an item with a link back to the page to that project's note; a `- [ ]` in it appears in the project Checklist, and ticking it there ticks it in the note.
  - id: A7
    check: Comments and review comments of a project live in `.labshelf/comments.qmd` and show math; no code reads `comments.json`.
  - id: A8
    check: A Space has Notes and Discussions tabs backed by one `.qmd` per note or thread.
  - id: A9
    check: Without Python installed, Run explains what to install; after installing from the app, a SymPy cell runs from VS Code and from the browser through the helper, its result is written into the note, a stuck cell is cancelled, and editing the cell marks the result out of date.
  - id: A10
    check: Inserting an equation from a note writes the origin comment; editing the note marks it stale with an update action; editing the manuscript marks it diverged and nothing is overwritten.
