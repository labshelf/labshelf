<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Template gallery</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#4daafc;text-decoration:none}a:hover{color:#7cc0ff}
</style>
</helmet>
<div style="width: 1280px; height: 820px; box-sizing: border-box; display: flex; flex-direction: column; background: #1f1f1f; color: #cccccc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 13px; overflow: hidden;">

  <div style="height: 35px; flex-shrink: 0; display: flex; align-items: stretch; background: #181818; border-bottom: 1px solid #2b2b2b;">
    <div style="display: flex; align-items: center; gap: 6px; padding: 0 14px; background: #1f1f1f; border-top: 1px solid #0078d4; border-right: 1px solid #2b2b2b; color: #ffffff;">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#3794ff" stroke-width="1.3" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"></rect><rect x="9" y="2" width="5" height="5" rx="1"></rect><rect x="2" y="9" width="5" height="5" rx="1"></rect><rect x="9" y="9" width="5" height="5" rx="1"></rect></svg>
      <span>Templates</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; padding: 0 14px; border-right: 1px solid #2b2b2b; color: #9d9d9d;">
      <span>main.tex</span>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; min-height: 0;">

    <nav aria-label="Template filters" style="width: 232px; flex-shrink: 0; background: #181818; border-right: 1px solid #2b2b2b; padding: 12px 0; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; flex-direction: column;">
        <div style="padding: 0 16px 6px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #9d9d9d;">Sources</div>
        <sc-for list="{{sources}}" as="s" hint-placeholder-count="4">
          <button type="button" onClick="{{s.pick}}" style="{{s.style}}">
            <span style="width: 8px; height: 8px; border-radius: 999px; background: {{s.dot}};"></span>
            <span style="flex-grow: 1; text-align: left;">{{s.label}}</span>
          </button>
        </sc-for>
      </div>
      <div style="display: flex; flex-direction: column;">
        <div style="padding: 0 16px 6px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #9d9d9d;">Format</div>
        <label style="display: flex; align-items: center; gap: 8px; height: 24px; padding: 0 16px;"><input type="checkbox" checked style="margin: 0; accent-color: #0078d4;"><span>LaTeX</span></label>
        <label style="display: flex; align-items: center; gap: 8px; height: 24px; padding: 0 16px;"><input type="checkbox" checked style="margin: 0; accent-color: #0078d4;"><span>Typst</span></label>
      </div>
      <div style="margin-top: auto; padding: 12px 16px 0; border-top: 1px solid #2b2b2b; font-size: 11px; line-height: 1.5; color: #9d9d9d;">Catalog cached on this device. Opens offline; refreshes when online.</div>
    </nav>

    <main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; padding: 20px 28px 0; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <h1 style="margin: 0; font-size: 18px; font-weight: 600; color: #e6e6e6; flex-grow: 1;">Templates</h1>
        <label style="display: flex; align-items: center; gap: 6px; width: 320px; height: 28px; box-sizing: border-box; padding: 0 8px; background: #313131; border: 1px solid #3c3c3c; border-radius: 4px;">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#9d9d9d" stroke-width="1.4" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5 14 14"></path></svg>
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search templates</span>
          <input type="search" placeholder="Search templates, classes, authors" style="flex-grow: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #cccccc; font: inherit;">
        </label>
        <a href="Publish.dc.html" style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 4px; background: #0078d4; color: #ffffff;">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#ffffff" stroke-width="1.4" aria-hidden="true"><path d="M8 11V2.5M4.5 6 8 2.5 11.5 6M2.5 13.5h11"></path></svg>
          <span>Publish a template</span>
        </a>
      </div>

      <div role="group" aria-label="Category" style="display: flex; gap: 6px; flex-wrap: wrap;">
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
          <button type="button" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
        </sc-for>
      </div>

      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-content: start; flex-grow: 1; min-height: 0; overflow: hidden;">
        <sc-for list="{{cards}}" as="t" hint-placeholder-count="8">
          <a href="Detail.dc.html" style="display: flex; flex-direction: column; background: #202020; border: 1px solid #2b2b2b; border-radius: 6px; overflow: hidden; color: #cccccc;">
            <div style="height: 168px; display: flex; align-items: center; justify-content: center; background: #2b2b2b; border-bottom: 1px solid #2b2b2b;">
              <sc-if value="{{t.isTwocol}}" hint-placeholder-val="{{true}}">
                <div style="width: 104px; height: 140px; box-sizing: border-box; padding: 10px 9px; background: #f4f4f2; box-shadow: 0 1px 6px rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 4px;">
                  <div style="height: 5px; width: 70%; align-self: center; background: #555;"></div>
                  <div style="height: 3px; width: 40%; align-self: center; background: #999; margin-bottom: 4px;"></div>
                  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; flex-grow: 1;">
                    <div style="background: repeating-linear-gradient(#bbb 0 2px, transparent 2px 5px);"></div>
                    <div style="background: repeating-linear-gradient(#bbb 0 2px, transparent 2px 5px);"></div>
                  </div>
                </div>
              </sc-if>
              <sc-if value="{{t.isSingle}}" hint-placeholder-val="{{false}}">
                <div style="width: 104px; height: 140px; box-sizing: border-box; padding: 12px 12px; background: #f4f4f2; box-shadow: 0 1px 6px rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 4px;">
                  <div style="height: 5px; width: 75%; align-self: center; background: #555;"></div>
                  <div style="height: 3px; width: 45%; align-self: center; background: #999; margin-bottom: 6px;"></div>
                  <div style="height: 3px; width: 35%; background: #777;"></div>
                  <div style="flex-grow: 1; background: repeating-linear-gradient(#bbb 0 2px, transparent 2px 5px);"></div>
                </div>
              </sc-if>
              <sc-if value="{{t.isPoster}}" hint-placeholder-val="{{false}}">
                <div style="width: 106px; height: 150px; box-sizing: border-box; padding: 6px; background: #f4f4f2; box-shadow: 0 1px 6px rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 4px;">
                  <div style="height: 18px; background: #005fb8;"></div>
                  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; flex-grow: 1;">
                    <div style="display: flex; flex-direction: column; gap: 4px;"><div style="height: 34px; background: #d6dde6;"></div><div style="flex-grow: 1; background: #e3e3e0;"></div></div>
                    <div style="display: flex; flex-direction: column; gap: 4px;"><div style="flex-grow: 1; background: #e3e3e0;"></div><div style="height: 40px; background: #d6dde6;"></div></div>
                    <div style="display: flex; flex-direction: column; gap: 4px;"><div style="height: 26px; background: #d6dde6;"></div><div style="flex-grow: 1; background: #e3e3e0;"></div></div>
                  </div>
                </div>
              </sc-if>
              <sc-if value="{{t.isSlides}}" hint-placeholder-val="{{false}}">
                <div style="width: 150px; height: 84px; box-sizing: border-box; background: #23373b; box-shadow: 0 1px 6px rgba(0,0,0,.3); display: flex; flex-direction: column; justify-content: center; padding: 0 14px; gap: 6px;">
                  <div style="height: 5px; width: 70%; background: #fafafa;"></div>
                  <div style="height: 2px; width: 100%; background: #eb811b;"></div>
                  <div style="height: 3px; width: 40%; background: #9fb0b3;"></div>
                </div>
              </sc-if>
            </div>
            <div style="padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px;">
              <div style="display: flex; align-items: center; gap: 6px;">
                <span style="flex-grow: 1; font-weight: 600; color: #e6e6e6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{t.name}}</span>
                <sc-if value="{{t.installed}}" hint-placeholder-val="{{false}}">
                  <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#89d185" stroke-width="1.6" role="img" aria-label="Downloaded"><path d="M3 8.5 6.5 12 13 4.5"></path></svg>
                </sc-if>
              </div>
              <div style="font-size: 11px; color: #9d9d9d;">{{t.by}}</div>
              <div style="display: flex; gap: 4px; flex-wrap: wrap;">
                <span style="padding: 1px 6px; border-radius: 3px; font-size: 11px; background: #313131; color: #cccccc;">{{t.format}}</span>
                <span style="padding: 1px 6px; border-radius: 3px; font-size: 11px; background: #313131; color: #cccccc;">{{t.engine}}</span>
                <span style="padding: 1px 6px; border-radius: 3px; font-size: 11px; border: 1px solid #3c3c3c; color: #9d9d9d;">{{t.category}}</span>
              </div>
            </div>
          </a>
        </sc-for>
      </div>
      <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
        <div style="padding: 24px 0 40px; color: #9d9d9d;">No templates match these filters.</div>
      </sc-if>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { category: 'All', source: 'all' };
  }
  renderVals() {
    const all = [
      { name: 'IEEE Conference', by: 'IEEEtran · LabShelf Community', format: 'LaTeX', engine: 'pdfLaTeX', category: 'Article', source: 'community', kind: 'twocol', installed: true },
      { name: 'ACM Primary Article', by: 'acmart · LabShelf Community', format: 'LaTeX', engine: 'pdfLaTeX', category: 'Article', source: 'community', kind: 'twocol' },
      { name: 'Springer LNCS', by: 'llncs · LabShelf Community', format: 'LaTeX', engine: 'pdfLaTeX', category: 'Article', source: 'community', kind: 'single' },
      { name: 'charged-ieee', by: 'Typst Universe', format: 'Typst', engine: 'Typst', category: 'Article', source: 'typst', kind: 'twocol' },
      { name: 'Research Poster A0', by: 'tikzposter · LabShelf Community', format: 'LaTeX', engine: 'LuaLaTeX', category: 'Poster', source: 'community', kind: 'poster' },
      { name: 'Metropolis Slides', by: 'beamer · LabShelf Community', format: 'LaTeX', engine: 'XeLaTeX', category: 'Slides', source: 'community', kind: 'slides' },
      { name: 'Thesis (abnTeX2)', by: 'abntex2 · LabShelf Community', format: 'LaTeX', engine: 'pdfLaTeX', category: 'Thesis', source: 'community', kind: 'single' },
      { name: 'Lab report', by: 'My templates · on Drive', format: 'Typst', engine: 'Typst', category: 'Article', source: 'mine', kind: 'single', installed: true },
    ];
    const { category, source } = this.state;
    const cards = all
      .filter((t) => (category === 'All' || t.category === category) && (source === 'all' || t.source === source))
      .map((t) => ({ ...t, isTwocol: t.kind === 'twocol', isSingle: t.kind === 'single', isPoster: t.kind === 'poster', isSlides: t.kind === 'slides' }));
    const chipBase = 'height: 24px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 12px; cursor: pointer; ';
    const chips = ['All', 'Article', 'Thesis', 'Poster', 'Slides', 'CV'].map((label) => ({
      label,
      pick: () => this.setState({ category: label }),
      style: chipBase + (label === category
        ? 'background: #04395e; color: #ffffff; border: 1px solid #0078d4;'
        : 'background: transparent; color: #cccccc; border: 1px solid #3c3c3c;'),
    }));
    const rowBase = 'display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 16px; border: 0; font: inherit; cursor: pointer; ';
    const sources = [
      { id: 'all', label: 'All sources', dot: '#9d9d9d' },
      { id: 'community', label: 'LabShelf Community', dot: '#3794ff' },
      { id: 'typst', label: 'Typst Universe', dot: '#4ec994' },
      { id: 'mine', label: 'My templates', dot: '#e5c07b' },
    ].map((s) => ({
      ...s,
      pick: () => this.setState({ source: s.id }),
      style: rowBase + (s.id === source ? 'background: #04395e; color: #ffffff;' : 'background: transparent; color: #cccccc;'),
    }));
    return { cards, chips, sources, empty: cards.length === 0 };
  }
}
</script>
</body>
</html>
