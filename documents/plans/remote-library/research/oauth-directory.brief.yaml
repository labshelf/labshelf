risks:
  - "Client id 6bf60d8231e753c5249c7044aa0c4aff; scopes hard-coded incl. offline_access and workers-scripts.admin; a narrower request (user-details.read) should be accepted as a subset (not verified live)."
  - "Only redirect registered: http://127.0.0.1:8976/callback. Adding https://labshelf.org/open/callback is a manual dashboard step by the client owner; multi-redirect support not documented."
  - "BLOCKER: token endpoint has no CORS allow-origin -> exchange must be proxied by the labshelf.org Worker (no secret needed, method none)."
  - "BLOCKER: api.cloudflare.com from a page not CORS-allowed (unverified) -> token check must run in a Worker."
  - "No CSP on labshelf.org today."
  - "Directory maps email -> inboxUrl only for users registered via invitations; others get unauthorized. Error-code decision for self lookup."
  - "Self lookup leaks the random relay URL to any holder of a user-details.read token; rate-limit, never return inboxToken."
  - "Relay Worker has no owner-email check nor owner email stored; needs a secret and a Worker version bump."
  - "Page keeps token in memory only, no offline_access."
