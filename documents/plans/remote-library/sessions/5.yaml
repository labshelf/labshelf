schema: session/v1
id: "5"
goal: "The /open/ page: sign-in with PKCE, session and read client, the remote library as a read-only library UI with notes, sources and decks, page shell and build entry."
depends_on:
  - "1"
  - "2"
owns:
  - website/open/
  - website/src/open.ts
  - website/src/open/
  - website/build/build.mjs
  - website/__tests__/open/
status: pending
packages:
  - plan: remote-library
    sha: e654e5954
    id: "5.1"
    goal: 'The /open/ sign-in and read client: Authorization Code + PKCE with in-memory token, directory self lookup, mirror session, index and file reads, and the "off" and "another account" states.'
    level: behaviour
    runner: &a1
      agent: implementer
      model: sonnet
    edit: []
    create:
      - website/src/open/index.ts
      - website/src/open/signIn.ts
      - website/src/open/remoteClient.ts
    read:
      - path: packages/core/src/relay/relayOAuth.ts
        lines: 8-90
        why: startCloudflareAuthorization / fetchCloudflareTokens with redirect, scopes and tokenUrl (from 2.3)
      - path: packages/core/src/share/directoryClient.ts
        lines: 36-120
        why: DirectoryClient.self (from 2.3)
      - path: website/src/share.ts
        lines: 1-140
        why: entry shape and hashchange handling
      - path: documents/contracts/remote-library.md
        lines: 1-200
        why: routes and error codes
    seams:
      - path: website/src/open/signIn.ts
        signature: |-
          export function beginSignIn(env: { storage: Storage; location: Location }): Promise<void>
          export function finishSignIn(env: { storage: Storage; location: Location; fetch: typeof fetch }): Promise<string | undefined>  // the access token, held by the caller in memory only
      - path: website/src/open/remoteClient.ts
        signature: |-
          export type OpenState = { kind: "ready"; client: RemoteLibraryClient } | { kind: "off" } | { kind: "other_account" } | { kind: "not_registered" } | { kind: "failed"; message: string }
          export interface RemoteLibraryClient { index(): Promise<{ path: string; kind: string; size: number; updated: number }[]>; file(path: string): Promise<string> }
          export function openRemoteLibrary(accessToken: string, deps: { fetch: typeof fetch }): Promise<OpenState>
    decided:
      - "D7: PKCE verifier and state are written to sessionStorage only for the redirect and deleted on return; the access token is never written anywhere; no offline_access."
      - "D6/D5: openRemoteLibrary asks POST /api/directory/self for the relay URL, then POST <relay>/mirror/session with the token; off, other_account and not_registered map to their states; the session token lives in the client closure only."
      - 'D11: the page strings are exactly "Remote access is off" and "This LabShelf belongs to another Cloudflare account".'
      - "The /open/ return is handled before any hashchange reload: the entry removes the code and state from the URL after the exchange."
    acceptance:
      - id: 5.1a
        check: beginSignIn stores verifier and state in sessionStorage and redirects to the consent URL for https://labshelf.org/open/ with scope user-details.read only
      - id: 5.1b
        check: finishSignIn exchanges the code (through /api/oauth/token), deletes verifier and state, and refuses a state mismatch; the token appears in no storage
      - id: 5.1c
        check: openRemoteLibrary maps the relay's off, other_account answers and a directory not_found to the three states and returns a client that reads the index and files with the session token
    tests:
      hidden:
        - documents/plans/remote-library/tests/5.1/website/__tests__/open/signIn.test.ts
        - documents/plans/remote-library/tests/5.1/website/__tests__/open/remoteClient.test.ts
      command: node scripts/agents/run.mjs test website --spec 5.1 --plan remote-library -- website/__tests__/open/signIn.test.ts website/__tests__/open/remoteClient.test.ts
  - plan: remote-library
    sha: e654e5954
    id: "5.2"
    goal: "The remote library as a read-only library UI: a snapshot built from the mirror index, a host that serves notes, sources and decks lazily, and no Download PDF."
    level: behaviour
    runner: *a1
    depends_on:
      - "5.1"
    edit:
      - path: website/src/open/index.ts
        lines: 1-40
        why: export the library view
    create:
      - website/src/open/openLibrary.ts
      - website/src/open/openHost.ts
      - website/src/open/sourceView.ts
    read:
      - path: website/src/share/shareHost.ts
        lines: 1-89
        why: "attachShareHost: in-memory host answering UiToHost"
      - path: website/src/share/shareLibrary.ts
        lines: 1-50
        why: snapshot builder with isSafeSegment
      - path: website/src/share/deckView.ts
        lines: 1-22
        why: lazy deck wrapper
      - path: packages/core/src/decks/dom/deckSourceView.ts
        lines: 1-12
        why: read-only CodeMirror pattern
      - path: packages/core/src/share/dom/deckShareViewer.ts
        lines: 1-34
        why: mountDeckShareViewer
      - path: packages/core/src/libraryUi/dom/detailPane/detailTabs.ts
        lines: 100-125
        why: openNotes message the host handles
    seams:
      - path: website/src/open/openLibrary.ts
        signature: |-
          export interface RemoteIndex { version: 1; folders: string[]; papers: { id: string; folder: string; record: PaperRecord }[] }
          export function buildRemoteSnapshot(papersIndex: RemoteIndex, rows: { path: string; kind: string }[]): { snapshot: LibrarySnapshot; notePathOf(paperId: string): string | undefined; projects: { name: string; files: string[] }[]; decks: string[] }
          export function remotePathFor(library: ReturnType<typeof buildRemoteSnapshot>, request: { kind: "notes"; paperId: string } | { kind: "source"; project: string; file: string }): string | undefined
      - path: website/src/open/openHost.ts
        signature: "export function attachOpenHost(options: { client: RemoteLibraryClient; library: ReturnType<typeof buildRemoteSnapshot>; endpoint: HostEndpoint }): () => void"
    decided:
      - "D11: mountLibraryUi with readOnly: true and in-memory prefs; notes via mountQmdEditor({readOnly: true}) and sources in a read-only CodeMirror, both imported lazily (never through the @labshelf/core/sourceEditor barrel); decks in mountDeckShareViewer with sandbox allow-scripts only."
      - "D2/D11: no PDF is requested or offered; there is no Download PDF action; a path with an unsafe segment is dropped (isSafeSegment)."
      - "D16 is the format. notePathOf answers the notes row path (papers/<folder>/<id>/notes.qmd, papers/<id>/notes.qmd at the root) only when that row is in rows, else undefined. projects lists each project name with files = the source rows' paths relative to projects/<name>/, sorted; decks lists the deck rows' full paths, sorted. Rows of other kinds are ignored. A paper whose id or folder has an unsafe segment (isSafeSegment) is dropped alone; a row with an unsafe segment is dropped. No paper has a pdf (hasPdf false, no pdf paths) and no .pdf path appears."
      - "remotePathFor answers the row path a notes or source request reads (notes: notePathOf; source: projects/<project>/<file> when listed), else undefined; never a .pdf path."
      - "attachOpenHost answers UiToHost on the given HostEndpoint as attachShareHost does, reads files with client.file(remotePathFor(...)) and returns its unsubscribe; it is checked by hand (A2, A3), not by tests."
    acceptance:
      - id: 5.2a
        check: buildRemoteSnapshot lists papers with folders, tags and status from index/papers.json and finds each paper's notes row; unsafe segments are dropped
      - id: 5.2b
        check: It lists the projects' source files and the decks from the row list, and no pdf appears anywhere in the snapshot
      - id: 5.2c
        check: remotePathFor answers the notes and source row paths, undefined for an unknown paper, project or file, and never a .pdf path
    tests:
      hidden:
        - documents/plans/remote-library/tests/5.2/website/__tests__/open/openLibrary.test.ts
      command: node scripts/agents/run.mjs test website --spec 5.2 --plan remote-library -- website/__tests__/open/openLibrary.test.ts
  - plan: remote-library
    sha: e654e5954
    id: "5.3"
    goal: The page shell website/open/index.html, the entry website/src/open.ts, states, Sign out and the build entry.
    level: behaviour
    runner: *a1
    depends_on:
      - "5.2"
    edit:
      - path: website/build/build.mjs
        lines: 47-61
        why: add the open entry from src/open.ts
      - path: website/src/open/index.ts
        lines: 1-60
        why: export what the entry uses
    create:
      - website/open/index.html
      - website/src/open.ts
    read:
      - path: website/s/index.html
        lines: 1-20
        why: share page shell template
      - path: website/src/share.ts
        lines: 1-140
        why: entry, showLibrary 66-85, lazy deck view 101-128
      - path: website/src/share/shareStates.ts
        lines: 1-60
        why: loading and error screens
      - path: website/src/share/shareStyles.ts
        lines: 1-28
        why: core CSS as text
    decided:
      - "D11: the page shows Connect to my LabShelf, handles the OAuth return, then the states off, other_account, not_registered and failed, then the read-only library; a Sign out button clears memory and reminds the user to sign out of Cloudflare or to use a private window."
      - "D7: nothing is persisted: the token lives in memory only; sessionStorage holds the PKCE verifier and state only during the redirect."
      - No CSP exists on the website today; the deck frame keeps sandbox allow-scripts only.
    acceptance:
      - id: 5.3a
        check: pnpm build website produces dist/open with the entry, and typecheck website passes
      - id: 5.3b
        check: The page shows Connect to my LabShelf first, the exact off and other-account texts, a Sign out button and no Download PDF
    tests:
      none: page layout and glue; the logic is tested in 5.1 and 5.2
    commands:
      - node scripts/agents/run.mjs typecheck website
      - node scripts/agents/run.mjs build website
