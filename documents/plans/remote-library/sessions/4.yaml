packages:
  - plan: remote-library
    sha: e654e5954
    id: "4.1"
    goal: "Core Remote access switch logic: turn on (owner email from /user, PUT /mirror/owner, directory registration when missing, first sync), turn off (delete the Mirror's rows)."
    level: behaviour
    runner: &a1
      agent: implementer
      model: sonnet
    edit:
      - path: packages/core/src/remoteLibrary/index.ts
        lines: 1-50
        why: export remoteAccess
    create:
      - packages/core/src/remoteLibrary/remoteAccess.ts
    read:
      - path: packages/core/src/share/invitations.ts
        lines: 100-200
        why: createContext and the registration used by Receive invitations by email
      - path: packages/core/src/share/directoryClient.ts
        lines: 36-120
        why: DirectoryClient incl. self() from 2.3
      - path: packages/core/src/relay/relayAccountStore.ts
        lines: 13-97
        why: RelayAccount fields
      - path: packages/core/src/remoteLibrary/mirrorRunner.ts
        lines: 1-80
        why: runner from 3.3
    seams:
      - path: packages/core/src/remoteLibrary/remoteAccess.ts
        signature: |-
          export type RemoteAccessResult = { ok: true } | { ok: false; reason: "needs_sign_in" | "no_relay" | "failed"; message: string }
          export function createRemoteAccess(deps: { readEmail(): Promise<string | undefined>; relay: MirrorRelay; directory: { self(): Promise<string | undefined>; register(): Promise<void> }; runner: { run(): Promise<MirrorRunResult> }; state: MirrorStateStore }): { turnOn(): Promise<RemoteAccessResult>; turnOff(): Promise<RemoteAccessResult> }
    decided:
      - "D4: readEmail reads GET /client/v4/user with the app's OAuth token; a pasted token without user-details access (undefined) yields needs_sign_in with the text \"Remote access needs Cloudflare sign-in\" and the switch stays off."
      - 'D6: turnOn registers the directory row only when directory.self() answers undefined, through the same registration "Receive invitations by email" uses (the caller injects it as directory.register).'
      - "D12: turnOn sends the owner email, then runs the first sync; turnOff calls relay.clear and state.clear. The persisted on/off flag lives in the app (4.2 and 4.3)."
      - The injected directory.register adapts the existing invitations registration; if no exported function can be reused, report status missing with the gap instead of writing a second registration.
    acceptance:
      - id: 4.1a
        check: turnOn with an email puts the owner, registers the directory when self() answers undefined, skips registration when it answers a URL, then runs the sync
      - id: 4.1b
        check: turnOn without an email answers needs_sign_in with the text "Remote access needs Cloudflare sign-in" and calls nothing else
      - id: 4.1c
        check: turnOff clears the relay's rows and the local table
    tests:
      hidden:
        - documents/plans/remote-library/tests/4.1/packages/core/__tests__/remoteLibrary/remoteAccess.test.ts
      command: node scripts/agents/run.mjs test core --spec 4.1 --plan remote-library -- packages/core/__tests__/remoteLibrary/remoteAccess.test.ts
  - plan: remote-library
    sha: ad0e533fb
    id: "4.2"
    goal: "VS Code: the Account tab's Remote access switch over createRemoteAccess, the stored flag, the file-backed state, the 30 s debounced trigger after the external-change batch and on start; the share host uses the core deck reader."
    level: contract
    runner: *a1
    depends_on:
      - "4.1"
    edit:
      - path: packages/vscode/src/account/accountPanel.ts
        lines: 1-120
        why: AccountDesktop gains remoteAccess; the source passes it as host.remoteAccess
      - path: packages/vscode/src/collab/node/register.ts
        lines: 325-350
        why: provideAccountDesktop passes the remote wiring
      - path: packages/vscode/src/relay/node/index.ts
        lines: 1-30
        why: export the remote wiring
      - path: packages/vscode/src/activation/externalChangeHandling.ts
        lines: 33-100
        why: trigger the mirror after processBatch
      - path: packages/vscode/src/share/node/host.ts
        lines: 27-145
        why: relay account access; exportDeck uses exportDeckFromFiles
    create:
      - packages/vscode/src/relay/node/remoteLibrary.ts
    read:
      - path: packages/vscode/src/relay/node/register.ts
        lines: 1-80
        why: relay registration and the account store
      - path: packages/vscode/src/relay/node/accounts.ts
        lines: 11-31
        why: token storage
      - path: packages/core/src/remoteLibrary/remoteAccess.ts
        lines: 1-60
        why: turnOn / turnOff
    callers:
      - symbol: exportDeck
        path: packages/vscode/src/share/node/host.ts
        lines: 88-102
    seams:
      - path: packages/vscode/src/relay/node/remoteLibrary.ts
        signature: |-
          export function createDesktopRemoteAccess(deps: { flag: { read(): boolean; write(on: boolean): Promise<void> }; access: { turnOn(): Promise<RemoteAccessResult>; turnOff(): Promise<RemoteAccessResult> } }): AccountRemote
          export function createMirrorTrigger(deps: { isOn(): boolean; run(): Promise<unknown>; delayMs?: number; setTimer?: (fn: () => void, ms: number) => unknown; clearTimer?: (handle: unknown) => void }): { changed(): void; start(): void; dispose(): void }
    decided:
      - "D12: the switch is only in the Account tab; no command palette entry and no package.json change. Off by default; the on flag is stored in the extension's global state keyed by library; turning it off deletes the Mirror's rows."
      - "D14: AccountDesktop.remoteAccess is an AccountRemote whose set() calls turnOn / turnOff and maps a needs_sign_in result to its message; with no library open it is undefined."
      - "D9: the mirror runs on start and 30 s after the last external-change batch (debounced), never while a run is in progress; the state file is state/<library key>/mirror.json (createFileMirrorStateStore)."
      - "D13: the exportDeck in host.ts calls exportDeckFromFiles; no duplicate read remains."
      - Skipping a run when the switch is off or no relay is connected is silent.
      - "createDesktopRemoteAccess: read() answers { on: flag.read() }; set(true) calls access.turnOn() and writes the flag true only on ok; set(false) calls access.turnOff() and writes false on ok; a failed result answers { ok: false, message } and leaves the flag as it was."
      - "createMirrorTrigger: changed() (re)starts a delayMs timer (default 30000); when it fires and isOn() is true, run() is called; start() runs at once when isOn(); a changed() while a run is in progress schedules exactly one more run after it ends; dispose() clears the timer. AccountRemote and RemoteAccessResult come from @labshelf/core (7.1, 4.1)."
      - "4.2c (checked by the existing tests and the hand check, not by a hidden test): host.ts exportDeck uses the core reader and the existing share tests still pass (no new test)"
    acceptance:
      - id: 4.2a
        check: createDesktopRemoteAccess turns on and off through the access, writes the flag only on success, and answers a needs_sign_in failure with its message and the flag unchanged
      - id: 4.2b
        check: createMirrorTrigger runs once 30 s after the last of several changed() calls, never when isOn() is false, and once more after a run that overlapped a change
    tests:
      hidden:
        - documents/plans/remote-library/tests/4.2/packages/vscode/__tests__/relay/node/remoteLibrary.test.ts
      command: node scripts/agents/run.mjs test vscode --spec 4.2 --plan remote-library -- packages/vscode/__tests__/relay/node/remoteLibrary.test.ts
    commands:
      - node scripts/agents/run.mjs typecheck vscode
