  - plan: remote-library
    sha: e654e5954
    id: "2.2"
    goal: The website Worker answers POST /api/directory/self (the caller's own relay URL) and POST /api/oauth/token as a code-exchange proxy.
    level: contract
    runner: &a1
      agent: implementer
      model: opus
    depends_on:
      - "2.1"
    edit:
      - path: website/src/directory/index.ts
        lines: 52-58
        why: CORS constant for the new routes
      - path: website/src/directory/index.ts
        lines: 219-232
        why: ROUTES and ROUTE_WRITES, switch in handleDirectoryRequest
    create:
      - website/src/directory/self.ts
      - website/src/directory/oauthToken.ts
    read:
      - path: website/src/directory/index.ts
        lines: 84-100
        why: "callerEmail: token to /user to email"
      - path: website/src/directory/index.ts
        lines: 150-175
        why: sender() model for a handler with its own counter
    seams:
      - path: website/src/directory/self.ts
        signature: "export async function self(request: Request, env: DirectoryEnv, deps: DirectoryDeps, now: number): Promise<Response>"
      - path: website/src/directory/oauthToken.ts
        signature: "export async function proxyOauthToken(request: Request, deps: DirectoryDeps): Promise<Response>"
    decided:
      - "D6: /self answers {relayUrl} only; never inboxToken, keys or another user's row; not_found when the email is not registered; rate_limited by its own per-caller and daily counters."
      - "D7: the proxy accepts only grant_type authorization_code for the registered client id and redirect https://labshelf.org/open/, forwards the form to the Cloudflare token endpoint and returns its status and JSON; it logs nothing."
      - "The proxy is always built: documents/plans/browser-sharing-parity/research/feasibility.md found the token endpoint sends no Access-Control-Allow-Origin."
    acceptance:
      - id: 2.2a
        check: /self with a valid token for a registered email answers {relayUrl}; the body never contains inboxToken, encryptionKey or signingKey
      - id: 2.2b
        check: /self answers unauthorized for a refused token and not_found for an unregistered email; past its limit rate_limited
      - id: 2.2c
        check: The proxy forwards a code exchange for the registered client and refuses any other grant, client or redirect
      - id: 2.2d
        check: OPTIONS on both routes answers the CORS preflight
    tests:
      hidden:
        - documents/plans/remote-library/tests/2.2/website/__tests__/directory/self.test.ts
        - documents/plans/remote-library/tests/2.2/website/__tests__/directory/oauthToken.test.ts
      command: node scripts/agents/run.mjs test website --spec 2.2 --plan remote-library -- website/__tests__/directory/self.test.ts website/__tests__/directory/oauthToken.test.ts
  - plan: remote-library
    sha: e654e5954
    id: "2.3"
    goal: Core OAuth helpers take a redirect and scopes, and the directory client gains a self lookup.
    level: contract
    runner: *a1
    depends_on:
      - "2.1"
    edit:
      - path: packages/core/src/relay/relayOAuth.ts
        lines: 8-90
        why: startCloudflareAuthorization and fetchCloudflareTokens take optional redirectUri and scopes, and an optional tokenUrl for the proxy; defaults keep the desktop and browser behaviour
      - path: packages/core/src/share/directoryClient.ts
        lines: 36-120
        why: "self(): the caller's own relay URL"
    callers:
      - symbol: startCloudflareAuthorization
        path: packages/vscode/src/relay/node/connect.ts
        lines: 60-100
      - symbol: startCloudflareAuthorization
        path: packages/browser/src/relay/account.ts
        lines: 1-120
      - symbol: createDirectoryClient
        path: packages/core/src/share/invitations.ts
        lines: 100-200
    decided:
      - "Existing exports change, so there is no new seam: DirectoryClient (packages/core/src/share/directoryClient.ts) gains self(): Promise<string | undefined>, the caller's own relay URL, undefined on not_found."
      - "startCloudflareAuthorization gains optional redirectUri and scopes, and fetchCloudflareTokens gains optional redirectUri and tokenUrl inside its existing options object (packages/core/src/relay/relayOAuth.ts); calls with no options behave as before."
      - "D7: the page uses redirect https://labshelf.org/open/ and scope user-details.read only (no offline_access); desktop and browser extension calls pass nothing and keep the loopback redirect and the full scope list."
      - "D6: DirectoryClient.self posts to /api/directory/self with the bearer token and answers the relayUrl, undefined for not_found; other errors throw DirectoryError like the other calls."
      - Existing callers need no change when defaults are kept; any signature change updates every caller in this package.
    acceptance:
      - id: 2.3a
        check: With no options the authorization URL and the token request equal today's (loopback redirect, full scopes)
      - id: 2.3b
        check: With redirectUri and scopes the consent URL carries exactly those and omits offline_access when not given; the token exchange sends the same redirect and can target a tokenUrl
      - id: 2.3c
        check: DirectoryClient.self returns the relay URL, undefined on not_found and throws DirectoryError for unauthorized and rate_limited
    tests:
      hidden:
        - documents/plans/remote-library/tests/2.3/packages/core/__tests__/relay/relayOAuth.test.ts
        - documents/plans/remote-library/tests/2.3/packages/core/__tests__/share/directoryClient.test.ts
      command: node scripts/agents/run.mjs test core --spec 2.3 --plan remote-library -- packages/core/__tests__/relay/relayOAuth.test.ts packages/core/__tests__/share/directoryClient.test.ts
