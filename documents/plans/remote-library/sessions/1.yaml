packages:
  - plan: remote-library
    sha: e654e5954
    id: "1.1"
    goal: documents/contracts/remote-library.md states the mirror (D1-D3, D5, D8, D12) and relay.md gains the Mirror endpoints, the session auth, the version bump and the three-DO deploy.
    level: task
    runner:
      agent: main
      model: opus
    edit:
      - path: documents/contracts/relay.md
        lines: 1-87
        why: "#versions (minor bump), #auth (session token), #endpoints (/mirror/*), #deploy (three DOs: Room, Inbox, Mirror; migration v3)"
    create:
      - documents/contracts/remote-library.md
    decided:
      - Present tense; fetch and edit only those sections with node scripts/docs/doc.mjs.
      - "D3 is stated plainly: plaintext in the owner's own Cloudflare account, protected by their Cloudflare login; recommend Cloudflare two-factor."
      - "Row paths (library-relative, the Mirror's keys): index/papers.json (kind papers; the paper index and folder tree), papers/<folders>/<id>/notes.qmd (kind notes), projects/<project>/<file> for .tex .typ .bib .qmd and project notes (kind source), and a deck's own deck.html path (kind deck; the value is its single-file HTML from exportDeckHtml)."
      - "Routes (D1, D4, D5, D8, D12): PUT /mirror/owner {email} (owner secret); POST /mirror/lease {deviceId, action: acquire|renew|release} (owner secret; answers {held}; 10 minute expiry); POST /mirror/rows {put: [{path, kind, hash, size, value}], delete: [path]} (owner secret; under 1 MiB a request); DELETE /mirror/rows clears every row and the owner email (owner secret; the switch turned off); POST /mirror/session {accessToken} answers {session, expires} or {error: off|other_account|unauthorized|rateLimited}; GET /mirror/index lists [{path, kind, hash, size, updated}] and GET /mirror/file/<path> returns the value, both with Authorization: Bearer <session>. A value over 2 MB is stored in chunks and returned whole."
      - A Worker with no owner email answers /mirror/session with off, so a different Cloudflare account and a switched-off library both see no data; only a stored owner email that differs answers other_account.
    acceptance:
      - id: 1.1a
        check: remote-library.md and relay.md state D1, D2, D3, D5, D8 and D12 with the route table, row path layout and error codes above
      - id: 1.1b
        check: node scripts/docs/doc.mjs resolves the new anchors, and the relay.md version section names the new minor
    tests:
      none: docs
  - plan: remote-library
    sha: e654e5954
    id: "1.2"
    goal: "The Mirror Durable Object (SQLite): owner email, writer lease, rows with chunking over 2 MB, index listing and file read; migration v3 registers it."
    level: contract
    runner: &a1
      agent: implementer
      model: opus
    depends_on:
      - "1.1"
    edit:
      - path: packages/core/src/relay/worker/index.ts
        lines: 1-14
        why: export Mirror
      - path: packages/core/src/relay/worker/cloudflareRuntime.ts
        lines: 48-58
        why: RelayEnv gains the MIRROR namespace
      - path: packages/core/src/relay/relayPaths.ts
        lines: 33-48
        why: "append { tag: v3, new_sqlite_classes: [Mirror] } to RELAY_MIGRATIONS"
    create:
      - packages/core/src/relay/worker/mirror.ts
    read:
      - path: packages/core/src/relay/worker/inbox.ts
        lines: 1-108
        why: "template for a SQLite DO: schema in the constructor, fetch dispatch, limits with CONTRACT comments"
      - path: packages/core/src/relay/worker/room.ts
        lines: 1-30
        why: 2 MB SQLite row limit; chunking precedent
      - path: documents/contracts/remote-library.md
        lines: 1-200
        why: route table and row layout from 1.1
    callers:
      - symbol: fakeRoomRuntime
        path: packages/core/__tests__/relay/worker/fakeRoomRuntime.ts
        lines: 1-200
    seams:
      - path: packages/core/src/relay/worker/mirror.ts
        signature: "export class Mirror { constructor(state: DurableObjectState); fetch(request: Request): Promise<Response> }"
      - path: packages/core/src/relay/relayPaths.ts
        signature: 'RELAY_MIGRATIONS gains { tag: "v3", new_sqlite_classes: ["Mirror"] } after v2'
    decided:
      - "D1: SQLite-backed Mirror DO, one singleton (idFromName) per Worker; rows keyed by library-relative path with {hash, size, kind, updated}; a value over 2 MB is split into chunks and read back whole."
      - "D8: the lease holds {deviceId, expires}; acquire by another device while unexpired answers held: false; renew and release by the holder; expires 10 minutes after the last acquire or renew."
      - "D4/D12: the owner email is stored by the owner route; clear removes every row and the owner email. The DO trusts its caller: the owner secret and session checks are in session 1.3's routes, not in the DO."
      - "Internal DO paths: PUT /owner, GET /owner, POST /lease, POST /rows, DELETE /rows, GET /index, GET /file?path=."
    acceptance:
      - id: 1.2a
        check: Putting rows then GET /index lists their path, kind, hash, size and updated; a delete list removes rows
      - id: 1.2b
        check: A 5 MB value is stored in chunks and GET /file returns it byte for byte; a replaced value leaves no stale chunk
      - id: 1.2c
        check: "Lease: a second device is refused while the first holds it, accepted after 10 minutes; renew and release only by the holder"
      - id: 1.2d
        check: Owner email set, read and cleared; DELETE /rows removes all rows and the email
      - id: 1.2e
        check: RELAY_MIGRATIONS ends with v3 creating Mirror after v1 and v2 unchanged
    tests:
      hidden:
        - documents/plans/remote-library/tests/1.2/packages/core/__tests__/relay/worker/mirror.test.ts
      command: node scripts/agents/run.mjs test core --spec 1.2 --plan remote-library -- packages/core/__tests__/relay/worker/mirror.test.ts
  - plan: remote-library
    sha: e654e5954
    id: "1.3"
    goal: The relay routes /mirror/* with owner-secret writes and session-token reads, the MIRROR binding at deploy and the protocol minor bump so Workers update.
    level: contract
    runner: *a1
    depends_on:
      - "1.2"
    edit:
      - path: packages/core/src/relay/worker/answerRelayRequest.ts
        lines: 16-78
        why: checkOwnerSecret precedent
      - path: packages/core/src/relay/worker/answerRelayRequest.ts
        lines: 284-299
        why: "route table: add /mirror/* routes"
      - path: packages/core/src/relay/relayPaths.ts
        lines: 4-11
        why: RELAY_PATH.mirror entries and refusals off, otherAccount
      - path: packages/core/src/relay/relayDeploy.ts
        lines: 33-47
        why: bind MIRROR (class Mirror) with ROOM and INBOX
      - path: packages/core/src/relay/protocolVersion.ts
        lines: 4-8
        why: bump RELAY_PROTOCOL_MINOR so deployed Workers are offered the update
    create:
      - packages/core/src/relay/worker/mirrorRoutes.ts
    read:
      - path: website/src/directory/index.ts
        lines: 84-110
        why: "callerEmail precedent: token to /client/v4/user to email; the relay needs its own copy"
      - path: packages/core/src/relay/worker/inbox.ts
        lines: 1-108
        why: route to a singleton DO
      - path: documents/contracts/remote-library.md
        lines: 1-200
        why: route table, error codes
    seams:
      - path: packages/core/src/relay/worker/mirrorRoutes.ts
        signature: "export function answerMirrorRequest(request: Request, env: RelayEnv, deps: { fetch: typeof fetch; now(): number }): Promise<Response | undefined>"
    decided:
      - "D5: POST /mirror/session {accessToken}: the Worker calls GET https://api.cloudflare.com/client/v4/user once with the token, discards it, compares the email case-insensitively with the stored owner email and answers {session, expires} where session is an HMAC of {exp} with OWNER_SECRET (4 hours); no owner email answers off, a different email other_account, a refused token unauthorized. Rate-limited per Worker (a per-hour counter in the Mirror)."
      - Writes (/mirror/owner, /mirror/lease, /mirror/rows) need the owner secret through the existing checkOwnerSecret; reads (/mirror/index, /mirror/file/<path>) need a valid unexpired session token.
      - A POST /mirror/rows body over 1 MiB is refused tooLarge (D10); the Worker is CORS * like the other routes and answers OPTIONS.
      - relayDeploy.ts binds the Mirror class as MIRROR; the minor bump (RELAY_PROTOCOL_MINOR and RELAY_WORKER_BUILD follow) makes updateOwnRelay roll the new Worker and its v3 migration out to deployed Workers.
      - Session 1.1's contract text decides names; where this spec and the contract differ, the contract wins and the report says so.
    acceptance:
      - id: 1.3a
        check: PUT /mirror/owner, /mirror/lease and /mirror/rows without the owner secret are refused unauthorized; with it they reach the Mirror
      - id: 1.3b
        check: POST /mirror/session answers a session for the owner email (case-insensitive), off when no owner email is stored, other_account for a different email, unauthorized for a refused token; the token is never stored or logged
      - id: 1.3c
        check: GET /mirror/index and /mirror/file/<path> need a valid, unexpired session; an expired or tampered session is refused
      - id: 1.3d
        check: A rows request over 1 MiB is refused tooLarge; /mirror/session is rate-limited
      - id: 1.3e
        check: The deploy metadata binds MIRROR with class Mirror and the protocol minor is higher than before
    tests:
      hidden:
        - documents/plans/remote-library/tests/1.3/packages/core/__tests__/relay/worker/mirrorRoutes.test.ts
      command: node scripts/agents/run.mjs test core --spec 1.3 --plan remote-library -- packages/core/__tests__/relay/worker/mirrorRoutes.test.ts
    commands:
      - node scripts/agents/run.mjs typecheck core
      - node scripts/agents/run.mjs test core -- packages/core/__tests__/relay
