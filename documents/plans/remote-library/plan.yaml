schema: plan/v1
slug: remote-library
title: "Remote library, simple mode: browse your library read-only from labshelf.org/open/"
status: draft
level: N3
goal: "On a computer that is not theirs, the user opens https://labshelf.org/open/, clicks Connect to my LabShelf, signs in with Cloudflare, and browses their library read-only: paper metadata (title, authors, folders, tags, status), paper notes, the text sources of their writing projects (.tex, .typ, .bib, .qmd) and their decks (open and Present). Nothing is installed and nothing stays on that computer. PDFs are never mirrored and nothing can be edited."
decisions:
  - id: D1
    text: "Store: a SQLite-backed Mirror Durable Object in the owner's relay Worker (migration tag v3, new_sqlite_classes), not share Worker KV. Rows are keyed by library-relative path with {hash, size, kind, updated}; a value over the 2 MB row limit is split into chunks."
    why: KV free allows about 1,000 writes a day; a SQLite DO costs only the owner's free plan.
  - id: D2
    text: "Content: the paper index (one row per paper with its metadata record and folder; folder tree), notes.qmd per paper, project text sources (.tex .typ .bib .qmd, project notes), and each deck as its single-file HTML from exportDeckHtml (at most 20 MiB per deck; a deck that fails validation is skipped and reported). Skipped: trashed papers, .labshelf-conflict-* copies, hidden folders, build output, everything in Non-goals."
    why: Read-only browsing needs metadata, notes, sources and decks; PDFs are never mirrored.
  - id: D3
    text: "Security model, accepted by the user: access is protected by the owner's Cloudflare login, like Google Drive. The Mirror stores plaintext inside the owner's own account (Cloudflare encrypts at rest); anyone who signs in to that Cloudflare account can read it. The docs say so plainly and recommend Cloudflare two-factor."
    why: The user accepted this trade for a no-install, no-home-computer read-only view.
  - id: D4
    text: "Owner email: turning Remote access on reads GET /client/v4/user with the app's OAuth token and sends the email to the Mirror with the owner secret (PUT /mirror/owner). A pasted API token without user-details access shows \"Remote access needs Cloudflare sign-in\" and stays off."
    why: The Worker has no owner email today; the page proves identity against it.
  - id: D5
    text: "Page session: the page sends its Cloudflare access token once to POST /mirror/session; the Worker calls /user, compares the email case-insensitively with the stored owner email, discards the token and answers a session token (HMAC with OWNER_SECRET, 4 hours). Reads (GET /mirror/index, GET /mirror/file/<path>) need it. Rate-limited per Worker."
    why: The token is never stored and a session expires without a refresh token.
  - id: D6
    text: "Finding the Worker: a new directory endpoint POST /api/directory/self (bearer Cloudflare token) answers the caller's own relay URL, never the inbox token, rate-limited. Turning on Remote access registers the directory row when it is missing. The directory contract's \"never returned\" rule changes for the row's own owner."
    why: The page on another computer knows only the Cloudflare account, not the random relay name.
  - id: D7
    text: "OAuth on the page: Authorization Code + PKCE with the existing client id, scope user-details.read only (no offline_access). The redirect https://labshelf.org/open/ is added to the Cloudflare OAuth client by hand (session 0). If the token endpoint sends no CORS header, the website Worker proxies the code exchange at POST /api/oauth/token (it holds no secret). The PKCE verifier and state live in sessionStorage only during the redirect and are deleted on return; the token lives in memory only."
    why: Nothing stays on the computer after the tab closes.
  - id: D8
    text: "One writer: the Mirror holds a writer lease (device id, renewed while a sync runs, expires after 10 minutes), so VS Code and the browser never interleave a sync. A device that is not the lease holder skips."
    why: Two devices syncing at once would delete each other's rows.
  - id: D9
    text: "Change detection: VS Code runs the mirror after the external-change batch (debounced 30 s) and on start; the browser runs it on page visible and library.changed. Each run lists the selected files, hashes them, diffs against a device-local hash table (VS Code state/<library key>/mirror.json; browser storage.local), uploads only changed rows in batched requests, then deletes rows that disappeared. The table records the relay URL and resets when it changes."
    why: Cheap runs; rotation or reconnect re-pushes everything.
  - id: D10
    text: "Budget: the free plan's 100,000 daily Worker requests are shared with the relay's abuse rotation. A sync uses batches (many rows per request, under 1 MiB per request) and stops after a per-run cap, resuming next run."
    why: A sync must not push the account toward the rotation thresholds.
  - id: D11
    text: "Page: website/open/ and website/src/open.ts, following the share page: mountLibraryUi with readOnly: true and in-memory prefs; notes with mountQmdEditor({readOnly: true}) loaded lazily; sources in a read-only CodeMirror (as deckSourceView.ts) loaded lazily; decks in mountDeckShareViewer (sandbox allow-scripts only). No Download PDF anywhere. A Sign out button clears memory and reminds the user to sign out of Cloudflare or to use a private window."
    why: Reuses the share page's read-only viewers.
  - id: D12
    text: "Switch: Remote access is off by default, offered beside the Cloudflare connection in VS Code and the browser; turning it off deletes the Mirror's rows."
    why: Publishing a library copy is a privacy choice.
  - id: D13
    text: Deck export reading (deck.html, theme.css, assets) is duplicated in packages/vscode/src/share/node/host.ts:88-102 and packages/browser/src/libraryUi/host/browserShareHost.ts:93-103; it moves to one core helper used by share and mirror.
    why: One reading rule for share and mirror.
acceptance:
  - id: A1
    check: With Remote access on, editing a paper's notes in VS Code shows the new text on /open/ within about a minute of the next sync (checked by hand in session 6)
  - id: A2
    check: On another browser profile, /open/ asks for Cloudflare sign-in, then lists the papers with folders, tags and status, and no PDF button (by hand)
  - id: A3
    check: A project's .tex file opens read-only with highlighting; a talk opens and Present goes full screen (by hand)
  - id: A4
    check: Signing in with a different Cloudflare account shows "This LabShelf belongs to another Cloudflare account" and nothing else (by hand)
  - id: A5
    check: After Sign out or closing the tab, reopening /open/ asks for sign-in again, and the browser's storage for labshelf.org holds no library data (by hand)
  - id: A6
    check: Turning Remote access off makes /open/ show "Remote access is off" after sign-in (by hand)
  - id: A7
    check: A relay rotation followed by the next sync makes /open/ show the library again (by hand)
