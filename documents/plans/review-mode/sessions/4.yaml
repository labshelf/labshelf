        lines: 1-260
        why: "the 4.1 messages: inbound suggestions, init review {mode, author}, outbound addSuggestions/removeSuggestions/reviewMode"
      - path: packages/browser/src/libraryUi/editorArea/sourceTab.ts
        lines: 1-200
        why: "the browser glue from session 3: deps.review, reviewModeDropdown in renderSourceToolbar, setReviewMode, onMode; mirror it"
    decided:
      - Mode in workspaceState under `labshelf.reviewMode.<projectId>`; default editing; read-only panels get neither the dropdown nor review.
      - "The author is the extension's userName() (OS user name, the name a share shows), exposed as `author(): string` on SourceFileSuggestions; the provider sends it in init.review."
      - The webview builds its EditorReview from init.review and a suggestions port in hostPorts.ts (subscribe fed by inbound `suggestions`, add/remove posted as addSuggestions/removeSuggestions); onMode posts reviewMode; the toolbar adds core's reviewModeDropdown as a last group, as the browser's sourceTab does, and calls editor.setReviewMode.
      - The webview code may import core/dom and core/sourceEditor; the extension host side (bridges, provider, collab) may not import core/dom, so it uses the local types in collab/suggestions.ts.
    acceptance:
