schema: session/v1
id: "2"
goal: "The core source editor tracks edits as suggestions in Reviewing, shows them with Accept/Reject, offers the Editing/Reviewing dropdown in its toolbar and keeps them in sync with a host's suggestion port."
depends_on: ["1"]
owns: [packages/core/src/writing/dom/sourceEditor/, packages/core/__tests__/writing/dom/sourceEditor/]
status: pending
packages:
  - id: "2.1"
    plan: review-mode
    sha: 3b1e2389
    goal: "createReviewTracking records the user's edits in Reviewing as tracked changes following D4, and accepts or rejects them."
    level: behaviour
    runner: {agent: implementer, model: opus}
    create: [packages/core/src/writing/dom/sourceEditor/review.ts]
    edit:
      - {path: packages/core/src/writing/dom/sourceEditor/index.ts, lines: "1-15", why: "export the review module"}
    read:
      - {path: documents/plans/review-mode/research/editor.brief.yaml, lines: "1-60", why: "interception map, exemptions, undo"}
      - {path: packages/core/src/writing/dom/sourceEditor/openEditors.ts, lines: "50-60", why: "fromDisk"}
      - {path: packages/core/src/writing/dom/sourceEditor/documentMode.ts, lines: "170-192", why: "transactionExtender pattern"}
      - {path: packages/core/src/collab/dom/editorCollab.ts, lines: "140-170", why: "ySyncAnnotation"}
    seams:
      - {path: packages/core/src/writing/dom/sourceEditor/review.ts, signature: "export type ReviewMode = \"editing\" | \"reviewing\"; export interface TrackedChange { id: string; kind: \"insert\" | \"delete\"; from: number; to: number; text?: string; group?: string; author: string; created: string } export const reviewEdit: AnnotationType<boolean>; export interface ReviewTracking { extension: Extension; setMode(view: EditorView, mode: ReviewMode): void; changes(state: EditorState): readonly TrackedChange[]; load(view: EditorView, changes: readonly TrackedChange[]): void; accept(view: EditorView, ids: readonly string[]): void; reject(view: EditorView, ids: readonly string[]): void } export function createReviewTracking(options: { author(): string; now?(): string; newId?(): string }): ReviewTracking"}
    decided:
      - "Tracked: transactions with isUserEvent input, delete, move (drop) or the reviewEdit annotation. Untracked: fromDisk, Transaction.remote, ySyncAnnotation, isUserEvent undo or redo, and everything in Editing. All changes map through every transaction."
      - "A delete change has from === to and its text; an insert has from < to and no text. A replaced range gives a delete and an insert with the same group."
      - "Typing at either edge of the author's own insert extends it; deleting inside the author's own insert shrinks it and adds no delete; an insert that becomes empty is dropped; deleting across a delete's position merges the texts in document order into one delete."
      - "An undo that inserts exactly a delete's text at its position drops that delete."
      - "reject reverts the text in one transaction annotated so it is not tracked and not in history as a suggestion, then drops the records; accept only drops the records; both expand to every change of the same group."
      - "load replaces all records (used after the store reports); setMode reconfigures a Compartment."
    acceptance:
      - {id: 2.1a, check: "Editing records nothing; Reviewing records typing, deletion and replacement with author and created"}
      - {id: 2.1b, check: "extend, shrink, empty-drop and merge rules hold"}
      - {id: 2.1c, check: "fromDisk, remote, undo and redo transactions are not recorded"}
      - {id: 2.1d, check: "accept and reject of one, of a group and of all give the right text and records"}
      - {id: A2, check: "tracking rules of D4"}
    tests: {none: "behaviour package: the implementer writes the failing tests first in packages/core/__tests__/writing/dom/sourceEditor/review.test.ts"}
    commands: ["node scripts/agents/run.mjs typecheck core", "node scripts/agents/run.mjs test core -- packages/core/__tests__/writing/dom/sourceEditor"]
  - id: "2.2"
