      - {path: packages/core/src/writing/dom/sourceEditor/toolbar.css, lines: "1-80", why: "dropdown button"}
      - {path: packages/core/src/writing/dom/sourceEditor/editorTheme.ts, lines: "1-90", why: "or keep the review theme in reviewView.ts if editorTheme grows past its concept"}
    read:
      - {path: packages/core/src/ui/dom/widgets/menu.ts, lines: "1-60", why: "showMenu, radio MenuItem"}
      - {path: packages/core/src/collab/dom/editorComments.ts, lines: "40-140", why: "gutter, panel and marker patterns"}
    decided:
      - "Read `node scripts/docs/doc.mjs ui` first; tokens only, no new colours: insert background color-mix of --ls-mark-accent at 22%, deletion text in --ls-error with line-through."
      - "Tooltip: author, relative time, Accept (check icon) and Reject (close icon) buttons, keyboard reachable; the panel shows while Reviewing or while the file has changes."
      - "Dropdown items: 'Editing' / 'Edit content directly' and 'Reviewing' / 'Edits become suggestions', pencil icon, checked radio for the current mode."
    acceptance:
      - {id: 2.2a, check: "changes render as marks and widgets; Accept and Reject in the tooltip and panel call accept/reject with the right ids"}
      - {id: 2.2b, check: "the dropdown shows the current mode and calls back with the picked one"}
    tests: {none: "behaviour package: the implementer writes jsdom tests first for the panel buttons and the dropdown callback"}
    commands: ["node scripts/agents/run.mjs typecheck core", "node scripts/agents/run.mjs test core -- packages/core/__tests__/writing/dom/sourceEditor"]
  - id: "2.3"
    plan: review-mode
    sha: 3b1e2389
    goal: "mountSourceEditor takes a review dep (author, mode, suggestion port), loads the file's suggestions, sends new and resolved ones after the save flush in saved-text offsets, and returns setReviewMode."
    level: contract
    runner: {agent: implementer, model: opus}
    depends_on: ["2.2"]
    edit:
      - {path: packages/core/src/writing/dom/sourceEditor/editor.ts, lines: "150-332", why: "SourceEditorDeps.review, extension assembly before hostExtensions, SourceEditor.setReviewMode"}
      - {path: packages/core/src/writing/dom/sourceEditor/formatting.ts, lines: "1-75", why: "tag toolbar inserts and wraps with reviewEdit"}
      - {path: packages/core/src/writing/dom/sourceEditor/index.ts, lines: "1-15", why: "exports"}
    read:
      - {path: packages/core/src/collab/dom/editorComments.ts, lines: "230-275", why: "flush first, then file offsets (docOffsetToFile)"}
    seams:
      - {path: packages/core/src/writing/dom/sourceEditor/review.ts, signature: "export interface FileSuggestion { id: string; kind: \"insert\" | \"delete\"; start: number; end: number; text?: string; group?: string; author: string; created: string } export interface EditorSuggestions { subscribe(listener: (suggestions: readonly FileSuggestion[]) => void): () => void; add(suggestions: readonly FileSuggestion[]): Promise<void>; remove(ids: readonly string[]): Promise<void> } export interface EditorReview { author(): string; mode: ReviewMode; suggestions: EditorSuggestions; onMode?(mode: ReviewMode): void }"}
    decided:
      - "Offsets in FileSuggestion are in the saved file text, CRLF-aware, as comments; a detached suggestion is not sent to the editor."
      - "New and changed tracked changes are sent after each successful save (debounced with it); accept/reject send remove after the save of the reverted text."
      - "Read-only editors get no review extension; without deps.review the editor behaves as today."
    acceptance:
      - {id: 2.3a, check: "with a fake port: reviewing edits reach add after flush with saved offsets; accept and reject reach remove; the port's list loads into the editor"}
      - {id: 2.3b, check: "setReviewMode switches tracking without remounting"}
    tests: {none: "contract package: the implementer writes the failing tests first in packages/core/__tests__/writing/dom/sourceEditor/editorReview.test.ts"}
    commands: ["node scripts/agents/run.mjs typecheck core", "node scripts/agents/run.mjs test core -- packages/core/__tests__/writing/dom/sourceEditor"]
