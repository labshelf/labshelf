      - packages/core/src/reader/textLines.ts
  - id: "1.2"
    plan: dest-preview-crop
    goal: The hover popup of an internal link crops to the target that destTarget finds on the target page, and keeps the band when it finds none.
    level: behaviour
    runner: {agent: implementer, model: sonnet}
    sha: 88bc5ca5
    depends_on: ["1.1"]
    edit:
      - {path: packages/core/src/reader/dom/hoverTarget.ts, lines: "140-215", why: "DestContent: new PageTextCache dependency, classification, region, fallback; a helper reading the text that ends at the link"}
      - {path: packages/core/src/reader/dom/hoverPreview.ts, lines: "100-140", why: "HoverPreview ctor and useText build DestContent; thread the PageTextCache"}
      - {path: packages/core/src/reader/dom/readerUi.ts, lines: "155-210", why: "DocumentText gains pageText: PageTextCache; readText returns it; createWhenIdle and the DOCUMENT_REPLACED handler pass it"}
    read:
      - {path: packages/core/src/reader/dom/hoverTarget.ts, lines: "227-300", why: "DestPreview.render (band) and renderRegion(pageNumber, region)"}
      - {path: packages/core/src/reader/dom/textLayer.ts, lines: "200-265", why: "PageTextCache.get(page): {lines, columnSplit, width, height}"}
      - {path: packages/core/src/reader/geometry.ts, lines: "105-125", why: "deriveFloatRegion(lines, hit, width, height, columnSplit)"}
      - {path: packages/core/src/reader/dom/citations.ts, lines: "62-80", why: "LinkAnnotationData.dest is the named-destination string when the PDF uses names"}
    callers:
      - {symbol: DestContent, path: packages/core/src/reader/dom/hoverPreview.ts, lines: "114-114"}
      - {symbol: DestContent, path: packages/core/src/reader/dom/hoverPreview.ts, lines: "133-133"}
      - {symbol: HoverPreview, path: packages/core/src/reader/dom/readerUi.ts, lines: "192-192"}
      - {symbol: HoverPreview.useText, path: packages/core/src/reader/dom/readerUi.ts, lines: "172-176"}
    decided:
      - "Order in DestContent.prepare is unchanged up to and including the References branch (linkCard first, then reference text). After it, and before the band: target = (typeof dest === 'string' ? classifyDestName(dest) : null) ?? classifyLinkText(text ending at the link). When target and point.y are not null: read pages.get(targetPage); statement → deriveStatementRegion(lines, page, {x: point.x, y: point.y}); float → findFloatCaptionNear(...) then deriveFloatRegion(lines, hit, width, height, columnSplit). A region renders through preview.renderRegion(targetPage, region). Check isCurrent() after every await. Any null (no target, no region, no canvas) or a thrown text extraction falls through to today's preview.render band."
      - "Title: `Page N` as today for statements; for floats with a known label `<Figure|Table|Equation> <LABEL> · Page N` like ReferenceContent.prepareFloat. copyText null; jump unchanged."
      - "Text ending at the link: the `.textLayer` of the link's `.page`; spans `span[role=presentation]` whose bounding box vertical centre is within 0.6 * link height of the link's centre and whose left is < link right - 1; sorted by left, joined with a space; the last 60 characters. A missing text layer gives an empty string."
      - "DestContent takes the PageTextCache as a constructor parameter; HoverPreview gets it in its constructor and in useText(resolver, floats, pageText); readerUi's DocumentText gains `pageText` and both creation sites pass the same instance the resolvers use, so a replaced document never reads the old pages."
    acceptance:
      - {id: 1.2a, check: "typecheck of core passes and the existing reader tests pass"}
      - {id: A1, check: "Hovering a theorem link in a hyperref paper shows only the statement (checked by the user in VS Code)"}
      - {id: A2, check: "Hovering a figure or table link shows the figure and caption only (checked by the user in VS Code)"}
      - {id: A3, check: "Citation links still show reference text; unknown targets still show the band"}
    tests: {none: "DOM glue over pdf.js with no existing test harness; the logic is tested in 1.1 and the visible result is checked by the user by hand"}
    commands:
      - "node scripts/agents/run.mjs typecheck core"
      - "node scripts/agents/run.mjs test core -- packages/core/__tests__/reader"
    do_not_touch:
      - packages/core/src/reader/destTarget.ts
      - packages/core/src/reader/geometry.ts
      - packages/core/src/reader/textLines.ts
