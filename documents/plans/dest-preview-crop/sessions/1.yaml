      command: "node scripts/agents/run.mjs test core --spec 1.1 --plan dest-preview-crop -- packages/core/__tests__/reader/destTarget.test.ts"
    commands:
      - "node scripts/agents/run.mjs typecheck core"
    do_not_touch:
