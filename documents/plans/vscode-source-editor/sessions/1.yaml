schema: session/v1
id: "1"
goal: "The browser's source editor and its CodeMirror pieces live in core (D2) and the browser imports them back with no change in behaviour; no core module reaches browser storage or libraryUi."
depends_on: []
owns:
  - packages/browser/src/writing/
  - packages/browser/src/collab/register.ts
  - packages/browser/src/collab/comments.ts
  - packages/browser/src/collab/index.ts
  - packages/browser/src/libraryUi/editorArea/sourceTab.ts
  - packages/browser/__tests__/writing/
  - packages/core/src/writing/dom/sourceEditor/
  - packages/core/src/collab/dom/
  - packages/core/__tests__/writing/dom/sourceEditor/
status: pending
packages:
  - id: "1.1"
    plan: vscode-source-editor
    sha: f521e273
    goal: "The editor's leaf modules (LaTeX support, Typst support, note gutter, note links, formatting and source updates, open-editor registry) move to packages/core/src/writing/dom/sourceEditor/ and the browser imports them from core."
    level: behaviour
    runner: {agent: implementer, model: sonnet}
    create:
      - packages/core/src/writing/dom/sourceEditor/latex.ts
      - packages/core/src/writing/dom/sourceEditor/typst.ts
      - packages/core/src/writing/dom/sourceEditor/noteGutter.ts
      - packages/core/src/writing/dom/sourceEditor/noteLinks.ts
      - packages/core/src/writing/dom/sourceEditor/formatting.ts
      - packages/core/src/writing/dom/sourceEditor/openEditors.ts
      - packages/core/src/writing/dom/sourceEditor/index.ts
    edit:
      - {path: packages/browser/src/writing/latex.ts, lines: "1-133", why: "moves whole; browser keeps listLibraryCitations only if a browser-only caller needs it"}
      - {path: packages/browser/src/writing/typst.ts, lines: "1-120", why: "moves; openTab becomes a plain callback type instead of Workspace['openTab']; showInOpenEditor comes from openEditors.ts"}
      - {path: packages/browser/src/writing/noteGutter.ts, lines: "1-281", why: "moves whole"}
      - {path: packages/browser/src/writing/noteLinks.ts, lines: "1-372", why: "moves whole"}
      - {path: packages/browser/src/writing/source.ts, lines: "1-240", why: "createSourceUpdates, createFormattingKeymap, deriveSourceLanguage, SourceLanguage, SourceUpdates move to formatting.ts; the tab actions stay"}
      - {path: packages/browser/src/writing/session.ts, lines: "12-110", why: "registerOpenEditor, showInOpenEditor, writeProjectEditors, refreshProjectEditors, fromDisk, loadFromDisk, explicitSaves move to openEditors.ts; the sidebar snapshot stays"}
    read:
      - {path: packages/core/src/qmd/dom/codeCellEditor.ts, lines: "1-60", why: "how core hosts CodeMirror under dom/"}
      - {path: packages/browser/src/writing/index.ts, lines: "1-10", why: "barrel to keep working"}
    callers:
      - {symbol: loadSourceEditor, path: packages/browser/src/writing/session.ts, lines: "31-33"}
    decided:
      - "Use node scripts/codemods/moveFiles.mjs for the whole-file moves (dry run first); split source.ts and session.ts by hand."
      - "Browser-only helpers that the moved files import (if any) become parameters, never imports from browser into core."
      - "Do not move editor.ts here (1.3)."
      - "Before adding any function, check node scripts/code/facts.mjs similar; core/dom already has renderIcon, mountOverlay, pickQuickEntry, showToast."
    acceptance:
      - {id: 1.1a, check: "browser writing tests pass unchanged"}
      - {id: 1.1b, check: "depcruise: no file under packages/core/src reaches packages/browser"}
      - {id: 1.1c, check: "core typecheck and browser typecheck pass"}
    tests: {none: "pure move; the browser's existing writing tests pin the behaviour"}
    commands:
      - "node scripts/agents/run.mjs test browser -- packages/browser/__tests__/writing/"
      - "node scripts/agents/run.mjs typecheck core"
      - "node scripts/agents/run.mjs typecheck browser"
      - "pnpm lint:modules"
  - id: "1.2"
    plan: vscode-source-editor
    sha: f521e273
    goal: "The CodeMirror Yjs binding (createCollabExtensions) and the comment marks, gutter and add panel (createCommentSupport) move to packages/core/src/collab/dom/; the browser's share connection, mirror and comment footer stay in the browser."
    level: behaviour
    runner: {agent: implementer, model: sonnet}
    create:
      - packages/core/src/collab/dom/editorCollab.ts
      - packages/core/src/collab/dom/editorComments.ts
      - packages/core/src/collab/dom/index.ts
    edit:
      - {path: packages/browser/src/collab/register.ts, lines: "233-329", why: "createCollabExtensions, publishSelection, createRemoteCursors move"}
      - {path: packages/browser/src/collab/comments.ts, lines: "1-371", why: "createCommentSupport and EditorComments move; createSourceFooter and ProjectSession come in as parameters"}
      - {path: packages/browser/src/collab/index.ts, lines: "1-40", why: "re-export from core so browser callers keep their imports"}
    read:
      - {path: packages/core/src/collab/presence.ts, lines: "54-70", why: "PresenceStore"}
      - {path: packages/core/src/collab/cursors.ts, lines: "1-80", why: "cursor math already in core"}
    decided:
      - "y-codemirror.next becomes a core dependency only if core does not have it; adding it is the one manifest change of this package."
      - "The footer the comment panel shows is passed in (renderFooter?: (host: HTMLElement) => void); core does not import libraryUi."
      - "createRemoteCursors draws from a PresenceStore and must also accept peers given as plain {name, colour, anchor, head} lists (session 5 feeds it from the VS Code host); add that as a second entry point now, unused by the browser."
    acceptance:
      - {id: 1.2a, check: "browser editorCollab and comment tests pass unchanged"}
      - {id: 1.2b, check: "depcruise: packages/core/src/collab/dom reaches neither browser storage nor libraryUi"}
    tests: {none: "move; editorCollab.test.ts and the comment tests pin the behaviour; the new cursor entry point is tested in session 5"}
    commands:
      - "node scripts/agents/run.mjs test browser -- packages/browser/__tests__/writing/ packages/browser/__tests__/collab/"
      - "pnpm lint:modules"
  - id: "1.3"
    plan: vscode-source-editor
    sha: f521e273
    goal: "editor.ts (mountSourceEditor, SourceEditorDeps, createEditorExtensions, the write scheduler and helper updates) moves to packages/core/src/writing/dom/sourceEditor/editor.ts and the browser's sourceTab mounts it from core."
    level: behaviour
    runner: {agent: implementer, model: sonnet}
    depends_on: ["1.1", "1.2"]
    create:
      - packages/core/src/writing/dom/sourceEditor/editor.ts
    edit:
      - {path: packages/browser/src/writing/editor.ts, lines: "1-391", why: "moves whole"}
      - {path: packages/browser/src/writing/session.ts, lines: "25-40", why: "loadSourceEditor imports from core"}
      - {path: packages/browser/src/libraryUi/editorArea/sourceTab.ts, lines: "51-120", why: "imports from core"}
      - {path: packages/core/src/writing/dom/sourceEditor/index.ts, lines: "1-20", why: "export mountSourceEditor and its types"}
    read:
      - {path: packages/browser/__tests__/writing/editorSave.test.ts, lines: "1-40", why: "tests to repoint"}
    decided:
      - "The browser tests that mount the editor move to packages/core/__tests__/writing/dom/sourceEditor/ with the editor; tests of browser wiring stay."
      - "The editor theme keeps var(--ls-*) only; no new tokens."
    acceptance:
      - {id: 1.3a, check: "the moved editorSave and editorCollab tests pass in core"}
      - {id: 1.3b, check: "browser tests and typecheck pass; the browser build succeeds"}
      - {id: A7, check: "no core module reaches browser storage or libraryUi"}
    tests: {none: "move; the moved tests pin the behaviour"}
    commands:
      - "node scripts/agents/run.mjs test core -- packages/core/__tests__/writing/dom/sourceEditor/"
      - "node scripts/agents/run.mjs test browser"
      - "node scripts/agents/run.mjs build browser"
      - "pnpm lint:modules"
