        signature: 'export function createSourceBridges(deps: { uri: import("vscode").Uri; projectRoot: import("vscode").Uri | undefined; library: unknown; notes: import("@labshelf/core").NoteInsertSource & Pick<import("@labshelf/core").PaperNotesStore, "read">; openNotes(paperId: string): void; logger: import("@labshelf/core").ILogger }): { handle(method: string, params: unknown): Promise<unknown>; problems(): { type: "problems"; problems: { line: number; severity: "error" | "warning" | "info"; message: string }[] } }'
    decided:
      - "The library dep is unknown in the seam; narrow it to the reader registerWritingView.ts:262 already builds (listPapers: () => Promise<PaperRecord[]>, from controller.currentServices()?.paperService); papers returns PaperRecord[] with params {}. Do not add a second library reader."
      - notes is createProjectNotesStore (registerWritingView.ts) or the store noteLinks.ts uses; find it with facts.mjs def. readNote {paperId} answers notes.read(paperId).
      - readFile {path} returns string (the open TextDocument's text wins over the disk, via vscode.workspace.fs otherwise); listFiles {} returns project-relative paths. Paths in requests are project-relative and checked inside projectRoot; a path outside, an absolute path, or any path when projectRoot is undefined rejects. handle rejects an unknown method; the provider turns a rejection into an ok:false response.
      - openFile {path} opens the project file in VS Code (vscode.window.showTextDocument), same path check.
      - Diagnostics come from vscode.languages.getDiagnostics(uri), read afresh on each problems() call; severity Error/Warning map to error/warning, the rest to info; line is range.start.line + 1.
      - hostPorts.ts in the webview turns the request/response messages into the editor deps (files, papers, notes, noteLinks, openNotes, openTab, problems); problems is a ProblemSource fed by problems messages.
      - "Implementers never run pnpm gate or any lint: only node scripts/agents/run.mjs typecheck vscode and the tests.command."
    acceptance:
