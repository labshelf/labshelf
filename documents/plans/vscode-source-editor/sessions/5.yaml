    sha: f521e273
    goal: "Presence through the host: the webview's selection is published like a native editor's, and peers' cursors on the file are posted to the webview and drawn with core's remote cursors."
    level: behaviour
    runner: {agent: implementer, model: sonnet}
    edit:
      - {path: packages/vscode/src/collab/node/editors.ts, lines: "100-209", why: "accept selections from activeSource views, not only TextEditors; expose peers per uri"}
      - {path: packages/vscode/src/writing/sourceEditor/provider.ts, lines: "1-250", why: "selection messages to presence; post peers"}
      - {path: packages/vscode/src/writing/sourceEditor/webview/sourceEditorEntry.ts, lines: "1-200", why: "draw peers with the plain-list entry point of core's remote cursors (1.2)"}
    read:
      - {path: packages/core/src/collab/dom/editorCollab.ts, lines: "1-120", why: "createRemoteCursors"}
      - {path: packages/core/src/collab/cursors.ts, lines: "1-80", why: "relative and absolute selection math, peer colour"}
      - {path: packages/vscode/src/collab/binding.ts, lines: "140-283", why: "own-only undo for native editors; the LabShelf editor's own history already excludes host updates (2.3)"}
    create:
      - packages/vscode/src/writing/sourceEditor/presenceBridge.ts
    seams:
      - {path: packages/vscode/src/writing/sourceEditor/presenceBridge.ts, signature: "export interface PeerSelection { name: string; colour: string; anchor: number; head: number }"}
      - {path: packages/vscode/src/writing/sourceEditor/presenceBridge.ts, signature: "export function createSourcePresence(deps: { document: Pick<import(\"vscode\").TextDocument, \"uri\" | \"getText\" | \"eol\">; publish(uri: import(\"vscode\").Uri, selection: { anchor: number; head: number }): void; subscribePeers(uri: import(\"vscode\").Uri, listener: (peers: PeerSelection[]) => void): () => void; post(message: { type: \"peers\"; peers: PeerSelection[] } | { type: \"reveal\"; line: number }): void }): { selection(message: { type: \"selection\"; anchor: number; head: number; line: number }): void; dispose(): void }"}
    decided:
      - "SharedPresence (editors.ts) gains publishSelection(uri, {anchor, head}) with document offsets, same effect as a native editor's selection on that file, and peersOf(uri, listener): () => void with document offsets, the listener run at once with the current peers."
      - "createSourcePresence subscribes to peers when created."
      - "Offsets cross the webview boundary in the LF text; createSourcePresence converts both ways with the document's line break. Example: in \"a\\r\\nb\" the b is LF offset 2 and document offset 3."
      - "The provider wires createSourcePresence with publish = sharedPresence.publishSelection and subscribePeers = sharedPresence.peersOf; outside a shared project it is not created."
      - "binding.ts needs no change for text; change it only if its undo handler acts on a LabShelf panel, and say so in the report."
    acceptance:
      - {id: 5.1a, check: "a selection message publishes the user's presence on that file"}
      - {id: 5.1b, check: "peers on the file are posted with offsets matching the document, CRLF included"}
    tests:
      hidden: [documents/plans/vscode-source-editor/tests/5.1/packages/vscode/__tests__/writing/sourceEditor/presenceBridge.test.ts]
      command: "node scripts/agents/run.mjs test vscode --spec 5.1 --plan vscode-source-editor -- __tests__/writing/sourceEditor/"
