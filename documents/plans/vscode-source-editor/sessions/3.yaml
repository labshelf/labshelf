    seams:
      - path: packages/vscode/src/writing/sourceEditor/documentSync.ts
        signature: 'export function createDocumentSync(deps: { document: import("vscode").TextDocument; authority: { readonly version: number; text(): string; receive(baseVersion: number, updates: readonly { clientID: string; changes: { from: number; to: number; insert: string }[] }[]): { from: number; to: number; insert: string }[][] | undefined; external(changes: readonly { from: number; to: number; insert: string }[]): void; since(version: number): { clientID: string; changes: { from: number; to: number; insert: string }[] }[] }; applyEdit(edit: import("vscode").WorkspaceEdit): Thenable<boolean>; post(message: { type: string; [key: string]: unknown }): void; logger: import("@labshelf/core").ILogger }): { receive(message: { type: string; [key: string]: unknown }): Promise<void>; dispose(): void }'
    decided:
      - The seam inlines SourceAuthority and the message types only because core did not export them at plan time; import them from @labshelf/core.
      - One authority per document, shared by every LabShelf editor panel on it; created on the first panel and dropped with the last.
      - "Syncs that share an authority coordinate through state keyed by that authority (a WeakMap): the in-flight expected changes and the onDidChangeTextDocument listener are per authority, so an echo of any panel's edit is recognised by all, an outside edit is recorded with authority.external once, and every panel gets the resulting updates."
      - Accepted client changes become one WorkspaceEdit each, applied in order; while an edit is in flight onDidChangeTextDocument events for this document are compared with the expected changes and swallowed when they match, otherwise recorded with authority.external.
      - If applyEdit returns false, the client gets a resync from document.getText().
      - authority.since(v) throws RangeError when v is outside the kept history; catch it and resync the client from authority.text(). receive() does not drop updates it already accepted, so the client never re-pushes before confirmation (2.3).
      - save → document.save(); dirty → document.isDirty after each change and on onDidSaveTextDocument.
      - The webview's files.read/list serve project files through the existing project service, bounded to the project folder; papers and notes are 'not available' until session 4 (the editor degrades).
      - "Concretely: the webview sends {type:'request', id, method, params}; the provider answers {type:'response', id, ok, value|error}. listFiles → projects.data.listProjectFiles(project.folder); readFile → the open TextDocument's text if one is open, else projects.fs.readText(paths.join(folder, path)) after an isInside check (reject '..' escapes). Every other method answers ok:false 'not available'. Outside a project, listFiles answers [] and readFile ok:false."
      - projects reach the provider through a new PanelCommandsDeps.projects field filled from writing.projects in startExtension.ts.
      - documentSync.ts keeps its current, test-green logic; only swap its inline types for the core imports once core/src/writing/index.ts exports them.
      - "The webview side can no longer answer files.write: the editor runs in document mode only, so write rejects with 'not available'."
      - projectId comes from the existing project lookup for the document's folder; a file outside a project still opens, with no project features.
      - The webview entry imports tokens.css, vscodeHost.css, base.css and mounts the core editor in document mode inside the card (3.2).
    acceptance:
