    seams:
      - path: packages/vscode/src/writing/activeSource.ts
        signature: 'export interface SourceView { uri: import("vscode").Uri; line(): number; reveal(line: number): void; updates?: unknown }'
      - path: packages/vscode/src/writing/activeSource.ts
        signature: 'export interface ActiveSource { current(): SourceView | undefined; openFor(uri: import("vscode").Uri): SourceView | undefined; onDidChange: import("vscode").Event<SourceView | undefined>; register(view: SourceView, focused: import("vscode").Event<boolean>): import("vscode").Disposable }'
      - path: packages/vscode/src/writing/activeSource.ts
        signature: 'export function createActiveSource(window: Pick<typeof import("vscode").window, "activeTextEditor" | "onDidChangeActiveTextEditor" | "onDidChangeTextEditorSelection">): ActiveSource'
    decided:
      - SourceView.updates is the core SourceUpdates type once session 1 has moved it; the seam says unknown only for the plan-time stub.
      - A native editor wraps as a SourceView with line = selection.active.line + 1 and reveal = revealRange in center; its updates insert through TextEditor.edit / insertSnippet.
      - When a LabShelf panel loses focus to a native editor, current() follows the native one; a webview panel of another kind (PDF preview) does not clear current().
      - Lines are 1-based at this interface.
      - One ActiveSource for the extension, created in registerWritingView and reaching the source editor provider through startExtension → registerPanelCommands → registerSourceEditor.
      - The webview already sends {type:'focus', focused} and {type:'selection', anchor, head, line} (line 1-based) and accepts {type:'reveal', line} (core protocol); the provider turns focus into the register() focused event and keeps the last selection line for line().
      - Build and Show in Preview resolve the file through activeSource.current()?.uri where they read vscode.window.activeTextEditor today; behaviour with only native editors stays the same.
    acceptance:
