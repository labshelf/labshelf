    decided:
      - "The flag lives next to outlineOpenOf: advancedOf(view), setAdvancedOf(view, on) (no-op when equal; sets the WeakMap flag, calls the listeners, calls the bound saver), onAdvancedChange(view, listener) returning the stop function. Not fold plugin state. The handle exposes advanced() / setAdvanced(on), which also sets the root class."
      - "The root class is kept in sync in both places that set root classes today: setAdvanced in foldMembers (Source mode takes the view out of the page, so the root is set directly) and the load in bindViewStateAndOutline once the view is in the root. Nothing sets is-reading any more; grep shows none left in packages/."
      - "The saved shape is {cells, sections, advanced, outline}; a stored `reading` is ignored by the normaliser and never read back, never written."
      - "latexTablePreview: today's reading behaviour is kept for the off mode: the preview is always shown (the rule at qmd-editor.css 406), click does not open the source, cursor default (408). When advanced it behaves as today's normal mode."
      - "The insert-gap hiding rule of reading mode is dropped, so '+' stays available in the off mode (A4)."
      - "The media controls hidden rule keeps its effect for the off mode (D3)."
      - "noteBar.ts: only the Reading mode entry and its const are removed here; the switch button and header are session 2."
      - "qmdEditor.ts is at the 400-line limit: move a cohesive part (for example the fold / outline / advanced handle members) into a sibling file of 80+ lines in qmd/dom rather than raise the limit; keep exported names."
      - "Testing policy: run only typecheck core and the listed test command, never pnpm gate or lint."
    acceptance:
      - {id: "1.1a", check: "normaliseNoteViewState returns advanced true only for === true and ignores a stored reading; the saved object is {cells, sections, advanced, outline}"}
      - {id: "1.1b", check: "handle.setAdvanced(true) makes advanced() true, adds is-advanced to the root (also in Source mode) and saves under the item key through the port; setAdvanced(false) removes it; a loaded advanced:true sets the class at mount"}
      - {id: "1.1c", check: "a stored view state with reading:true and no advanced opens with the flag off and no error; collapseAll and expandAll leave the flag alone; the document body never changes with the flag"}
      - {id: A3, check: "the switch state is saved per item key through the port and a stored view state with reading and no advanced opens in the off mode (core half of A3; the host stores are checked in session 4)"}
      - {id: "1.1d", check: "no source or CSS in packages/ names is-reading or setReading; the LaTeX table preview is preview-only when the root is not is-advanced"}
