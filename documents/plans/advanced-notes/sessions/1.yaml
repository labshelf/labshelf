  - id: "1.2"
    plan: advanced-notes
    sha: b3f2da990
    goal: "Cells follow the flag: off hides every cell's code (output with Show code, or a one-line summary that reveals the code on click, focus or insert); on shows every cell's code with its output below and no Show code control (D3, D4)."
    level: behaviour
    runner: {agent: implementer, model: opus}
    depends_on: ["1.1"]
    edit:
      - {path: packages/core/src/qmd/dom/codeCellView.ts, lines: "56-125", why: "constructor: subscribe to onAdvancedChange; the controls object gains advanced()"}
      - {path: packages/core/src/qmd/dom/codeCellView.ts, lines: "183-215", why: "syncOutputs / showPanel / openCode / closeCode: panel hidden = !advanced && !open (with or without output); open when the code has focus or the caret; folded() follows"}
      - {path: packages/core/src/qmd/dom/cellLine.ts, lines: "89-147", why: "the summary line for an output-less cell hidden in the off mode: reuse createCellSummary / describeSummary, shown while the cell is neither advanced, open nor collapsed; click, Enter and Space reveal (open)"}
      - {path: packages/core/src/qmd/dom/inlineViews.ts, lines: "1-231", why: "CellControls gains advanced(): boolean"}
      - {path: packages/core/src/qmd/dom/outputView.ts, lines: "275-300", why: "the Show code / Hide code button is not rendered when controls.advanced(); the actions key includes advanced"}
      - {path: packages/core/src/qmd/dom/insertGap.ts, lines: "1-120", why: "a cell just inserted from the gap or the insert menu opens (and keeps the focus in its code)"}
      - {path: packages/core/src/qmd/dom/qmd-editor.css, lines: "176-240", why: "panel hidden / summary line rules for the off mode; the output-less cell line is not shown while its code is hidden"}
      - {path: packages/core/__tests__/qmd/dom/codeCellView.test.ts, lines: "1-300", why: "existing cases follow the off default; new cases are the hidden tests"}
      - {path: packages/core/__tests__/qmd/dom/outputView.test.ts, lines: "1-300", why: "Show code absent when advanced"}
      - {path: packages/core/__tests__/qmd/dom/insertGap.test.ts, lines: "1-300", why: "inserted cell opens; the 3 pre-existing Table failures stay out of scope"}
    read:
      - {path: packages/core/src/qmd/dom/cellSummary.ts, lines: "1-80", why: "the summary text (language, kind, when)"}
      - {path: packages/core/src/qmd/dom/foldPlugin.ts, lines: "263-306", why: "onAdvancedChange from 1.1"}
    decided:
      - "Reveal is the cell's node-view-local `open` (CodeCellView.open), not saved, not fold.cells; collapse (summary line that also hides outputs) keeps its meaning and priority: a collapsed cell shows its collapse summary, never the reveal summary."
      - "Off: panel.hidden = !open for every cell. Output-less cell: its summary line shows while hidden; clicking it or Enter / Space sets open and focuses the code. Cell with output: the output action line Show code / Hide code toggles open as today."
      - "A cell opens when its code receives focus or the caret (CodeMirror focus handler, or arrowing into it through registerNodeEditor / focusCode), and when it was just inserted. Leaving the cell does not close it. Raw-format blocks and LaTeX tables keep the reading behaviour they had (their preview shows, no summary line); confirm in the code."
      - "Advanced on: panel shown for every cell, outputs below, the output's Show code button not rendered; the cell line of an output-less cell is as today; cells react through onAdvancedChange without a document redraw."
      - "codeCellView.ts is 398 lines: move a cohesive part (the summary / reveal wiring or the cell-line rendering) into cellLine.ts or a new sibling of 80+ lines, no limit raised."
      - "Strings English, hard-coded; the reveal summary reuses describeSummary's text."
      - "Testing policy: run only typecheck core and the listed tests."
    acceptance:
      - {id: "1.2a", check: "off: a cell with output hides its panel and its output line offers Show code; Show code opens the panel and the label becomes Hide code (not saved)"}
      - {id: "1.2b", check: "off: a cell without output shows its summary line instead of its code; click, Enter and Space reveal that cell's code only; other cells stay hidden"}
      - {id: "1.2c", check: "off: a cell whose code takes focus, and a cell just inserted from the insert menu or the '+' gap, is open with the caret in its code"}
      - {id: "1.2d", check: "on: every cell shows its code with the output below and no Show code control; switching off hides them again; collapse and Collapse all still work in both modes"}
      - {id: A1, check: "a new note (no stored state) opens with Advanced off: output-only cells with Show code, summaries for output-less cells, and no trace of the flag in the saved .qmd"}
      - {id: A4, check: "typing, inserting a cell from the '+' gap (code shown and focused) and running a cell work in the off and on modes"}
      - {id: "1.2e", check: "running a cell and typing in it work in both modes; the saved .qmd text is identical in both modes"}
