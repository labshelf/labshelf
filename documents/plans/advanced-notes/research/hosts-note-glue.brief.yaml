risks:
  - "Localization: NOT found. No package.nls*.json in packages/vscode, no 'Executar' anywhere, no core i18n module used by qmd/dom. All note bar strings are hard-coded English in noteBar.ts; new Advanced strings follow suit unless a translation scheme exists elsewhere (not found)."
  - "VS Code has no title-bar or command contribution for Reading mode/collapse/outline in the notes editor; the only chrome is the in-webview core bar. An Advanced switch must live in core (mountNoteFile), not in package.json, unless a new inbound/outbound message is added."
  - "Mixed-host sharing: the VS Code reader (readerEntry.ts), VS Code details (detailsEntry.ts:26), VS Code spaces (spacesEntry.ts:20) and the browser all feed the same NoteViewState store; a new Advanced field must tolerate old stored values (normaliseNoteViewState defaults)."
  - "Per-item vs per-note state: view state is keyed per item (noteKey + newline + itemId); a per-file Advanced flag needs a choice (store on first item like outline, or a separate note-wide key that must not collide with the per-item key space)."
  - "Gutter numbering is shared per file (createLineNumbering in NoteFileState); toggling Advanced must remount items (unmountAll resets numbering) since gutter is a mount-time editor option (qmdEditor.ts:364). Without gutter a non-readOnly editor gets the round Insert button instead (qmdEditor.ts:366)."
  - "When Advanced is off but reading state was saved as true, the code stays hidden with no menu to change it; decide whether Advanced off clears/ignores reading. Item reading is applied via bindFoldViewState regardless of the bar."
  - "Space notes (mountSpaceNotes.ts) and reader notesTab.ts still mount mountNoteBar; removing 'Reading mode' from noteBar.ts affects them too, and their tests (mountSpace.test.ts, notesTab.test.ts) assert the bar exists."
  - "Empty-file path (mountEmpty) mounts a gutter editor with no bar; a file without items has no bar, so no place for an Advanced switch unless the header is mounted independently of items."
  - "Comments, discussions, note boxes, floating notes, overview desk, commentsTab never use gutter/noteActions/bar: safe to exclude if the switch is implemented only in mountNoteFile (and optionally notesTab)."
  - "Working tree is dirty (many files modified incl. browser libraryUi and spaces code); sha is HEAD, line numbers were read from the working tree."
