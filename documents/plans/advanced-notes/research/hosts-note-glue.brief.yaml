schema: brief/v1
area: hosts-note-glue
question: "how each app hosts the shared core notes view, for an Advanced switch on notes (.qmd) file views"
sha: b3f2da990
reuse:
  - {symbol: mountNoteFile, path: packages/core/src/qmd/dom/mountNoteFile.ts, lines: "84-218", why: "Single shared mount for VS Code notes editor and browser note tab. NoteFileState holds barHost (div.qmd-note-file-bar) and list. showBar(s, shown) (102-110) mounts/destroys mountNoteBar; render() (179-186) calls showBar(s, items.length>0) and passes actions to mountItem. mountItem (134-146) passes noteActions: actions.actionsFor(id) and gutter: {numbering: s.numbering} to mountQmdEditor, plus viewState {port, key: `${noteKey}\\n${item.id}`}. mountEmpty (149-169) also passes gutter (no bar/actions). NoteFileOptions (24-41) has viewState?: QmdViewStatePort but no switch option. Best single place to gate bar + gutter on an Advanced flag."}
  - {symbol: mountNoteBar, path: packages/core/src/qmd/dom/noteBar.ts, lines: "104-170", why: "Bar = Run all button + more menu 'Note actions' + outline panel. noteMenuEntries (105-123) is the menu: Run all, Restart and run all, separator, Collapse all, Expand all, 'Reading mode' (line 118, checked = every handle foldState().reading, onSelect handle.setReading), Next problem, Previous problem, Outline. Reading mode item to be removed here. Labels are hard-coded English strings."}
  - {symbol: NoteViewState / QmdViewStatePort / normaliseNoteViewState, path: packages/core/src/qmd/noteViewState.ts, lines: "1-22", why: "View state per item: {cells, sections, reading, outline}; key `${noteKey}\\n${itemId}`. Only existing per-note view-state port (never the document). An Advanced flag has no field yet: adding one needs a new field here (normalise defaults); the outline flag is already stored on the FIRST editor's state (createOutlinePanel in noteBar.ts 77-102) as a note-wide precedent."}
  - {symbol: createWebviewNoteViewStore, path: packages/vscode/src/webview/noteViewStore.ts, lines: "1-24", why: "VS Code store: webview getState().noteView[key], newest 200 keys kept, merges into state. Also used by reader, details, spaces webviews (transport.ts:60)."}
  - {symbol: createLocalNoteViewStore, path: packages/browser/src/libraryUi/libraryPage.ts, lines: "25-40", why: "Browser store: localStorage labshelf.noteView.<key> JSON, errors swallowed. Instance created at libraryPage.ts:210, passed to mountLibraryUi as viewState (236) and as services.noteViewState (242)."}
  - {symbol: QmdEditorHandle.setReading / foldState, path: packages/core/src/qmd/dom/qmdEditor.ts, lines: "53, 309-320", why: "setReading(bool) toggles fold plugin + root class is-reading (hides cell code); foldState().reading. Reading state is already persisted via bindFoldViewState (qmdEditor.ts ~297-306, foldPlugin.ts 258). An Advanced switch can reuse or replace this."}
edit:
  - {path: packages/core/src/qmd/dom/noteBar.ts, lines: "105-123", why: "Remove the 'Reading mode' entry (line 118) and the `reading` const (111) from the note menu."}
  - {path: packages/core/src/qmd/dom/mountNoteFile.ts, lines: "24-218", why: "Add the Advanced switch / header here: show the bar and gutter only when on; remount or toggle on change; extend NoteFileOptions if hosts must supply the saved flag. Today the bar always shows when the file has items and gutter is always passed."}
  - {path: packages/core/src/qmd/noteViewState.ts, lines: "1-22", why: "Add the per-note Advanced flag to the saved view state (and normalise default) if stored there; both host stores JSON-store whatever NoteViewState they get, so they need no change for a new field."}
  - {path: packages/core/src/reader/dom/notesTab.ts, lines: "150-183", why: "Reader notes tab: mountNoteBar(nav,...) at 156 and mountQmdEditor(root,{ noteActions: bar.actionsFor(id), gutter: {}, viewState:{port:this.viewState,key:`${paperId}\\n${id}`} }) at 163-170. Edit only if the Advanced switch must apply here too, else it keeps its bar (and loses Reading mode through the noteBar.ts change)."}
read:
  - {path: packages/vscode/src/writing/notesEditor/webview/notesEditorEntry.ts, lines: "13-62", why: "VS Code webview entry: viewState = createWebviewNoteViewStore(api) (20); on message 'init' it calls mountNoteFile(root, {text, noteKey: message.noteKey, viewState, save/create -> post, cells (only if canRun): runCell/runMath/restartCell/installPython via request(), onError->console.error}) (45-61); 'update' -> handle.update(text). No files port, no UI chrome of its own."}
  - {path: packages/vscode/src/writing/notesEditor/protocol.ts, lines: "1-25", why: "Messages: Inbound init{text,noteKey,canRun}/update/response; Outbound ready/save/create/request(runCell|runMath|restartCell)/cancel/installPython. No message for view state or toggles (view state is webview-local setState)."}
  - {path: packages/vscode/src/writing/notesEditor/provider.ts, why: "Extension-side custom editor provider (viewType labshelf.notesEditor); not opened in detail: it sends init with noteKey. A host-level title-bar Advanced toggle would need a new message here."}
  - {path: packages/vscode/package.json, lines: "60-100, 913-918, 1255-1261", why: "Notes editor contributions: customEditor labshelf.notesEditor for **/papers/**/notes.qmd and **/notes/*.qmd; commands labshelf.notesEditor.reopen / reopenAsText (editor/title entries 1255-1261, menu 913-918). NO reading-mode, collapse-all or outline command for the notes editor (labshelf.writing.revealOutline at 560/929 is the writing project outline, unrelated). Those actions live only in the in-webview note bar menu."}
  - {path: packages/browser/src/libraryUi/editorArea/noteFileTab.ts, lines: "54-87", why: "Browser host: mountNoteFileTab(host, ctx, source) builds body div.ls-workspace-fill.ls-note-file, calls mountNoteFile(body,{text,noteKey,files,viewState: ctx.noteViewState (if set),save,create,flush,cells{runCell,restart,runMath,installPython},onError}) at 66-76. No header/toolbar in the tab; only the core bar inside. mountPaperNoteTab (101-116) noteKey paper:<paperId>; tabKinds.ts:82 mounts project notes the same way. TabContext.noteViewState declared tabKinds.ts:52-53 (comment mentions Reading mode, update it)."}
  - {path: packages/core/src/reader/dom/notesTab.ts, lines: "22, 150-185", why: "Reader notes tab view state: this.viewState (reader option viewState, reader.ts:27 comment mentions Reading mode) keyed `${paperId}\\n${id}`; VS Code reader gets it from readerEntry.ts:13,23 (createWebviewNoteViewStore), browser from mountLibraryUi (mountLibraryUi.ts:39)."}
  - {path: packages/core/src/spaces/dom/mountSpaceNotes.ts, lines: "127, 160-170, 187, 199", why: "Space notes: mountNoteBar(s.detail, noteBarOptions(s)) at 187 and noteActions at 163 but NO gutter; viewState key space:<id>:<path>\\n<itemId>. Still shows the bar (and its Reading mode item) unless the plan changes it."}
