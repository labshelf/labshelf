  - {symbol: "normaliseNoteViewState / NoteViewState / QmdViewStatePort", path: packages/core/src/qmd/noteViewState.ts, lines: "1-21", why: "Saved shape and its normaliser (booleans false unless === true, so a new boolean key is backward compatible). Stores: packages/vscode/src/webview/noteViewStore.ts, packages/browser libraryUi noteViewStore (test packages/browser/__tests__/libraryUi/noteViewStore.test.ts) pass the object through unchecked; their tests hard-code the 4-key shape."}
  - {symbol: "cell collapse (fold.cells) + createSummaryLine + collapsedSummary", path: packages/core/src/qmd/dom/foldPlugin.ts, lines: "88-95, 125-137", why: "Per-cell collapse is a node decoration class qmd-collapsed (+ qmd-collapsed-output on its outputs) carrying spec {qmdCollapsed, summaryText, summaryState}; CSS hides all cell children but .qmd-cell-summary. Keyed by cell label else cell-<n>; saved in NoteViewState.cells; pruned to existing cells on load (replaced())."}
  - {symbol: "CellControls.setOpen/isOpen/folded (Show code / Hide code)", path: packages/core/src/qmd/dom/codeCellView.ts, lines: "112-120, 188-215", why: "A cell WITH output already has a per-cell code reveal: panel.hidden = hasOutput && !open, so code is hidden by default; the output action line button 'Show code'/'Hide code' (outputView.ts 292-299, class qmd-output-code) calls controls.setOpen. `open` is node-view-local (not saved, not in fold state) and is set true when the code has focus at output arrival. A cell without output always shows its code. This is the closest existing 'reveal code' control; it is not the fold state."}
  - {symbol: "markActive / gutterLines / entriesOf / placeRow", path: packages/core/src/qmd/dom/lineGutter.ts, lines: "18-27, 93-116, 140-146, 181-191", why: "gutterLines(doc) already groups each code_cell with following output blocks into ONE line {pos,end} = one top-level block span (what 'one bar per top-level block' needs). entriesOf computes per-entry top (line centred on first text line) and a local `bottom` (rect.bottom - box.top) that is only used for the cursor and is NOT stored in Entry (Entry = {block?, at, top?, fold?}); trailing empty rows have no block. markActive picks the last entry with block <= selection.from and toggles `is-active` on that row only (selection.from only, no selection range)."}
