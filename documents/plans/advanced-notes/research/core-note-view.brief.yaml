risks:
  - "View state is stored per ITEM (noteKey + newline + itemId), not per notes file; a file with several items has several keys. Reading is applied to all handles by the note menu and saved under each item; the outline flag is read from editors()[0] only. A per-file Advanced flag has no file-level slot in QmdViewStatePort."
  - "A default code cell WITH output already hides its code (panel.hidden = hasOutput && !open) and has a per-cell 'Show code' in the output action line, which fades in only on hover; `open` is node-view-local and unsaved. A cell WITHOUT output always shows its code (and the quiet run line). Reading mode, by contrast, summarises output-less cells via the collapse decoration and hides .qmd-cell-code everywhere through CSS. The new 'Off' default semantics (hide every cell's code, including output-less cells, with per-cell reveal) differs from both; reusing fold.cells for reveal would make 'collapsed' mean 'summary line', which today also hides outputs (qmd-collapsed-output) and is saved/pruned by cell key."
  - "Per-block bar: Entry has no bottom/height and rows are the line height; trailing empty rows have no block. entriesOf's returns without layout (jsdom or hidden host) have no `top`, so tests with no layout cannot see bar geometry. Output-containing blocks (cell + outputs) are one gutterLines entry; but a cell with hidden code takes a smaller height, so rows need redraw on view-state changes (schedule is driven by ResizeObserver on view.dom/root and update(); an is-reading/advanced class toggle alone does not call update())."
  - "is-reading is applied from two places (foldPlugin view() on the editor root, and qmdEditor foldMembers on root for Source mode); any new class must keep both in sync. foldPlugin.view() uses closest('.qmd-editor'), which fails before the view is in the root (hence bindViewStateAndOutline ordering comment)."
  - "buildDecorations returns DecorationSet.empty early when there are no sections, no collapsed cells and !reading (line 127): any new view-state-driven decoration (caret-block grey) must bypass or extend that."
  - "Caret block marking is not available via existing plugin; selection inside a CodeMirror cell editor is a nested editor, so view.state.selection.from for a caret in code cell may sit at the node selection/cell pos (markActive uses selection.from with block <= from); verify how a focus inside a cell's CodeMirror maps to the ProseMirror selection (codeCellEditor.ts / inlineViews.registerNodeEditor)."
  - "Status text strings 'Executado · 0,12 s' (Portuguese) and 'Run below' were not located as literals in qmd/dom; runTime comes from formatRunTime in codeCellView.ts, 'Run below' is a cell-menu entry (cellMenu.ts, not read)."
  - "Working tree is dirty (git status lists many modified files, including packages/core/__tests__/qmd/dom/codeCellView.test.ts, lineGutter.test.ts, noteBar.test.ts, outputView.test.ts, insertGap.test.ts, notebookCells.test.ts); line numbers above are from the working tree at sha b3f2da990 plus those local edits."
