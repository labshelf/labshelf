      - {id: A4, check: "the editor hover shows passage, note text, full abstract, or page thumbnail and marks by scope"}
    tests:
      hidden: []
      command: node scripts/agents/run.mjs test core --spec 2.3 --plan editor-cite-popup -- packages/core/__tests__/writing/dom/citationHoverScope.test.ts
