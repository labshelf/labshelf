contracts: ["contracts/library-format#project-folder-labshelf", "contracts/collaboration"]
commands: ["node scripts/agents/run.mjs typecheck core"]
risks:
  - "Three hover surfaces with duplicated logic (CodeMirror, VS Code native, preview card), all per key; page from the supplement only."
  - "The PDF cannot tell two cites of the same key apart: LaTeX synctex is line-precise (first occurrence on the line); Typst preview has no site at all."
  - "labshelf.yaml/labshelf.bib are per key and regenerated; a per-occurrence store belongs in .labshelf/."
  - "Supplement parsing: LaTeX accepts p.~N / p. N only; Typst supplement read only by citationHover.ts."
