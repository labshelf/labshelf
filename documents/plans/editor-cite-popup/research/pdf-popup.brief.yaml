contracts: ["code#placement"]
commands: ["node scripts/agents/run.mjs typecheck core"]
risks:
  - "Reader is one per document (global ids); no embedded mode; a new light page view is needed."
  - "VS Code source webview enables pdf.js CSP and roots only for decks; localResourceRoots fixed at creation."
  - "PDF bytes reach the webview as base64 over postMessage; slow for large PDFs."
  - "pdf.js is external in VS Code bundles; worker via Blob URL and useWorkerFetch false."
  - "No standalone text layer or highlight overlay outside ReaderContext."
  - "Scanned PDFs have no text layer: page or whole-paper only."
  - "Duplicate pickHighlight/pickPaper in VS Code completion.ts and browser source.ts."
