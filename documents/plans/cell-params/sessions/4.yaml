    decided:
      - "Read node scripts/docs/doc.mjs ui first. Native input type=range / select / checkbox, label = name, value text beside it, aria-valuetext, log sliders map position exponentially."
      - "Debounce 150 ms on input; one preview in flight per cell; a newer value replaces the queued one; never cancel a preview."
      - "Release writes setCellParamValue into attrs.options through setViewNodeAttribute (one undo step) and then calls onRunCell with params; a release while a preview runs waits for it."
      - "RunCell becomes (label, code, language, params?, preview?) => void; the host side was done in session 3."
      - "Manipulate controls from the last result draw the strip when the cell has no param lines; the first release writes all of them as #| param lines (formatCellParamLine)."
    acceptance:
      - {id: 4.1a, check: "dragging produces debounced previews, at most one in flight, last value wins, no options write"}
      - {id: 4.1b, check: "release rewrites only the value in the param line and triggers one normal run with params"}
      - {id: 4.1c, check: "a folded cell still shows the strip; controls are keyboard operable and labelled"}
      - {id: 4.1d, check: "Manipulate controls draw a strip and release writes #| param lines"}
    tests:
