      - {id: 1.2b, check: "setCellParamValue rewrites only the value, byte for byte elsewhere, CRLF kept"}
      - {id: 1.2c, check: "an output written with params carries the attribute and reads back equal; a different value marks it out of date"}
      - {id: A1, check: "param lines parse, round-trip and rewrite only the value"}
