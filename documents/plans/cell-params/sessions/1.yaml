    decided:
      - "Grammar exactly as plan D1; whitespace-tolerant; strings in double quotes with \\\" escapes; a slider value outside [min, max] is clamped on read, not rewritten."
      - "setCellParamValue changes only the value token and keeps every other byte, including the line ending; an unknown name returns options unchanged."
      - "Output attribute: names sorted, `name=value` joined by `;`, numbers in shortest round-trip form, strings JSON-quoted, booleans true/false."
      - "An output is out of date when its params attribute differs from paramValues(parseCellParams(options)); no params on either side means unchanged behaviour."
    acceptance:
