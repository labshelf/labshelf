risks:
  - "Only #| is an option prefix in every language (Mathematica too); options never reach the kernel."
  - "Malformed param line: no slider, no throw."
  - "Debounced re-run needs cancel of the current requestId: extend the group API."
  - "Write back on pointerup/change, not per tick (undo history)."
  - "Folded cells hide the panel: the strip must stay visible next to the output."
  - "No slider widget exists; native input type=range with accessible name and aria-valuetext."
  - "Hash attrs.code only; send injected code so output never looks stale."
