schema: session/v1
id: "1"
goal: "The contract names the workspace model, and core reads the block tree of a LaTeX or Typst talk or poster, rewrites its known properties as splices and finds a node's SyncTeX boxes (A2)."
depends_on: ["0"]
owns:
  - packages/core/src/decks/
  - packages/core/src/writing/synctexLookup.ts
  - packages/core/src/writing/index.ts
  - packages/core/__tests__/decks/
  - packages/core/__tests__/writing/
  - documents/contracts/decks.md
  - documents/plans/deck-workspace/
status: done
packages:
  - id: "1.1"
    plan: deck-workspace
    sha: f2f73527
    goal: "documents/contracts/decks.md gains the section 'Source deck workspace': the node tree (D4), the properties and their source forms (D5), the source-link port (D6) and the build loop (D9)."
    level: contract
    runner: {agent: main, model: opus}
    edit:
      - {path: documents/contracts/decks.md, lines: "15-36", why: "after 'Source talks and posters'"}
    read:
      - {path: documents/plans/deck-workspace/plan.yaml, lines: "13-90", why: "D3-D6 and D9, the decisions the section states"}
      - {path: packages/core/src/decks/sourceDeckBlocks.ts, lines: "1-225", why: "node kinds and shape as built"}
      - {path: packages/core/src/decks/sourceDeckScan.ts, lines: "1-165", why: "property readers: the source forms read"}
      - {path: packages/core/src/decks/sourceDeckProps.ts, lines: "1-128", why: "setSourceDeckProp: forms written, null cases, align insertion"}
      - {path: packages/core/src/decks/sourceDeckEdit.ts, lines: "1-276", why: "setSourceNote"}
      - {path: packages/core/src/writing/synctexLookup.ts, lines: "1-80", why: "findSourceBoxes and its SourceBox result"}
      - {path: packages/core/__tests__/decks/sourceDeckBlocks.test.ts, lines: "1-400", why: "what the tests pin"}
      - {path: packages/core/__tests__/decks/sourceDeckProps.test.ts, lines: "1-400", why: "what the tests pin"}
    decided:
      - "Write the section from the code and tests as built; where they differ from D4/D5 wording, the code wins and the section says so plainly (e.g. Typst columnWidth is never read or written; content before the first column or slide is not in the tree; readers also accept \\raggedright/\\raggedleft)."
      - "Name the public functions and types by their exported names; follow the existing contract's style and section length; English only. No code edits."
    acceptance:
      - {id: A2, check: "the section lists every node kind, property and source form the tests pin"}
    tests:
      none: "a contract text; 1.2 and 1.3 test it"
  - id: "1.2"
    plan: deck-workspace
    sha: f2f73527
    goal: "readSourceDeckBlocks reads columns, blocks, slides and elements with ranges for tikzposter, beamerposter, beamer, Typst posters and talks."
    level: behaviour
    runner: {agent: main, model: opus}
    edit:
      - {path: packages/core/src/decks/sourceDeckOutline.ts, lines: "1-201", why: "reuse its frame, block and heading scanners rather than duplicating them"}
      - {path: packages/core/src/decks/index.ts, lines: "1-29", why: "exports"}
    create:
      - packages/core/src/decks/sourceDeckBlocks.ts
      - packages/core/__tests__/decks/sourceDeckBlocks.test.ts
      - packages/core/__tests__/decks/fixtures/
    read:
      - {path: dev-library/projects/deck-showcase/posters/a1-tikz/main.tex, lines: "1-33", why: "real fixture (git-ignored, local only: copy it into the fixtures)"}
      - {path: dev-library/projects/deck-showcase/talks/defesa-beamer/main.tex, lines: "1-41", why: "real fixture"}
      - {path: dev-library/projects/typst-posters/posters/typst-a0/main.typ, lines: "1-25", why: "real fixture"}
      - {path: dev-library/projects/typst-posters/talks/typst-relampago/main.typ, lines: "1-31", why: "real fixture (Typst talk)"}
      - {path: packages/core/src/decks/sourceDeckScaffold.ts, lines: "160-188", why: "scaffoldSourceDeck(format, title, shape) and listSourceDeckShapes(kind, format) give the scaffold fixtures, incl. beamerposter and Typst talk"}
      - {path: documents/plans/deck-workspace/plan.yaml, lines: "13-62", why: "decisions D3 (placement, at most 400 lines, no dependency), D4 (node tree, normative) and D5 (property names for props)"}
    decided:
      - "Fixtures are the scaffolds from scaffoldSourceDeck plus copies of the dev-library sources under __tests__/decks/fixtures/."
      - "Comments (% and //) never open nodes; an unbalanced brace ends the tree at the last balanced node and the rest is one code node."
      - "Signature: readSourceDeckBlocks(format: SourceDeckFormat, kind: DeckKind, text: string). Node shape per D4: {kind, title?, range, titleRange?, bodyRange?, line, endLine, props, children?}; ranges are character offsets [start, end) into text. Export the node and kind types."
      - "props holds the D5 properties read in a known form (title, src, width, caption, align, columnWidth); absent forms are absent keys. 1.3 writes them with setSourceDeckProp and round-trips through this reader, so keep the per-property readers small and exported."
      - "The dev-library sources are git-ignored: copy them into packages/core/__tests__/decks/fixtures/ so the tests never read dev-library."
      - "Checks: only node scripts/agents/run.mjs typecheck core and tests.command; never pnpm gate or lint; no commits."
    acceptance:
      - {id: A2, check: "trees match for each fixture; unknown content is code; line and endLine are 1-based and inclusive"}
    tests:
      hidden: []
      command: node scripts/agents/run.mjs test core -- packages/core/__tests__/decks/sourceDeckBlocks.test.ts
  - id: "1.2b"
    plan: deck-workspace
    sha: f2f73527
    goal: "Split sourceDeckBlocks.ts (547 lines) under the 400-line limit of D3 without changing behaviour."
    level: task
    depends_on: ["1.2"]
    runner: {agent: main, model: sonnet}
    edit:
      - {path: packages/core/src/decks/sourceDeckBlocks.ts, lines: "1-547", why: "the file to split"}
      - {path: packages/core/src/decks/index.ts, lines: "1-40", why: "re-point the exports of the moved readers"}
    create:
      - packages/core/src/decks/sourceDeckProps.ts
      - packages/core/src/decks/sourceDeckTypst.ts
    read:
      - {path: packages/core/__tests__/decks/sourceDeckBlocks.test.ts, lines: "1-400", why: "must stay green unchanged"}
    decided:
      - "sourceDeckProps.ts (the file D3 names for property read and write; 1.3 adds the writers there) takes the property readers readSourceDeckSrc/Width/Caption/Align/ColumnWidth, the `within` helper, ALIGN_VALUE and SourceDeckPropForm (lines ~20 and ~495-547)."
      - "sourceDeckTypst.ts takes the Typst scanning: walkTypst, mathClose, typstGroup, blankTypst, the TYPST_* constants, typstCall, statementEnd, typstColumns, typstElement, withLabel, typstList, typstBreak, typstParagraph and typstTalk. Shared types and helpers (Ctx, Step, Mode, make, leaf, elements, at, trimEnd, lineEndIn) stay in sourceDeckBlocks.ts and are exported for it; resolve any import cycle by moving the shared pieces into whichever file avoids it (a cycle between the two is acceptable only if it is type-only)."
      - "No behaviour change, no renamed public export: everything index.ts exports today stays exported from index.ts. Each file at most 400 lines; each new file starts with a one-line header comment like the others in decks/."
      - "Checks: only node scripts/agents/run.mjs typecheck core and tests.command; never pnpm gate or lint; no commits."
    acceptance:
      - {id: A2, check: "sourceDeckBlocks.test.ts passes unchanged; wc -l of the three files is at most 400 each"}
    commands:
      - node scripts/agents/run.mjs typecheck core
    tests:
      hidden: []
      command: node scripts/agents/run.mjs test core -- packages/core/__tests__/decks/sourceDeckBlocks.test.ts
  - id: "1.3"
    plan: deck-workspace
    sha: f2f73527
    goal: "setSourceDeckProp and setSourceNote rewrite one property as a splice, and findSourceBoxes gives the SyncTeX boxes of a line range."
    level: behaviour
    depends_on: ["1.2b"]
    runner: {agent: main, model: opus}
    edit:
      - {path: packages/core/src/decks/sourceDeckProps.ts, lines: "1-162", why: "add the writers next to the readers; move its parser base (lines 1-108: Mode, Ctx, Step, Unclosed, at, trimEnd, lineEndIn, walkTypst, mathClose, typstGroup, blankTypst, blank, group, make, leaf, elements) out to sourceDeckScan.ts"}
      - {path: packages/core/src/decks/sourceDeckTypst.ts, lines: "1-171", why: "import the base from sourceDeckScan.js"}
      - {path: packages/core/src/decks/sourceDeckBlocks.ts, lines: "1-225", why: "import the base from sourceDeckScan.js; node types live here"}
      - {path: packages/core/src/decks/sourceDeckEdit.ts, lines: "1-211", why: "setSourceNote beside insertSourceNote; SourceDeckChange is defined here"}
      - {path: packages/core/src/decks/index.ts, lines: "1-40", why: "export setSourceDeckProp, setSourceNote and the prop name type"}
      - {path: packages/core/src/writing/synctexLookup.ts, lines: "1-78", why: "add findSourceBoxes(map, file, fromLine, toLine) next to findPagePoint"}
      - {path: packages/core/src/writing/index.ts, lines: "1-200", why: "export findSourceBoxes"}
      - {path: packages/core/__tests__/writing/synctexLookup.test.ts, lines: "1-200", why: "add the findSourceBoxes cases"}
    create:
      - packages/core/src/decks/sourceDeckScan.ts
      - packages/core/__tests__/decks/sourceDeckProps.test.ts
    read:
      - {path: packages/core/__tests__/decks/sourceDeckBlocks.test.ts, lines: "1-400", why: "fixture loading to reuse; must stay green"}
      - {path: packages/core/__tests__/decks/fixtures/, lines: "1-200", why: "fixtures for the round trips"}
      - {path: packages/core/__tests__/writing/synctexFixtures/, lines: "1-200", why: "SyncTeX fixtures for findSourceBoxes"}
      - {path: packages/core/src/decks/sourceDeckOutline.ts, lines: "1-201", why: "the outline and its note reader (readSourceDeckNotes)"}
      - {path: documents/plans/deck-workspace/plan.yaml, lines: "13-62", why: "D4, D5 (properties, normative) and D6 (findSourceBoxes)"}
    decided:
      - "Placement: sourceDeckScan.ts is the shared parser base and imports only types from sourceDeckBlocks.ts; sourceDeckProps.ts holds only property reading and writing. No runtime import cycle. Each file at most 400 lines; new files start with a one-line header comment."
      - "setSourceDeckProp(format, text, node, prop, value): SourceDeckChange | null, prop one of title, src, width, caption, align, column, columnWidth (D5). The change splices only the property's span (the readers already return value plus range); cursor is the end of the new span."
      - "A property absent in a known form gives null, never a guessed insertion, except align, which adds \\centering at the start of the block body (LaTeX) or wraps in #align (Typst)."
      - "width and columnWidth outside 0.1..1 give null; Typst columnWidth gives null (the reader never reads it). column (posters only) moves the block's range to the end of column n's body (0-based), else null; code nodes always give null."
      - "setSourceNote(format, text, slide, note): SourceDeckChange | null replaces the slide's existing note body, inserts one through insertSourceNote's form when it has none, and removes the note when note is empty."
      - "findSourceBoxes(map, file, fromLine, toLine) returns the map's boxes for that file whose line falls in [fromLine, toLine], inclusive, in the box type the map already uses; grouping by page is left to the caller. It is tested against the existing fixtures in __tests__/writing/synctexFixtures."
      - "Checks: only node scripts/agents/run.mjs typecheck core and tests.command; never pnpm gate or lint; no commits."
    acceptance:
      - {id: A2, check: "each property round-trips: only its span changes and readSourceDeckBlocks reads the new value; sourceDeckBlocks.test.ts stays green"}
    commands:
      - node scripts/agents/run.mjs typecheck core
    tests:
      hidden: []
      command: node scripts/agents/run.mjs test core -- packages/core/__tests__/decks/sourceDeckProps.test.ts packages/core/__tests__/decks/sourceDeckBlocks.test.ts packages/core/__tests__/writing/synctexLookup.test.ts
