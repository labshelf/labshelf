schema: session/v1
id: "1"
goal: "The shared LaTeX reader exists: a pure normaliser in core, a math request kind in the Mathematica driver behind ICellRunner.runMath, and a measurement on the user's own derivations that decides go or no-go (D11)."
depends_on: []
owns:
  - packages/core/package.json
  - packages/vscode/build/host.mjs
  - packages/terminal/build/cellDrivers.mjs
  - packages/terminal/src/helper/helperEntry.ts
  - packages/core/src/qmd/math/
  - packages/core/__tests__/qmd/math/
  - packages/core/src/qmd/compute/cellRunner.ts
  - packages/core/src/qmd/compute/node/
  - packages/core/__tests__/qmd/compute/node/
  - documents/plans/math-in-prose/
status: blocked
packages:
  - id: "1.1"
    plan: math-in-prose
    sha: 1b40fd37
    goal: normaliseTex(tex) rewrites the known misreads of D2 and reports each rule applied, in a new pure module packages/core/src/qmd/math/.
    level: behaviour
    runner:
      agent: implementer
      model: sonnet
    edit: []
    create:
      - packages/core/src/qmd/math/index.ts
      - packages/core/src/qmd/math/normaliseTex.ts
      - packages/core/__tests__/qmd/math/
    read:
      - path: documents/ideas/qmd-notes-ideas.md
        lines: 66-100
        why: the tested table and the normalisation rules
      - path: packages/core/src/qmd/index.ts
        lines: 1-60
        why: how qmd submodules are exported
    seams:
      - path: packages/core/src/qmd/math/normaliseTex.ts
        signature: export type TexRewrite = "euler-e" | "differential" | "leibniz" | "newton-dot"
      - path: packages/core/src/qmd/math/normaliseTex.ts
        signature: "export interface NormalisedTex { tex: string; rewrites: TexRewrite[] }"
      - path: packages/core/src/qmd/math/normaliseTex.ts
        signature: "export function normaliseTex(tex: string): NormalisedTex"
    decided:
      - Rules exactly as plan D2; rewrites lists each rule once, in the order first applied; TeX no rule matches comes back identical with rewrites [].
      - "`e` is Euler's number only when followed by `^`; `\\mathrm{e}` always is. `e` alone stays a variable."
      - "`dx` counts as a differential only after an `\\int` in the same TeX and only when it is the last token of the integrand (followed by end, `=`, `\\approx` or `}`); `\\,dx`, `\\, dx` and `\\mathrm{d}x` all end as `\\,dx`."
      - Leibniz and Newton rewrites name the dependent variable from the numerator (`dy` → y) and the independent from the denominator (`dx` → x; Newton dots use t); the follow-up bare-symbol rewrite applies only to whole-symbol occurrences (not inside `\exp`, not a letter of a longer name, not already followed by `(`).
      - "Pure string code: no DOM, no node, no kernel. Export from packages/core/src/qmd/math/index.ts."
    acceptance:
      - id: 1.1a
        check: each D2 rule maps the idea doc's failing or silently wrong row to the form that parses correctly, and reports its rule name
      - id: 1.1b
        check: "`\\sum_{k=0}^{t-1}(1-b)b^k`, `\\int x\\sin(x)\\,dx` and `\\lim_{n\\to\\infty}(1+1/n)^n` come back unchanged with rewrites []"
      - id: A1
        check: normaliseTex applies each D2 rule, reports it and leaves other TeX unchanged
    tests:
      hidden:
        - documents/plans/math-in-prose/tests/1.1/packages/core/__tests__/qmd/math/normaliseTex.test.ts
      command: node scripts/agents/run.mjs test core --spec 1.1 --plan math-in-prose -- packages/core/__tests__/qmd/math
  - id: "1.2"
    plan: math-in-prose
    sha: 1b40fd37
    goal: "ICellRunner gains runMath: a math request is normalised, queued on the note's Mathematica session like a cell, sent as `{id, math: {op, tex}}` and its reply parsed into a MathResult; a timeout or a superseded request never kills the kernel before the 30 s backstop."
    level: contract
    runner:
      agent: implementer
      model: sonnet
    depends_on:
      - "1.1"
    create:
      - packages/core/src/qmd/compute/node/mathRequest.ts
    edit:
      - path: packages/core/src/qmd/math/normaliseTex.ts
        lines: 3-3
        why: export TexRewrite (1.1 left it unexported; index.ts re-exports it)
      - path: packages/core/src/qmd/compute/node/cellDriver.wl
        lines: 1-30
        why: "header comment: the math request and reply lines"
      - path: packages/core/src/qmd/compute/cellRunner.ts
        lines: 1-90
        why: "ICellRunner port (20-30): add runMath and the MathRequest/MathResult types"
      - path: packages/core/src/qmd/compute/node/cellSession.ts
        lines: 150-205
        why: "sendRequest 155-181: send a ready request object instead of positional code/params/preview"
      - path: packages/core/src/qmd/compute/node/cellSessions.ts
        lines: 39-116
        why: runMath through enqueue() on the (mathematica, noteKey) key, acquire, armIdle
      - path: packages/core/src/qmd/compute/node/cellDriverProtocol.ts
        lines: 1-70
        why: parse the math reply into MathResult
    read:
      - path: documents/plans/math-in-prose/research/runtime.brief.yaml
        lines: 1-40
        why: map and risks
      - path: packages/core/__tests__/qmd/compute/node/cellSessions.test.ts
        lines: 1-80
        why: fake driver pattern
    seams:
      - path: packages/core/src/qmd/compute/cellRunner.ts
        signature: export type MathOp = "eval" | "numeric" | "solve" | "check"
      - path: packages/core/src/qmd/compute/cellRunner.ts
        signature: export type MathState = "value" | "proved" | "sampled" | "differs" | "conditional" | "unread" | "failed"
      - path: packages/core/src/qmd/compute/cellRunner.ts
        signature: "export interface MathRequest { noteKey: string; op: MathOp; tex: string }"
      - path: packages/core/src/qmd/compute/cellRunner.ts
        signature: "export interface MathResult { state: MathState; latex?: string; readAs?: string; rewrites: TexRewrite[]; messages: string[]; counterexample?: { point: Record<string, number>; lhs: string; rhs: string }; condition?: string; restarted?: boolean }"
    decided:
      - "ICellRunner gains runMath(request: MathRequest, signal?: AbortSignal): Promise<MathResult>; TexRewrite is imported from ../math/index.js."
      - The request line, the reply parser and the runMath body live in the new node/mathRequest.ts; cellSessions only wires it to enqueue/acquire/armIdle.
      - runMath calls normaliseTex (1.1) and sends the normalised TeX; the result's rewrites come from the normaliser, not the driver.
      - The math request waits on the same enqueue() chain as cells of that noteKey; the language is always mathematica.
      - "Host-side timeout for math is 30 s; on it the session is killed and the result is {state: failed, messages: [timeout text]} with restarted on the next request, as for cells. An abort signal that fires while the request is queued drops it before sending; one that fires after sending is ignored (the reply is discarded by the caller), never kill."
      - "No Mathematica on the machine: {state: failed, messages: [the existing no-kernel text]}."
      - Document the request and reply lines in the cellDriver.wl header comment; the qmd-items contract text lands in 3.1.
      - Other ICellRunner implementations (packages/browser/src/helper/cellPorts.ts, packages/vscode/src/activation/node/desktopPlatform.ts) are not in this session; if the typecheck needs them, make runMath optional on the interface and note it in the report.
    acceptance:
      - id: 1.2a
        check: "a math request reaches a fake driver as one line {id, math: {op, tex}} with the normalised TeX, after an earlier queued cell of the same noteKey"
      - id: 1.2b
        check: "a reply {id, math: {state: proved, readAs}} becomes a MathResult with the normaliser's rewrites"
      - id: 1.2c
        check: an abort after sending does not kill the session; the next cell request runs in the same process
    tests:
      hidden:
        - documents/plans/math-in-prose/tests/1.2/packages/core/__tests__/qmd/compute/node/mathRequest.test.ts
      command: node scripts/agents/run.mjs test core --spec 1.2 --plan math-in-prose -- packages/core/__tests__/qmd/compute/node/mathRequest.test.ts
    commands:
      - node scripts/agents/run.mjs typecheck core
  - id: "1.3"
    plan: math-in-prose
    sha: 1b40fd37
    goal: "The Mathematica driver answers a math request: Hold parse, symbol allowlist, then eval, numeric, solve or check under TimeConstrained and Quiet, replying with the D4 states, readAs and messages."
    level: behaviour
    runner:
      agent: implementer
      model: opus
    depends_on:
      - "1.2"
    create:
      - packages/core/src/qmd/compute/node/mathDriver.wl
    edit:
      - path: packages/core/src/qmd/compute/node/cellDriver.wl
        lines: 1-275
        why: header comment (wire format), Get of mathDriver.wl beside the driver, a math branch in main[] before the code check at 262 that calls it
    read:
      - path: documents/plans/math-in-prose/plan.yaml
        lines: 1-60
        why: D3, D4, D10
      - path: packages/core/__tests__/qmd/compute/node/cellDriver.wl.test.ts
        lines: 1-80
        why: real-kernel test pattern and its skip
    decided:
      - The math evaluators live in the new mathDriver.wl (cellDriver.wl is already 275 lines); its path is resolved next to cellDriver.wl, as the launcher passes it, and the build copies it wherever cellDriver.wl is copied (check the build script that copies cellDriver.wl).
      - 'Parse: ToExpression[tex, TeXForm, Hold]; a parse message or $Failed → state unread with the message. Allowlist per D3, checked on the held expression with Cases[…, _Symbol, {0, Infinity}, Heads -> True] before any evaluation; a refused symbol → unread, messages ["Refused symbol <Name>"].'
      - readAs is ToString[InputForm[ReleaseHold-free form]] of the held parse (HoldForm), so it shows what was read, not the result.
      - "eval: Simplify; numeric: N; solve: DSolve over the single function that appears under Derivative, else Solve over the free symbols; check: the parse must be Equal[lhs, rhs] else unread; then D4's order proved → sampled/differs (12 points, RandomReal[{0.1, 3}], SeedRandom by a hash of the TeX so a step gives the same counterexample each time) → conditional (Reduce[lhs == rhs, vars, Reals] when it is not True/False, condition as TeXForm)."
      - latex of a value is TeXForm of the result; counterexample values are numbers rounded to 4 significant digits, lhs and rhs as strings.
      - TimeConstrained 10 s for eval/numeric/solve and 5 s for check → state failed, messages ["Took longer than N s"]; Quiet around everything, messages collected with the existing captured[] and returned in messages.
      - "Global definitions from earlier cells apply: evaluation runs in Global` like cells. The math branch never defines or clears a Global` symbol."
    acceptance:
      - id: 1.3a
        check: eval of the normalised table rows gives the expected value (Sqrt[Pi]/2 for the Gaussian integral, 1 - b^t for the sum); numeric of \int_0^1 \frac{\ln(1+x)}{x}\,dx gives 0.8225 to 4 digits
      - id: 1.3b
        check: check of `(1-b)\sum_{k=0}^{t-1}b^k = 1-b^t` is proved; of `= 1-b^{t+1}` is differs with a counterexample; of `\sqrt{x^2} = x` is proved, sampled or conditional, never differs (positive sampling, D10)
      - id: 1.3c
        check: "`\\text{Run}(x)` or any TeX that parses to a non-allowlisted symbol is unread and nothing runs; a check that would take over 5 s is failed and a following cell still sees a variable defined before"
      - id: A2
        check: the driver answers eval, numeric, solve and check with the D4 states; refused symbols are unread; a slow check keeps the note's variables
    tests:
      hidden:
        - documents/plans/math-in-prose/tests/1.3/packages/core/__tests__/qmd/compute/node/mathDriver.wl.test.ts
      command: node scripts/agents/run.mjs test core --spec 1.3 --plan math-in-prose -- packages/core/__tests__/qmd/compute/node/mathDriver.wl.test.ts
  - id: 1.3b
    plan: math-in-prose
    sha: 1b40fd37
    goal: "mathDriver.wl ships wherever cellDriver.wl ships: the core package export, the VS Code host build copy and the terminal helper's driver files, so cellDriver.wl's Get of mathDriver.wl beside it works in packaged builds."
    level: task
