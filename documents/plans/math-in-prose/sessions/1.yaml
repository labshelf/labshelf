        lines: 100-115
        why: "exports: add ./qmd/compute/node/mathDriver.wl beside cellDriver.wl (107)"
      - path: packages/vscode/build/host.mjs
        lines: 60-75
        why: the driver copy loop at 66
      - path: packages/terminal/build/cellDrivers.mjs
        lines: 1-40
        why: CELL_DRIVER_FILES at 5 and how they are embedded
      - path: packages/terminal/src/helper/helperEntry.ts
        lines: 60-110
        why: "CELL_DRIVER_FILES map at 78 and writeCellDrivers: mathDriver.wl must be written next to cellDriver.wl, though it is not a language driver"
    read:
