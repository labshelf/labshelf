  - id: "1.4"
    plan: math-in-prose
    sha: 1b40fd37
    goal: Measure the reader on four real derivations, record it, write spec 1.5 for the misreads worth a rule, and apply the D11 verdict.
    level: task
    runner:
      agent: main
      model: opus
    depends_on:
      - "1.1"
      - "1.3"
    edit: []
    create:
      - documents/plans/math-in-prose/prototype/
    decided:
      - "Derivations: first look for .qmd notes with math on this machine (LabShelf libraries such as ~/Documents/LabShelf Teste/.research/papers/*/notes.qmd); take up to four with at least three `=` steps. If fewer exist, complete to four in documents/plans/math-in-prose/prototype/derivations.md from papers in that library or textbook material (a geometric sum, an integral by parts, a separable ODE, a limit), with one planted sign error. Write the expected Mathematica reading next to each item before running."
      - Run each expression (eval) and each step (check) through runMath on the real kernel with a throwaway script under prototype/ (never under packages/). A reading is right when readAs equals the expected reading up to InputForm spacing.
      - "Record in prototype/results.md: per item the TeX, expected, readAs, state, right or wrong; totals; misreads grouped by cause with a proposed rule each."
      - "If any proposed rule is general (not one note's quirk), add package 1.5 to this session file: an implementer (sonnet, behaviour) that adds those rules to normaliseTex with a test each, edit packages/core/src/qmd/math/normaliseTex.ts, test command as 1.1. Run it, then re-run the measurement and record the second totals."
      - "Verdict by D11 on the final totals. Go: write it in results.md and log.md. No-go: set session 2 status blocked with blocked_reason naming the totals, then close this session."
    acceptance:
      - id: A3
        check: results.md has the totals and the D11 verdict
    tests:
      none: a measurement judged against expected readings written before the run
  - id: "1.5"
    plan: math-in-prose
    sha: 1b40fd37
    goal: "The reader rules the 1.4 measurement asks for: derivative operator, implicit product, a lone \\mathrm{e}, and an allowlist that accepts Greek letters and the single capitals TeXForm reads as System symbols."
    level: behaviour
    runner:
      agent: implementer
      model: opus
    depends_on:
      - "1.4"
    create:
      - packages/core/__tests__/qmd/math/normaliseTex.rules.test.ts
      - packages/core/__tests__/qmd/compute/node/mathDriverReader.wl.test.ts
    edit:
      - path: packages/core/src/qmd/math/normaliseTex.ts
        lines: 1-200
        why: new rules and TexRewrite names
      - path: packages/core/src/qmd/compute/node/mathDriver.wl
        lines: 1-300
        why: allowlist name rule, formal-symbol substitution, held d/dv operator to D
    read:
      - path: documents/plans/math-in-prose/prototype/results.md
        lines: 1-60
        why: the misreads, their causes and the proposed rules (section 'Misreads by cause')
      - path: documents/plans/math-in-prose/prototype/raw-1.json
        lines: 1-400
        why: the actual readAs and messages per item
      - path: packages/core/__tests__/qmd/compute/node/mathDriver.wl.test.ts
        lines: 1-60
        why: real-kernel test harness to copy
    seams:
      - path: packages/core/src/qmd/math/normaliseTex.ts
        signature: export type TexRewrite = "euler-e" | "differential" | "leibniz" | "newton-dot" | "derivative-operator" | "implicit-product"
    decided:
      - "Rule derivative-operator (normaliser + driver): `\\frac{\\mathrm{d}}{\\mathrm{d}v}` becomes `\\frac{d}{dv}`; any `\\frac{d}{dv}` whose numerator is exactly `d` (an operator, not Leibniz `\\frac{dy}{dx}`) is reported as derivative-operator. The driver, on the held parse, turns Times[d/dv, X] (Global`d over the Global symbol dv, times the rest of the product) into D[X, v] before the allowlist check, so readAs shows D[…, v]. Probe evidence: `\\frac{d}{dx}\\left(x^2\\right)` reads as HoldForm[(d/dx)*x^2]."
      - "Rule implicit-product (normaliser): a single letter that is a whole symbol (not part of a command such as \\sin, \\ln, \\exp, not a letter of a longer name, not followed by a prime) followed by optional spaces and `(` or `\\left(` gets `\\,` inserted before the parenthesis, unless the parenthesis holds only single-letter symbols separated by commas (f(x), y(t), g(x, y) stay function calls). Applies after leibniz and newton-dot, so their y(x) / x(t) stay calls. Probe evidence: `k\\,(x+1)` reads as k*(x + 1); `k (x+1)` and `k \\left(x+1\\right)` read as k[x + 1]."
      - "Rule euler-e extended: `\\mathrm{e}` not followed by `^` becomes `\\exp\\left(1\\right)` (reads as E^1); reported as euler-e. A bare `e` alone still stays a variable."
      - "Driver allowlist (widens plan D3): a Global` symbol is allowed when its name starts with a letter and has only letters and digits, by LetterQ/DigitQ, so Greek letters pass. Before the allowlist check, every non-head occurrence of System`C, System`D, System`K, System`N, System`O in the held parse is replaced by the formal symbol \\[FormalCapitalC], \\[FormalCapitalD], \\[FormalCapitalK], \\[FormalCapitalN], \\[FormalCapitalO], and formal symbols are allowlisted. E and I keep their System meaning. D and N used as heads are untouched."
      - The 1.1, 1.2 and 1.3 hidden tests (packages/core/__tests__/qmd/math/normaliseTex.test.ts, packages/core/__tests__/qmd/compute/node/mathRequest.test.ts, mathDriver.wl.test.ts) must stay green; never edit them. New tests go only in the two create files, at least one per rule; the driver tests run on the real kernel with the same wolframProbe skip.
      - "Testing policy: never run pnpm gate or lint; check with node scripts/agents/run.mjs typecheck core and node scripts/agents/run.mjs test core -- packages/core/__tests__/qmd/math packages/core/__tests__/qmd/compute/node/mathDriver.wl.test.ts packages/core/__tests__/qmd/compute/node/mathDriverReader.wl.test.ts packages/core/__tests__/qmd/compute/node/mathRequest.test.ts."
    acceptance:
      - id: 1.5a
        check: "normaliseTex: `\\frac{\\mathrm{d}}{\\mathrm{d}x}\\left(x^2\\right)` → `\\frac{d}{dx}\\left(x^2\\right)` with derivative-operator; `-k\\left(C\\mathrm{e}^{-kx}\\right)` gets `\\,` before `\\left(` with implicit-product; `f(x)`, `\\sin(x)`, `\\frac{dy}{dx} = -ky` keep function calls; `\\lim_{n\\to\\infty}(1+1/n)^n = \\mathrm{e}` ends with `\\exp\\left(1\\right)`"
      - id: 1.5b
        check: "driver on the real kernel: eval of `\\frac{d}{dx}\\left(x^3\\right)` is value 3x^2 with readAs D[x^3, x]; check of `(1-\\beta)\\frac{1-\\beta^t}{1-\\beta} = 1-\\beta^t` is proved; check of `\\frac{d}{dx}\\left(C\\mathrm{e}^{-kx}\\right) = -kC\\mathrm{e}^{-kx}` is proved or sampled; `\\text{Run}(x)` is still unread"
    tests:
      none: the implementer adds the rule tests in the two create files; prior hidden tests guard regressions
    commands:
      - node scripts/agents/run.mjs typecheck core
      - node scripts/agents/run.mjs test core -- packages/core/__tests__/qmd/math packages/core/__tests__/qmd/compute/node/mathDriver.wl.test.ts packages/core/__tests__/qmd/compute/node/mathDriverReader.wl.test.ts packages/core/__tests__/qmd/compute/node/mathRequest.test.ts
blocked_reason: "1.2: missing; 1.4: no report; 1.5: no report"
