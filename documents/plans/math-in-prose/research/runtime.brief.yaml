risks:
  - "Cancel and timeout kill the kernel and its variables: math requests need TimeConstrained inside the driver and must never be aborted in flight."
  - "Every request of a note queues serially: inline requests wait behind a long cell."
  - "ToExpression on TeX evaluates what it reads: parse with Hold and check the symbols before evaluating."
  - "Sampling emits Power::infy, Infinity::indet: Quiet them inside the math evaluator."
  - "No TeX to Mathematica code exists; WL tests skip without a kernel, so the normaliser stays in TS."
