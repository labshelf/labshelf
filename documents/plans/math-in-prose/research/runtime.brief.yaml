tests:
  - {path: packages/core/__tests__/qmd/compute/node/cellSessions.test.ts, covers: "queue, restarted, cancel, timeout, idle with a fake driver"}
  - {path: packages/core/__tests__/qmd/compute/node/cellDriverProtocol.test.ts, covers: "parseResponse, toResult"}
