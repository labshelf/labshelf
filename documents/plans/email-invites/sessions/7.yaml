    decided:
      - "Email pins: InvitationPorts gains optional `emailPins: {read(): Promise<EmailPin[]>; write(pins: EmailPin[]): Promise<void>}`, EmailPin = {email (lowercased), fingerprint, encryptionKey, signingKey, pinned (epoch ms)}; absent port = in-memory pins. A successful directory lookup in inviteByEmail pins the email to the returned fingerprint and keys (the first pin per email wins; a lookup with other keys for a pinned email still sends via the directory but keeps the old pin and logs a warning). inviteByEmail first resolves email -> pin -> the contact with that fingerprint (and the same keys) -> direct postInvite; a contact's own `email` field also matches as today. Contact records in the ContactsStore are never rewritten with an email (addMemberContacts keys by email, so that would duplicate contacts)."
      - Browser stores pins in storage.local `collabEmailPins.<libraryId>`, VS Code in globalState `labshelf.collab.emailPins.<libraryId>`; malformed values read as absent; validator shared in core like isContact.
      - "ShareHost.contacts() returns ContactView[] = {name, email?, fingerprint}: email from the contact's card or from a local pin for that fingerprint. inboxUrl, inboxToken and keys never cross the RPC; the RPC result guard checks the view shape."
      - InvitationView.from.email comes only from local pins or contacts for the sender's fingerprint, never from the sealed payload; name may still come from the signed sender card.
      - Contacts are learned from every connected share's index (readMembers + addMemberContacts) in publishCard, at each refreshInvitations that reads the inbox, and before inviteByEmail resolves a contact, so members who joined later are found.
      - updateAfterRotation rewrites the own card on every connected share first (each share caught and logged), then re-registers; a register failure is logged, never thrown; it also clears the held list's throttle so the next refresh reads the new inbox. The browser fan-out catches and logs per update so one failure does not skip the rest.
      - refreshInvitations records the read time on failure too, so a failing inbox is retried at most once a minute.
      - "VS Code: the library root/id is captured when an Invitations instance (and its ports) is created, so an operation in flight after a library change keeps using its own library's stores."
      - Implementers never run pnpm gate or any lint; check only with the commands below.
