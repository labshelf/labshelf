      - id: 7.5c
        check: a register failure in updateAfterRotation does not throw and the cards are still rewritten; one failing browser rotation update does not skip the others
      - id: 7.5d
        check: a failing inbox read is not retried within a minute; a VS Code Invitations instance keeps its library's stores after a library change
