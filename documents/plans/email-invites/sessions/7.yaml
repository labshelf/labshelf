    decided:
      - "Reuse, do not rewrite: identity (collab/invite/identity.ts), sealInvite/openInvite, the inbox client (collab/relays/relayInbox.ts) and the cards and contacts of collab/members.ts. Only the directory client is new."
      - 'directoryClient.ts: DIRECTORY_URL = "https://labshelf.org/api/directory"; register({inboxUrl, inboxToken, encryptionKey, signingKey}), unregister(), lookup(email) -> {encryptionKey, signingKey, fingerprint} | undefined (not_found), send(email, sealed); each POST takes the bearer from an accessToken() port and a fetch port; errors unauthorized, unavailable, too_large, rate limits and not_found map to one typed DirectoryError with a reason. Tested against a fake fetch only.'
      - "ShareFlowPorts gains optional `invitations?: InvitationPorts` = {identity: {load(): Promise<IdentityJwk|undefined>; save(jwk): Promise<void>}, contacts: ContactsStore, enabled: {get(): Promise<boolean>; set(on: boolean): Promise<void>}, accessToken(): Promise<string>, now?(): number}. The inbox owner is ports.relay.get() (relayUrl, ownerSecret). The identity is created on first use and saved; one per library (the apps scope the stores)."
      - 'Without the invitations port (terminal, tests) or without a relay account, every new op behaves as off: invitations() is [], inviteByEmail returns {fallback: link}, setInvitationsEnabled refuses with "Connect Cloudflare first" or the NO_PROJECTS refusal.'
      - 'setInvitationsEnabled(true) saves the setting, then registers {inboxUrl: relayUrl, inboxToken: inboxToken(ownerSecret, own fingerprint), keys}; a directory `unauthorized` reports "Invitations by email are not available yet" (token without User Details Read) and leaves the setting off. false unregisters, saves off, and removes the own card from connected shares (removeOwnCard).'
      - "inviteByEmail(projectId, email) seals the project's invite link and title for the recipient: a contact with that email gets a direct postInvite to its inboxUrl with its inboxToken -> {sent: \"direct\"}; otherwise directory lookup then send -> {sent: \"directory\"}; any refusal (RelayRequestError, DirectoryError, not_found, invitations off) -> {fallback: \"link\", link, message}. not_found's message is exactly \"No LabShelf invitations for this email; copy the invite link instead\". The directory is never called when a contact matches."
      - "invitations() returns the decoded inbox: each listInbox entry opened with openInvite(identity, sealed, {checkLink: checkInvite}); entries that fail to open are deleted and skipped. An invitation view is {id, title, from: {name?, email?, fingerprint}, created, expires}."
      - "Inbox reads happen through refreshInvitations(): at app start and when All Projects opens, at most once a minute (the throttle state lives in the invitations object, not in a rebuilt host); a read that changes the list fires onInvitationsChange listeners."
      - acceptInvitation(id, signal) opens the stored envelope, runs joinInvite with the decoded Invite (joinSharedProject becomes checkInvite + joinInvite; the key is stored only once connected), deletes the inbox entry after a joined outcome, and returns the JoinProjectResult. declineInvitation(id) only deletes.
      - "Cards: publishCard(connection) writes the own signed card (signCard: name, inboxUrl, inboxToken, keys; no email field, the client does not know it) with writeOwnCard on connection.session.index when invitations are enabled, and adds readMembers of that index to contacts (addMemberContacts). shareProject, joinProject and acceptInvitation call it after connecting; the apps call it on resume (exported)."
      - "updateAfterRotation({previousUrl, relayUrl}) is exported to plug into RotateRelayDeps.updateRegistration: when enabled, re-register with the new inbox URL and token and rewrite the own card on every connected share."
      - "contacts() returns the stored contacts for the share dialog (suggestContacts stays in members.ts for session 8). Every new op crosses the RPC: ShareArgs, ARG_CHECKS, callTable, forwardedOperations, invoke and a pushed invitations reply for onInvitationsChange (offers pattern)."
