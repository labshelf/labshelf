risks:
  - "No website deploy script in the repo (no wrangler devDependency, no workflow); deploy is manual or Workers Builds. The D1 database must be created and migrated out of band."
  - "Keep run_worker_first narrow (/api/*) so static traffic never invokes the Worker (free request limit)."
  - "website/.assetsignore lists excluded dirs; new worker or migrations dirs are published unless added."
  - "The directory forwards the user's Cloudflare token to GET /client/v4/user; never log or store it. hash(email) must be keyed (HMAC with a secret) so it is not guessable."
  - "createPageShareHost forwards by hand; typecheck catches a missing method."
  - "New ops must pass parseShareCall size caps; sealed invites must fit TEXT_MAX."
  - "Browser extension fetches to labshelf.org and to inbox URLs may need host_permissions/CORS (manifest not inspected)."
  - "Uncommitted edits in ui/dom/widgets and all-projects.css; coordinate."
  - "No combobox widget exists; a new accessible one needs its own tests."
  - "Invitations need a change notification (ShareHost has only onOffersChange): add onInvitationsChange or refresh on focus."
