  - {path: packages/core/__tests__/collab/shareIndexDoc.test.ts, covers: "index maps, unknown keys kept (l.217-230); extend with members map"}
  - {path: packages/core/__tests__/share/projectShareFlows.test.ts, covers: "workflows over workflowTestbed.ts fakes; extend for join from decoded invite and identity port"}
  - {path: packages/core/__tests__/share/projectShare.test.ts, covers: "createShareHost / project ops"}
  - {path: packages/browser/__tests__/libraryUi/host/browserShareHost.test.ts, covers: "browser host wiring"}
  - {path: packages/browser/__tests__/collab/pageShares.test.ts, covers: "browser keys store"}
