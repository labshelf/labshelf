contracts: ["contracts/collaboration#share-key", "contracts/collaboration#invite-link", "contracts/collaboration#project-shares", "contracts/collaboration#relay-list", "contracts/collaboration#device-local-state", "contracts/collaboration#membership"]
commands:
  - "node scripts/agents/run.mjs test core -- packages/core/__tests__/collab/invite"
  - "node scripts/agents/run.mjs test core -- packages/core/__tests__/share/projectShareFlows.test.ts"
  - "node scripts/agents/run.mjs test core -- packages/core/__tests__/collab/shareIndexDoc.test.ts"
risks:
  - "No asymmetric crypto, key generation or private-key storage exists; the identity/seal layer is new. Share-key HKDF labels are frozen; use a new label."
  - "A new top-level index map is carried by old clients harmlessly; never reuse a name with a different Yjs type. Do not change share.kind."
  - "Cards are written by any member: a malicious member can overwrite a co-member's key/inbox. Mitigate with signed cards and local pinning (first seen wins)."
  - "Privacy: the index doc is visible to all members forever (CRDT history, relay keeps it). Email and inbox token are exposed to every co-member and anyone later given the invite. Opt-in, revocable inbox token."
  - "A sealed invite grants editor access; bind with AAD (recipient fingerprint, share id, time) and consider expiry."
  - "Browser storage.local is plaintext at rest; VS Code SecretStorage is per machine, so one user on two machines has two keypairs. Neither app has an email or profile today (browser options/shareSection.ts displayNameRow)."
  - "Pending/declined invites need their own persisted store per library."
  - "VS Code webview transport enumerates host methods (vscode/src/libraryUi/webview/projectMenu.ts, transport tests); new methods need wiring."
