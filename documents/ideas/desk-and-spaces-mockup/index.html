<!-- Presents the LabShelf research workspace mockup. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabShelf — Thesis, chapter 3</title>
<link rel="stylesheet" href=".generated/core.css">
<link rel="stylesheet" href="chrome.css">
<link rel="stylesheet" href="commands/commands.css">
<link rel="stylesheet" href="space.css">
<link rel="stylesheet" href="overview/workspace.css">
<link rel="stylesheet" href="overview/evidence.css">
<link rel="stylesheet" href="views/desk.css">
<link rel="stylesheet" href="views/notebook.css">
<link rel="stylesheet" href="views/discover.css">
<link rel="stylesheet" href="views/glossary.css">
<link rel="stylesheet" href="capture/capture.css">
</head>
<body>
<div class="win">
  <aside class="vs-sidebar" aria-label="LabShelf navigation">
    <div class="vs-title"><span class="ls-brand"><span data-i="logo"></span>LabShelf</span>
      <button class="ls-icon-btn" data-act="capture" title="Capture (Cmd+Shift+L)" aria-label="Capture"><span data-i="plus"></span></button></div>
    <nav class="global-nav" aria-label="Library">
      <button class="node nav" data-view="desk" aria-label="Desk"><span data-i="target"></span><span>Desk</span><span class="cnt" id="side-desk-count"></span></button>
      <button class="node" data-act="global-library" aria-label="Library"><span data-i="library"></span>Library</button>
      <button class="node" data-act="global-projects" aria-label="Projects"><span data-i="folder"></span>Projects</button>
    </nav>
    <div class="vs-sec">Spaces</div>
    <div class="space-label"><span data-i="chevron-down"></span>Thesis — chapter 3</div>
    <nav class="space-nav" aria-label="Thesis — chapter 3">
      <button class="node nav" data-view="overview" aria-label="Overview"><span data-i="layers"></span>Overview</button>
      <button class="node nav" data-view="notebook" aria-label="Notebook"><span data-i="note"></span>Notebook<span class="cnt" id="side-nb-count"></span></button>
      <button class="node nav" data-view="discover" aria-label="Discover"><span data-i="search"></span>Discover</button>
      <button class="node nav" data-view="glossary" aria-label="Glossary"><span data-i="book"></span>Glossary</button>
    </nav>
    <button class="node other-space" data-act="toast" data-msg="RL seminar is outside this mockup."><span data-i="chevron-right"></span>RL seminar</button>
    <div class="sidebar-foot">Interactive mockup<span id="status-desk"></span></div>
  </aside>
  <main class="editor"><div class="webview" id="view"></div></main>
</div>
<div class="scrim" id="scrim" hidden></div>
<script src=".generated/core.js"></script>
<script src="icons.js"></script>
<script src="data.js"></script>
<script src="commands/dates.js"></script>
<script src="commands/commands.js"></script>
<script src="commands/apply.js"></script>
<script src="space.js"></script>
<script src="overview/materials.js"></script>
<script src="overview/discussion.js"></script>
<script src="overview/workspace.js"></script>
<script src="overview/actions.js"></script>
<script src="views/desk.js"></script>
<script src="views/notebook.js"></script>
<script src="views/discover.js"></script>
<script src="views/glossary.js"></script>
<script src="capture/capture.js"></script>
<script src="app.js"></script>
</body>
</html>
