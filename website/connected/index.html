<!doctype html>
<!-- Tells the user that a sign-in started from a LabShelf app finished, so the browser tab can be closed. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>LabShelf · Connected</title>
<link rel="icon" href="../media/labshelf-logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/connected.css">
<script type="module" src="../js/connected.js"></script>
</head>
<body>
<main class="done" aria-live="polite">
  <a class="logo" href="../"><span class="prompt">&gt;</span> labshelf<span class="cur" aria-hidden="true"></span></a>
  <div class="term">
    <p class="cmd"><span class="prompt">$</span> labshelf connect <span id="svc-cmd">account</span></p>
    <p class="out" id="status"><svg class="mark-ok" id="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg><span id="status-text">connected</span></p>
  </div>
  <h1 id="title">You are signed in.</h1>
  <p class="lead" id="lead">Go back to LabShelf. You can close this tab.</p>
  <p class="note" id="note"></p>
</main>
</body>
</html>
