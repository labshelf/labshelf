<!doctype html>
<!-- Shows a folder of papers someone shared as a link; the link's fragment names the share and holds its key. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Shared with LabShelf</title>
  <link rel="stylesheet" href="../dist/pdfjs/web/pdf_viewer.css">
  <link rel="stylesheet" id="share-layout" href="../css/share.css">
</head>
<body>
  <div id="root">
    <header id="share-bar" class="share-bar"></header>
    <main id="share-main" class="share-main"></main>
  </div>
  <script type="module" src="../dist/share.js"></script>
</body>
</html>
