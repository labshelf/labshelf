# The naming vocabulary scripts/checks/naming.mjs enforces. Every name is camelCase; a multi-word term is one compound (buildRoot).
# This file is the record of naming decisions: each entry and its `def` state what a word means and where it may be used. A `syn` is a spelling that is rejected in favour of its term.
# Layers: A mechanism (anywhere), B formats (anywhere), C subjects (folders and files), D features (only in `home`), E tools (files and exports, never folders).
version: 1

runtime:
  node: { def: "May use node:*." }
  dom: { def: "May use the DOM." }
  worker: { def: "Cloudflare Worker runtime (relay only)." }
  webview: { def: "VS Code only: code bundled into a webview (DOM)." }

# Top-level folders allowed under packages/<pkg>/src. `app` marks a folder that exists for one app only.
domains:
  ai: { def: "Embeddings, chunking, indexing, retrieval." }
  bridge: { def: "The native host that serves the library folder to the browser." }
  collab: { def: "Live collaboration on a shared writing project (share is the unit).", syn: [collaboration] }
  encoding: { def: "Byte and text encodings (hex, base64)." }
  hash: { def: "Hashing primitives." }
  helper: { def: "LabShelf Helper only: the native host that builds and serves writing projects. Never a generic helper." }
  import: { def: "Turning an input (PDF, identifier, URL, tab) into a paper." }
  latex: { def: "LaTeX-specific writing code: source scan, catalog, log, toolchain, biber." }
  library: { def: "The folder of papers on disk and everything that reads or writes it." }
  libraryUi: { def: "The library surface (list, sidebar, detail pane) a host mounts." }
  logging: { def: "Log format, logger, sinks." }
  model: { def: "Data types of one domain (<domain>/model)." }
  nativeHost: { def: "Registering a LabShelf program with the browsers for native messaging." }
  ports: { def: "Interfaces apps implement." }
  qmd: { def: "LabShelf Markdown items: notes, comments, discussion messages." }
  reader: { def: "The one PDF reader surface and its host contract; preview is a mode of it.", syn: [viewer, pdfViewer] }
  relay: { def: "The owner's Cloudflare Worker and its clients." }
  share: { def: "Sharing a folder of papers read-only through a link.", syn: [sharing] }
  spaces: { def: "Spaces: a personal grouping of papers, projects, dates and glossary." }
  templates: { def: "Template gallery: list, download, publish." }
  typst: { def: "Typst-specific writing code: language, compiler, source." }
  ui: { def: "The design system: tokens, components, icons." }
  writing: { def: "Writing projects: sources, builds, citations, checks." }
  activation: { def: "VS Code extension activation.", app: vscode }
  command: { def: "VS Code or CLI command registration.", app: vscode }
  background: { def: "Browser extension service worker.", app: browser }
  content: { def: "Browser extension content scripts.", app: browser }
  popup: { def: "Browser extension toolbar popup.", app: browser }
  options: { def: "Browser extension options page.", app: browser }
  capture: { def: "Browser tab capture.", app: browser }
  platform: { def: "Adapters for APIs only this app has.", app: browser }
  storage: { def: "The app's persistent storage (IndexedDB, globalState).", app: browser }
  assets: { def: "Static files bundled with the app.", app: browser }
  libraryPage: { def: "The browser library page.", app: browser }
  cli: { def: "Command-line entry.", app: terminal }
  screen: { def: "Terminal screen primitives and drawing.", app: terminal, syn: [tui] }

mechanism:
  verbs:
    create: { group: PURE, syn: [make, new, construct] }
    build: { group: PURE, def: "Only for writing builds (compile a project). Otherwise create." }
    parse: { group: PURE }
    serialize: { group: PURE, syn: [stringify] }
    encode: { group: PURE }
    decode: { group: PURE }
    format: { group: PURE, def: "Value to display text." }
    normalize: { group: PURE }
    derive: { group: PURE, syn: [compute] }
    merge: { group: PURE }
    compare: { group: PURE }
    split: { group: PURE }
    match: { group: PURE }
    count: { group: PURE }
    order: { group: PURE }
    escape: { group: PURE }
    describe: { group: PURE, def: "Object to a user-facing sentence." }
    extract: { group: PURE }
    with: { group: PURE, def: "Returns a copy with a change: with<Field>." }
    render: { group: PURE, def: "Build DOM or HTML without attaching it." }
    is: { group: PREDICATE }
    has: { group: PREDICATE }
    can: { group: PREDICATE }
    should: { group: PREDICATE }
    read: { group: READ, def: "From disk or a port.", syn: [get] }
    fetch: { group: READ, def: "Over the network." }
    find: { group: READ, syn: [locate, lookup] }
    list: { group: READ }
    resolve: { group: READ, def: "Reference to the thing it names." }
    search: { group: READ, def: "Run a user query." }
    scan: { group: READ, def: "Read papers/." }
    watch: { group: READ }
    detect: { group: READ }
    walk: { group: READ }
    load: { group: READ, def: "Code or heavy resource, lazily." }
    verify: { group: READ, def: "Only a signature or a hash." }
    write: { group: ACTION, syn: [save, persist] }
    update: { group: ACTION, syn: [edit, patch] }
    add: { group: ACTION }
    remove: { group: ACTION, syn: [delete] }
    move: { group: ACTION }
    copy: { group: ACTION }
    rename: { group: ACTION }
    import: { group: ACTION }
    export: { group: ACTION }
    download: { group: ACTION }
    upload: { group: ACTION }
    install: { group: ACTION }
    uninstall: { group: ACTION }
    register: { group: ACTION, def: "Register commands or providers with an app API." }
    mount: { group: ACTION, def: "Attach a UI to a DOM node and return its disposer." }
    show: { group: ACTION, syn: [reveal, display] }
    open: { group: ACTION }
    close: { group: ACTION }
    ask: { group: ACTION, syn: [prompt, confirm] }
    pick: { group: ACTION, syn: [select, choose] }
    run: { group: ACTION, def: "Until it finishes.", syn: [execute, exec] }
    start: { group: ACTION, def: "Long-running; pair with stop." }
    stop: { group: ACTION }
    send: { group: ACTION }
    connect: { group: ACTION }
    attach: { group: ACTION, syn: [wire, bind] }
    sync: { group: ACTION }
    check: { group: ACTION, def: "Returns a verdict.", syn: [validate] }
    assert: { group: ACTION, def: "Throws unless the condition holds." }
    ensure: { group: ACTION, def: "Create if missing.", syn: [require] }
    offer: { group: ACTION }
    serve: { group: ACTION }
    join: { group: ACTION }
    leave: { group: ACTION }
    sign: { group: ACTION }
    seal: { group: ACTION }
    reconcile: { group: ACTION }
    refresh: { group: ACTION }
    apply: { group: ACTION }
    report: { group: ACTION }
    draw: { group: ACTION, def: "Terminal or canvas.", syn: [paint] }
    set: { group: ACTION, def: "Replace one value." }
    publish: { group: ACTION, syn: [submit] }
    deploy: { group: ACTION }
    on: { group: EVENT, def: "Event handler: on<Event>." }
    answer: { group: EVENT, def: "Answer one protocol message." }
  # Layer A nouns: allowed anywhere, in folders, files and exports.
  nouns:
    file: { def: "A file on disk or in a project." }
    path: { def: "A file path." }
    text: { def: "Text." }
    bytes: { def: "Bytes." }
    error: { def: "A thrown error type." }
    log: { def: "A log." }
    logger: { def: "The ILogger implementation." }
    logSink: { def: "Where logs go.", syn: [sink] }
    logLine: { def: "One line of a log." }
    schema: { def: "A file schema." }
    extension: { def: "The browser or VS Code extension itself." }
    startup: { def: "App startup.", syn: [boot] }
    connection: { def: "A live link to a bridge, helper or share session.", syn: [socket] }
    config: { def: "The configuration file.", syn: [configuration] }
    globalConfig: { def: "Configuration shared by all apps." }
    prefs: { def: "UI memory a host keeps for a surface.", syn: [preferences] }
    setting: { def: "A value the user edits on a settings page." }
    layout: { def: "Arrangement on disk (libraryLayout, texLayout)." }
    dir: { def: "A disk directory that is not a library folder.", syn: [directory] }
    fileSystem: { def: "Reading and writing files.", syn: [fs, disk] }
    message: { def: "One message of a protocol or a thread." }
    line: { def: "One line of text." }
    bundle: { def: "The output of an app build." }
    app: { def: "A LabShelf application (browser extension, VS Code extension, terminal, Helper)." }
    browser: { def: "The web browser; also the name of the browser app. Not a tool." }
    map: { def: "An in-memory key-to-value lookup (a JS Map or a Yjs map). A search index is an index compound, not a map." }
  roles:
    host: "App-side implementation of a core surface or protocol."
    port: "An interface the caller implements."
    store: { def: "In-memory state that notifies subscribers.", syn: [persistence] }
    cache: "Persistent copy of derived data."
    registry: "A list of known things."
    client: "Talks to a remote service."
    channel: "A bidirectional message pipe."
    transport: "Carries bytes or frames for a channel."
    messages: "The message union of a protocol."
    handlers: { def: "The map that answers protocol messages.", syn: [messageHandler, dispatcher, router] }
    copy: "User-facing wording."
    command: "App command registration."
    provider: "VS Code provider class."
    protocol: "Folder holding a surface-host message protocol."
    service: "Facade over a domain an app calls."
    entry: "Process or bundle entry point."
    parser: "A stateful parser."
    adapter: "Wraps an API only one app has."
    binding: "Connects a shared document to its transport."
    engine: "Compiles or renders a language (Typst, LaTeX)."
  # A function name of one of these forms is accepted without a leading verb when every word of each side is a term of a kind in `sides`.
  namePatterns:
    conversion: { form: ["to<to>", "<from>To<to>"], def: "Converts a value of one named type into another.", sides: [subjects, nouns, formats, tools, compounds] }
  uiParts: [view, panel, tab, section, row, card, dialog, menu, tray, sidebar, header, footer, banner, form, button, toolbar, bar, popover, overlay, pane, frame, shell, screen, list, tree, grid, column, chrome, toast, picker, meter, badge, marks, mark, quickInput, extPage, offscreen, statusBar, widget, element, editor, editorArea, field, input, notice, layer, action, hover, window, focus, drop, drag]
  qualifiers: [shared, local, remote, live, stored, pending, missing, stale, open, current, own, system, managed, native, standalone, external, first, last, all, empty, private, public, published, verified, custom, optional, inline, direct, network, unscoped, lazy, sealed, max, min, raw, plain]
  connectors: [to, from, in, at, by, for, of, with, without, and, or, only, as, on, into]
  typeSuffixes: [options, deps, result, outcome, state, context, kind, event, change, request, reply, response, input, spec, id, error, like]

formats: [pdf, latex, tex, typst, bibtex, biber, synctex, yaml, json, html, css, markdown, qmd, doi, isbn, arxiv, svg, png, webp, url, mailto, http, oauth, pkce, utf8, base64, hex, sha256, ed25519, ics, ocr, wasm, ulid]

