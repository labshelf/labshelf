  thumbnail: { def: "A small image of page 1." }
  selection: { def: "What is selected in a list." }
  reference: { def: "A pointer to a paper or a project.", syn: [ref, paperReference] }
  project: { def: "A writing project." }
  projectFile: { def: "Any file of a project." }
  projectList: { def: "A list of projects." }
  externalProject: { def: "A project outside the library." }
  projectValue: { def: "A value from labshelf.yaml." }
  source: { def: "A project's source file as opposed to its built PDF." }
  importOrigin: { def: "Where an import came from." }
  citationOrigin: { def: "A place citations come from." }
