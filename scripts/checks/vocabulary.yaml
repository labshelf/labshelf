  readerSession: { def: "A reader session." }
  doc: { def: "A Yjs document." }
  docState: { def: "A Yjs document state." }
  editorDoc: { def: "A ProseMirror document." }
  textDocument: { def: "A VS Code text document." }
  readerHtml: { def: "The HTML a reader shows." }
