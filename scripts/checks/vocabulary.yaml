  paperFile: { def: "A file attached to a paper (PDF, supplement)." }
  folder: { def: "A library folder grouping papers. Any disk folder is a dir.", syn: [collection, category] }
  metadata: { def: "Bibliographic fields (title, authors, venue), on disk as metadata.yaml." }
  author: { def: "A paper's author." }
  venue: { def: "Where a paper appeared." }
  title: { def: "A paper's title." }
  year: { def: "A paper's year." }
  tag: { def: "A user label on a paper." }
  abstract: { def: "A paper's abstract.", syn: [summary] }
  annotation: { def: "A mark a user leaves on a PDF page." }
  highlight: { def: "A text annotation on a PDF. Editor highlights are decorations." }
  decoration: { def: "A highlight in the editor." }
  sidecar: { def: "Per-paper data next to the paper (reading position, annotations).", syn: [appdata, appData] }
  snapshot: { def: "An immutable in-memory copy of the library sent to the UI." }
  mutation: { def: "A library write operation (import, move, rename, trash, update)." }
  conflict: { def: "A sync conflict and its resolution." }
