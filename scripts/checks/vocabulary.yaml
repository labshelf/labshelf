# Layer D: volatile product features. A term may appear in a path only under one of its `home` globs (relative to packages/*/src; ** crosses folders).
features:
  space: { def: "A personal grouping of papers, projects, dates and glossary.", home: ["**/spaces/**"], words: [spaceDir, spaceFolder, spaceFiles, spaceList, spacePage] }
  spaceOverview: { def: "The overview of a Space.", home: ["**/spaces/**"] }
  researchChat: { def: "The research chat panel of a Space.", home: ["**/spaces/**"] }
  glossary: { def: "The glossary of a Space.", home: ["**/glossary/**", "**/spaces/**"] }
  readingStatus: { def: "Whether a paper is unread, being read or done.", home: ["library/readingStatus/**"], words: [unread] }
  details: { def: "The Details surface.", home: ["**/details/**", "detailsWebview/**"], syn: [detail], words: [detailsSelection] }
  allProjects: { def: "The All projects page.", home: ["**/allProjects/**"] }
  checklist: { def: "The user's list of open items for a project.", home: ["**/checklist/**"] }
  readingList: { def: "A project's reading list.", home: ["**/readingList/**"] }
  gallery: { def: "The template gallery.", home: ["**/templates/**"] }
  citationMap: { def: "The graph of who cites whom around the library.", home: ["**/citationMap/**"], syn: [citationGraph] }
  tabRestore: { def: "Restoring the tabs of a session.", home: ["**/session/**"] }
  quotes: { def: "Quotes pulled from papers into a project.", home: ["**/quotes/**"] }
  syncGuide: { def: "The guide for putting the library in a sync tool.", home: ["**/syncGuide/**"] }
  submission: { def: "A venue and a deadline.", home: ["writing/project/**"] }
  setup: { def: "The Helper setup flow.", home: ["**/helper/setup/**"] }
  copyRequest: { def: "Asking an author for a copy.", home: ["**/copyRequest/**"], syn: [requestCopy, askAuthor] }

# Layer E: libraries and products. Allowed in file and export names, never as a folder.
tools: [pdfjs, prosemirror, tesseract, cloudflare, github, crossref, openalex, pubmed, pmc, semanticScholar, googleScholar, unpaywall, datacite, latexmk, openPgp, vscode, idb, kv, canvas, undoManager]

# Names an external API requires, so they cannot be renamed: exempt from the export rules, only in the listed files (globs).
external:
  - { name: activate, files: ["packages/vscode/src/extension.ts"] }
  - { name: deactivate, files: ["packages/vscode/src/extension.ts"] }
  - { name: fetch, files: ["packages/core/src/relay/worker/index.ts"] }

# A bare word with a banned or ambiguous sense: allowed only inside one of `use`; `instead` names what the other senses became.
# `suffix: true`: the word is also valid right after a term, as <term><Word> (projectId, rowKey, TaskStatus); the bare word stays rejected.
compoundOnly:
  root: { use: [libraryRoot, buildRoot], instead: [spaceDir, projectDir] }
  link: { use: [paperLink, shareLink, linkKey], instead: [invite, connection, synctex] }
  record: { use: [paperRecord, writeRecord], instead: [docLogEntry] }
  status: { use: [], instead: [buildState], suffix: true }
  manifest: { use: [shareManifest, templateManifest, hostManifest, extensionManifest, releaseManifest] }
  blob: { use: [shareBlob] }
  key: { use: [citeKey, shareKey, linkKey, docKey, libraryKey], instead: [shortcut, keymap], suffix: true }
  id: { use: [paperId], suffix: true }
  state: { use: [buildState, deviceState], instead: [readingPosition] }
  options: { use: [optionsPage], suffix: true }
  index: { use: [shareIndexDoc, catalogIndex, searchIndex, embeddingIndex, vectorIndex], instead: [lineOffsets, synctexMap] }

banned:
  data: name what the data is
  info: name what the info is
  util: name the domain it serves
  utils: name the domain it serves
  helpers: name the domain it serves
  misc: name the domain it serves
  common: name the domain it serves
  manager: use a store, host or registry
  handle: use on<Event> or answer<Message>
  process: name what the process does
  main: use an Entry or buildRoot
  logic: runtime-neutral code is the default; drop the folder
  value: only projectValue
  result: only as a type suffix
  types: put types next to the code that uses them
  stuff: name what it is
  thing: name what it is
  review: use quotes or history
  target: use submission, dropZone, detailsSelection or citeLocation
  context: only as a type suffix; for wiring use compositionRoot
