  externalChange: { def: "A change to the library folder made outside this app." }
  syncFolder: { def: "A folder kept in step by a sync app." }
  device: { def: "This computer, for per-device state." }
  deviceLocal: { def: "Stored per device." }
  textLayer: { def: "A PDF's text layer and its verdict.", syn: [searchable, noText] }
  query: { def: "A search query in the query language." }
  search: { def: "Searching papers or project text." }
  filter: { def: "A list filter." }
  sort: { def: "A list order." }
  trash: { def: "Where removed papers go." }
  libraryLocation: { def: "Where the library is stored.", syn: [librarySource, location] }
  libraryRoot: { def: "The disk root of a library." }
  identifier: { def: "An external id of a work (DOI, arXiv, ISBN, PMID)." }
  landing: { def: "A publisher's landing page.", syn: [landingPage] }
  pdfFinder: { def: "Finding and downloading a work's PDF.", syn: [pdfFinding] }
  resolver: { def: "One PDF-finder strategy." }
  pdfStage: { def: "Preprint, accepted or published." }
  publisher: { def: "A paper's publisher." }
  page: { def: "A PDF page. App pages are <x>Page." }
