# Deploys labshelf.org (the website Worker and its static assets) when the website, or the core package its demos bundle, changes on main.
# Secrets: CLOUDFLARE_API_TOKEN (Edit Cloudflare Workers template, scoped to the LabShelf account and the labshelf.org zone), CLOUDFLARE_ACCOUNT_ID.
# D1 migrations are not applied here; documents/contracts/directory.md#deploy.
name: Website deploy

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/website-deploy.yml"
  workflow_dispatch:

permissions: {}

# A newer push waits for the running deploy instead of cancelling it half way through an asset upload.
concurrency:
  group: website-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `build.command` in wrangler.jsonc runs `pnpm run build` first, so dist/ is always published.
      - name: Deploy
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
